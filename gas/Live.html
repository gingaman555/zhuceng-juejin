<script>
/* ============================================================
   逐層掘進 · 實際使用版整合層
   ------------------------------------------------------------
   原型的畫面與行為（Template / Logic）維持原樣不動，這一層負責：
     · 真實註冊與登入（自建帳號密碼）
     · 把畫面接到後端真實資料（多班、多組同時運作）
     · 學期週次依真實日期自動計算，老師可用「＋1 週」手動覆寫
     · 原型工具列（切端／切裝置／＋1週／全開／重置）只在
       研究者端 R-00 開啟「演練模式」時出現
   ============================================================ */
(function () {
  'use strict';

  var HAS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);
  /* Firebase 版：build 時把 Cloud Functions 的網址塞進 window.JLZ_API。
     那一行在頁尾才跑，所以要呼叫的當下才讀，不能在載入時就抓。 */
  function apiUrl() { return (typeof window !== 'undefined' && window.JLZ_API) || ''; }
  var TOKEN_KEY = 'jlz.token';

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    /* 演練模式完全不碰真實資料：所有寫入當成功、所有讀取回空 */

    /* Firebase：一支 HTTPS Function 依名稱分派，回傳格式跟 GAS 版一模一樣 */
    var url = apiUrl();
    if (url) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api: fn, args: args })
      }).then(function (r) {
        if (!r.ok) throw new Error('伺服器沒有回應（' + r.status + '）。');
        return r.json();
      });
    }
    return new Promise(function (resolve, reject) {
      if (!HAS_GAS) { reject(new Error('本機預覽沒有後端；請部署到 Google Apps Script 後使用。')); return; }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  var LIVE = window.LIVE = { token: null, user: null, snapshot: null, protoKlasses: null, pollTimer: null };

  /* ================= 方法覆寫 ================= */

  var P, ORIG;

  function installOverrides() {
    P = Component.prototype;
    ORIG = {
      mkTasks: P.mkTasks, teams: P.teams, courseStart: P.courseStart,
      research: P.research, itemProgress: P.itemProgress, renderVals: P.renderVals,
      myTasks: P.myTasks
    };

    /* 原型把班級寫死成 'wed'；實際使用版的任務已經是自己班的，只按層過濾 */
    P.myTasks = function () {
      var lay = this.state.currentLayer;
      return (this.state.tasks || []).filter(function (t) { return t.layer === lay; });
    };

    /* 甘特圖整頁拿掉：有人（或稽核）直接 go('GANTT') 就轉去任務清單。
       這件事一定要攔在 go 這一層——攔在算畫面的地方會變成
       setState → 重算 → setState 的無窮迴圈。 */
    ORIG.go = P.go;
    P.go = function (screen) {
      return ORIG.go.call(this, screen === 'GANTT' ? 'S02' : screen);
    };

    /* 期限週次不再夾在 6；學期長度由班級設定 */
    ORIG.dueWeek = P.dueWeek;
    P.dueWeek = function (t) {
      /* 期限可能是字串「第 3 週 · 9/28（週五）」，也可能是純數字 3 */
      var raw = t && t.due;
      if (typeof raw === 'number') return raw > 0 ? Math.max(1, Math.min(156, raw)) : 0;
      var s = String(raw || '');
      if (s === '不設限') return 0;
      if (/^\d+$/.test(s.trim())) { var nn = +s.trim(); return nn > 0 ? Math.max(1, Math.min(156, nn)) : 0; }
      var m = /第\s*(\d+)\s*週/.exec(s);
      if (m) return Math.max(1, Math.min(156, +m[1]));
      var d = /(\d+)\/(\d+)/.exec(s);
      if (d) {
        var start = this.courseStart();
        var y = start.getFullYear() + (+d[1] < start.getMonth() + 1 ? 1 : 0);
        var days = Math.floor((new Date(y, +d[1] - 1, +d[2]) - start) / 86400000);
        return Math.max(1, Math.floor(days / 7) + 1);
      }
      return 0;
    };

    /* 排程可能是區間物件；比對用的是他們打算交出去的那一週 */
    ORIG.planWeek = P.planWeek;
    P.planWeek = function (t) {
      var p = (this.state.plan || {})[t.id];
      if (p == null) return this.dueWeek(t) || 1;
      if (typeof p === 'number') return p;
      return Number(p.b) || Number(p.a) || 1;
    };

    /* 真實使用時任務全部來自後端，不用原型的示範清單 */
    P.mkTasks = function () { return []; };   /* 實際使用版沒有假任務 */

    P.courseStart = function () {
      if (!this.state) return ORIG.courseStart.call(this);
      var k = this.KLASSES[this.state.klass] || this.KLASSES[0];
      var m = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String((k && k.courseStart) || ''));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : ORIG.courseStart.call(this);
    };

    /* 學生看自己班；老師看目前切到的那一班 */
    P.teams = function () {
      var k = this.KLASSES[this.state.klass] || this.KLASSES[0] || { teams: [] };
      var S = this.state, ts = S.teamState || {};
      return (k.teams || []).map(function (t) {
        return Object.assign({}, t, ts[t.id] || {},
          t.me ? { weeks: S.stayWeeks || 1, layer: S.currentLayer, passed: S.passed } : {});
      });
    };

    /* 每一項在全班的即時分布——用各組真實狀態算 */
    P.itemProgress = function (t) {
      var S = this.state, teams = this.teams(), passed = 0, wait = 0, doing = 0, none = 0;
      teams.forEach(function (tm) {
        var list = (S.teamTasks || {})[tm.id];
        if (!list && tm.me) list = S.tasks;
        var f = list ? list.filter(function (x) { return x.id === t.id; })[0] : null;
        var st = f ? f.status : null;
        if (st === 'passed') { passed++; return; }
        if (st === 'submitted') { wait++; return; }
        if (st === 'needs_more' || (f && (f.text || (f.files && f.files.length)))) { doing++; return; }
        if ((tm.layer || 1) > t.layer) { passed++; return; }
        none++;
      });
      var parts = [];
      if (passed) parts.push('已通過 ' + passed);
      if (wait) parts.push('待你確認 ' + wait);
      if (doing) parts.push('進行中 ' + doing);
      if (none) parts.push('未開始 ' + none);
      return { text: parts.join(' · ') + '（共 ' + teams.length + ' 組）', live: passed + wait + doing };
    };

    /* 研究者端：非演練模式一律吃後端切片（延遲揭露已在後端做掉） */
    P.research = function () {
      var S = this.state;

      var d = S.resSlice || { unlockedThrough: 0, nextUnlock: 4, week: S.courseWeek || 1, locked: true,
                              subLog: [], revLog: [], readLog: [], teams: [], assigned: 0 };
      var revs = d.revLog || [], subs = d.subLog || [], reads = d.readLog || [];
      var teams = d.teams || [];
      var withReason = revs.filter(function (r) { return r.hasReason; });
      var noReason = revs.filter(function (r) { return !r.hasReason; });
      return {
        unlockedThrough: d.unlockedThrough, nextUnlock: d.nextUnlock, locked: !!d.locked,
        week: d.week, revs: revs, subs: subs, reads: reads, teams: teams,
        groups: teams.length, assigned: d.assigned || 0,
        reviews: revs.length, reasons: withReason.length, noReason: noReason.length,
        noReasonPct: revs.length ? Math.round(noReason.length / revs.length * 100) : 0,
        avgLen: withReason.length ? Math.round(withReason.reduce(function (a, r) { return a + r.len; }, 0) / withReason.length) : 0,
        avgStay: teams.length ? (teams.reduce(function (a, t) { return a + (t.weeks || 1); }, 0) / teams.length).toFixed(1) : '0',
        extPicked: d.extPicked || 0
      };
    };

    /* 演練模式的示範語料要跟現在的成品同一個結構：
       每一筆審核都接得回學生那一輪的提交與自評，R-01／R-02 才不會空一半。 */


    /* 原型只寫了第二層的抵達故事，其餘層會退回去播開頭那三頁。
       這裡用交付包裡每一層自己的文字補齊，不新增設定。 */
    ORIG.storyPages = P.storyPages;
    P.storyPages = function () {
      var S = this.state;
      if (S.role === 'teacher' && !S.previewStory) {
        var pages = ORIG.storyPages.call(this);
        var at = 0;
        pages.forEach(function (pg, i) { if (String(pg.k || '').indexOf('作品的故事 · 二') === 0) at = i + 1; });
        if (at) pages = pages.slice(0, at).concat([{
          k: '作品的故事 · 三',
          t: '學生看到的是：路上有東西擋著',
          b: '在他們那一側，每一層的深處都站著一隻東西，長得就是那一層最難的那件事——第一層那隻沒有臉，因為他們還說不出自己要挖什麼。' +
             String.fromCharCode(10) + String.fromCharCode(10) +
             '要過去只有一條路：跟你申請。你覺得他們這一層做到可以往下了，就點頭——礦石才鑄得成那一層的道具，那隻東西才會讓開。' +
             String.fromCharCode(10) + String.fromCharCode(10) +
             '你這一側沒有任何額外的動作——你做的還是同一件事：讀他們交的，寫下你的判斷。那段字在他們那邊就是牠說的話。'
        }]).concat(pages.slice(at));
        return pages.map(function (pg) {
          if (pg.b && pg.b.indexOf('只影響工具校準到哪一階') >= 0) {
            pg.b = pg.b.split('不影響過關，只影響工具校準到哪一階。').join('不影響過關，做了就多一塊礦石進學生的圖鑑。');
          }
          return pg;
        });
      }
      var n = S.storyLayer || 1;
      /* 開頭那三頁沒講「路上有東西擋」跟「礦石可以換武器」——補在斗篷人之後 */
      if (n === 1) {
        return ORIG.storyPages.call(this).concat([
          { art: 'beast', k: '第一層 · 微光荒原', t: '而且路上不是空的',
            b: '每一層的深處都蹲著一隻東西。牠不追你、也不咬人，就只是站在往下的那條路上。但除非得到道具，不然牠就會一直擋在前方的道路上。' },
          { art: 'trade', k: '第一層 · 微光荒原', t: '斗篷人手上有能打倒牠的東西',
            b: '他不會把武器直接給你。他要的是礦石——這一層的每一塊，一塊都不能少。' +
               String.fromCharCode(10) + String.fromCharCode(10) +
               '覺得這一層告一段落了就去找他，跟他說你走過哪裡、你們變成什麼樣子、接下來要做什麼。他點頭，礦石才會在他手裡鑄成這一層的道具。' +
               String.fromCharCode(10) + String.fromCharCode(10) +
               '拿著它回去，那隻東西就會讓開。',
            q: '所以順序是：跟他提出申請 → 他覺得可以往下了 → 換到武器 → 過去。' }
        ]);
      }
      if (n === 2) return ORIG.storyPages.call(this);   /* 第二層原型自己有 */
      var l = this.LAYERS[n - 1], prev = this.LAYERS[n - 2];
      if (!l) return ORIG.storyPages.call(this);
      return [
        { k: '第' + ['一', '二', '三', '四', '五'][n - 1] + '層 · 抵達', t: l.name, b: l.scene + '\n\n' + l.sub },
        { k: '第' + ['一', '二', '三', '四', '五'][n - 1] + '層 · 難處', b: l.hard, q: l.course },
        { k: '第' + ['一', '二', '三', '四', '五'][n - 1] + '層 · 這一層會發生的事',
          t: prev ? '手上有' + prev.tool + '了' : '',
          cards: [
            { a: l.hard, b: prev ? prev.tool : '—', c: prev ? prev.toolAbility : '—' },
            { a: '不確定做到什麼程度算完成', b: '每一項的通過條件', c: '對照他寫的條件，不是對照別組' },
            { a: '不知道什麼時候可以送關卡', b: '這一層的清單', c: '老師開了清單就送得出去，過不過他決定' }
          ] }
      ];
    };

    /* 原型自己丟的 toast 也會提到已經拿掉的機制——同一份對照表洗一次 */
    var ORIGSAY = P.say;
    P.say = function (msg) { return ORIGSAY.call(this, fixCal(msg)); };

    P.renderVals = function () {
      var v = ORIG.renderVals.call(this);
      try { return decorate(this, v); }
      catch (e) { console.error('整合層失敗：', e); return v; }
    };
  }

  /* 外殼：學生／老師是像素風滿版，研究者是儀器風滿版 */
  var SHELL_LIVE = "height:100vh;height:100dvh;overflow:hidden;background:#0B0A09;font-family:'C11';color:#E8E2D6;padding:0;";
  var SHELL_RES  = "height:100vh;height:100dvh;overflow:hidden;background:#0A0E12;font-family:'Noto Sans TC',sans-serif;color:#DFE6EB;padding:0;";

  /* ================= 狀態同步 ================= */

  function LAYERNAME(n) { return (App.logic.LAYERS[(n || 1) - 1] || {}).name || ''; }

  function applyBootstrap(b) {
    var L = App.logic, S0 = L.state, u = b.user;
    LIVE.user = u;
    if (u.role === 'teacher') L.TEACHER = u.name;

    var byClass = {};
    (b.teams || []).forEach(function (t) { (byClass[t.classId] = byClass[t.classId] || []).push(t); });

    L.KLASSES = (b.classes || []).map(function (k) {
      return {
        id: k.id, name: k.name, term: k.term || '', started: k.started, sandbox: !!k.sandbox,
        joinCode: k.joinCode, courseStart: k.courseStart, courseWeek: k.courseWeek,
        weekOverride: k.weekOverride,
        teams: (byClass[k.id] || []).map(function (t) {
          return { id: t.id, name: t.name, layer: t.layer, weeks: t.weeks, passed: t.passed,
                   got: t.got || null,
                   me: u.role === 'student' && t.id === u.teamId };
        })
      };
    });
    if (!L.KLASSES.length) {
      L.KLASSES = [{ id: b.classId || 'k0', name: '（尚未建立班級）', term: '', started: false, teams: [] }];
    }
    var idx = 0;
    L.KLASSES.forEach(function (k, i) { if (k.id === b.classId) idx = i; });

    var next = {
      signedIn: true, role: u.role, klass: idx,
      courseWeek: b.courseWeek, weeksHere: b.courseWeek, joinCode: b.joinCode || '',
      teamState: {}, otherSubs: [], teamTasks: b.teamTasks || {}, gates: b.gates || [],
      authError: '', busy: false
    };
    next.minNames = b.minNames || {};              /* 這一組的拆分名稱（學生） */
    if (b.minNamesByTeam) next.minNamesByTeam = b.minNamesByTeam;   /* 每一組一份（老師） */
    (b.teams || []).forEach(function (t) {
      next.teamState[t.id] = { layer: t.layer, weeks: t.weeks, passed: t.passed, got: t.got || null };
    });

    if (u.role === 'student') {
      next.tasks = b.tasks || [];
      next.plan = b.plan || {};
      next.passedWeek = b.passedWeek || {};
      next.record = b.record || [];
      next.layerSaid = b.layerSaid || {};
      next.digs = b.digs || [];
      next.digPages = b.digPages || [];
      next.digTotal = b.digTotal || 24;
      var mt = b.myTeam;
      if (mt) {
        next.currentLayer = mt.layer; next.passed = mt.passed || [];
        next.toolLevels = mt.toolLevels || {}; next.stayWeeks = mt.weeks;
        next.specNames = mt.specNames || {};
        /* 學生正在 SUB 打字時不要蓋掉三格草稿 */
        if (!(S0.screen === 'SUB' && !mt.gateSubmitted)) {
          next.gateText = mt.gateText || ['', '', ''];
          next.gateSubmitted = !!mt.gateSubmitted;
        }
        /* 只有換層時才移動地圖焦點 */
        if (S0.currentLayer !== mt.layer || !S0.signedIn) {
          next.expanded = mt.layer; next.editLayer = mt.layer; next.storyLayer = mt.layer;
        }
      }
      next.marks = (b.publicPasses || []).map(function (p) {
        return { id: p.teamId, layer: LAYERNAME(p.layer), cells: p.cells || ['', '', ''],
                 verdict: p.reason || '', teaser: (p.cells || [''])[0] || '', files: [] };
      });
      /* 各組的歷程：用真實的通過紀錄，不再是原型那句寫死的「W1 進入微光荒原」 */
      var passWeek = {};
      (b.publicPasses || []).forEach(function (p) {
        passWeek[p.teamId + ':' + p.layer] = p.week;
      });
      L.LOGS = {};
      /* passed 正常是陣列。萬一哪一列壞了（型別不對），這裡不設防的話，
         整個登入會炸在一句看不懂的錯誤上，而且是全班一起。 */
      var passList = function (x) {
        if (Array.isArray(x)) return x;
        if (typeof x === "string") {
          try { var a = JSON.parse(x); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        return [];
      };
      (b.teams || []).forEach(function (t) {
        var log = [];
        passList(t.passed).slice().sort(function (x, y) { return x - y; }).forEach(function (n) {
          var w = passWeek[t.id + ':' + n];
          log.push([w ? 'W' + w : '—', '通過' + LAYERNAME(n) + '，進入' + LAYERNAME(Math.min(5, n + 1))]);
        });
        if (!log.length) log.push(['W' + (t.enteredWeek || 1), '進入' + LAYERNAME(t.layer || 1) + '，還沒通過關卡']);
        else log.push(['W' + (t.enteredWeek || 1), '目前在' + LAYERNAME(t.layer || 1) + '，停留 ' + (t.weeks || 1) + ' 週']);
        L.LOGS[t.id] = log;
      });

      /* 層數比上次看到的高：老師剛審過關卡——播發道具動畫 */
      if (mt) {
        var seen = load('jlz.layer.' + u.userId);
        if (seen && Number(seen) < mt.layer && !S0.reward) {
          var prevL = L.LAYERS[mt.layer - 2];
          if (prevL) next.reward = { tool: prevL.tool, treasure: prevL.treasure, level: '' };
        }
        store('jlz.layer.' + u.userId, String(mt.layer));
      }
    }

    if (u.role === 'teacher') {
      next.tasks = (b.taskDefs || []).map(function (d) {
        return Object.assign({}, d, { status: 'todo', text: '', files: [], fb: '', fbType: '', over: false });
      });
      next.otherSubs = (b.queue || []).map(function (q) {
        return { id: q.id, klass: b.classId, team: q.teamName, teamId: q.teamId, taskId: q.taskId,
                 title: q.title, layer: q.layer, tag: 'L' + q.layer,
                 cond: q.cond, due: q.due, over: q.over, text: q.text, files: q.files || [],
                 mineral: q.mineral || '', spec: q.spec || '',
                 effort: q.effort || '', effortNote: q.effortNote || '', blocker: q.blocker || '' };
      });
      next.finOpened = !!(b.myTeam && b.myTeam.finaleOpened);
      /* 老師在我們沒看的時候動過了——把變化演出來 */
      (function () {
        if (u.role !== 'student' || !S0.signedIn) return;
        var hit = detectMoments(L, S0.tasks || [], next.tasks || []);
        if (!hit) return;
        var t = hit.task;
        if (hit.kind === 'needfix') {
          next.moment = {
            kind: 'needfix', accent: '#D9603F',
            kicker: 'SENT BACK',
            title: '他把「' + t.title + '」退回來了',
            lede: '不是懲罰。他寫了為什麼——照那一段改，重交次數不限。',
            sprite: null,
            rows: [
              { k: '這一項', v: t.title },
              { k: '交過幾次', v: ((t.rounds || []).length + 1) + ' 次', hi: true },
              { k: '重交次數', v: '不限' }
            ],
            quoteLabel: '他寫的', quote: t.fb || '',
            lines: ['前面幾次跟他每一次的理由都留著。改完再交，他會看到你動了哪裡。'],
            btn: '知道了', go: function () {}
          };
        } else {
          var after2 = (next.tasks || []).filter(function (x) { return x.layer === (next.currentLayer || 1); });
          var got2 = after2.filter(function (x) { return x.status === 'passed'; }).length;
          var veinN2 = (L.MINS || []).filter(function (x) { return x.L === (next.currentLayer || 1); }).length;
          var minDef = (L.MINS || []).filter(function (x) { return x.name === t.mineral; })[0] || {};
          var full = veinN2 > 0 && got2 >= veinN2;
          next.moment = {
            kind: full ? 'full' : 'mined', accent: '#E9B341',
            kicker: full ? 'LAYER COMPLETE' : 'MINERAL SECURED',
            title: full ? '這一層採齊了' : '採到「' + (t.mineral || '一塊礦石') + '」',
            lede: full

  function refresh(force) {
    if (!LIVE.token) return Promise.resolve();
    /* 先問一聲有沒有動過。沒動就不抓整包——一個班同時掛著輪詢也不會把配額吃光 */
    var pre = force ? Promise.resolve(true) : call('apiPing', LIVE.token).then(function (p) {
      if (!p || !p.ok || !p.rev) return true;              /* 舊後端沒這支：照舊 */
      if (p.rev === LIVE.lastRev) return false;
      return p.rev;   /* 抓完才記住，抓失敗下一輪會再抓 */
    }).catch(function () { return true; });
    return pre.then(function (go) {
      if (!go) return;
    return call('apiBootstrap', LIVE.token).then(function (r) {
      if (typeof go === 'string') LIVE.lastRev = go;
      if (!r || !r.ok) return;

      applyBootstrap(r);
      /* 有人動過資料，老師首頁那塊鏡子就得重算 */
      if (r.user && r.user.role === 'teacher') App.logic.setState({ mirrorData: null });
      if (r.user.role === 'researcher') return loadSlice();
    }).catch(function () {});
    });
  }

  function loadSlice() {
    return call('apiResearchSlice', LIVE.token).then(function (r) {
      if (!r || !r.ok) return;
      var L = App.logic;
      L.KLASSES = [{ id: 'res', name: '研究資料', term: '', started: true,
                     teams: (r.teams || []).map(function (t) {
                       return { id: t.id, name: t.name, layer: t.layer, weeks: t.weeks, passed: t.passed };
                     }) }];
      L.setState({ resSlice: r, codes: r.codes || {}, courseWeek: r.week, weeksHere: r.week, klass: 0 });
    }).catch(function () {});
  }

  function fail(r) {
    App.logic.setState({ authError: (r && r.error) || '連線失敗，請再試一次。', busy: false });
  }

  function afterSignIn(r, remember, isResume) {
    LIVE.token = r.token;
    store(TOKEN_KEY, remember ? r.token : null);
    return call('apiBootstrap', r.token).then(function (b) {
      if (!b || !b.ok) { fail(b); return; }
      applyBootstrap(b);
      var u = b.user;
      if (u.role === 'student' && !u.teamId) {
        App.logic.setState({ screen: 'C04', role: 'student', busy: false, authError: '' });
        return loadIdentity();
      }
      if (u.role === 'researcher') {
        App.logic.setState({ screen: 'R00', role: 'researcher', busy: false, authError: '' });
        return loadSlice();
      }
      if (isResume) {
        /* 續前次登入：直接回首頁，不重播故事 */
        App.logic.setState({ screen: u.role === 'student' ? 'S01' : 'T01', busy: false, authError: '' });
        return;
      }
      App.logic.setState({
        screen: 'STORY', storyIdx: 0, storyLayer: App.logic.state.currentLayer || 1,
        storyFrom: u.role === 'student' ? 'S01' : 'T01', busy: false, authError: ''
      });
    });

    v.regSubmitStyle = "width:100%;margin-top:20px;font:500 22px/1 'C11';letter-spacing:.2em;text-indent:.2em;color:#0B0A09;background:" +
      (busy ? '#8A7333' : '#E9B341') + ';border:none;padding:15px;cursor:' + (busy ? 'wait' : 'pointer') +
      ';clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)';

      if (String(r.account || '').trim().length < 3) { L.setState({ authError: '帳號至少 3 個字。' }); return; }
      if (String(r.password || '').length < 4) { L.setState({ authError: '密碼至少 4 個字。' }); return; }
      if (r.password !== r.password2) { L.setState({ authError: '兩次輸入的密碼不一樣。' }); return; }
      if (rr === 'student' && !String(r.joinCode || '').trim()) { L.setState({ authError: '請填班級邀請碼。' }); return; }

      L.setState({ busy: true, authError: '' });
      call('apiRegister', Object.assign({ role: rr, remember: true }, r))
        .then(function (res) {
          if (!res || !res.ok) { fail(res); return; }
          L.setState({ reg: {}, acct: r.account, pw: '' });
          return afterSignIn(res, true);
        })
        .catch(function (e) { L.setState({ authError: e.message || '連線失敗。', busy: false }); });
    };

    /* --- C-04：名單建好就選自己是誰；沒名單才自己建隊 --- */
    var idl = S.identityList || null;
    var hasRoster = !!(idl && idl.length);
    v.hasIdentityList = S.screen === 'C04' && hasRoster;
    v.showTeamMaker = !hasRoster;
    v.c04Kicker = hasRoster ? 'C-04 · WHO ARE YOU' : 'C-04 · NEW TEAM';
    v.c04Title = hasRoster ? '你是誰？' : '建立你的小隊';
    v.c04Hint = hasRoster
      ? '在名單裡點自己的名字，就會進到你那一組。'
      : '你們班還沒有名單，自己開一支小隊或加入班上已經有的。';
    v.identityTeams = (idl || []).map(function (g) {
      var left = g.members.filter(function (m) { return !m.claimed; }).length;
      return {
        teamName: g.teamName,
        meta: left ? '還有 ' + left + ' 個名字沒人認領' : '這一組都認領完了',
        members: g.members.map(function (m) {
          return {
            label: m.claimed ? m.name + '（已認領）' : m.name,
            style: 'padding:11px 15px;font:500 22px/1 \'C11\';white-space:nowrap;cursor:' +
              (m.claimed ? 'not-allowed' : 'pointer') + ';background:' +
              (m.claimed ? 'transparent' : 'rgba(233,179,65,.07)') + ';border:1px ' +
              (m.claimed ? 'dashed #2A241E' : 'solid #5A4A2C') + ';color:' + (m.claimed ? '#4A443C' : '#E9B341'),
            pick: function () {
              if (m.claimed) { L.say('「' + m.name + '」已經有人認領了。如果那是你，找研究者放掉再選一次。'); return; }
              if (L.state.busy) return;
              L.setState({ busy: true, authError: '' });
              call('apiClaimIdentity', LIVE.token, m.rosterId)
                .then(function (r) {
                  if (!r || !r.ok) { fail(r); loadIdentity(); return; }
                  return refresh().then(function () {
                    L.setState({ busy: false, identityList: null, screen: 'STORY',
                                 storyIdx: 0, storyLayer: 1, storyFrom: 'S01' });
                    L.say('好了，' + r.name + '。');
                  });
                })
                .catch(function (e) { L.setState({ authError: e.message, busy: false }); });
            }
          };
        })
      };
    });

    var joinable = S.joinable || [];
    v.hasJoinable = S.screen === 'C04' && !hasRoster && joinable.length > 0;
    v.joinableTeams = joinable.map(function (t) {
      return {
        name: t.name,
        members: (t.members && t.members.length) ? '組員：' + t.members.join('、') : '還沒有人填組員',
        join: function () {
          if (L.state.busy) return;
          L.setState({ busy: true, authError: '' });
          call('apiJoinTeam', LIVE.token, t.teamId)
            .then(function (r) {
              if (!r || !r.ok) { fail(r); return; }
              return refresh().then(function () {
                L.setState({ busy: false, screen: 'STORY', storyIdx: 0, storyLayer: 1, storyFrom: 'S01' });
              });
            })
            .catch(function (e) { L.setState({ authError: e.message, busy: false }); });
        }
      };
    });
    v.finishTeam = function () {
      var st = L.state;
      if (st.busy) return;
      if (!String(st.teamName || '').trim()) { L.setState({ authError: '請填小隊名稱。' }); return; }
      L.setState({ busy: true, authError: '' });
      call('apiCreateTeam', LIVE.token, st.teamName)
        .then(function (r) {
          if (!r || !r.ok) { fail(r); return; }
          return refresh().then(function () {
            L.setState({ busy: false, screen: 'STORY', storyIdx: 0, storyLayer: 1, storyFrom: 'S01' });
          });
        })
        .catch(function (e) { L.setState({ authError: e.message, busy: false }); });
    };
  }

  /* ---------- 證據上傳 ---------- */

  var KIND_META = {
    image: { label: '截圖', accept: 'image/*', glyph: 'polygon(0 0,100% 0,100% 100%,0 100%)' },
    doc:   { label: '文件', accept: '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.key,.pages,.numbers' },
    video: { label: '影片', accept: 'video/*' },
    link:  { label: '連結', accept: '' }
  };

  function fmtSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function pickFile(kind, onDone) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = KIND_META[kind].accept;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (f) onDone(f);
    });
    inp.click();
  }

  function uploadFile(L, file) {
    if (file.size > 10 * 1024 * 1024) {
      L.say('單檔上限 10 MB。影片建議放雲端硬碟或 YouTube，再用「連結」附上來。');
      return;
    }
    L.setState({ uploading: true, uploadName: file.name });
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1] || '';
      call('apiUploadFile', LIVE.token, L.state.openTaskId, file.name, file.type || 'application/octet-stream', b64)
        .then(function (r) {
          L.setState({ uploading: false, uploadName: '' });
          if (!r || !r.ok) { L.say((r && r.error) || '上傳失敗，請再試一次。'); return; }
          L.setState({ draftFiles: (L.state.draftFiles || []).concat([r.file]) });
          L.say('「' + r.file.name + '」上傳好了。');
        })
        .catch(function () { L.setState({ uploading: false, uploadName: '' }); L.say('上傳失敗，請再試一次。'); });
    };
    reader.onerror = function () { L.setState({ uploading: false, uploadName: '' }); L.say('讀不到這個檔案。'); };
    reader.readAsDataURL(file);
  }

  function openFile(L, f) {
    if (!f) return;
    if (f.kind === 'link') { window.open(f.url, '_blank', 'noopener'); return; }
    L.say('開啟「' + f.name + '」…');
    call('apiGetFile', LIVE.token, f.id).then(function (r) {
      if (!r || !r.ok) { L.say((r && r.error) || '開不起來。'); return; }
      var bin = atob(r.dataUrl.split(',')[1]);
      var buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([buf], { type: r.mimeType }));
      var w = window.open(url, '_blank', 'noopener');
      if (!w) {
        var a = document.createElement('a');
        a.href = url; a.download = r.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function () { L.say('開不起來。'); });
  }

  function fileIcon(kind, size) {
    var col = kind === 'image' ? '#8FE4F0' : kind === 'video' ? '#F2A03C' : kind === 'link' ? '#E9B341' : '#C3BAAA';
    var clip = kind === 'image' ? 'polygon(0 0,100% 0,100% 100%,0 100%)'
             : kind === 'video' ? 'polygon(0 0,100% 50%,0 100%)'
             : kind === 'link' ? 'polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%)'
             : 'polygon(0 0,72% 0,100% 26%,100% 100%,0 100%)';
    return 'display:block;width:' + (size || 16) + 'px;height:' + (size || 16) + 'px;flex:none;background:' + col + ';opacity:.7;clip-path:' + clip;
  }

  /* ---------- 學生 ---------- */

  function decorateStudent(L, v) {
    var S = L.state;

    /* --- 這一組現在的狀態：送出前的自我判斷，老師會先看到 --- */
    var EFFORT = [
      ['fast',  '比預估快',   '#E9B341'],
      ['onpar', '跟預估差不多', '#C3BAAA'],
      ['slow',  '比預估慢',   '#D9603F']
    ];
    v.effortPicks = EFFORT.map(function (o) {
      var on = S.draftEffort === o[0];
      return {
        label: o[1],
        pick: function () { L.setState({ draftEffort: o[0] }); },
        style: "font:500 22px/1 'C11';padding:11px 15px;white-space:nowrap;cursor:pointer;background:" +
          (on ? 'rgba(233,179,65,.14)' : 'rgba(0,0,0,.26)') + ';border:1px solid ' +
          (on ? o[2] : '#2E2822') + ';color:' + (on ? o[2] : '#8A8073')
      };
    });
    v.reflectReqStyle = "font:600 11px/1 'C11';letter-spacing:.14em;padding:5px 9px;background:" +
      (S.draftEffort ? 'rgba(195,186,170,.12);color:#8A8073' : '#D9603F;color:#0B0A09');
    /* 只有比預估慢的才要交代原因——快跟差不多不用寫 */
    v.needEffortNote = S.draftEffort === 'slow';
    v.effortNoteLabel = '為什麼比預估慢（必填，一句話就好）';
    v.effortNote = S.draftEffortNote || '';
    v.setEffortNote = function (e) { L.setState({ draftEffortNote: e.target.value }); };
    v.blocker = S.draftBlocker || '';
    v.setBlocker = function (e) { L.setState({ draftBlocker: e.target.value }); };

    /* --- 重交：讓他知道自己在重交，而且是重寫不是改字 --- */
    var openT = (S.tasks || []).filter(function (t) { return t.id === S.openTaskId; })[0] || {};
    var hist = S.taskHistory || null;
    var rejected = hist ? hist.rejected : 0;
    var attempts = hist ? hist.attempts : 0;

    v.isRetry = openT.status === 'needs_more';
    v.retryTitle = '第 ' + (attempts + 1) + ' 次交';
    v.retryCount = rejected ? '這一項已經被退回 ' + rejected + ' 次' : '';
    v.retryHint = '這一頁是空的——他要看的是你「改過之後」的版本，不是同一份再送一次。' +
      '先讀他退回的理由，再重寫一遍。上一次交的內容留在下面的往返紀錄裡，需要的話可以帶進來改。';
    /* 作業不是交在這裡，這一顆是「我做完了，請他確認」 */
    v.submitBtnLabel = (v.isRetry || attempts)
      ? '改好了，第 ' + (attempts + 1) + ' 次請他確認'
      : '我做完了，請他確認';

    v.hasHistory = !!(hist && hist.rounds && hist.rounds.length);
    v.history = roundRows(L, hist && hist.rounds, true);
    v.historyNote = hist
      ? '交過 ' + attempts + ' 次' + (rejected ? '，被退回 ' + rejected + ' 次' : '') +
        '。這一段你跟他都看得到——退回不是懲罰，是把「你以為做完了」跟「他認為算完成」的距離標出來。'
      : '';
    var last = v.hasHistory ? hist.rounds[hist.rounds.length - 1] : null;
    v.canCopyPrev = !!(last && String(last.text || '').trim() && !String(S.draftText || '').trim());
    v.copyPrev = function () {
      if (!last) return;
      L.setState({ draftText: last.text, draftFiles: (last.files || []).slice() });
      L.say('帶進來了。記得照他的理由改，不要原封不動再送一次。');
    };

    /* --- 排程納入主流程：沒排過就先在這裡排 --- */
    (function () {
      var tid = S.openTaskId;
      var task = (S.tasks || []).filter(function (x) { return x.id === tid; })[0] || null;
      var pl = tid ? planOf(S, tid) : null;
      var kl2 = L.KLASSES[S.klass] || {};
      var N2 = Math.max(6, Math.min(156, Number(kl2.semesterWeeks) || 18));
      var now2 = S.courseWeek || 1;
      var due = task ? L.dueWeek(task) : 0;

      v.needPlan = !!tid && !pl;
      v.planAccent = pl ? '#E9B341' : '#D9603F';
      v.planBox = 'padding:15px 17px;background:' +
        (pl ? 'rgba(233,179,65,.06)' : 'rgba(217,96,63,.09)') +
        ';border:1px solid ' + (pl ? '#3A3026' : '#5A2E22');
      v.planLabel = pl
        ? (pl.a === pl.b ? 'W' + pl.b : 'W' + pl.a + '–W' + pl.b)
        : '還沒排';
      v.planNote = pl
        ? '你當初排在' + (pl.a === pl.b ? '第 ' + pl.b + ' 週' : '第 ' + pl.a + '–' + pl.b + ' 週') +
          '，現在是第 ' + now2 + ' 週。' +
          (pl.b < now2 ? '比你排的晚了 ' + (now2 - pl.b) + ' 週——交的時候在下面說一下為什麼。'
            : pl.b > now2 ? '比你排的早。' : '就是這一週。') +
          '　期末回顧會把這個對照攤開來給你看。'
        : '先說你打算哪一週交，才交得出去。估錯不會怎麼樣——重點是有估過，期末才對得出你估得準不準。';

      v.goGantt = function () { L.say('這一項要哪一週交，直接在上面點就好。'); };

      var picks = [];
      for (var w = now2; w <= Math.min(N2, now2 + 5); w++) picks.push(w);
      if (due && picks.indexOf(due) < 0) picks.push(due);
      picks.sort(function (a, b) { return a - b; });
      v.planPicks = picks.map(function (w) {
        var d = L.weekDate(w, 5);
        return {
          label: 'W' + w,
          sub: w === now2 ? '這一週' : (d ? (d.getMonth() + 1) + '/' + d.getDate() : '') + (due === w ? ' · 期限' : ''),
          subStyle: "display:block;font:400 11px/1 'C11';color:" + (due === w ? '#E9B341' : '#5F574C') + ';margin-top:5px',
          style: "padding:10px 13px;font:500 22px/1 'C11';cursor:pointer;text-align:center;background:rgba(0,0,0,.3);" +
            'border:1px solid ' + (due === w ? '#5A4A2C' : '#2E2822') + ';color:#C3BAAA',
          pick: function () {
            var st2 = L.state;
            var np = {}; Object.keys(st2.plan || {}).forEach(function (k) { np[k] = st2.plan[k]; });
            np[tid] = { a: w, b: w };
            L.setState({ plan: np });
            call('apiSavePlan', LIVE.token, tid, w, w).catch(function () {});
            L.say('排在第 ' + w + ' 週。送出之前都還可以改。');
          }
        };
      });
    })();

    var origSubmit = v.submitTask;
    v.submitTask = function () {
      var st = L.state;
      var taskId = st.openTaskId, text = st.draftText, files = (st.draftFiles || []).slice();
      if (!planOf(st, taskId)) { L.say('先在上面說你打算哪一週交。有估過，期末才對得出你估得準不準。'); return; }
      /* 作業交在老師原本收的地方，所以文字與檔案都是選填。
         真正必填的是「做了如何」——勾完成之前一定要回答。 */
      if (v.hasChecks && !v.checkAllDone) {
        L.say('清單還有 ' + v.checkLeft + ' 條沒勾。做完一條勾一條，全部勾完才請得動他。'); return;
      }
      if (!st.draftEffort) { L.say('勾完成之前先回答「這一組現在的狀態」——這一項實際花的力氣，跟你們原本估的差多少。'); return; }
      if (st.draftEffort === 'slow' && !String(st.draftEffortNote || '').trim()) {
        L.say('你們說比預估慢——寫一句為什麼。期末回顧時，這一句就是你們自己留下的線索。'); return;
      }
      if (st.uploading) { L.say('還有檔案在上傳，等一下再送。'); return; }
      var reflect = { effort: st.draftEffort, effortNote: st.draftEffortNote || '', blocker: st.draftBlocker || '' };
      origSubmit();
      L.setState({ draftEffort: '', draftEffortNote: '', draftBlocker: '' });
      (function () {
        var task = (st.tasks || []).filter(function (x) { return x.id === taskId; })[0] || {};
        var LSx = layerState(L);
        var again = (task.rounds || []).length > 0 || task.status === 'needs_more';
        var EFFL = { fast: '比預估快', onpar: '跟預估差不多', slow: '比預估慢' };
        showMoment(L, {
          kind: 'submit', accent: '#C3BAAA',
          kicker: again ? 'RECHECKED' : 'MARKED DONE',
          title: again ? '改好了，等他再看一次' : '你勾了做完',
          lede: '「' + (task.title || '這一項') + '」等他去看。作業本身在他收的地方。',
          sprite: null,
          rows: [
            { k: '你們說', v: EFFL[reflect.effort] || '—', hi: reflect.effort === 'slow' },
            { k: '留了幾個入口', v: (files.length || 0) + ' 個' },
            { k: '這一層還差', v: Math.max(0, LSx.missingN + LSx.unopenedN - 1) + ' 塊' }
          ],
          quoteLabel: again ? '你這次改了什麼' : '你寫的（選填）',
          quote: String(text || '').slice(0, 160) + (String(text || '').length > 160 ? '…' : ''),
          lines: [ again
            ? '他會看到你前幾次交了什麼、他自己退回的理由，還有你這一次改了哪裡。'
            : '他排佇列是照各組停留週數，不是先交先看。等的時候可以去挖下一塊。' ],
          btn: '知道了', go: function () {}
        });
      })();
      call('apiSubmitItem', LIVE.token, taskId, text, files, reflect)
        .then(function (r) { if (!r || !r.ok) { L.say((r && r.error) || '沒有存到伺服器，請再交一次。'); } return refresh(); })
        .catch(function () { L.say('沒有存到伺服器，請再交一次。'); });
    };

    /* --- 證據：真的上傳到雲端硬碟 --- */
    var draft = S.draftFiles || [];
    v.evidence = draft.map(function (f, i) {
      return {
        name: f.name || String(f),
        meta: f.kind === 'link' ? '連結' : (KIND_META[f.kind] || {}).label + ' · ' + fmtSize(f.size),
        iconStyle: fileIcon(f.kind, 16),
        canOpen: true,
        open: function () { openFile(L, f); },
        remove: function () {
          L.setState({ draftFiles: (L.state.draftFiles || []).filter(function (_, j) { return j !== i; }) });
          if (f.id) call('apiDeleteFile', LIVE.token, f.id).catch(function () {});
        }
      };
    });
    v.evidenceAdders = ['image', 'doc', 'video', 'link'].map(function (k) {
      return {
        label: KIND_META[k].label,
        add: function () {
          if (k === 'link') { L.setState({ linkOpen: !L.state.linkOpen }); return; }
          pickFile(k, function (file) { uploadFile(L, file); });
        }
      };
    });
    v.uploading = !!S.uploading;
    v.uploadNote = '上傳中：' + (S.uploadName || '') + '　·　檔案越大越久，先別離開這一頁。';
    v.uploadHint = '不用把作業本體傳上來——那個照老師原本的方式交。這裡只是給他一個找得到的入口。單檔 10 MB，更大的用「連結」。';
    v.linkOpen = !!S.linkOpen;
    v.linkDraft = S.linkDraft || '';
    v.setLinkDraft = function (e) { L.setState({ linkDraft: e.target.value }); };
    v.addLink = function () {
      var raw = String(L.state.linkDraft || '').trim();
      if (!raw) { L.say('先貼上網址。'); return; }
      var url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      L.setState({
        draftFiles: (L.state.draftFiles || []).concat([{ kind: 'link', name: raw, url: url, size: 0 }]),
        linkDraft: '', linkOpen: false
      });
    };

    /* --- 送審三格 --- */
    v.gateWhy = '逐項確認看的是「這一項做完了沒有」；關卡看的是「這一層走完，你們變成什麼樣子」。' +
      '他看得到你們交了什麼，看不到你們怎麼走過來的——這三題只有你們答得出來。';
    v.gateWhyRows = [
      { n: '1', t: '路線：他有清單，但不知道你們實際怎麼走、在哪繞路。' },
      { n: '2', t: '你們自己：專題留下來的是能力，不是檔案。' },
      { n: '3', t: '下一層的起點：寫下來，回頭才知道估得準不準。' }
    ];
    v.gateFields = GATE_Q.map(function (g, i) {
      return {
        n: String(i + 1), q: g.q, hint: g.hint, ph: g.ph,
        value: (S.gateText || [])[i] || '',
        set: function (e) {
          var vals = (L.state.gateText || ['', '', '']).slice();
          vals[i] = e.target.value;
          L.setState({ gateText: vals });
        }
      };
    });

    /* 送審頁：擋住的時候要看得見原因，按鈕也要看起來按不下去 */
    var subWhy = gateBlockReason(L);
    v.subBlocked = !!subWhy;
    v.subBlockedWhy = subWhy;
    v.submitGateLabel = S.gateSending ? '送出中…' : subWhy ? '還不能送出' : '送出關卡審核';

    /* 原型的入口只看必要項、也沒看礦脈，這裡整顆按鈕改成跟後端同一套 */
    var passedHere = (S.passed || []).indexOf(S.currentLayer || 1) >= 0;
    v.gateBtn = (S.gateSubmitted || passedHere) ? '已送出' : subWhy ? '還不能送交關卡' : '送交關卡審核';
    v.gateBtnStyle = (!subWhy && !S.gateSubmitted && !passedHere)
      ? "font:500 22px/1 'C11';letter-spacing:.12em;color:#0B0A09;background:#E9B341;border:none;padding:14px 22px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)"
      : "font:500 22px/1 'C11';color:#4A443C;background:none;border:1px solid #2E2822;padding:14px 22px;cursor:not-allowed";

    v.goSubmitGate = function () {
      var why = gateBlockReason(L);
      if (why) { L.say(why); return; }
      if (L.state.gateSubmitted) { L.say('已經送出去了，等老師審。'); return; }
      L.go('SUB');
    };

    v.submitGate = function () {
      if (L.state.gateSending) return;
      var cells = (L.state.gateText || []).slice();
      /* 先擋在前面，理由跟後端一致 */
      var blocked = gateBlockReason(L);
      if (blocked) { L.say(blocked); return; }
      if (!String(cells[0] || '').trim()) { L.say('第一題先寫——他要知道你們實際走過的路。'); return; }
      if (!String(cells[1] || '').trim()) { L.say('第二題不能空著。這一層你們變成什麼樣子，只有你們答得出來。'); return; }
      if (!String(cells[2] || '').trim()) { L.say('第三題寫一句就好。下次回頭要拿它對照。'); return; }
      L.setState({ gateSending: true });
      call('apiSubmitGate', LIVE.token, cells)
        .then(function (r) {
          L.setState({ gateSending: false });
          if (!r || !r.ok) { L.say((r && r.error) || '沒有送到伺服器，請再送一次。'); return; }
          L.setState({ gateSubmitted: true, screen: 'S02' });
          (function () {
            var lay = L.LAYERS[(L.state.currentLayer || 1) - 1] || {};
            var sp = layerSprites(L, L.state.currentLayer || 1);
            showMoment(L, {
              kind: 'gate', art: 'gate', accent: '#C3BAAA',
              kicker: 'GATE SUBMITTED',
              title: (lay.name || '這一層') + ' · 關卡送出去了',
              lede: '三格寫完了，送出去了。',
              sprite: sp.tool || null,
              rows: [
                { k: '這一層', v: lay.name || '', hi: true },
                { k: '採到', v: layerState(L).veinN + ' 塊' },
                { k: '接下來', v: '等他審' }
              ],
              lines: [
                '他准了，這一層的礦石就鑄成「' + (lay.tool || '道具') + '」——擋在層底的那一隻會退開。',
                '牠倒下的地方會留下一件東西——那就是這一層的寶物。'
              ],
              btn: '知道了', go: function () {}
            });
          })();
          return refresh();
        })
        .catch(function () { L.setState({ gateSending: false }); L.say('沒有送到伺服器，請再送一次。'); });
    };

    decorateGantt(L, v);

    /* 看他組的通過紀錄時，三格的題目也要跟著換 */
    if (v.selTeam && v.selTeam.cells && v.selTeam.cells.length) {
      v.selTeam.cells = v.selTeam.cells.map(function (c, i) {
        return Object.assign({}, c, { q: (GATE_Q[i] || {}).q || c.q });
      });
    }


    /* 第五層的自訂命名要回寫 */
    if (v.setSpecName) {
      var origSetSpec = v.setSpecName;
      v.setSpecName = function (e) {
        origSetSpec(e);
        var key = L.state.specId, val = e.target.value;
        clearTimeout(LIVE.specTimer);
        LIVE.specTimer = setTimeout(function () {
          call('apiSaveSpecName', LIVE.token, key, val).catch(function () {});
        }, 700);
      };
    }

    /* 發道具動畫關閉後進新一層的故事頁 */
    v.closeReward = function () {
      var st = L.state;
      var lay = st.currentLayer;
      /* 第五層過了＝整套走完，直接進期末回顧（結局在那一頁） */
      if ((st.passed || []).indexOf(5) >= 0) {
        L.setState({ reward: null, screen: 'FINALE', finData: null });
        return;
      }
      L.setState({ reward: null, screen: 'STORY', storyIdx: 0, storyLayer: lay, storyFrom: 'S01', expanded: lay });
    };

    decorateRewards(L, v);
    decorateSections(L, v);   /* 這一步會重排 taskGroups，open 在裡面就綁好了 */
    decorateRules(L, v);
    decorateFinale(L, v);
    decorateProtoLeftovers(L, v);
    decorateCollect(L, v);
    decorateBoard(L, v);
    decorateDayNight(L, v);   /* 地表那一層照現實時間 */
    decorateLayerPanel(L, v);
    decorateHomeBand(L, v);   /* 首頁的「你在這裡」吃的是同一份 */
    decorateChecklist(L, v);  /* 老師開了清單就逐條勾 */
    decorateVow(L, v);        /* 這一項要拿哪一樣破法 */
    decorateGamble(L, v);     /* 勾完之後，送出前的那一下 */
    decorateDig(L, v);        /* 試挖與斗篷人的日誌 */
    decorateHaul(L, v);       /* 採量：全班的分數 */
    decorateRecord(L, v);     /* 任務紀錄與宣告命中率 */
    decorateHomeHaul(L, v);   /* 首頁的名冊摘要 */
    decorateTerm(L, v);       /* 時間軸：唯一共同的尺 */
    decorateSlimStats(L, v);  /* 首頁三張卡：礦石改成任務 */
    markVerdicts(L, v);       /* 地圖每一格直接顯示老師給不給過 */



    (v.ganttRows || []).forEach(function (row, i) {

      if (t) row.open = openTask(L, t);
    });
  }

  /* 開一項。被退回的那一項＝重交：草稿清空，讓他重寫；上一次寫的東西移到往返紀錄裡。 */
  function openTask(L, t) {
    return function () {
      var retry = t.status === 'needs_more';
      L.setState({
        screen: 'S05', openTaskId: t.id,
        draftText: retry ? '' : (t.text || ''),
        draftFiles: retry ? [] : (t.files || []).slice(),
        draftEffort: retry ? '' : (t.effort || ''),
        draftEffortNote: retry ? '' : (t.effortNote || ''),
        draftBlocker: retry ? '' : (t.blocker || ''),
        linkOpen: false, linkDraft: '', taskHistory: null, historyFor: null
      });
      loadHistory(L, null, t.id);
    };
  }

  /* ---------- 往返紀錄（學生與老師看同一份） ---------- */

  function loadHistory(L, teamId, taskId) {
    var key = (teamId || '') + '::' + taskId;
    if (!taskId || L.state.historyFor === key) return;
    /* 可能在 render 途中被呼叫，延到下一輪再改狀態 */
    setTimeout(function () {
      if (L.state.historyFor === key) return;
      L.setState({ historyFor: key, taskHistory: null });
      call('apiTaskHistory', LIVE.token, teamId || '', taskId).then(function (r) {
        if (!r || !r.ok || L.state.historyFor !== key) return;
        L.setState({ taskHistory: r });
      }).catch(function () {});
    }, 0);
  }

  /* 關卡送審的三格。問的是「這一層你們走過來變成什麼樣子」，
     不是再交一次成果——成果他在逐項確認時已經看過了。 */
  var GATE_Q = [
    {
      q: '你在這一層的路上做了什麼事情',
      hint: '不用列清單，清單他手上有。寫你們實際走過的路：先做什麼、中途改了什麼、哪一段花掉最多時間。',
      ph: '例：前兩週三個方向同時試，第三週發現分不出優先序，砍到只剩一個。砍掉的兩個留在備用開挖點。'
    },
    {
      q: '你覺得你們在這階段有什麼變化',
      hint: '這一格問的是你們自己，不是作品。哪裡跟一開始不一樣了？誰接手了原本不會的事？哪個判斷現在做得比較快？',
      ph: '例：一開始三個人都在查資料，後來分成訪談、整理、決策三塊。現在誰該做什麼比較不用討論了。'
    },
    {
      q: '接下來要做什麼事情',
      hint: '下一層他一樣只給清單、不給路線。先講一次你們打算怎麼走，下次回頭就有東西可以對照。',
      ph: '例：下一層先把訪談全部排完再開始整理，不要邊訪邊改題目。'
    }
  ];

  var EFFORT_META = {
    fast:  ['他們說：比預估快', '#E9B341'],
    onpar: ['他們說：跟預估差不多', '#C3BAAA'],
    slow:  ['他們說：比預估慢', '#D9603F']
  };

  function roundRows(L, rounds, mine) {
    return (rounds || []).map(function (h) {
      var ok = h.result === 'pass' || h.result === 'auto';   /* 逾時自動暫准也算放行 */
      var fix = h.result === 'needfix';
      var col = ok ? '#E9B341' : fix ? '#D9603F' : '#8A8073';
      var eff = EFFORT_META[h.effort];
      return {
        label: '第 ' + h.n + ' 次交',
        color: col,
        meta: 'W' + h.week + (ok ? ' · 通過' : fix ? ' · 被退回' : ' · 還沒審'),
        effortLabel: eff ? (mine ? eff[0].replace('他們說：', '你當時說：') : eff[0]) : '',
        effortChip: eff
          ? "font:500 11px/1 'C11';letter-spacing:.08em;padding:5px 8px;background:rgba(0,0,0,.35);border:1px solid " + eff[1] + ';color:' + eff[1]
          : 'display:none',
        text: h.text ? (h.text.length > 160 ? h.text.slice(0, 160) + '…' : h.text) : '（沒有寫內容）',
        hasReason: !!String(h.reason || '').trim(),
        reason: h.reason || '',
        box: 'padding:12px 14px;background:' + (ok ? 'rgba(233,179,65,.05)' : fix ? 'rgba(217,96,63,.06)' : 'rgba(0,0,0,.26)') +
          ';border-left:2px solid ' + col
      };
    });
  }

  /* ---------- 完成之後會拿到什麼 ---------- */

  function mineralOf(L, name) {
    var m = L.MINS.filter(function (x) { return x.name === name; })[0];
    return m || null;
  }

  /* 借原型自己的 SPRITE 對照表取圖：老師視角不上鎖，所以暫時切過去問一次。
     學生要「先看到完成之後會拿到什麼」，圖本身不遮，遮的是它的介紹。 */
  function withOpenEyes(L, fn) {
    var was = L.state.role;
    L.state.role = 'teacher';
    try { return fn(); } finally { L.state.role = was; }
  }
  /* 樣式字串裡還是 assets/jlz/KEY.png（Runtime 套進 DOM 時才換），這裡自己換一次 */
  function dataUrlIn(style) {
    var m = /url\(assets\/jlz\/([A-Za-z0-9_\-]+)\.png\)/.exec(style || '');
    if (m) return (window.JLZ_SPRITES || {})[m[1]] || null;
    var d = /url\((data:image\/png[^)]+)\)/.exec(style || '');
    return d ? d[1] : null;
  }
  function mineralSprite(L, name, layer) {
    return withOpenEyes(L, function () {
      var cells = L.mineralCells(layer, false).filter(function (c) { return c.name === name; });
      return cells.length ? dataUrlIn(cells[0].glyphStyle) : null;
    });
  }
  function layerSprites(L, n) {
    return withOpenEyes(L, function () {
      var p = L.layerPanel(n);
      return { tool: dataUrlIn(p.toolIconStyle), treasure: dataUrlIn(p.treIconStyle) };
    });
  }

  function rewardOf(L, task) {
    if (!task || !task.mineral) {
      return { hasReward: false, rewardBox: 'display:none', rewardIcon: '', rewardLabel: '',
               rewardName: '', rewardNote: '', rewardColor: '#8A8073' };
    }
    var got = task.status === 'passed';
    /* 只有「已經破完」或「正在進行」的項目才揭露會採到什麼；還沒開始的維持 ？？？ */
    var working = task.status === 'submitted' || task.status === 'needs_more' ||
                  !!String(task.text || '').trim() || !!(task.files && task.files.length);
    var open = got || working;
    if (!open) {
      return { hasReward: false, rewardBox: 'display:none', rewardIcon: '', rewardLabel: '',
               rewardName: '', rewardNote: '', rewardColor: '#8A8073' };
    }

    var m = mineralOf(L, task.mineral);
    var icon = mineralSprite(L, task.mineral, (m && m.L) || task.layer);
    var iconStyle = icon
      ? 'display:block;width:32px;height:32px;flex:none;background:url(' + icon + ') center/contain no-repeat;image-rendering:pixelated;' +
        (got ? '' : 'opacity:.6;filter:saturate(.45) brightness(.88)')
      : 'display:block;width:32px;height:32px;flex:none;background:radial-gradient(circle at 50% 45%,rgba(233,179,65,.42),rgba(233,179,65,.06) 62%,transparent 74%);animation:dormant 5s ease-in-out infinite';

    return {
      hasReward: true,
      rewardBox: 'display:flex;align-items:center;gap:11px;margin-top:11px;padding:10px 12px;background:' +
        (got ? 'rgba(233,179,65,.07)' : 'rgba(233,179,65,.035)') +
        ';border:1px ' + (got ? 'solid #3A3026' : 'dashed #2E2822'),
      rewardIcon: iconStyle,
      rewardLabel: got ? '已採到的物證' : '這一項通過會採到',
      rewardName: task.mineral,
      rewardColor: got ? '#E9B341' : '#C3BAAA',
      rewardNote: got
        ? '已經在你的收藏裡。點地圖的收藏總覽可以看它是什麼。'
        : (m ? '對應環節：' + m.task + '　·　通過之後才看得到它長什麼樣、有什麼特性。' : '這一項通過時留下的物證。')
    };
  }

  function decorateRewards(L, v) {
    var S = L.state;

    /* S-02 每一項 */
    var flat = [];
    (v.taskGroups || []).forEach(function (g) { (g.items || []).forEach(function (it) { flat.push(it); }); });
    var ordered = [].concat(L.req(), L.ext());
    flat.forEach(function (row, i) { Object.assign(row, rewardOf(L, ordered[i])); });

    /* S-05 提交頁 */
    var open = (S.tasks || []).filter(function (t) { return t.id === S.openTaskId; })[0];
    v.openReward = rewardOf(L, open);
    v.hasSpec = !!(open && String(open.spec || '').trim());
    v.openTaskSpec = (open && open.spec) || '';
  }

  /* ---------- 任務清單改成依狀態分區，一區一個框 ---------- */

  var SECTIONS = [
    { key: 'needs_more', tag: '要補的', desc: '他退回來了。看他的理由改完再交一次——重交次數不限。',
      accent: '#D9603F', bg: 'rgba(217,96,63,.06)', border: 'rgba(217,96,63,.34)' },
    { key: 'todo', tag: '還沒交', desc: '這一區是你現在該動手的。作業照老師原本的方式交，交完點進去把清單勾完、回答一題。',
      accent: '#E9B341', bg: 'rgba(233,179,65,.045)', border: '#5A4A2C' },
    { key: 'submitted', tag: '等他驗收', desc: '已經送出去了。他的佇列依各組停留週數排序，不是先交先看。',
      accent: '#C3BAAA', bg: 'rgba(195,186,170,.04)', border: '#3A3026' },
    { key: 'passed', tag: '已完成', desc: '他確認過了，物證也採到了。合格考量留在每一項裡，那是下一次的標準。',
      accent: '#8A8073', bg: 'rgba(0,0,0,.26)', border: '#26211C' }
  ];

  function decorateSections(L, v) {
    var rows = [];
    (v.taskGroups || []).forEach(function (g) { (g.items || []).forEach(function (it) { rows.push(it); }); });
    var ordered = [].concat(L.req(), L.ext());
    if (!rows.length) { v.taskGroups = []; return; }

    var bucket = function (t) {
      if (t.status === 'passed') return 'passed';
      if (t.status === 'submitted') return 'submitted';
      if (t.status === 'needs_more') return 'needs_more';
      return 'todo';
    };

    v.taskGroups = SECTIONS.map(function (sec) {
      var items = [];
      ordered.forEach(function (t, i) {
        if (bucket(t) !== sec.key || !rows[i]) return;
        var r = rows[i];
        /* 狀態已經是區塊了，每一列的徽章改標礦石 */
        r.statusLabel = t.status === 'passed' ? '已採到' : '待採';
        r.chipStyle = L.chip(
          t.type === 'required' ? 'rgba(233,179,65,.16)' : 'transparent',
          t.type === 'required' ? '#E9B341' : '#9A9184',
          t.type === 'required' ? 'rgba(233,179,65,.3)' : '#3A3026');
        r.open = openTask(L, t);
        items.push(r);
      });
      if (!items.length) return null;
      return {
        tag: sec.tag,
        tagStyle: "font:700 22px/1 'C11';padding:7px 11px;white-space:nowrap;flex:none;background:" +
          sec.bg + ';border:1px solid ' + sec.border + ';color:' + sec.accent,
        count: items.length + ' 項',
        countColor: sec.accent,
        desc: sec.desc,
        boxStyle: 'background:' + sec.bg + ';border:1px solid ' + sec.border,
        headStyle: 'display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:13px 14px;border-bottom:1px solid ' + sec.border,
        items: items
      };
    }).filter(Boolean);
  }


  /* ============================================================
     骨架：一層的狀態只在這裡算一次。
     全收集有兩道 —— 礦脈要開完（老師），礦石要採完（學生）。
     學生端所有跟「能不能過這一層」有關的畫面都讀這一個函式。
     ============================================================ */

  function layerState(L, layer) {
    var S = L.state;
    layer = layer || S.currentLayer || 1;
    var vein = (L.MINS || []).filter(function (m) { return m.L === layer; });
    var items = (S.tasks || []).filter(function (t) { return t.layer === layer; });
    var taken = {};
    items.forEach(function (t) { if (t.mineral) taken[t.mineral] = 1; });
    var unopened = vein.filter(function (m) { return !taken[m.name]; });
    var got = items.filter(function (t) { return t.status === 'passed'; });
    var missing = items.filter(function (t) { return t.status !== 'passed'; });
    var cleared = (S.passed || []).indexOf(layer) >= 0;
    var st = {
      layer: layer, vein: vein, veinN: vein.length,
      items: items, openedN: items.length,
      unopened: unopened, unopenedN: unopened.length,
      gotN: got.length, missing: missing, missingN: missing.length,
      cleared: cleared, byMineral: {}
    };
    items.forEach(function (t) { if (t.mineral) st.byMineral[t.mineral] = t; });
    /* 採齊＝礦脈開完、而且每一塊都通過 */
    st.complete = st.veinN > 0 && st.unopenedN === 0 && st.missingN === 0;
    /* 關卡只看老師。收集不再是門檻——礦石從「條件」變回「紀錄」。 */
    st.blockReason = !st.openedN
      ? '這一層還沒有清單，老師還沒把任務開出來。'
      : '';
    return st;
  }

  /* 送不送得出關卡：唯一入口 */
  function gateBlockReason(L) { return layerState(L).blockReason; }

  /* ---------- 甘特圖：欄位依實際學期長度，排程可以拉區間 ---------- */

  function planOf(S, taskId) {
    var p = (S.plan || {})[taskId];
    if (p == null) return null;
    if (typeof p === 'number') return { a: p, b: p };
    return { a: Number(p.a) || Number(p.b) || 1, b: Number(p.b) || Number(p.a) || 1 };
  }

  function decorateGantt(L, v) {
    var S = L.state;
    var kl = L.KLASSES[S.klass] || {};
    var N = Math.max(6, Math.min(156, Number(kl.semesterWeeks) || 18));
    var now = S.courseWeek || 1;
    var tasks = L.myTasks();
    var AC = '#E9B341';

    /* 一學期到三年都要能看：格子寬度隨週數自動縮，也可以手動切 */
    var ZOOMS = { wide: 44, mid: 26, narrow: 15 };
    var autoZoom = N <= 24 ? 'wide' : N <= 60 ? 'mid' : 'narrow';
    var zoom = S.ganttZoom || autoZoom;
    if (!ZOOMS[zoom]) zoom = autoZoom;
    var CELL = ZOOMS[zoom];
    v.ganttMinWidth = Math.max(600, 176 + N * CELL) + 'px';

      : '點一格＝那一週交完；同一列再點第二格，兩格之間連成一條。老師只訂期限，這一頁他看不到。';
    v.ganttHowToStyle = "font:400 22px/1.6 'C11';margin-bottom:12px;text-wrap:pretty;padding:11px 13px;border-left:2px solid " +

          colBg(n) + ';color:' + (isNow ? AC : hasDue ? '#DCD4C6' : '#8A8073') + colEdge(n),

          var hatch = past ? 'repeating-linear-gradient(135deg,rgba(217,96,63,.10) 0 3px,transparent 3px 8px),' : '';
          var base = 'flex:1;min-width:' + CELL + 'px;align-self:stretch;min-height:38px;cursor:' + (got ? 'default' : 'pointer') +
            ";display:flex;align-items:center;justify-content:center;font:500 11px/1 'C11';padding:0;margin:0;";
          var body, mark = '';

          if (done) {

            else if (isA) mark = '起';
            else if (isB) mark = '交';
            body = 'background:' + hatch + fill + ';color:' + (past ? '#F0C6B8' : '#0B0A09') +
              ';border-top:2px solid ' + line + ';border-bottom:2px solid ' + line +
              ';border-left:' + (isA ? '2px solid ' + line : '0') +

    var gp = planOf(S, 'gate'), sent = S.gateSubmitted, gdone = (S.passed || []).indexOf(S.currentLayer) >= 0;

          },

            ";display:flex;align-items:center;justify-content:center;font:500 11px/1 'C11';" +
            ((gdone || sent) && n === now
              ? 'background:' + (gdone ? AC : 'rgba(233,179,65,.18)') + ';color:' + (gdone ? '#0B0A09' : AC) + ';border:2px ' + (gdone ? 'solid' : 'dashed') + ' ' + AC

      Object.assign(sw('background:rgba(233,179,65,.30);border-top:2px solid ' + AC + ';border-bottom:2px solid ' + AC +

      Object.assign(sw('background:transparent;border:1px solid #1F1B17;box-shadow:inset -3px 0 0 0 #8A8073'), { label: '老師訂的期限' }),

      Object.assign(sw('background:' + AC + ';border:2px solid ' + AC, '✓', '#0B0A09'), { label: '老師確認通過的那一週' }),
