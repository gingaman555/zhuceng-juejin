<template id="jlz-tpl">
<div style="{{ shellStyle }}{{ uiVars }}">

  <div style="{{ stageWrapStyle }}">
    <div style="{{ stageStyle }}">

      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font:500 22px/1 'C11';color:#E8E2D6;flex:none">
          <span>09:41</span>
          <span style="width:17px;height:9px;border:1px solid #8A8073;border-radius:2px;display:inline-block"></span>
        </div>
      </sc-if>

      <div style="flex:1;min-height:0;display:flex;flex-direction:{{ appDir }};{{ uiVars }}">

        <sc-if value="{{ showSideNav }}" hint-placeholder-val="{{ true }}">
          <div style="flex:none;width:264px;border-right:1px solid #221E19;background:#0E0C0A;display:flex;flex-direction:column;padding:20px 0;height:100%;overflow-y:auto">
            <div style="padding:0 18px 16px">
              <div style="font:400 11px/1 'C11';letter-spacing:.24em;color:#5F574C;margin-bottom:7px">{{ navRoleTag }}</div>
              <div style="font:700 22px/1.6 'C11'">{{ navName }}</div>
              <div style="font:400 22px/1.5 'C11';color:#8A8073;margin-top:4px">{{ navSub }}</div>
              <sc-if value="{{ isTeacher }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ toggleKlass }}" style="margin-top:10px;width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(233,179,65,.06);border:1px solid #2E2822;color:#C3BAAA;font:400 11px/1 'C11';letter-spacing:.1em;cursor:pointer;text-align:left">
                  <span style="flex:1">{{ klassTerm }}</span><span style="color:#E9B341">切換班級</span>
                </button>
                <!-- 班級切換改成獨立畫面 KLASS -->
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:1px;padding:0 10px">
              <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="5">
                <button onClick="{{ it.go }}" style="{{ it.style }}"><span style="{{ it.iconStyle }}"></span><span style="font:500 11px/1 'C11';letter-spacing:.08em;opacity:.5;width:34px;flex:none;text-align:left;white-space:nowrap">{{ it.code }}</span><span style="font:500 22px/1 'C11';flex:1;text-align:left">{{ it.label }}</span><span style="{{ it.dotStyle }}">{{ it.badge }}</span></button>
              </sc-for>
            </div>
            <div style="margin-top:auto;padding:16px 18px 0;border-top:1px solid #1C1915">
              <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:10px">{{ gaugeTitle }}</div>
              <div style="display:flex;flex-direction:column;gap:3px">
                <sc-for list="{{ gauge }}" as="g" hint-placeholder-count="5">
                  <div style="{{ g.style }}"><span style="font:500 11px/1 'C11';opacity:.55">{{ g.n }}</span><span style="font:500 11px/1 'C11';letter-spacing:.05em;flex:1">{{ g.name }}</span><span style="font:400 11px/1 'C11';opacity:.6">{{ g.tail }}</span></div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative">

          <sc-if value="{{ showIdBar }}" hint-placeholder-val="{{ false }}">
            <div style="position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,10,9,.94);border-bottom:1px solid #221E19">
              <span style="{{ idRoleStyle }}">{{ idRole }}</span>
              <span style="display:block;width:20px;height:20px;flex:none;background:url({{ idIcon }}) center/contain no-repeat;image-rendering:pixelated"></span>
              <span style="font:500 22px/1.3 'C11';color:#E8E2D6">{{ idName }}</span>
              <span style="flex:1"></span>
              <span style="font:400 11px/1 'C11';color:#8A8073;text-align:right">{{ idMeta }}</span>
              <sc-if value="{{ showSignOut }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ signOut }}" style="font:500 11px/1 'C11';letter-spacing:.14em;color:#FFE3DA;background:#8E2F1C;border:1px solid #D9603F;padding:8px 13px;cursor:pointer;white-space:nowrap;flex:none">登出</button>
              </sc-if>
            </div>
          </sc-if>

          <sc-if value="{{ scC01 }}" hint-placeholder-val="{{ true }}">
            <div data-screen-label="C-01 啟動頁" style="height:100%;min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:radial-gradient(680px 420px at 50% 120%,rgba(233,179,65,.17),transparent 72%),#0B0A09;position:relative;overflow:hidden;isolation:isolate">
              <span style="{{ bootSceneStyle }}"></span>
              <span style="{{ bootSkyStyle }}"></span>
              <span style="{{ bootStrataStyle }}"></span>
              <sc-for list="{{ bootGhosts }}" as="bgh" hint-placeholder-count="4">
                <span style="{{ bgh.style }}"></span>
              </sc-for>
              <span style="{{ bootWalkerStyle }}"></span>
              <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);pointer-events:none"></div>
              <span data-jlz-orb style="{{ bootOrbStyle }}"><span style="{{ bootNeedleStyle }}"></span></span>
              <div style="font:700 44px/1.2 'C11';letter-spacing:.2em;text-indent:.2em;color:#F2E6C8;text-align:center;text-shadow:0 0 26px rgba(233,179,65,.35)">逐層掘進</div>
              <div style="width:56px;height:1px;background:#E9B341;margin:var(--pad) 0;opacity:.5"></div>
              <button onClick="{{ goLogin }}" style="margin-top:8px;font:500 22px/1 'C11';letter-spacing:.28em;text-indent:.28em;color:#0B0A09;background:#E9B341;border:none;padding:15px 40px;cursor:pointer;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)">出　發</button>
            </div>
          </sc-if>

          <sc-if value="{{ scC02 }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="C-02 登入與身分" style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:34px var(--pad)">
              <div style="width:100%;max-width:400px">
                <div style="font:400 11px/1 'C11';letter-spacing:.3em;color:#5F574C">C-02 · IDENTIFY</div>
                <h1 style="font:700 33px/1.4 'C11';margin:12px 0 24px;letter-spacing:.03em">你是</h1>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px">
                  <button onClick="{{ pickStudent }}" style="{{ pickStuStyle }}">
                    <span style="display:block;width:56px;height:56px;margin:0 auto 10px;background:url(assets/jlz/role-student.png) center/contain no-repeat;image-rendering:pixelated"></span>
                    <span style="font:700 33px/1.2 'C11';display:block;text-align:center">學生</span>
                  </button>
                  <button onClick="{{ pickTeacher }}" style="{{ pickTeaStyle }}">
                    <span style="display:block;width:56px;height:56px;margin:0 auto 10px;background:url(assets/jlz/role-teacher.png) center/contain no-repeat;image-rendering:pixelated"></span>
                    <span style="font:700 33px/1.2 'C11';display:block;text-align:center">老師</span>
                  </button>
                  <button onClick="{{ pickResearcher }}" style="{{ pickResStyle }}">
                    <span style="display:block;width:56px;height:56px;margin:0 auto 10px;background:repeating-linear-gradient(135deg,#2A2E33 0 4px,#1E2024 4px 8px);filter:grayscale(1)"></span>
                    <span style="font:700 33px/1.2 'C11';display:block;text-align:center;color:#B4B6BE">研究者</span>
                    <span style="display:block;font:400 11px/1.4 'C11';color:#5F574C;text-align:center;margin-top:6px">唯讀</span>
                  </button>
                </div>
                <button onClick="{{ goAuth }}" style="width:100%;font:500 22px/1 'C11';letter-spacing:.2em;text-indent:.2em;color:#0B0A09;background:#E9B341;border:none;padding:15px;cursor:pointer;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)">下一步</button>
                <button onClick="{{ goStart }}" style="width:100%;margin-top:9px;font:400 22px/1 'C11';color:#6E665A;background:none;border:none;padding:8px;cursor:pointer">回啟動頁</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ scC03 }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="C-03 登入" style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:34px var(--pad)">
              <div style="width:100%;max-width:400px">
                <div style="font:400 11px/1 'C11';letter-spacing:.3em;color:#5F574C">C-03 · SIGN IN</div>
                <h1 style="font:700 33px/1.4 'C11';margin:12px 0 22px;letter-spacing:.03em">{{ authTitle }}</h1>
                <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:20px">
                  <div>
                    <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:8px">帳號</div>
                    <input value="{{ acct }}" onChange="{{ setAcct }}" placeholder="學號或教師編號" style="width:100%;padding:13px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:400 22px/1.4 'C11';outline:none">
                  </div>
                  <div>
                    <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:8px">密碼</div>
                    <input type="password" value="{{ pw }}" onChange="{{ setPw }}" placeholder="••••••••" style="width:100%;padding:13px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:400 22px/1.4 'C11';outline:none">
                  </div>
                </div>
                <sc-if value="{{ showAuthToggle }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ toggleFirst }}" style="{{ firstToggleStyle }}"><span style="{{ firstBoxStyle }}">{{ firstMark }}</span><span style="font:400 22px/1.4 'C11';text-align:left">{{ authToggleLabel }}</span></button>
                </sc-if>
                <sc-if value="{{ authIsManaged }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:6px;font:400 22px/1.7 'C11';color:#5F574C;text-wrap:pretty">帳號由研究者建立與發放。拿到帳號密碼就能直接登入。</div>
                </sc-if>
                <sc-if value="{{ hasAuthError }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:14px;padding:11px 13px;background:rgba(217,96,63,.1);border:1px solid rgba(217,96,63,.32);font:400 22px/1.6 'C11';color:#E8B4A4;text-wrap:pretty">{{ authError }}</div>
                </sc-if>
                <button onClick="{{ doLogin }}" style="{{ authSubmitStyle }}">{{ authSubmitLabel }}</button>
                <sc-if value="{{ showRegisterLink }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ goRegister }}" style="width:100%;margin-top:9px;font:400 22px/1 'C11';color:#E9B341;background:none;border:1px dashed #5A4A2C;padding:12px;cursor:pointer">第一次使用？註冊研究者帳號</button>
                </sc-if>
                <button onClick="{{ goIdentity }}" style="width:100%;margin-top:9px;font:400 22px/1 'C11';color:#6E665A;background:none;border:none;padding:8px;cursor:pointer">回上一步</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ scC04 }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="C-04 建立小隊" style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:34px var(--pad)">
              <div style="width:100%;max-width:440px">
                <div style="font:400 11px/1 'C11';letter-spacing:.3em;color:#5F574C">{{ c04Kicker }}</div>
                <h1 style="font:700 33px/1.4 'C11';margin:12px 0 6px;letter-spacing:.03em">{{ c04Title }}</h1>
                <p style="font:400 22px/1.7 'C11';color:#8A8073;margin:0 0 22px;text-wrap:pretty">{{ c04Hint }}</p>
                <sc-if value="{{ hasIdentityList }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:20px">
                    <sc-for list="{{ identityTeams }}" as="g" hint-placeholder-count="2">
                      <div>
                        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:9px">
                          <span style="font:700 22px/1.3 'C11';color:#E8E2D6">{{ g.teamName }}</span>
                          <span style="font:400 11px/1 'C11';color:#5F574C">{{ g.meta }}</span>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:7px">
                          <sc-for list="{{ g.members }}" as="m" hint-placeholder-count="3">
                            <button onClick="{{ m.pick }}" style="{{ m.style }}">{{ m.label }}</button>
                          </sc-for>
                        </div>
                      </div>
                    </sc-for>
                  </div>
                  <div style="padding:12px 14px;background:#0E0C0A;border:1px dashed #2E2822;font:400 11px/1.7 'C11';color:#5F574C;text-wrap:pretty;margin-bottom:8px">名單是研究者建好的。點到不是自己的名字，找研究者「放掉」就能改。灰掉的表示已經有人認領了。</div>
                </sc-if>
                <sc-if value="{{ showTeamMaker }}" hint-placeholder-val="{{ true }}">
                <div style="margin-bottom:20px">
                  <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:8px">小隊名稱</div>
                  <input value="{{ teamName }}" onChange="{{ setTeamName }}" placeholder="例：挖到再說" style="width:100%;padding:13px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:400 22px/1.4 'C11';outline:none">
                </div>
                <sc-if value="{{ showMemberRows }}" hint-placeholder-val="{{ true }}">
                <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:8px">組員</div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:11px">
                  <sc-for list="{{ memberRows }}" as="m" hint-placeholder-count="3">
                    <div style="display:flex;gap:8px;align-items:center">
                      <span style="font:400 11px/1 'C11';color:#5F574C;width:22px;flex:none">{{ m.n }}</span>
                      <input value="{{ m.value }}" onChange="{{ m.set }}" placeholder="姓名" style="flex:1;min-width:0;padding:12px 13px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:400 22px/1.4 'C11';outline:none">
                      <button onClick="{{ m.remove }}" style="font:400 22px/1 'C11';color:#6E665A;background:none;border:1px solid #2E2822;padding:11px 13px;cursor:pointer;flex:none;white-space:nowrap">移除</button>
                    </div>
                  </sc-for>
                </div>
                <button onClick="{{ addMember }}" style="font:400 22px/1 'C11';color:#E9B341;background:none;border:1px dashed #5A4A2C;padding:11px 15px;cursor:pointer;width:100%">＋ 新增組員</button>
                </sc-if>
                <sc-if value="{{ liveMemberNote }}" hint-placeholder-val="{{ false }}">
                  <div style="padding:13px 15px;background:#0E0C0A;border:1px dashed #2E2822;font:400 22px/1.7 'C11';color:#8A8073;text-wrap:pretty">你的名字會自動掛在這支小隊上。其他組員用自己的帳號登入後，在這一頁選「加入」就會進來——名字都是研究者建帳號時定好的，不用自己打。</div>
                </sc-if>
                <button onClick="{{ finishTeam }}" style="width:100%;margin-top:20px;font:500 22px/1 'C11';letter-spacing:.2em;text-indent:.2em;color:#0B0A09;background:#E9B341;border:none;padding:15px;cursor:pointer;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)">建立小隊</button>
                <sc-if value="{{ hasJoinable }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:26px;padding-top:20px;border-top:1px solid #221E19">
                    <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:5px">或者，加入班上已經建好的小隊</div>
                    <div style="font:400 22px/1.7 'C11';color:#8A8073;margin-bottom:12px;text-wrap:pretty">同一組的人要加入同一支小隊，交出去的東西才會算在一起。</div>
                    <div style="display:flex;flex-direction:column;gap:7px">
                      <sc-for list="{{ joinableTeams }}" as="j" hint-placeholder-count="3">
                        <button onClick="{{ j.join }}" style="text-align:left;padding:13px 15px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:inherit;cursor:pointer;width:100%">
                          <span style="display:block;font:500 22px/1.3 'C11'">{{ j.name }}</span>
                          <span style="display:block;font:400 11px/1.6 'C11';color:#8A8073;margin-top:5px">{{ j.members }}</span>
                        </button>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
                </sc-if>
                <sc-if value="{{ hasAuthError }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:14px;padding:11px 13px;background:rgba(217,96,63,.1);border:1px solid rgba(217,96,63,.32);font:400 22px/1.6 'C11';color:#E8B4A4;text-wrap:pretty">{{ authError }}</div>
                </sc-if>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ scC05 }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="C-05 研究者註冊" style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:34px var(--pad)">
              <div style="width:100%;max-width:440px">
                <div style="font:400 11px/1 'C11';letter-spacing:.3em;color:#5F574C">C-05 · REGISTER</div>
                <h1 style="font:700 33px/1.4 'C11';margin:12px 0 6px;letter-spacing:.03em">{{ regTitle }}</h1>
                <p style="font:400 22px/1.7 'C11';color:#8A8073;margin:0 0 22px;text-wrap:pretty">{{ regHint }}</p>
                <div style="display:flex;flex-direction:column;gap:14px">
                  <sc-for list="{{ regFields }}" as="f" hint-placeholder-count="4">
                    <div>
                      <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:8px">{{ f.label }}</div>
                      <input type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.set }}" placeholder="{{ f.ph }}" style="width:100%;padding:13px;background:#0E0C0A;border:1px solid #2E2822;color:#E8E2D6;font:400 22px/1.4 'C11';outline:none">
                      <sc-if value="{{ f.hasNote }}" hint-placeholder-val="{{ false }}">
                        <div style="font:400 11px/1.7 'C11';color:#5F574C;margin-top:6px;text-wrap:pretty">{{ f.note }}</div>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
                <sc-if value="{{ hasAuthError }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-top:16px;padding:11px 13px;background:rgba(217,96,63,.1);border:1px solid rgba(217,96,63,.32);font:400 22px/1.6 'C11';color:#E8B4A4;text-wrap:pretty">{{ authError }}</div>
                </sc-if>
                <button onClick="{{ doRegister }}" style="{{ regSubmitStyle }}">{{ regSubmitLabel }}</button>
                <button onClick="{{ goSignIn }}" style="width:100%;margin-top:9px;font:400 22px/1 'C11';color:#6E665A;background:none;border:none;padding:8px;cursor:pointer">已經有帳號了，去登入</button>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ scStory }}" hint-placeholder-val="{{ false }}">
            <div data-screen-label="故事說明" style="min-height:100%;display:flex;flex-direction:column;position:relative">
              <div style="position:absolute;inset:0;background:radial-gradient(620px 400px at 50% 108%,rgba(233,179,65,.13),transparent 70%);pointer-events:none"></div>
              <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);flex:none">
                <div style="display:flex;gap:5px;align-items:center">
                  <sc-for list="{{ storyDots }}" as="d" hint-placeholder-count="7">
                    <span style="{{ d.style }}"></span>
                  </sc-for>
                </div>
                <button onClick="{{ skipStory }}" style="font:400 22px/1 'C11';color:#6E665A;background:none;border:1px solid #26211C;padding:9px 14px;cursor:pointer;white-space:nowrap">跳過故事</button>
              </div>
              <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 30px 24px;max-width:640px;margin:0 auto;width:100%">
                <sc-if value="{{ storyArtLetter }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-bottom:22px;display:flex;justify-content:center">
                    <svg viewBox="0 0 320 150" width="320" height="150" shape-rendering="crispEdges" style="max-width:100%;height:auto">
                      <rect x="0" y="0" width="320" height="150" fill="#0E0C0A"></rect>
                      <rect x="24" y="36" width="136" height="88" fill="#2A241C"></rect>
                      <rect x="32" y="44" width="120" height="72" fill="#C3BAAA"></rect>
                      <polygon points="32,44 152,44 92,92" fill="#8A8073"></polygon>
                      <polygon points="32,44 152,44 92,92" fill="none" stroke="#5F574C" stroke-width="4"></polygon>
                      <rect x="84" y="84" width="16" height="16" fill="#E9B341"></rect>
                      <rect x="176" y="30" width="120" height="96" fill="#1A1611"></rect>
                      <rect x="184" y="38" width="104" height="80" fill="#14110E"></rect>
                      <rect x="184" y="38" width="104" height="80" fill="none" stroke="#3A3026" stroke-width="4"></rect>
                      <rect x="192" y="62" width="88" height="4" fill="#3A3026"></rect>
                      <rect x="192" y="86" width="56" height="4" fill="#3A3026"></rect>
                      <rect x="240" y="94" width="8" height="8" fill="#E9B341"></rect>
                      <rect x="248" y="86" width="8" height="8" fill="#E9B341"></rect>
                      <rect x="240" y="86" width="8" height="8" fill="#0E0C0A"></rect>
                      <rect x="248" y="94" width="8" height="8" fill="#0E0C0A"></rect>
                    </svg>
                  </div>
                </sc-if>
                <sc-if value="{{ storyArtDepart }}" hint-placeholder-val="{{ false }}">
                  <div style="margin-bottom:22px;display:flex;justify-content:center">
                    <svg viewBox="0 0 320 150" width="320" height="150" shape-rendering="crispEdges" style="max-width:100%;height:auto">
                      <rect x="0" y="0" width="320" height="150" fill="#0E0C0A"></rect>
                      <rect x="0" y="104" width="320" height="46" fill="#1A1611"></rect>
                      <rect x="0" y="104" width="320" height="4" fill="#3A3026"></rect>

                <sc-if value="{{ scR00 }}" hint-placeholder-val="{{ false }}">

              <p style="font:400 22px/1.8 'C11';color:#C3BAAA;margin:12px 0 0;text-wrap:pretty">{{ momentLede }}</p>
            </div>
            <sc-if value="{{ hasMomentRows }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
                <sc-for list="{{ momentRows }}" as="mr" hint-placeholder-count="3">
                  <div style="{{ mr.style }}">
                    <span style="{{ mr.kStyle }}">{{ mr.k }}</span>
                    <span style="{{ mr.vStyle }}">{{ mr.v }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ hasMomentQuote }}" hint-placeholder-val="{{ false }}">
              <div style="{{ momentQuoteStyle }}">
                <div style="font:400 11px/1 'C11';letter-spacing:.16em;color:#5F574C">{{ momentQuoteLabel }}</div>
                <div style="font:400 22px/1.8 'C11';color:#E8E2D6;margin-top:8px;text-wrap:pretty">{{ momentQuote }}</div>
              </div>
            </sc-if>
            <sc-if value="{{ hasMomentLines }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-direction:column;gap:8px;max-width:520px">
                <sc-for list="{{ momentLines }}" as="ml" hint-placeholder-count="2">
                  <div style="{{ ml.style }}">{{ ml.t }}</div>
                </sc-for>
              </div>
            </sc-if>
            <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px">
              <button onClick="{{ closeMoment }}" style="{{ momentBtnStyle }}">{{ momentBtn }}</button>
              <sc-if value="{{ hasMomentAlt }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ doMomentAlt }}" style="{{ momentAltStyle }}">{{ momentAlt }}</button>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ rewardOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;z-index:50;background:rgba(6,5,4,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center">
          <div style="position:absolute;inset:0;background:radial-gradient(560px 420px at 50% 50%,rgba(233,179,65,.16),transparent 70%);animation:pulseGlow 4s ease-in-out infinite;pointer-events:none"></div>
          <div style="position:relative;font:400 11px/1 'C11';letter-spacing:.34em;color:#8A8073">LAYER CLEARED</div>
          <div style="position:relative;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:28px 0 24px">
            <div style="width:150px;padding:20px 16px;background:#14110E;border:1px solid #3A3026;clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px)">
              <div style="width:46px;height:46px;margin:0 auto;background:linear-gradient(140deg,#E9B341,#6B4C15);clip-path:polygon(50% 0,100% 30%,82% 100%,18% 100%,0 30%)"></div>
              <div style="font:400 11px/1 'C11';letter-spacing:.18em;color:#5F574C;margin-top:14px">道具</div>
              <div style="font:700 22px/1.4 'C11';margin-top:6px;color:#F2EADA">{{ rewardTool }}</div>
            </div>
            <div style="width:150px;padding:20px 16px;background:#14110E;border:1px solid #2E2822;clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px)">
              <div style="width:46px;height:46px;margin:0 auto;background:linear-gradient(140deg,#C3BAAA,#4A443C);border-radius:50%"></div>
              <div style="font:400 11px/1 'C11';letter-spacing:.18em;color:#5F574C;margin-top:14px">戰利品</div>
              <div style="font:700 22px/1.4 'C11';margin-top:6px;color:#F2EADA">{{ rewardTreasure }}</div>
            </div>
          </div>
          <div style="position:relative;max-width:390px;font:400 22px/1.7 'C11';color:#C3BAAA;text-wrap:pretty">{{ rewardCopy }}</div>
          <button onClick="{{ closeReward }}" style="position:relative;margin-top:26px;font:500 22px/1 'C11';letter-spacing:.2em;text-indent:.2em;color:#0B0A09;background:#E9B341;border:none;padding:14px 32px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)">往下一層</button>
        </div>
      </sc-if>

    </div>
  </div>
</div>
</template>
