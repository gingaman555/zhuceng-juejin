@keyframes seep{0%,100%{opacity:.06}50%{opacity:.22}}
@keyframes facet{0%,100%{opacity:.25}45%{opacity:1}}
@keyframes echo{0%{opacity:.55;transform:scaleX(.3)}100%{opacity:0;transform:scaleX(1)}}
@keyframes boil{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ember{0%{opacity:0;transform:translateY(0)}25%{opacity:.9}100%{opacity:0;transform:translateY(-46px)}}
@keyframes corepulse{0%,100%{opacity:.18;transform:scale(.86)}50%{opacity:.5;transform:scale(1.06)}}
@keyframes corering{0%{opacity:.5}100%{opacity:0;transform:scale(1.5)}}
html,body{margin:0;padding:0;background:#0B0A09;font-family:'C11';-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale}
*{box-sizing:border-box}
a{color:#E9B341;text-decoration:none}
a:hover{color:#F5CB74}
button{font-family:'C11'}
textarea::placeholder,input::placeholder{color:#5F574C}
textarea,input{font-family:'C11'}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2E2822}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulseGlow{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes momentIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes momentBg{from{opacity:0}to{opacity:1}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-26px) scale(.7)}55%{opacity:1;transform:translateY(4px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.7) rotate(-7deg)}60%{opacity:1;transform:scale(.94) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes rayspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes lineUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes bossBreathe{0%,100%{opacity:.55;transform:translateY(0) scale(1)}50%{opacity:.8;transform:translateY(-1px) scale(1.02)}}
@keyframes bossGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(233,179,65,.5))}50%{filter:drop-shadow(0 0 16px rgba(233,179,65,.95))}}
@keyframes bossLoom{0%{opacity:0;transform:translateY(10px) scale(.86)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jlzWalk{0%{left:-12%}100%{left:108%}}
@keyframes jlzSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes dormant{0%,100%{opacity:.18;filter:brightness(.8)}50%{opacity:.5;filter:brightness(1.25)}}

<template id="jlz-tpl">
<div style="{{ shellStyle }}{{ uiVars }}">

  <div style="{{ stageWrapStyle }}">
    <div style="{{ stageStyle }}">

      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font:500 22px/1 'C11';color:#E8E2D6;flex:none">
          <span>09:41</span>
          <span style="width:17px;height:9px;border:1px solid #8A8073;border-radius:2px;display:inline-block"></span>
        </div>
      </sc-if>

      <div style="flex:1;min-height:0;display:flex;flex-direction:{{ appDir }};{{ uiVars }}">

        <sc-if value="{{ showSideNav }}" hint-placeholder-val="{{ true }}">
          <div style="flex:none;width:264px;border-right:1px solid #221E19;background:#0E0C0A;display:flex;flex-direction:column;padding:20px 0;height:100%;overflow-y:auto">
            <div style="padding:0 18px 16px">
              <div style="font:400 11px/1 'C11';letter-spacing:.24em;color:#5F574C;margin-bottom:7px">{{ navRoleTag }}</div>
              <div style="font:700 22px/1.6 'C11'">{{ navName }}</div>
              <div style="font:400 22px/1.5 'C11';color:#8A8073;margin-top:4px">{{ navSub }}</div>
              <sc-if value="{{ isTeacher }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ toggleKlass }}" style="margin-top:10px;width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(233,179,65,.06);border:1px solid #2E2822;color:#C3BAAA;font:400 11px/1 'C11';letter-spacing:.1em;cursor:pointer;text-align:left">
                  <span style="flex:1">{{ klassTerm }}</span><span style="color:#E9B341">切換班級</span>
                </button>
                <!-- 班級切換改成獨立畫面 KLASS -->
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:1px;padding:0 10px">
              <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="5">
                <button onClick="{{ it.go }}" style="{{ it.style }}"><span style="{{ it.iconStyle }}"></span><span style="font:500 11px/1 'C11';letter-spacing:.08em;opacity:.5;width:34px;flex:none;text-align:left;white-space:nowrap">{{ it.code }}</span><span style="font:500 22px/1 'C11';flex:1;text-align:left">{{ it.label }}</span><span style="{{ it.dotStyle }}">{{ it.badge }}</span></button>
              </sc-for>
            </div>
            <div style="margin-top:auto;padding:16px 18px 0;border-top:1px solid #1C1915">
              <div style="font:400 11px/1 'C11';letter-spacing:.2em;color:#5F574C;margin-bottom:10px">{{ gaugeTitle }}</div>
              <div style="display:flex;flex-direction:column;gap:3px">
                <sc-for list="{{ gauge }}" as="g" hint-placeholder-count="5">
                  <div style="{{ g.style }}"><span style="font:500 11px/1 'C11';opacity:.55">{{ g.n }}</span><span style="font:500 11px/1 'C11';letter-spacing:.05em;flex:1">{{ g.name }}</span><span style="font:400 11px/1 'C11';opacity:.6">{{ g.tail }}</span></div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative">

          <sc-if value="{{ showIdBar }}" hint-placeholder-val="{{ false }}">
            <div style="position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px var(--pad);background:rgba(11,10,9,.94);border-bottom:1px solid #221E19">
              <span style="{{ idRoleStyle }}">{{ idRole }}</span>
              <span style="display:block;width:20px;height:20px;flex:none;background:url({{ idIcon }}) center/contain no-repeat;image-rendering:pixelated"></span>
              <span style="font:500 22px/1.3 'C11';color:#E8E2D6">{{ idName }}</span>
              <span style="flex:1"></span>
              <span style="font:400 11px/1 'C11';color:#8A8073;text-align:right">{{ idMeta }}</span>
              <sc-if value="{{ showSignOut }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ signOut }}" style="font:500 11px/1 'C11';letter-spacing:.14em;color:#FFE3DA;background:#8E2F1C;border:1px solid #D9603F;padding:8px 13px;cursor:pointer;white-space:nowrap;flex:none">登出</button>
              </sc-if>
            </div>
          </sc-if>

          <sc-if value="{{ scC01 }}" hint-placeholder-val="{{ true }}">
            <div data-screen-label="C-01 啟動頁" style="height:100%;min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:radial-gradient(680px 420px at 50% 120%,rgba(233,179,65,.17),transparent 72%),#0B0A09;position:relative;overflow:hidden;isolation:isolate">
              <span style="{{ bootSceneStyle }}"></span>
              <span style="{{ bootSkyStyle }}"></span>
              <span style="{{ bootStrataStyle }}"></span>
              <sc-for list="{{ bootGhosts }}" as="bgh" hint-placeholder-count="4">
                <span style="{{ bgh.style }}"></span>
              </sc-for>
              <span style="{{ bootWalkerStyle }}"></span>
              <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);pointer-events:none"></div>

          <sc-if value="{{ showRes }}" hint-placeholder-val="{{ false }}">

                <sc-if value="{{ scRADM }}" hint-placeholder-val="{{ false }}">

                    <sc-if value="{{ adm.hasMsg }}" hint-placeholder-val="{{ false }}">

                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin:18px 0 8px">班級</div>

                            <button onClick="{{ k.toggleEdit }}" style="{{ k.editStyle }}">{{ k.editLabel }}</button>

                          <sc-if value="{{ k.editing }}" hint-placeholder-val="{{ false }}">

                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:stretch">

                      <textarea onChange="{{ adm.setRosterText }}" value="{{ adm.rosterText }}" placeholder="挖到再說：陳小明, 李小華, 張大同&#10;慢慢掘：王小美, 林小強" style="width:100%;min-height:96px;padding:11px 13px;background:#0C1116;border:1px solid #1D2831;border-radius:6px;color:#DFE6EB;font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;resize:vertical;outline:none"></textarea>

                          </div>

                      <div style="margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.8;color:#5A6874">建好之後把「帳號＋初始密碼」抄給對方。學生登入後自己建立或加入小隊；隊名他們自己取，人名用你定的。</div>

                          <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8393A0;flex:1;text-align:left">{{ u.account }}</span>
                          <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874">{{ u.meta }}</span>
                        </button>
                      </sc-for>
                    </div>
                    <sc-if value="{{ adm.hasSel }}" hint-placeholder-val="{{ false }}">
                      <div style="margin-top:10px;padding:14px;background:#121A21;border:1px solid #2A2E33;border-radius:9px">
                        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin-bottom:10px">{{ adm.selLabel }}</div>
                        <div style="display:flex;flex-wrap:wrap;gap:8px">
                          <input value="{{ adm.editName }}" onChange="{{ adm.setEditName }}" placeholder="改名" style="flex:1;min-width:130px;padding:10px 12px;background:#0C1116;border:1px solid #1D2831;border-radius:6px;color:#DFE6EB;font-family:'Noto Sans TC',sans-serif;font-size:13px;outline:none">
                          <button onClick="{{ adm.saveName }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 14px;background:#1E2024;border:1px solid #2A2E33;color:#DFE6EB;cursor:pointer;border-radius:6px">存新名字</button>

                      </div>
                    </sc-if>
                  </div>
                </sc-if>

                <sc-if value="{{ scR00 }}" hint-placeholder-val="{{ false }}">
                  <div data-screen-label="R-00 進入" style="padding:var(--pad) 24px;max-width:1200px">
                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:#5A6874">R-00 · CONSENT</div>
                    <h1 style="font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;margin:10px 0 6px">知情同意狀態</h1>
                    <p style="font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.9;color:#8393A0;margin:0 0 16px">必須捲到底才能繼續。</p>
                    <div onScroll="{{ resVals.onConsentScroll }}" style="height:230px;overflow-y:auto;padding:16px 18px;background:#121A21;border:1px solid #1D2831;border-radius:9px;font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:2;color:#B7C3CC">
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin-bottom:8px">蒐集哪些資料</div>
                      任務發派、任務提交、逐項確認（含審核理由全文）、關卡送審與審核、他組紀錄閱讀事件、停留狀態。全部以組為單位，不記個人。
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin:16px 0 8px">保存期限</div>
                      論文口試後兩年，屆期刪除原始事件記錄，僅保留去識別化後的統計結果。
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin:16px 0 8px">匿名方式</div>
                      組別顯示為代號（Ａ隊／Ｂ隊），老師顯示為〔T1〕〔T2〕。代號對照表不存在系統裡。匯出強制匿名，沒有關閉選項。
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin:16px 0 8px">老師是否已簽署</div>
                      〔T1〕已簽署（部署前）。老師事先知道自己的審核理由會被分析——這個效應無法消除：知道有人在看，教師回饋的品質就會改變。這一點必須寫進研究限制。
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#5A6874;margin:16px 0 8px">研究者能做什麼</div>
                      只有篩選、排序、展開、匯出，以及在審核語料上做自己的編碼。編碼不進入課堂資料，學生與老師都看不到。研究者不得寫入、編輯、通知或標記任何東西給老師看。
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
                      <button onClick="{{ resVals.accept }}" style="{{ resVals.acceptStyle }}">已讀完，進入總覽</button>
                      <button onClick="{{ resVals.toggleDemo }}" style="{{ resVals.demoStyle }}">{{ resVals.demoLabel }}</button>
                    </div>
                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874;margin-top:10px">「已讀完」要捲到底才會啟用。</div>
                    <div style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0;margin-top:12px">要對老師、口委或研究團隊示範這一端看得到什麼，或是自己想把流程走一遍，就開一個試用班。試用班是真的系統，差別只在那一班的資料不會進研究紀錄；班級清單上會一直標著記號，用完可以整班刪掉。</div>
                  </div>
                </sc-if>

                <sc-if value="{{ openR01 }}" hint-placeholder-val="{{ false }}">

                    <h1 style="font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;margin:10px 0 18px">資料量摘要</h1>

                          <div style="font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:500;margin-top:10px;color:#DFE6EB;font-variant-numeric:tabular-nums">{{ s.value }}</div>
                          <div style="font-family:'Noto Sans TC',sans-serif;font-size:11px;line-height:1.6;color:#5A6874;margin-top:7px">{{ s.note }}</div>
                        </div>
                      </sc-for>
                    </div>
                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:#5A6874">自評 對 老師的判斷</div>
                    <div style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0;margin:8px 0 12px">學生送出前先說自己這一項花的力氣跟原本估的差多少，老師之後才做判斷。兩邊擺在一起，看得到他們估得準不準——這是這套系統唯一能直接觀察「自我認識」的地方。</div>
                    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:26px">
                      <sc-for list="{{ resVals.selfCross }}" as="sc" hint-placeholder-count="3">
                        <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;padding:11px 13px;background:#121A21;border-left:2px solid {{ sc.color }}">
                          <span style="font-family:'Noto Sans TC',sans-serif;font-size:13.5px;color:#DFE6EB;min-width:150px">{{ sc.label }}</span>
                          <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;color:{{ sc.color }}">{{ sc.value }}</span>
                          <span style="flex:1;min-width:180px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.8;color:#5A6874">{{ sc.note }}</span>
                        </div>
                      </sc-for>
                    </div>
                    <h2 style="font-family:'Noto Serif TC',serif;font-size:19px;font-weight:700;margin:28px 0 6px">尚未發生的事</h2>
                    <p style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0;margin:0 0 12px">機制的缺席比它的使用更值得寫。若某個機制整學期無人使用，那不是資料不足，那是發現。</p>
                    <div style="display:flex;flex-direction:column;gap:6px">
                      <sc-for list="{{ resVals.absent }}" as="a" hint-placeholder-count="4">
                        <div style="{{ a.style }}">
                          <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#B7C3CC;width:120px;flex:none">{{ a.label }}</span>
                          <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#DFE6EB">{{ a.value }}</span>
                        </div>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{ openR02 }}" hint-placeholder-val="{{ false }}">
                  <div data-screen-label="R-02 審核語料" style="padding:var(--pad) 24px">
                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;color:#5A6874">R-02 · REVIEW CORPUS</div>
                    <h1 style="font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;margin:10px 0 6px">審核語料</h1>
                    <p style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0;margin:0 0 18px">老師寫下的每一則判斷理由，逐項、有時間戳、綁定特定交付物。正常的設計評圖是口頭的、不留紀錄的。</p>
                    <div style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
                      <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:7px">
                        <sc-if value="{{ resVals.noCorpus }}" hint-placeholder-val="{{ true }}">
                          <div style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0;padding:14px 0">本區間沒有任何確認事件。這代表老師在這幾週沒有按下確認，不是資料遺失。</div>
                        </sc-if>
                        <sc-for list="{{ resVals.corpus }}" as="c" hint-placeholder-count="4">
                          <button onClick="{{ c.pick }}" style="{{ c.style }}">
                            <span style="display:flex;gap:10px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874">
                              <span>{{ c.group }}</span><span>{{ c.week }}</span><span>{{ c.result }}</span><span style="flex:1"></span><span>{{ c.len }}</span>
                            </span>
                            <span style="display:block;font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.8;color:#DFE6EB;margin-top:8px">{{ c.excerpt }}</span>
                            <span style="display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8393A0;margin-top:7px">{{ c.title }}　{{ c.code }}</span>
                          </button>
                        </sc-for>
                      </div>
                      <sc-if value="{{ resVals.hasPick }}" hint-placeholder-val="{{ false }}">
                      <div style="flex:1;min-width:290px;padding:18px 20px;background:#121A21;border:1px solid #1D2831;border-radius:9px">
                        <sc-if value="{{ resVals.hasPick }}" hint-placeholder-val="{{ false }}">
                          <div>
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#5A6874">{{ resVals.pickMeta }}</div>
                            <div style="font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;margin-top:10px">{{ resVals.pickGroup }} · {{ resVals.pickTitle }}</div>

                                <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#5A6874">學生那一邊 · 同一輪</div>
                                <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">
                                  <sc-for list="{{ resVals.pickTags }}" as="pt" hint-placeholder-count="3">
                                    <span style="{{ pt.style }}">{{ pt.label }}</span>
                                  </sc-for>
                                </div>
                                <div style="font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.95;color:#B7C3CC;margin-top:11px">{{ resVals.pickSubText }}</div>
                                <sc-if value="{{ resVals.hasSelfNote }}" hint-placeholder-val="{{ false }}">
                                  <div style="margin-top:11px;padding:11px 13px;background:#0C1116;border-left:2px solid #59636E">
                                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#5A6874">他們對自己的說法</div>
                                    <div style="font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.95;color:#DFE6EB;margin-top:7px">{{ resVals.pickSelfNote }}</div>
                                  </div>
                                </sc-if>
                                <sc-if value="{{ resVals.hasSelfBlocker }}" hint-placeholder-val="{{ false }}">
                                  <div style="margin-top:8px;padding:11px 13px;background:#16202A;border-left:2px solid #D9A45C">
                                    <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#D9A45C">他們說卡在</div>
                                    <div style="font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.95;color:#DFE6EB;margin-top:7px">{{ resVals.pickBlocker }}</div>
                                  </div>
                                </sc-if>
                                <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.8;color:#5A6874;margin-top:11px">{{ resVals.pickCross }}</div>
                              </div>
                            </sc-if>
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#5A6874;margin:20px 0 9px">語言類型編碼 · 只存在研究者端</div>
                            <div style="display:flex;flex-wrap:wrap;gap:6px">
                              <sc-for list="{{ resVals.codeChips }}" as="k" hint-placeholder-count="5">
                                <button onClick="{{ k.set }}" style="{{ k.style }}">{{ k.label }}</button>
                              </sc-for>
                            </div>
                          </div>
                        </sc-if>
                      </div>
                      </sc-if>
                    </div>
                    <div style="margin-top:24px;padding-top:18px;border-top:1px solid #1D2831">
                      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#5A6874;margin-bottom:6px">四型比例</div>
                      <div style="font-family:'Noto Sans TC',sans-serif;font-size:12.5px;line-height:1.85;color:#8393A0;margin-bottom:12px">你在左邊逐則編碼之後，這裡才會長出來。四型是分析「老師的回饋長什麼樣」用的，不是評老師好壞。</div>
                      <div style="padding:13px 15px;background:#0C1116;border:1px solid #1D2831;border-radius:9px;margin-bottom:14px">
                        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#D9A45C">編碼準則 · 由上往下判斷，符合就停</div>
                        <div style="display:flex;flex-direction:column;gap:9px;margin-top:11px">
                          <sc-for list="{{ resVals.codebook }}" as="cb" hint-placeholder-count="5">
                            <div style="display:flex;gap:11px;align-items:flex-start">
                              <span style="{{ cb.tagStyle }}">{{ cb.tag }}</span>
                              <span style="flex:1;min-width:0">
                                <span style="display:block;font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.8;color:#DFE6EB">{{ cb.rule }}</span>
                                <span style="display:block;font-family:'Noto Sans TC',sans-serif;font-size:12.5px;line-height:1.8;color:#8393A0;margin-top:4px">{{ cb.example }}</span>

                          </sc-for>

                        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.8;color:#5A6874;margin-top:11px">{{ resVals.codebookNote }}</div>

                        </sc-for>
                      </div>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{ openR03 }}" hint-placeholder-val="{{ false }}">

                    <sc-if value="{{ resVals.noSeqs }}" hint-placeholder-val="{{ true }}">
                      <div style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#8393A0">本區間沒有任何退回。沒有退回就沒有修正序列可分析。</div>
                    </sc-if>
                    <div style="display:flex;flex-direction:column;gap:9px">
                      <sc-for list="{{ resVals.seqs }}" as="q" hint-placeholder-count="2">

                          <div style="flex:1;min-width:220px;padding:14px 16px;border-right:1px solid #1D2831">
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874">老師的理由 · {{ q.code }}</div>
                            <div style="font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:1.9;color:#DFE6EB;margin-top:8px">{{ q.reason }}</div>
                          </div>
                          <div style="flex:1;min-width:200px;padding:14px 16px;border-right:1px solid #1D2831">
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874">前後兩版</div>

                          </div>
                          <div style="flex:none;width:170px;padding:14px 16px">
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5A6874">後設資料</div>
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#B7C3CC;margin-top:8px;line-height:1.9">間隔 {{ q.gap }}<br>{{ q.group }}<br>{{ q.result }}</div>
                          </div>
                        </div>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{ openR04 }}" hint-placeholder-val="{{ false }}">

  var App = window.App = {
    logic: null, root: null, vtree: null, tpl: null, queued: false, hooks: [],

  courseStart() { return new Date(2026, 8, 14); }
  weekDate(n, dow) { const d = new Date(this.courseStart()); d.setDate(d.getDate() + (n - 1) * 7 + (dow - 1)); return d; }
  fmtDate(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  dowName(dow) { return ['一', '二', '三', '四', '五', '六', '日'][dow - 1]; }
  dueDow(t) { const m = String(t.due || '').match(/週([一二三四五六日])/); const i = ['一','二','三','四','五','六','日'].indexOf(m ? m[1] : '五'); return i < 0 ? 5 : i + 1; }
  dueLabel(t) {
    if (String(t.due || '') === '不設限') return '不設限';
    const n = this.dueWeek(t), dw = this.dueDow(t);
    return 'W' + n + ' · ' + this.fmtDate(this.weekDate(n, dw)) + '（' + this.dowName(dw) + '）';
  }
  weekRange(n) { return this.fmtDate(this.weekDate(n, 1)) + '–' + this.fmtDate(this.weekDate(n, 7)); }
  dueWeek(t) {
    const m = String(t.due || '').match(/第\s*(\d+)\s*週/);
    if (m) return Math.min(6, Math.max(1, +m[1]));
    const d = String(t.due || '').match(/(\d+)\/(\d+)/);
    if (d) return Math.min(6, Math.max(1, Math.ceil((+d[2] - 2) / 7)));
    return 6;
  }
  planWeek(t) { return this.state.plan[t.id] || this.dueWeek(t); }

    const REASONS = [
      ['pass', '三個定義都寫了，第二個最清楚：你說明了為什麼排除另一種做法。可以往下。'],
      ['needfix', '缺一個判準。你寫了要做什麼，沒寫做到什麼程度算完成——補這一句就通過。'],

    ];
    const subs = [], revs = [], reads = [];
    let n = 0;
    for (let w = 1; w <= Math.max(4, S.weeksHere); w++) {
      const per = w === 1 ? 2 : 3;
      for (let k = 0; k < per; k++) {
        const src = this.MINS[(n + k) % this.MINS.length];
        const g = TEAMS[(n + k) % TEAMS.length];
        const rr = REASONS[(n + k) % REASONS.length];
        const id = 'demo' + n + '-' + k;
        subs.push({ taskId: id, group: g, title: src.task, layer: src.L, week: w, dueWeek: Math.min(6, src.L + 1), overdue: src.L + 1 < w, len: 120 + ((n * 37 + k * 11) % 260) });
        revs.push({ id: id, group: g, title: src.task, layer: src.L, result: rr[0], reason: rr[1], len: rr[1].length, hasReason: !!rr[1], week: w, latency: 12 + ((n * 17 + k * 29) % 96) });
      }
      if (w >= 2) reads.push({ reader: TEAMS[w % TEAMS.length], target: TEAMS[(w + 2) % TEAMS.length], layer: Math.min(5, w), week: w, readerLayer: Math.max(1, Math.min(5, w - 1)), readerStay: 1 + (w % 3), recentlyRejected: w % 2 === 0 });
      n += per;
    }
    return { subLog: subs, revLog: revs, readLog: reads };
  }

  research() {
    const S = this.state;
    const unlockedThrough = S.resDemo ? 6 : Math.floor(S.weeksHere / 4) * 4;
    const visible = x => x.week <= unlockedThrough;
    const revs = S.revLog.filter(visible), subs = S.subLog.filter(visible), reads = S.readLog.filter(visible);
    const teams = this.KLASSES[0].teams.map(t => Object.assign({}, t, (S.teamState || {})[t.id] || {}, t.me ? { weeks: S.weeksHere } : {}));
    const withReason = revs.filter(r => r.hasReason), noReason = revs.filter(r => !r.hasReason);
    const extPicked = this.state.tasks.filter(t => t.type === 'extended' && (t.text || t.status !== 'todo')).length;
    return {
      unlockedThrough, nextUnlock: unlockedThrough + 4, locked: unlockedThrough === 0,
      week: S.weeksHere, revs, subs, reads, teams,
      groups: teams.length,
      assigned: this.state.tasks.filter(t => (t.klass || 'wed') === 'wed').length,
      reviews: revs.length, reasons: withReason.length, noReason: noReason.length,
      noReasonPct: revs.length ? Math.round(noReason.length / revs.length * 100) : 0,
      avgLen: withReason.length ? Math.round(withReason.reduce((a, r) => a + r.len, 0) / withReason.length) : 0,
      avgStay: teams.length ? (teams.reduce((a, t) => a + (t.weeks || 1), 0) / teams.length).toFixed(1) : '0',
      extPicked
    };
  }

  itemProgress(t) {
    let passed = 0, wait = 0, doing = 0, none = 0;
    const teams = this.teams();
    teams.forEach(tm => {
      const layer = tm.me ? this.state.currentLayer : tm.layer;
      if (layer > t.layer) { passed++; return; }
      if (layer < t.layer) { none++; return; }
      if (tm.me) {
        if (t.status === 'passed') passed++;
        else if (t.status === 'submitted') wait++;
        else if (t.status === 'needs_more' || t.text || (t.files && t.files.length)) doing++;
        else none++;
        return;
      }
      none++;
    });
    const parts = [];
    if (passed) parts.push('已通過 ' + passed);
    if (wait) parts.push('待你確認 ' + wait);
    if (doing) parts.push('進行中 ' + doing);
    if (none) parts.push('未開始 ' + none);
    return { text: parts.join(' · ') + '（共 ' + teams.length + ' 組）', live: passed + wait + doing };
  }

    if (k && k.weekOverride !== '' && k.weekOverride != null) return Math.max(1, Math.floor(+k.weekOverride));

    apiTeacherMirror: function (t) {
      var u = auth(t);

      var mine = {}, teamN = 0;
      DB.Teams.forEach(function (x) {
        if (String(x.classId) !== String(u.classId)) return;
        mine[String(x.teamId)] = x.name || '（未命名）';
        teamN++;
      });
      var subs = DB.Submissions.filter(function (x) { return mine[String(x.teamId)]; });
      var revs = (DB.Reviews || []).filter(function (r) {
        return mine[String(r.teamId)] && String(r.result) !== 'auto';
      });
      var subById = {}, subByTry = {}, maxTry = {};
      subs.forEach(function (x) {
        var k = String(x.teamId) + '|' + String(x.taskId);
        var a = Number(x.attempt) || 1;
        subById[String(x.subId)] = x;
        subByTry[k + '|' + a] = x;
        if (!maxTry[k] || a > maxTry[k]) maxTry[k] = a;
      });
      var revBySub = {};
      revs.forEach(function (r) { if (r.subId) revBySub[String(r.subId)] = r; });
      var blank = function () { return { n:0, needfix:0, len:0, lat:0, landed:0, again:0, waiting:0 }; };
      var byLayer = {}, all = blank(), cases = [];
      [1,2,3,4,5].forEach(function (n) { byLayer[n] = blank(); });
      revs.forEach(function (r) {
        var n = Number(r.layer) || 1;
        var b = byLayer[n] || (byLayer[n] = blank());
        var len = Number(r.len) || String(r.reason || '').trim().length;
        var lat = Number(r.latency) || 0;
        b.n++; b.len += len; b.lat += lat;
        all.n++; all.len += len; all.lat += lat;
        if (String(r.result) !== 'needfix') return;
        b.needfix++; all.needfix++;
        var sb = subById[String(r.subId)];
        var nx = sb && subByTry[String(r.teamId) + '|' + String(r.taskId) + '|' + ((Number(sb.attempt) || 1) + 1)];
        var nr = nx && revBySub[String(nx.subId)];
        if (!nx || !nr) { b.waiting++; all.waiting++; return; }
        if (String(nr.result) === 'needfix') { b.again++; all.again++; return; }
        b.landed++; all.landed++;
        cases.push({ team: mine[String(r.teamId)], title: r.title || '', layer: n,
                     reason: String(r.reason || ''), before: Number(sb.len) || 0,
                     after: Number(nx.len) || 0, week: Number(r.week) || 0 });
      });
      var passedN = 0, totalTry = 0;

      signedIn: true, role: u.role, klass: idx,
      courseWeek: b.courseWeek, weeksHere: b.courseWeek, joinCode: b.joinCode || '',
      teamState: {}, otherSubs: [], teamTasks: b.teamTasks || {}, gates: b.gates || [],
      authError: '', busy: false
    };
    next.minNames = b.minNames || {};              /* 這一組的拆分名稱（學生） */
    if (b.minNamesByTeam) next.minNamesByTeam = b.minNamesByTeam;   /* 每一組一份（老師） */
    (b.teams || []).forEach(function (t) {
      next.teamState[t.id] = { layer: t.layer, weeks: t.weeks, passed: t.passed, got: t.got || null };
    });

    if (u.role === 'student') {
      next.tasks = b.tasks || [];
      next.plan = b.plan || {};
      next.passedWeek = b.passedWeek || {};
      next.record = b.record || [];
      next.layerSaid = b.layerSaid || {};
      next.digs = b.digs || [];
      next.finds = b.finds || {};
      next.digPages = b.digPages || [];
      next.digTotal = b.digTotal || 24;
      var mt = b.myTeam;
      if (mt) {
        next.currentLayer = mt.layer; next.passed = mt.passed || [];
        next.toolLevels = mt.toolLevels || {}; next.stayWeeks = mt.weeks;
        next.specNames = mt.specNames || {};
        /* 學生正在 SUB 打字時不要蓋掉三格草稿 */
        if (!(S0.screen === 'SUB' && !mt.gateSubmitted)) {
          next.gateText = mt.gateText || ['', '', ''];
          next.gateSubmitted = !!mt.gateSubmitted;
        }
        /* 只有換層時才移動地圖焦點 */
        if (S0.currentLayer !== mt.layer || !S0.signedIn) {
          next.expanded = mt.layer; next.editLayer = mt.layer; next.storyLayer = mt.layer;
        }
      }
      next.marks = (b.publicPasses || []).map(function (p) {
        return { id: p.teamId, layer: LAYERNAME(p.layer), cells: p.cells || ['', '', ''],
                 verdict: p.reason || '', teaser: (p.cells || [''])[0] || '', files: [] };
      });
      /* 各組的歷程：用真實的通過紀錄，不再是原型那句寫死的「W1 進入微光荒原」 */
      var passWeek = {};
      (b.publicPasses || []).forEach(function (p) {
        passWeek[p.teamId + ':' + p.layer] = p.week;
      });
      L.LOGS = {};
      /* passed 正常是陣列。萬一哪一列壞了（型別不對），這裡不設防的話，
         整個登入會炸在一句看不懂的錯誤上，而且是全班一起。 */
      var passList = function (x) {
        if (Array.isArray(x)) return x;
        if (typeof x === "string") {
          try { var a = JSON.parse(x); return Array.isArray(a) ? a : []; } catch (e) { return []; }
        }
        return [];
      };
      (b.teams || []).forEach(function (t) {
        var log = [];
        passList(t.passed).slice().sort(function (x, y) { return x - y; }).forEach(function (n) {
          var w = passWeek[t.id + ':' + n];
          log.push([w ? 'W' + w : '—', '通過' + LAYERNAME(n) + '，進入' + LAYERNAME(Math.min(5, n + 1))]);
        });
        if (!log.length) log.push(['W' + (t.enteredWeek || 1), '進入' + LAYERNAME(t.layer || 1) + '，還沒通過關卡']);
        else log.push(['W' + (t.enteredWeek || 1), '目前在' + LAYERNAME(t.layer || 1) + '，停留 ' + (t.weeks || 1) + ' 週']);
        L.LOGS[t.id] = log;
      });

      /* 層數比上次看到的高：老師剛審過關卡——播發道具動畫 */
      if (mt) {
        var seen = load('jlz.layer.' + u.userId);
        if (seen && Number(seen) < mt.layer && !S0.reward) {
          var prevL = L.LAYERS[mt.layer - 2];
          if (prevL) next.reward = { tool: prevL.tool, treasure: prevL.treasure, level: '' };
        }
        store('jlz.layer.' + u.userId, String(mt.layer));
      }
    }

    if (u.role === 'teacher') {
      next.tasks = (b.taskDefs || []).map(function (d) {
        return Object.assign({}, d, { status: 'todo', text: '', files: [], fb: '', fbType: '', over: false });
      });
      next.otherSubs = (b.queue || []).map(function (q) {
        return { id: q.id, klass: b.classId, team: q.teamName, teamId: q.teamId, taskId: q.taskId,
                 title: q.title, layer: q.layer, tag: 'L' + q.layer,
                 cond: q.cond, due: q.due, over: q.over, text: q.text, files: q.files || [],
                 mineral: q.mineral || '', spec: q.spec || '',
                 effort: q.effort || '', effortNote: q.effortNote || '', blocker: q.blocker || '' };
      });
      next.finOpened = !!(b.myTeam && b.myTeam.finaleOpened);
      /* 老師在我們沒看的時候動過了——把變化演出來 */
      (function () {
        if (u.role !== 'student' || !S0.signedIn) return;
        var hit = detectMoments(L, S0.tasks || [], next.tasks || []);
        if (!hit) return;
        var t = hit.task;
        if (hit.kind === 'needfix') {
          next.moment = {
            kind: 'needfix', accent: '#D9603F',
            kicker: 'SENT BACK',
            title: '他把「' + t.title + '」退回來了',
            lede: '不是懲罰。他寫了為什麼——照那一段改，重交次數不限。',
            sprite: null,
            rows: [
              { k: '這一項', v: t.title },
              { k: '交過幾次', v: ((t.rounds || []).length + 1) + ' 次', hi: true },
              { k: '重交次數', v: '不限' }
            ],
            quoteLabel: '他寫的', quote: t.fb || '',
            lines: ['前面幾次跟他每一次的理由都留著。改完再交，他會看到你動了哪裡。'],
            btn: '知道了', go: function () {}
          };
        } else {
          var after2 = (next.tasks || []).filter(function (x) { return x.layer === (next.currentLayer || 1); });
          var got2 = after2.filter(function (x) { return x.status === 'passed'; }).length;
          var veinN2 = (L.MINS || []).filter(function (x) { return x.L === (next.currentLayer || 1); }).length;
          var minDef = (L.MINS || []).filter(function (x) { return x.name === t.mineral; })[0] || {};
          var full = veinN2 > 0 && got2 >= veinN2;
          next.moment = {
            kind: full ? 'full' : 'mined', accent: '#E9B341',
            kicker: full ? 'LAYER COMPLETE' : 'MINERAL SECURED',
            title: full ? '這一層採齊了' : '採到「' + (t.mineral || '一塊礦石') + '」',
            lede: full
              ? (L.LAYERS[(next.currentLayer || 1) - 1] || {}).name + ' 的 ' + veinN2 + ' 塊都在你們手上了。'
              : '他確認「' + t.title + '」通過了。',
            sprite: full ? null : (t.mineral ? mineralSprite(L, t.mineral, t.layer) : null),
            badge: full ? '' : (t.mineral || ''),
            rows: [
              { k: '這一層', v: got2 + ' / ' + veinN2 + ' 塊', hi: true },
              { k: '還差', v: Math.max(0, veinN2 - got2) + ' 塊' },
              { k: '圖鑑', v: (next.tasks || []).filter(function (x) { return x.status === 'passed'; }).length + ' / ' + MINS_TOTAL }
            ],
            quoteLabel: '他寫的合格考量', quote: t.fb || '',
            lines: full
              ? ['可以送關卡了。送審會問三題：你走過的路、你們的變化、接下來要做什麼。']
              : [minDef.rec || ''].filter(Boolean),
            btn: '知道了', go: function () {}
          };
        }
      })();
      next.myPhrases = b.myPhrases || [];
      next.myWriting = b.myWriting || [];
      next.reviewedOthers = [];
      next.currentLayer = 1;
      next.passed = []; next.gateSubmitted = false;
    }

    L.setState(next);
  }

  function refresh(force) {
    if (!LIVE.token) return Promise.resolve();
    /* 先問一聲有沒有動過。沒動就不抓整包——一個班同時掛著輪詢也不會把配額吃光 */
    var pre = force ? Promise.resolve(true) : call('apiPing', LIVE.token).then(function (p) {
      if (!p || !p.ok || !p.rev) return true;              /* 舊後端沒這支：照舊 */
      if (p.rev === LIVE.lastRev) return false;
      return p.rev;   /* 抓完才記住，抓失敗下一輪會再抓 */
    }).catch(function () { return true; });
    return pre.then(function (go) {
      if (!go) return;
    return call('apiBootstrap', LIVE.token).then(function (r) {
      if (typeof go === 'string') LIVE.lastRev = go;
      if (!r || !r.ok) return;

      applyBootstrap(r);
      /* 有人動過資料，老師首頁那塊鏡子就得重算 */
      if (r.user && r.user.role === 'teacher') App.logic.setState({ mirrorData: null });
      if (r.user.role === 'researcher') return loadSlice();
    }).catch(function () {});
    });
  }

  function loadSlice() {
    return call('apiResearchSlice', LIVE.token).then(function (r) {
      if (!r || !r.ok) return;
      var L = App.logic;
      L.KLASSES = [{ id: 'res', name: '研究資料', term: '', started: true,
                     teams: (r.teams || []).map(function (t) {
                       return { id: t.id, name: t.name, layer: t.layer, weeks: t.weeks, passed: t.passed };
                     }) }];
      L.setState({ resSlice: r, codes: r.codes || {}, courseWeek: r.week, weeksHere: r.week, klass: 0 });
    }).catch(function () {});
  }

  function fail(r) {
    App.logic.setState({ authError: (r && r.error) || '連線失敗，請再試一次。', busy: false });
  }

  /* ================= 登入 / 註冊 ================= */

  function afterSignIn(r, remember, isResume) {
    LIVE.token = r.token;
    store(TOKEN_KEY, remember ? r.token : null);
    return call('apiBootstrap', r.token).then(function (b) {
      if (!b || !b.ok) { fail(b); return; }
      applyBootstrap(b);
      var u = b.user;
      if (u.role === 'student' && !u.teamId) {
        App.logic.setState({ screen: 'C04', role: 'student', busy: false, authError: '' });
        return loadIdentity();
      }
      if (u.role === 'researcher') {
        App.logic.setState({ screen: 'R00', role: 'researcher', busy: false, authError: '' });
        return loadSlice();
      }
      if (isResume) {
        /* 續前次登入：直接回首頁，不重播故事 */
        App.logic.setState({ screen: u.role === 'student' ? 'S01' : 'T01', busy: false, authError: '' });
        return;
      }
      App.logic.setState({
        screen: 'STORY', storyIdx: 0, storyLayer: App.logic.state.currentLayer || 1,
        storyFrom: u.role === 'student' ? 'S01' : 'T01', busy: false, authError: ''
      });
    });
  }

  function loadJoinable() {
    call('apiClassTeams', LIVE.token).then(function (r) {
      if (r && r.ok) App.logic.setState({ joinable: r.teams || [] });
    }).catch(function () {});
  }

  function loadIdentity() {
    return call('apiMyRoster', LIVE.token).then(function (r) {
      if (!r || !r.ok) { App.logic.setState({ identityList: [] }); return; }
      App.logic.setState({ identityList: r.roster || [], busy: false });
      if (!r.hasRoster) loadJoinable();
    }).catch(function () { App.logic.setState({ identityList: [] }); loadJoinable(); });
  }


  /* 側欄的額外入口：學生的期末回顧、老師的 T-09。演練模式也要有。 */
  function addNavExtras(L, v, sc) {
    var S = L.state;
    /* 排行榜自己一格。原本要點「地圖 → 採量」兩層才到得了，
       而它是最需要被看到的東西之一。 */
    if (S.role === 'student' && v.navItems &&
        !v.navItems.some(function (n) { return n.code === '排行'; })) {
      var onBoard = sc === 'S03' && (S.mapTab === 'haul');
      v.navItems.push({
        code: '排行', label: '排行榜', short: '排行',
        go: function () { L.setState({ screen: 'S03', mapTab: 'haul' }); },
        iconStyle: 'display:block;width:14px;height:14px;flex:none;margin-right:8px;background:' +
          (onBoard ? '#E9B341' : '#5F574C') +
          ';clip-path:polygon(0 62%,26% 62%,26% 100%,0 100%,0 62%,37% 30%,63% 30%,63% 100%,37% 100%,37% 30%,74% 0,100% 0,100% 100%,74% 100%)',
        tabIconStyle: 'display:block;width:16px;height:16px;background:' + (onBoard ? '#E9B341' : '#6E665A') +
          ';clip-path:polygon(0 62%,26% 62%,26% 100%,0 100%,0 62%,37% 30%,63% 30%,63% 100%,37% 100%,37% 30%,74% 0,100% 0,100% 100%,74% 100%)',
        style: L.navBtn(onBoard), tabStyle: L.tabBtn(onBoard),
        badge: '', dotStyle: 'display:none', tabDotStyle: 'display:none'
      });
    }


    /* 甘特圖整頁拿掉：側欄那一格濾掉，畫面本身也關起來。
       原型的側欄清單改不了，所以在這裡處理。
       「我打算第幾週交」留在任務頁上——那是一項一次的宣告，
       不是一張整學期的圖。 */
    v.scGantt = false;
    if (v.navItems) {
      v.navItems = v.navItems.filter(function (n) { return n.code !== '甘特'; });
    }
    /* 走完第五層之後，側欄多一項期末回顧 */
    if (S.role === 'student' && v.navItems) {
      var fin5 = (S.passed || []).indexOf(5) >= 0 && !!S.finOpened;
      var waitOpen = (S.passed || []).indexOf(5) >= 0 && !S.finOpened;
      if (!v.navItems.some(function (n) { return n.code === '結局'; })) {
        v.navItems.push({
          code: fin5 ? '結局' : '？？', label: fin5 ? '期末回顧' : '？？？', short: fin5 ? '回顧' : '？？',
          go: function () {
            if (!fin5) {
              L.say(waitOpen ? '五層都過了。等他放行，這裡才會打開。' : '還沒到。走完第五層，這裡才會打開。');
              return;
            }
            L.setState({ screen: 'FINALE' });
          },
          iconStyle: 'display:block;width:14px;height:14px;flex:none;margin-right:8px;background:' +
            (sc === 'FINALE' ? '#E9B341' : fin5 ? '#8A8073' : '#3A3026') +
            ';clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)',
          tabIconStyle: 'display:block;width:16px;height:16px;background:' + (sc === 'FINALE' ? '#E9B341' : '#6E665A') +
            ';clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)',
          style: L.navBtn(sc === 'FINALE') + (fin5 ? '' : ';opacity:.5;cursor:not-allowed'),
          tabStyle: L.tabBtn(sc === 'FINALE'),
          badge: fin5 ? '新' : '', dotStyle: fin5 && sc !== 'FINALE'
            ? "font:600 11px/1 'C11';background:#E9B341;color:#0B0A09;padding:3px 5px" : 'display:none',
          tabDotStyle: 'display:none'
        });
      }
    }

    /* 老師側欄多一項期末回顧：讀學生走完之後回頭寫的東西 */
    if (S.role === 'teacher' && S.signedIn && v.navItems &&
        !v.navItems.some(function (n) { return n.code === 'T-09'; })) {
      var waiting = (((S.tfinData || {}).list) || []).filter(function (x) {
        return x.done5 && x.applied;
      }).length;
      v.navItems.push({
        code: 'T-09', label: '期末回顧', short: '回顧',
        go: function () { L.setState({ screen: 'TFIN' }); },
        iconStyle: 'display:block;width:14px;height:14px;flex:none;margin-right:8px;background:' +
          (sc === 'TFIN' ? '#E9B341' : '#5F574C') + ';clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)',
        tabIconStyle: 'display:block;width:16px;height:16px;background:' + (sc === 'TFIN' ? '#E9B341' : '#6E665A') +
          ';clip-path:polygon(50% 0,100% 38%,80% 100%,20% 100%,0 38%)',
        style: L.navBtn(sc === 'TFIN'),
        tabStyle: L.tabBtn(sc === 'TFIN'),
        badge: waiting ? String(waiting) : '',
        dotStyle: waiting && sc !== 'TFIN'
          ? "font:600 11px/1 'C11';background:#E9B341;color:#0B0A09;padding:3px 5px" : 'display:none',
        tabDotStyle: 'display:none'
      });
      /* 名單先撈起來，側欄的數字才會準 */
      if (!S.tfinData && !S.tfinLoading) loadTfin(L);
    }
  }

  function decorate(L, v) {
    trimMinerals(L);   /* 每一層最多四塊 */
    var S = L.state, sc = S.screen;
    var mob = S.device === 'mobile';
    var isRes = S.role === 'researcher';
    var chromeScreen = ['C01', 'C02', 'C03', 'C04', 'C05', 'STORY'].indexOf(sc) >= 0 || sc.charAt(0) === 'R';

    /* --- 外殼：演練模式＝原型工具列＋舞台框；實際使用＝滿版 --- */
    /* 開頭新增的兩頁各自有自己的插圖 */
    if (sc === 'STORY') {
      var pgs = L.storyPages(), cur = pgs[Math.min(S.storyIdx || 0, pgs.length - 1)] || {};
      v.storyArtBeast = cur.art === 'beast';
      v.storyArtTrade = cur.art === 'trade';

    /* 沙盒班級：功能一樣，但這一班的資料不進研究紀錄。要讓人看得出來。 */
    (function () {

      v.inSandbox = on;
      v.sandboxBarText = on

        : "";

        "font:400 11px/1.4 'C11';letter-spacing:.1em;color:#DCD4C6;text-shadow:0 1px 2px rgba(0,0,0,.8)";
    })();

    v.protoChrome = false;        /* 演練模式已移除，一律滿版 */
    v.exitDemo = function () {};
    v.scC05 = sc === 'C05';
    v.showMemberRows = false;     /* 組員名字不開放自由輸入 */
    v.liveMemberNote = sc === 'C04';

    v.shellStyle = isRes ? SHELL_RES : SHELL_LIVE;
    v.stageWrapStyle = 'display:block;width:100%;height:100%';

      (isRes ? '#0A0E12' : '#100E0C') + ';overflow:hidden;display:flex;flex-direction:column';
    v.isMobile = false;                       /* 不畫手機外框的假狀態列 */
    /* 要寫東西的頁在桌機用整個寬度（行長仍以 ch 收斂，不會拉成一整行難讀） */
    v.formW = mob ? 'max-width:100%' : 'max-width:min(100%,1180px)';
    v.showSideNav = !mob && !chromeScreen;
    v.showTabBar = mob && !chromeScreen;
    v.showIdBar = !isRes && !chromeScreen;

    v.showSignOut = !!S.signedIn;
    v.signOut = function () {
      var t = LIVE.token;
      LIVE.token = null; LIVE.user = null; store(TOKEN_KEY, null);
      if (t) call('apiLogout', t).catch(function () {});
      L.setState({ signedIn: false, screen: 'C01', role: 'student', tasks: [], otherSubs: [],
                   teamTasks: {}, gates: [], marks: [], resSlice: null, authError: '',
                   resConsent: false, acct: '', pw: '' });
    };

    /* --- 停留週數與學期週次分開顯示 ---
       state.weeksHere 在實際使用版是「學期第幾週」（甘特與研究者端要用），
       畫面上的「停留 N 週」一律取 state.stayWeeks。 */
    if (S.role === 'student') {
      v.weeksHere = S.stayWeeks || 1;
      v.navSub = LAYERNAME(S.currentLayer) + ' · 停留 ' + (S.stayWeeks || 1) + ' 週';

    } else if (S.role === 'teacher') {
      v.idMeta = L.klass().name + ' · ' + L.teams().length + ' 組　·　學期第 ' + (S.courseWeek || 1) + ' 週';

    /* 左上角那顆身分牌：三個角色三個顏色，一眼分得出現在是誰在看。
       三個顏色都避開系統裡已經有意思的那幾支——金是進度、青紫橘是各層、
       紅是被退回。身分牌只負責講「現在是誰」，不該跟那些撞。
       原型寫死 isStu ? 學生端 : 老師端——研究者登入會顯示「老師端」。 */
    (function () {
      var ROLE = {
        student:    { label: String.fromCharCode(23416,29983) + String.fromCharCode(31471), hue: "#E58BA8" },   /* 掘進的人：玫瑰 */
        teacher:    { label: String.fromCharCode(32769,24107) + String.fromCharCode(31471), hue: "#7CC98F" },   /* 在另一邊看的人：綠 */
        researcher: { label: String.fromCharCode(30740,31350,32773) + String.fromCharCode(31471), hue: "#8FA6C4" } /* 不介入的人：鋼藍 */
      };
      var r = ROLE[S.role];
      if (!r || !S.signedIn) return;
      v.idRole = r.label;
      v.idRoleStyle = "font:500 11px/1 " + String.fromCharCode(39) + "C11" + String.fromCharCode(39) +
        ";letter-spacing:.14em;padding:5px 8px;flex:none;white-space:nowrap;" +

            pick: function () {

              if (L.state.busy) return;

                .catch(function (e) { L.setState({ authError: e.message, busy: false }); });

  /* ---------- 證據上傳 ---------- */

  var KIND_META = {
    image: { label: '截圖', accept: 'image/*', glyph: 'polygon(0 0,100% 0,100% 100%,0 100%)' },
    doc:   { label: '文件', accept: '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.key,.pages,.numbers' },
    video: { label: '影片', accept: 'video/*' },
    link:  { label: '連結', accept: '' }
  };

  function fmtSize(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function pickFile(kind, onDone) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = KIND_META[kind].accept;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (f) onDone(f);
    });
    inp.click();
  }

  function uploadFile(L, file) {
    if (file.size > 10 * 1024 * 1024) {
      L.say('單檔上限 10 MB。影片建議放雲端硬碟或 YouTube，再用「連結」附上來。');
      return;
    }
    L.setState({ uploading: true, uploadName: file.name });
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1] || '';
      call('apiUploadFile', LIVE.token, L.state.openTaskId, file.name, file.type || 'application/octet-stream', b64)
        .then(function (r) {
          L.setState({ uploading: false, uploadName: '' });
          if (!r || !r.ok) { L.say((r && r.error) || '上傳失敗，請再試一次。'); return; }
          L.setState({ draftFiles: (L.state.draftFiles || []).concat([r.file]) });
          L.say('「' + r.file.name + '」上傳好了。');
        })
        .catch(function () { L.setState({ uploading: false, uploadName: '' }); L.say('上傳失敗，請再試一次。'); });
    };
    reader.onerror = function () { L.setState({ uploading: false, uploadName: '' }); L.say('讀不到這個檔案。'); };
    reader.readAsDataURL(file);
  }

  function openFile(L, f) {
    if (!f) return;
    if (f.kind === 'link') { window.open(f.url, '_blank', 'noopener'); return; }
    L.say('開啟「' + f.name + '」…');
    call('apiGetFile', LIVE.token, f.id).then(function (r) {
      if (!r || !r.ok) { L.say((r && r.error) || '開不起來。'); return; }
      var bin = atob(r.dataUrl.split(',')[1]);
      var buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([buf], { type: r.mimeType }));
      var w = window.open(url, '_blank', 'noopener');
      if (!w) {
        var a = document.createElement('a');
        a.href = url; a.download = r.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }).catch(function () { L.say('開不起來。'); });
  }

  function fileIcon(kind, size) {
    var col = kind === 'image' ? '#8FE4F0' : kind === 'video' ? '#F2A03C' : kind === 'link' ? '#E9B341' : '#C3BAAA';
    var clip = kind === 'image' ? 'polygon(0 0,100% 0,100% 100%,0 100%)'
             : kind === 'video' ? 'polygon(0 0,100% 50%,0 100%)'
             : kind === 'link' ? 'polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%)'
             : 'polygon(0 0,72% 0,100% 26%,100% 100%,0 100%)';
    return 'display:block;width:' + (size || 16) + 'px;height:' + (size || 16) + 'px;flex:none;background:' + col + ';opacity:.7;clip-path:' + clip;
  }

  /* ---------- 學生 ---------- */

  function decorateStudent(L, v) {
    var S = L.state;

    /* --- 這一組現在的狀態：送出前的自我判斷，老師會先看到 --- */
    var EFFORT = [
      ['fast',  '比預估快',   '#E9B341'],
      ['onpar', '跟預估差不多', '#C3BAAA'],
      ['slow',  '比預估慢',   '#D9603F']
    ];
    v.effortPicks = EFFORT.map(function (o) {
      var on = S.draftEffort === o[0];
      return {
        label: o[1],
        pick: function () { L.setState({ draftEffort: o[0] }); },
        style: "font:500 22px/1 'C11';padding:11px 15px;white-space:nowrap;cursor:pointer;background:" +
          (on ? 'rgba(233,179,65,.14)' : 'rgba(0,0,0,.26)') + ';border:1px solid ' +
          (on ? o[2] : '#2E2822') + ';color:' + (on ? o[2] : '#8A8073')
      };
    });
    v.reflectReqStyle = "font:600 11px/1 'C11';letter-spacing:.14em;padding:5px 9px;background:" +
      (S.draftEffort ? 'rgba(195,186,170,.12);color:#8A8073' : '#D9603F;color:#0B0A09');
    /* 只有比預估慢的才要交代原因——快跟差不多不用寫 */
    v.needEffortNote = S.draftEffort === 'slow';
    v.effortNoteLabel = '為什麼比預估慢（必填，一句話就好）';
    v.effortNote = S.draftEffortNote || '';
    v.setEffortNote = function (e) { L.setState({ draftEffortNote: e.target.value }); };

    v.setBlocker = function (e) { L.setState({ draftBlocker: e.target.value }); };

    /* --- 重交：讓他知道自己在重交，而且是重寫不是改字 --- */
    var openT = (S.tasks || []).filter(function (t) { return t.id === S.openTaskId; })[0] || {};
    var hist = S.taskHistory || null;
    var rejected = hist ? hist.rejected : 0;
    var attempts = hist ? hist.attempts : 0;

    v.isRetry = openT.status === 'needs_more';
    v.retryTitle = '第 ' + (attempts + 1) + ' 次交';
    v.retryCount = rejected ? '這一項已經被退回 ' + rejected + ' 次' : '';
    v.retryHint = '這一頁是空的——他要看的是你「改過之後」的版本，不是同一份再送一次。' +
      '先讀他退回的理由，再重寫一遍。上一次交的內容留在下面的往返紀錄裡，需要的話可以帶進來改。';
    /* 作業不是交在這裡，這一顆是「我做完了，請他確認」 */
    v.submitBtnLabel = (v.isRetry || attempts)
      ? '改好了，第 ' + (attempts + 1) + ' 次請他確認'
      : '我做完了，請他確認';

    v.hasHistory = !!(hist && hist.rounds && hist.rounds.length);
    v.history = roundRows(L, hist && hist.rounds, true);
    v.historyNote = hist
      ? '交過 ' + attempts + ' 次' + (rejected ? '，被退回 ' + rejected + ' 次' : '') +
        '。這一段你跟他都看得到——退回不是懲罰，是把「你以為做完了」跟「他認為算完成」的距離標出來。'
      : '';
    var last = v.hasHistory ? hist.rounds[hist.rounds.length - 1] : null;
    v.canCopyPrev = !!(last && String(last.text || '').trim() && !String(S.draftText || '').trim());
    v.copyPrev = function () {
      if (!last) return;
      L.setState({ draftText: last.text, draftFiles: (last.files || []).slice() });
      L.say('帶進來了。記得照他的理由改，不要原封不動再送一次。');
    };

    /* --- 排程納入主流程：沒排過就先在這裡排 --- */
    (function () {
      var tid = S.openTaskId;
      var task = (S.tasks || []).filter(function (x) { return x.id === tid; })[0] || null;
      var pl = tid ? planOf(S, tid) : null;
      var kl2 = L.KLASSES[S.klass] || {};
      var N2 = Math.max(6, Math.min(156, Number(kl2.semesterWeeks) || 18));
      var now2 = S.courseWeek || 1;
      var due = task ? L.dueWeek(task) : 0;

      v.needPlan = !!tid && !pl;
      v.planAccent = pl ? '#E9B341' : '#D9603F';
      v.planBox = 'padding:15px 17px;background:' +
        (pl ? 'rgba(233,179,65,.06)' : 'rgba(217,96,63,.09)') +
        ';border:1px solid ' + (pl ? '#3A3026' : '#5A2E22');
      v.planLabel = pl
        ? (pl.a === pl.b ? 'W' + pl.b : 'W' + pl.a + '–W' + pl.b)
        : '還沒排';
      v.planNote = pl
        ? '你當初排在' + (pl.a === pl.b ? '第 ' + pl.b + ' 週' : '第 ' + pl.a + '–' + pl.b + ' 週') +
          '，現在是第 ' + now2 + ' 週。' +
          (pl.b < now2 ? '比你排的晚了 ' + (now2 - pl.b) + ' 週——交的時候在下面說一下為什麼。'
            : pl.b > now2 ? '比你排的早。' : '就是這一週。') +

        : '先說你打算哪一週交，才交得出去。估錯不會怎麼樣——重點是有估過，期末才對得出你估得準不準。';

      v.goGantt = function () { L.say('這一項要哪一週交，直接在上面點就好。'); };

      var picks = [];
      for (var w = now2; w <= Math.min(N2, now2 + 5); w++) picks.push(w);

      v.planPicks = picks.map(function (w) {

          subStyle: "display:block;font:400 11px/1 'C11';color:" + (due === w ? '#E9B341' : '#5F574C') + ';margin-top:5px',
          style: "padding:10px 13px;font:500 22px/1 'C11';cursor:pointer;text-align:center;background:rgba(0,0,0,.3);" +
            'border:1px solid ' + (due === w ? '#5A4A2C' : '#2E2822') + ';color:#C3BAAA',
          pick: function () {
            var st2 = L.state;
            var np = {}; Object.keys(st2.plan || {}).forEach(function (k) { np[k] = st2.plan[k]; });
            np[tid] = { a: w, b: w };
            L.setState({ plan: np });
            call('apiSavePlan', LIVE.token, tid, w, w).catch(function () {});

    })();

    var origSubmit = v.submitTask;
    v.submitTask = function () {
      var st = L.state;
      var taskId = st.openTaskId, text = st.draftText, files = (st.draftFiles || []).slice();
      if (!planOf(st, taskId)) { L.say('先在上面說你打算哪一週交。有估過，期末才對得出你估得準不準。'); return; }
      /* 作業交在老師原本收的地方，所以文字與檔案都是選填。
         真正必填的是「做了如何」——勾完成之前一定要回答。 */
      if (v.hasChecks && !v.checkAllDone) {
        L.say('清單還有 ' + v.checkLeft + ' 條沒勾。做完一條勾一條，全部勾完才請得動他。'); return;
      }
      if (!st.draftEffort) { L.say('勾完成之前先回答「這一組現在的狀態」——這一項實際花的力氣，跟你們原本估的差多少。'); return; }
      if (st.draftEffort === 'slow' && !String(st.draftEffortNote || '').trim()) {
        L.say('你們說比預估慢——寫一句為什麼。期末回顧時，這一句就是你們自己留下的線索。'); return;
      }
      if (st.uploading) { L.say('還有檔案在上傳，等一下再送。'); return; }
      var reflect = { effort: st.draftEffort, effortNote: st.draftEffortNote || '', blocker: st.draftBlocker || '' };
      origSubmit();
      L.setState({ draftEffort: '', draftEffortNote: '', draftBlocker: '' });
      (function () {
        var task = (st.tasks || []).filter(function (x) { return x.id === taskId; })[0] || {};
        var LSx = layerState(L);
        var again = (task.rounds || []).length > 0 || task.status === 'needs_more';
        var EFFL = { fast: '比預估快', onpar: '跟預估差不多', slow: '比預估慢' };
        showMoment(L, {
          kind: 'submit', accent: '#C3BAAA',
          kicker: again ? 'RECHECKED' : 'MARKED DONE',
          title: again ? '改好了，等他再看一次' : '你勾了做完',
          lede: '「' + (task.title || '這一項') + '」等他去看。作業本身在他收的地方。',
          sprite: null,
          rows: [
            { k: '你們說', v: EFFL[reflect.effort] || '—', hi: reflect.effort === 'slow' },
            { k: '留了幾個入口', v: (files.length || 0) + ' 個' },
            { k: '這一層還差', v: Math.max(0, LSx.missingN + LSx.unopenedN - 1) + ' 塊' }
          ],
          quoteLabel: again ? '你這次改了什麼' : '你寫的（選填）',
          quote: String(text || '').slice(0, 160) + (String(text || '').length > 160 ? '…' : ''),
          lines: [ again
            ? '他會看到你前幾次交了什麼、他自己退回的理由，還有你這一次改了哪裡。'
            : '他排佇列是照各組停留週數，不是先交先看。等的時候可以去挖下一塊。' ],
          btn: '知道了', go: function () {}
        });
      })();
      call('apiSubmitItem', LIVE.token, taskId, text, files, reflect)
        .then(function (r) { if (!r || !r.ok) { L.say((r && r.error) || '沒有存到伺服器，請再交一次。'); } return refresh(); })
        .catch(function () { L.say('沒有存到伺服器，請再交一次。'); });
    };

    /* --- 證據：真的上傳到雲端硬碟 --- */
    var draft = S.draftFiles || [];
    v.evidence = draft.map(function (f, i) {
      return {
        name: f.name || String(f),
        meta: f.kind === 'link' ? '連結' : (KIND_META[f.kind] || {}).label + ' · ' + fmtSize(f.size),
        iconStyle: fileIcon(f.kind, 16),
        canOpen: true,
        open: function () { openFile(L, f); },
        remove: function () {
          L.setState({ draftFiles: (L.state.draftFiles || []).filter(function (_, j) { return j !== i; }) });
          if (f.id) call('apiDeleteFile', LIVE.token, f.id).catch(function () {});
        }
      };
    });
    v.evidenceAdders = ['image', 'doc', 'video', 'link'].map(function (k) {
      return {
        label: KIND_META[k].label,
        add: function () {
          if (k === 'link') { L.setState({ linkOpen: !L.state.linkOpen }); return; }
          pickFile(k, function (file) { uploadFile(L, file); });
        }
      };
    });
    v.uploading = !!S.uploading;
    v.uploadNote = '上傳中：' + (S.uploadName || '') + '　·　檔案越大越久，先別離開這一頁。';
    v.uploadHint = '不用把作業本體傳上來——那個照老師原本的方式交。這裡只是給他一個找得到的入口。單檔 10 MB，更大的用「連結」。';
    v.linkOpen = !!S.linkOpen;
    v.linkDraft = S.linkDraft || '';
    v.setLinkDraft = function (e) { L.setState({ linkDraft: e.target.value }); };
    v.addLink = function () {
      var raw = String(L.state.linkDraft || '').trim();
      if (!raw) { L.say('先貼上網址。'); return; }
      var url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      L.setState({
        draftFiles: (L.state.draftFiles || []).concat([{ kind: 'link', name: raw, url: url, size: 0 }]),
        linkDraft: '', linkOpen: false
      });
    };

    /* --- 送審三格 --- */
    v.gateWhy = '逐項確認看的是「這一項做完了沒有」；關卡看的是「這一層走完，你們變成什麼樣子」。' +
      '他看得到你們交了什麼，看不到你們怎麼走過來的——這三題只有你們答得出來。';
    v.gateWhyRows = [
      { n: '1', t: '路線：他有清單，但不知道你們實際怎麼走、在哪繞路。' },
      { n: '2', t: '你們自己：專題留下來的是能力，不是檔案。' },
      { n: '3', t: '下一層的起點：寫下來，回頭才知道估得準不準。' }
    ];
    v.gateFields = GATE_Q.map(function (g, i) {
      return {
        n: String(i + 1), q: g.q, hint: g.hint, ph: g.ph,
        value: (S.gateText || [])[i] || '',
        set: function (e) {
          var vals = (L.state.gateText || ['', '', '']).slice();
          vals[i] = e.target.value;
          L.setState({ gateText: vals });
        }
      };
    });

    /* 送審頁：擋住的時候要看得見原因，按鈕也要看起來按不下去 */
    var subWhy = gateBlockReason(L);
    v.subBlocked = !!subWhy;
    v.subBlockedWhy = subWhy;
    v.submitGateLabel = S.gateSending ? '送出中…' : subWhy ? '還不能送出' : '送出關卡審核';
    v.submitGateStyle = "font:500 22px/1 'C11';letter-spacing:.16em;text-indent:.16em;padding:15px var(--pad);" +
      'border:none;clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);' +
      (subWhy
        ? 'background:#3A3026;color:#8A8073;cursor:not-allowed'
        : 'background:#E9B341;color:#0B0A09;cursor:' + (S.gateSending ? 'wait' : 'pointer'));

    /* 原型的入口只看必要項、也沒看礦脈，這裡整顆按鈕改成跟後端同一套 */
    var passedHere = (S.passed || []).indexOf(S.currentLayer || 1) >= 0;
    v.gateBtn = (S.gateSubmitted || passedHere) ? '已送出' : subWhy ? '還不能送交關卡' : '送交關卡審核';
    v.gateBtnStyle = (!subWhy && !S.gateSubmitted && !passedHere)
      ? "font:500 22px/1 'C11';letter-spacing:.12em;color:#0B0A09;background:#E9B341;border:none;padding:14px 22px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)"
      : "font:500 22px/1 'C11';color:#4A443C;background:none;border:1px solid #2E2822;padding:14px 22px;cursor:not-allowed";

    v.goSubmitGate = function () {
      var why = gateBlockReason(L);
      if (why) { L.say(why); return; }
      if (L.state.gateSubmitted) { L.say('已經送出去了，等老師審。'); return; }
      L.go('SUB');
    };

    v.submitGate = function () {
      if (L.state.gateSending) return;
      var cells = (L.state.gateText || []).slice();
      /* 先擋在前面，理由跟後端一致 */
      var blocked = gateBlockReason(L);
      if (blocked) { L.say(blocked); return; }
      if (!String(cells[0] || '').trim()) { L.say('第一題先寫——他要知道你們實際走過的路。'); return; }
      if (!String(cells[1] || '').trim()) { L.say('第二題不能空著。這一層你們變成什麼樣子，只有你們答得出來。'); return; }
      if (!String(cells[2] || '').trim()) { L.say('第三題寫一句就好。下次回頭要拿它對照。'); return; }
      L.setState({ gateSending: true });
      call('apiSubmitGate', LIVE.token, cells)
        .then(function (r) {
          L.setState({ gateSending: false });
          if (!r || !r.ok) { L.say((r && r.error) || '沒有送到伺服器，請再送一次。'); return; }
          L.setState({ gateSubmitted: true, screen: 'S02' });
          (function () {
            var lay = L.LAYERS[(L.state.currentLayer || 1) - 1] || {};
            var sp = layerSprites(L, L.state.currentLayer || 1);
            showMoment(L, {
              kind: 'gate', art: 'gate', accent: '#C3BAAA',
              kicker: 'GATE SUBMITTED',
              title: (lay.name || '這一層') + ' · 關卡送出去了',
              lede: '三格寫完了，送出去了。',
              sprite: sp.tool || null,
              rows: [
                { k: '這一層', v: lay.name || '', hi: true },
                { k: '採到', v: layerState(L).veinN + ' 塊' },
                { k: '接下來', v: '等他審' }
              ],
              lines: [
                '他准了，這一層的礦石就鑄成「' + (lay.tool || '道具') + '」——擋在層底的那一隻會退開。',
                '牠倒下的地方會留下一件東西——那就是這一層的寶物。'
              ],
              btn: '知道了', go: function () {}
            });
          })();
          return refresh();
        })
        .catch(function () { L.setState({ gateSending: false }); L.say('沒有送到伺服器，請再送一次。'); });
    };

    decorateGantt(L, v);

    /* 看他組的通過紀錄時，三格的題目也要跟著換 */
    if (v.selTeam && v.selTeam.cells && v.selTeam.cells.length) {
      v.selTeam.cells = v.selTeam.cells.map(function (c, i) {
        return Object.assign({}, c, { q: (GATE_Q[i] || {}).q || c.q });
      });
    }


    /* 第五層的自訂命名要回寫 */
    if (v.setSpecName) {
      var origSetSpec = v.setSpecName;
      v.setSpecName = function (e) {
        origSetSpec(e);
        var key = L.state.specId, val = e.target.value;
        clearTimeout(LIVE.specTimer);
        LIVE.specTimer = setTimeout(function () {
          call('apiSaveSpecName', LIVE.token, key, val).catch(function () {});
        }, 700);
      };
    }

    /* 發道具動畫關閉後進新一層的故事頁 */
    v.closeReward = function () {
      var st = L.state;
      var lay = st.currentLayer;
      /* 第五層過了＝整套走完，直接進期末回顧（結局在那一頁） */
      if ((st.passed || []).indexOf(5) >= 0) {
        L.setState({ reward: null, screen: 'FINALE', finData: null });
        return;
      }
      L.setState({ reward: null, screen: 'STORY', storyIdx: 0, storyLayer: lay, storyFrom: 'S01', expanded: lay });
    };

    decorateRewards(L, v);
    decorateSections(L, v);   /* 這一步會重排 taskGroups，open 在裡面就綁好了 */
    decorateRules(L, v);
    decorateFinale(L, v);
    decorateProtoLeftovers(L, v);
    decorateCollect(L, v);
    decorateBoard(L, v);
    decorateDayNight(L, v);   /* 地表那一層照現實時間 */
    decorateLayerPanel(L, v);
    decorateHomeBand(L, v);   /* 首頁的「你在這裡」吃的是同一份 */
    decorateChecklist(L, v);  /* 老師開了清單就逐條勾 */
    decorateVow(L, v);        /* 這一項要拿哪一樣破法 */
    decorateGamble(L, v);     /* 勾完之後，送出前的那一下 */
    decorateDig(L, v);        /* 試挖與斗篷人的日誌 */
    decorateFinds(L, v);      /* 坑屑：隨機、零分、純收集 */
    decorateHaul(L, v);       /* 採量：全班的分數 */
    decorateRecord(L, v);     /* 任務紀錄與宣告命中率 */
    decorateHomeHaul(L, v);   /* 首頁的名冊摘要 */
    decorateTerm(L, v);       /* 時間軸：唯一共同的尺 */
    decorateSlimStats(L, v);  /* 首頁三張卡：礦石改成任務 */
    markVerdicts(L, v);       /* 地圖每一格直接顯示老師給不給過 */



    (v.ganttRows || []).forEach(function (row, i) {
      var t = L.myTasks()[i];
      if (t) row.open = openTask(L, t);
    });
  }

  /* 開一項。被退回的那一項＝重交：草稿清空，讓他重寫；上一次寫的東西移到往返紀錄裡。 */
  function openTask(L, t) {
    return function () {
      var retry = t.status === 'needs_more';
      L.setState({
        screen: 'S05', openTaskId: t.id,
        draftText: retry ? '' : (t.text || ''),
        draftFiles: retry ? [] : (t.files || []).slice(),
        draftEffort: retry ? '' : (t.effort || ''),
        draftEffortNote: retry ? '' : (t.effortNote || ''),
        draftBlocker: retry ? '' : (t.blocker || ''),
        linkOpen: false, linkDraft: '', taskHistory: null, historyFor: null
      });
      loadHistory(L, null, t.id);
    };
  }

  /* ---------- 往返紀錄（學生與老師看同一份） ---------- */

  function loadHistory(L, teamId, taskId) {
    var key = (teamId || '') + '::' + taskId;
    if (!taskId || L.state.historyFor === key) return;
    /* 可能在 render 途中被呼叫，延到下一輪再改狀態 */
    setTimeout(function () {
      if (L.state.historyFor === key) return;
      L.setState({ historyFor: key, taskHistory: null });
      call('apiTaskHistory', LIVE.token, teamId || '', taskId).then(function (r) {
        if (!r || !r.ok || L.state.historyFor !== key) return;
        L.setState({ taskHistory: r });
      }).catch(function () {});
    }, 0);
  }

  /* 關卡送審的三格。問的是「這一層你們走過來變成什麼樣子」，
     不是再交一次成果——成果他在逐項確認時已經看過了。 */
  var GATE_Q = [
    {
      q: '你在這一層的路上做了什麼事情',
      hint: '不用列清單，清單他手上有。寫你們實際走過的路：先做什麼、中途改了什麼、哪一段花掉最多時間。',
      ph: '例：前兩週三個方向同時試，第三週發現分不出優先序，砍到只剩一個。砍掉的兩個留在備用開挖點。'
    },
    {
      q: '你覺得你們在這階段有什麼變化',
      hint: '這一格問的是你們自己，不是作品。哪裡跟一開始不一樣了？誰接手了原本不會的事？哪個判斷現在做得比較快？',
      ph: '例：一開始三個人都在查資料，後來分成訪談、整理、決策三塊。現在誰該做什麼比較不用討論了。'
    },
    {
      q: '接下來要做什麼事情',
      hint: '下一層他一樣只給清單、不給路線。先講一次你們打算怎麼走，下次回頭就有東西可以對照。',
      ph: '例：下一層先把訪談全部排完再開始整理，不要邊訪邊改題目。'
    }
  ];

  var EFFORT_META = {
    fast:  ['他們說：比預估快', '#E9B341'],
    onpar: ['他們說：跟預估差不多', '#C3BAAA'],
    slow:  ['他們說：比預估慢', '#D9603F']
  };

  function roundRows(L, rounds, mine) {
    return (rounds || []).map(function (h) {
      var ok = h.result === 'pass' || h.result === 'auto';   /* 逾時自動暫准也算放行 */
      var fix = h.result === 'needfix';
      var col = ok ? '#E9B341' : fix ? '#D9603F' : '#8A8073';
      var eff = EFFORT_META[h.effort];
      return {
        label: '第 ' + h.n + ' 次交',
        color: col,
        meta: 'W' + h.week + (ok ? ' · 通過' : fix ? ' · 被退回' : ' · 還沒審'),
        effortLabel: eff ? (mine ? eff[0].replace('他們說：', '你當時說：') : eff[0]) : '',
        effortChip: eff
          ? "font:500 11px/1 'C11';letter-spacing:.08em;padding:5px 8px;background:rgba(0,0,0,.35);border:1px solid " + eff[1] + ';color:' + eff[1]
          : 'display:none',
        text: h.text ? (h.text.length > 160 ? h.text.slice(0, 160) + '…' : h.text) : '（沒有寫內容）',
        hasReason: !!String(h.reason || '').trim(),
        reason: h.reason || '',
        box: 'padding:12px 14px;background:' + (ok ? 'rgba(233,179,65,.05)' : fix ? 'rgba(217,96,63,.06)' : 'rgba(0,0,0,.26)') +
          ';border-left:2px solid ' + col
      };
    });
  }

  /* ---------- 完成之後會拿到什麼 ---------- */

  function mineralOf(L, name) {
    var m = L.MINS.filter(function (x) { return x.name === name; })[0];
    return m || null;
  }

  /* 借原型自己的 SPRITE 對照表取圖：老師視角不上鎖，所以暫時切過去問一次。
     學生要「先看到完成之後會拿到什麼」，圖本身不遮，遮的是它的介紹。 */
  function withOpenEyes(L, fn) {
    var was = L.state.role;
    L.state.role = 'teacher';
    try { return fn(); } finally { L.state.role = was; }
  }
  /* 樣式字串裡還是 assets/jlz/KEY.png（Runtime 套進 DOM 時才換），這裡自己換一次 */
  function dataUrlIn(style) {
    var m = /url\(assets\/jlz\/([A-Za-z0-9_\-]+)\.png\)/.exec(style || '');
    if (m) return (window.JLZ_SPRITES || {})[m[1]] || null;
    var d = /url\((data:image\/png[^)]+)\)/.exec(style || '');
    return d ? d[1] : null;
  }
  function mineralSprite(L, name, layer) {
    return withOpenEyes(L, function () {
      var cells = L.mineralCells(layer, false).filter(function (c) { return c.name === name; });
      return cells.length ? dataUrlIn(cells[0].glyphStyle) : null;
    });
  }
  function layerSprites(L, n) {
    return withOpenEyes(L, function () {
      var p = L.layerPanel(n);
      return { tool: dataUrlIn(p.toolIconStyle), treasure: dataUrlIn(p.treIconStyle) };
    });
  }

  function rewardOf(L, task) {
    if (!task || !task.mineral) {
      return { hasReward: false, rewardBox: 'display:none', rewardIcon: '', rewardLabel: '',
               rewardName: '', rewardNote: '', rewardColor: '#8A8073' };
    }
    var got = task.status === 'passed';
    /* 只有「已經破完」或「正在進行」的項目才揭露會採到什麼；還沒開始的維持 ？？？ */
    var working = task.status === 'submitted' || task.status === 'needs_more' ||
                  !!String(task.text || '').trim() || !!(task.files && task.files.length);
    var open = got || working;
    if (!open) {
      return { hasReward: false, rewardBox: 'display:none', rewardIcon: '', rewardLabel: '',
               rewardName: '', rewardNote: '', rewardColor: '#8A8073' };
    }

    var m = mineralOf(L, task.mineral);
    var icon = mineralSprite(L, task.mineral, (m && m.L) || task.layer);
    var iconStyle = icon
      ? 'display:block;width:32px;height:32px;flex:none;background:url(' + icon + ') center/contain no-repeat;image-rendering:pixelated;' +
        (got ? '' : 'opacity:.6;filter:saturate(.45) brightness(.88)')
      : 'display:block;width:32px;height:32px;flex:none;background:radial-gradient(circle at 50% 45%,rgba(233,179,65,.42),rgba(233,179,65,.06) 62%,transparent 74%);animation:dormant 5s ease-in-out infinite';

    return {
      hasReward: true,
      rewardBox: 'display:flex;align-items:center;gap:11px;margin-top:11px;padding:10px 12px;background:' +
        (got ? 'rgba(233,179,65,.07)' : 'rgba(233,179,65,.035)') +
        ';border:1px ' + (got ? 'solid #3A3026' : 'dashed #2E2822'),
      rewardIcon: iconStyle,
      rewardLabel: got ? '已採到的物證' : '這一項通過會採到',
      rewardName: task.mineral,
      rewardColor: got ? '#E9B341' : '#C3BAAA',
      rewardNote: got
        ? '已經在你的收藏裡。點地圖的收藏總覽可以看它是什麼。'
        : (m ? '對應環節：' + m.task + '　·　通過之後才看得到它長什麼樣、有什麼特性。' : '這一項通過時留下的物證。')
    };
  }

  function decorateRewards(L, v) {
    var S = L.state;

    /* S-02 每一項 */

  /* ---------- 地表到地心的 45 格：畫成一條看得見的路，不是一個數字 ---------- */
