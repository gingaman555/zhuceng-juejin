        'border:1px solid ' + (st.cleared || st.complete ? '#FFD98A' : fog ? '#2A251F' : hue) + ';' +
        'background:' + (st.cleared ? 'rgba(' + hexRgb(hue) + ',.9)' : st.complete ? '#E9B341'
          : fog ? 'rgba(0,0,0,.55)' : 'rgba(' + hexRgb(hue) + ',.2)') + ';' +
        (st.complete && !st.cleared ? 'box-shadow:0 0 12px rgba(233,179,65,.8);' : '') +
        'clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);',
      nameStyle: "display:block;font:400 11px/1.2 'C11';margin-top:3px;text-align:center;transform:scale(.72);" +
        'white-space:nowrap;color:' +
        (st.cleared || st.complete ? '#FFD98A' : fog ? '#332C25' : showBoss ? '#9A9184' : '#8A8073'),
      style: 'flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;' +
        'cursor:pointer;pointer-events:auto'
    };
  }

  /* 層底站著的那一隻。站在通道條的上緣，跟角色同一條地面線——
     牠是擋路的東西，不是飄在半空的裝飾，所以不用 bossFloat，
     呼吸的縮放也以腳底為原點。 */
  function bossOnGround(L, n, st, o) {
    o = o || {};
    var bz = bossOf(n);
    if (!bz || st.cleared) return null;          /* 打贏了就不站在那裡了 */
    var mob = L.state.device === 'mobile';
    var fog = !!o.fog;
    var awake = !fog && st.complete;
    var size = mob ? 44 : 56;
    return {
      tag: '', tagStyle: 'display:none',
      figStyle: 'display:block;width:' + size + 'px;height:' + size + 'px;' +
        'image-rendering:pixelated;transform-origin:bottom center;' +
        'background:url("' + bossSvg(bz, fog) + '") bottom center/contain no-repeat;' +
        (fog
          ? 'opacity:.4;animation:bossBreathe 5.2s ease-in-out infinite;'
          : awake
            ? 'animation:bossLoom .5s cubic-bezier(.2,.9,.3,1) both,' +
              'bossBreathe 3.2s ease-in-out infinite .5s,bossGlow 3.4s ease-in-out infinite .5s;'
            : 'opacity:.85;filter:brightness(' + (o.dim || '.55') + ');' +
              'animation:bossBreathe 4.4s ease-in-out infinite;'),
      open: o.open || function () {},
      style: 'position:absolute;z-index:2;left:' + cellLeft(o.idx, o.cellN, 0) + ';' +
        'bottom:' + (stripH(mob) + 9) + 'px;transform:translateX(-50%);' +
        'display:flex;flex-direction:column;align-items:center;' +
        'cursor:pointer;pointer-events:auto;background:none;border:none;padding:0'
    };
  }

  /* 微光荒原是地表那一層，所以它照現實時間有晝夜。
     地下四層不會變——洞窟裡本來就沒有天色。
     只改天色的疊層，場景圖本身不動。 */
  function skyPhase(now) {
    var h = (now || new Date()).getHours();
    if (h >= 5 && h < 7) {
      return {
        key: 'dawn', label: '清晨',
        /* 天光剛起，霧還沒散 */
        wash: 'linear-gradient(180deg,rgba(120,96,72,.30),rgba(40,34,26,.34) 55%,rgba(16,13,9,.42))',
        orb: '#F0D9A8', orbGlow: 'rgba(240,217,168,.45)', orbTop: 62, orbRight: 16,
        note: '天剛亮'
      };
    }
    if (h >= 7 && h < 17) {
      return {
        key: 'day', label: '白天',
        /* 荒原本來就沒什麼遮蔽，白天是亮的 */
        wash: 'linear-gradient(180deg,rgba(196,168,116,.26),rgba(120,100,70,.20) 50%,rgba(30,25,18,.34))',
        orb: '#FFE9B0', orbGlow: 'rgba(255,233,176,.55)', orbTop: 24, orbRight: 22,
        note: '看得見路'
      };
    }
    if (h >= 17 && h < 20) {
      return {
        key: 'dusk', label: '黃昏',
        wash: 'linear-gradient(180deg,rgba(190,104,52,.30),rgba(96,52,32,.26) 52%,rgba(22,15,10,.44))',
        orb: '#FF9B54', orbGlow: 'rgba(255,155,84,.5)', orbTop: 66, orbRight: 18,
        note: '光要收了'
      };
    }
    return {
      key: 'night', label: '夜晚',
      /* 微光荒原的「微光」在夜裡才看得出來 */
      wash: 'linear-gradient(180deg,rgba(18,26,48,.52),rgba(10,14,28,.50) 50%,rgba(4,5,10,.60))',
      orb: '#DDE6F5', orbGlow: 'rgba(221,230,245,.4)', orbTop: 22, orbRight: 20,
      note: '只剩礦石在發光'
    };
  }

  /* 夜裡撒幾顆星。位置固定（用索引算），不要每次重畫都跳位 */
  function starField(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var x = ((i * 37) % 100);
      var y = ((i * 61) % 46);
      var a = 0.25 + ((i * 17) % 40) / 100;
      out.push('radial-gradient(1px 1px at ' + x + '% ' + y + '%,rgba(255,255,255,' + a.toFixed(2) + '),transparent)');
    }
    return out.join(',');
  }

  function decorateDayNight(L, v) {
    var layers = v.mapLayers || [];
    if (!layers.length) return;
    var m = layers[0];                      /* 只有第一層是地表 */
    if (!m || !m.bandStyle) return;

    var ph = skyPhase();
    var extra = ph.key === 'night' ? starField(26) + ',' : '';

    /* 原本的 bandStyle 是 background:<漸層> , url(場景圖)…
       在最前面插一層天色，其餘原封不動 */
    m.bandStyle = String(m.bandStyle).replace('background:', 'background:' + extra + ph.wash + ',');

    m.hasSky = true;
    m.skyTag = ph.label + '　' + ph.note;
    m.skyOrbStyle = 'position:absolute;top:' + ph.orbTop + 'px;right:' + ph.orbRight + '%;z-index:1;' +
      'width:14px;height:14px;background:' + ph.orb + ';' +
      'box-shadow:0 0 18px 6px ' + ph.orbGlow + ';pointer-events:none;' +
      (ph.key === 'night'
        ? 'clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,68% 50%);'   /* 月 */
        : 'border-radius:50%;');
    m.skyTagStyle = 'position:absolute;left:var(--mcol);top:26px;z-index:2;' +
      "font:400 11px/1 'C11';letter-spacing:.16em;color:rgba(233,179,65,.7);" +
      'pointer-events:none;white-space:nowrap;transform:scale(.86);transform-origin:left top';
  }

  function decorateBoardTeacher(L, v) {
    var S = L.state;
    var mob = S.device === "mobile";
    var teams = L.teams() || [];

    var perLayer = [1, 2, 3, 4, 5].map(function (n) {
      var vein = (L.MINS || []).filter(function (m) { return m.L === n; });
      var items = (S.tasks || []).filter(function (t) { return t.layer === n; });
      var taken = {};
      items.forEach(function (t) { if (t.mineral) taken[t.mineral] = t; });
      var cleared = teams.length > 0 && teams.every(function (t) {
        return (t.passed || []).indexOf(n) >= 0;
      });
      var here = teams.filter(function (t) { return (t.layer || 1) === n; });
      return { n: n, vein: vein, byMineral: taken, openedN: Object.keys(taken).length,
               cleared: cleared, here: here };
    });

    var totalVein = perLayer.reduce(function (a, x) { return a + x.vein.length; }, 0) || MINS_TOTAL;
    var totalOpen = perLayer.reduce(function (a, x) { return a + x.openedN; }, 0);
    v.boardDone = totalOpen + " / " + totalVein + " 塊已開";
    v.boardLeft = (totalVein - totalOpen) + " 塊";
    v.boardStepNote = totalOpen >= totalVein
      ? "五層的礦脈都開完了。剩下就看各組採不採得齊。"
      : "一格就是你開的一項。還有 " + (totalVein - totalOpen) + " 塊沒開——開多開少不影響他們過不過關。";

    (v.mapLayers || []).forEach(function (m, i) {
      var n = i + 1;
      var st = perLayer[n - 1];
      var hue = BOARD_HUE[n - 1];
      var base = perLayer.slice(0, n - 1).reduce(function (a, x) { return a + x.vein.length; }, 0);

      var cells = st.vein.map(function (min, k) {
        var task = st.byMineral[min.name] || null;
        var open = !!task;
        return {
          idx: String(base + k + 1),
          name: open ? (task.title || min.task) : min.task,
          sub: min.name,
          mark: open ? "✓" : "·",
          open: function () {
            if (open) { L.setState({ screen: "T02", editLayer: n }); return; }
            L.setState({ screen: "T05", editLayer: n });
            L.say("「" + min.task + "」（" + min.name + "）還沒開。");
          },
          dotStyle: "display:flex;align-items:center;justify-content:center;width:100%;height:20px;" +
            "font:600 11px/1 'C11';transform:scale(.85);" +
            "color:" + (open ? "#0B0A09" : "#8A8073") + ";" +
            "border:1px solid " + (open ? hue : "#3A3026") + ";" +
            "background:" + (open ? "rgba(" + hexRgb(hue) + ",.85)" : "rgba(0,0,0,.4)") + ";",
          nameStyle: "display:block;font:400 11px/1.2 'C11';margin-top:3px;text-align:center;" +
            "transform:scale(.72);white-space:nowrap;color:" + (open ? "#FFD98A" : "#6E665A"),
          style: "flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;" +
            "cursor:pointer;pointer-events:auto"
        };
      });

      /* 層底那一格：跟學生端共用 endCell。老師沒有迷霧，
         而且他不是要過關的人——點下去是看那隻生物的介紹。 */
      cells.push(endCell(L, n, { cleared: st.cleared, complete: st.openedN >= st.vein.length && st.vein.length > 0 }, {
        fog: false,
        dim: '.7',
        blocked: function () { return ''; },
        onPass: function () {
          var b2 = bossOf(n);
          if (b2) { L.setState({ specFrom: S.screen, screen: 'S06', specId: b2.name }); return; }
          L.setState({ screen: 'T02', editLayer: n });
        }
      }));

      m.steps = cells;
      m.stepsStyle = stripStyle(mob, st.here.length > 0);
      m.stepsTag = "第 " + (base + 1) + "–" + (base + st.vein.length) + " 塊　·　你開了 " +
        st.openedN + "/" + st.vein.length;
      m.stepsTagStyle = "position:absolute;left:var(--mcol);top:9px;z-index:2;" +
        "font:400 11px/1 'C11';letter-spacing:.1em;color:" +
        (st.openedN >= st.vein.length ? "#FFD98A" : "#8A8073") +
        ";pointer-events:none;white-space:nowrap;transform:scale(.86);transform-origin:left top";

      /* 哪幾組在這一層 */
      m.others = othersChips(L, n, st.here, function (t) {
        return function () { L.setState({ screen: "T04", queueTeam: t.id }); };
      });
      m.runners = buildRunners(L, {
        cellN: cells.length, fog: false, mine: null, myIdx: 0, others: st.here,
        bossIdx: bossOf(n) && !st.cleared ? cells.length - 1 : null,
        /* 老師看的是真的：這一組在這一層採到第幾塊，就站在第幾格 */
        realIdx: function (t) {
          var g = Number((t.got || {})[n]) || 0;
          return Math.min(cells.length - 1, g);
        },
        openTeam: function (t) {
          return function () { L.setState({ screen: "T04", queueTeam: t.id }); };
        },
        openCrowd: function (list, sc) { crowdPage(L, n, list, sc); }
      });
      var bgT = bossOnGround(L, n, { cleared: st.cleared, complete: st.openedN >= st.vein.length && st.vein.length > 0 }, {
        fog: false, dim: '.7', idx: cells.length - 1, cellN: cells.length,
        open: cells[cells.length - 1].open
      });
      if (bgT) m.runners.push(bgT);

      m.hasOthers = st.here.length > 0;
      m.othersStyle = "position:absolute;right:13px;top:8px;z-index:3;display:flex;flex-wrap:nowrap;" +
        "gap:5px;justify-content:flex-end;max-width:58%;overflow:hidden";
      m.othersNote = st.here.length + " 組在這一層";
      m.othersNoteStyle = "font:400 11px/1 'C11';letter-spacing:.1em;color:#8A8073;align-self:center;transform:scale(.86)";
    });
  }

  /* ============================================================
     地圖上的角色：一層一層橫向走過去，走完那一層才往下一層。
     像素圖直接寫成 SVG data URI，兩張腳輪流開關——所以放在
     background-image 裡也跑得動。自己那一隻會跑，別組的站著。
     ============================================================ */
  var RUNNER_HUE = {
    H: '#E9B341',   /* 安全帽 */
    L: '#FFF0B8',   /* 頭燈 */
    N: '#3A3026',   /* 帽簷、領口 */
    S: '#D8B48C',   /* 臉 */
    D: '#2A241C',   /* 眼睛 */
    '#': '#6B5A3E', /* 工作服 */
    B: '#2E2822'    /* 靴子 */
  };

  /* 身體：y0–y10。面朝右。 */
  var RUNNER_BODY = [
    '...HHHHHH...',
    '..HHHHHHHH..',
    '.LHHHHHHHH..',
    '.NNNNNNNNN..',
    '...SSSSDS...',
    '....SSSS....',
    '...NNNNNN...',
    '..########..',
    '..########..',
    '..###HH###..',
    '...######...'
  ];
  /* 跨步：y11–y15 */
  var RUNNER_LEG_A = [
    '...##.##....',
    '..##...##...',
    '..##....##..',
    '.##......#..',
    'BBB.....BBB.'
  ];
  /* 併腳（這一格整個人抬高一格） */
  var RUNNER_LEG_B = [
    '...#####....',
    '...##.##....',
    '...##.##....',
    '...##.##....',
    '..BBB.BBB...'
  ];

  function pxRows(rows, y0, hue, out) {
    rows.forEach(function (row, i) {
      var y = y0 + i, x = 0;
      while (x < row.length) {
        var c = row[x];
        if (c === '.') { x++; continue; }
        var w = 1;
        while (x + w < row.length && row[x + w] === c) w++;
        out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="1" fill="' +
          (hue[c] || hue['#']) + '"/>');
        x += w;
      }
    });
  }

  var RUNNER_CACHE = {};
  var RUN_PHASE = ['0s', '-.08s', '-.16s', '-.24s'];
  function runnerSvg(running, phase) {
    var d = RUN_PHASE[(phase || 0) % RUN_PHASE.length];
    var key = running ? ('run' + d) : 'idle';
    if (RUNNER_CACHE[key]) return RUNNER_CACHE[key];
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16" shape-rendering="crispEdges">'];
    if (running) {
      out.push('<style>' +
        '@keyframes jlzStepA{0%,49%{opacity:1}50%,100%{opacity:0}}' +
        '@keyframes jlzStepB{0%,49%{opacity:0}50%,100%{opacity:1}}' +
        '@keyframes jlzBob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-1px)}}' +
        '.la{animation:jlzStepA .32s steps(1,end) infinite ' + d + '}' +
        '.lb{animation:jlzStepB .32s steps(1,end) infinite ' + d + '}' +
        '.bd{animation:jlzBob .32s steps(1,end) infinite ' + d + '}' +
        '</style>');
    }
    out.push('<g class="' + (running ? 'bd' : '') + '">');
    pxRows(RUNNER_BODY, 0, RUNNER_HUE, out);
    out.push('<g class="' + (running ? 'la' : '') + '">');
    pxRows(RUNNER_LEG_A, 11, RUNNER_HUE, out);
    out.push('</g>');
    if (running) {
      out.push('<g class="lb" opacity="0">');
      pxRows(RUNNER_LEG_B, 11, RUNNER_HUE, out);
      out.push('</g>');
    }
    out.push('</g></svg>');
    RUNNER_CACHE[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join(''));
    return RUNNER_CACHE[key];
  }

  /* 通道條固定高度，五層的地面才會齊平——踩在上面的人也才站得穩 */
  function stripH(mob) { return mob ? 48 : 52; }
  function stripStyle(mob, lit) {
    return 'position:absolute;left:var(--mcol);right:13px;bottom:9px;z-index:2;box-sizing:border-box;' +
      'height:' + stripH(mob) + 'px;display:flex;align-items:flex-end;gap:3px;padding:5px 7px;' +
      'background:rgba(6,5,4,.62);border-top:2px solid ' +
      (lit ? 'rgba(233,179,65,.45)' : 'rgba(255,255,255,.1)');
  }

  /* 第 idx 格的中心落在通道條的哪個比例上 */
  function cellLeft(idx, cellN, dx) {
    var frac = ((idx + 0.5) / Math.max(1, cellN)).toFixed(4);
    var off = !dx ? '' : (dx > 0 ? ' + ' + dx + 'px' : ' - ' + (-dx) + 'px');
    return 'calc(var(--mcol) + 7px + (100% - var(--mcol) - 27px) * ' + frac + off + ')';
  }

  /* 同一格站了好幾組時的排法：
     自己永遠在正中間、最前面；別組往兩側各讓一步；超過三組收成一個「+N」，
     點下去列出這一格有誰。人再多畫面也只會有四個東西。 */
  var RUN_DX = [0, -17, 17, -34, 34];

  function buildRunners(L, opt) {
    var mob = L.state.device === 'mobile';
    var bottom = stripH(mob) + 9;
    var cellN = Math.max(1, opt.cellN);
    var at = {};
    var put = function (idx, t, isMe) {
      idx = Math.max(0, Math.min(cellN - 1, idx));
      (at[idx] = at[idx] || []).push({ t: t, me: isMe });
    };
    if (opt.mine) put(opt.myIdx, opt.mine, true);
    var rest = opt.others || [];
    var span = Math.max(1, cellN - 1);
    rest.forEach(function (t, i) {
      /* 老師看得到各組真正採到第幾塊，就站在那一格；
         學生端沒有那份資料（也不該有），平均散開，讀起來是「他們也在這一層」。 */
      if (opt.realIdx) { put(opt.realIdx(t), t, false); return; }
      put(Math.round((i + 1) * (span - 1) / (rest.length + 1)), t, false);
    });

    var out = [];
    Object.keys(at).forEach(function (k) {
      var idx = +k;
      var pack = at[k].slice().sort(function (a, b) { return (b.me ? 1 : 0) - (a.me ? 1 : 0); });
      var over = pack.length > 3 ? pack.slice(3) : [];
      var show = over.length ? pack.slice(0, 3) : pack;
      /* 層底那一格站著生物，人要排在牠前面（左邊），不然疊在一起 */
      var atBoss = opt.bossIdx != null && idx === opt.bossIdx;
      var dxs = atBoss ? [-24, -42, -60] : RUN_DX;
      var chipDx = atBoss ? -78 : 34;
      show.forEach(function (p, i) {
        var kind = p.me ? 'me' : opt.fog ? 'fog' : 'other';
        var size = p.me ? 30 : 26;
        var walking = kind !== 'fog';
        out.push({
          tag: p.me ? String.fromCharCode(20320) : '',
          tagStyle: p.me
            ? "font:500 11px/1 'C11';padding:3px 5px;white-space:nowrap;background:rgba(6,5,10,.85);" +
              'border:1px solid #E9B341;color:#E9B341;transform:scale(.9)'
            : 'display:none',
          figStyle: 'display:block;width:' + size + 'px;height:' + size + 'px;' +
            'background:url("' + runnerSvg(walking, idx + i) + '") center bottom/contain no-repeat;' +
            'image-rendering:pixelated;' +
            (kind === 'me' ? 'filter:drop-shadow(0 0 7px rgba(233,179,65,.75));'
              : kind === 'fog' ? 'filter:grayscale(1) brightness(.34);opacity:.55;'
              : 'filter:saturate(.3) brightness(.8);opacity:.9;'),
          open: opt.openTeam(p.t, p.me),
          style: 'position:absolute;z-index:' + (p.me ? 6 : 4 - i) + ';' +
            'left:' + cellLeft(idx, cellN, dxs[i] || 0) + ';bottom:' + bottom + 'px;' +
            'transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;' +
            'cursor:pointer;pointer-events:auto;background:none;border:none;padding:0'
        });
      });
      if (over.length) {
        var names = pack.map(function (p) { return p.t; });
        out.push({
          tag: '+' + over.length,
          tagStyle: "font:600 11px/1 'C11';padding:4px 6px;white-space:nowrap;" +
            'background:rgba(6,5,10,.9);border:1px solid #5A5044;color:#C3BAAA;transform:scale(.9)',
          figStyle: 'display:block;width:22px;height:22px;' +
            'background:url("' + runnerSvg(false) + '") center bottom/contain no-repeat;' +
            'image-rendering:pixelated;filter:grayscale(1) brightness(.55);opacity:.75',
          open: function () { opt.openCrowd(names, 'tile'); },
          style: 'position:absolute;z-index:3;left:' + cellLeft(idx, cellN, chipDx) + ';' +
            'bottom:' + bottom + 'px;transform:translateX(-50%);display:flex;flex-direction:column;' +
            'align-items:center;gap:3px;cursor:pointer;pointer-events:auto;background:none;border:none;padding:0'
        });
      }
    });
    return out;
  }

  /* 右上角的名牌只留一行——底下那排角色才是主角。
     超過兩組就併成一顆，點下去把整層的人列出來。 */
  function othersChips(L, n, list, openOne) {
    /* 手機的層帶只有 132px 高、名牌會壓到走在通道上的角色。
       小螢幕只留一句「幾組在這一層」，名字點角色去看。 */
    if (L.state.device === 'mobile') return [];
    var chip = function (border) {
      return 'display:inline-flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;' +
        "font:400 11px/1 'C11';white-space:nowrap;background:rgba(6,5,4,.72);" +
        'border:1px solid ' + border + ';color:#C3BAAA';
    };
    var out = list.slice(0, 2).map(function (t) {
      return {
        name: t.name,
        meta: '停留 ' + (t.weeks || 1) + ' 週',
        open: openOne(t),
        style: chip((t.passed || []).length ? '#5A4A2C' : '#3A3026')
      };
    });
    if (list.length > 2) {
      out.push({
        name: '+' + (list.length - 2) + ' 組',
        meta: '',
        open: function () { crowdPage(L, n, list, 'layer'); },
        style: chip('#5A5044')
      });
    }
    return out;
  }

  /* 「這一格有誰」：人多的時候點 +N 開出來 */
  function crowdPage(L, n, teams, scope) {
    var lay = L.LAYERS[n - 1] || {};
    /* scope：tile 是通道上那一格，layer 是整層 */
    var lede = scope === 'tile'
      ? '這一格站了 ' + teams.length + ' 組。'
      : '這一層同時有 ' + teams.length + ' 組。';
    showMoment(L, {
      kind: 'help', art: 'help', accent: '#C3BAAA',
      kicker: 'WHO IS HERE',
      title: (lay.name || ('第' + n + '層')) + '上的人',
      lede: lede + '站在哪一格不代表他們採到哪一塊——那是他們自己的進度。',
      rows: teams.map(function (t) {
        return { k: t.name, v: '停留 ' + (t.weeks || 1) + ' 週', hi: !!t.me };
      }),
      btn: '知道了', go: function () {}
    });
  }

  /* 層詳情（在地圖上點某一層看介紹）。學生端與老師端共用。
     道具卡：原型用「工具階級」判斷拿到沒，但工具校準整套移除之後那個值永遠是空的
     ——通過了也顯示 ？？？。改成跟寶物一樣看「這一層通過沒」。 */
  function decorateLayerPanel(L, v) {
    var S = L.state;
    if (!v.sel) return;
    var n = S.expanded || S.currentLayer || 1;
    var lay = L.LAYERS[n - 1] || {};
    var done = (S.passed || []).indexOf(n) >= 0 || S.role === 'teacher' || !!S.allOpen;
    var bz = bossOf(n);
    /* done 是「這一層的東西可不可以揭露」，老師一律看得到；
       擊退與否是學生自己的事，老師沒有在打。 */
    var beaten = S.role !== 'teacher' && (S.passed || []).indexOf(n) >= 0;
    v.sel.toolName = done ? (lay.tool || '？？？') : '？？？';
    v.sel.toolNameColor = done ? '#E9B341' : '#5A5044';
    v.sel.toolDesc = done
      ? (lay.toolFunc || '')
      : (bz
          ? '老師准你們往下了，才鑄得出來——用它擊退' + bz.name + '。'
          : '老師准你們往下了，才鑄得出來。');
    v.sel.toolCardStyle = 'padding:13px;background:' +
      (done ? 'rgba(233,179,65,.07)' : 'rgba(0,0,0,.25)') +
      ';border:1px ' + (done ? 'solid #3A3026' : 'dashed #2E2822');

    /* 這一層層底站著誰。點下去就是那隻生物的完整介紹。 */
    /* 寶物卡下面那句：它是誰留下的 */
    v.sel.treFrom = bz
      ? '擊退' + bz.name + '之後，牠站的地方留下的。'
      : '走到最深處才拿得到。';

    /* 這一層對這一組是什麼，用老師放行時說的那句話。
       每個老師對每一組的規劃都不同，班級層級的標籤不可能對。 */
    var said = layerLabel(L, n);
    if (said) v.sel.course = said;

    v.sel.hasBoss = !!bz;
    if (bz) {
      var bt2 = BOSS_TEXT[n] || {};
      v.sel.bossCardStyle = 'display:flex;align-items:center;gap:14px;width:100%;text-align:left;' +
        'padding:13px 15px;margin-bottom:13px;cursor:pointer;background:' +
        (beaten ? 'rgba(0,0,0,.25)' : 'rgba(233,179,65,.06)') +
        ';border:1px solid ' + (beaten ? '#2E2822' : '#3A3026');
      v.sel.bossArtStyle = 'flex:none;display:block;width:62px;height:62px;image-rendering:pixelated;' +
        'background:url("' + bossSvg(bz, false) + '") center/contain no-repeat;' +
        (beaten
          ? 'opacity:.42;filter:grayscale(1);'
          : 'animation:bossFloat 2.8s ease-in-out infinite,bossBreathe 4.4s ease-in-out infinite;');
      v.sel.bossKicker = beaten ? '已擊退' : '守關生物';
      v.sel.bossKickerColor = beaten ? '#5F574C' : '#8A8073';
      v.sel.bossName = bz.name;
      v.sel.bossNameColor = beaten ? '#5F574C' : bz.hue['#'];
      v.sel.bossNote = beaten
        ? (bt2.beat || '這一層已經過了。')
        : (bt2.trait || '擋在層底。');
      v.sel.bossMoreStyle = "flex:none;font:400 22px/1 'C11';color:#E9B341;" +
        "border:1px solid #5A4A2C;padding:9px 13px;background:rgba(233,179,65,.07)";
      v.sel.openBoss = function () {
        L.setState({ specFrom: S.screen, screen: 'S06', specId: bz.name });
      };
    } else {
      v.sel.bossCardStyle = 'display:none'; v.sel.bossArtStyle = ''; v.sel.bossKicker = '';
      v.sel.bossKickerColor = ''; v.sel.bossName = ''; v.sel.bossNameColor = '';
      v.sel.bossNote = ''; v.sel.bossMoreStyle = 'display:none';
      v.sel.openBoss = function () {};
    }
  }

  /* T-08「學生端的世界」右邊那張卡：本來是過關給的寶物，
     改成層底站著誰。老師要先知道學生會撞上什麼，寶物在圖鑑
     與層詳情裡本來就看得到。第五層沒有生物，維持原本的寶物。 */
  function decorateWorld(L, v) {
    (v.worldLayers || []).forEach(function (w, i) {
      var n = i + 1;
      var bz = bossOf(n);
      if (!bz) {
        w.treKicker = '過關給的寶物';
        w.treKickerColor = '#5F574C';
        w.treCardStyle = 'flex:1;min-width:210px;display:flex;gap:11px;padding:12px 14px;' +
          'text-align:left;font:inherit;color:inherit;cursor:pointer;' +
          'background:rgba(0,0,0,.28);border:none;border-left:2px solid #3A3026';
        return;
      }
      var bt = BOSS_TEXT[n] || {};
      w.treKicker = '層底的守關生物';
      w.treKickerColor = bz.hue['#'];
      w.treCardStyle = 'flex:1;min-width:210px;display:flex;gap:11px;padding:12px 14px;' +
        'text-align:left;font:inherit;color:inherit;cursor:pointer;' +
        'background:rgba(0,0,0,.34);border:none;border-left:2px solid ' + bz.hue['#'];
      w.treIcon = 'display:block;width:34px;height:34px;flex:none;image-rendering:pixelated;' +
        'background:url("' + bossSvg(bz, false) + '") center/contain no-repeat';
      w.treasure = bz.name;
      w.treLine = bt.trait || '';
      w.openTre = function () {
        L.setState({ specFrom: L.state.screen, screen: 'S06', specId: bz.name });
      };
    });
  }

  /* ============================================================
     老師首頁的「你寫的東西」。
     他整學期都在寫合格考量，卻沒有一個地方告訴他那些字後來怎麼了。
     一層一列，一格＝一件他審過的；顏色說的是那一件的下場。
     ============================================================ */

  /* 一排像素方格，畫成 SVG data URI——跟地圖同一套語言 */
  var MARK_PX = 13;   /* 一格在畫面上多大 */
  function markBar(groups, cap) {
    var CELL = 7, GAP = 2, H = 9;
    var flat = [];
    groups.forEach(function (g) {
      for (var i = 0; i < g.n && flat.length < cap; i++) flat.push(g);
    });
    if (!flat.length) return { url: '', n: 0 };
    /* 尾巴留一個間隙，viewBox 就是 n:1，height 給 MARK_PX 時每格剛好是正方形 */
    var w = flat.length * (CELL + GAP);
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + H +
               '" shape-rendering="crispEdges">'];
    flat.forEach(function (g, i) {
      var x = i * (CELL + GAP);
      out.push('<rect x="' + x + '" y="1" width="' + CELL + '" height="' + CELL +
        '" fill="' + g.fill + '" stroke="' + g.stroke + '" stroke-width="1"/>');
    });
    out.push('</svg>');
    return { url: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join('')), n: flat.length };
  }

  function markStyle(bar) {
    return 'flex:0 0 auto;display:block;height:' + MARK_PX + 'px;width:' + (bar.n * MARK_PX) + 'px;' +
      'image-rendering:pixelated;background:url("' + bar.url + '") left center/100% 100% no-repeat';
  }

  function loadMirror(L) {
    if (L.state.mirrorLoading) return;
    L.setState({ mirrorLoading: true });
    call('apiTeacherMirror', LIVE.token)
      .then(function (r) { L.setState({ mirrorLoading: false, mirrorData: (r && r.ok) ? r : null }); })
      .catch(function () { L.setState({ mirrorLoading: false, mirrorData: null }); });
  }

  function decorateMirror(L, v) {
    var S = L.state;
    v.hasMirror = false;
    v.mirrorRows = [];
    v.mirrorBox = 'display:none';
    v.hasMirrorCase = false;
    v.mirrorFateStyle = 'display:none';
    v.mirrorCaseBox = 'display:none';
    v.mirrorCaseQ = ''; v.mirrorCaseA = '';
    v.mirrorCaseQStyle = 'display:none'; v.mirrorCaseAStyle = 'display:none';
    if (S.role !== 'teacher' || !S.signedIn) return;
    if (S.screen !== 'T01') return;
    if (!S.mirrorData && !S.mirrorLoading) { loadMirror(L); return; }

    var mob = S.device === 'mobile';
    var d = S.mirrorData;
    if (!d || !d.total || !d.total.n) return;   /* 還沒審過東西就先不出現 */
    var t = d.total, la = d.landed || { n: 0, again: 0, waiting: 0 };

    v.hasMirror = true;
    v.mirrorBox = 'margin:0 var(--pad) 16px;padding:16px 18px;background:#14110E;border:1px solid #26211C';
    v.mirrorKick = 'YOUR WORDS';
    v.mirrorKickStyle = "font:400 11px/1 'C11';letter-spacing:.26em;color:#5F574C";

    v.mirrorHead = t.needfix
      ? '你退回 ' + t.needfix + ' 件，其中 ' + la.n + ' 件下一次就過了。'
      : '你寫了 ' + t.n + ' 件合格考量，還沒退回過任何一件。';
    v.mirrorHeadStyle = "font:700 22px/1.5 'C11';color:#E8E2D6;margin-top:9px;text-wrap:pretty";

    /* 退回的那些後來怎麼了：一格一件，最重要的一條 */
    var fate = markBar([
      { n: la.n,       fill: '#E9B341', stroke: '#E9B341' },
      { n: la.again,   fill: 'rgba(217,96,63,.18)', stroke: '#D9603F' },
      { n: la.waiting, fill: 'rgba(0,0,0,.4)', stroke: '#4A443C' }
    ], 40);
    v.mirrorFateStyle = fate.n ? markStyle(fate) + ';margin-top:11px' : 'display:none';

    v.mirrorLede = '你寫了 ' + t.n + ' 件、共 ' + t.words + ' 字。學生拿這些字當下一次的標準。';
    v.mirrorLedeStyle = "font:400 11px/1.7 'C11';color:#8A8073;margin-top:6px;text-wrap:pretty";

    v.mirrorRowsStyle = 'display:flex;flex-direction:column;gap:7px;margin-top:14px';

    var CAP = 28;
    v.mirrorRows = (d.layers || []).filter(function (x) { return x.n > 0; }).map(function (x) {
      var hue = BOARD_HUE[x.layer - 1];
      var bar = markBar([
        { n: x.landed,  fill: '#E9B341', stroke: '#E9B341' },                    /* 接住了 */
        { n: x.n - x.needfix, fill: 'rgba(' + hexRgb(hue) + ',.5)', stroke: hue },/* 你放行的 */
        { n: x.again,   fill: 'rgba(217,96,63,.18)', stroke: '#D9603F' },        /* 又被退 */
        { n: x.waiting, fill: 'rgba(0,0,0,.4)', stroke: '#4A443C' }              /* 還在路上 */
      ], CAP);
      var over = x.n > CAP ? '　+' + (x.n - CAP) : '';
      return {
        name: 'L' + x.layer + '　' + LAYERNAME(x.layer),
        nameStyle: "flex:0 0 auto;min-width:104px;font:400 11px/1 'C11';color:#9A9184;white-space:nowrap",
        barStyle: markStyle(bar),
        meta: x.needfix
          ? x.n + ' 件 · 退 ' + x.needfix + ' → 接住 ' + x.landed + '　平均 ' + x.avgLen + ' 字' + over
          : x.n + ' 件 · 沒退過　平均 ' + x.avgLen + ' 字' + over,
        /* 窄螢幕放不下就整句掉到下一行，不要被切掉 */
        metaStyle: (mob ? "flex:1 1 100%;text-align:left;margin-top:2px;" : "flex:1 1 130px;text-align:right;") +
          "min-width:0;font:400 11px/1.6 'C11';color:#6E665A;text-wrap:pretty",
        rowStyle: 'display:flex;align-items:center;gap:10px;flex-wrap:wrap'
      };
    });

    v.mirrorKey = '■ 退回後下一次就過　■ 你放行的　□ 又被退　□ 還沒重交';
    v.mirrorKeyStyle = "font:400 11px/1.6 'C11';color:#5F574C;margin-top:12px;text-wrap:pretty";

    /* 一個實例：你寫了這一句，他們重寫成什麼樣子然後過了。
       數字說不了「我的話有落地」，這一句可以。 */
    var c0 = (d.cases || [])[0];
    v.hasMirrorCase = !!c0;
    if (c0) {
      var q = String(c0.reason || '').replace(/\s+/g, ' ');
      if (q.length > 22) q = q.slice(0, 21) + '…';
      v.mirrorCaseBox = 'margin-top:12px;padding:9px 12px;background:rgba(233,179,65,.05);' +
        'border-left:2px solid #5A4A2C';
      v.mirrorCaseQ = '「' + q + '」　→　' + c0.before + ' 字變 ' + c0.after + ' 字，過了';
      v.mirrorCaseQStyle = "font:400 11px/1.6 'C11';color:#C3BAAA;text-wrap:pretty";
      v.mirrorCaseA = ''; v.mirrorCaseAStyle = 'display:none';
    } else {
      v.mirrorCaseBox = 'display:none'; v.mirrorCaseQ = ''; v.mirrorCaseQStyle = 'display:none';
      v.mirrorCaseA = ''; v.mirrorCaseAStyle = 'display:none';
    }

    var foot = [];
    if (t.avgLat) foot.push('他們平均等你 ' + t.avgLat + ' 小時');
    if (t.passedN) foot.push('每一項平均來回 ' + t.avgRounds + ' 次');
    if (la.again) foot.push(la.again + ' 件退了又退——那幾件值得回頭看你寫了什麼');
    v.mirrorFoot = foot.join('　·　') + (foot.length ? '。' : '');
    v.mirrorFootStyle = "font:400 11px/1.7 'C11';color:#8A8073;margin-top:8px;text-wrap:pretty";
  }

  /* ============================================================
     啟動頁。原本只有一顆羅盤跟標題，靜的。
     改成：標題浮在地表上，礦工從左邊走過去，腳下是五層岩層，
     深處有四個還看不清楚的東西。天色照現實時間，跟第一層同一套。
     ============================================================ */

  /* 岩層固定 112px 高：畫面拉高拉低，地表線都不會跑上去壓到按鈕 */
  var BOOT_DEPTH = 112;

  function strataBg() {
    var st = [];
    for (var i = 0; i < 5; i++) {
      var a = (i * 20) + '%', b = ((i + 1) * 20) + '%';
      /* 每一層的頂緣留一條那一層的顏色，越深越暗 */
      st.push('rgba(' + hexRgb(BOARD_HUE[i]) + ',' + (0.46 - i * 0.06).toFixed(2) + ') ' + a +
        ' calc(' + a + ' + 1px)');
      st.push('rgba(' + (15 - i * 2) + ',' + (13 - i * 2) + ',' + (11 - i * 2) + ',.97)' +
        ' calc(' + a + ' + 1px) ' + b);
    }
    return 'linear-gradient(180deg,' + st.join(',') + ')';
  }

  /* 標題上那一顆羅盤。錶面跟指針拆成兩張圖：
     指針要能被外面轉，烤在同一張 SVG 裡就轉不動了。 */
  var ORB_CACHE = {};

  function dialSvg() {
    if (ORB_CACHE.dial) return ORB_CACHE.dial;
    var S = 24, c = (S - 1) / 2, rows = [];
    for (var y = 0; y < S; y++) {
      var line = '';
      for (var x = 0; x < S; x++) {
        var d = Math.sqrt((x - c) * (x - c) + (y - c) * (y - c));
        line += d >= 9.4 && d <= 11.6 ? '#' : d < 9.4 ? 'o' : '.';
      }
      rows.push(line);
    }
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">'];
    pxRows(rows, 0, { '#': '#E9B341', o: '#12161F' }, out);
    /* 四個方位的刻度，正下方那一個亮——沒人拉的時候它就指在那裡 */
    [[11, 3, '#5A5044'], [20, 11, '#5A5044'], [3, 11, '#5A5044'], [11, 19, '#E9B341']]
      .forEach(function (t) {
        out.push('<rect x="' + t[0] + '" y="' + t[1] + '" width="2" height="2" fill="' + t[2] + '"/>');
      });
    out.push('</svg>');
    ORB_CACHE.dial = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join(''));
    return ORB_CACHE.dial;
  }

  function needleSvg() {
    if (ORB_CACHE.needle) return ORB_CACHE.needle;
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'];
    out.push('<polygon points="12,19.5 9.6,11.5 14.4,11.5" fill="#FFE9B0"/>');   /* 亮的那頭 */
    out.push('<polygon points="12,4.5 10.6,12.5 13.4,12.5" fill="#6B5A3E"/>');   /* 配重 */
    out.push('<rect x="11" y="11" width="2" height="2" fill="#E9B341"/>');
    out.push('</svg>');
    ORB_CACHE.needle = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join(''));
    return ORB_CACHE.needle;
  }

  /* 指針追游標。只掛一次，而且只寫一個 CSS 變數——
     不進 setState，所以不會為了轉根針把整頁重繪一遍。 */
  function armCompass() {
    if (LIVE.compassArmed) return;
    LIVE.compassArmed = true;
    var raf = 0, mx = 0, my = 0, cur = 0;
    /* 角度要展開著累加，不能讓它在 ±180 跳。
       游標繞過正上方的時候，跳一下就會讓指針整圈甩回去。 */
    var aim = function (target) {
      var d = (((target - cur + 180) % 360) + 360) % 360 - 180;
      cur += d;
      document.documentElement.style.setProperty('--jlz-needle', cur.toFixed(1) + 'deg');
    };
    var apply = function () {
      raf = 0;
      var el = document.querySelector('[data-jlz-orb]');
      if (!el) return;
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      var dx = mx - (r.left + r.width / 2);
      var dy = my - (r.top + r.height / 2);
      if (!dx && !dy) return;
      /* 指針原本朝下（0,1）。CSS 順時針轉 t 度會把它轉到 (-sin t, cos t)，
         要它對準 (dx, dy) 就是 t = atan2(-dx, dy)。 */
      aim(Math.atan2(-dx, dy) * 180 / Math.PI);
    };
    window.addEventListener('mousemove', function (e) {
      mx = e.clientX; my = e.clientY;
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
    /* 滑鼠離開視窗就放手，指針自己回到地心 */
    document.addEventListener('mouseleave', function () { aim(0); });
  }

  /* 背景輪播。五關的場景洗牌，礦工每跑完一輪換下一張。
     跟指針一樣走 CSS 變數，不進 setState——那會把走到一半的
     動畫整個重來。 */
  function armScenes() {
    if (LIVE.scenesArmed) return;
    LIVE.scenesArmed = true;
    var root = document.documentElement;
    var order = [1, 2, 3, 4, 5];
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
    }
    var at = 0;
    var put = function () {
      var n = order[at % order.length];
      /* Runtime 只改 style 屬性裡的路徑，CSS 變數它看不到，所以自己拿 base64 */
      var url = (window.JLZ_SPR && window.JLZ_SPR('scene-L' + n)) || ('assets/jlz/scene-L' + n + '.png');
      root.style.setProperty('--jlz-scene', 'url("' + url + '")');
      root.style.setProperty('--jlz-scene-hue', 'rgba(' + hexRgb(BOARD_HUE[n - 1]) + ',.42)');
    };
    put();
    document.addEventListener('animationiteration', function (e) {
      if (e.animationName !== 'jlzWalk') return;
      root.style.setProperty('--jlz-scene-o', '0');
      setTimeout(function () {
        at++; put();

  /* 學生首頁的「你在這裡」。
     首頁本來整頁都是字：進度是數字、下一件事是一段話、狀態是文字。

     同一批格子、同一隻角色，不另外算一套，所以永遠跟地圖一致。 */
  function decorateHomeBand(L, v) {
    var S = L.state;
    v.hasHomeBand = false;
    v.homeBand = { steps: [], runners: [] };
    v.goHomeMap = function () { L.go('S03'); };

    var n = S.currentLayer || 1;
    var m = (v.mapLayers || [])[n - 1];
    if (!m || !m.steps) return;
    v.hasHomeBand = true;
    /* 淺拷貝：首頁這一條要關掉天色的文字（那一行會跟角色的名牌疊在一起），
       但地圖上那一條要留著，所以不能直接改 m。太陽本身留著。 */
    v.homeBand = Object.assign({}, m, { skyTagStyle: 'display:none', skyTag: '' });
    var st = layerState(L, n);
    var bz = bossOf(n);
    v.homeBandNote = st.cleared
      ? '他讓你們過了這一層。'

  /* ============================================================
     老師編一張清單、學生逐條勾。

     教授的回饋：每個老師收作業的地方都不一樣，系統不該搶著當收件通道。
     所以這裡收的不是作業，是「他們說自己做到哪幾條」——作業本身照老師
     原本的方式交，老師去那裡看完，再回來寫合格考量。
     ============================================================ */

  /* 老師那邊：一行一條的文字框 ←→ 陣列 */
  function checkLines(txt) {
    return String(txt || '').split(/\r?\n/)
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x; })
      .slice(0, 12);
  }

  function decorateChecklistEditor(L, v) {

      var cur = (S.tasks || []).filter(function (t) { return t.id === S.editId; })[0];
      raw = cur && cur.checks && cur.checks.length ? cur.checks.join('\n') : '';
    }

      var nf = Object.assign({}, L.state.nf || {}, { checks: e.target.value });
      L.setState({ nf: nf });

    v.nfChecksHint = n
      ? '這一項會有 ' + n + ' 條給學生勾。'

  /* 學生那邊：逐條勾 */
  /* ============================================================
     送出之前。

     清單全部勾完之後，先不要讓他直接送。攤開來問一句：
     有沒有哪一項，你其實不太確定？

     按下去 → 那一項打開，而且至少要隔 6 小時才能勾回來。
     所以它有真實的代價：今天送不出去了。

     不按 → 現在就送。

     這是整個系統裡唯一一個真的賭局，也是唯一一個老師給不了的
     東西——★ 只能自己在他開口之前先發現才拿得到。 */
  /* ============================================================
     破法：這一項你要拿哪一樣。

     五樣全部是學生自己能決定的。刻意不放「一次過」跟「被退幾次」
     ——那兩件事是老師在決定的，拿來當收集目標就變成在收集老師的
     心情。

     一項只能宣告一樣，而且送出之後鎖住。不鎖的話它就不是宣告，
     是事後挑一個已經達成的來填，那就沒有「我這次要拿那個」了。 */
  /* 四種。原本五種，砍掉兩項：
       「試過」—— 開一條垃圾試挖立刻收掉就成立，十秒鐘穩拿 20 分，
                  是嚴格最優解，會讓五選一在第二週塌成一顆按鈕。
       「不壓線」—— 跟「早工」測同一件事，兩項一起中一起不中。
     補上「看過別組」：這是整套系統裡唯一的關聯感機制。 */
  var VOW_DEF = [
    { k: 'early', name: '早工的證據',   how: '第一條要勾在這一項時間過一半之前' },
    { k: 'back',  name: '回掘的證據',   how: '送出前自己打開一項、補完再勾回去' },
    { k: 'all',   name: '全員的證據',   how: '每個組員都要勾過至少一條' },
    { k: 'peer',  name: '看過別組的證據', how: '送出之前，去看過至少一組別人的紀錄' }
  ];
  function vowName(k) {
    for (var i = 0; i < VOW_DEF.length; i++) if (VOW_DEF[i].k === k) return VOW_DEF[i].name;
    return '';
  }

        },
        style: 'text-align:left;padding:9px 12px;background:rgba(0,0,0,.4);border:1px solid #4A3F30;' +
          "color:#C3BAAA;font:400 11px/1.5 'C11';cursor:pointer",
        textStyle: "display:block;font:400 11px/1.5 'C11';color:#6E665A;margin-top:4px;text-wrap:pretty"
      };
    });
  }

  function decorateChecklist(L, v) {
    var S = L.state;
    v.hasChecks = false;
    v.checkItems = [];
    v.checkBoxStyle = 'display:none';
    v.checkCount = ''; v.checkCountStyle = 'display:none'; v.checkHint = '';
    v.checkAllDone = true; v.checkLeft = 0;
    if (S.role !== 'student' || S.screen !== 'S05') return;
    var task = (S.tasks || []).filter(function (t) { return t.id === S.openTaskId; })[0];
    if (!task) return;
    var list = task.checks || [];
    if (!list.length) return;

    var on = {};
    (task.checked || []).forEach(function (i) { on[Number(i)] = true; });
    var got = list.filter(function (_x, i) { return on[i]; }).length;
    var locked = task.status === 'passed';
    var full = got >= list.length;

    v.hasChecks = true;
    v.checkAllDone = full;
    v.checkLeft = list.length - got;
    v.checkBoxStyle = 'padding:15px 16px;margin-bottom:18px;background:' +
      (full ? 'rgba(233,179,65,.06)' : 'rgba(0,0,0,.26)') +
      ';border:1px solid ' + (full ? '#5A4A2C' : '#2E2822');
    v.checkCount = got + ' / ' + list.length;
    v.checkCountStyle = "font:700 22px/1 'C11';color:" + (full ? '#E9B341' : '#C3BAAA');
    v.checkHint = locked
      ? '這一項已經通過了。'
      : full
        ? '都勾完了。下面回答一題，就可以請他去看。'
        : '做完一條勾一條。勾完才請得動他。';

    v.checkItems = list.map(function (txt, i) {
      var hit = !!on[i];
      return {
        text: txt,
        mark: hit ? '✓' : '',
        toggle: function () {
          if (locked) { L.say('這一項已經通過了，不用再改。'); return; }
          /* 先在畫面上翻過去，再回寫——按下去要有反應 */
          var next = (task.checked || []).filter(function (x) { return Number(x) !== i; });
          if (!hit) next = next.concat([i]);
          task.checked = next;
          L.setState({ checkNudge: (L.state.checkNudge || 0) + 1 });
          call('apiSetCheck', LIVE.token, task.id, i, !hit)
            .then(function (r) {
              if (!r || !r.ok) L.say((r && r.error) || '沒有存到伺服器。');
              return refresh();
            })
            .catch(function () { L.say('沒有存到伺服器。'); });
        },
        style: 'display:flex;align-items:flex-start;gap:11px;padding:10px 12px;text-align:left;' +
          'background:' + (hit ? 'rgba(233,179,65,.07)' : 'rgba(0,0,0,.3)') + ';' +
          'border:1px solid ' + (hit ? '#5A4A2C' : '#2E2822') + ';' +
          (locked ? 'cursor:default;opacity:.72' : 'cursor:pointer'),
        boxStyle: 'flex:none;display:flex;align-items:center;justify-content:center;' +
          'width:20px;height:20px;margin-top:2px;' +
          "font:700 11px/1 'C11';" +
          'color:' + (hit ? '#0B0A09' : '#3A3026') + ';' +
          'background:' + (hit ? '#E9B341' : 'rgba(0,0,0,.4)') + ';' +
          'border:1px solid ' + (hit ? '#E9B341' : '#4A443C'),
        textStyle: "flex:1;min-width:0;font:400 22px/1.6 'C11';text-wrap:pretty;color:" +
          (hit ? '#E8E2D6' : '#B6AC9C')
      };
    });
  }

  /* ============================================================
     試挖。學生自己開一條岔路去試一個方向，不用老師同意。

     專案管理有一半是「提很多方向，大部分行不通」。這一段本來整個
     不在系統裡——老師給四項、做四項、過關，沒有提案也沒有死路。

     收尾的時候當天第一次會挖到一片斗篷人的日誌。24 片、不重複、
     一天一片，剛好一個學期。塌掉的方向也留著，那是他們試過的證據。
     ============================================================ */

  /* 斗篷人的日誌。順序是亂的——一片一片撿，自己拼。 */
  var DIG_LOG = [
    '出發第一天。他們說底下有東西，沒有人說有多深。',
    '我在第一層繞了十天。不是挖不動，是我說不出自己要挖什麼。',
    '霧裡那個東西不會動。我對它說話，它沒有臉可以回答。',
    '第二層我待了七週。每採掉一叢，旁邊又亮起兩叢。',
    '今天我砍掉了三個月的東西。手在抖。',
    '停手是一個決定，不是放棄。這句話我學了很久。',
    '第三次了。這一層我還是沒找到。',
    '我聽到的都是自己的回音。聽久了會以為那是答案。',
    '我開始記下走不通的路。比記走得通的有用。',
    '量規給的是量出來的數字。它不會安慰我。',
    '岩漿在漲。我知道它會漲，但我一直以為還有時間。',
    '時間不等我挑要先做哪一個。它只是漲。',
    '我在牆上刻了記號。下一個人看得懂就好。',
    '最深的地方比我想的安靜。',
    '冠是空的。我到的時候就已經是空的。',
    '我在那裡坐了三天，然後決定把它拆了。',
    '四塊。一塊給一個。',
    '因為一個人走到底，沒有意義。',
    '那四個不是我放的守衛。是我把自己遇到的難處留在那裡。',
    '羅經盤沒有指針——方向不是別人給的。',
    '燈自己不會亮——它只是把旁邊的光折出來。',
    '鈴不出聲——安靜的時候才聽得見自己在講什麼。',
    '印不會熱——有些事再急也不能改。',
    '這本日誌我也撕開了，散在你會挖到的地方。你撿到這一頁，代表你也在挖。'
  ];

  var DIG_RESULT = {
    ok:   { label: '成立',   short: '成立',  hue: '#E9B341' },
    dead: { label: '塌了',   short: '塌了',  hue: '#D9603F' },
    none: { label: '沒結論', short: '沒結論', hue: '#8A8073' }
  };
  var DIG_BET = { yes: '押會成立', no: '押不會成立', unsure: '不確定' };

  /* ============================================================
     校準：試挖唯一的回報。

     試挖不給分——給分就變成刷的。它給的是兩個你自己看的數字：
       押中率  你說會成立的，有幾條真的成立
       估時    你估三天的事，從開到收實際花了幾天

     這兩件事就是專案管理在練的東西，而且完全不需要老師。
     樣本太少不給數字——n=1 顯示 100% 比不顯示還糟。 */
  var CALIB_MIN = 3;

  function digCalib(all) {
    var bet = 0, hit = 0, est = 0, estSum = 0, actSum = 0, over = 0;
    (all || []).forEach(function (d) {
      if (!d.result) return;
      /* 押中率：只算真的押了的。沒結論的不算對也不算錯。 */
      if ((d.bet === 'yes' || d.bet === 'no') && d.result !== 'none') {
        bet++;
        if ((d.bet === 'yes' && d.result === 'ok') ||
            (d.bet === 'no' && d.result === 'dead')) hit++;
      }
      /* 估時：量的是「從開到收」，不是做了幾天。」收得晚」本身就是資料。 */
      if (d.estDays && d.openedAt && d.closedAt) {
        var a = (new Date(d.closedAt) - new Date(d.openedAt)) / 86400000;
        if (a >= 0) { est++; estSum += Number(d.estDays); actSum += a; if (a > d.estDays) over++; }
      }
    });
    return { bet: bet, hit: hit, est: est, estSum: estSum, actSum: actSum, over: over };
  }

  function gauge(head, sub, frac, hue, live) {
    return {
      head: head, sub: sub,
      headStyle: "font:400 22px/1.5 'C11';color:" + (live ? '#E8E2D6' : '#6E665A') + ';text-wrap:pretty',
      barStyle: 'margin-top:9px;height:5px;background:rgba(0,0,0,.4);border:1px solid #2E2822',
      fillStyle: 'height:100%;width:' + Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%;' +
        'background:' + (live ? hue : '#2E2822'),
      subStyle: "font:400 11px/1.7 'C11';color:#6E665A;margin-top:7px;text-wrap:pretty"
    };
  }

  function decorateCalib(v, all) {
    var c = digCalib(all), g = [];

    if (c.bet >= CALIB_MIN) {
      g.push(gauge(
        '押了 ' + c.bet + ' 次，中了 ' + c.hit + ' 次。',
        '「不確定」的沒有算進去。',
        c.hit / c.bet, '#E9B341', true));
    } else {
      g.push(gauge(
        '押過 ' + c.bet + ' 次。',
        '再 ' + (CALIB_MIN - c.bet) + ' 次就看得出準度了。太少的時候算出來的比例沒有意義。',
        0, '#E9B341', false));
    }

    if (c.est >= CALIB_MIN) {
      var e = c.estSum / c.est, a = c.actSum / c.est;
      var d1 = function (x) { return (Math.round(x * 10) / 10).toFixed(1); };
      g.push(gauge(
        '你估 ' + d1(e) + ' 天的方向，從開到收平均 ' + d1(a) + ' 天。',
        c.over + ' / ' + c.est + ' 條超過自己估的。',
        e > 0 ? Math.min(1, e / Math.max(a, 0.01)) : 0, '#7CC98F', true));
    } else {
      g.push(gauge(
        '收過 ' + c.est + ' 條有估天數的。',
        '再 ' + (CALIB_MIN - c.est) + ' 條就看得出估得準不準。',
        0, '#7CC98F', false));
    }

    v.digGauges = g;
    v.digCalibShow = true;
  }

  /* ============================================================
     採量：全班挖出多少，以隊伍為單位。

     只有三條，全部能心算：
       勾一條條目        1 分
       一項任務通過     10 分
       回掘過的那一項   30 分（取代 10，不是加上去）

     條子分兩段畫：基本盤與加分分色。這是刻意的——
     跑完幾輪之後每一組的基本盤都差不多，名次上的差距
     一分都不是來自「有沒有交作業」，全部來自 ★。

     而 ★ 是老師給不了的，只能自己在他開口之前先發現。 */
  function loadHaul(L) {
    if (L.state.haulLoading) return;
    L.setState({ haulLoading: true });
    call('apiRoster', LIVE.token)
      .then(function (r) {
        L.setState({ haulLoading: false,
          haulData: (r && r.ok) ? r.roster : null,
          haulClaims: (r && r.ok) ? (r.claims || []) : [] });
      })
      .catch(function () { L.setState({ haulLoading: false, haulData: null }); });
  }

  /* ============================================================
     收藏總覽裡的 ★ 記述。

     文件 4.6 講三種頁面：空白頁、一般記述、★ 記述（金框加星）。
     這裡把第三種做出來——回掘過的那一塊礦，框是金的。

     為什麼是「頁的樣子」不是「一個數字」：分數會被忽略，
     但一整排灰框裡有一個金的，收藏的人自己會去把它補滿。 */
  function starCollection(L, v) {
    var S = L.state;
    if (S.role !== 'student') return;
    var secs = v.collSections || [];
    var byMineral = {};
    (S.tasks || []).forEach(function (t) { if (t.mineral) byMineral[t.mineral] = t; });

    var starred = 0, total = 0;
    secs.forEach(function (g) {
      if (g.title !== '礦物') return;
      (g.items || []).forEach(function (it) {
        if (!it.got) return;
        total++;
        var t = byMineral[it.name];
        if (!t || !t.star) return;
        starred++;
        it.sub = '★　' + it.sub;
        it.style = it.style
          .replace('background:rgba(233,179,65,.05)', 'background:rgba(233,179,65,.12)')
          .replace('border:1px solid #3A3026', 'border:1px solid #E9B341');
      });
      /* 標題那一行順便說清楚金框是什麼，不然沒有人知道 */
      g.note = g.note + (starred
        ? '　金框的 ' + starred + ' 塊是你在他開口之前自己發現、補完再勾回來的。'
        : (total ? '　還沒有金框的。金框只能自己在送出前發現才有。' : ''));
    });
  }

  /* 分數的刻度：用四隻生物，不用抽象的階級名。
     牠們本來就有名字、有立繪、有身世——而「再 17 分就追得上霧面者」
     比「再 17 分變掘進工」具體得多。

     這不是門檻：追不上牠照樣過得了關（過關只看老師）。它只是把一個
     要不到的數字，換成一個有臉的目標。 */
  var RANKS = [
    { at: 0,   name: '剛下來的' },
    { at: 50,  name: '霧面者' },
    { at: 150, name: '千晶母' },
    { at: 300, name: '擬聲者' },
    { at: 500, name: '漲潮者' }
  ];
  function rankOf(total) {
    var i = 0;
    for (var k = 0; k < RANKS.length; k++) if (total >= RANKS[k].at) i = k;
    return { name: RANKS[i].name, next: RANKS[i + 1] || null };
  }

  function decorateHaul(L, v) {
    var S = L.state;
    v.hasHaul = false; v.haulRows = []; v.scHaul = false;
    v.hasClaims = false; v.claimRows = []; v.claimHead = ''; v.claimNote = '';
    v.showHaulTab = false; v.haulNote = ''; v.haulMine = '';
    if (S.role !== 'student' || !S.signedIn) return;

    v.showHaulTab = true;
    var tab = S.mapTab || 'map';
    v.mapTabHaul = function () { L.setState({ mapTab: 'haul', screen: 'S03' }); };
    v.mapTabHaulStyle = L.pill(tab === 'haul');
    if (S.screen === 'S03' && tab === 'haul') {
      v.scHaul = true; v.scMap = false; v.scColl = false; v.scDig = false;
    }
    if (!v.scHaul) return;

    if (!S.haulData && !S.haulLoading) { loadHaul(L); return; }
    var rows = S.haulData || [];
    if (!rows.length) {
      v.haulNote = S.haulLoading ? '算一下……' : '還沒有分數。勾第一條就開始了。';
      return;
    }

    v.hasHaul = true;

    /* 初採：哪一塊礦被誰先採走。沒有人碰過的那幾塊是唯一會在你不在的
       時候變的東西——所以它排在最前面，而且要講清楚還剩幾塊。 */
    var claims = S.haulClaims || [];
    var open = claims.filter(function (c) { return !c.by; });
    var myFirst = claims.filter(function (c) { return c.mine; });
    v.hasClaims = claims.length > 0;
    v.claimHead = '初採　' + myFirst.length + ' / ' + claims.length;
    var racingN = claims.filter(function (c) { return !c.by && c.racing; }).length;
    v.claimNote = open.length
      ? '還有 ' + open.length + ' 塊沒有人採到' +
        (racingN ? '，其中 ' + racingN + ' 塊已經有人送出去在等判' : '') +
        '。第一個採到的隊伍會永久記在那一塊上。'
      : '每一塊都有人採到了。';
    v.claimRows = claims.map(function (c) {
      return {
        name: c.mineral,
        by: c.by ? (c.mine ? '你們' : c.by)
          : (c.racing ? '有 ' + c.racing + ' 組正在爭奪' : '還沒有人'),
        meta: 'L' + c.layer + '　' + c.title,
        boxStyle: 'padding:11px 13px;background:' +
          (c.mine ? 'rgba(233,179,65,.1)' : c.by ? 'rgba(0,0,0,.26)' : 'rgba(0,0,0,.4)') +
          ';border:1px ' + (c.mine ? 'solid #E9B341' : c.by ? 'solid #2E2822' : 'dashed #4A3F30'),
        nameStyle: "font:500 22px/1.3 'C11';color:" + (c.mine ? '#E8E2D6' : c.by ? '#9A9184' : '#C3BAAA'),
        byStyle: "flex:none;font:400 11px/1 'C11';color:" +
          (c.mine ? '#E9B341' : c.by ? '#6E665A' : c.racing ? '#C3BAAA' : '#D9603F'),
        metaStyle: "font:400 11px/1.6 'C11';color:#5F574C;margin-top:4px"
      };
    });
    var top = Math.max.apply(null, rows.map(function (r) { return r.total; }).concat([1]));
    var mine = rows.filter(function (r) { return r.me; })[0];

    /* 只描述，不評價——這一句照文件「走過的路」那條硬規則。 */
    if (mine) {
      var place = rows.indexOf(mine) + 1;
      var rk = rankOf(mine.total);
      v.haulMine = mine.total + ' 分，第 ' + place + ' 名。' +
        (rk.next
          ? '再 ' + (rk.next.at - mine.total) + ' 分就追得上「' + rk.next.name + '」。'
          : '四隻都追過了。') +
        '　追不追得上不影響過關——過關只看他。';
    }
    v.haulNote = '勾一條 1 分　·　通過一項 10 分　·　通過而且做到宣告的破法 30 分（取代 10）。' +
      '跑幾輪之後基本盤都差不多——名次的差距全部來自宣告成功了幾次。';

    v.haulRows = rows.map(function (r, i) {
      var basePct = Math.round(r.base / top * 100);
      var bonusPct = Math.round(r.bonus / top * 100);
      return {
        rank: String(i + 1),
        name: r.name + (r.me ? '　（你們）' : ''),
        total: String(r.total),
        /* 明細照分數的來源排，順序跟計分表一致，看得出這 33 分是怎麼來的 */
        detail: '勾 ' + r.ticks + ' 條 = ' + r.ticks + ' 分　·　' +
          '通過 ' + r.pages + ' 項 = ' + (r.pages * 10) + ' 分　·　' +
          '宣告做到 ' + r.vows + ' 項 = ' + (r.vows * 30) + ' 分' +
          (r.firsts ? '　·　初採 ' + r.firsts + ' 塊' : ''),
        rowStyle: 'padding:13px 15px;background:' + (r.me ? 'rgba(233,179,65,.07)' : 'rgba(0,0,0,.28)') +
          ';border:1px solid ' + (r.me ? '#5A4A2C' : '#2E2822'),
        rankStyle: "flex:none;width:26px;font:700 22px/1 'C11';color:" + (r.me ? '#E9B341' : '#5F574C'),
        nameStyle: "flex:1 1 auto;min-width:0;font:500 22px/1.3 'C11';color:" + (r.me ? '#E8E2D6' : '#C3BAAA'),
        totalStyle: "flex:none;font:700 22px/1 'C11';font-variant-numeric:tabular-nums;color:" +
          (r.me ? '#E9B341' : '#8A8073'),
        barStyle: 'display:flex;margin-top:9px;height:6px;background:rgba(0,0,0,.4);border:1px solid #2E2822',
        baseStyle: 'height:100%;width:' + basePct + '%;background:#5A5044',
        bonusStyle: 'height:100%;width:' + bonusPct + '%;background:#E9B341',
        detailStyle: "font:400 11px/1.6 'C11';color:#6E665A;margin-top:6px"
      };
    });
  }

  /* ============================================================
     格子牆與任務紀錄。

     格子 = 4 隻生物 × 5 種破法 = 20 格。同一層同一種只算一格，
     所以要跨層去湊——不能在同一層一直刷同一樣。

     排行榜比的是「收了幾格」，不是「做了幾項」。做得多不會自動
     贏，這對後段班友善，也才是收集式的競爭。 */
  /* 格子綁在「層」上，不綁生物。
     生物之後會變成一項任務一隻——綁生物的話，內容一換格子就對不
     起來，而且第五層根本沒有守關生物。層是結構性的：每一班、每一
     個老師、每一個專案都會走過五個階段。 */
  /* 25 格拿掉了。進度只看老師有沒有讓這一組過這個階段。

     格子唯一在做的事是逼人換招（同層同種只算一格）。拿掉之後那個
     功能交給命中率那張表——它會列出「還沒宣告過」的那幾種，同樣是
     「你還沒碰過這一個」的訊號，但不用另外養一套系統。

     而且命中率在送出當下就算得出來，不用等老師。 */
  function vowRate(L) {
    var rows = (L.state.record || []).filter(function (r) { return r.vow && r.settled; });
    var by = {};
    VOW_DEF.forEach(function (d) { by[d.k] = { n: 0, hit: 0 }; });
    rows.forEach(function (r) {
      if (!by[r.vow]) return;
      by[r.vow].n++;
      if (r.won) by[r.vow].hit++;
    });
    return {
      n: rows.length,
      hit: rows.filter(function (r) { return r.won; }).length,
      by: by
    };
  }

  /* ============================================================
     地圖上每一格直接顯示老師給不給過。

     原型的 mineralCells 只有兩態（採到／沒採到），所以「送出去了
     正在等」跟「他退回來要再改」在圖上長得一模一樣——那兩件事對
     學生來說差很多。四態分開，地圖才真的是進度圖。

     沒採到的格子名字是「？？？」，所以不能用名字對——用層與索引
     對，那跟 mineralCells 產生的順序一致。 */
  var VERDICT = {
    passed:     { t: '過了',   hue: '#E9B341', box: 'rgba(233,179,65,.08)',  line: '#5A4A2C' },
    submitted:  { t: '等他看', hue: '#C3BAAA', box: 'rgba(195,186,170,.06)', line: '#4A4238' },
    needs_more: { t: '要再改', hue: '#D9603F', box: 'rgba(217,96,63,.09)',   line: '#5A2E22' },
    todo:       { t: '還沒送', hue: '#5F574C', box: 'rgba(0,0,0,.3)',        line: '#2C251D' }
  };

  function markVerdicts(L, v) {
    var S = L.state;
    if (S.role !== 'student') return;

    var byMineral = {};
    (S.tasks || []).forEach(function (t) { if (t.mineral) byMineral[t.mineral] = t; });

    var paint = function (cells, layer, big) {
      var mins = (L.MINS || []).filter(function (m) { return m.L === layer; });
      (cells || []).forEach(function (c, k) {
        var min = mins[k];
        var t = min ? byMineral[min.name] : null;
        var st = VERDICT[(t && t.status) || 'todo'] || VERDICT.todo;
        var done = !!(t && t.status === 'passed');
        c.stat = t ? st.t : '老師還沒開';
        c.statStyle = "display:block;font:400 11px/1 'C11';letter-spacing:.06em;margin-top:6px;color:" +
          (t ? st.hue : '#3A332B');
        c.style = 'padding:' + (big ? 13 : 11) + 'px 8px;text-align:center;' +
          'cursor:' + (done ? 'pointer' : 'default') + ';' +
          'background:' + (t ? st.box : 'rgba(0,0,0,.22)') + ';' +
          'border:1px ' + (done ? 'solid ' : 'dashed ') + (t ? st.line : '#241F1A') + ';' +
          'color:' + (done ? '#E8E2D6' : '#8C8172');
      });
    };

    (v.mapLayers || []).forEach(function (m, i) { paint(m.minerals, i + 1, false); });
    /* layerPanel 沒有帶層號，用展開的那一層 */
    var selN = S.expanded || S.currentLayer || 1;
    if (v.sel) paint(v.sel.minerals, selN, true);
  }

  /* ============================================================
     首頁的名冊摘要。

     完整的在 S-10，但那要點三層才到得了。真正會讓人回來的是
     「還沒有人採到的那幾塊」——那一段必須在首頁，不然它變了
     也沒有人知道。 */
  /* ============================================================
     時間軸：唯一共同的尺。

     專案不同、階段不同、進度不同、老師對每一組的規劃也不同——
     但所有人的學期一樣長，而且同一天結束。

     只描述不評價。把「你在第幾層」跟「學期走了幾成」擺在一起就
     夠了，加一句「你落後了」就毀了（文件第 01 條：沒有負分）。
     那個落差是學生自己看到的，不是系統罵他的——而那正好是學生
     症候群這一課。 */
  function termAt(L) {
    var S = L.state;
    var kl = L.KLASSES[S.klass] || {};
    var n = Math.max(6, Math.min(156, Number(kl.semesterWeeks) || Number(S.semesterWeeks) || 18));
    var w = Math.max(1, Number(S.courseWeek) || 1);
    return { week: w, total: n, pct: Math.max(0, Math.min(100, Math.round(w / n * 100))) };
  }

  /* ============================================================
     首頁的三張卡：從礦石改成任務。

     礦石在舊概念裡是門檻，所以首頁到處是「還差幾塊」。新概念裡門檻
     是老師，礦石只是紀錄——那三張卡就變成在講一件已經不成立的事。

     改成講這一層的任務跑到哪：開了幾項、幾項在等他看、他判過幾項。 */
  function decorateSlimStats(L, v) {
    var S = L.state;
    if (S.role !== 'student' || !S.signedIn) return;

    var lay = S.currentLayer || 1;
    var mine = (S.tasks || []).filter(function (t) { return (t.layer || 1) === lay; });
    var waiting = mine.filter(function (t) { return t.status === 'submitted'; }).length;
    var passed = mine.filter(function (t) { return t.status === 'passed'; }).length;
    var fix = mine.filter(function (t) { return t.status === 'needs_more'; }).length;

    v.reqDone = String(passed);
    v.reqTotal = String(mine.length);
    v.statHeadA = '他判過幾項';
    v.statNoteA = mine.length ? '這一層他開了 ' + mine.length + ' 項' : '他還沒開清單';

    v.extDone = String(waiting);
    v.statHeadB = '等他看的';
    v.statNoteB = fix ? fix + ' 項他要你再改' : waiting ? '送出去了，等他判' : '沒有在等的';

    /* 第三張卡拿掉了——礦石不是進度，它在收藏跟紀錄裡就好 */
  }

  function decorateTerm(L, v) {
    var S = L.state;
    v.hasTerm = false;
    v.termLine = ''; v.termPct = ''; v.termBarStyle = 'display:none'; v.termFillStyle = '';
    if (S.role !== 'student' || !S.signedIn) return;

    var t = termAt(L);
    var lay = (L.LAYERS || [])[(S.currentLayer || 1) - 1] || {};
    v.hasTerm = true;
    v.termPct = t.pct + '%';
    v.termLine = '你在' + (lay.name || ('第 ' + (S.currentLayer || 1) + ' 層')) +
      '。學期走了 ' + t.pct + '％（第 ' + t.week + ' / ' + t.total + ' 週）。';
    v.termBarStyle = 'margin-top:9px;height:5px;background:rgba(0,0,0,.4);border:1px solid #2E2822';
    v.termFillStyle = 'height:100%;width:' + t.pct + '%;background:#5A5044';
  }

  /* 層的課程標籤：
       老師放行這一組時說過話 → 用他的話
       沒說過                 → 用預設的階段名，而且不要有週次
     週次寫死一定是錯的，因為每個老師的節奏都不一樣。 */
  function retellLayers(L) {
    if (LIVE.layersRetold) return;
    LIVE.layersRetold = true;
    (L.LAYERS || []).forEach(function (l) {
      l.course = String(l.course || '').replace(/^[^·]*·\s*/, '');
    });
  }

  function layerLabel(L, n) {
    var said = (L.state.layerSaid || {})[n];
    if (said) return said;
    var l = (L.LAYERS || [])[n - 1] || {};
    return l.course || '';
  }

  function decorateHomeHaul(L, v) {
    var S = L.state;
    v.hasHomeHaul = false; v.homeClaims = [];
    v.homeRank = ''; v.homeRankNote = ''; v.homeClaimNote = '';
    v.goHaul = function () { L.setState({ screen: 'S03', mapTab: 'haul' }); };
    if (S.role !== 'student' || !S.signedIn || S.screen !== 'S01') return;

    /* 首頁也要載——原本只有進到 S-10 才載，那就太晚了 */
    if (!S.haulData && !S.haulLoading) { loadHaul(L); return; }
    var rows = S.haulData || [];
    if (!rows.length) return;

    var mine = rows.filter(function (r) { return r.me; })[0];
    if (!mine) return;
    v.hasHomeHaul = true;

    var rk = rankOf(mine.total);
    v.homeRank = mine.total + ' 分';
    v.homeRankNote = '第 ' + (rows.indexOf(mine) + 1) + ' 名 / ' + rows.length + ' 組' +
      (rk.next ? '　·　再 ' + (rk.next.at - mine.total) + ' 分追上「' + rk.next.name + '」' : '　·　四隻都追過了');

    /* 只列還沒被拿走的，最多三塊。已經有人拿走的擺首頁只剩打擊。 */
    var open = (S.haulClaims || []).filter(function (c) { return !c.by; });
    var racingN = open.filter(function (c) { return c.racing; }).length;
    v.homeClaimNote = open.length
      ? '還有 ' + open.length + ' 塊沒有人採到' +
        (racingN ? '，其中 ' + racingN + ' 塊有人在爭奪' : '') + '。'
      : '每一塊都有人採到了。';
    v.homeClaims = open.slice(0, 3).map(function (c) {
      return {
        name: c.mineral,
        by: c.racing ? '有 ' + c.racing + ' 組正在爭奪' : '還沒有人',
        meta: 'L' + c.layer + '　' + c.title,
        boxStyle: 'padding:10px 12px;background:rgba(0,0,0,.32);border:1px ' +
          (c.racing ? 'solid #4A4238' : 'dashed #4A3F30'),
        nameStyle: "font:500 22px/1.3 'C11';color:#C3BAAA",
        byStyle: "flex:none;font:400 11px/1 'C11';color:" + (c.racing ? '#C3BAAA' : '#D9603F'),
        metaStyle: "font:400 11px/1.5 'C11';color:#5F574C;margin-top:4px"
      };
    });
  }

  function decorateRecord(L, v) {
    var S = L.state;
    v.hasRecord = false; v.recRows = []; v.scRec = false;
    v.showRecTab = false; v.recNote = ''; v.recCount = '';
    v.rateRows = [];
    if (S.role !== 'student' || !S.signedIn) return;

    v.showRecTab = true;
    var tab = S.mapTab || 'map';
    v.mapTabRec = function () { L.setState({ mapTab: 'rec', screen: 'S03' }); };
    v.mapTabRecStyle = L.pill(tab === 'rec');
    if (S.screen === 'S03' && tab === 'rec') {
      v.scRec = true; v.scMap = false; v.scColl = false; v.scDig = false; v.scHaul = false;
    }
    if (!v.scRec) return;
    v.hasRecord = true;

    /* ---- 宣告命中率 ----
       不扣一分，卻讓宣告從許願變成有紀錄的承諾。
       樣本少於 3 筆不給比例——n=1 顯示 100% 比不顯示還糟。 */
    var vr = vowRate(L);
    v.recCount = vr.n ? (vr.hit + ' / ' + vr.n) : '—';
    v.recNote = vr.n
      ? '宣告過 ' + vr.n + ' 次，做到 ' + vr.hit + ' 次。送出的當下就算，不用等他判。'
      : '每一項任務開工前先宣告要拿哪一樣，做到才算。做不到不扣任何東西。';
    v.rateRows = VOW_DEF.map(function (d) {
      var b = vr.by[d.k] || { n: 0, hit: 0 };
      var enough = b.n >= 3;
      var txt = !b.n ? '還沒宣告過'
        : enough ? ('宣告 ' + b.n + ' 次，做到 ' + b.hit + ' 次')
                 : ('宣告 ' + b.n + ' 次　（太少，先不算比例）');
      return {
        name: d.name, txt: txt,
        barStyle: 'margin-top:7px;height:4px;background:rgba(0,0,0,.4);border:1px solid #2E2822',
        fillStyle: 'height:100%;width:' + (enough ? Math.round(b.hit / b.n * 100) : 0) + '%;' +
          'background:' + (enough ? '#E9B341' : '#2E2822'),
        nameStyle: "font:500 22px/1.3 'C11';color:" + (b.n ? '#E8E2D6' : '#6E665A'),
        txtStyle: "font:400 11px/1.6 'C11';color:" + (b.n ? '#8A8073' : '#5F574C')
      };
    });
    /* ---- 一項一列的紀錄 ---- */
    var STAT = {
      todo: { t: '還沒送', hue: '#6E665A' },
      submitted: { t: '等他看', hue: '#C3BAAA' },
      needs_more: { t: '要再改', hue: '#D9603F' },
      passed: { t: '過了', hue: '#E9B341' }
    };
    v.recRows = (S.record || []).slice().reverse().map(function (r) {
      var st = STAT[r.status] || STAT.todo;
      var vowTxt = !r.vow
        ? '沒有宣告'
        : (r.settled
            ? (r.won ? '★ ' + vowName(r.vow) : '沒拿到 ' + vowName(r.vow))
            : '宣告了 ' + vowName(r.vow) + '，還沒送');
      var bits = ['L' + r.layer];
      if (r.rounds) bits.push('送了 ' + r.rounds + ' 次');
      if (r.sentBack) bits.push('被退 ' + r.sentBack + ' 次');
      if (r.mineral && r.status === 'passed') bits.push(r.mineral);
      var fdR = findOf(r.find);
      if (fdR) bits.push('撿到 ' + fdR.name);
      return {
        title: r.title, meta: bits.join('　·　'),
        stat: st.t, vowTxt: vowTxt, say: r.say || '',
        boxStyle: 'padding:13px 15px;background:rgba(0,0,0,.28);border:1px solid ' +
          (r.status === 'passed' ? '#3A3026' : '#2E2822'),
        titleStyle: "font:500 22px/1.4 'C11';color:#E8E2D6",
        statStyle: "flex:none;font:400 11px/1 'C11';letter-spacing:.1em;padding:4px 8px;" +
          'border:1px solid ' + st.hue + ';color:' + st.hue,
        metaStyle: "font:400 11px/1.6 'C11';color:#6E665A;margin-top:6px",
        vowStyle: "font:400 11px/1.6 'C11';margin-top:5px;color:" +
          (r.won ? '#E9B341' : r.vow ? '#8A8073' : '#5A5044'),
        sayStyle: r.say
          ? "font:400 22px/1.6 'C11';color:#C3BAAA;margin-top:9px;padding-top:8px;" +
            'border-top:1px solid #26211C;text-wrap:pretty'
          : 'display:none'
      };
    });
  }

  /* ============================================================
     坑屑：挖岔路的時候順手撿到的東西。

     跟礦石完全分開 ——
       礦石  一項任務一塊，說的是「你做到了什麼」，不隨機
       坑屑  什麼都不說，純收集，隨機，零分

     刻意不讓它們有任何意義。有意義的東西不能隨機（隨機的礦石會
     在說一件學生沒做過的事），沒意義的東西才隨機得起來。

     最後四件是人造物 —— 跟寶物同一條線，指向斗篷人。 */
  var FINDS = [
    /* 常見 12 */
    { n: 1,  name: '雲母片',   look: '一撕就散成更薄的一片。怎麼撕都還有下一層。' },
    { n: 2,  name: '炭化根',   look: '某種植物的根，已經全黑了，形狀還完整。' },
    { n: 3,  name: '磨圓石英', look: '稜角全被磨掉了，看不出原本多大。' },
    { n: 4,  name: '鏽釘',     look: '鏽到只剩下形狀。不知道是誰釘的。' },
    { n: 5,  name: '空螺殼',   look: '這裡離海很遠。' },
    { n: 6,  name: '沉泥塊',   look: '捏得碎。捏碎之後聞得到水的味道。' },
    { n: 7,  name: '白脈石',   look: '一條白線橫過去，兩邊的顏色不一樣。' },
    { n: 8,  name: '蜂窩岩',   look: '全是小孔，比看起來輕很多。' },
    { n: 9,  name: '焦玻璃',   look: '邊緣是圓的，像被燒過又冷掉。' },
    { n: 10, name: '層積片',   look: '一層一層疊起來，每一層厚度都不同。' },
    { n: 11, name: '鹽晶粒',   look: '舔起來是鹹的。' },
    { n: 12, name: '灰砂團',   look: '抓在手上會慢慢散開。' },
    /* 少見 8 */
    { n: 13, name: '雙色晶',   look: '從中間分成兩半，一半透明一半不透。' },
    { n: 14, name: '迴聲石',   look: '敲它，聲音會慢半拍才出來。' },
    { n: 15, name: '冷斑岩',   look: '表面有一塊永遠比周圍冷。' },
    { n: 16, name: '空心球',   look: '搖起來裡面有東西，但敲不開。' },
    { n: 17, name: '逆紋木',   look: '木紋是反方向長的。' },
    { n: 18, name: '定針砂',   look: '撒開之後會自己排成同一個方向。' },
    { n: 19, name: '半面鏡',   look: '只有一半照得出東西。' },
    { n: 20, name: '停時晶',   look: '裡面有一個氣泡，從來不動。' },
    /* 罕見 4 —— 都是人造物 */
    { n: 21, name: '刻痕板',   look: '上面有人為的刻痕。數了三次，每次數出來的條數不一樣。' },
    { n: 22, name: '反光紙',   look: '薄得像紙，但是金屬的。上面好像有字，看不清楚。' },
    { n: 23, name: '斷鏈',     look: '一截鏈子，兩頭都是斷的。做工很細。' },
    { n: 24, name: '無名鑰',   look: '一把鑰匙。不知道開什麼。' }
  ];
  function findTier(n) { return n <= 12 ? '常見' : n <= 20 ? '少見' : '罕見'; }
  function findOf(n) {
    for (var i = 0; i < FINDS.length; i++) if (FINDS[i].n === Number(n)) return FINDS[i];
    return null;
  }

  function decorateFinds(L, v) {
    var S = L.state;
    v.hasFinds = false; v.findRows = []; v.findCount = ''; v.findNote = '';
    if (S.role !== 'student' || !S.signedIn) return;

    var got = S.finds || {};
    var kinds = Object.keys(got).length;
    var total = FINDS.reduce(function (a, f) { return a + (got[f.n] || 0); }, 0);
    v.hasFinds = true;
    v.findCount = kinds + ' / ' + FINDS.length + ' 種';
    v.findNote = '每通過一項任務就撿到一件。' +
      (total ? '一共撿了 ' + total + ' 件。' : '') +
      '每一件都一樣重——稀有只是比較少見，不影響任何分數。';

    v.findRows = FINDS.map(function (f) {
      var n = got[f.n] || 0;
      var tier = findTier(f.n);
      return {
        name: n ? f.name : '？？？',
        look: n ? f.look : '',
        tally: n > 1 ? '×' + n : '',
        tier: n ? tier : '',
        boxStyle: 'padding:11px 13px;background:' +
          (n ? 'rgba(233,179,65,.05)' : 'rgba(0,0,0,.28)') +
          ';border:1px ' + (n ? 'solid #3A3026' : 'dashed #26211C'),
        nameStyle: "font:500 22px/1.3 'C11';color:" + (n ? '#E8E2D6' : '#4A443C'),
        tallyStyle: "flex:none;font:400 11px/1 'C11';color:#E9B341",
        tierStyle: "flex:none;font:400 11px/1 'C11';color:" +
          (tier === '罕見' ? '#E9B341' : tier === '少見' ? '#8A8073' : '#5F574C'),
        lookStyle: "font:400 11px/1.6 'C11';color:#6E665A;margin-top:5px;text-wrap:pretty"
      };
    });
  }

  function decorateDig(L, v) {
    var S = L.state;
    v.hasDig = false;
    v.digOpen = []; v.digDone = []; v.digPages = [];
    v.digDraftText = ''; v.digDraftDays = ''; v.digBetPicks = [];
    v.digGauges = []; v.digCalibShow = false;
    if (S.role !== 'student' || !S.signedIn) return;
    v.hasDig = true;

    /* 分頁：地圖剖面／收藏總覽／試挖。學生才有第三個。 */
    var tab = S.mapTab || 'map';
    v.showDigTab = true;
    v.mapTabDig = function () { L.setState({ mapTab: 'dig', screen: 'S03' }); };
    v.mapTabDigStyle = L.pill(tab === 'dig');
    if (S.screen === 'S03') {
      v.scDig = tab === 'dig';
      if (tab === 'dig') { v.scMap = false; v.scColl = false; }
    } else {
      v.scDig = false;
    }

    var all = S.digs || [];
    decorateCalib(v, all);
    var open = all.filter(function (d) { return !d.result; });
    var done = all.filter(function (d) { return d.result; });

    /* ---- 還開著的 ---- */
    v.digOpenCount = open.length;
    v.digOpenNote = open.length
      ? '你手上有 ' + open.length + ' 條沒收尾。'
      : '現在沒有開著的坑。想到一個方向就開一條。';
    v.digOpen = open.map(function (d) {
      return {
        text: d.text,
        meta: 'L' + d.layer + '　估 ' + d.estDays + ' 天　' + (DIG_BET[d.bet] || ''),
        boxStyle: 'padding:13px 15px;background:rgba(0,0,0,.28);border-left:2px solid #5A4A2C',
        textStyle: "font:500 22px/1.5 'C11';color:#E8E2D6;text-wrap:pretty",
        metaStyle: "font:400 11px/1.6 'C11';color:#8A8073;margin-top:5px",
        picks: ['ok', 'dead', 'none'].map(function (k) {
          var r = DIG_RESULT[k];
          return {

      var hit = (d.bet === 'yes' && d.result === 'ok') || (d.bet === 'no' && d.result === 'dead');
      return {

          'background:rgba(0,0,0,.35);border:1px solid ' + r.hue + ';color:' + r.hue,
        metaStyle: "font:400 11px/1.6 'C11';color:#6E665A;margin-top:5px"
      };
    });
    v.digDoneNote = done.length
      ? '挖過 ' + done.length + ' 條：' +
        ['ok', 'dead', 'none'].map(function (k) {
          return DIG_RESULT[k].short + ' ' + done.filter(function (d) { return d.result === k; }).length;
        }).join('　') + '。'
      : '還沒有收過的坑。塌掉的也會留在這裡——那是你試過的證據。';

    /* ---- 斗篷人的日誌 ---- */
    var got = S.digPages || [];
    var total = S.digTotal || DIG_LOG.length;
    v.digLogCount = got.length + ' / ' + total;
    v.digLogLeft = got.length >= total
      ? '拼完了。'
      : '還差 ' + (total - got.length) + ' 片。當天第一次收尾就會挖到一片沒拿過的。';
    v.digPages = [];
    for (var n = 1; n <= total; n++) {
      var have = got.indexOf(n) >= 0;
      v.digPages.push({
        n: String(n),
        text: have ? (DIG_LOG[n - 1] || '') : '',
        style: 'padding:11px 13px;min-height:60px;background:' +
          (have ? 'rgba(233,179,65,.05)' : 'rgba(0,0,0,.3)') +
          ';border:1px ' + (have ? 'solid #3A3026' : 'dashed #26211C'),
        numStyle: "font:400 11px/1 'C11';letter-spacing:.14em;color:" + (have ? '#8A8073' : '#332C25'),
        textStyle: "display:block;font:400 11px/1.7 'C11';margin-top:7px;text-wrap:pretty;color:" +

          (have ? '' : ';background:repeating-linear-gradient(90deg,rgba(90,80,64,.16) 0 6px,transparent 6px 12px);height:34px')
      });

    /* ---- 開一條 ---- */
    v.digDraftText = S.digText || '';
    v.setDigText = function (e) { L.setState({ digText: e.target.value }); };
    v.digDraftDays = S.digDays === undefined ? '' : String(S.digDays);
    v.setDigDays = function (e) { L.setState({ digDays: e.target.value }); };
    v.digBetPicks = ['yes', 'no', 'unsure'].map(function (k) {

      if (!(days >= 1)) { L.say('估一下這個方向要試幾天。'); return; }
      call('apiOpenDig', LIVE.token, st.currentLayer || 1, txt, days, st.digBet || 'unsure')
        .then(function (r) {

          L.setState({ digText: '', digDays: '', digBet: 'unsure' });
          L.say('挖下去了。試出結果再回來收。');
          return refresh();

        .catch(function () { L.say('沒有存到伺服器。'); });

            rows: [

  function decorateBoard(L, v) {
    var S = L.state;
    var mob = S.device === 'mobile';
    var cur = S.currentLayer || 1;
    var openAll = S.role === 'teacher' || !!S.allOpen;

    /* 23 格＝23 塊礦石。走到第幾格＝總共採到幾塊。 */
    var seen = 0, done = 0, myCell = 0;
    var perLayer = [1, 2, 3, 4, 5].map(function (n) { return layerState(L, n); });
    perLayer.forEach(function (st) { done += st.gotN; });
    var TOTAL = perLayer.reduce(function (a, st) { return a + st.veinN; }, 0) || MINS_TOTAL;

    v.boardDone = done + ' / ' + TOTAL + ' 塊';
    v.boardLeft = (TOTAL - done) + ' 塊';
    var LSc = perLayer[cur - 1];
    /* 原型那句還在講「一格一步」，但階段已經拿掉了 */
    if (v.mapLede && v.mapLede.indexOf('一格一步') >= 0) {
      v.mapLede = '剖面由上往下，一層一階。每一層過不過由老師決定；挖到的那一層才看得見裡面。';
    }
    v.boardStepNote = LSc.cleared
      ? '他讓你們過了這一層。'
      : '這一層採到 ' + LSc.gotN + ' / ' + LSc.veinN + ' 塊——那是你做過什麼的紀錄，' +
        '不是往下的門票。覺得這一層告一段落了就去找他。';

    /* 把通道鋪到剖面的每一層上 */
    (v.mapLayers || []).forEach(function (m, i) {
      var n = i + 1;
      var st = perLayer[n - 1];
      var hue = BOARD_HUE[n - 1];
      var fog = !openAll && n > cur;
      var base = perLayer.slice(0, n - 1).reduce(function (a, x) { return a + x.veinN; }, 0);
      var nextHere = null;

      var cells = st.vein.map(function (min, k) {
        var task = st.byMineral[min.name] || null;
        var got = !!task && task.status === 'passed';
        var wait = !!task && task.status === 'submitted';
        var back = !!task && task.status === 'needs_more';
        var opened = !!task;
        if (!got && !nextHere && n === cur && opened) nextHere = min.name;
        var me = (n === cur) && (nextHere === min.name);
        var label = (got || openAll) ? min.name
          : opened ? (task.title || min.task)
          : fog ? '？？？' : min.task;
        var url = (got || openAll || (!fog && opened)) ? mineralSprite(L, min.name, n) : null;
        return {
          idx: String(base + k + 1),
          name: label,
          sub: fog ? '' : (min.task || ''),
          mark: got ? '✓' : wait ? '…' : back ? '!' : me ? '◉' : opened ? '' : '·',
          open: function () {
            if (fog) { L.say('還沒到那一層。'); return; }
            if (!task) { L.say('老師還沒把「' + min.task + '」開出來。'); return; }
            L.setState({ screen: 'S05', openTaskId: task.id, draftText: task.text || '', draftFiles: (task.files || []).slice() });
          },
          dotStyle: 'display:flex;align-items:center;justify-content:center;width:100%;height:20px;' +
            "font:600 11px/1 'C11';transform:scale(.85);" +
            'color:' + (me ? '#0B0A09' : got ? '#0B0A09' : back ? '#FFB9A2' : fog ? '#3A3026' : '#8A8073') + ';' +
            'border:1px solid ' + (me ? '#FFD98A' : got ? hue : back ? '#D9603F' : wait ? '#8A8073' : fog ? '#2A251F' : opened ? '#5A5044' : '#3A3026') + ';' +
            'background:' + (me ? '#E9B341' : got ? 'rgba(' + hexRgb(hue) + ',.85)'
              : back ? 'rgba(217,96,63,.22)' : wait ? 'rgba(255,255,255,.09)'
              : fog ? 'rgba(0,0,0,.55)' : opened ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.4)') + ';' +
            (me ? 'box-shadow:0 0 12px rgba(233,179,65,.8);' : ''),
          nameStyle: "display:block;font:400 11px/1.2 'C11';margin-top:3px;text-align:center;transform:scale(.72);" +
            'white-space:nowrap;color:' + (got ? '#FFD98A' : me ? '#FFD98A' : fog ? '#332C25' : '#8A8073'),
          style: 'flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:' +
            (fog ? 'default' : 'pointer') + ';pointer-events:auto'
        };
      });

      /* 層底那一格：BOSS 與關卡是同一件事，共用 endCell */
      cells.push(endCell(L, n, st, {
        fog: fog,
        here: n === cur,
        blocked: function () { return layerState(L).blockReason; },
        onPass: function () { L.go('SUB'); }
      }));

      /* 階段拿掉。一層不再是「第 1 格走到第 4 格」——那是系統在替
         學生排順序。現在一層就是一層，過不過只看老師。
         留下來的只有角色（你在哪一層）跟層底那一隻。 */
      m.steps = [cells[cells.length - 1]];
      m.stepsStyle = stripStyle(mob, n === cur);
      m.stepsTag = fog ? '？？？'
        : st.cleared ? '他讓你們過了'
        : n === cur ? '他還沒讓你們過'
        : '';
      m.stepsTagStyle = 'position:absolute;left:var(--mcol);top:9px;z-index:2;' +
        "font:400 11px/1 'C11';letter-spacing:.1em;color:" + (n === cur ? '#FFD98A' : fog ? '#4A443C' : '#8A8073') +
        ';pointer-events:none;white-space:nowrap;transform:scale(.86);transform-origin:left top';

      /* 同一條通道上還有誰 —— 別組就在你旁邊 */
      var mine = (L.teams() || []).filter(function (t) { return t.me; })[0] || null;
      var here = (L.teams() || []).filter(function (t) {
        return (t.layer || 1) === n && (!mine || t.id !== mine.id);
      });
      m.others = othersChips(L, n, here, function (t) {
        return function () {
          call('apiLogRead', LIVE.token, t.id).catch(function () {});
          /* 隊伍詳情是靠 mapView，不是 screen —— 兩個都要設 */
          L.setState({ mapTeam: t.id, mapView: 'team', screen: 'S03' });
        };
      });
      /* 走在這一層通道上的人。自己踩在採到第幾塊那一格上；
         別組平均散開——他們採到哪一塊不是給你看的。 */
      m.runners = buildRunners(L, {
        cellN: cells.length,
        fog: fog,
        bossIdx: bossOf(n) && !st.cleared ? cells.length - 1 : null,
        mine: (n === cur && mine) ? mine : null,
        myIdx: st.cleared ? cells.length - 1 : st.gotN,
        others: here,
        openTeam: function (t, isMe) {
          return function () {
            if (isMe) { L.go('S02'); return; }
            call('apiLogRead', LIVE.token, t.id).catch(function () {});
            L.setState({ mapTeam: t.id, mapView: 'team', screen: 'S03' });
          };
        },
        openCrowd: function (list, sc) { crowdPage(L, n, list, sc); }
      });
      var bgS = bossOnGround(L, n, st, {
        fog: fog, idx: cells.length - 1, cellN: cells.length,
        open: cells[cells.length - 1].open
      });
      if (bgS) m.runners.push(bgS);

      m.hasOthers = here.length > 0;   /* 別組不上迷霧：你本來就看得到別人的營火 */
      m.othersStyle = 'position:absolute;right:13px;top:8px;z-index:3;display:flex;flex-wrap:nowrap;gap:5px;justify-content:flex-end;max-width:58%;overflow:hidden';
      m.othersNote = here.length + ' 組也在這一層';
      m.othersNoteStyle = "font:400 11px/1 'C11';letter-spacing:.1em;color:#8A8073;align-self:center;transform:scale(.86)";
    });
  }

  function hexRgb(h) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h || '');

     項目太碎會讓學生失焦，而且老師一層要開六項也太重。
     原型檔案不動，在這裡過濾。後端的 MINERALS_BY_LAYER 跟這份一致。 */
  var KEEP_MINS = {
    1: ['定名石', '裂晶', '初痕礦', '預兆砂'],
    2: ['聽紋晶', '篩光石', '徑錄礦', '顯影砂'],
    3: ['初型岩', '因由石', '反響礦', '二階水晶'],
    4: ['再凝岩', '前後水晶', '磨心礦', '厚能量石'],
    5: ['完成之光']
  };
  var MINS_TOTAL = 17;

  /* 老師改過的拆分名稱要套哪一份：
     學生看自己那一組的；老師看他在 T-05 選到的那一組。 */
  function activeMinNames(L) {
    var S = (L && L.state) || {};
    if (S.role === "student") return S.minNames || {};
    var byTeam = S.minNamesByTeam || {};
    return byTeam[S.minTeam] || {};
  }

  function trimMinerals(L) {
    if (!L || !L.MINS) return;
    /* 老師照每一組的狀況改過拆分名稱的話，套上去。改了就要重算。 */
    var names = activeMinNames(L);
    var stamp = JSON.stringify(names);
    if (L.MINS.__trimmed && L.MINS.__names === stamp) return;
    if (L.MINS.__trimmed) {
      L.MINS.forEach(function (m) {
        var o = names[m.name];
        m.task = (o && o.label) || m.__task0 || m.task;
        m.rec = (o && o.note) || m.__rec0 || m.rec;
      });
      L.MINS.__names = stamp;
      return;
    }
    var keep = {};
    Object.keys(KEEP_MINS).forEach(function (n) {
      KEEP_MINS[n].forEach(function (name) { keep[name] = 1; });
    });
    var out = L.MINS.filter(function (m) { return keep[m.name]; });
    /* 照 KEEP_MINS 的順序排，通道走起來才是有道理的先後 */
    out.sort(function (a, b) {
      if (a.L !== b.L) return a.L - b.L;
      return KEEP_MINS[a.L].indexOf(a.name) - KEEP_MINS[b.L].indexOf(b.name);
    });
    /* 原本的名稱留一份，老師改回預設時要用得到 */
    out.forEach(function (m) {
      if (m.__task0 === undefined) m.__task0 = m.task;
      if (m.__rec0 === undefined) m.__rec0 = m.rec;
      var o = names[m.name];
      m.task = (o && o.label) || m.__task0;
      m.rec = (o && o.note) || m.__rec0;
    });
    out.__trimmed = true;
    out.__names = stamp;
    L.MINS = out;
  }

  /* 像素列 → SVG data URI。dim = 還沒擊退，只留輪廓與微光。
     still = 不要內部動畫（縮圖太小時動起來只是雜訊）。 */
  function bossSvg(b, dim, still) {
    var rows = b.px, out = [], S = 24;
    var an = still ? null : BOSS_ANIM[b.L];
    out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + S + ' ' + S + '" shape-rendering="crispEdges">');
    if (an) out.push("<style>" + an.css + "</style>");
    var nth = 0;
    rows.forEach(function (row, y) {
      var x = 0;
      while (x < row.length) {
        var c = row[x];
        if (c === ".") { x++; continue; }
        var w = 1;
        while (x + w < row.length && row[x + w] === c) w++;
        var fill = dim ? "#2C251D" : (b.hue[c] || b.hue["#"]);
        var op = c === "~" ? (dim ? ".35" : ".55") : (dim ? ".9" : "1");
        var cls = "";
        if (an && an.chars.indexOf(c) >= 0) {
          cls = (b.L === 4 && c === "*") ? "b" : "a";
          nth++;
        }
        out.push("<rect x=\"" + x + "\" y=\"" + y + "\" width=\"" + w + "\" height=\"1\" fill=\"" + fill +
          "\" opacity=\"" + op + "\"" +
          (cls ? " class=\"" + cls + "\" style=\"animation-delay:" + ((nth % 7) * 0.18).toFixed(2) + "s\"" : "") +
          "/>");
        x += w;
      }
    });
    out.push("</svg>");
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(out.join(""));
  }

  /* 像素列 → 可以直接塞進 background:url() 的 SVG */
  function pixIcon(rows, color) {
    var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">'];
    rows.forEach(function (row, y) {
      var x = 0;
      while (x < row.length) {
        if (row[x] === '.') { x++; continue; }
        var w = 1;
        while (x + w < row.length && row[x + w] !== '.') w++;
        out.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="1" fill="' + color + '"/>');
        x += w;
      }
    });
    out.push('</svg>');
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join(''));
  }
