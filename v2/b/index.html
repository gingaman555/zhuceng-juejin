         四 · 把躺著那張圖重畫 → 畫對了，可是躺著在 16 格裡只有 5 列高，

       畫在人前面（廊道上 66px）它讀起來是藤蔓纏著人；畫在人後面、
       只露出四隻手臂，它就是一個打在那一組身上的叉——而這一頁上
       另外五組都沒有。那讀起來是「這一組被劃掉了」，正好違反
       「失準不扣任何東西」那條前提。

       ── 停手 ──

       這一頁的工作是「六組在哪裡」，一眼掃過去。而**停滯本來就已經
       畫出來了**：丙站在 x182 而別人站在 x261。位置就是那個訊號，
       而且它是最誠實的一個——它只說「走得比較少」，不說那一組怎麼了。

       停滯的兩階（藤蔓、躺下）留在自己那一條廊道上：66px、一次只有
       他一個人、旁邊有 RULES.stallSay 那一句話對得上。那裡讀得出來，
       這裡讀不出來，那就不要在這裡畫。 */
    if (left) {
      H.push(pxTag(hr.win, hr.pal, 'ch-s'));
    } else {
      H.push(pxTag(hr.idleA, hr.pal, 'ch-s wf wa'));
      H.push(pxTag(hr.idleB, hr.pal, 'ch-s wf wb'));
    }
    H.push('</span>');
  });
  H.push('</button>');

  /* 走出去的那一組，那一條的盡頭是一道光。
     別人看得到「他們走出去了」——而那跟估得準不準無關。 */
  if (left) H.push('<span class="xl-exit" style="top:' + XL.HEAD +
    'px;--k:' + n + '"></span>');

  H.push('</div>');
  return H.join('');
}

function ecoRows(classId) {

    r.project = tm && tm.project;
    /* 那一條廊道裡站的是那一組自己的人。這一頁一次畫六組，
       不能吃全域那一個 HERO——那樣六條裡站的都是看的人自己。

       「大家都在下面」——少了三個人那句話就不成立，而且四個角色的
       剪影本來就不一樣，一排站在一起才看得出那一組是誰跟誰。

       順序照加入的順序，所以每一次畫都一樣（不會今天這個在前面、
       明天換一個）。 */
    var mem = where('Users', function (x) {
      return inTeam(x, r.teamId) && x.role === 'student';
    }).sort(function (a, b) {
      return String(a.userId).localeCompare(String(b.userId));
    });
    r.heroes = mem.map(function (u) { return heroOf(u); });
    r.names = mem.map(function (u) { return u.name || ''; });
    /* 舊的那一個留著：別的地方還在讀 r.hero。 */
    r.hero = r.heroes[0] || heroOf(null);
    return r;
  });
}

  H.push('</div>');

}

/* ===== 65-feed.js ===== */
/* 首頁：全班最近發生的事。

   YouTube 的首頁放的是別人的影片，但它的主流程是把影片放上去。
   打開它的理由是別人，留下來的理由才是自己。

   這個系統本來反過來：首頁是自己的廊道，別人在另一個分頁裡當背景。
   所以沒有任何理由在不必要的時候打開它——一個人的東西看兩次就沒了。

   改成：
     上面一條   你手上這一趟（狀態 ＋ 那一顆鍵）。像 YouTube 的上傳。
     底下       全班最近發生的事，一則一則往下。

   feed 裡放什麼，這件事要小心。放的是「發生了什麼」，不是「誰比較好」：

     完成了一趟        ← 最有內容的一則：哪一件、交給了哪一位委託人
     交出去了          ← 不寫判定。誰估得準不準不該出現在別人的首頁上
     跟老師談過        ← 有人在數字定下來之前跟老師談過（見下）
     走出去了
     老師派了新的      ← 哪一位老師派的。三位共同帶一個班，「老師」不夠

   沒有名次、沒有數量、沒有印章。它是時間順序，不是排行榜。

   ── 為什麼「跟老師談過」要放上來，而且不能放數字 ──

   協商是這個系統裡唯一一個「老師在事情發生之前說話」的位置，也是
   最容易沒有人用的一個——第一個開口的人要先相信那真的沒有代價。
   別組談過而且沒事，是這件事唯一便宜的證據。

   但它一個數字都不能帶。「甲組說 5 天，老師說 8 天」放在別人的首頁上
   就是比較，而這一整條動態存在的前提是它不比較。所以只寫「談過」，
   不寫談出了什麼，也不寫最後有沒有改。 */

/* 全班最近發生的事。從資料直接組，不從 Events——Events 是研究紀錄，
   欄位是為了匯出設計的，不是為了畫面。 */
function feedOf(classId, limit) {
  var out = [];
  var teams = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) { teams[t.teamId] = t; });

  /* 封存 */
  DB.Keeps.forEach(function (k) {
    if (!teams[k.teamId]) return;
    out.push({ at: k.at, kind: 'seal', team: teams[k.teamId], keep: k });
  });

  /* 交出去 */
  where('Runs', function (r) { return teams[r.teamId] && r.submittedAt; })
    .forEach(function (r) {
      var m = msOf(r.msId);
      out.push({ at: r.submittedAt, kind: 'sent', team: teams[r.teamId], ms: m });
    });

  /* 跟老師談過。只收「學生已經回答了」的那幾筆——還在等他回的那一趟
     是他手上的事，不是一件已經發生完的事。 */
  where('Runs', function (r) {
    return teams[r.teamId] && r.askAt && r.askAns;
  }).forEach(function (r) {
    out.push({ at: r.askAns, kind: 'nego', team: teams[r.teamId],
      ms: msOf(r.msId), by: r.askBy ? userOf(r.askBy) : null });
  });

  /* 走出去 */
  Object.keys(teams).forEach(function (id) {
    if (teams[id].leftAt) out.push({ at: teams[id].leftAt, kind: 'left', team: teams[id] });
  });

  /* 老師派的 */
  where('Milestones', function (m) { return m.classId === classId && !m.withdrawnAt && !m.notice; })
    .forEach(function (m) { out.push({ at: m.at, kind: 'pub', ms: m }); });

  out.sort(function (a, b) { return b.at - a.at; });
  return out.slice(0, limit || 20);
}

/* 一則一行：圖、誰、做了什麼、多久以前。

   本來一則兩行（誰做了什麼＋細節），十則就是二十行長得很像的字，
   整段讀起來是一面牆。壓成一行之後，掃過去就知道最近誰動了。 */
function feedRow(f, meId) {
  var mine = f.team && f.team.teamId === meId;
  var H = ['<div class="fd' + (mine ? ' mine' : '') + '">'];
  /* 誰做的。老師派的那一則本來只寫「老師」——三位共同帶一個班，
     那三個字等於沒說（見 40-db.js 的 teachersOf）。 */
  var by = f.ms && f.ms.mentorId ? userOf(f.ms.mentorId) : null;
  var who = f.team ? shortName(f.team.name) : (by ? by.name : '老師');
  var act = '', ic = '';

  /* 老師收下的那一趟。整條動態上唯一一件「完整發生過」的事，
     所以它是唯一一則寫成一句話的——其餘幾種還是壓成一行。

     圖示是那一隻：牠是那一趟真正發生過的東西，而一根石片的形狀
     在 22px 上看不出來，那一隻看得出來。 */
  if (f.kind === 'seal') {
    var run = find('Runs', function (x) { return x.runId === f.keep.runId; });
    var mob = run ? mobOfRun(run) : null;
    var ms = run ? msOf(run.msId) : null;
    var z = run ? zoneOfRun(run, f.team && f.team.teamId) : STRATA[0];
    ic = mob ? pxTag(mob.px, z.pal, 'nic') : pxTag(ICONS.log, ICON_ON, 'nic');
    H.push('<span class="fd-ic">' + ic + '</span>');
    H.push('<b>' + esc(who) + '</b>');
    /* 本來這一句是「完成了「X」，，把東西交給了 Y！」——多一個逗號，
       而那個驚嘆號是全站唯一一個。系統不歡呼，它只說發生了什麼。 */
    H.push('<em class="fd-say">完成了「' + esc(ms ? ms.title : '一件事') + '」' +
      (mob ? '，交給 ' + esc(mob.n) : '') + '</em>');
    H.push('<i>' + feedWhen(f.at) + '</i>');
    H.push('</div>');
    return H.join('');
  }

  if (f.kind === 'sent') {
    ic = pxTag(ICONS.log, ICON_PAL, 'nic');
    /* 交了哪一件。本來只有「交出去」，而同一組一週交三件的時候，
       三則長得一模一樣。 */
    act = '交出去了「' + (f.ms ? f.ms.title : '一件事') + '」';
  } else if (f.kind === 'nego') {
    ic = pxTag(ICONS.radar, ICON_PAL, 'nic');
    /* 不寫談出了什麼（見檔頭）。 */
    act = '跟 ' + (f.by ? f.by.name : '老師') + ' 談過那一趟';
  } else if (f.kind === 'left') {
    ic = pxTag(ICONS.home, ICON_ON, 'nic');
    act = '走出去了';
  } else {
    ic = pxTag(ICONS.ms, ICON_PAL, 'nic');
    act = '派了「' + (f.ms ? f.ms.title : '新的' ) + '」';
  }

  H.push('<span class="fd-ic">' + ic + '</span>');
  H.push('<b>' + esc(who) + '</b>');
  H.push('<em>' + esc(act) + '</em>');
  H.push('<i>' + feedWhen(f.at) + '</i>');
  H.push('</div>');
  return H.join('');
}

function feedWhen(at) {
  var d = daysBetween(at, now());
  return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
}

/* ── 你不在的這幾天 ──

   死線勇者的節奏：專注的時候不開 app，回來看發生了什麼。這個系統的
   限制剛好一樣（做之前開、做完開），所以那一半可以搬——但要搬得誠實。
   那邊掛機會自動打怪爆裝；這裡掛機只有日曆在走，所以這一條只報真的
   發生過的事。沒有憑空長出來的東西，也沒有為了讓人回來而發的獎勵。

   回傳 null 代表沒隔多久，那就什麼都不要畫。 */
function awayOf(meId) {
  var u = userOf(meId);
  if (!u || !u.seenAt) return null;
  var d = daysBetween(u.seenAt, now());
  if (d < 1) return null;
  var t = teamOf(u.teamId);
  var cut = u.seenAt;
  var cells = 0;
  where('Keeps', function (k) {
    return teamOf(k.teamId) && teamOf(k.teamId).classId === t.classId && k.at > cut;
  }).forEach(function () { cells++; });
  var run = where('Runs', function (r) {
    return r.teamId === t.teamId && r.state === 'running';
  })[0];
  /* 老師勾了也算「你不在的時候發生的事」——而且是唯一一件
     有人特地為你做的。 */
  var ok = where('Runs', function (r) {
    return r.teamId === t.teamId && r.state === 'approved';
  }).length;
  return {
    days: d,
    cells: cells,
    okd: ok,
    /* 小時／週承諾的話 run.est 是換算過的小數天，「還剩 0.33 天到期」
       比不顯示還誤導——那種時候不算這個數字（見 40-db.js 的 estSay）。 */
    left: (run && (!run.estU || run.estU === 'd'))
      ? Math.max(0, run.est - daysBetween(run.committedAt, now())) : null
  };
}

/* 看過就記下來。不記的話它每次進來都會再喊一次同樣的話。

   ── 不要每畫一次就寫一次 ──

   本來這裡無條件 u.seenAt = now(); save()。而 render() 每一次畫首頁
   都會叫它一次，所以每一次重畫都是一次 localStorage 寫入加一次雲端
   寫入——手機上那是真的成本，而雲端那一次會讓別人的畫面重畫，
   然後對方也寫一次推回來（見 41-sync.js 的 SYNC_SKIP）。

   這一欄的用途是「你上次看是什麼時候」，而讀它的地方（awayOf）
   問的是「隔了幾天」。毫秒沒有意義。五分鐘寫一次就夠，
   而且「上次之後才有的」那些標記也不會在同一次瀏覽裡被自己清掉。 */
var SEEN_GAP = 5 * 60 * 1000;
function markSeen(meId) {
  var u = userOf(meId);
  if (!u) return;
  if (u.seenAt && now() - u.seenAt < SEEN_GAP) return;
  u.seenAt = now();
  save();
}

/* ===== 66-map.js ===== */
/* 班級地下城：一片被打通的岩層。

   本來是五根平行的柱子，深度一根一根往下——那是有美術的長條圖。
   現在是一片方格：每一組封存一趟就打通一格，往哪裡打通是他們自己選的。
   一個學期下來全班刻出一座真的洞窟，每個班長得都不一樣。

   這張圖上沒有名次、沒有計數、沒有排序。看得到的是形狀，
   而形狀是每一組自己挑出來的。

   版面留邊，這件事第一版做壞了：組名放在 top:-18px，整排被切掉看不見；
   層的名字壓在最左邊那一組的格子上。所以左邊留一條給層名、
   上面留一條給組名與地表線，格子從那兩條之後才開始。 */

var MAP_L = 88;   /* 左邊那一條：層的名字 */
var MAP_T = 72;   /* 上面那一條：地表。天、林子、組名、每一組的井口 */

/* 岩層裡長什麼東西，直接用廊道那一套。同一層在兩個地方長的是同一種
   東西，不然那兩個畫面就不是同一座地下城。 */
var MAP_PX = {
  rubble: RUBBLE, crystal: CRYSTAL, shroom: SHROOM, bolt: BOLT, ember: EMBER
};

function mapSurface(classId, teams, hue, meId) {
  var W = DIG.W * DIG.CELL;
  var H = ['<div class="dig-sky" style="left:0;width:' + (MAP_L + W) + 'px;height:' +
    MAP_T + 'px"></div>'];

  /* 林子。位置與高矮用班級算，所以每個班的地表長得不一樣，
     而且同一個班每次打開都一樣。 */
  for (var i = -2; i < DIG.W; i++) {
    var h = hash(classId + 'tree' + i);
    if (h % 100 < 38) continue;
    var th = 16 + (h >>> 3) % 14;
    var tx = MAP_L + i * DIG.CELL + ((h >>> 7) % (DIG.CELL - 14));
    H.push('<div class="dig-tree" style="left:' + tx + 'px;top:' +
      (MAP_T - 8 - th) + 'px;height:' + th + 'px"></div>');
  }

  /* 地面那一條。硬邊，沒有漸層——泥土在上，岩層從這裡開始。 */
  H.push('<div class="dig-scrystal" style="left:0;top:' + (MAP_T - 8) +
    'px;width:' + (MAP_L + W) + 'px"></div>');

  return H.join('');
}

/* 岩層交界。每一欄的高度用座標算：0、3、6 px 三種，所以那一條是犬牙
   交錯的。一條直線會讓整張圖讀起來像表格，而它應該讀起來像地質。 */
function zoneSeam(classId, y, cy, above) {
  var H = [];
  for (var x = 0; x < DIG.W; x++) {
    var h = hash(classId + 'seam' + y + ',' + x) % 3;
    if (!h) continue;
    H.push('<div class="dig-seam ' + above.key + '" style="left:' +
      (MAP_L + x * DIG.CELL) + 'px;top:' + cy + 'px;height:' + (h * 3) + 'px"></div>');
  }
  return H.join('');
}

/* 這一格的岩層裡有什麼。用班級與座標算，不擲骰子——
   每次重畫水晶都跳一次的話，那就不是一個地方。 */
function mapProp(classId, x, y, z) {
  var p = propFor(classId + 'map', y * DIG.W + x, z.key);
  var g = MAP_PX[p];
  if (!g) return '';
  var h = hash(classId + 'p' + x + ',' + y);
  return '<img class="px mp" src="' + pxSvg(g.px, z.pal) + '" alt="" style="left:' +
    (3 + h % 18) + 'px;bottom:' + (2 + (h >>> 5) % 12) + 'px">';
}

/* 「第一組 · 甲」在格子上方只放得下兩三個字。 */
function shortName(n) {
  var m = String(n).split('·');
  return (m[1] || m[0]).trim().slice(0, 4);
}

/* 點一組：看他們走到哪一層、封存過哪幾根。 */
ACTS.digteam = function (id) { DRAFT.dt = id; render(); };

function digTeamCard(classId) {
  if (!DRAFT.dt) return '';
  var t = teamOf(DRAFT.dt);
  if (!t) return '';
  var z = zoneNow(t.teamId);
  var H = ['<div class="card dtcard fa ' + z.key + '">'];
  H.push('<div class="radar-head">');
  H.push(pxTag(signOf(t.teamId).px, signOf(t.teamId).pal, 'sign-s'));
  /* 大的是專案名，不是組名——跟剖面圖上的欄頭同一個層級。 */
  H.push('<b>' + esc(t.project || '（還沒定）') + '</b>');
  H.push('<span class="dim">' + esc(t.name) + '</span>');
  H.push('<span class="sp"></span>');
  H.push('<span class="dim">' + esc(z.name) + '</span>');
  H.push('</div>');

  /* 這裡本來還有一排記號架，每一格寫「名字＋幾天」——沒取名的時候
     名字就是「4 天」，所以那一格變成「4 天 4 天」。而且整排跟底下的
     紀錄講的是同一批東西，只是少了任務名跟兩個數字。
     兩個一樣的東西並排，先出現的那個就是雜訊。 */
  /* ── 他們的紀錄 ──

     點進一組，該看到的是這個。本來這裡只有招牌跟他們留下的東西——
     那是他們的裝飾，不是他們的紀錄。

     一列＝一趟：任務、說幾天、實際幾天、準不準。
     不放老師回的話，也不放他們寫的困境——那兩樣是他們跟老師之間的事。
     放的是兩個數字跟一個他們自己取的名字，跟你自己那一頁一樣的東西。 */
  var mine = runsFor(t.teamId).filter(function (x) { return x.run.stamp; }).reverse();
  if (mine.length) {
    H.push('<div class="eyebrow" style="margin-top:14px">走過 ' + mine.length + ' 趟</div>');
    H.push('<div class="orec">');
    mine.forEach(function (x) {
      var r = x.run;
      var s = RULES.STAMPS[r.stamp];
      var kp = null;
      keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });
      H.push('<div class="or ' + r.stamp + '">');
      H.push('<span class="or-s">' + (s ? stampPx(s.key) : '') + '</span>');
      H.push('<b>' + esc(x.ms ? x.ms.title : '') + '</b>');
      H.push('<span class="or-n">說 <b>' + esc(estSay(r)) + '</b>　實際 <b>' +
        (r.actual || 0) + ' 天</b></span>');
      if (kp && kp.name) H.push('<span class="or-w">「' + esc(kp.name) + '」</span>');
      H.push('</div>');
    });
    H.push('</div>');
  } else {
    H.push('<p class="dim">還沒走完過一趟。</p>');
  }

  H.push('</div>');
  return H.join('');
}

/* buildPick 拿掉了。封存的時候已經自動把那一趟插進那一層（見 actSeal），
   所以它只剩一條回頭路：舊存檔裡有哪一層沒有記號的時候才冒出來。
   而它冒出來的時候講的是「這一趟長成這樣」加一句解釋圖的話加
   「插進水晶迴廊」——沒有一件說得清楚它要你做什麼。
   一條只在資料出錯時出現、出現了又講不清楚的路，不值得留。 */


/* ---------- 這一格裡有什麼 ----------

   打通之後、挑要蓋什麼之前，先看到裡面的東西。
   這是這個系統唯一「你不知道會遇到什麼」的地方——
   本來每一格都是空的，打通就只是變色。

   準跟失準看到的不一樣，但拿到的一樣多：那一格、那座建築、那根岩心、
   那一筆圖鑑，兩邊都有。差的是你到得早不早——早，牠還在；
   晚，你看到的是牠留下的痕跡。沒有人被扣任何東西。 */
function uncoverCard(t) {
  var r = DRAFT.uncover;
  if (!r) return '';
  var d = buriedDef(r.k);
  if (!d) return '';
  /* DRAFT.build 是那一層的深度。本來是格子地圖的 [x, y]。 */
  var z = strataAt(Number(DRAFT.build) || 0, t.teamId);

  var H = ['<div class="card unc ' + z.key + (r.early ? '' : ' late') + '">'];
  H.push('<div class="unc-in">');

  /* 圖：遇到什麼就畫什麼。沒有圖的就畫那一層的紋理。 */
  if (r.mob) {
    var mo = null;
    allFauna().forEach(function (f) { if (f.n === r.mob) mo = f; });
    if (mo) H.push('<span class="pxwrap">' + pxTag(mo.px, z.pal, 'unc-px' + (r.early ? '' : ' gone')) +
      pxFlash(mo.px) + '</span>');
  } else {
    H.push('<div class="unc-px ' + z.key + ' blank"></div>');
  }

  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(z.name) + '　·　這一格裡</div>');
  H.push('<h2>' + esc(r.mob || d.n) + '</h2>');
  H.push('<p class="lead">' + esc(r.early ? d.here : d.late) + '</p>');

  H.push('</div></div></div>');
  return H.join('');
}


/* ===== 67-battle.js ===== */
/* ---------- 交出去的那一場 ----------

   這是整條流程最有份量的一下，本來按了「上」就直接跳判定。

   ── 這不是一場對決 ──

   畫面借的是舊版寶可夢的排法（見底下「畫面」那一段），但機制不是。
   他不會回手、沒有血、沒有輸贏，也沒有任何一方會倒下。

   他唯一能做的是「還沒。」——那一句接在你漏掉的那一題後面。那是
   一道關卡，不是一次攻擊：它擋的是「這一題你沒答」，而且擋完題目
   還在原地。

   借過來的是**份量**：一個人站在你面前等你回話，比一疊表單有份量。
   借的不是戰鬥。

   ── 一次一題 ──

   六題（沒拆件五題），一頁一題，題目就寫在他的對話框裡——那一句
   是他真的在問的，不是「路上怎麼樣？」這種過場。

   其中有兩題是自由書寫。它跟「零輸入框」不衝突：當初擋的是
   「系統先替他們定義一份詞表」，自己寫的字剛好是那件事的相反。

   ── 結果是算好的，不是演出來的 ──

   整場沒有任何操作會改變結果。答什麼、跳不跳過，判定都一樣——
   它由 RULES.judge(est, actual) 決定，而那一支只讀兩個數字。
   一旦讓玩家的操作影響結果，這個系統就開始獎勵「會玩」而不是「估得準」。

   ── 逃跑 ──

   填到一半發現寫不出來，可以走。那不是認輸：做到一半發現做不完是真的
   會發生的事，而承認它比硬交出去好。角色往回跑出畫面，然後回到「說幾天」。

   誠實的部分是退出去不等於擦掉——那一趟留著當紀錄（確實承諾了幾天、
   確實走了幾天），但沒有判定，所以不會進那根尺。可以擦掉的話，
   每個人都會在快超時的時候退一次，這個系統就再也量不到任何東西。

   ── 畫面 ──

   照舊版寶可夢排：牠在右上、你在左下（背影）、各自一塊站台、
   名牌帶一條斜出去的尾線、底下左邊字幕框右邊選單。
   那個年代畫面能力低，靠的全是輪廓與對比——剛好跟這個作品的規矩一致。 */

var BT = { timers: [] };

function battleStop() {
  BT.timers.forEach(function (t) { clearTimeout(t); });
  BT.timers = [];
}

function btAt(ms, fn) { BT.timers.push(setTimeout(fn, ms)); }

/* 這一趟走到第幾段。'menu' → 'q1' → 'q2' → 'play'。
   老師沒分段就跳過第一問。 */
/* 「為什麼」那一格。門檻寫在 RULES.ASK.hard，現在是 0——第一趟就問。
   留著這一支是因為門檻是一個會被調的數字，不是一個永遠的答案。 */
function btAskHard(teamId) {
  return RULES.asks('hard', depthOf(teamId)) !== 'off';
}

function btPhase(r) {
  /* back 也要能打：老師退回＝牠站起來了，這一場要重來一次。
     本來只認 running，所以退回之後整場掉進「回看舊的一場」，
     畫面上什麼都不能按。 */
  if (r.state !== 'running' && r.state !== 'back') return 'play';
  var ph = S.p.ph;
  /* ── 那一頁只在他有話要說的時候才出現 ──

     本來每一趟都先停在一個選單頁：他打招呼，底下兩顆鍵
     「交東西給他」「還沒準備好」。

     可是學生是從廊道按「做完了」進來的——進來再按一次「交東西給他」，
     等於連續兩次「對，我要交」，而第二次沒有帶任何新資訊。
     那一下剛好落在耐心最低的時候（整段交件是 7 頁裡的第 1 頁）。

     留下來的兩種情況，都是他真的有新的話：

       退回　　老師寫的那一句印在這一頁上，那是他這一刻唯一需要讀的
       初見　　第一次遇到這一位，讓他先說一句再問問題

     其他時候他認得你，你也認得他——直接走進去。 */
  if (!ph) {
    if (r.state === 'back') return 'menu';
    if (mobDebut(r.teamId, r.runId)) return 'menu';
    return 'q';
  }
  /* 問答只剩一種階段，第幾題記在 S.p.q（見 BT_STEPS）。 */
  if (ph === 'q1' || ph === 'q2' || ph === 'q') return 'q';
  /* 本來這裡有一條：沒拆件就跳過第一問，直接進第二問。

     那條寫在第一問只問「這幾件各花幾天」的年代——沒有細項，那一問
     確實沒東西可問。但第一問現在還收兩樣跟細項無關的東西：
     老師要去哪裡看、你自己做了什麼。而他不收的那兩道關卡就架在
     那兩樣上（見 BT_STEPS 每一題的 no）。

     跳過去的話，沒拆件的那一趟會卡死：關卡在第二問擋下來，叫他去
     第一問補，而第一問又被跳掉——他看得到那句話，但沒有地方可以打字。

     所以不跳了。btSteps 本來就會判斷有沒有細項（沒有就不畫那一段）。 */
  return ph;
}

PAGES.battle = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  /* ── 重做的時候，上一次寫的還在 ──

     被退回的時候只有一件事被指出不對，可是每一題都要重打：去哪裡看、
     最想要老師看哪裡、你做了什麼。系統自己寫著
     「退回不是懲罰」——而重打全部就是懲罰。

     帶回來的是**他自己上一次寫的**，不是幫他填（那條規則擋的是
     「拿別人的東西或上一趟的東西塞給他」）。每一格他都可以改，
     而改哪一格正好就是他這一次要做的事。

     一趟只帶一次：__pre 記著已經帶過哪一趟，不然他每改一個字、
     畫面一重畫就被蓋回去。 */
  if (r.state === 'back' && DRAFT.__pre !== r.runId) {
    DRAFT.__pre = r.runId;
    if (r.link != null) DRAFT.where = r.link;
    if (r.pace != null) DRAFT.hard = r.pace;
    if (r.scope) DRAFT.scope = r.scope;
    if (r.feel) DRAFT.feel = r.feel;
    if (r.why != null) DRAFT.why = r.why;
    if (r.spent) DRAFT.spent = r.spent.slice();
    var mine0 = (r.said || {})[S.who];
    if (mine0 != null) DRAFT.said1 = mine0;
  }
  var mob = mobOfRun(r);
  /* 那一場打在那一趟去的地方，不是「現在」在哪——回頭看一場舊的，
     背景要是當時那個地方。 */
  var zone = zoneOfRun(r, t.teamId);
  var ph = btPhase(r);

  /* ── 一場講話，不是一場對峙 ──

     本來是寶可夢的排法：他站右上、你站左下（背影）、兩張名牌在對角、
     底下字幕框、右邊選單。那個排法在說「兩邊要分勝負」。

     可是這裡發生的事是：你走到了，把東西交給他，他收下。那是一段對話。
     所以改成近幾年 RPG 的講話畫面——

       場上只有說話的那一個。你是鏡頭，背影的自己拿掉了。
       名牌長在對話框上，斜切一角，不是漂在場景角落。
       選項排在框底下，不是排在框旁邊。
       他大一階：對峙的時候他是對手，講話的時候他是這一格的主角。

     你承諾了幾天沒有不見，它搬到右上角一行——那是你身上帶著的東西，
     不是他名牌上該有的字。

     舊的那一套沒有刪掉：.bt 本體、名牌、站台、閃場都還在，
     .talk 只是把它們重排（見 58-battle.css）。 */
  /* ── 遭遇只有一次 ──

     這一頁每答完一題就整塊重畫（見 ACTS.btnext：S.p 換一個 q 再 render），
     而遭遇那兩段動畫是掛在元素上的——元素重新生出來，動畫就重播。
     所以本來是：每按完一部份，整個畫面黑閃一次、委託人再從右邊滑進來
     一次。使用者：「為什麼我交作業每按完一部份生物就會閃一次」。

     那兩段是「你遇到他了」的戲，一趟只該演一次。演第二次就不是遇到，
     是他每答一題就消失再出現。

     怎麼分：進這一頁的時候 S.p 只有 { id }（見 60-student.js 的
     go:battle），問題那幾步一定帶 ph。所以沒有 ph 就是剛遇到。 */
  var 剛遇到 = !S.p.ph;
  var H = ['<div class="bt talk ' + zone.key + ' at-' + ph +
    (剛遇到 ? ' first' : '') + '" data-run="' + esc(r.runId) + '">'];

  /* 遭遇：整個畫面閃一次再進場。只有剛遇到才放。 */
  if (剛遇到) H.push('<div class="bt-wipe"></div>');
  /* 你說了幾天。本來寫在你那張名牌上。 */
  H.push('<div class="bt-hud">說 ' + esc(estSay(r)) + '</div>');

  H.push('<div class="bt-side foe">');
  H.push('<div class="bt-pad"></div>');
  /* 大隻的那一張（36×24，見 19-patron.js 的 PAT_BIG）。

     這一格本來畫 24×16 的那張——那是廊道上遠遠看一眼的尺寸，
     而這裡是整條流程最近的一次照面，他就在你面前。
     兩張都是 3:2，所以同一個框，多 2.3 倍的格子：眼睛有瞳孔、
     手有指節、他在呼吸。 */
  H.push('<div class="bt-ch foe">' + patTag(mob, zone.pal, 'bt-px', 1) +
    pxFlash(mob.big || mob.px) + '</div>');
  H.push('</div>');

  H.push('</div>');

  /* ── 對話框 ──
     名牌長在框的左上角。整段對話都掛他的名字：你站在他面前，
     這個框裡的每一句都是這一場的話。 */
  H.push('<div class="bt-bottom talk">');
  H.push('<div class="bt-say' + (S.p && S.p.no ? ' no' : '') +
    '"><span class="bt-name">' + esc(mob.n) + '</span>' +
    '<i class="bt-arrow"></i><b id="btline">' +
    esc(btLine(r, mob, ph)) + '</b></div>');

  /* ── 老師為什麼退回 ──

     本來這一句只在首頁那張卡上。學生按下「再打一次」之後它就不見了，
     於是他要在**看不到理由的情況下**重答七題——而那句話正是他這一刻
     唯一需要的東西。

     退回一定帶著一句話（actReject 擋在資料層），所以這裡一定有東西
     可以印。署名：一個班三位老師，沒有名字他不知道去找誰問。 */
  if (r.state === 'back' && r.word) {
    var rw = r.wordBy ? userOf(r.wordBy) : null;
    H.push('<div class="bt-rej"><b>' + esc(rw ? rw.name : '老師') + '</b>' +
      esc(r.word) + '</div>');
  }

  if (ph === 'menu') {
    H.push('<div class="bt-menu">');
    /* 兩個選項寫成他真的要做的事：戰鬥就是回報進度，那不是比喻，
       那一頁問的就是「實際花了幾天」跟「順不順」。括號裡那一句
       讓第一次進來的人不用猜「上」是什麼意思。 */
    H.push(btChoice('btgo:' + r.runId,
      r.state === 'back' ? '改好了，再交一次' : '交東西給他', 'go'));
    /* ── 退回的那一趟沒有「還沒準備好」 ──

       那一顆按下去走的是 actRethink，而 actRethink 只收 running。
       所以被退回的人按了它：角色演完往回跑、畫面把他丟回「說幾天」
       那一頁，可是那一趟還停在 back——他在那一頁按「出發」也不會
       有事發生（actCommit 看到已經有一趟就直接回傳）。
       一顆看起來會做事、其實什麼都不會發生的鍵。

       而且它本來就不該做事：那一趟的兩個數字在他第一次交出去的
       當下就定了、判定也蓋了。退回不動判定，那就沒有東西可以退。

       換成一顆老實的：回廊道。老師那一句還在那裡等他，他隨時
       回得來。 */
    H.push(r.state === 'back'
      ? btChoice('go:home', '回廊道', '')
      : btChoice('btback:' + r.runId, '還沒準備好', ''));
    H.push('</div>');
  }
  H.push('</div>');

  /* ── 問答：一頁一題 ──
     題目寫在對話框裡（他問的那一句），答的地方接在底下。 */
  if (ph === 'q') {
    var qs = btAsks(r);
    var qi = Math.max(0, Math.min(qs.length - 1, Number(S.p.q) || 0));
    var last = qi === qs.length - 1;
    /* 這一題他一定要，而且還空著——那一格左邊那條會是全亮的
       （見 57-viz.css）。他在等這一格，不用按下去被退才知道。 */
    var need = qs[qi].need ? ' need' : '';
    H.push('<div class="bt-q' + need + '">');
    /* 第幾題。一排點，不是文字——「3 / 7」是一個要讀的東西，
       而這裡只需要知道「還有幾個」。 */
    H.push('<div class="bt-dots">');
    qs.forEach(function (s, i) {
      H.push('<i' + (i === qi ? ' class="on"' : (i < qi ? ' class="done"' : '')) + '></i>');
    });
    H.push('</div>');
    /* 題目跟答案中間那一行：這一格是誰寫的（見 whoTag）。

       「誰交出去就是誰寫的那一份」只在第一題說一次。它回答的是
       「我要不要等隊友寫」，而那個疑問一趟只會產生一次——四題各說
       一遍就從說明變成雜訊。 */
    H.push(whoTag(qs[qi].who, qi === 0 ? qs[qi].tail : ''));
    H.push(qs[qi].body(r, t));
    H.push('<div class="bt-menu wide">');
    /* ── 前兩題是你的，後三題是你們的 ──

       第 2、3 題（你那幾件各花幾天、你做了什麼）是這個系統裡唯二
       屬於個人的東西；第 1、4、5、6 題整組一個答案。

       ── 為什麼是翻轉預設，不是設一個組長 ──

       四個人如果都一路走到底，後面那三題會被答四次而只有一次算數，
       前面三次是白打的字。

       設一個組長可以解決，但代價比較大：他不在那一趟就交不出去
       （單點故障）、要多一個設定的步驟、而且那等於系統替他們決定
       誰負責什麼——這一套從頭到尾的規矩是「系統不定義他們在做什麼」。

       改成翻轉預設：填完自己那兩題，最大的那一顆是「我這一份好了」。
       要往下走的人自己多按一下，而按下去的那個人就是這一趟實際上
       替大家交的人——不用設定、不會缺席、每一趟可以是不同的人。 */
    var mineDone = qs[qi].k === 'said' && r.state === 'running';
    if (mineDone) {
      /* 存過了就是「改」。同一顆鍵、同一條路，只有字不一樣——
         鎖起來的話他發現寫錯就沒有出口了（見 60-student.js）。 */
      var 存過 = !!((r.said || {})[S.who]);
      /* 一個人一組的時候沒有「大家」。 */
      var 只有他 = where('Users', function (u) {
        return inTeam(u, t.teamId) && u.role === 'student';
      }).length <= 1;
      H.push(btChoice('btsave:' + r.runId, 存過 ? '改好了' : '我這一份好了', 'go'));
      H.push(btChoice('btnext:' + r.runId, 只有他 ? '接著交出去' : '順便幫大家交出去', ''));
    } else {
      H.push(btChoice('btnext:' + r.runId, last ? '交出去' : '接著說', 'go'));
    }
    if (qi > 0) H.push(btChoice('btprev:' + r.runId, '回上一題', ''));
    /* 「還沒準備好」只留在第一題。後面那幾題有「回上一題」，
       要退出一路退回去就好——每一頁都掛一顆離開鍵，等於每一頁
       都在問他一次「你確定要繼續嗎」。 */
    if (qi === 0) {
      H.push(r.state === 'back'
        ? btChoice('go:home', '回廊道', '')
        : btChoice('btback:' + r.runId, '還沒準備好', ''));
    }
    H.push('</div></div>');
  }

  return H.join('');
};

/* ── 這個框裡的每一句 ──

   名牌上是他的名字，那框裡的話就該是他的話。本來三句裡有兩句是
   系統的口氣（「這一趟做完了哪幾段？」），那讓整個框變成一張
   表單的標題列。

   他不收的時候也在這裡講。本來那幾道關卡是 say() 彈一下的提示，
   而提示是系統在說話——同一條規則從他嘴裡講出來，那一步就從
   「表單驗證沒過」變成「他不收」。 */
function btLine(r, mob, ph) {
  /* 他不收。那一句直接蓋掉這一格本來要說的話。 */
  if (S.p && S.p.no) return S.p.no;

  if (ph === 'menu') {
    /* 退回是老師做的，不是他做的。本來這一句寫「◯◯ 把東西退回來了」,
       等於把老師的決定算在委託人頭上——而學生這一刻最需要知道的是
       「是誰、為什麼」，那兩件在底下那張卡上（見下面的 rejCard）。

       他這一句只做一件事：你又回來了，我還在。 */
    if (r.state === 'back') return patSay(mob, 'redo') || '你又回來了。';
    /* 他認得你。

       第二次遇到同一位還講「你走到了。X 在這裡。」是錯的——
       那句話把每一次都當成第一次。mobDebut 算的正是「這一趟是不是
       這一組最早遇到他的那一趟」，資料本來就在。 */
    if (r.runId && !mobDebut(r.teamId, r.runId)) {
      return patSay(mob, 'again') || '又是你。這次帶了什麼來？';
    }
    return patSay(mob, 'wait') || ('你走到了。' + mob.n + ' 在這裡。');
  }
  /* 問答的時候，框裡那一句就是他問的那一題（見 BT_STEPS）。
     本來是「你帶了什麼來？」這種過場，而過場底下接一疊表單，
     等於那一句跟底下那些格子沒有關係。 */
  if (ph === 'q') {
    var qs = btAsks(r);
    var qi = Math.max(0, Math.min(qs.length - 1, Number(S.p.q) || 0));
    return qs[qi].ask;
  }
  /* 他接過去那一下。埋岩獸的下半身在岩壁裡、蔓群沒有手、
     引鐵根本不用伸手——「他伸手接過去」對這三位都是錯的。 */
  return patSay(mob, 'take') || '他伸手接過去。';
}

/* ---------- 這一格是誰寫的 ----------

   交件那七頁裡，有兩題是每個人各寫各的（各花幾天、你做了什麼），
   其餘是全組一份。而畫面上沒有任何地方說過這件事——學生只能從
   「按不按得動」去猜：別人那幾格是灰的，自己那幾格有 ＋ －。

   那個線索只在有拆件的時候存在，而且它是事後才發現的（伸手去按
   才知道按不動）。第一次用的人在「你做了什麼」那一頁根本不知道
   隊友等一下也要寫一份，於是他寫的是整組做了什麼——那一格就變成
   第二份組的答案，而它本來是這套系統收個人層資料的唯一入口。

   所以在答之前先說。兩種狀態、同一個位置、同一種寫法：

     全組一份　　　　誰交出去，就是誰寫的那一份
     每個人各寫各的　隊友那幾格他們自己填

   不用顏色編碼——顏色在這個作品裡一個顏色一件事（見 3.2），
   而這件事不值得吃掉一個顏色。位置固定就夠了：它永遠在題目
   跟答案中間那一行。 */
/* head 是「這一行在講哪一格」——只有同一張卡上兩種都有的時候要寫
   （承諾那一頁的拆件卡）。一頁一題的那幾頁不用，題目自己就是。 */
function whoTag(kind, tail, head) {
  /* 不分組那一站不畫這一行：一個人的時候「全組一份」跟「每個人各寫
     各的」是同一件事，兩句都變成廢話——而一句廢話擺在題目跟答案中間
     比沒有那一行更糟。 */
  if (RULES.SOLO) return '';
  if (kind !== 'one' && kind !== 'team') return '';
  return '<div class="wtag' + (kind === 'one' ? ' one' : '') + '">' +
    (head ? esc(head) + '：' : '') +
    esc(kind === 'one' ? '每個人各寫各的' : '全組一份') +
    (tail ? '<span>' + esc(tail) + '</span>' : '') + '</div>';
}

/* 選單上的一行。舊版寶可夢的游標長在前面（見 58-battle.css）。 */
function btChoice(act, label, cls) {
  return '<button class="bm ' + cls + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: act })) + '\'>' + esc(label) + '</button>';
}

/* ---------- 一頁一題 ----------

   本來兩頁：第一問塞了三題（老師去哪看、各花幾天、誰做了什麼），
   第二問塞了四題（順不順、為什麼、範圍、再兩天）。七題兩頁。

   兩個問題：

   一 · 這個作品自己的規矩是「一頁只給一個動作」（見 60-student.js
        開頭）。交作業那一段是全站唯一違反它的地方，而且違反得最兇。

   二 · 那一疊表單比一個畫面高，所以要往下拉——**一拉委託人就出去了**。
        他站在那裡等你回話，而你答題的時候看不到他。那就不是對話，
        是他站在表單上面當插圖。

   所以拆成七步，一步一題，委託人一直在畫面上。而每一步的那一句
   就是題目本身：對話框裡寫的不再是「路上怎麼樣？」這種過場，
   是他真的在問的那一句。

   有幾題會被跳過：沒拆件就沒有「各花幾天」，深度不夠就沒有「為什麼」
   （見 RULES.asks）。跳過的不算在步數裡，所以那一排點數得出來幾題。 */
var BT_STEPS = [
  /* ── 東西在哪裡 ──

     這裡一度還有第二格「你最想要老師看哪裡」。拿掉了：那一題每一趟
     都要再想一次「哪一段最值得看」，而這一段是每一趟都要走的，
     消耗掉的耐心比它換來的東西多。

     老師那一邊跟著回去：他的評語不再接在某一處底下，回到一句
     他自己起頭的話（見 70-teacher.js）。 */
  { k: 'where', ask: '老師要去哪裡看？', who: 'team',
    tail: '誰交出去就是誰寫的那一份',
    body: function (r, t) {
      var H = [];
      H.push('<input class="bt-w" id="bt-where" oninput="DRAFT.where=this.value" ' +
        /* 空的。本來會把上一趟填過的那一句帶進來（lastWhere），
           而那是幫他填——上一趟交在 TronClass，這一趟可能印出來放在
           老師桌上，那不是同一件事。 */
        'placeholder="' + esc('例：TronClass 第三次作業 · 印出來放你桌上') +
        '" value="' + esc(draft('where', '')) + '">');
      /* 上一趟那一句，一顆可以點的。點了才進去——一樣是他自己選，
         但大部分的時候不用再打一次同樣的字。 */
      var lw = lastLink(t.teamId, r.runId);
      if (lw && String(DRAFT.where || '').trim() !== lw) {
        H.push('<button class="lastw" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'usewhere' })) + '\'>上次：' + esc(lw) + '</button>');
      }
      return H.join('');
    },
    need: function (r, t) {
      return !!String(DRAFT.where || '').trim();
    } },

  { k: 'spent', ask: '這幾件各花了幾天？', who: 'one',
    skip: function (r) { return !((r.plan || []).length); },
    body: function (r, t) { return btSpent(r); },
    /* 只看你名下那幾件。別人的那幾格他們自己填，拿別人沒填來擋你
       是連坐（跟「誰做了什麼」同一條規矩）。 */
    need: function (r) {
      var mine = myItems(r, S.who);
      if (!mine.length) return true;
      for (var i = 0; i < mine.length; i++) {
        if (!(Number((DRAFT.spent || [])[mine[i]]) > 0)) return false;
      }
      return true;
    } },

  { k: 'said', ask: '你做了什麼？', who: 'one',
    body: function (r, t) { return btSaid(r, t); },
    need: function (r, t) {
      var said = (r && r.said) || {};
      return !!String(DRAFT.said1 == null ? (said[S.who] || '') : DRAFT.said1).trim();
    } },

  /* 「為什麼」本來是獨立的一題。併回來了：它問的就是上面那三顆的
     理由，而一個問「為什麼」卻看不到自己剛剛選了什麼的頁面，
     等於要他自己記住。

     選了才長出來——順的那一趟不會多出一個空框。 */
  { k: 'feel', ask: '這一趟順不順？', who: 'team',
    body: function (r) {
      var H = ['<div class="feels">'];
      FEELS.forEach(function (f) {
        H.push('<button class="fl' + (DRAFT.feel === f[0] ? ' on' : '') +
          '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'feel:' + f[0] })) +
          '\'>' + esc(f[1]) + '</button>');
      });
      H.push('</div>');
      if (DRAFT.feel && btAskHard(r.teamId)) {
        H.push('<div class="eyebrow">為什麼　選填</div>');
        H.push('<textarea class="bt-w" id="bt-why" rows="2" maxlength="300" ' +
          'oninput="DRAFT.why=this.value" placeholder="' +
          esc('選填。') + '">' + esc(draft('why', '')) + '</textarea>');
      }
      return H.join('');
    } },

  { k: 'scope', ask: '做出來的，跟你當初說的一樣嗎？', who: 'team',
    body: function () {
      var H = ['<div class="feels">'];
      [['more', '比說的多'], ['same', '差不多'], ['less', '比說的少']].forEach(function (x) {
        H.push('<button class="fl' + (DRAFT.scope === x[0] ? ' on' : '') +
          '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'scope:' + x[0] })) +
          '\'>' + esc(x[1]) + '</button>');
      });
      H.push('</div>');
      return H.join('');
    } },

];

/* 這一趟真的要問哪幾題。 */
function btAsks(r) {
  return BT_STEPS.filter(function (s) { return !(s.skip && s.skip(r)); });
}

/* 第一問：老師分的段，勾掉做完的。 */
/* 第一問：前面開的這些細項，實際花了多少時間。

   承諾的時候他一件一件估過，現在一件一件回報實際。預設帶入他當初
   估的那個數字——「沒改」本身就是一個答案，而且他不用從零開始按。

   本來這一問是「勾掉哪幾段做完了」。勾掉不帶任何數字，而這個作品
   在量的東西是數字。 */
/* 這幾件各花了幾天。一題一頁，所以這裡不再需要標題——
   標題在對話框裡，是他問的那一句（見 BT_STEPS）。 */
function btSpent(r) {
  var pl = (r && r.plan) || [];
  var H = [];
  if (pl.length) {
    /* 從 0 開始，不是從他當初估的天數開始。

       本來每一格預設成 x.d——也就是他承諾的那個數字。那等於系統
       先替他回答「跟我說的一樣」，而他只要一路按過去，交出去的
       就是一份「每一件都剛剛好」的報告。

       這一格是整套系統唯一在量的東西（說幾天 vs 實際幾天）的細項版。
       預填它就是在汙染那份資料，而且汙染的方向剛好是「看起來很準」。 */
    /* 已經存進去的先帶回來。

       本來一律從 0 開始（理由見上面：不能拿他承諾的天數當預設，
       那等於系統先替他回答「跟我說的一樣」）。可是每個人現在會先
       存自己那一份（見 40-db.js 的 actMyPart），所以回來交出去的
       時候，畫面上要看得到組員已經填過的數字——不然那一題的守門
       會擋住他，而他明明填過了。

       帶回來的是**已經回報的實際天數**，不是他承諾的天數。
       那兩件事不一樣：前者是已經發生的事，後者才是預設答案。 */
    if (!DRAFT.spent) {
      DRAFT.spent = pl.map(function (x, i) {
        return clamp(0, RULES.EST_MAX, Number((r && r.spent || [])[i]) || 0);
      });
    }
    var mine = myItems(r, S.who);
    H.push('<div class="splist">');
    pl.forEach(function (x, i) {
      /* 只有掛在你名下的那幾件按得動。別人的看得到，按不動——
         同一張紙上你只寫得了自己那一行。 */
      var own = mine.indexOf(i) >= 0;
      H.push('<div class="sp2' + (own ? '' : ' theirs') + '">');
      H.push('<b style="background:' + stepHue(i) + '"></b>');
      H.push('<i>' + esc(x.n) + '</i>');
      /* 不分組那一站不畫這一欄：每一件都是他的。 */
      if (!RULES.SOLO) H.push('<u class="who">' + esc(shortWho(x.who)) + '</u>');
      /* 承諾那一件用小時／週填的話，印他原始講的數字（見 60-student.js
         的 xn），不是換算過的小數天。 */
      H.push('<u class="said">說 ' +
        ((x.dU && x.dU !== 'd' && x.dN != null) ? esc(x.dN + estUnit(x.dU).name) : x.d + ' 天') +
        '</u>');
      if (own) {
        H.push('<button class="pd" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'spent:' + i + ',-1' })) + '\'>−</button>');
        H.push('<u class="got">' + DRAFT.spent[i] + '</u>');
        H.push('<button class="pd" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'spent:' + i + ',1' })) + '\'>＋</button>');
      } else {
        H.push('<u class="got dim">' + DRAFT.spent[i] + '</u>');
      }
      H.push('</div>');
    });
    H.push('</div>');
    /* 還有幾個人沒填自己那一份。不擋交出去——擋了的話一個人不在，
       整組就交不出去。只是說出來，讓他們自己決定要不要等。
       跟承諾那一頁同一句話（見 60-student.js）。 */
    /* 跟廊道同一條規矩：先講你自己那一半（見 60-student.js）。 */
    var lf = partsLeft(r);
    var 我存過 = !!((r.said || {})[S.who]);
    if (lf && 我存過) {
      H.push('<p class="dim">你這一份存過了，改了再存一次就好。' +
        '還有 ' + lf + ' 個人沒填，不用等他們，你可以直接往下交出去。</p>');
    } else if (lf) {
      H.push('<p class="dim">還有 ' + lf + ' 個人沒填自己那一份。' +
        '他們各自進來填，那幾個數字才是他們的——但不用等，你填完自己這裡就可以往下交出去。</p>');
    }
  }
  return H.join('');
}

/* 誰做了什麼。 */
function btSaid(r, t) {
  var H = [];
  /* 我做了什麼。每個人各寫一行，全隊並排——
     這一段本身就是「互相表達」的介面：誰寫了、誰沒寫，同一個畫面上。

     ── 先寫完自己的，才看得到別人的 ──

     本來一打開就看得到隊友寫了什麼。那會發生兩件事：你會照著他的
     句型寫，而且你會挑他沒提到的講——你寫的不再是「我做了什麼」，
     是「相對於他，我做了什麼」。

     這一份資料是老師判斷的材料，被錨定過的材料沒有用。

     所以在你自己那一行寫完之前，隊友那幾行只看得到寫了沒有；
     寫完就全部打開。這不是規則，是順序——同時出牌，然後一起翻。
     （這一套本來就擋著跨組的預估互看，理由一樣：見 40-db.js 結尾
     那一段 estSpread 為什麼拿掉。） */
  H.push('<div class="saidlist">');
  var mem = t ? where('Users', function (u) { return inTeam(u, t.teamId); }) : [];
  var said = (r && r.said) || {};
  /* 你自己那一行寫了沒有。DRAFT 是他現在打的，said 是之前存的。 */
  var wrote = !!String(DRAFT.said1 == null ? (said[S.who] || '') : DRAFT.said1).trim();
  mem.forEach(function (u) {
    var me0 = u.userId === S.who;
    H.push('<div class="sd' + (me0 ? ' mine' : '') + '">');
    H.push(pxTag(heroOf(u).idleA, heroOf(u).pal, 'sd-px'));
    H.push('<b>' + esc(me0 ? '你' : (u.name || '')) + '</b>');
    if (me0) {
      H.push('<input class="bt-w" id="bt-said" oninput="DRAFT.said1=this.value" ' +
        'placeholder="' + esc('這幾天你做的是什麼') + '" value="' +
        esc(draft('said1', said[u.userId] || '')) + '">');
    } else if (!said[u.userId]) {
      H.push('<span>還沒說</span>');
    } else if (wrote) {
      H.push('<span>' + esc(said[u.userId]) + '</span>');
    } else {
      /* 他寫了，但你還沒。看得到有這一行，看不到內容。 */
      H.push('<span class="sd-hid">寫好了</span>');
    }
    H.push('</div>');
  });
  H.push('</div>');
  return H.join('');
}

/* 第二問：這一趟走得怎麼樣。

   哪一段比想的久（點的）＋ 兩題自己寫的。兩題都選填——
   逼人打字會拿到為了交差而打的字，那一刻資料就開始說謊。

   輸入框跟 DRAFT 綁著、而且不重畫：重畫會把 innerHTML 換掉，
   打到一半的字會不見，游標也會跳掉。 */
/* 三選一那三個。BT_STEPS 的「順不順」那一題用它。
   本來這裡還有一支 btAsk，把順不順、為什麼、範圍、再兩天四題
   畫在同一頁；拆成一頁一題之後那四題各自搬進 BT_STEPS 了。 */
var FEELS = [['good', '順'], ['ok', '普通'], ['bad', '不順']];

/* 名牌。照舊版寶可夢：名字在上，底下一行小字。
   那條斜出去的尾線是那個畫面最好認的一筆，在 CSS 裡。 */
function btPlate(name, side, note) {
  return '<div class="bt-plate ' + side + '">' +
    '<b>' + name + '</b>' +
    (note ? '<span class="bt-num">' + note + '</span>' : '') +
    '</div>';
}

/* 結局那一句。三種，而且三種都不拿走任何東西。 */
function btVerdict(r) {
  var est = r.est || 1;
  var act = r.actual || est;
  /* 小時／週承諾的話，est 是換算過的小數天，「還有 0.67 天沒用完」
     這種話比不寫還誤導——那種時候只說收下了，不算差幾天。 */
  var hourly = r.estU && r.estU !== 'd' && r.estN != null;
  if (hourly) return { key: act <= est ? 'early' : 'late', line: '他收下了。' };
  if (act < est) {
    return { key: 'early', line: '他收下了。你還有 ' + (est - act) + ' 天沒用完。' };
  }
  if (act === est) return { key: 'exact', line: '他收下了。剛好是你說的天數。' };
  return { key: 'late', line: '他收下了，不過多花了 ' + (act - est) + ' 天。' };
}

/* ---------- 演一次 ----------

   render() 畫完之後呼叫。整場沒有輸入會改變結果，
   這裡只負責讓它花幾秒鐘發生。 */
function battleRun() {
  battleStop();
  if (S.page !== 'battle') return;
  var box = document.querySelector('.bt');
  if (!box) return;

  /* 黑幕用 JS 拿掉，不能只靠動畫收尾。動畫的時鐘會被凍住
     （背景分頁、省電、自動化瀏覽器），那時候黑幕會一直蓋著。 */
  var wipe = box.querySelector('.bt-wipe');
  if (wipe) btAt(460, function () { if (wipe.parentNode) wipe.parentNode.removeChild(wipe); });

  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return;
  var line = document.getElementById('btline');
  function say(s) { if (line) line.textContent = s; }

  /* 還沒準備好：角色往回跑出畫面，回到廊道。
     run 不動——他只是先離開，隨時可以再走進來交。
     本來這裡會呼叫 actRethink 把那一趟作廢再開新的，
     但使用者預期的是「先不交」不是「這一趟重來」。 */
  if (S.p.flee) {
    box.classList.add('flee');
    btAt(850, function () {
      S.p = {};
      go('home');
    });
    return;
  }

  /* 答完一題，他接過去。往前低一下再回來——接東西的動作。

     本來這裡叫 hurt，掛的是對決那一組動畫（畫面震、往右退、閃三下），
     而註解自己寫著「不是被打」。名字跟動畫都換掉了，見 58-battle.css
     的「接過去」。 */
  if (S.p.take) {
    S.p.take = 0;
    box.classList.add('take');
    btAt(560, function () { box.classList.remove('take'); });
  }

  var ph = btPhase(r);
  if (ph === 'menu') {
    btAt(900, function () {
      var bo = document.querySelector('.bt-bottom');
      if (bo) bo.classList.add('ready');
    });
    return;
  }
  if (ph !== 'play') return;

  var act = r.actual || (r.est || 1);

  /* 一 · 把這一趟報出來。這是整場唯一決定結果的東西。 */
  btAt(800, function () {
    say('你說 ' + estSay(r) + '，實際走了 ' + act + ' 天。');
    box.classList.add('told');
  });

  /* 二 · 他收下了，然後離開。閃四下，然後往下滑出畫面——
     舊版寶可夢的敵人退場就是這樣：沒有爆炸，沒有粒子，就是滑下去。
     借的是那個乾淨的退場，不是「被打倒」。 */
  btAt(1900, function () {
    say(mobOfRun(r).n + ' 收下了。');
    box.classList.add('foe-out');
  });

  /* 三 · 演完直接換頁。不用再按一次。

     這裡本來還有一張卡：「新登場 · 已收錄在圖鑑」，在牠倒下的
     下一拍跳出來。拿掉了，搬到老師收下的那一刻（見 60-student.js
     的 okPend）——圖鑑的解鎖條件是收下，而這一刻老師還沒看。
     卡片說收好了、翻開圖鑑還是黑影，那張卡就是在說謊。

     而且它算的是「第一次遇到」：被退回、改好再交一次，牠會再
     跳一次——同一位新登場兩遍。 */
  btAt(3200, function () { go('stamp', { id: r.runId }); });
}

/* 上：進第一問。老師沒分段就直接到第二問（見 btPhase）。 */
ACTS.btgo = function (id) {
  battleStop();
  S.p = { id: id, ph: 'q', q: 0 };
  render();
};

ACTS.btprev = function (id) {
  battleStop();
  S.p = { id: id, ph: 'q', q: Math.max(0, (Number(S.p.q) || 0) - 1) };
  render();
};

/* 答完一題，往下一題。最後一題按下去就是交出去。

   每一題自己那道關卡在這裡跑：他不收的時候留在原地，那一句換成
   他說的（見 BT_STEPS 的 no 與 btLine）。關卡跟著題目走，所以他
   是在你漏掉那一題的當下就說，不是等到最後才一次退回來。 */
ACTS.btnext = function (id) {
  battleStop();
  var r0 = find('Runs', function (x) { return x.runId === id; });
  if (!r0) return;
  var qs = btAsks(r0);
  var qi = Math.max(0, Math.min(qs.length - 1, Number(S.p.q) || 0));
  var step = qs[qi];
  /* 他不收。那一句是「還沒。」＋這一題——拒收看得出來，題目也還在。 */
  if (step.need && !step.need(r0, myTeam())) {
    S.p = { id: id, ph: 'q', q: qi, no: '還沒。' + step.ask };
    return render();
  }
  if (qi + 1 < qs.length) {
    S.p = { id: id, ph: 'q', q: qi + 1, take: 1 };
    return render();
  }
  ACTS.btq2(id);
};

/* 第二問答完：打牠一下，然後交出去。
   省思在看到判定之前存下來，所以它不是事後回頭解釋的。 */
ACTS.btq2 = function (id) {
  var t = myTeam();
  battleStop();
  var run = find('Runs', function (x) { return x.runId === id; });
  var again = !!(run && run.state === 'back');
  /* 每一題自己的關卡在 btnext 跑過了（見 BT_STEPS 的 no）。
     這裡再擋一次是因為 btq2 也可能被別的路叫到。 */
  var qs0 = btAsks(run);
  for (var qq = 0; qq < qs0.length; qq++) {
    if (!qs0[qq].need || qs0[qq].need(run, t)) continue;
    S.p = { id: id, ph: 'q', q: qq, no: '還沒。' + qs0[qq].ask };
    return render();
  }
  actReflect(t.teamId, id, DRAFT.overs || [], DRAFT.hard, DRAFT.pace,
    { spent: DRAFT.spent, feel: DRAFT.feel, why: DRAFT.why,
      scope: DRAFT.scope, said1: DRAFT.said1 });
  /* 退回那一場走 actResend 不走 actSubmit：答案更新，判定不動。

     actSubmit 會重算 actual 與 stamp，而退回不動判定——那一趟的兩個
     數字在他第一次交出去的當下就定了，重做不會讓他當初說的話
     變成別的話。 */
  /* 交出去用的也是他這一次打的。本來這裡也會退回 lastWhere，
     所以就算欄位看起來是空的，交出去的仍然是上一趟那一句。 */
  var wh = String(DRAFT.where || '').trim();
  var okd = again ? actResend(t.teamId, id, wh) : actSubmit(t.teamId, id, wh);
  if (!okd) return say('這一趟已經交過了。');
  DRAFT.overs = null; DRAFT.said = 0; DRAFT.hard = ''; DRAFT.pace = '';
  DRAFT.scope = null; DRAFT.said1 = ''; DRAFT.where = null;
  DRAFT.spent = null; DRAFT.feel = ''; DRAFT.why = '';
  S.p = { id: id, ph: 'play', take: 1 };
  render();
};

/* 我這一份先存起來。狀態不動，老師還看不到——他填的是自己那兩樣。

   底下三題（順不順、範圍、再兩天）是整組一個答案，由交出去的
   那個人寫，所以這裡不碰它們。 */
ACTS.btsave = function (id) {
  battleStop();
  var t = myTeam();
  var r = find('Runs', function (x) { return x.runId === id; });
  if (!r) return;
  /* 自己那一句一定要有，不然這一顆等於什麼都沒存。 */
  var said = (r && r.said) || {};
  var one = String(DRAFT.said1 == null ? (said[S.who] || '') : DRAFT.said1).trim();
  if (!one) {
    S.p = { id: id, ph: 'q', q: Number(S.p.q) || 0, no: '還沒。你做了什麼？' };
    return render();
  }
  actMyPart(t.teamId, id, { spent: DRAFT.spent, said1: DRAFT.said1 });
  var left = partsLeft(find('Runs', function (x) { return x.runId === id; }));
  DRAFT.spent = null; DRAFT.said1 = '';
  go('home');
  /* 一個人一組的時候沒有「全組」。 */
  var 只有我 = where('Users', function (u) {
    return inTeam(u, t.teamId) && u.role === 'student';
  }).length <= 1;
  say(left ? '存起來了。還有 ' + left + ' 個人沒填。'
    : (只有我 ? '存起來了。可以交出去了。'
      : '存起來了。全組都填完了，誰按交出去都可以。'));
};

/* 還沒好：角色往回跑出畫面，然後回到「說幾天」。 */
ACTS.btback = function (id) {
  battleStop();
  S.p = { id: id, flee: 1 };
  render();
};


/* ===== 68-rank.js ===== */
/* ---------- 排行榜 ----------

   這一支是刻意加進來、而且準備好隨時拿掉的。

   作品原本的立場是不排名（見 check.js 的禁用詞）。使用者以 RtD
   （research through design）為方法決定要做：東西做出來、放進去用、
   看實際發生什麼；評價不好就拿掉，而「拿掉」本身也是一個發現。

   要拿掉的話：刪掉這個檔案、68c-crystalrank.js 與 58-rank.css，再把
   62-eco.js 裡那一行 bothCard(...) 與 segs 裡的 both 拿掉。
   沒有別的地方依賴它。

   ── 排什麼 ──

   排產出量會直接壞掉：做得多的組永遠在上面，而做得多跟做得好、跟
   專案管理學得如何都沒有關係，那只會獎勵灌水與過勞。

   這裡排的是「估得準不準」，因為它是這個系統裡唯一非零和的量：
     · 估準跟做多做少無關
     · 每一組可以同時很準——它不是有人上去就有人下來
     · 而且它正是這個系統在教的東西

   ── 為什麼是偏差率不是天數 ──

   用「準的範圍」判定會有一個漏洞：容差是 承諾 × 比例，所以把承諾灌大
   就自動變準。用偏差率（|實際 − 承諾| ÷ 承諾）就沒有這個問題——
   說 21 天做 3 天，偏差率是 86%，很難看。

   ── 三個護欄 ──

   一 · 只算最近三趟。名次要會流動，落後的追得上；算整學期的話
        前面幾趟失手的組就再也翻不了身，那正是排行榜最傷人的地方。
   二 · 可以自己選擇不上榜。自主性優先於排名。
   三 · 沒有分數、沒有獎勵、不影響任何判定。它純粹是一面鏡子。 */

var RANK_N = 3;   /* 只算最近三趟 */

/* 一組的平均偏差率。沒有判定過的趟就回 null。 */
function rankDev(teamId) {
  var rs = where('Runs', function (r) {
    /* 只算老師收下的。排行榜是這一套裡唯一還留著的「獎賞」，
       而獎賞不該由系統自己發——交出去就上榜的話，老師是可選的。 */
    return r.teamId === teamId && r.stamp && r.est > 0 && r.actual > 0 &&
      (r.state === 'done' || r.state === 'approved');
  }).sort(function (a, b) { return (a.submittedAt || 0) - (b.submittedAt || 0); });
  if (!rs.length) return null;
  var use = rs.slice(-RANK_N);
  var sum = 0, hit = 0, marks = [];
  use.forEach(function (r) {
    /* ── 用他自己說的那個數字，不是談完的那個 ──

       老師回一句「我覺得會是 8 天」，學生按下去，真的做了 8 天。
       判定算他做到了，那是對的——他答應 8 天，做到 8 天。

       可是這張榜排的是「他估得準不準」。用談完的數字算，那一趟會變成
       滿分，而那個滿分是老師估的。每次都說「好」的那一組會排在最上面，
       榜就不再是它自己說的那件事了。

       改讀 estOwn（見 40-db.js）：他一個人的時候按下去的那一個。
       所以接受那一句話對榜完全沒有影響——不加分，也不扣分。
       判定那一邊一個字都沒動。 */
    var own = estOwn(r);
    if (!(own > 0)) return;
    sum += Math.abs(r.actual - own) / own;
    /* 只有「跟承諾的一樣」算準。早跟晚都是不準——
       說 5 天做了 1 天是差了 80%，跟做了 9 天一樣。

       這裡不能讀 r.stamp：那是拿談完的數字判的。同一列上面排的是
       他自己的數字、下面印的是談完的判定，那一列會自己打架。 */
    var mk = RULES.judge(own, r.actual).key;
    if (mk === 'exact') hit++;
    /* 每一趟往哪一邊偏。三顆空心的點看不出「他每次都比說的久」，
       而那是這張榜上最值得看到的一件事。 */
    marks.push(mk);
  });
  if (!marks.length) return null;
  /* hit 是寫出來給人看的：準了幾次。加法的講法——
     「你拿到了什麼」，不是「你錯了多少」。
     dev 只留著當平手時分先後，不寫出來。 */
  /* 除的是真的算進去的那幾趟，不是 use.length——上面會跳過沒有
     自己數字的那一趟，兩個數對不上的話平均會被稀釋。 */
  return { hit: hit, dev: sum / marks.length, n: marks.length, marks: marks };
}

/* 一個班的榜。沒有資料的排在最後，選擇不上榜的整個不出現。 */
function rankRows(classId) {
  var out = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    if (t.noRank) return;
    var d = rankDev(t.teamId);
    out.push({ teamId: t.teamId, name: t.name, dev: d ? d.dev : null,
      hit: d ? d.hit : 0, n: d ? d.n : 0, marks: d ? d.marks : [] });
  });
  /* 先比準了幾次（多的在上面），平手才用偏差率分先後。
     平手會很多，那是好事——它讓這張榜比較不像一條隊伍。 */
  out.sort(function (a, b) {
    if (a.dev === null && b.dev === null) return 0;
    if (a.dev === null) return 1;
    if (b.dev === null) return -1;
    if (a.hit !== b.hit) return b.hit - a.hit;
    return a.dev - b.dev;
  });
  return out;
}

/* 上不上榜自己決定。 */
ACTS.norank = function () {
  var t = myTeam();
  t.noRank = t.noRank ? 0 : 1;
  save();
  say(t.noRank ? '不上榜了。' : '上榜了。');
};

/* ---------- 水晶榜 ----------

   跟另外兩張榜一樣：刻意加進來、而且準備好隨時拿掉的。

   水晶跟估得準現在合成同一張（bothCard，就在底下）。要拿掉整套的話
   見 68-rank.js 的檔頭。

   ── 這一張排的是什麼 ──

   一件收下的委託 100 顆，老師多給的再加 0–5 顆。所以總額幾乎
   完全由「他們完成了幾件」決定——加成最多佔一趟的 5%，在榜上看得見，
   可是動不了名次。

   這是刻意的。排「完成幾件」是安全的：加法、人人可增。

   ── 要記著的一件事 ──

   老師多給的那幾顆是他對那一件的判斷（他那一頭問的是「完成到什麼
   程度」），而它**仍然會進這張榜**（只是最多 5%）。
   這個區間改過兩次：1–5 → 10–50 → 0–5。10–50 那一版佔 9–33%，那時候
   老師評的那一格是排名的一部分；2026-09-09 縮回來之後它動不了名次，
   可是它沒有離開這個算式。要讓榜完全不碰品質，就得把 bonus 從
   crystalOf 拿掉——那是另一個決定，還沒做。

   ── 這個數字是拿過的，不是手上剩的 ──

   水晶花得掉：300 顆可以照亮一位圖鑑上遇不到的委託人（見 40-db.js 的
   actLight）。而榜上如果印手上剩的，那張榜就會變成「不要用它」的壓力
   ——一個沒有人敢用的用途等於沒有用途。

   所以花掉的不扣，而且畫面上寫「拿過 N 顆」，不是只丟一個數字讓人
   自己猜規則。

   ── 這一張跟原本的立場相反，而且是明知故犯 ──

   這個作品拿掉過分數、等級、經驗值，理由都是同一個：一個會漲的數值
   會把「做這件事」換成「拿到那個數字」。水晶是一個會漲的數值。

   加它是因為老師需要一個比「可以／退回」更有層次的回應方式，而二選一
   確實太粗。壓在 5%、而且基本額不看品質，是為了讓它一直是一句話。

   要是觀察到學生開始為那幾顆做事，就拿掉——而拿掉本身也是一個發現。 */

/* ---------- 各組：兩個數字放在一起 ----------

   本來是兩張分開的榜，一次只看得到一個：水晶一張、估得準一張。
   使用者要的是把大家的進度放在一起，所以合成一張。

   ── 排序照估得準，不照水晶 ──

   68-rank.js 的檔頭把理由寫得很清楚：排產出量會直接壞掉——做得多的
   組永遠在上面，而做得多跟做得好、跟專案管理學得如何都沒有關係，
   那只會獎勵灌水與過勞。估得準是這裡唯一非零和的量：每一組可以
   同時很準，不是有人上去就有人下來，而且它正是這個系統在教的東西。

   收下幾件與水晶留在最右邊，看得到，但不決定順序。 */
function bothCard(classId, meId) {
  var rows = rankRows(classId);
  var me = meId ? teamOf(meId) : null;
  var crystal = {};
  crystalRows(classId).forEach(function (c) { crystal[c.teamId] = c; });

  var H = ['<div class="card rank">'];
  H.push('<h2 class="rk-h">' + (RULES.SOLO ? '每一位' : '各組') + '</h2>');
  H.push('<p class="dim">照最近 ' + RANK_N +
    ' 趟準了幾次排。收下幾件不決定順序——排做得多的，永遠是同幾組在上面。</p>');

  if (!rows.length) {
    H.push('<p class="dim">還沒有人上榜。</p></div>');
    return H.join('');
  }

  H.push('<div class="rk-list">');
  rows.forEach(function (r, i) {
    var mine = r.teamId === meId;
    var c = crystal[r.teamId];
    H.push('<div class="rk-r' + (mine ? ' mine' : '') +
      (r.dev === null ? ' none' : '') + '">');
    H.push('<i class="rk-i">' + (r.dev === null ? '·' : (i + 1)) + '</i>');
    H.push('<b>' + esc(shortName(r.name)) + '</b>');
    if (r.dev === null) {
      H.push('<span class="rk-d">還沒交過</span>');
    } else {
      /* 三個記號，一趟一個，照時間排。全部朝右的那一列，
         是「他每一趟都比自己說的久」（見 68-rank.js）。 */
      H.push('<div class="rk-dots">');
      for (var k = 0; k < RANK_N; k++) {
        var mk = r.marks[k];
        H.push('<span class="rk-m ' + (mk || 'none') + '">' +
          (mk ? stampPx(mk) : '') + '</span>');
      }
      H.push('</div>');
      H.push('<span class="rk-d">' + (r.hit ? '準 ' + r.hit + ' 次' : '還沒準過') + '</span>');
    }
    if (c && c.crystals.all) {
      /* 榜上這個數字是**拿過的總數**，不是手上剩下的（見 40-db.js 的
         crystalOf）。

         這一條不是實作細節，它是設計：水晶花得掉（照亮圖鑑上遇不到的
         那幾位），而如果榜上印的是手上剩的，那張榜就會變成「不要用它」
         的壓力——一個沒有人敢用的用途等於沒有用途。

         所以花掉的不扣。畫面上也要說，不然學生只會看到數字沒動然後
         自己猜規則。 */
      H.push('<span class="ck-c">收下 ' + c.done + ' 件　拿過 ' +
        c.crystals.all + ' 顆</span>');
    }
    H.push('</div>');
  });
  H.push('</div>');

  /* 出口一直在。自主性優先於排名。 */
  if (me) {
    H.push('<button class="rk-out" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'norank' })) + '\'>' +
      (me.noRank ? '回到榜上' : '不要上榜') + '</button>');
  }
  H.push('</div>');
  return H.join('');
}

function crystalRows(classId) {
  var out = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    if (t.noRank) return;
    var c = crystalOf(t.teamId);
    out.push({ teamId: t.teamId, name: t.name, crystals: c, done: c.base / RULES.CRYSTAL.base });
  });
  /* 先比總額。總額幾乎就是完成件數，所以這一榜排的其實是
     「你們做完幾件」——那是加法，人人可增。 */
  out.sort(function (a, b) { return b.crystals.all - a.crystals.all; });
  return out;
}

    H.push(head('剛承諾', asks.length ? asks.length + ' 組剛說了天數' : '沒有剛承諾的',
      ''));
    /* 這一頁不在分頁上，所以要自己給一條回去的路。 */
    H.push('<div class="row"><button class="btn ghost" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tq:rev' })) + '\'>回審核</button></div>');
    if (!asks.length) {
      H.push('<div class="card"><p class="dim">' +
        '他們一說要花幾天，這裡就會出現。你可以回一句，也可以不回。' +
        '</p></div>');
    }
    asks.forEach(function (x) {
      H.push('<button class="rq" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'go:askest:' + x.run.runId })) + '\'>');
      H.push('<span class="rq-t"><b>' + esc(x.ms.title) + '</b>');
      H.push('<em>' + esc(x.team.name) + '　·　他們說 ' + esc(estSay(x.run)) + '</em></span>');
      H.push('<span class="rq-d">' + (x.days ? '第 ' + (x.days + 1) + ' 天' : '今天') +
        '</span>');
      H.push('</button>');
    });
    return H.join('');
  }


  /* 說明句拿掉：清單本來就照等最久排。 */
  H.push(head('審核', rows.length ? rows.length + ' 件等你看' : '沒有等你的', ''));

  /* ── 有人剛說了天數 ──

     只在真的有的時候出現，沒有就完全不存在。所以它不佔常態的複雜度
     ——老師平常打開這一頁看到的還是只有一件事。

     語氣是邀請不是待辦：回一句是選項，沒有話要說就不用進去
     （見 40-db.js 的 actAskSkip：「我看過但沒意見」對學生沒有資訊）。
     所以這裡不寫成「N 件待處理」，也不放在清單裡佔一列——放在清單裡
     它就變成一件擋在真正工作前面的事。 */
  if (RULES.NEGOTIATE && asks.length) {
    H.push('<button class="asknote pressable" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tq:ask' })) + '\'>' +
      '<b>' + asks.length + ' 組剛說了要花幾天</b>' +
      '<i>你可以回一句，也可以不回</i></button>');
  }

  if (!rows.length) {
    H.push('<div class="card">');
    /* 「沒有人在等你」講的是審核這一格，可是它印出來的時候旁邊那一格
       可能正掛著號碼——結案那一格裡的每一組都按過「我們做完了」，
       那就是有人在等（exitQueue 只收 exitAsk 的，見 40-db.js）。

       實際看到的畫面：分頁寫著「結案（1）」，底下同一張卡寫
       「沒有人在等你」。兩句話在同一個畫面上互相打臉。

       協商那一排不算——那一格寫著「你可以回一句，也可以不回」，
       沒有人在那裡等他。 */
    H.push(out.length
      ? '<p class="dim">這裡沒有要看的。有 ' + out.length +
        ' 組說他們做完了，在左邊最下面的「結案」。</p>'
      : '<p class="dim">沒有人在等你。去發一個任務——寫要交什麼就好。</p>');
    H.push('<div class="row">');
    H.push(btn('去發一個任務', 'go:ms', 'big'));
    H.push(btn(RULES.SOLO ? '看每一位的進度' : '看各組進度', 'go:classeco', 'ghost'));
    H.push('</div></div>');
  }

  /* 一列只回答一個問題：先看哪一件。

     那個問題只需要三件事——哪一組、哪一件、等了幾天。
     整列是一顆鈕，點進去才是他真的在讀成果的地方。

     這裡本來還有五樣：判定、說幾天實際幾天、他們承諾時標的、
     老師自己分的段、一顆另外的鍵。全部搬到審核那一頁。

     判定尤其不留：「跟承諾的一樣」是系統對他們預估的判定，
     擺在他打開成果之前，等於先給他一個印象。
     系統判預估、老師判成果，兩個判斷要分開。 */
  rows.forEach(function (x) {
    H.push('<button class="rq" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'go:review:' + x.run.runId })) + '\'>');
    H.push('<span class="rq-t"><b>' + esc(x.ms.title) + '</b>');
    /* 這一件是誰派的，接在組名後面——不另外開一格，那一列要回答的
       還是同一個問題（先看哪一件）。自己派的不寫。

       三位老師共用一個佇列，所以「這一件本來是誰的事」要看得到：
       看得到才有得商量，看不到就會兩個人都以為對方會看。 */
    var rby = x.ms.mentorId && x.ms.mentorId !== u.userId ? userOf(x.ms.mentorId) : null;
    H.push('<em>' + esc(x.team.name) +
      (rby ? '　·　' + esc(rby.name) + ' 派的' : '') + '</em></span>');
    H.push('<span class="rq-d">等 ' + x.waited + ' 天</span>');
    H.push('</button>');
  });

  /* 底下本來還有一塊「全班現在」，是各組進度的縮小版——
     而各組進度就在側欄第三格。同一件事說兩遍，先出現的是雜訊。 */
  return H.join('');
};

/* ---------- 結案 ----------

   2026-09-30：本來這一格是審核頁最上面的分頁（審核｜結案），兩顆並排在
   老師每次進來第一眼看到的位置，老師們也會按錯。搬到左邊側欄最下面，
   跟上面三格（等你的、發派任務、各組進度）隔開——結案是一學期一次的事，
   不該跟一週好幾次的審核擺在同一排。 */
PAGES.tclose = function () {
  var u = me();
  var H = [];
    /* 全班每一組都在，不是只有「說了做完了」的那幾組——門是他開的，
       所以他要能主動開，不是只能回應。

       有說的排在前面：那是一個訊號，不是一道關卡。 */
    var mine = teamsUnder(u.classId, u.userId).slice().sort(function (a, b) {
      return (b.exitAsk || 0) - (a.exitAsk || 0);
    });
    H.push(head('結案', '整個專案完成了，才在這裡確認', ''));
    /* 2026-09-30：老師們會按錯，因為這一頁沒有講清楚它確認的是什麼。
       它確認的是「這一組整個專案結束了」，不是「收下一件作業」——
       收作業在左邊「等你的」。這一張卡放在最上面，先講這一件事。 */
    H.push('<div class="card">');
    H.push('<div class="eyebrow">先看這個</div>');
    H.push('<p>這裡確認的是「整個專案已經完成」，不是收下一件作業。</p>');
    H.push('<p class="dim">要收作業，請到左邊「等你的」。只有這一組的整個專案真的做完了，才按下面的「確認整個專案已完成」。按了之後，他們那邊廊道盡頭的出口就會打開，他們就可以結束專案。</p>');
    H.push('</div>');

    /* 開放／關掉學生那邊「我們做完了」的入口。
       2026-09-23：不少學生把那顆鍵當成一般的「交作業」按下去——
       它整學期都在，可是一學期裡大半時間根本還沒到結案的時候。
       開學就先關著，真的要進入結案階段再開，學生那邊那張卡才會
       出現（見 63-pack.js）。已經說過、或已經回過「現在還不是時候」
       的不受這個開關影響，那是已經在走的流程。 */
    var kl0 = classOf(u);
    H.push('<div class="card">');
    H.push('<div class="eyebrow">學生那邊看不看得到「我們做完了」</div>');
    H.push('<p class="dim">' + (kl0.exitOpen
      ? '開著。學生任務清單最下面看得到那顆鍵。'
      : '關著。學生那邊還沒有這個選項，不會誤按到。') + '</p>');
    H.push(btn(kl0.exitOpen ? '關掉' : '開放結案', 'exitopenset:' + (kl0.exitOpen ? 0 : 1),
      kl0.exitOpen ? 'ghost' : ''));
    H.push('</div>');

    mine.forEach(function (t) {
      var acc = accuracyOf(t.teamId);
      H.push('<div class="card exitq' + (t.exitAsk ? ' said' : '') + '">');
      if (t.exitAsk) H.push('<div class="eyebrow lit">他們說整個專案做完了</div>');
      H.push('<h2>' + esc(t.project || '（還沒定）') + '</h2>');
      H.push('<p class="dim">' + esc(t.name) + '　·　走完 ' +
        depthOf(t.teamId) + ' 個任務</p>');
      if (acc.total) H.push(accBar(acc));

      if (t.leftAt) {
        H.push('<p class="dim">他們走出去了。</p>');
      } else if (t.exitOk) {
        /* 確認了但還沒走。走出去那一下是他們自己按的——
           走出去該是他們的動作，不是老師代勞的。 */
        H.push('<p class="dim">確認過了。門開著，等他們自己走上去。</p>');
        H.push(btn('取消確認', 'openexit:' + t.teamId + ',0', 'ghost'));
      } else {
        H.push('<div class="row">');
        /* 鍵上寫的是這個決定叫什麼，說明那一行才講它在學生那邊長什麼樣
           ——鍵要短到一眼讀完，而「門」不是老師要做的事。 */
        /* 確認要問一次：這一顆按下去，學生那邊廊道盡頭的門就開了。 */
        if (DRAFT.closeConf === t.teamId) {
          H.push('<p class="dim">確定「' + esc(t.name) + '」的整個專案已經完成了嗎？按下去，他們那邊的出口就會打開。</p>');
          H.push(btn('對，整個專案完成了', 'openexit:' + t.teamId + ',1', 'big'));
          H.push(btn('先不要', 'closeno', 'ghost'));
        } else {
          H.push(btn('確認整個專案已完成', 'closeconf:' + t.teamId, 'big'));
        }
        /* 「現在還不是時候」只對有說過的那幾組出現——沒說過的組
           沒有東西要回。 */
        if (t.exitAsk) H.push(btn('現在還不是時候', 'denyexit:' + t.teamId, 'ghost'));
        H.push('</div>');
      }
      H.push('</div>');
    });
  return H.join('');
};

/* ---------- 勾一個可以 ---------- */
PAGES.review = function () {
  var u = me();
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var m = msOf(r.msId), t = teamOf(r.teamId);
  var s = RULES.STAMPS[r.stamp];
  /* 還沒交出來的那一趟沒有判定，而底下整頁都在讀 s。

     正常的路走不到（清單只收交出來的），但兩位老師同時開著同一件、
     或是分頁放了很久再回來，就會落在這裡。炸掉的頁對老師更糟：
     他會以為是學生那一邊出事了。 */
  if (!s) {
    return '<div class="card"><div class="eyebrow">還沒交出來</div>' +
      '<p class="dim">' + esc(t ? t.name : '這一組') +
      ' 還在走這一趟。他們交出來之後才會出現在你的清單上。</p></div>' +
      '<div class="row">' + btn('回審核清單', 'go:radar', 'big') + '</div>';
  }
  if (r.state === 'done') {
    return '<div class="card"><div class="eyebrow">已經處理過了</div>' +
      '<p class="dim">這一趟' + (r.wordBy ? '由另一位老師' : '') +
      '已經收下了。</p></div>' +
      '<div class="row">' + btn('回審核清單', 'go:radar', 'big') + '</div>';
  }

  /* 只留一句，而且是他猜不到的那一句：成果不在系統裡。 */
  var H = [head('審核', t.name + '　·　' + m.title, '')];

  /* ── 要這件事的那一位 ──

     學生從頭到尾在跟一個人打交道：他來委託、他在路的另一端等、
     他收下東西。而老師這一頁上他完全不在——老師看到的是一份表單，
     學生看到的是一場戲。同一件事的兩端，長得像兩個不同的系統。

     放他一張臉跟一個名字。這一頁不加登場動畫——老師打開它是要做事，
     一段演出會擋在他跟他要判斷的東西中間。學生那一邊要動機，
     老師這一邊要看得清楚。 */
  var pat = mobOfRun(r);
  if (pat) {
    var pz = mobZone(pat);
    H.push('<div class="card rvw-pat ' + pz.key + '">');
    H.push(patTag(pat, pz.pal, 'rvw-px'));
    H.push('<div class="rvw-t"><b>' + esc(pat.n) + '</b>');
    H.push('<em>' + esc(pat.t) + '</em></div>');
    H.push('</div>');
  }

  /* ── 當初要的 ──

     這一段本來不在。老師在派的時候寫下「什麼算做完」，然後在**判斷
     做完了沒有的那一刻**，那句話不在畫面上——他要嘛憑記憶，要嘛切回
     發派任務那一頁去翻。

     三位老師共同帶一個班的時候更明顯：甲寫下的標準，乙在審的時候
     根本沒看過。而這個作品的主旨那一句就是「老師寫的合格考量就是
     教材」——那句話要成立，它至少得出現在他判斷的那一頁上。

     排在「東西在這裡」上面，因為讀的順序是：我當初要什麼 →
     去看他們交了什麼 → 回來判斷。標準要在他點出去之前就讀到。

     兩樣都沒寫就整段不畫。大部分的委託只有一句標題，這一段
     不該讓那些委託多出一塊空的東西。 */
  var note = (m.note || '').trim();
  var mst = m.steps || [];
  if (note || mst.length) {
    H.push('<div class="card"><div class="eyebrow">當初要的</div>');
    if (note) H.push('<p class="quote">' + nl(note) + '</p>');
    /* 分段排成一行一行的小塊，不是一項一列——它是「我要的形狀」，
       一眼掃過去就好。他們自己拆成什麼樣子在底下那一段，
       兩個並排才看得出有沒有走鐘。 */
    if (mst.length) {
      H.push('<div class="msspec">');
      mst.forEach(function (x, i) {
        H.push('<span class="mss"><i>' + (i + 1) + '</i>' + esc(x) + '</span>');
      });
      H.push('</div>');
    }
    H.push('</div>');
  }

  /* 他們說東西在哪。他打開這一頁、讀完當初要的，下一件事就是去看東西。

     本來這裡只有一句「成果交在你原本收的地方」，然後叫他自己去找。
     那三步（離開系統、翻、回來）會殺掉審核這件事，而審核不發生的話，
     後面每一個設計都沒有觸發點。 */
  if (r.link) {
    H.push('<div class="card"><div class="eyebrow">他們說東西在這裡</div>');
    H.push(whereLine(r.link, 1));
    H.push('</div>');
  }

  H.push('<div class="card">');
  H.push('<div class="radar-head"><span class="st ' + r.stamp + '">' + 
         esc(s.name) + '</span>');
  /* 排到哪一天。判定跟它無關（判定只看他說幾天、實際幾天），
     但他有沒有走進那一段，是要寫那一句話時真的需要知道的。

     三位老師共同帶一個班，這一件很可能不是我派的——那時候「我排到」
     是錯的，而且我會拿別人的排程去讀這一份成果卻不知道那是別人排的。
     不是我派的就寫出是誰。 */
  var rvBy = m.mentorId && m.mentorId !== u.userId ? userOf(m.mentorId) : null;
  if (m.due) {
    H.push('<span class="sp"></span><span class="dim">' +
      (rvBy ? esc(rvBy.name) + ' 派的，排到 ' : '我排到 ') +
      esc(dueSay(m)) + '</span>');
  } else if (rvBy) {
    H.push('<span class="sp"></span><span class="dim">' +
      esc(rvBy.name) + ' 派的</span>');
  }
  H.push('</div>');
  /* 這一趟談過的話。判定的那兩個數字有來歷，而來歷就在這裡。 */
  H.push(negoLine(r, false));
  /* ── 上一趟 ──

     沒有這一行，每一次審核都是沒有前情的。三位老師共同帶一個班的
     時候尤其：甲上次跟他們說了什麼，乙這一次完全不知道，於是同一件
     事會被講兩次，或者根本沒有人接續。

     不用任何人多做事——那一句話本來就在資料裡。 */
  var prev = runsFor(r.teamId).filter(function (x) {
    return x.run.runId !== r.runId && x.run.doneAt;
  }).sort(function (a, b) { return b.run.doneAt - a.run.doneAt; })[0];
  if (prev) {
    var pw = prev.run.wordBy ? userOf(prev.run.wordBy) : null;
    H.push('<p class="dim prev">上一趟「' + esc(prev.ms ? prev.ms.title : '') + '」　·　' +
      (pw ? esc(pw.name) + ' 收下了' : '收下了') +
      (prev.run.backs ? '（退回過 ' + prev.run.backs + ' 次）' : '') +
      (prev.run.word ? '　·　「' + esc(prev.run.word) + '」' : '') + '</p>');
  }
  /* 他們自己寫的兩段放最上面。他在這一頁要做的事是寫一句話，
     而最有用的輸入就是這兩段——本來排在整張卡的最後面。
     系統不解讀、不歸類，原話放上去就好。 */
  /* ── 他們回報了什麼 ──

     這一頁是「在系統確認學生時間與回報狀況」的地方，所以那三樣要
     擺在最上面：每一件說幾天／實際幾天、順不順、為什麼。

     兩欄並排是重點——這個作品在練的就是那兩個數字之間的距離，
     而老師要寫那一句話的時候，看的就是這張表。 */
  /* 誰做了什麼。沒寫的顯示「還沒說」——那是一個事實，不是一個指控，
     而且它是這一頁上唯一看得出「這一組是不是一起做的」的地方。 */
  var mem = where('Users', function (u) { return inTeam(u, r.teamId); });
  if (mem.length) {
    var sd = r.said || {};
    H.push('<div class="eyebrow">誰做了什麼</div>');
    H.push('<div class="saidlist">');
    mem.forEach(function (u) {
      H.push('<div class="sd">');
      H.push(pxTag(heroOf(u).idleA, heroOf(u).pal, 'sd-px'));
      H.push('<b>' + esc(u.name || '') + '</b>');
      H.push('<span' + (sd[u.userId] ? '' : ' class="dim"') + '>' +
        (sd[u.userId] ? esc(sd[u.userId]) : '還沒說') + '</span>');
      H.push('</div>');
    });
    H.push('</div>');
  }

  var pl = r.plan || [], sp = r.spent || [];
  if (pl.length) {
    H.push('<div class="eyebrow">他們拆的那幾件　說／實際</div>');
    H.push('<div class="splist">');
    pl.forEach(function (x, i) {
      var got = sp[i] == null ? null : sp[i];
      H.push('<div class="sp2">');
      H.push('<b style="background:' + stepHue(i) + '"></b>');
      H.push('<i>' + esc(x.n) + '</i>');
      H.push('<u class="who">' + esc(shortWho(x.who)) + '</u>');
      H.push('<u class="said">說 ' +
        ((x.dU && x.dU !== 'd' && x.dN != null) ? esc(x.dN + estUnit(x.dU).name) : x.d + ' 天') +
        '</u>');
      H.push('<u class="got' + (got != null && got > x.d ? ' over' : '') + '">' +
        (got == null ? '—' : got) + '</u>');
      H.push('</div>');
    });
    H.push('</div>');
  }
  if (r.feel) {
    var fn = ({ good: '順', ok: '普通', bad: '不順' })[r.feel] || '';
    H.push('<div class="eyebrow">他們覺得進展</div>');
    H.push('<div class="feels one"><span class="fl on">' + esc(fn) + '</span></div>');
  }
  /* 範圍有沒有變。跟順不順擺在一起——「順」但範圍砍了一半，
     跟「不順」但範圍沒動，是兩件很不一樣的事。 */
  if (r.scope) {
    var sn = ({ more: '比說的多', same: '差不多', less: '比說的少' })[r.scope] || '';
    H.push('<div class="eyebrow">做出來的跟當初說的</div>');
    H.push('<div class="feels one"><span class="fl on">' + esc(sn) + '</span></div>');
  }
  if (r.why) H.push('<p class="quote"><b>為什麼</b>' + nl(r.why) + '</p>');
  if (r.hard) H.push('<p class="quote"><b>他們說卡在哪裡</b>' + nl(r.hard) + '</p>');
  if (r.pace) H.push('<p class="quote"><b>他們覺得的進度</b>' + nl(r.pace) + '</p>');
  H.push(estBar(r.est, r.actual, false, estSay(r)));
  H.push(dayStrip(r.teamId, r.runId));
  H.push(overTags(r.teamId, r));
  /* 歷史準度分布拿掉了：那是「他們這學期怎麼樣」，屬於各組進度，
     不屬於這一筆審核。這一頁只看眼前這一趟。 */
  H.push('</div>');

  H.push('<div class="card">');
  /* 這裡一度有一塊「他們請你看這裡」——學生交出去的時候指的那一處，
     而他的評語接在那一處底下。學生那一題拿掉了（每一趟都要再想一次，
     太消耗），所以這一塊跟著回去。他的那一句話又是他自己起頭的。 */
  H.push('<div class="eyebrow">你的想法　選填</div>');
  H.push('<p class="dim">退回去改一定要寫。收下也值得說一句——他們會看到。</p>');
  H.push('<textarea id="gr-word" rows="3" oninput="DRAFT[\'gr-word\']=this.value" placeholder="' +
    esc('例：第二件比你們說的久兩天，那一段的範圍好像變大了。') +
    '">' + esc(draft('gr-word')) + '</textarea>');
  H.push('</div>');


  /* 「完成到什麼程度」。這是他比「可以／退回」更有層次的那一個回應。

     ── 2026-09-09：老師這一頭不再講水晶 ──

     本來這一格寫的是「收下的時候多給幾顆」，底下還解釋「這一件本來
     就有 100 顆」。那是把遊戲化那一層攤在老師面前——他要一邊想這一件
     做到哪裡，一邊換算成一個他不在乎的計數單位。

     現在他問的是「完成到什麼程度」。東西沒有換——它一樣是老師多給的
     那幾顆水晶，數字原封不動存進 r.bonus，換算成水晶是
     學生那一頭的事（見 60-student.js 的 crygot）。同一個數字兩種讀法：
     老師讀的是「做到哪裡」，學生讀的是「多拿到幾顆」。


     ── 下限是 0 ──

     舊註解寫著「最少 1，不是 0：0 會被讀成負評」。那個顧慮是對的，
     可是解法搬到學生那一頭了：0 的時候不印「0 是他多給的」那一行
     分解（見 60-student.js），所以畫面上不會出現一個被講成負評的
     正常答案。 */
  var bn = DRAFT.bonus || RULES.CRYSTAL.bonusMin;
  H.push('<div class="card">');
  H.push('<div class="eyebrow">完成到什麼程度　選填</div>');
  H.push('<div class="row sure-row">');
  /* 這一排是 0 1 2 3 4 5（值在 20-rules.js 的 bonusMin／Max／Step）。

     一格 10、排成 10…50 的那一版拿掉了：那個量級讓這幾顆變成一個
     值得追的數字，而這個機制要留在「老師的一句話」那一側。 */
  for (var bi = RULES.CRYSTAL.bonusMin; bi <= RULES.CRYSTAL.bonusMax;
       bi += (RULES.CRYSTAL.bonusStep || 1)) {
    H.push(btn(String(bi), 'bonus:' + bi, 'sure' + (bn === bi ? ' on' : '')));
  }
  H.push('</div>');
  H.push('<p class="dim">0 就是收下，沒有要多說的。</p>');
  H.push('</div>');

  /* 他按下去那一刻有多重。

     老師在這一套裡讓掉了不少：他排的日期不進判定、他不能無理由退回、
     他改不動學生承諾的天數。那幾件在畫面上一句話都沒說，所以他只
     感覺到自己被拿走了東西。

     這一句講的是反過來那一半——沒有他點頭，學生什麼都拿不到。
     一句，而且是事實，不是打氣。 */
  H.push('<p class="dim">你收下的那一刻，他們才拿得到水晶、圖鑑那一格，' +
    '跟疊上去的那一塊。</p>');
  /* 回審核清單留在正文裡——它不是決定，是離開。 */
  H.push('<div class="row">');
  H.push(btn('回審核清單', 'go:radar', 'ghost'));
  H.push('</div>');

  /* ── 決定那兩顆釘在底部 ──

     量出來的：這一頁在手機上 4.7 屏（3846px），而「收下」在 y=3583。
     老師要滑四屏才按得到，而這是全系統他最常打開的一頁，
     星期三三位老師會一直用它。

     不是砍內容——上面那 1592px 是十五小塊（上一趟、誰做了什麼、
     拆件說／實際、順不順、範圍、為什麼、再兩天、承諾時標的），
     每一塊都是「老師資訊夠不夠」那一輪加進去的，沒有一塊該砍。
     問題是決定被埋在最底下。

     首頁那個 sticky 當初拿掉是對的：那一頁兩屏，釘在底部只會蓋住
     東西。這一頁四點七屏、而且唯一的出口在最底下——同一個做法在
     這裡剛好是解法。

     底下留一塊等高的空白，所以它不會蓋住最後一行。 */
  H.push('<div class="rvw-pin"><div class="rvw-pin-in">');
  H.push(btn('收下', 'approve:' + r.runId, 'big'));
  /* 退回。它不動判定也不動深度——那一趟的兩個數字在他交出去的
     當下就定了，重做不會讓他當初說的話變成別的話。
     退回講的只有一件事：那份成果還沒被收下。 */
  H.push(btn('退回去改', 'reject:' + r.runId, 'ghost'));
  H.push('</div></div>');
  return H.join('');
};

/* ---------- 回一句：我覺得會是幾天 ----------

   一句話是必填的（actAskEst 擋在資料層）。理由跟退回一樣：一個沒有
   說法的數字就是一道命令，而命令不會被內化成他自己的判斷。

   這一頁上寫著「最後幾天，他說了算」——那不是客套，那是事實：

  H.push('<div class="eyebrow">他們說</div>');
  H.push('<p class="quote big">' + esc(estSay(r)) + '</p>');
  /* 我自己排到哪一天。它不進判定，但它是我會有意見的原因。 */
  if (m.due) H.push('<p class="dim">排到 ' + esc(dueSay(m)) + '。</p>');
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">你覺得會是幾天</div>');
  H.push(estStep(n));
  H.push('<div class="eyebrow" style="margin-top:14px">為什麼</div>');
  H.push('<textarea id="ask-w" rows="2" oninput="DRAFT[\'askw\']=this.value" placeholder="' +
    esc('例：同樣的東西我看過，通常卡在找人。') + '">' + esc(draft('askw', '')) + '</textarea>');
  H.push('<p class="dim">最後幾天他說了算。你給的是理由，不是期限。</p>');
  H.push('</div>');

  H.push('<div class="row">');
  H.push(btn('送出去', 'asksend:' + r.runId, 'big'));
  H.push(btn('沒有話要說', 'askskip:' + r.runId, 'ghost'));
  H.push(btn('回清單', 'go:radar', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 發派任務 ---------- */
PAGES.ms = function () {
  var u = me();
  /* 這個班派出去的每一件，不只我派的。

     三位老師共同帶一個班，一定會出現「這一週我發給甲乙，你發給丙丁」。
     本來這裡只印自己派的——於是我完全不知道甲組這一週已經被派了兩件，
     照著看起來很空的清單再加一件，學生那邊就疊了三件。那不是他們
     估不準，是我們三個沒對過。

     誰派的印在那一列上。要不要跟人家的錯開，是他看得到之後
     自己會做的判斷——這一頁的工作是讓他做得成那個判斷。 */
  var all = where('Milestones', function (m) {
    return m.classId === u.classId && !m.notice;
  })
    .sort(function (a, b) { return b.at - a.at; });
  var list = all.filter(function (m) { return !m.withdrawnAt; });
  var gone = all.filter(function (m) { return !!m.withdrawnAt; });
  var teams = teamsUnder(u.classId, u.userId);
  var to = DRAFT.to || [];

  var H = [];
  H.push(head('發派任務', '你要他們交什麼', ''));

  /* 「派一個新的」拿掉了：這一頁的標題就是「發派任務／你要他們交什麼」，
     而底下第一個框就是題目——同一件事說三次。 */
  H.push('<div class="card">');
  H.push('<input id="ms-title" value="' + esc(draft('msTitle', '')) + '" oninput="DRAFT[\'msTitle\']=this.value" placeholder="' + esc('一句話說清楚要做完什麼') + '">');
  H.push('<textarea id="ms-note" oninput="DRAFT[\'msNote\']=this.value" rows="2" placeholder="' +
    esc('要注意的地方。選填。') + '">' + esc(draft('msNote', '')) + '</textarea>');
  /* ── 分段 ──

     本來是一個空白的多行框，標籤寫「一行一段」。那是資料格式，
     不是介面：老師看到的是一個空框，按 Enter 只是換行，
     要到學生那邊才知道自己切對了沒有。

     現在打一句按 Enter 就變成底下的一項，有編號、有叉。
     切的那一下就看得到結果。 */
  H.push('<div class="eyebrow" style="margin-top:14px">分段　選填</div>');
  var sp = DRAFT.steps || [];
  if (sp.length) {
    H.push('<div class="sped">');
    sp.forEach(function (x, i) {
      H.push('<div class="spr"><i>' + (i + 1) + '</i><b>' + esc(x) + '</b>' +
        '<button class="spx" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'stepdel:' + i })) + '\' title="' +
        esc('拿掉這一段') + '">×</button></div>');
    });
    H.push('</div>');
  }
  H.push('<input id="ms-step" placeholder="' +
    esc(sp.length ? '再切一段，按 Enter' : '切一段，按 Enter') +
    '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();ACTS.stepadd(this.value);}">');
  H.push('<p class="dim">' + (sp.length ? '共 ' + sp.length + ' 段' :
    '不寫的話他們自己拆。') + '</p>');
  /* ── 排到哪一天 ──

     老師對專案制定要有自主權，而排程是那個自主權最具體的一半。
     它不進判定：判定只讀學生說幾天與實際幾天。學生那邊會看到
     這一天換算成的天數，畫在他按承諾的那條走廊上。 */
  H.push('<div class="eyebrow" style="margin-top:14px">排到什麼時候　選填</div>');
  /* 選了單位才等於「有排」，所以不用另外做一個開關。 */
  var du = DRAFT.dueU, dn = Number(DRAFT.dueN) || 0;
  H.push('<div class="tags">');
  DUE_UNITS.forEach(function (x) {
    H.push('<button class="tag' + (du === x.k ? ' on' : '') +
      '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'dueu:' + x.k })) +
      '\'>' + esc(x.name) + '後</button>');
  });
  if (du) {
    H.push('<button class="tag" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'dueu:' })) + '\'>不排</button>');
  }
  H.push('</div>');
  if (du) {
    var uu = dueUnit(du);
    /* 相對的輸入，絕對的顯示。「兩週後」是哪一天永遠看得到，
       兩邊都不用在腦袋裡換算。 */
    H.push('<div class="estep duestep">');
    H.push('<button class="es-b es-m' + (dn <= 1 ? ' off' : '') +
      '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'duen:-1' })) + '\'>−</button>');
    H.push('<div class="es-n"><b>' + dn + '</b><span>' + esc(uu.name) + '後</span></div>');
    H.push('<button class="es-b es-p' + (dn >= uu.max ? ' off' : '') +
      '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'duen:1' })) + '\'>＋</button>');
    H.push('</div>');
    H.push('<p class="duewhen">' + esc(dueSay({ due: dueFrom(dn, du), dueU: du })) + '</p>');
    /* 六個字。他要知道的只有「這不是系統會拿去罰他們的東西」。 */
    H.push('<p class="dim">排程，不是期限。</p>');
  }

  H.push('<div class="eyebrow" style="margin-top:14px">發給誰</div>');
  H.push('<div class="tags">');
  H.push('<span class="tag static' + (to.length ? '' : ' hit') + '">' +
         (to.length ? '只發給 ' + to.length + ' 組'
           : '全班 ' + teams.length + ' 組') + '</span>');
  teams.forEach(function (t) {
    var on = to.indexOf(t.teamId) >= 0;
    var mem = where('Users', function (u) { return inTeam(u, t.teamId); });
    var names = mem.map(function (u) { return u.name; }).join('、');
    H.push('<button class="tag' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'to:' + t.teamId })) + '\'>' + esc(t.name) +
      (names ? '<small style="display:block;opacity:.6;font-size:22px">' + esc(names) + '</small>' : '') +
      '</button>');
  });
  H.push('</div>');
  H.push(btn('派出去', 'publish', 'big'));
  H.push('</div>');

  if (!list.length) {
    H.push('<div class="card dim">還沒派過。</div>');
  }

  /* 派過的每一個壓成一行：標題、幾組承諾了、幾組走完了。
     本來一個一張卡，還帶著注意事項與每一組承諾幾天的標籤——
     派了十個就是十張卡，而老師在這一頁要做的只有「再派一個」。 */
  H.push('<div class="card"><div class="rec-list">');
  list.forEach(function (m) {
    var got = where('Runs', function (r) { return r.msId === m.msId; });
    var done = got.filter(function (r) { return r.state === 'done'; }).length;
    H.push('<div class="msr">');
    H.push('<b>' + esc(m.title) + '</b>');
    /* 發給誰是老師派的時候自己點的：不點就是全班。 */
    H.push('<span class="msr-w">' + (m.teams.length ? m.teams.length + ' 組'
      : '全班') + '</span>');
    /* 我排到哪一天。過了就寫過了——不是警告，是事實。 */
    var di = dueIn(m);
    if (di) {
      H.push('<span class="msr-d' + (di.past ? ' past' : '') + '">' +
        esc(dueSay(m)) + (di.past ? '　過了' : '') + '</span>');
    }
    H.push('<span class="msr-n">' + got.length + ' 承諾　' + done + ' 走完</span>');
    /* 刪掉：兩步。按一下先問，因為學生那邊會馬上少一件。 */
    if (DRAFT.msDel === m.msId) {
      H.push('<p class="dim msr-ask">學生那邊會不見，他們已經承諾、交出去的紀錄還在，隨時可以放回來。確定嗎？</p>');
      H.push(btn('對，刪掉', 'msdelyes:' + m.msId, ''));
      H.push(btn('先不要', 'msdelno', 'ghost'));
    } else {
      H.push(btn('刪掉這一件', 'msdel:' + m.msId, 'ghost'));
    }
    /* 這裡本來還有一行「甲 6→6　乙 3→9　丙 7→7　丁 5→5」——每一組
       承諾幾天、實際幾天。拿掉了，兩個理由：

       一 · 這一頁在做的事是「寫下一個任務」。把每一組的預估攤在
            那個動作旁邊，等於邀請他照著他們的數字去訂下一件事的大小，
            而任務該有多大是題目本身的事，不是他們上一次估得準不準。

       二 · 它印的是全班每一組，而這一頁現在也印別人派的那幾件。
            兩件事疊起來就是一整片跟他要寫的這一個任務無關的數字。

       那幾個數字沒有消失：審核那一頁上每一趟都有，各組進度上一整排。 */
    /* 誰派的。

       2026-09-23：本來自己派的不寫（理由是「不然每一列都掛著一個
       「我」」）。可是這一頁列的是全班派出去的每一件，自己剛派的
       那一件跟別人派的、跟舊的混在一起，全靠這一行的「有沒有寫」
       分——一個很容易漏看的隱性訊號。真的在用的時候量到：老師發完
       作業，回到這一頁找不到自己剛剛派了什麼。

       改成兩種都寫：自己的寫「你派的」，跟別人那句同一個位置、
       同一個份量，掃過去看得到，不用靠「沒寫」去猜。 */
    if (m.mentorId) {
      var isMine = m.mentorId === u.userId;
      var mby = isMine ? u : userOf(m.mentorId);
      if (mby) {
        H.push('<span class="msr-by' + (isMine ? ' mine' : '') + '">' +
          (isMine ? '你派的' : esc(mby.name) + ' 派的') + '</span>');
      }
    }
    H.push('</div>');
  });
  H.push('</div></div>');

  /* 刪掉的：還在這裡，放得回去。學生那邊看不到它們。 */
  if (gone.length) {
    H.push('<div class="card"><div class="eyebrow">刪掉的（學生看不到）</div><div class="rec-list">');
    gone.forEach(function (m) {
      var got2 = where('Runs', function (r) { return r.msId === m.msId; }).length;
      H.push('<div class="msr">');
      H.push('<b>' + esc(m.title) + '</b>');
      H.push('<span class="msr-n">' + got2 + ' 筆紀錄還留著</span>');
      H.push(btn('放回去', 'msrestore:' + m.msId, 'ghost'));
      H.push('</div>');
    });
    H.push('</div></div>');
  }
  return H.join('');
};

/* ===== 75-research.js ===== */
/* 研究者端。

   這一端不是給老師用的，也不進地下城。它做的事：

     名單   誰在這個系統裡。看得到，改不動
     紀錄   每一個動作的流水帳，可以匯出
     密碼   2026-09-23 起，研究者可以直接幫學生／老師換一組新密碼

   ── 為什麼原本一顆會改東西的鍵都沒有 ──

   本來這一頁可以建班、開老師的帳號、重設密碼、刪帳號。全部拿掉了。

   研究者是這個研究的觀察者。一個觀察者如果同時改得動被觀察對象的
   帳號與狀態，那份資料就沒辦法說「這些是他們自己做的」——而那正是
   這個研究唯一在主張的事。

   拿掉之後沒有人少掉能力：老師自己註冊、自己開班或用同事給的碼加進
   同一個班（見 58-gate.js），學生自己註冊、自己建隊。整條路上不需要
   一個管理員。

   ── 密碼是唯一的例外，不是解禁 ──

   使用者本人明確要求開放：研究者可以直接改任何學生／老師的密碼
   （actResearcherSetPw，見 15-auth.js 與 CLAUDE.md 同一天那一段）。
   除了這一個名字，這一頁不准出現任何其他 act 開頭的動作——
   check.js 只放行 actResearcherSetPw 這一個，其餘照樣擋著。

   紀錄那一頁是這個研究真正的資料。它記的是行為的形狀——承諾幾天、
   哪一天推進、判定結果、卡在哪——不記作業內容，因為系統本來就不收作業。
   看得到誰做了什麼，看不到他做得好不好。 */

/* ---------- 研究者這一邊只看真的 ----------

   這一台機器上同時有兩份資料：示範那一份（帶 _d，seed 打的）跟這個班
   真的跑出來的。同步早就分得開（見 41-sync.js 的 onDemoSide），匯出
   那三份也是照班分的，所以都乾淨。

   可是研究者這一邊本來直接數 DB.Classes 與 DB.Users——它把示範那一班
   跟十七個示範帳號一起算進去。使用者：「我研究者端他會記錄模擬紀錄」。

   實際看到的是「班級 2 個、帳號 19 個」，而真的只有 1 個班、2 個人。
   那一頁存在的理由是「匯出的資料裡是一堆代號，要有一個地方查那是誰」
   ——混進十七個不存在的人，那個理由就不成立了。

   這三支是這一頁所有列舉的入口，收在這裡一次擋掉。 */
function rsClasses() { return where('Classes', function (c) { return !c._d && !c._removed; }); }
function rsUsers() { return where('Users', function (u) { return !u._d && !u._removed; }); }
function rsTeams(cid) {
  return where('Teams', function (t) { return !t._d && !t._removed && t.classId === cid; });
}

function rsClassId() {
  var c = DRAFT.rsClass ? find('Classes', function (x) { return x.classId === DRAFT.rsClass; }) : null;
  if (c && !c._d) return c.classId;
  var a = rsClasses();
  return a.length ? a[0].classId : '';
}

/* 換班的那一排。只有一個班就不畫——一個選項的選單是雜訊。 */
function classPicker() {
  if (rsClasses().length < 2) return '';
  var cur = rsClassId();
  var H = ['<div class="tags">'];
  rsClasses().forEach(function (c) {
    H.push('<button class="tag' + (c.classId === cur ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'rscls:' + c.classId })) + '\'>' + esc(c.name) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

var ROLE_SAY = { student: '學生', teacher: '老師', researcher: '研究者' };

/* ---------- 名單（唯讀） ----------

   這一頁存在的理由只有一個：匯出的資料裡是一堆代號，要有一個地方
   對得回「這是誰、哪一班、哪一組」。所以它印得出來，但一顆改得動
   東西的鍵都沒有。 */
PAGES.rs = function () {
  var H = [head('名單', '誰在這個系統裡',
    '這一頁只能看。帳號由他們自己在門口開。')];

  H.push(classPicker());

  /* 班級 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">班級　' + rsClasses().length + ' 個</div>');
  if (!rsClasses().length) H.push('<p class="dim">還沒有人開班。</p>');
  rsClasses().forEach(function (c) {
    var tea = where('Users', function (u) {
      return u.role === 'teacher' && inClass(u, c.classId);
    });
    H.push('<div class="rn-row"><b>' + esc(c.name) + '</b>' +
      '<span class="dim">加入碼 ' + esc(c.joinCode) + '　·　' +
      rsTeams(c.classId).length + ' 組　·　' +
      /* 一個班三位老師共同帶，所以這裡數的是人數不是「那一位」。 */
      '老師 ' + (tea.length ? tea.map(function (u) { return esc(u.name); }).join('、')
        : '（還沒有人）') + '</span></div>');
  });
  H.push('</div>');

  /* 帳號清單 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">帳號　' + rsUsers().length + ' 個</div>');
  rsUsers().forEach(function (u) {
    var t = u.teamId ? teamOf(u.teamId) : null;
    var kl = u.classId ? find('Classes', function (c) { return c.classId === u.classId; }) : null;
    H.push('<div class="rn-row">');
    H.push('<b>' + esc(u.name) + '</b>');
    H.push('<span class="dim">' + esc(u.account) + '　·　' + esc(ROLE_SAY[u.role] || u.role) +
      (kl ? '　·　' + esc(kl.name) : '') +
      (t ? '　·　' + esc(t.name) : '') +
      (u.lastLogin ? '　·　上次登入 ' + daysBetween(u.lastLogin, now()) + ' 天前'
        : '　·　還沒登入過') +
      '</span>');
    H.push('</div>');
  });
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">幫學生／老師換密碼</div>');
  H.push('<p class="dim">2026-09-23 起開放的唯一例外——其餘資料這一頁一樣只能看。</p>');
  H.push(btn('換密碼', 'go:rspw', ''));
  H.push('</div>');
  return H.join('');
};

/* ---------- 研究者直接改密碼 ----------

   跟老師補發救援碼、接回帳號同一種選法：點名字，不打帳號——
   逼研究者看著名字選，不是憑印象點一個帳號字串。兩步驟確認，
   跟接回帳號同一個道理：這是研究者頁面唯一一個真的會動到別人
   帳號的動作，按錯的代價是別人的密碼被換掉，值得再看一次。 */
PAGES.rspw = function () {
  var u = me();
  if (!u || u.role !== 'researcher') return PAGES.gate();
  var H = [head('幫學生／老師換密碼', '點一個人', '')];

  if (DRAFT.rspwConfirm && DRAFT.rspwAcc) {
    var picked = find('Users', function (x) { return x.account === DRAFT.rspwAcc; });
    H.push('<div class="card">');
    H.push('<div class="eyebrow warnx">確定嗎</div>');
    H.push('<p class="dim">要把「' + esc(picked ? picked.name : DRAFT.rspwAcc) + '」（' +
      esc(DRAFT.rspwAcc) + '）的密碼換成你剛剛打的那一組。他現在用的密碼會立刻失效。</p>');
    H.push(btn('對，換掉', 'rspw', 'big'));
    H.push(btn('還沒，再檢查一次', 'rspwundo', 'ghost'));
    H.push('</div>');
  } else {
    var rows = where('Users', function (x) { return !x._d && !x._removed && x.role !== 'researcher'; })
      .sort(function (a, b) { return a.name === b.name ? 0 : (a.name < b.name ? -1 : 1); });
    H.push('<div class="card">');
    H.push('<div class="tags">');
    rows.forEach(function (x) {
      H.push('<button class="tag' + (DRAFT.rspwAcc === x.account ? ' on' : '') +
        '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'rspwpick:' + x.account })) +
        '\'>' + esc(x.name) + '（' + esc(ROLE_SAY[x.role] || x.role) + '）' +
        '<small style="display:block;opacity:.6;font-size:22px">' + esc(x.account) + '</small>' +
        '</button>');
    });
    H.push('</div>');
    if (DRAFT.rspwAcc) {
      H.push('<div class="eyebrow" style="margin-top:14px">新密碼</div>');
      H.push('<input id="rspw-new" type="password" placeholder="' + esc(RULES.pwRule()) + '">');
      H.push(btn('換密碼', 'rspwcheck', 'big'));
    }
    H.push('</div>');
  }
  H.push('<div class="row">');
  H.push(btn('回去', 'go:rs', 'ghost'));
  H.push('</div>');
  return H.join('');
};

ACTS.rspwpick = function (acc) { DRAFT.rspwAcc = acc; render(); };

ACTS.rspwcheck = function () {

/* 把全班的紀錄拉下來。拉完才匯得出全班的 CSV。 */
ACTS.pullev = function () {
  if (typeof syncPullEvents !== 'function') return say('沒有接上雲端。');
  say('拉下來中……');
  syncPullEvents(function (n) {
    DRAFT.evPull = n;
    render();
    say(n < 0 ? '拉不下來。' : (n ? '多了 ' + n + ' 筆。' : '已經是最新的了。'));

PAGES.events = function () {
  var cid = rsClassId();
  var only = DRAFT.evTeam || '';
  var all = eventsOf(cid, only ? { teamId: only } : null);
  var show = all.slice(0, 200);

  var H = [head('紀錄', all.length + ' 筆',
    '承諾幾天、哪一天推進、準不準、卡在哪。不收作業。')];

  H.push(classPicker());

  /* 篩組別 */
  H.push('<div class="tags">');
  H.push('<button class="tag' + (only ? '' : ' on') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'evteam:' })) + '\'>全班</button>');
  where('Teams', function (t) { return t.classId === cid; }).forEach(function (t) {
    H.push('<button class="tag' + (only === t.teamId ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'evteam:' + t.teamId })) + '\'>' + esc(t.name) + '</button>');
  });
  H.push('</div>');

  /* ── 先把全班的紀錄拉下來 ──

     紀錄跟別張表不一樣：它只往上推，不訂閱（見 41-sync.js 的檔頭——
     一學期幾千筆，每台機器每次開網頁都讀一遍會把免費額度吃光）。
     所以這一頁預設只看得到這台機器自己產生的那幾筆。

     要匯出的是全班的。按一下拉一次，一學期按幾次，不是每個人
     每次開網頁都拉一遍。 */
  if (typeof SYNC !== 'undefined' && SYNC.on) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">全班的紀錄</div>');
    H.push('<p class="dim">' + (DRAFT.evPull == null
      ? '這一頁現在只有這台電腦上發生的事。要匯出全班的，先拉一次。'
      : (DRAFT.evPull < 0 ? '拉不下來：' + esc(SYNC.err || '網路')
        : '拉下來了，多了 ' + DRAFT.evPull + ' 筆。')) + '</p>');
    H.push(btn('拉全班的紀錄', 'pullev', 'ghost'));
    H.push('</div>');
  }

  /* ── 匯出：三份 ──

     本來只有流水帳那一份。它的說明欄是一句中文（「交出去：承諾 4 天，
     實際 6 天 → early」），人讀很好，可是要算偏差率得先剖字。

     另外兩份是給試算表用的：一趟一列（組的單位）、一件一列（個人的
     單位）。每一個要算的東西自己一欄，一個字都不用剖。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">匯出</div>');

  H.push('<p><b>一趟一列</b>　' + exportRuns(cid).split('\n').length + ' 列</p>');
  H.push('<p class="dim">承諾天數、實際天數、判定、偏差率、把握、拆幾件、' +
    '順不順、範圍、老師回的天數、被退幾次、水晶、三個時間戳。</p>');
  H.push(btn('存成檔案', 'csvruns', 'ghost'));

  H.push('<p style="margin-top:22px"><b>一件一列</b>　' +
    exportItems(cid).split('\n').length + ' 列</p>');
  H.push('<p class="dim">個人層：那一件掛在誰名下、他說幾天、實際幾天、' +
    '差幾天、那個天數是不是他本人按的。</p>');
  H.push(btn('存成檔案', 'csvitems', 'ghost'));

  H.push('<p style="margin-top:22px"><b>流水帳</b>　' +
    exportCsv(cid).split('\n').length + ' 列</p>');
  H.push('<p class="dim">時間、誰做的、角色、組別、事件、說明。' +
    '說明是一句中文，人讀的那一份。</p>');
  H.push('<textarea id="csv" rows="3" readonly>' + esc(exportCsv(cid)) + '</textarea>');
  H.push(btn('存成檔案', 'csv', 'ghost'));
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">流水帳' +
    (all.length > show.length ? '　只列最近 ' + show.length + ' 筆' : '') + '</div>');
  if (!show.length) H.push('<p class="dim">還沒有動作。</p>');
  show.forEach(function (e) {
    var t = e.teamId ? teamOf(e.teamId) : null;
    H.push('<div class="rn-row">');
    H.push('<b>' + esc(t ? t.name : (ROLE_SAY[e.role] || '')) + '</b>');
    H.push('<span>' + esc(evSay(e)) + '</span>');
    H.push('<span class="sp" style="flex:1"></span>');
    H.push('<span class="dim">' + daysBetween(e.at, now()) + ' 天前</span>');
    H.push('</div>');
  });
  H.push('</div>');
  return H.join('');
};

/* 三顆下載鍵共用這一支。研究者只有讀跟存檔，一支寫入的函式都沒有
   （check.js 守著這一條）。 */
function rsSave(name, text) {
  try {
    /* BOM，不然 Excel 開起來中文是亂碼 */
    var blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('存成 ' + name + ' 了。');
  } catch (e) {
    say('這個瀏覽器不給存檔。上面那格的字全選複製也一樣。');
  }
}

ACTS.csvruns = function () {
  rsSave('專案地下城' + (RULES.SOLO ? 'B' : '') + '-一趟一列.csv', exportRuns(rsClassId()));
};

ACTS.csvitems = function () {

/* 開機。 */

(function () {
  /* 資料結構換過就重種一次，不要拿舊的撐新的畫面。
     Events 是後來才加的表——舊的存檔沒有它，畫面一讀就會炸。 */
  if (!load() || !DB.Milestones || !DB.Runs || !DB.Events || !DB.Keeps) seed();

  /* 上次登入的人還記得。關掉分頁再打開不用重登。 */
  var u = DB.Session ? userOf(DB.Session) : null;
  if (u) { S.who = u.userId; S.page = homeFor(u); }
  else { S.who = null; S.page = 'gate'; }
  /* 接上雲端。在 render 之前叫：它自己是非同步的，第一批資料回來
     的時候會再畫一次，所以這裡先拿本機這一份把畫面立起來，
     不要讓人對著白畫面等網路。 */
  if (typeof syncStart === 'function') syncStart();
  /* 這台分頁的程式碼會不會過期，跟有沒有接上雲端是兩回事——
     用 file:// 單機跑的人也可能開很久（見 41-sync.js 的 checkFresh）。 */
  if (typeof checkFreshStart === 'function') checkFreshStart();
  render();
})();


/* ===== 99-audit.js ===== */
/* 兩端一起檢查。貼進瀏覽器的 console 就會裝上 AUDIT()。

   為什麼要有這一支：這個作品的畫面改得很密，而預覽窗只有一種寬度，
   所以只看一端的話另一端壞掉不會有人發現。實際發生過兩次——
   桌機那條 flex 版面本來是白名單制，後來加的元素全部縮成一小塊；
   承諾那一頁用到的兩支函式被誤刪，整頁是壞的，而手機端看不出來。

   用法：AUDIT() 跑完目前寬度的全部頁面。換寬度再跑一次。
   會略過因為行長而收窄的（max-width 不是 none）——那是排版該做的事。 */
window.AUDIT = function () {
  var t = myTeam(), cls = t.classId;
  var done = where('Runs', function (r) { return r.teamId === t.teamId && r.stamp; })[0];
  var run = where('Runs', function (r) { return r.teamId === t.teamId && r.state === 'running'; })[0];
  var ms = where('Milestones', function (m) { return m.classId === cls; })[0];
  var P = [['home', {}], ['commit', { id: ms.msId }], ['battle', { id: (run || done).runId, at: 'end' }],
           ['stamp', { id: done.runId }],
           ['pack', {}], ['codex', {}],
           ['eco', {}], ['exit', {}], ['sign', {}]];
  var out = [];
  P.forEach(function (pp) {
    try {
      /* 頁面不存在的話 render() 會退回首頁，那會變成假通過。 */
      if (!PAGES[pp[0]]) { out.push(pp[0] + ' ✗ 這一頁不存在'); return; }
      S.page = pp[0]; S.p = pp[1]; S.flash = null; render();
      var de = document.documentElement;
      var w = document.querySelector('.wrap'), wr = w.getBoundingClientRect();
      var bad = [];
      if (de.scrollWidth > de.clientWidth + 2) {
        bad.push('橫向溢出 ' + de.scrollWidth + '>' + de.clientWidth);
      }
      [].forEach.call(w.children, function (e) {
        var cs = getComputedStyle(e), b = e.getBoundingClientRect();
        if (cs.display.indexOf('inline') === 0) return;
        if (cs.maxWidth !== 'none') return;
        if (e.classList.contains('btn') || e.classList.contains('quiet')) return;
        if (b.width > 0 && b.width < wr.width * 0.55) {
          bad.push('窄:' + (e.className || e.tagName).slice(0, 14) + '=' + Math.round(b.width));
        }
        if (b.right > wr.right + 4) bad.push('超出:' + (e.className || e.tagName).slice(0, 14));
      });
      if (!document.querySelectorAll('.nav a, .nav button').length) bad.push('沒導覽');
      out.push(pp[0] + (bad.length ? ' ✗ ' + bad.join(' / ') : ' ✓'));
    } catch (e) { out.push(pp[0] + ' ERR ' + e.message); }
  });
  S.page = 'home'; S.p = {}; render();
  return out.join('　');
};

/* ---------- 把動畫推到任意一格 ----------

   為什麼要有這一支：自動化瀏覽器不會推進動畫的時鐘，所以動畫做出來
   我看不到，只能等使用者看到不對再回報。那個迴圈不該由使用者跑。

   STEP(ms) 把畫面上每一段動畫都設到第 ms 毫秒並暫停，然後就可以截圖。
   要看整段就 STEP(0)、STEP(300)、STEP(900) 一格一格看。

   PLAY() 放開，讓它們照常跑。 */
window.STEP = function (ms) {
  var a = document.getAnimations();
  for (var i = 0; i < a.length; i++) {
    try { a[i].currentTime = ms; a[i].pause(); } catch (e) {}
  }
  return ms + 'ms　' + a.length + ' 段動畫';
};

window.PLAY = function () {
  var a = document.getAnimations();
  for (var i = 0; i < a.length; i++) { try { a[i].play(); } catch (e) {} }
  return a.length + ' 段動畫放開了';
};
