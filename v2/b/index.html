   只是一張卡片。現在兩端用同一套零件——.bt-wipe 閃場、.bt-plate 名牌、
   .bt-say 字幕框，都是照面那一場的（見 58-battle.css，那三個沒有
   綁在 .bt 底下）。

   畫的是大隻的那一張，比照面那一格再大一點：那裡是對峙，這裡是登場。 */
.pmt{
  position:relative; overflow:hidden; cursor:pointer;
  min-height:198px; display:flex; align-items:flex-end; justify-content:center;
  padding:44px 0 0; margin:0 0 11px;
  background-color:var(--zbg);
  box-shadow:inset 0 0 0 2px var(--line2);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.pmt .bt-plate{left:16px;top:16px}
.pmt:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.pmt-ch{position:relative;z-index:2;line-height:0}
.pmt .bt-px{width:176px;height:117px;image-rendering:pixelated}
@media (max-width:520px){ .pmt .bt-px{width:132px;height:88px} .pmt{min-height:154px} }

.pmt-say{position:relative}
.pmt-say em{
  display:block;font-size:22px;font-style:normal;line-height:33px;color:var(--dim)
}
.pmt-crystal{font-size:22px;color:var(--gold);margin:0 0 22px}

/* ── 登場 ──
   閃場 → 他走進來 → 名牌 → 字幕 → 水晶。一拍接一拍，全部 steps()。
   backwards 是必要的：沒有它，delay 還沒到的那幾樣會先用最終狀態
   畫出來，等於先劇透再演。 */
.pmt.enter .pmt-ch{ animation:patin .48s steps(4,end) .30s 1 backwards }
.pmt.enter .bt-plate{ animation:patname .3s steps(2,end) .74s 1 backwards }
.bt-say.pmt-say.enter{ animation:patline .3s steps(2,end) .96s 1 backwards }
.pmt-crystal.enter{ animation:patcrystal .36s steps(3,end) 1.18s 1 backwards }

@media (prefers-reduced-motion: reduce){
  .pmt.enter .pmt-ch,.pmt.enter .bt-plate,
  .bt-say.pmt-say.enter,.pmt-crystal.enter{animation:none}
}

/* 那一趟長什麼形狀。走過的每一格裡面本來就空著的一條——
   五顏六色跟一整條同色，看一眼就是兩種不同的禮拜。
   不用讀，所以沒有文字、沒有圖例。 */
.rs-sh{display:flex;gap:1px;width:100%;height:5px;margin:5px 0 0}
.rs-sh i{flex:1 1 auto;min-width:3px;height:5px;display:block}

/* 結算那一格：一行一行進來。

   演出不落在揭曉上（那一下在照面那一頁演過了），落在最後那一行——
   「上一趟相差」是這一頁唯一照面沒有的東西，也是整套系統裡唯一
   說得出「我在變好」的地方。它慢一拍到，所以他讀完自己這一趟，
   才看到上一次的自己站在旁邊。

   steps(2)、往上推 6px，跟這個世界其他的登場同一種手感。 */
.rep.stage dt,.rep.stage dd{
  animation:repline .28s steps(2,end) var(--d,0ms) 1 backwards
}
@keyframes repline{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion: reduce){
  .rep.stage dt,.rep.stage dd{animation:none}
}

/* 老師這一頁上的委託人。學生跟他打了一整趟交道，而老師本來看不到他。

   小、橫排、不動——老師這一頁的工作是讀，不是看戲。 */
.card.rvw-pat{display:flex;align-items:flex-start;gap:14px;background-color:var(--zbg)}
.px.rvw-px{width:66px;height:44px;flex:0 0 66px;image-rendering:pixelated}
.rvw-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.rvw-t b{font-size:22px;font-weight:400;color:var(--zink,var(--ink))}
.rvw-t em{font-size:22px;font-style:normal;line-height:1.6;color:var(--dim)}

/* ── 故事第三頁：會留下來的三樣 ──

   左暗右亮，中間一道門。門是重點——那四個字是唯一讓東西亮起來的條件。
   右邊的光暈要讓人一眼就讀到「這邊才是你要的」。 */
.sty-keep{
  display:flex;align-items:flex-end;justify-content:center;gap:22px;
  padding:22px 14px 44px;
  background-color:var(--zbg);background-image:var(--ztex)
}
/* 左邊「交出去了」與右邊「收下之後」。同一組東西，差別只有亮不亮。 */
.sk-side{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.sk-row{display:flex;align-items:flex-end;gap:11px}
.sk-side > em{font-style:normal;font-size:22px;color:var(--mute)}
/* 左邊壓暗——交出去了但還沒被收下，灰而且退後。 */
.sk-side:not(.on){opacity:.55}
/* 右邊亮起來，底下墊一層暖光。 */
.sk-side.on > em{color:var(--ink)}
.sk-side.on{position:relative}
.sk-side.on::before{
  content:'';position:absolute;left:50%;top:50%;z-index:-1;
  width:200%;height:200%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(233,179,65,.18) 0%,transparent 70%);
  pointer-events:none
}
/* 三個名字，一個對一個站在那三張圖底下。 */
.sk-names{display:flex;gap:11px}
.sk-names b{
  font-weight:400;font-size:22px;color:var(--gold2);
  min-width:44px;text-align:center;white-space:nowrap
}
/* 中間那一道門。箭頭上那四個字是整張圖的重點。
   加了一道光柱：從門往右邊暈開，把「收下」的視覺重量拉上來。 */
.sk-gate{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  position:relative;z-index:1;padding-bottom:22px
}
.sk-gate em{
  font-style:normal;font-size:22px;color:var(--gold);
  text-shadow:0 0 11px rgba(233,179,65,.5)
}
/* 門後面的光柱。 */
.sk-gate::before{
  content:'';position:absolute;left:50%;top:0;bottom:0;width:200px;z-index:-1;
  transform:translateX(-30%);
  background:linear-gradient(90deg,transparent 0%,rgba(233,179,65,.08) 30%,rgba(233,179,65,.12) 50%,transparent 100%);
  pointer-events:none
}
/* 三樣東西站的那一片地。跟廊道那一張同一個做法（見 .sty-floor）：
   上緣一條亮的，底下暗。 */
.sk-floor{
  position:absolute;left:0;right:0;bottom:0;height:33px;z-index:0;
  background:linear-gradient(180deg,var(--zfl2,#3B2D11) 0 3px,var(--zfl,#241B0C) 3px 100%)
}
.sk{position:relative;z-index:1}
.sk-side.on .sk-px{filter:none}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:66px}
.sk em{font-style:normal;font-size:22px;color:var(--dim)}
/* 寬度寫在 .sk-px 自己身上，不掛在祖先底下——換個地方畫也要有寬度
   （check.js 那一條在守的就是這個）。 */
.sk-px{width:66px;height:auto;image-rendering:pixelated}
/* 右邊那三張亮的加一圈微光。 */
.sk-side.on .sk-px{filter:drop-shadow(0 0 6px rgba(233,179,65,.4))}
.sk-pair{display:flex;align-items:center;gap:8px}
.sk-pair .sk-px{width:44px}
/* 黑影 → 亮的，中間那一支。

   本來是 CSS 的三角形，而斜邊會被瀏覽器抹平——這一整個作品的
   東西都是方格（image-rendering:pixelated、11px 的斜角），
   一條平滑的斜邊在裡面特別顯眼。

   改成用 box-shadow 疊方塊拼，每一塊 3px，所以它是階梯不是斜線。 */
.sk-arrow{
  position:relative;flex:0 0 21px;width:21px;height:3px;
  background:var(--gold-d)
}
.sk-arrow::after{
  content:'';position:absolute;right:0;top:-6px;width:3px;height:15px;
  background:transparent;
  box-shadow:
    -6px 6px 0 0 var(--gold-d),
    -3px 3px 0 0 var(--gold-d), -3px 9px 0 0 var(--gold-d),
    0 0 0 0 var(--gold-d),      0 6px 0 0 var(--gold-d), 0 12px 0 0 var(--gold-d)
}
/* 窄的時候：三張圖縮小，名字跟著縮，箭頭轉成往下不佔寬。 */
@media (max-width:520px){
  .sty-keep{gap:11px;padding:14px 5px 33px}
  .sk-px{width:44px}
  .sk-side.on .sk-px{filter:drop-shadow(0 0 4px rgba(233,179,65,.35))}
  .sk-row{gap:5px}
  .sk-names{display:none}
  .sk-gate{padding-bottom:11px}
  .sk-gate::before{width:120px}
}

/* 複製那一顆。跟在「他們說東西在這裡」那一行下面——
   老師打開這一頁之後的下一個動作就是去看東西，這一顆是那條路的一半
   （另一半是可以點的連結，見 56-viz.js 的 whereLine）。 */
.wh-copy{margin-top:11px}
/* 兩個代碼旁邊那一顆複製鍵（隊伍代碼在組別卡上、班級加入碼在各組進度）。
   只給間距，字級不碰——沒有小字（check.js 第八道，2026-09-09 修好之後
   那一條真的會擋了）。 */
.cp{margin-left:11px;padding:2px 11px}

/* ---------- 你在哪幾個班 ----------
   一行一個。現在坐的那一個亮著，其餘的點一下換過去。 */
.seats{display:flex;flex-direction:column;gap:5px;margin:5px 0 11px}
.seat{
  display:block;width:100%;text-align:left;
  padding:11px;border:1px solid var(--line);background:none;
  color:var(--dim);cursor:pointer;font:inherit
}
.seat b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.seat i{display:block;font-size:22px;font-style:normal;color:var(--mute);margin-top:5px}
.seat u{display:block;font-size:22px;text-decoration:none;color:var(--gold);margin-top:5px}
.seat.on{border-color:var(--gold)}
/* 可以換過去的那幾張要看得出來按得下去（見 50-style.css 的 .pressable）。
   現在坐的那一張不用——它是狀態不是動作，而且它已經有金框跟
   「現在在這裡」那一行。 */
.seat:not(.on){position:relative}
.seat:not(.on)::after{
  content:'▸';position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-size:22px;line-height:1;color:var(--mute);pointer-events:none
}
.seat:not(.on):hover::after,.seat:not(.on):focus-visible::after{color:var(--gold)}
.seat:not(.on):hover{border-color:var(--dim)}
/* 側欄那一格現在是一顆鍵。看起來要跟原本一模一樣。 */
button.side-head{
  display:block;width:100%;text-align:left;border:0;background:none;
  color:inherit;font:inherit;cursor:pointer;padding:0
}

/* ---------- 有人剛說了天數 ----------

   只在有的時候出現的一行（見 70-teacher.js）。它不是待辦，是邀請——
   所以不用金色（金色在這裡是「該你動了」），用一條暗的邊。 */
.asknote{
  display:block;width:100%;text-align:left;
  padding:14px 33px 14px 14px;margin:0 0 11px;
  border:0;border-left:3px solid var(--mute);background:none;
  color:var(--dim);font:inherit;cursor:pointer
}
.asknote b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.asknote i{display:block;font-size:22px;font-style:normal;color:var(--mute);margin-top:5px}
.asknote:hover{border-left-color:var(--gold)}

/* ---------- 圖鑑上的水晶 ----------

   照亮的那一格跟遇過的那一格要看得出不一樣：遇過的是滿的，
   照亮的暗一階，而且多一行字說它是照亮的（見 64-codex.js）。
   不用新的顏色——一個顏色一件事。 */
.cxi.lit{opacity:.82}
.cxi.lit .cx-lit{display:block;color:var(--mute);font-style:normal;font-size:22px;margin-top:5px}
.cx-need{display:block;color:var(--mute);font-style:normal;font-size:22px;margin-top:5px}
.cx-light{
  display:block;margin-top:11px;padding:11px;
  font:inherit;font-size:22px;text-align:left;cursor:pointer;
  border:1px solid var(--gold-d);background:none;color:var(--gold)
}
.cx-light:hover{border-color:var(--gold);background:rgba(233,179,65,.10)}
.cx-hint{display:block;color:var(--mute);font-style:normal;font-size:22px;margin-top:5px}
/* 這一頁最上面那一行：手上有幾顆。 */
.cx-crystal{color:var(--dim);margin:0 0 11px}

/* 組別卡上那個括號：拿過多少。它是背景資訊，退一階
   （前面那個「手上剩多少」才是他要用的數字）。 */
.tmc-cry em{
  display:block;font-style:normal;font-size:22px;color:var(--mute);margin-top:5px
}

/* ---------- 交出去的那一場 ----------

   排版照寶可夢：牠的名牌在左上、牠站在右上；你站在左下、你的名牌在右下。
   底下一個字幕框，一句一句走。

   規矩跟全作一致：hard stop、0 模糊、光從左上來、圓角一律 11px 的切角。
   血條的動畫用 steps()——平滑的補間會讓它立刻看起來像現代的網頁元件，
   而不是一台在跑的機器。 */

.bt{
  position:relative;height:352px;overflow:hidden;margin:0 0 11px;
  background:linear-gradient(180deg,var(--z1) 0 46%,var(--z2) 46% 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.32), inset 3px 3px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bt-side{position:absolute;left:0;right:0;height:50%}
.bt-side.foe{top:0}
.bt-side.me{bottom:0}

/* 名牌。名字、一條時間、剩幾天。數字寫在旁邊，不用猜那條有多長。 */
.bt-plate{
  position:absolute;width:170px;max-width:46%;padding:6px 11px;z-index:4;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.34), inset 2px 2px 0 rgba(255,255,255,.10);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)
}
.bt-side.foe .bt-plate{left:16px;top:16px}
.bt-side.me .bt-plate{right:16px;bottom:16px}
.bt-plate b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.bt-num{display:block;font-size:22px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}

.bt-bar{height:9px;margin:5px 0 2px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.bt-bar i{display:block;height:100%;background:var(--gold);
  transition:width .1s steps(2,end)}
/* 見底那一刻換色。這是「時間用完了」唯一的訊號——不扣任何東西，
   但看得出來。 */
.bt.me-out .bt-plate.me .bt-bar i{background:var(--over)}
.bt.foe-out .bt-plate.foe .bt-bar i{background:var(--over)}

/* 站台。硬邊的一塊，不是橢圓陰影——橢圓一畫上去就不是像素了。 */
.bt-pad{
  position:absolute;width:143px;height:11px;z-index:1;
  background:linear-gradient(180deg,
    rgba(255,240,214,.13) 0 3px, rgba(0,0,0,.30) 3px 11px)
}
.bt-side.foe .bt-pad{right:33px;bottom:11px}
.bt-side.me .bt-pad{left:33px;bottom:44px}

.bt-ch{position:absolute;z-index:2}
.bt-side.foe .bt-ch{right:66px;bottom:14px}
.bt-side.me .bt-ch{left:66px;bottom:47px}
.bt-px{width:88px;height:88px;image-rendering:pixelated}
/* 委託人那一邊本來鏡射過來面對你。小圖是剪影，翻過來還是剪影；
   換成大隻的之後那是一張臉——臉翻過來，光就從右上打，而這個世界
   的光一律從左上來（見 12-heroes.js）。

   而且他本來就是正面朝著你畫的：對話裡的一張畫像不需要轉身。 */
.bt-side.foe .bt-px{transform:none}

/* 呼吸。兩邊反相，畫面才不會像一張靜止圖。 */
.bt-side.foe .bt-ch{animation:btbob 1.2s steps(2,end) infinite}
.bt-side.me .bt-ch{animation:btbob 1.2s steps(2,end) infinite reverse}
@keyframes btbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 遭遇：整個畫面閃一次再進場。 */
.bt-wipe{
  position:absolute;inset:0;z-index:9;background:#000;pointer-events:none;
  animation:btwipe .42s steps(4,end) 1 forwards
}
@keyframes btwipe{0%{opacity:1}100%{opacity:0}}

/* ── 對決那一組拿掉了 ──

   這裡本來有 .bt.hit：畫面震一下（bthit）、角色往前跨（btlunge）、
   整片白閃（btflash），底下還有一條讓牠閃三下（btblink）。

   那是回合制對決那一版的東西，而這個作品已經沒有對決了。答完一題
   現在播的是 .bt.take——往前低一下再回來，接東西的動作。

   它們早就打不到了：唯一會加 'hit' 的是 35-anim.js 的 shakeScene，
   而那一支加在 .scn-in 上、而且沒有人呼叫。所以留著不會播，
   可是下一個讀這段的人很可能會把它接回去——一組現成的、名字剛好對上
   的那一組動畫躺在那裡，比沒有更危險。

   （同一天剛把「再打一次」那顆鍵改成「再交一次」，那是同一版留下來的
     最後一個字。check.js 現在擋畫面上的對決字眼。） */

/* 牠見底：退開、暗下去。牠不是被打死的，牠只是不再擋在那裡。

   2026-09-14：使用者量到的——「整個繳交委託人的動畫還是像是在打倒他」。
   這一條當時就是為了取代下面那組舊的而寫的，可是舊的排在檔案後面，
   同一個選擇器、同分量，後面那條贏。於是畫面上真的播的從來不是這裡，
   是被判定為「早就打不到了」的另一組——判斷錯了對象，删掉 .bt.hit
   那組的時候，這裡沒一起清乾淨。見底下拿掉的那一段。 */
.bt.foe-out .bt-side.foe .bt-ch{
  animation:btfall .55s steps(3,end) 1 forwards
}
@keyframes btfall{to{transform:translate(33px,11px);opacity:.18}}
/* 名牌跟著暗，退場退得完整——不是只有人淡出，桌上那張牌還亮著。 */
.bt.foe-out .bt-side.foe .bt-plate{opacity:.55}

/* 字幕框。一句一句走——一次全部倒出來就不是一場戰鬥，是一張結果表。 */
.bt-say{
  min-height:66px;margin:0 0 11px;padding:14px 16px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.30), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bt-say b{font-size:22px;font-weight:400;line-height:33px;color:var(--ink)}
.bt-btn{margin:0}

@media (max-width: 899px){
  .bt{height:308px}
  .bt-px{width:66px;height:66px}
  .bt-plate{width:150px}
}
@media (prefers-reduced-motion: reduce){
  .bt-wipe,.bt-side .bt-ch,
  .bt.take .bt-side.foe .bt-ch{animation:none}
  .bt-wipe{display:none}
  .bt-bar i{transition:none}
}

/* ---------- 首頁角色頭上那一塊牌子 ----------
   使用者：現在的呈現看不出他在幹嘛。寫出來最快。 */
.hero-tag{
  /* 從角色那個框的上緣往上長，留 9px。本來寫 top:-22px，
     而牌子自己就有 30px 高，下緣會蓋到頭。 */
  position:absolute;left:50%;bottom:100%;margin-bottom:9px;
  transform:translateX(-50%);
  padding:2px 9px;font-size:22px;line-height:1.3;white-space:nowrap;z-index:5;
  color:var(--mute);background:rgba(0,0,0,.62);
  box-shadow:inset 0 0 0 2px rgba(255,240,214,.14)
}
.hero-tag.go{color:#0F0C08;background:var(--gold);
  box-shadow:inset 0 0 0 2px var(--gold2);
  animation:tagb 1.1s steps(1,end) infinite}
/* 同一塊金，不脈動——commit 那個狀態角色是坐著的，牌子閃爍會暗示
   「正在動」，而他沒有（見 61-scene.js）。金色本身已經在講
   「可以按這裡」，不需要再借動畫講一次「在動」。 */
.hero-tag.new{color:#0F0C08;background:var(--gold);
  box-shadow:inset 0 0 0 2px var(--gold2)}
.hero-tag.rest{color:#FFD9A0;background:rgba(233,132,63,.30);
  box-shadow:inset 0 0 0 2px rgba(233,132,63,.65)}
@keyframes tagb{0%,60%{background:var(--gold)}61%,100%{background:var(--gold2)}}
@media (prefers-reduced-motion: reduce){ .hero-tag.go{animation:none} }

/* ── 選單 ──
   貼在畫面右下角，寶可夢的招式選單就長在那裡。
   登場演完才出現（JS 加 .ready），不是用動畫開——
   動畫的時鐘會被凍住，setTimeout 不會。 */
/* 下面那一條：左邊字幕框、右邊選單。
   本來選單貼在畫面右下角，跟自己的名牌疊在一起。 */
.bt-bottom{display:flex;gap:11px;align-items:stretch;margin:0 0 11px}
.bt-bottom .bt-say{flex:1;margin:0;min-width:0}
.bt-menu{
  flex:0 0 auto;display:none;align-self:stretch;
  background:var(--card2);padding:9px 11px;
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
.bt-bottom.ready .bt-menu{display:block;animation:btpop .2s steps(2,end) 1}
@keyframes btpop{from{transform:translateY(11px)}to{transform:none}}
.bm{
  display:block;width:100%;padding:3px 22px 3px 14px;text-align:left;
  border:none;background:none;font:inherit;cursor:pointer;
  font-size:22px;line-height:33px;color:var(--ink);white-space:nowrap
}
/* 寶可夢的游標：選到的那一行前面有一個 ▶。 */
.bm::before{content:'▶';margin-right:6px;opacity:0;color:var(--gold)}
.bm:hover::before,.bm:focus::before{opacity:1}
.bm.go{color:var(--gold)}

/* 名牌與字幕框照舊版寶可夢：方角、粗黑外框、裡面一圈亮邊。
   那個年代的畫面能力低，靠的全是輪廓與對比——
   剛好跟這個作品的規矩一致（hard stop、0 模糊、光從左上來）。 */
.bt-plate,.bt-say{clip-path:none;border-radius:0}
.bt-plate{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}
.bt-say{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}
/* 名牌那條斜出去的尾線——那個畫面最好認的一筆。 */
.bt-plate::after{
  content:'';position:absolute;bottom:-3px;height:3px;background:#0D0B08
}
.bt-side.foe .bt-plate::after{left:0;width:calc(100% + 33px)}
.bt-side.me .bt-plate::after{right:0;width:calc(100% + 33px)}

.bt-row{display:flex;align-items:center;gap:6px}
.bt-row em{font-size:22px;font-style:normal;color:var(--gold2)}
.bt-row .bt-bar{flex:1;margin:5px 0 2px}

/* 字幕框右下角那個閃動的三角。 */
.bt-say{position:relative}
.bt-arrow{
  position:absolute;right:14px;bottom:11px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:8px solid var(--gold);
  animation:btar .7s steps(1,end) infinite
}
@keyframes btar{0%,50%{opacity:1}51%,100%{opacity:0}}

/* 「牠閃三下」那一條跟 .bt.hit 一起拿掉了（見上面）。 */

@media (prefers-reduced-motion: reduce){
  .bt-arrow{animation:none}
}

/* 背景太黑就不是一個地方。鋪上那一層的紋理，
   跟廊道與剖面圖共用同一份（見 51-zones.css 的 --ztex）。 */
.bt{background-color:var(--zbg);background-image:var(--ztex)}
.bt::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,
    rgba(255,240,214,.05) 0 46%, rgba(0,0,0,.22) 46% 100%)
}
/* 牠畫得比人小一半就不像擋路的。原圖 24×16，比例照著給才不會被拉扁。 */
.bt-side.foe .bt-px{width:132px;height:88px}
@media (max-width: 899px){ .bt-side.foe .bt-px{width:110px;height:73px} }
/* 見底那一刻，那一張名牌整個暗下來。 */
.bt-plate.out{opacity:.72}

/* .bt-plate b 是 display:block（名字要獨占一行），
   但名牌右下角那個 n/ m 裡面的 b 也吃到了，於是斷成兩行。 */
.bt-num b{display:inline}

/* ── 血條拿掉之後的名牌 ──
   上面只有名字；報完那一趟才長出「說了幾天／走了幾天」。 */
.bt-plate .bt-num{display:block;margin-top:5px;font-size:22px;color:var(--gold2);
  text-align:left;font-variant-numeric:tabular-nums}
.bt-plate{width:auto;min-width:110px}

/* ── 登場 ──

   這一頁每答完一題就整塊重畫，元素重新生出來、掛在上面的動畫就重播。
   所以登場那幾段要收進 .bt.first（見 67-battle.js：進這一頁的時候
   S.p 只有 id，問題那幾步一定帶 ph）。呼吸（btbob）不收，它是狀態不是
   事件——上面那一條（.bt-side.foe .bt-ch）本來就給了。

   ── 這裡本來有第二個登場動畫 ──

   btenter（從右邊滑進來）躺在這裡，而底下第 366 行還有一個 btjump
   （從下面跳上來，舊版寶可夢的野生遭遇）。兩條同一個元素、同一件事。

   因為 .bt.first 的權重比較高，剛遇到的時候播的是**滑**；而 btjump
   那一條沒有任何條件，所以每一次重畫都在播——也就是每答完一題，
   牠就從下面再跳進來一次。

   我第一次修這個 bug 的時候只擋到 btenter，量的又剛好是 .bt.take 還在
   的那一刻（那時 bttake 蓋過去，看起來是對的），所以沒看到 take 被
   拿掉之後 btjump 又接手。

   留 btjump：它才是這一頁想要的那一下（檔案裡的註解也是那樣寫的），
   而且它是後來加的。btenter 跟它的 keyframes 一起拿掉。 */
.bt.first .bt-side.foe .bt-plate{animation:btslide .45s steps(5,end) 1}
@keyframes btslide{from{transform:translateX(-55px)}to{transform:translateX(0)}}
.bt.first .bt-side.me .bt-plate{animation:btslider .45s steps(5,end) 1}
@keyframes btslider{from{transform:translateX(55px)}to{transform:translateX(0)}}

/* ── 「被打敗」那組刪掉了 ──

   這裡本來也有一條 .bt.foe-out .bt-side.foe .bt-ch，animation 是
   btko：閃四下、往下滑出畫面、淡出——回合制對決那一版「打贏」的收尾，
   跟上面 .bt.hit 那組（bthit／btlunge／btflash）同一批留下來的。

   跟那一批不一樣的是，這一條**沒有打不到**：foe-out 是 67-battle.js
   真的會加的 class（老師收下、牠退場的那一刻），而這裡跟上面 90 行
   那條是同一個選擇器——後寫的這條覆蓋掉前面那條溫和的版本，所以
   真正播出來的一直是這個「打贏收尾」，畫面才會像在打倒他。

   拿掉了。牠退場借的就是上面那條 btfall：淡出、退開，不閃、不用
   「KO」那種一格一格的生死閃爍。 */

/* 報出來那一刻，兩張名牌一起亮一下。 */
.bt.told .bt-plate{animation:bttold .4s steps(2,end) 1}
@keyframes bttold{0%,49%{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px var(--gold)}
  50%,100%{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}}

@media (prefers-reduced-motion: reduce){
  .bt-side.foe .bt-ch,.bt-side .bt-plate{animation:none}
  .bt.foe-out .bt-side.foe .bt-ch{animation:none;opacity:.15}
  .bt.told .bt-plate{animation:none}
}


/* 手機上下面那一條擠不下並排，就上下疊。 */
@media (max-width: 599px){
  .bt-bottom{flex-direction:column;gap:9px}
  .bt-menu{align-self:stretch}
  .bm{display:inline-block;width:auto;margin-right:22px}
}

/* 桌機上不要把戰鬥拉成一長條。
   全寬的話兩邊角色被推到極端、中間整片空，那就不是一個畫面了。
   舊版寶可夢的戰鬥畫面接近方的，所以這裡也收在一個方框裡。 */
@media (min-width: 900px){
  .bt{max-width:704px;margin-left:auto;margin-right:auto;height:396px}
  .bt-bottom{max-width:704px;margin-left:auto;margin-right:auto}
  /* 對話那一格不收窄。上面那個方框是為了對峙——兩邊各站一個，
     拉寬就變成中間一整片空。對話只有他一個人站中間，而他站的
     是廊道那條路：收成 704 的話，按下去的那一刻左右各縮一截。 */
  .bt.talk,.bt-bottom.talk{max-width:none}
  .bt-side.foe .bt-ch{right:110px}
  .bt-side.me .bt-ch{left:110px}
  .bt-side.foe .bt-pad{right:77px}
  .bt-side.me .bt-pad{left:77px}
}

/* ── 兩問 ──
   接在字幕框底下，跟選單同一個位置。答完他接過去。 */
.bt-q{
  margin:0 0 11px;padding:14px 16px;background:var(--card2);
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
@media (min-width: 900px){ .bt-q{max-width:704px;margin-left:auto;margin-right:auto} }
.bt-q .steps-list,.bt-q .alist{margin:0 0 11px}
.bt-menu.wide{display:flex;gap:22px;background:none;box-shadow:none;padding:0}
.bt-menu.wide .bm{width:auto}

/* ── 接過去 ──

   答完一題，他接過去。

   ── 換掉了什麼 ──

   本來這一段的註解自己就寫著這是一場對決：答完一問就朝牠來一下，
   整個畫面震一下，牠往右退、閃三下。那是回合制的殘留——而這個作品已經沒有對決了
   （67-battle.js 的註解也寫著「不是被打——是有人回話了」，兩邊互相
   矛盾，而動畫用的是對決那一組）。

   三樣都不對：

     整個畫面震一下　　那是打到東西的回饋。這裡沒有人打到東西
     牠往右退　　　　　退是被撞開。他是在接東西，接東西是**往前**
     閃三下　　　　　　閃爍在這一套裡的意思是「挨了一下」

   而且它每答一題就演一次——一趟六題，等於揍他六下。

   ── 換成什麼 ──

   接東西的動作：往前低一下，再回來。往左是往學生那一邊（他在畫面
   右側，見 .bt-side.foe）。沒有畫面震動、沒有白閃、沒有閃爍。

   一格一格（steps(1,end)），跟全站一樣。 */
.bt.take .bt-side.foe .bt-ch{animation:bttake .42s steps(1,end) 1}
@keyframes bttake{
  0%  {transform:translate(0,0)}
  20% {transform:translate(-7px,5px)}
  50% {transform:translate(-3px,2px)}
  100%{transform:translate(0,0)}
}

/* ── 逃跑 ──
   填到一半發現寫不出來就走。角色往回跑出畫面——
   那不是認輸，是承認做不完，而承認比硬交出去好。 */
.bt.flee .bt-side.me .bt-ch{
  animation:btflee .8s steps(6,end) 1 forwards
}
@keyframes btflee{to{transform:translateX(-352px)}}
.bt.flee .bt-side.me .bt-plate{opacity:.4}

@media (prefers-reduced-motion: reduce){
  .bt.flee .bt-side.me .bt-ch{animation:none;opacity:.2}
}

/* 第二問那三塊。小標在上、東西在下，跟字幕框同一種框。 */
.bt-qh{font-size:22px;color:var(--gold2);margin:11px 0 6px}
.bt-qh:first-child{margin-top:0}
/* 只管排版。長相歸材質層——底色、那道冷藍的左邊、聚焦的樣子
   都在 52-material.css 的「你要寫字的地方」那一段。

   本來這裡自己畫一套（灰底、一圈黑框、聚焦是暗金），而 58 載入在
   52 後面，所以整套冷藍的語言在交作業那一頁被蓋掉了——
   偏偏那一頁是全站最需要「哪一格在等你填」的地方。
   而聚焦用金色更是走錯：金色是「可以按」。 */
.bt-w{
  width:100%;margin:0;padding:9px 11px;font:inherit;font-size:22px;line-height:22px;
  border:none;resize:vertical
}

/* ── 登場：牠先跳出來 ──
   舊版寶可夢的野生遭遇：畫面切掉，牠從下面跳上來、彈一下才站定。
   跳完才輪到你——所以選單是登場演完才出現的。

   .bt.first 是後來加的：這一條本來沒有任何條件，而這一頁每答完一題就
   整塊重畫，所以牠每一題都跳一次進來（見上面「登場」那一段）。 */
.bt.first .bt-side.foe .bt-ch{
  animation:btjump .62s steps(6,end) 1, btbob 1.2s steps(2,end) .62s infinite
}
@keyframes btjump{
  0%{transform:translate(44px,66px)}
  55%{transform:translate(6px,-14px)}
  75%{transform:translate(0,6px)}
  90%{transform:translate(0,-4px)}
  100%{transform:translate(0,0)}
}
/* 落地那一下的塵。硬邊的一條，沒有粒子。 */
.bt-side.foe .bt-pad::after{
  content:'';position:absolute;left:-11px;right:-11px;top:0;height:3px;
  background:rgba(255,240,214,.5);
  animation:btdust .5s steps(3,end) .55s 1 backwards
}
@keyframes btdust{0%{opacity:0;transform:scaleX(.3)}30%{opacity:.9;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(1.3)}}
@media (prefers-reduced-motion: reduce){
  .bt-side.foe .bt-ch{animation:none}
  .bt-side.foe .bt-pad::after{animation:none;opacity:0}
}

/* ── 舊版寶可夢那種框，往主流程推 ──

   那個年代的介面只有一種框：外面一圈粗黑、裡面一圈亮邊、方角。
   它之所以好認，是因為整個畫面上每一個「要你讀」或「要你選」的東西
   都長成那樣——所以這裡也只給那兩種東西用：

     .tline     現在要做的是什麼（讀）
     .act-card  那一顆鍵在的地方（選）
     .bt-say / .bt-menu / .bt-q  戰鬥裡的字幕與選單

   其餘（卡片、地圖、圖鑑）維持原本 11px 的切角——
   全部換成方角的話，這個作品就變成寶可夢的仿作，而不是它自己。 */
.tline, .act-card{
  clip-path:none;border-radius:0;
  background:var(--card2);
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
.tline{margin-bottom:11px}

/* 主要那一顆鍵：選單的一行，前面有游標。

   直向的 padding 是 11 不是 6：這一顆是廊道上每一個狀態唯一該按的那一顆
   （去見他、做完了、這個專案叫什麼都是它），而 6 的時候整顆只有 38px 高。
   手指按得到的下限是 44——38 不是按不到，是會按歪，而按歪的那一下
   會落在它後面的卡片上，看起來就像「我按了但沒反應」。

   11 之後是 48。左邊維持 11，所以那條游標的位置一格都沒動。 */
.act-card .btn.big{
  clip-path:none;border-radius:0;text-align:left;
  background:none;color:var(--gold);
  box-shadow:none;padding:11px
}
.act-card .btn.big::before{
  content:'▶';margin-right:9px;color:var(--gold);
  animation:btar .7s steps(1,end) infinite
}
.act-card .btn.big:hover{background:rgba(233,179,65,.12)}
@media (prefers-reduced-motion: reduce){ .act-card .btn.big::before{animation:none} }

/* ── 收掉太像的那幾筆 ──

   使用者：「不要太明顯，我不想被說抄襲。」他是對的。

   結構可以留（照面、名牌、字幕框、兩個選項、閃爍後倒下）——那些是
   那個年代通用的做法，不屬於任何一款遊戲。要收掉的是那幾筆一眼就
   認得出是誰的：

     ▶ 游標          那是最好認的一筆
     名牌的斜尾線     第二好認
     閃動的 ▼        第三
     全方角的框      跟這個作品自己的 11px 切角衝突

   換回這個作品自己的語彙：11px 切角、金色的小方塊、硬邊的亮邊。 */

/* 游標換成這個作品自己的金色方塊，不閃。 */
.bm::before{content:'';display:inline-block;width:6px;height:6px;
  margin-right:9px;vertical-align:middle;background:transparent}
.bm:hover::before,.bm:focus::before{background:var(--gold)}
.act-card .btn.big::before{
  content:'';display:inline-block;width:6px;height:6px;margin-right:11px;
  vertical-align:middle;background:var(--gold);animation:none
}

/* 名牌的斜尾線拿掉，角改回 11px 的切角。 */
.bt-plate::after{display:none}
.bt-plate,.bt-say,.bt-menu,.bt-q,.tline,.act-card{
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
/* 切角配不上外框的粗黑圈，改成往內的亮邊——跟全作其他卡片同一套。 */
.bt-plate,.bt-say,.bt-menu,.bt-q,.tline,.act-card{
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.34), inset 2px 2px 0 rgba(255,255,255,.10)
}
.bm:hover{box-shadow:none}

/* 字幕框那個三角拿掉。有按鍵在旁邊，不需要「按 A 繼續」的提示。 */
.bt-arrow{display:none}

/* 他自言自語的那一句。借的是同一塊牌子（見 61-scene.js 的 osTick），
   所以只換樣子不換位置：金邊拿掉、字色轉白、多一個小尾巴指向他。

   兩件事跟那塊牌子不一樣：

   一 · 會折行。牌子上是「前進中」三個字，一句話是十七個——
        nowrap 的話一行三百七十幾，比廊道還寬。

   二 · 從他的左邊長出去，不置中。置中的話，坐在洞口的那個人
        （x=44）頭上那一塊會有一半落在畫面外，而 .scn 是
        overflow:hidden——落在外面的字不是跑版，是被切掉。
        尾巴因此挪到他頭頂正上方那一點。 */
.hero-tag.os{
  left:0;transform:none;
  /* width:max-content 是必要的：這一塊是絕對定位掛在角色那個 66px 的
     框上，寬度 auto 會收縮到那個框的寬——十七個字就變成一行一個字，
     291px 高，整條頂出畫面。max-content 讓它照字算，再用 max-width 收。 */
  width:max-content;max-width:264px;
  white-space:normal;text-align:center;line-height:1.45;
  color:var(--ink);background:rgba(6,5,4,.88);
  box-shadow:inset 0 0 0 2px var(--line2);
  animation:osin .18s steps(2,end) 1
}
.hero-tag.os::after{
  content:'';position:absolute;left:29px;top:100%;
  width:8px;height:6px;background:rgba(6,5,4,.88)
}
@keyframes osin{
  0%{transform:translateY(4px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
@media (prefers-reduced-motion: reduce){ .hero-tag.os{animation:none} }

/* 他站在窗的右半邊：泡泡改成往左長，尾巴跟著換到右邊指他。
   哪一邊是量出來的（見 61-scene.js 的 say），不是猜的。 */
.hero-tag.os.os-l{left:auto;right:0}
.hero-tag.os.os-l::after{left:auto;right:29px}

/* ── 回報第一問：每一件實際花了幾天 ──
   兩個數字並排：他當初說的（灰、不能動）跟他現在報的（金、加減鍵）。
   並排是重點——這個作品在練的就是那兩個數字之間的距離。 */
.splist{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.sp2{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  background:rgba(0,0,0,.34);box-shadow:inset 0 2px 0 rgba(0,0,0,.4)
}
.sp2 b{flex:0 0 11px;height:22px;display:block}
.sp2 i{flex:1;font-style:normal;font-size:22px;color:var(--ink);
  overflow-wrap:anywhere;min-width:0}
.sp2 u{text-decoration:none;font-size:22px;font-variant-numeric:tabular-nums}
/* 2026-09-23 踩過：「說 N」本來就窄到剛好，後來為了小時／週承諾
   多印一個單位字（「說 8 小時」），固定 66px 塞不下，手機上會被擠到
   換行、疊到旁邊的加減鍵上。改成看內容自己撐寬（white-space 不准換
   行），旁邊那一件的名字（.sp2 i，本來就 min-width:0）讓出空間。 */
.sp2 u.said{flex:0 0 auto;min-width:44px;white-space:nowrap;
  text-align:right;color:var(--mute)}
.sp2 u.got{flex:0 0 44px;text-align:center;color:var(--gold)}
.sp2 .pd{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;
  font-size:22px;line-height:1;color:#1A1408;background:var(--gold);
  box-shadow:2px 2px 0 rgba(0,0,0,.6)
}
.sp2 .pd:hover{background:var(--gold2)}
.sp2 .pd:active{transform:translate(2px,2px);box-shadow:none}

/* ── 回報第二問：順／普通／不順 ──
   三顆一樣大。沒有一顆長得比較「對」——選不順不會有任何後果。 */
.feels{display:flex;gap:8px;margin:0 0 14px}
.fl{
  flex:1;height:66px;border:0;cursor:pointer;font:inherit;font-size:22px;
  color:var(--ink);background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--line)
}
.fl:hover{background:var(--panel2)}
.fl:active{transform:translateY(2px)}
.fl.on{color:#1A1408;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold2)}

/* 老師那一頁上，那三樣是唯讀的：不能按，只是看。 */
.feels.one{max-width:132px}
.feels.one .fl{cursor:default}
.sp2 u.got.over{color:var(--over)}

/* ══════════ 講話的畫面 ══════════

   上面那一套是寶可夢的對峙：他站右上、你站左下（背影）、
   兩張名牌在對角、底下字幕框、右邊選單。那個排法在說
   「兩邊要分勝負」——而這裡發生的事是你把東西交給他，他收下。

   近幾年的 RPG 講話畫面共通的四件事，這裡都照做：

     一 · 場上只有說話的那一個。你是鏡頭。
     二 · 名牌長在對話框上，斜切一角，不是漂在場景角落。
     三 · 對話框整寬，箭頭在右下角閃。
     四 · 選項排在框底下。

   舊的那一套沒有刪掉：.bt 本體、名牌、站台、閃場都還在，
   .talk 只是把它們重排。 */

/* 跟廊道一模一樣大。

   本來兩格是各自訂的：廊道 396 / 319 / 462（斷點 860、1200），
   對話 286 / 242 / 198（斷點 899、520）。按下「交作業」的那一刻
   場景會縮掉 110px，而那兩格演的是同一件事的前後兩秒——他站在
   路的另一端，你走過去。中間不該有一次跳動。

   斷點也跟著廊道走（860、1200），不然中間那一段寬度會各縮各的。
   數字要改的話兩邊一起改，見 59-mobile.css 的 .scn。 */
.bt.talk{height:396px}
/* 你不在場上了——你是鏡頭。 */
.bt.talk .bt-side.me{display:none}
/* 他一個人站中間。

   本來用 flex 靠底置中，而那樣他的腳會伸出場景 33px 被切掉
   （.bt 是 overflow:hidden）。兩件事疊在一起：.bt-ch 是 block、
   裡面那張圖是 inline-block，行框比圖高 13px；而 .bt-side 是
   絕對定位又寫死高度，padding 等於又吃掉一次。

   改成直接釘在底部，高度自己說了算。置中用 margin-left 不用
   transform：.bt-ch 身上有 btbob 在動 transform，兩個會打架。 */
.bt.talk .bt-side.foe{top:0;height:100%;padding:0}
.bt.talk .bt-side.foe .bt-ch{
  position:absolute;left:50%;margin-left:-132px;right:auto;bottom:44px;
  line-height:0
}
.bt.talk .bt-side.foe .bt-pad{
  left:50%;right:auto;margin-left:-110px;bottom:36px;width:220px
}
/* 講話的時候他是這一格的主角，所以比對峙的時候大一階。 */
.bt.talk .bt-px{width:264px;height:176px}

/* 右上角一行：你說了幾天。本來這是你那張名牌上的字，
   而那是你身上帶著的東西，不是他名牌上該有的。 */
.bt-hud{
  position:absolute;right:16px;top:16px;z-index:4;
  padding:4px 11px;font-size:22px;line-height:33px;color:var(--dim);
  background:rgba(0,0,0,.42);
  box-shadow:inset 0 0 0 2px rgba(255,240,214,.14);
  font-variant-numeric:tabular-nums
}

/* 名牌長在對話框的左上角，斜切一角。 */
.bt-say{position:relative}
.bt-name{
  position:absolute;left:0;top:-33px;z-index:3;
  padding:0 22px 0 11px;
  font-size:22px;line-height:33px;color:#0F0C08;
  background:var(--gold);
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)
}
/* 老師為什麼退回。接在對話框底下，不在框裡——框裡是委託人說的話，
   這一句是老師說的，兩個人不能共用一個框。 */
.bt-rej{
  margin:11px 0 0;padding:11px 0 11px 14px;
  font-size:22px;line-height:33px;color:var(--ink);
  box-shadow:inset 3px 0 0 var(--over)
}
.bt-rej b{display:block;font-size:22px;font-weight:400;color:var(--over)}

/* 上一趟那一句：一顆可以點的，不是預填好的值。 */
.lastw{
  display:block;margin:5px 0 0;padding:5px 11px;
  font:inherit;font-size:22px;line-height:33px;
  color:var(--dim);background:var(--sunk);border:0;cursor:pointer;
  text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;box-shadow:inset 0 0 0 2px var(--line)
}
.lastw:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line2)}

.bt-bottom.talk{display:block}
.bt-bottom.talk .bt-say{margin:33px 0 11px}
/* 選項排在框底下，一排靠左。 */
.bt-bottom.talk .bt-menu{
  display:none;background:none;padding:0;box-shadow:none
}
.bt-bottom.talk.ready .bt-menu{display:block}
.bt-bottom.talk .bm{
  width:auto;display:inline-block;margin:0 22px 0 0;
  padding:3px 14px 3px 11px
}

@media (max-width:899px){
  /* 高度不在這裡——它跟著廊道的斷點（860），寫在底下。 */
  .bt.talk .bt-px{width:198px;height:132px}
  .bt.talk .bt-side.foe .bt-ch{margin-left:-99px;bottom:36px}
  .bt.talk .bt-side.foe .bt-pad{margin-left:-83px;width:165px;bottom:28px}
}
@media (max-width:520px){
  /* 這裡只縮他，不縮場景——廊道到最窄也還是 319，
     多出來的那一段是他頭上的空間，跟廊道上一樣。 */
  .bt.talk .bt-px{width:154px;height:103px}
  .bt.talk .bt-side.foe .bt-ch{margin-left:-77px;bottom:29px}
  .bt.talk .bt-side.foe .bt-pad{margin-left:-66px;width:132px;bottom:21px}
}

/* 廊道的兩個斷點。順序要在上面那兩塊之後，後面的才蓋得掉前面的。 */
@media (max-width:860px){ .bt.talk{height:319px} }
@media (min-width:1200px){ .bt.talk{height:462px} }

/* 接委託那一場用同一個名牌（見 57-viz.css 的 .pmt）。 */
.pmt-say{margin-top:33px}

/* 他不收的時候，那一句是紅的一階（--over 是這個作品裡「超過了」
   的顏色，不是錯誤的顏色）。他在陳述少了什麼，不是在罵人。 */
.bt-say.no b{color:var(--over)}

/* 名牌搬到對話框上之後，這兩條原本掛在 .bt-plate 上的收尾就對不到
   任何東西了——它們不會報錯，只是那兩下不再發生：
   報出天數的時候名牌閃一下、他收下之後名牌暗一階。

   接回 .bt-name。 */
.bt.told ~ .bt-bottom .bt-name{animation:bttold .4s steps(2,end) 1}
.bt.foe-out ~ .bt-bottom .bt-name{opacity:.55}
@media (prefers-reduced-motion: reduce){
  .bt.told ~ .bt-bottom .bt-name{animation:none}
}

/* 他寫好了，但你還沒——看得到有這一行，看不到內容。
   不是鎖，是順序：同時出牌，然後一起翻。 */
.sd-hid{color:var(--mute);letter-spacing:.14em}

/* 一頁一題：還有幾題。一排點，不是「3 / 7」——
   那是一個要讀的東西，而這裡只需要知道還有幾個。 */
.bt-dots{display:flex;gap:5px;margin:0 0 14px}
.bt-dots i{
  width:11px;height:11px;display:block;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.34)
}
.bt-dots i.done{background:var(--gold-d)}
.bt-dots i.on{background:var(--gold)}

/* ---------- 這一格是誰寫的 ----------

   固定在題目跟答案中間那一行（見 67-battle.js 的 whoTag）。

   22px 是這個作品的字級下限——這一句不是註腳，它決定他等一下寫的
   東西是給誰的。左邊那一條線是唯一的區別：全組那一種是暗的，
   自己那一種亮起來。沒有用顏色，因為一個顏色一件事。 */
.wtag{
  font-size:22px;line-height:1.5;color:var(--mute);
  border-left:3px solid var(--mute);padding-left:11px;
  margin:0 0 11px
}
.wtag.one{color:var(--ink);border-left-color:var(--ink)}
/* 兩行連著的時候（承諾那一頁的拆件卡）不要各自空一行——
   它們是同一件事的兩半。 */
.wtag + .wtag{margin-top:-6px}
/* 後面那半句是補充，自己一行。

   本來是接在同一行後面、靠 margin-left 隔開。可是全組那一種本身就是
   --mute，補充也是 --mute——同色又同一行，讀起來會黏成一句：
   「全組一份誰交出去就是誰寫的那一份」。

   而這裡沒有更暗的一階可以退（--mute 已經是三階裡最暗的），
   所以改用換行分開。不用顏色，一個顏色一件事。 */
.wtag span{display:block;color:var(--mute);margin-top:5px}

/* ---------- 排行榜 ----------
   刻意加進來、而且準備好隨時拿掉的（見 68-rank.js 的說明）。

   畫法上守一條：條越短越準。這跟一般排行榜相反——
   一般是條越長越好，那會讓人想把條拉長；這裡想拉的是「拉短」，
   而拉短的唯一方法是估得準一點。 */
.rk-list{display:flex;flex-direction:column}
.rk-r{
  display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:2px solid rgba(0,0,0,.16)
}
.rk-r:last-child{border-bottom:0}
.rk-i{
  flex:0 0 22px;font-size:22px;font-style:normal;line-height:22px;
  color:var(--mute);text-align:center;font-variant-numeric:tabular-nums
}
.rk-r b{flex:0 0 66px;font-size:22px;font-weight:400;color:var(--ink)}
.rk-bar{flex:1;height:11px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4);min-width:44px}
.rk-bar u{display:block;height:100%;background:var(--gold);text-decoration:none}
.rk-d{flex:0 0 auto;font-size:22px;color:var(--dim);
  font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
/* 收下幾件與水晶：靠最右邊，窄的時候整個掉到第二行。
   它不決定順序，所以掉下去不影響這一列在說什麼。 */
.rk-r{flex-wrap:wrap}
.ck-c{margin-left:auto;font-size:22px;color:var(--mute);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* 自己那一列標出來，但不放大——放大就變成「看我」。 */
.rk-r.mine .rk-i{color:var(--gold)}
.rk-r.mine b{color:var(--gold)}
.rk-r.mine .rk-bar u{background:var(--gold2)}
.rk-r.none{opacity:.5}
.rk-r.none .rk-d{flex:1;text-align:left}

/* 出口一直在。自主性優先於排名。 */
.rk-out{
  margin-top:14px;padding:5px 11px;font:inherit;font-size:22px;cursor:pointer;
  color:var(--dim);background:none;border:none;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)
}
.rk-out:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold-d)}

/* 一行標題，不是眉標加一句。 */
.rk-h{font-size:33px;margin:0 0 14px}

/* 自己那一列整條墊底色。本來只換文字顏色——在一排一樣的列裡認不出來，
   而「我在哪一列」是這張榜上唯一非看不可的事。 */
.rk-r.mine{
  background:rgba(233,179,65,.10);
  box-shadow:inset 3px 0 0 var(--gold);
  padding-left:9px;margin-left:-9px
}

/* 手機。

   之前這裡只有一條「.side{display:none}」——側欄在窄螢幕整個消失，
   而導覽全部在側欄裡。也就是說手機打開之後按不到任何一頁。
   那不是版面問題，那是功能不見了。

   做法不是另寫一套版面，是讓同一段 HTML 換一個排法：側欄從左邊那一條
   變成釘在底部的一列。兩邊的資訊、順序、狀態完全一樣，
   只有方向不同——這樣兩個平台不會各自長出自己的邏輯。 */

@media (max-width: 860px) {

  /* ---------- 導覽：左邊那一條變成底下那一列 ---------- */
  .side{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;
    width:auto;flex:none;height:auto;overflow:visible;
    flex-direction:row;
    border-right:none;
    box-shadow:0 -3px 0 rgba(0,0,0,.72), 0 -4px 0 rgba(255,240,214,.05)
  }
  /* ── 特異度：這一條要贏得過 57-viz.css 的 button.side-head ──

     2026-09-10 量到：手機上那塊組別標題根本沒有被藏起來。它佔掉 522/630px，
     把導覽擠成 108px——「班級地下城」被壓成一個字一行、七行高，整條底列
     變成 190px，而版面只留了 121px，所以蓋掉內容 69px。

     原因是側欄那一格改成一顆鍵的時候，57-viz.css 寫了 button.side-head
     { display:block }（特異度 0,1,1）。**media query 不加特異度**，所以這裡
     的 .side-head（0,1,0）永遠贏不了它——兩條規則互相取消，而畫面上看起來
     只是「手機版怪怪的」。

     用 .side .side-head（0,2,0）壓過去，而且不寫死 button：研究者那一格
     以後如果不是按鈕，這一條照樣有效。 */
  .side .side-head{display:none}
  .nav{display:flex;flex-direction:row;padding:0;width:100%}
  .nav a{
    flex:1;min-width:0;flex-direction:column;justify-content:center;
    gap:5px;padding:11px 6px;font-size:22px;text-align:center;line-height:1.3;
    border-left:none;border-top:3px solid transparent
  }
  .nav a.on{border-top-color:var(--gold);background:var(--panel2)}
  .nav a .dot{width:8px;height:8px;flex:0 0 8px}
  /* 結案：窄一點、靠右、左邊一條線隔開，不跟前三格擠成一樣寬。 */
  .nav a.low{flex:0 0 auto;margin-top:0;border-top:3px solid transparent;border-left:1px solid var(--line);padding:11px 14px;opacity:.85}

  /* 底下那一列會蓋住內容，把位置留出來 */
  /* 22px 的字貼螢幕邊要留 22px，不然每一行都像被切到。 */
  .wrap{padding:22px 22px 121px}
  /* 剖面圖跟著內距走，兩邊貼到底（見 54-eco.css）。 */
  .xsec-wrap{margin-left:-22px;margin-right:-22px}
  .gate .gate-box{padding-bottom:0}

  /* ---------- 字級 ---------- */
  h1{font-size:33px}
  h2{font-size:22px}
  .lead{font-size:22px}
  .stamp-card h1{font-size:33px}
  .stamp-mark .px{width:44px}
  .big-num,.slider-read b{font-size:44px}
  .dash h1{font-size:33px}

  /* ---------- 按鈕：一顆一行，不要擠成兩個字一行 ---------- */
  .btn{font-size:22px;padding:14px 18px}
  .btn.big{font-size:22px;padding:16px 22px;width:100%}
  .row{gap:8px}
  .row .btn{flex:1 1 auto;min-width:132px}

  /* ---------- 輸入 ---------- */
  input,textarea,select{font-size:22px}
  .rn-row{flex-direction:column;align-items:stretch}
  .rn-row b{flex:none}
  .rn-row input{min-width:0;width:100%}
  .rn-row .btn{width:100%}

  /* ---------- 頂條與試用列 ---------- */
  .top{padding:11px 18px;gap:14px}
  .top .who{font-size:22px}
  .demo{padding:11px 18px;gap:14px}

  /* ---------- 四拍：兩個一排 ----------
     22px 的字四格排一列是 452px，手機只有 353px，所以本來是橫向捲的
     ——而捲出去的那兩拍等於不存在。折成兩排，四拍一眼看得完。 */
  .cyc{flex-wrap:wrap;gap:9px}
  .cy{flex:1 1 calc(50% - 22px);padding:9px 11px;justify-content:center}
  .cyd{display:none}

  /* ---------- 步驟條：兩個一排 ---------- */
  .step{min-width:calc(50% - 1px);border-right:1px solid var(--line)}
  .step i{font-size:22px}

  /* ---------- 廊道 ---------- */
  .scn,.scn-in{height:319px}
  .scn-hud{padding:9px 11px}
  .scn-hud em{font-size:22px}
  .scn-hud b{font-size:22px}
  .scn-hud .zn-note{display:none}
  .scn-cap{margin-top:0}

  /* ---------- 兩條尺 ---------- */
  .eb-r b{flex:0 0 33px}
  .eb{height:18px}

  /* ---------- 清單與標記 ---------- */
  .ac{font-size:22px;padding:11px 13px}

  /* ---------- 卡片與清單類 ---------- */
  /* 桌機是 22px。手機的字一樣大，沒有理由把內距收小——
     本來收成 14px 是字還 11px 的時候訂的。 */
  .card,.act-card{padding:22px}
  .gcard,.slot{width:100%}
  .zn{min-width:calc(50% - 6px)}
  .acc-c{padding:14px}
  .acc-c i{font-size:33px}

  /* ---------- 班級地下城 ---------- */
  .fa-in{gap:14px}
  .px.fa-px{width:66px;height:66px;flex:0 0 66px}
  .fa-in > div{min-width:0}
  .lg{gap:8px 14px}

  /* ---------- 故事那一張地圖 ---------- */
  .sty-map{flex-direction:column}
  .sty-rooms{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}
  .sty-room:nth-child(3n)::after{display:block}
  .sty-room:nth-child(2n)::after{display:none}
  .sty-door{
    flex:none;flex-direction:row;gap:14px;padding:11px;
    box-shadow:inset 0 3px 0 #000
  }
  .sty-door i{width:66px;height:44px}
}

/* 很窄的手機（400 以下）。

   本來這一段是「再收一階」：邊距收到 11px、分頁的左右內距收到 1px、
   h1 收到 22px。那三個都是字還 11px 的時候訂的——現在字一樣大，
   收下去只會更擠，而 h1 跟內文一樣大就等於沒有階層。

   窄螢幕該收的是「一排放幾個」，不是「留多少空氣」。 */
@media (max-width: 400px) {
  .wrap{padding:22px 18px 121px}
  .xsec-wrap{margin-left:-18px;margin-right:-18px}
  .step{min-width:100%;border-right:1px solid var(--line)}
  .nav a{padding:11px 4px}
  .zn{min-width:100%}
}

/* 觸控：hover 不存在，所以「滑過去才看得到」的東西要一直看得到 */
@media (hover: none) {
  .xs-fauna{opacity:.6}
  .btn:hover{background-image:none}
}

/* 上面那一段只換了排法，沒有換 display——50-style.css 曾經在這個寬度
   把側欄整個藏起來。那條已經拿掉了，這裡再寫一次當保險：
   導覽在任何寬度都必須在。 */
@media (max-width: 860px) {
  .side{display:flex !important}
  /* 試用列在手機會排到三行，收成一行——但只擋外層不夠：
     nowrap 不擋每一格自己內部的字還是會被壓窄，一擠就逐字斷行，
     「切換身分」變成直的。每一格自己也要 flex:none + nowrap，
     擠不下的話是整列橫向捲，不是文字直著斷。 */
  .demo{font-size:22px;flex-wrap:nowrap;overflow-x:auto}
  .demo b,.demo span,.demo a{flex:0 0 auto;white-space:nowrap}
  .demo select{max-width:132px;flex:0 1 132px}
}



/* ---------- 寬螢幕：整個螢幕都用上 ----------

   桌機本來跟手機是同一條窄欄，只是置中——一台 27 吋螢幕上，
   兩側各空一大片，而中間那條還在往下捲。

   做法不改 HTML：把 .wrap 變成會換行的排版，
   廊道與「今天要做的」佔滿一整列（它們本來就該大），
   其餘那幾張安靜的卡並排流下去。這樣同一份結構在兩種螢幕上
   讀起來一樣，只是攤開的方式不同。 */

/* ---------- 寬螢幕：整個螢幕都用上 ----------

   桌機本來跟手機是同一條窄欄，只是置中——一台 27 吋螢幕上，
   兩側各空一大片，而中間那條還在往下捲。

   做法不改 HTML：把 .wrap 變成會換行的排版。

   一個教訓寫在這裡：第一版是白名單制（只有列進去的元素給整列寬），
   結果後來每加一個新元素就少列一個，那幾個就縮成畫面上一小塊，
   看起來像整個版面壞掉。改成預設整列、只有指定的才並排——
   新加的東西不會再無聲地跑掉。 */

@media (min-width: 1200px) {
  .wrap{
    display:flex;flex-wrap:wrap;align-items:flex-start;
    gap:22px;align-content:flex-start
  }
  /* 預設整列。任何新加的東西都吃這一條。 */
  .wrap > *{flex:0 0 100%;margin-bottom:0;min-width:0}

  /* 剖面圖要兩邊貼到底。上面那一條把基準寬度釘在內容框上，
     所以 54-eco.css 裡那個負的外距只會把它往左推，不會讓它變寬。
     基準加上左右內距的和（44×2），兩邊才真的貼齊。 */
  .wrap > .xsec-wrap{flex:0 0 calc(100% + 88px)}

  /* 只有安靜的卡並排。420 是一張卡讀起來還舒服的最小寬度。 */
  .wrap > .card.quiet{flex:1 1 420px}
  .wrap > .row{margin:0}
  .wrap > .btn{flex:0 0 auto}

  /* 廊道與地圖越寬越好——那是它們本來就想要的 */
  .scn{height:462px}
  .scn-in{height:462px}
}

@media (min-width: 1700px) {
  .wrap{max-width:1760px}
  .wrap > .card.quiet{flex:1 1 480px}
}


/* ── 要做的那一件事，釘在畫面下面 ──
   地圖變成首頁之後它本來被推到整頁最底下，那樣就得先捲過整張圖才按得到。
   看地圖跟動手不是先後關係——PaGamO 打開來就能動手。 */
/* 要做的那一件事。接在廊道下面，不再釘在畫面底部——
   釘住是為了解決「動作在摺線以下」，而它現在就在廊道下面。
   一個釘在底部的東西擺在別的內容上面，只會蓋住它們。 */
.dock{
  margin:0 0 22px;background:var(--bg);
  box-shadow:inset 0 3px 0 rgba(255,240,214,.10)
}
.dock .tline{margin:0}
.dock .act-card{margin:0}



/* 老師那一頁的任務列，窄螢幕會被撐出去。

   .msr 是三欄（1fr auto auto），而 .msr-n（「4 承諾　1 走完」）是 nowrap
   而且自動排在第一欄——所以它把第一欄撐到 160px。三欄加起來 315px，
   硬塞進 240px 的列裡，整頁被撐寬 35px（320 寬量到的）。

   窄的時候讓任務名跟那一行數字各自佔滿一整列，剩下兩小格併排。 */
@media (max-width: 700px){
  .msr{grid-template-columns:auto auto 1fr}
  .msr > b{grid-column:1 / -1}
  .msr-n{grid-column:1 / -1}
}

/* 拆件那一列在很窄的螢幕塞不下。

   一列上有六樣：顏色、名字、負責人、−、天數、＋、×。加上負責人那一顆
   之後，320 寬量到刪除鍵被擠出去 18px。

   窄的時候讓它折行：名字自己一行，控制項排在下面。名字是那一列的身分，
   它不該為了擠下按鈕而被壓成一個字寬。 */
@media (max-width: 420px){
  .pl{flex-wrap:wrap}
  .pl i{flex:1 1 100%;order:-1}
  .pl .pw{margin-left:19px}
}

/* 同一個問題出現在交作業／老師審核那一列（.sp2）：一列擠著顏色、
   標籤、誰報的、說幾件、收了幾件。誰報的／說幾件／收了幾件三格
   都是固定寬度，窄螢幕一擠，標籤——那一列裡唯一在講「做了什麼」
   的字——被壓到只剩兩三個字寬，逐字斷成三行。跟 .pl 同一個做法：
   標籤自己一整行，數字那三格折到下面。 */
@media (max-width: 420px){
  .sp2{flex-wrap:wrap}
  .sp2 i{flex:1 1 100%;order:-1;margin-bottom:2px}
}

/* mode：'walk' 前進、'rest' 休息、'over' 過了自己說的那幾天。
   收布林是舊的呼叫方式，留著。 */
function heroLine(u, mode) {
  var k = heroKey(u);
  if (mode === true) mode = 'walk';
  else if (mode === false || !mode) mode = 'rest';
  var box = HERO_OS[k] || HERO_OS.adv;
  var a = box[mode] || box.walk || [];
  if (a.length < 2) return a[0] || '';
  var s = '';
  for (var i = 0; i < 8; i++) {
    s = a[Math.floor(Math.random() * a.length)];
    if (s !== OS_LAST) break;
  }
  OS_LAST = s;
  return s;
}

  root: ['shroom', 'shroom', 'rubble', '', '', '', ''],

function propFor(seed, i, zoneKey) {
  var set = ZONE_PROPS[zoneKey] || ZONE_PROPS.wild;
  return set[hash(seed + '#' + i) % set.length];

/* 鐘乳石掛在哪、哪一根。同樣是算出來的。 */
function dripFor(seed, i) {
  var h = hash(seed + '@' + i);
  if (h % 100 < 42) return null;
  return { px: (h % 2 ? DRIP.a : DRIP.b), off: (h >>> 4) % 22 };
}

/* ---------- 一層的人用這一層的顏色 ----------

   pal 本來只有三個鍵：本體、陰影、反光。委託人因此只能是一團
   有邊有反光的色塊——而一個角色有十幾個色區（見 12-heroes.js：
   輪廓、皮膚、皮膚的陰影、袍子、袍子受光、腰帶、法杖、杖頂那一顆）。
   「一個 16×16 的人要看得出是誰，靠的不是解析度」，靠的是色區。

   spal 本來就是一條從最暗到最亮的十一階，而且每一層自己一條。
   把它併進 pal，委託人就能用 k 描邊、f/g 畫暗面、h/i 畫受光、
   j 點高光、c 挖凹處——跟角色同一種畫法，而且換一層就換一種顏色。

   只補沒有的鍵：#、o、* 三個維持原樣，所有舊的圖一格都不會變。 */
/* ── 不隨層改變的三種材質 ──

   色階解決了明暗，但一整個人還是同一種東西做的。角色不是這樣：
   法師身上有皮膚、布、木頭的杖、杖頂那一顆會亮的珠子——四種材質，
   所以看得出哪一塊是他、哪一塊是他帶著的。

   身體歸這一層（換一層就換一種顏色），帶著的東西歸材質（永遠一樣）。
   金屬在哪一層都是金屬，火在哪一層都是暖的——那正是它們看起來
   「不是這個洞長出來的」的原因。 */
var PAT_MAT = {
  n: '#2A2620', N: '#8C8478',   /* 金屬：暗面、受光 */
  w: '#5A564C', W: '#CFC9B8',   /* 骨與白：暗面、受光 */
  y: '#9A6A1E', Y: '#F5CB74'    /* 光：火、燈、亮著的芯 */
};
STRATA.forEach(function (z) {
  Object.keys(z.spal).forEach(function (t) {
    if (z.pal[t] === undefined) z.pal[t] = z.spal[t];
  });
  Object.keys(PAT_MAT).forEach(function (t) {
    if (z.pal[t] === undefined) z.pal[t] = PAT_MAT[t];
  });
});

/* ---------- 無盡輪迴 ----------

   六層走完會回到第一層，順序是隨機給的，而且一直循環。

   隨機有兩個理由，第二個才是真正的：

   一 · 被困在裡面。往下走不出去，深度因此徹底不是進度，也不是出口。
   二 · 這個系統要在專案進行到一半的時候也能開始用。固定的路線等於
        「你從第一層開始」，那預設了使用者的專案剛起步。隨機給就沒有
        這個預設——你在哪一層醒來只是你在哪一層醒來。

   隨機但不是每次重畫都不一樣：用組別算，同一組同一個深度永遠同一層。
   會亂跳的東西不是地下城，是特效。

   代價是全班那張剖面圖不再有共通的地層帶。那是對的——同樣 160 公尺，
   兩組看到的東西不一樣，就沒得比。 */
/* 一層待幾個任務。本來是 2——六層一圈就要 12 趟，而一學期大約 8 趟，
   所以「走完六層回到第一層」那件事沒有人遇得到。改成 1：六趟一圈，
   第 7 趟回到第一層，那時候他會走進自己第 1 趟留下的記號旁邊。 */
var ZONE_SPAN = 1;
var CYCLE = ZONE_SPAN * STRATA.length;

/* 順序是一個班洗一次，班內共用。

   本來是一組洗一次。那樣殺得掉比較（同樣 160 公尺，兩組看到的不一樣），
   但也殺掉了關聯性：同班的人不再站在同一片地質上，
   「我們在同一個地方」就沒了。

   改成一個班一份：你們班的地下城長什麼樣是你們班的，跟隔壁班不一樣；
   班內同一個深度看到的是同一種水晶。而順序本身是隨機的，
   所以它不代表任何進度——第三層不比第一層「後面」。 */
function routeOf(classId) {
  var idx = [], i;
  for (i = 0; i < STRATA.length; i++) idx.push(i);
  var h = hash('route|' + (classId || ''));
  for (i = idx.length - 1; i > 0; i--) {
    h = (h * 1103515245 + 12345) >>> 0;
    var j = h % (i + 1), t = idx[i];
    idx[i] = idx[j]; idx[j] = t;
  }
  return idx;
}

/* 這個深度是哪一層。第二個參數收組別或班級都可以——
   收到組別就換成它的班，這樣呼叫端不用每一處都改。 */
function strataAt(depth, who) {
  var t = who ? teamOf(who) : null;
  var cid = t ? t.classId : (who || '');
  var r = routeOf(cid);
  var n = Math.floor((Number(depth) || 0) / ZONE_SPAN);
  return STRATA[r[((n % r.length) + r.length) % r.length]];
}

/* 第幾圈。走完六層算一圈。 */
function cycleAt(depth) {
  return Math.floor((Number(depth) || 0) / CYCLE);
}

/* untilNextZone 拿掉了：一層一趟之後它永遠回 1，而且沒有人用它。 */

/* 一層裡住著哪些東西。

   PACK.creatures 的 r 欄位就是原本那四層的名字，新的兩層在 14-fauna.js。
   兩邊一起找——生態系不用另外編，牠們本來就分在各層裡。
   擋在你廊道盡頭的那一隻，就是從這裡挑出來的（見 mobFor）。 */
function allFauna() {
  return PACK.creatures.concat(typeof EXTRA_FAUNA === 'undefined' ? [] : EXTRA_FAUNA);
}

function faunaOf(key) {
  var s = null;
  for (var i = 0; i < STRATA.length; i++) if (STRATA[i].key === key) s = STRATA[i];
  if (!s) return [];
  return allFauna().filter(function (c) { return c.r === s.name; });
}

/* 這一層的第 n 隻。用層與序號算，不擲骰子——
   每次打開，同一隻都在同一個地方，那張剖面圖才是一個地方。 */
function faunaAt(key, n) {
  var f = faunaOf(key);
  if (!f.length) return null;
  return f[hash(key + '~' + n) % f.length];
}

/* 名字找生物。點開剖面圖上那一隻的時候用。 */
function faunaByName(n) {
  var all = allFauna();
  for (var i = 0; i < all.length; i++) if (all[i].n === n) return all[i];
  return null;
}

/* 擋在廊道盡頭的那一隻。

   這裡本來是從全部四十隻裡挑，跟你在多深的地方無關——那條線是斷的。
   現在牠來自你所在那一層的住民：走到 160 公尺，擋你的就是住在水晶
   迴廊的東西。生物跟系統的連接就是這一條，而且是雙向的——
   你在剖面圖的岩壁上看到的那幾隻，就是你下一趟可能遇到的那幾隻。

   哪一隻仍然是任務 ＋ 組算出來的，所以全班同一個任務不是同一隻。 */
/* 第三個參數是「那一趟在哪一層」。不給就是現在這一層（還在走的那一趟）。

   本來沒有這個參數，於是每一趟都在**現在**這一層裡挑：一條帶子上
   八格全部從同四隻裡挑，撞在一起是常態；而且一趟走完之後牠還會
   跟著你變深而改變——那一趟盡頭擋路的那一隻不該在事後被換掉。 */
/* 擋在盡頭的那一隻。從那一趟的地方來——他選了地方，
   就等於選了這一趟要遇到誰，而圖鑑記的就是遇過誰。 */
function mobFor(msId, teamId) {
  /* 由任務決定，不由地方決定——委託人是要這件事的人，
     任務出現的那一刻他就存在了，不是走到那一天才長出來。

     所以從全部的人裡面挑，不限那一區。他自己屬於哪一區
     （c.r）只決定他長什麼顏色、跟他排在圖鑑的哪一頁。 */
  var f = allFauna();
  return f[hash(msId + '|' + teamId) % f.length];
}

/* 委託人自己是哪一區的人。他的顏色照這個走，不照學生走到哪裡——
   換一個地方遇到他，他還是他。 */
function mobZone(c) {
  if (!c) return STRATA[0];
  for (var i = 0; i < STRATA.length; i++) if (STRATA[i].name === c.r) return STRATA[i];
  return STRATA[0];
}

/* ===== 15-auth.js ===== */
/* 帳號、登入、身分認領，以及研究紀錄的事件流。

   三種角色：
     student    學生。用加入碼註冊，然後從名冊裡認領自己是誰。
     teacher    老師。研究者建的。
     researcher 研究者。管帳號、看紀錄、匯出。

   密碼：這一版存在瀏覽器裡，所以雜湊只是「不要用明碼躺在 localStorage」，
   不是真的安全措施。真的上線要換成後端 ＋ bcrypt——這件事寫在這裡，
   免得有人以為它已經安全了。 */

/* 這句話印在建立帳號那一頁上，不藏起來（見 58-gate.js）。

   本來寫的是「這一版的密碼雜湊只擋肉眼，不是真的加密。上線前要換成
   後端驗證。」——誠實是對的，可是那是寫給工程師看的。讀它的是正在
   註冊的學生，他讀到的只有「這東西還沒做完」。

   同一件事講給他聽，而且給他唯一做得到的那件事：別重用密碼。
   誠實沒有少一分，多了一個他按得下去的動作。 */
var AUTH_NOTE = '這裡的密碼不是真的加密。別用你其他地方在用的密碼。';

/* 加鹽的字串雜湊。同一組帳密永遠得到同一個值。 */
function pwHash(pw, salt) {
  var s = String(salt) + '|' + String(pw);
  var h1 = 2166136261, h2 = 5381;
  for (var i = 0; i < s.length; i++) {
    h1 ^= s.charCodeAt(i); h1 = (h1 * 16777619) >>> 0;
    h2 = ((h2 * 33) ^ s.charCodeAt(i)) >>> 0;
  }
  return h1.toString(36) + h2.toString(36);
}

function newSalt() {
  return Math.floor(Math.random() * 2176782336).toString(36) + now().toString(36);
}

/* ---------- 事件流（研究紀錄） ----------
   每一個會改到資料的動作都記一筆。這就是研究資料本身：
   誰、在哪一個任務上、做了什麼、什麼時候。

   刻意不記「內容」——系統本來就不收作業。記的是行為的形狀：
   承諾幾天、推進的節奏、判定結果、卡在哪。 */
/* ---------- 示範那一邊的動作根本不記 ----------

   本來每一個 act* 都會寫一筆，不分是誰做的。所以在示範班上點來點去
   ——展示、測試、上課前試一次——全部變成研究資料，而且**會被推上雲**
   （Events 是 SYNC_UP_ONLY，只上去不下來，所以刪也刪不掉）。

   我在雲端量到的那 75 筆就是這樣來的。

   下游的篩子（eventsOf、rsUsers）擋得住畫面跟匯出，可是那是「記了
   再藏起來」。使用者要的是「不要被追蹤」——那就不該記。

   在源頭擋掉還多解決一件事：示範那一邊不再產生新的雲端垃圾。

   下游那幾道篩子留著：這台機器上可能還有以前記下來的舊事件，
   而且雲端那幾筆已經下不來也刪不掉了。 */
function evDemoSide(o) {
  var by = (typeof S !== 'undefined' && S.who) ? S.who : (o && o.by);
  if (by) { var u = userOf(by); if (u && u._d) return true; }
  if (o && o.teamId) {
    var t = teamOf(o.teamId);
    if (t && (t._d || (t.classId && (find('Classes', function (c) {
      return c.classId === t.classId; }) || {})._d))) return true;
  }
  if (o && o.classId) {
    var c = find('Classes', function (x) { return x.classId === o.classId; });
    if (c && c._d) return true;
  }
  return false;
}

function logEvent(kind, o) {
  if (!DB || !DB.Events) return;
  if (evDemoSide(o)) return;
  /* 登入與註冊那兩筆是在還沒有 S.who 的時候記的，所以要讓呼叫端
     自己帶 by 進來——不然研究資料裡最重要的兩個動作會沒有角色。 */
  var u = (typeof S !== 'undefined' && S.who) ? userOf(S.who) : null;
  if (!u && o && o.by) u = userOf(o.by);
  DB.Events.push(Object.assign({
    evId: nid('E'),
    at: now(),
    by: u ? u.userId : (o && o.by) || '',
    role: u ? u.role : '',
    kind: kind
  }, o || {}));
  /* 事件只增不刪。原型跑久了會長，但它就是資料本身。 */
}

function eventsOf(classId, filter) {
  var teamIds = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) { teamIds[t.teamId] = t.name; });
  /* ── 示範那一邊弄出來的不是研究資料 ──

     示範資料本身不寫事件（seed 不呼叫 logEvent），可是**在示範班上做的
     動作**會寫：登入、承諾、回報，那些都是執行時發生的，身上沒有 _d。

     底下那一條「掛在別班的隊上就不算」擋得掉一部分，可是擋不掉登入
     ——login 那一筆沒有 teamId，所以它從那個篩子直接穿過去，然後出現在
     研究者的紀錄裡跟匯出的流水帳裡。使用者：「我研究者端他會記錄
     模擬紀錄」。

     所以再看一次是誰做的：示範帳號做的一律不算。 */
  var 示隊 = {}, 示人 = {};
  (DB.Teams || []).forEach(function (t) { if (t && t._d) 示隊[t.teamId] = 1; });
  (DB.Users || []).forEach(function (u) { if (u && u._d) 示人[u.userId] = 1; });
  return DB.Events.filter(function (e) {
    if (e.teamId && 示隊[e.teamId]) return false;
    if (e.by && 示人[e.by]) return false;
    if (e.teamId && !teamIds[e.teamId]) return false;
    if (filter && filter.kind && e.kind !== filter.kind) return false;
    if (filter && filter.teamId && e.teamId !== filter.teamId) return false;
    return true;
  }).slice().reverse();
}

function evSay(e) {

/* ---------- 註冊 ---------- */

function accountTaken(account) {
  return !!find('Users', function (u) {
    return String(u.account).toLowerCase() === String(account).toLowerCase();
  });
}

function classByCode(code) {
  return find('Classes', function (c) {
    return String(c.joinCode).toUpperCase() === String(code || '').toUpperCase();
  });
}

/* 學生註冊：加入碼 → 帳號密碼。註冊完還沒有身分，要再認領。 */
function actRegister(o) {
  var acc = String(o.account || '').trim();
  var pw = String(o.password || '');
  /* 名字一定要。沒有的話底下那一行會拿帳號頂替，而那正是要修的東西：
     全站印的都是 u.name，學號當名字的話老師分不出誰是誰。 */
  var nm = String(o.name || '').trim();
  if (!nm) return { err: '先寫你的名字——同學跟老師看到的就是這個。' };
  if (acc.length < RULES.ACC_MIN) {
    return { err: '帳號至少 ' + RULES.ACC_MIN + ' 個字。' };
  }
  if (pw.length < RULES.PW_MIN) return { err: RULES.pwRule() };
  if (accountTaken(acc)) return { err: '這個帳號有人用了。' };

  /* 學生一定要有班級加入碼（老師唸給他們）。
     老師可以先開帳號、進來再開班——他是那個發碼的人，不該先跟人要碼。 */
  var kl = null;
  if (o.role === 'student') {
    kl = classByCode(o.code);
    if (!kl) return { err: '找不到這個加入碼。跟老師確認一次。' };
  } else if (o.code) {
    kl = classByCode(o.code);
    if (!kl) return { err: '找不到這個加入碼。' };
  }

  var salt = newSalt();
  /* 救援碼：註冊這一刻唯一給得出來的第二把鑰匙。跟密碼一樣只存雜湊，
     明碼只在這一次回傳裡出現，畫過一次就沒有地方再讀得到
     （見 58-gate.js 的 PAGES.rgcode）。 */
  var recov = newRecov();
  var rsalt = newSalt();
  var u = {
    userId: nid('U'), account: acc, salt: salt, hash: pwHash(pw, salt),
    recovSalt: rsalt, recovHash: pwHash(recov, rsalt),
    role: o.role || 'student',
    name: nm,
    /* classId／teamId 是「現在坐的那一個座位」，seats 才是全部
       （見 40-db.js 的座位那一段）。 */
    classId: '', teamId: '', seats: [],
    createdAt: now()
  };
  if (kl) addSeat(u, kl.classId, '');
  /* 有人自己建帳號了——這份資料不再是示範資料，
     之後改版也不會被洗掉（見 40-db.js 的 load）。 */
  if (DB.Config) DB.Config.demo = 0;
  DB.Users.push(u);
  save();
  logEvent('register', { by: u.userId, account: acc, role: u.role });
  /* ── 不分組那一站：一個人就是一組 ──

     這一站上沒有組隊這一步（RULES.SOLO，由 build.js 的站台表打開）。
     所以註冊完當場給他一支只有他自己的隊，隊名就是他的名字。

     ── 為什麼是「自動建一隊」不是「把組拿掉」 ──

     Runs、Pushes、Keeps、圖鑑、深度、水晶全部掛在 teamId 上（全站 239
     處）。真的把那個概念拿掉是重寫資料層，而「一個人一組」在資料上
     就已經是個人制——那條路整支驗過（見 solo.js）。

     差別只在畫面上：底下那幾條把「你的隊呢」「全組一份」「誰做哪一件」
     藏起來，因為那幾句話對一個人不成立。 */
  if (RULES.SOLO && u.role === 'student' && kl) actNewTeam(nm, u.userId);
  return { user: u, recov: recov };
}

/* 加進一個已經開好的班。

   一個班三位老師共同帶，所以第二、第三位要進的是同一個班，不是各自
   開一個。開下去他會拿到一個誰都不在裡面的空班——而空班長得跟正常的
   一模一樣（沒有組、沒有人在等他看），他不會發現自己走錯了，
   會以為是學生還沒註冊。

   ── 好幾個班 ──

   本來這一支只給老師，而且已經有班的人會被擋（「你已經在一個班裡了」）。
   那條規則假設一個人一輩子只在一個班裡，可是：

     學生修兩門都用這套　　設計專題 ＋ 互動設計
     老師帶兩班　　　　　　大四專題 ＋ 大三專題

   現在兩種身分都加得了，而且已經有班的人是**再加一個座位**，
   不是換掉原本那個（見 40-db.js 的 addSeat）。研究者不用——
   他本來就看得到每一個班。 */
function actJoinClass(userId, code) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個人。' };
  if (u.role === 'researcher') return { err: '研究者看得到每一個班，不用加入。' };
  var kl = classByCode(code);
  if (!kl) return { err: '找不到這個加入碼。跟開班的人確認一次。' };
  if (inClass(u, kl.classId)) return { err: '你已經在「' + kl.name + '」裡了。' };
  addSeat(u, kl.classId, '');
  save();
  logEvent('joinclass', { by: u.userId, klass: kl.name });
  return { klass: kl };
}

/* ---------- 登入 ---------- */
function actLogin(account, pw) {
  var u = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(account || '').trim().toLowerCase();
  });
  if (!u) return { err: '找不到這個帳號。' };
  /* 合併過的舊帳號：指一條路過去，不要讓他以為帳號壞了。
     見 actMergeAccount 跟 CLAUDE.md 2026-09-23 那一段。 */
  if (u.mergedInto) {
    var into = userOf(u.mergedInto);
    return { err: '這個帳號已經合併到「' + (into ? into.account : '另一個帳號') +
      '」了，用那一個登入。' };
  }
  /* 這一句本來寫「請研究者重設一次」。重設那一支在研究者變成唯讀的
     時候一起拿掉了（見底下那一段），話卻留著——它叫使用者去找一個
     做不到這件事的人。正常註冊一定會拿到 salt，所以踩得到這一條的
     只有舊資料。 */
  if (!u.salt) return { err: '這個帳號沒有密碼，登不進去。用新的帳號註冊一個。' };
  /* 忘記密碼的人打錯打好幾次看到的都是這一句。指一條路過去——
     登入頁下面那顆「忘記密碼」講的就是同一件事（見 58-gate.js
     的 PAGES.forgotpw）。 */
  if (pwHash(pw, u.salt) !== u.hash) return { err: '密碼不對。忘記的話，下面有一顆「忘記密碼」。' };
  u.lastLogin = now();
  /* 真的人登入 ＝ 這台機器不再只是拿來看示範的。

     本來只有 actRegister 關得掉這支旗標，所以「在電腦上註冊、在手機上
     登入」的人，手機那一台永遠是示範狀態（見 55-ui.js 的 demoBar）。

     示範帳號登入不算——那正是要留著示範模式的那一種。 */
  if (DB.Config && !u._d) DB.Config.demo = 0;
  save();
  logEvent('login', { by: u.userId });
  return { user: u };
}

/* ---------- 改自己的資料 ----------

   2026-09-09：加這一段之前，一個帳號建立之後就再也改不動了。

   名字打錯就錯著——而全站印的都是 u.name，老師端、榜、匯出看到的
   都是那一個字串。密碼打錯就是那個帳號再也進不去：註冊那一刻是
   唯一一次設定密碼的機會（見這個檔的 actRegister，密碼只在那裡
   被寫進去），重設那一支拿掉了，老師叫得到的只有 actAskEst 與
   actAskSkip。

   所以在此之前，這兩種錯的唯一出路都是**再註冊一個帳號**——而那條路
   每走一次就多一個 userId 指向同一個人：事件流被切成兩段，第一段在
   匯出裡看起來像「這個人第一週就放棄了」。那是研究資料裡的假訊號，
   而它是介面逼出來的，不是那個人做的事。

   ── 這裡加的是「本人自己改」，不是「有人改得動別人」 ──

   兩支都要 userId 才動得了，而換密碼一定要先打對現在那一個。沒有任何
   角色因此拿到改別人帳號的能力，研究者唯讀那條軸一個字都沒有被碰到
   （理由見 75-research.js 的檔頭：觀察者如果改得動被觀察對象，
   那份資料就沒辦法說「這些是他們自己做的」）。

   ── 帳號不給改 ──

   它是他登入時打的那一串，也是第一節課寫在紙上的那一串。改它救不了
   任何人——忘記密碼的人不會因為換一個帳號名就進得去，只會多一個
   對不上紙條的帳號。 */

function actSetName(userId, name) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個人。' };
  var nm = String(name || '').trim();
  /* 跟註冊同一句話。名字是空的的話，全站會退回拿帳號頂替。 */
  if (!nm) return { err: '先寫你的名字——同學跟老師看到的就是這個。' };
  if (nm === u.name) return { err: '跟原本一樣，沒有改到。' };
  var old = u.name;
  u.name = nm;
  /* ── 不分組那一站：隊名要跟著改 ──

     2026-09-09 量到的：B 站上（RULES.SOLO）一個人就是一組，那支隊是
     註冊那一刻用他的名字建的（見這個檔 actRegister 最後那一段）。而
     頂條跟側欄印的是**隊名**，不是 u.name——所以在那一站改完名字，
     畫面會回一句「改好了。」，然後他看得到的每一個地方還是舊的那個。

     主站沒有這件事：那邊的隊名是「第一組」，跟人名無關。

     只在隊名還等於舊名字的時候才跟著改。執行時 t.name 只有 actNewTeam
     寫得到，所以這個條件現在永遠成立——寫著是為了以後真的加了改隊名
     那條路的時候，不會把他自己取的那個名字蓋掉。 */
  if (RULES.SOLO && u.role === 'student' && u.teamId) {
    var solo = teamOf(u.teamId);
    if (solo && solo.name === old) solo.name = nm;
  }
  save();
  /* 改名字要記一筆：老師端、榜、匯出印的都是這個字串，所以
     「哪一天起這個人在畫面上叫別的名字」是讀資料的人需要知道的事。
     記的是名字本身，不是任何跟表現有關的東西。 */
  logEvent('setname', { by: u.userId, name: nm, from: old });
  return { user: u };
}

function actSetPw(userId, oldPw, pw) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個人。' };
  if (!u.salt) return { err: '這個帳號沒有密碼可以換。' };
  /* 一定要先打對現在那一個。這是這一版唯一驗得出「是不是本人」的
     方法——沒有後端、沒有信箱，帳號就在這台瀏覽器裡。 */
  if (pwHash(String(oldPw || ''), u.salt) !== u.hash) {
    return { err: '現在的密碼不對。' };
  }
  var np = String(pw || '');
  if (np.length < RULES.PW_MIN) return { err: RULES.pwRule() };
  if (pwHash(np, u.salt) === u.hash) return { err: '跟原本一樣，沒有改到。' };
  /* 換一組新的鹽，不是拿舊的再雜湊一次。 */
  var salt = newSalt();
  u.salt = salt;
  u.hash = pwHash(np, salt);
  save();
  /* 記「他換過」，**不記密碼也不記長度**。事件流會上雲，而那邊的規則
     是完全開放的（見 41-sync.js 的檔頭與 firestore.rules），所以這裡
     多寫一個欄位就等於把它放到一個只靠網址保護的地方。 */
  logEvent('setpw', { by: u.userId });
  return { user: u };
}

/* ---------- 研究者直接改任何人的密碼 ----------

   2026-09-23：CLAUDE.md 同一天記著這條例外——使用者本人明確要求
   打開的，不是踩坑踩出來的設計。跟救援碼不一樣：救援碼是「代發
   鑰匙，本人自己開鎖」，這一支是研究者直接設定新密碼，本人不用
   在場、也不用先打對舊密碼。

   只認 role==='researcher'。新密碼一樣不進事件流——記的是「誰
   幫誰換過」，不記新密碼本身，理由跟 actSetPw 一樣：事件流會上雲，
   那邊的規則是全開的。 */
function actResearcherSetPw(researcherId, account, pw) {
  var res = userOf(researcherId);
  if (!res || res.role !== 'researcher') return { err: '只有研究者用得了這個功能。' };
  var u = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(account || '').trim().toLowerCase();
  });
  if (!u) return { err: '找不到這個帳號。' };
  if (u.role === 'researcher') return { err: '研究者的帳號不能用這裡改。' };
  var np = String(pw || '');
  if (np.length < RULES.PW_MIN) return { err: RULES.pwRule() };
  var salt = newSalt();
  u.salt = salt;
  u.hash = pwHash(np, salt);
  save();
  logEvent('researchersetpw', { by: res.userId, account: u.account, forUser: u.userId });
  return { user: u };
}

/* ---------- 補發救援碼 ----------

   救援碼是這個功能上線那一刻才開始給的——在那之前註冊的帳號沒有
   recovHash。這一支讓已經登入、打得出現在密碼以外的人（也就是
   本人，正在用著這個帳號的人）自己補一組，不用重新註冊。

   同一支也拿來給已經有救援碼的人換一組新的——邏輯完全一樣，
   都是「本人現在就在這裡，給他一把新鑰匙」。 */
function actGenRecov(userId) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個人。' };
  var recov = newRecov();
  var rsalt = newSalt();
  u.recovSalt = rsalt;
  u.recovHash = pwHash(recov, rsalt);
  save();
  logEvent('genrecov', { by: u.userId });
  return { user: u, recov: recov };
}

/* ---------- 老師幫現場認出來的學生發一組救援碼 ----------

   2026-09-23：「只改得動自己的帳號」那條線上開的第一個、也是唯一
   一個例外（見 CLAUDE.md 同一天的那一段）。開的理由：已經卡住、
   從沒補發過救援碼的帳號，本人生不出那把鑰匙——不開這個例外，
   唯一的路是重新註冊，而那條路上星期真的把一個人的組別跟歷史
   紀錄弄斷過。

   這一支換的只有救援碼本身，不是密碼：老師發完碼，學生要自己
   拿那組碼去 actRecoverPw 設一個新密碼，設定過程老師不在場，
   也不會知道那個新密碼是什麼。老師手上唯一多出來的能力是
   「幫這個帳號補發一次救援碼」，不是「登入這個帳號」。

   只認自己班上的學生——老師不該碰得到別班的帳號。 */
function actTeacherRecov(teacherId, account) {
  var teacher = userOf(teacherId);
  if (!teacher || teacher.role !== 'teacher') return { err: '只有老師看得到這個功能。' };
  var u = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(account || '').trim().toLowerCase();
  });
  if (!u) return { err: '找不到這個帳號。' };
  if (u.role !== 'student') return { err: '這個功能只給學生用。' };
  /* 合併過的帳號沒有人登得進去，發救援碼給它沒有意義——
     見 actMergeAccount。畫面上的選人清單已經濾掉這種帳號，
     這裡是資料層再擋一次，不只靠畫面。 */
  if (u.mergedInto) return { err: '這個帳號已經合併過了，救援碼要發給接回去的那個帳號。' };
  var mine = seatsOf(teacher).map(function (s) { return s.classId; });
  if (mine.indexOf(u.classId) < 0) return { err: '這個帳號不在你的班上。' };
  var recov = newRecov();
  var rsalt = newSalt();
  u.recovSalt = rsalt;
  u.recovHash = pwHash(recov, rsalt);
  save();
  /* 記著是哪一位老師發的，不是只記「有人發過」——這是研究資料裡
     唯一一種「別人幫本人做了一件跟帳號有關的事」，要看得出是誰做的。 */
  logEvent('teacherrecov', { by: teacher.userId, account: u.account, forUser: u.userId });
  return { user: u, recov: recov };
}

/* ---------- 老師把重複註冊的兩個帳號接回同一個人 ----------

   2026-09-23：救援碼上線之前，忘記密碼唯一的路是重新註冊——已經有
   人這樣做過，現在同一個人手上有兩個帳號：舊帳號（oldAccount）有
   他之前的隊伍跟紀錄，新帳號（newAccount）是他現在登得進去、
   自己知道密碼的那一個。

   合併只動一件事：把新帳號在這個班的座位，換成舊帳號原本坐的
   那一個（同一組，同一份歷史）。密碼、名字、帳號本身都不動——
   新帳號還是他自己在用，只是從現在起坐回原本那一組。

   舊帳號不刪、salt／hash 也不動——那個 userId 底下每一筆歷史紀錄
   還在，事件流不能改也不用改。只標一個 mergedInto，讓 actLogin
   指一條路過去，不讓人以為舊帳號壞了。 */
function actMergeAccount(teacherId, oldAccount, newAccount) {
  var teacher = userOf(teacherId);
  if (!teacher || teacher.role !== 'teacher') return { err: '只有老師看得到這個功能。' };
  var oldU = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(oldAccount || '').trim().toLowerCase();
  });
  var newU = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(newAccount || '').trim().toLowerCase();
  });
  if (!oldU || !newU) return { err: '找不到這個帳號。' };
  if (oldU.userId === newU.userId) return { err: '這是同一個帳號。' };
  if (oldU.role !== 'student' || newU.role !== 'student') return { err: '這個功能只給學生用。' };
  var mine = seatsOf(teacher).map(function (s) { return s.classId; });
  if (mine.indexOf(oldU.classId) < 0 || mine.indexOf(newU.classId) < 0) {
    return { err: '這兩個帳號要都在你的班上。' };
  }
  if (oldU.classId !== newU.classId) return { err: '這兩個帳號不在同一個班上。' };
  if (oldU.mergedInto) return { err: '這個舊帳號已經合併過了。' };
  /* 目標（新帳號）不能是一個已經被接走的死帳號——不然隊伍會被接到
     一個誰都登不進去的 userId 上，畫面上看起來成功了，其實接丟了。
     畫面上的選人清單已經濾掉這種帳號，這裡是資料層再擋一次。 */
  if (newU.mergedInto) return { err: '這個新帳號已經合併過了，選現在真的在用的那一個。' };
  var classId = oldU.classId;
  var oldTeamId = teamIn(oldU, classId);
  if (!oldTeamId) return { err: '舊帳號在這個班還沒有隊，沒有東西好接。' };

  /* 新帳號原本坐的那一組（通常是重新註冊當下自動建的空隊）。
     換完座位之後，如果那一組已經沒有人坐了，跟清空隊一樣的處理
     ——標 _removed，不整包刪掉（見這學期稍早清空隊那一次）。 */
  var newTeamId = teamIn(newU, classId);
  var ss = seatsOf(newU).slice();
  var seat = null;
  ss.forEach(function (s) { if (s.classId === classId) seat = s; });
  if (seat) seat.teamId = oldTeamId; else ss.push({ classId: classId, teamId: oldTeamId });
  newU.seats = ss;
  if (newU.classId === classId) newU.teamId = oldTeamId;

  if (newTeamId && newTeamId !== oldTeamId) {
    var stillIn = where('Users', function (x) { return inTeam(x, newTeamId); }).length;
    if (!stillIn) {
      var nt = teamOf(newTeamId);
      if (nt) { nt.classId = ''; nt._removed = true; }
    }
  }

  oldU.mergedInto = newU.userId;
  save();
  logEvent('mergeaccount', { by: teacher.userId, from: oldU.account, to: newU.account });
  return { oldUser: oldU, newUser: newU, teamId: oldTeamId };
}

/* ---------- 用救援碼找回密碼 ----------

   跟 actSetPw 是同一件事的兩種驗法：一個是「打對現在那一個密碼」，
   一個是「打對註冊那一刻拿到、只有他自己收著的那組碼」。兩種都是
   本人才拿得出來的東西，都沒有任何角色（老師、研究者）幫得上忙——
   救援碼從沒有明碼存進 DB，也沒有任何畫面印得出別人的救援碼。

   用過一次就換一組新的：碼不是密碼，用掉不換的話，任何人撿到那張紙
   等於永遠握著這個帳號的後門。換完照樣只回傳這一次，畫過就沒了。 */
function actRecoverPw(account, code, pw) {
  var u = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(account || '').trim().toLowerCase();
  });
  if (!u) return { err: '找不到這個帳號。' };
  if (!u.recovHash) {
    return { err: '這個帳號沒有救援碼——它是比這個功能更早註冊的帳號，救不回來。' };
  }
  var c = String(code || '').trim().toUpperCase();
  if (pwHash(c, u.recovSalt) !== u.recovHash) return { err: '救援碼不對。' };
  var np = String(pw || '');
  if (np.length < RULES.PW_MIN) return { err: RULES.pwRule() };
  var salt = newSalt();
  u.salt = salt;
  u.hash = pwHash(np, salt);
  var recov = newRecov();
  var rsalt = newSalt();
  u.recovSalt = rsalt;
  u.recovHash = pwHash(recov, rsalt);
  save();
  /* 跟 setpw 一樣：只記「他用救援碼換過」，不記密碼、不記救援碼。 */
  logEvent('recoverpw', { by: u.userId });
  return { user: u, recov: recov };
}

/* ---------- 名冊與身分認領 ----------
   老師先把名冊貼進來（一行一組），學生註冊之後從裡面挑自己是誰。
   這樣系統知道「這個帳號是哪一組的誰」，而且不用學生自己打組名。 */






/* 重設密碼與刪帳號那兩支拿掉了。

   它們唯一的呼叫端是研究者那一頁，而研究者現在只能看不能改
   （見 75-research.js 的檔頭）。留著一支沒有人呼叫得到的
   「刪掉任何人的帳號」，只會讓下一個讀這份程式的人以為那個
   權限還在。 */

/* 六個英數字。去掉會看錯的 I O 0 1——這串要用唸的。 */
function newCode() {
  var code = '';
  var CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (var i = 0; i < 6; i++) code += CH[Math.floor(Math.random() * CH.length)];
  return code;
}

/* 十二個英數字，分三段。這一串不是用唸的——是要他抄下來或截圖收著，
   所以比加入碼長，分段是為了肉眼對得上、抄的時候不會看丟一段。 */
function newRecov() {
  var CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s = '';
  for (var i = 0; i < 12; i++) s += CH[Math.floor(Math.random() * CH.length)];
  return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8, 12);
}

/* 老師自己開班。開完他就在這個班裡，而那六碼是他唸給學生的東西。 */
function actNewClass(name, teacherId) {
  var u = userOf(teacherId);
  if (!u) return { err: '找不到這個人。' };
  var c = actCreateClass(name, teacherId).klass;
  /* 加一個座位，不是換掉原本那個——他可能已經在帶另一班。 */
  addSeat(u, c.classId, '');
  save();
  return { klass: c };
}

/* 改班名。

   2026-09-23：本來班名只有開班那一刻設定得了，之後沒有任何入口——
   要改只能直接動 Firestore，繞過整套同步邏輯。代價是：任何一台還連著
   這個班、本地端還記著舊名字的裝置，只要存一次檔就會把舊名字整批
   推回去蓋掉那筆直接改的資料（真的在教室裡發生過）。

   這一支走正常的 actRename／actTeamRename 同一條路：save() 之後
   經過 syncPush 推上雲，連著的裝置從 onSnapshot 即時收到，本地端
   自己更新成新的——不會有「別人還記著舊的」這件事。 */
function actRenameClass(classId, teacherId, name) {
  var teacher = userOf(teacherId);
  if (!teacher || teacher.role !== 'teacher') return { err: '只有老師改得動班名。' };
  var mine = seatsOf(teacher).map(function (s) { return s.classId; });
  if (mine.indexOf(classId) < 0) return { err: '這個班不是你的。' };
  var c = find('Classes', function (x) { return x.classId === classId; });
  if (!c) return { err: '找不到這個班。' };
  var nm = String(name || '').trim().slice(0, 30);
  if (!nm) return { err: '班名不能是空的。' };
  if (c.name === nm) return { err: '跟原本一樣，沒有改到。' };
  var old = c.name;
  c.name = nm;
  save();
  logEvent('renameclass', { by: teacher.userId, classId: classId, name: nm, from: old });
  return { klass: c };
}

/* 學生自己建一隊。建的人直接進去，代碼唸給組員。 */
function actNewTeam(name, userId) {
  var u = userOf(userId);
  if (!u || !u.classId) return { err: '你還沒有班級。' };
  /* 擋的是「你在**這一班**已經有隊了」。他在另一個班有隊是正常的
     ——那是另一個座位。 */
  if (teamIn(u, u.classId)) return { err: '你在這一個班已經有隊了。' };
  var t = {
    teamId: nid('G'), classId: u.classId,
    name: String(name || '').trim().slice(0, 20) || '一支隊伍',
    joinCode: newCode(), project: '', joinedAt: now()
  };
  DB.Teams.push(t);
  addSeat(u, u.classId, t.teamId);
  save();
  logEvent('newteam', { teamId: t.teamId, name: t.name });
  return { team: t };
}

/* 用代碼加入。組建好就不能換——任務派給組、紀錄掛在組上，
   中途換組會讓歷史說謊。所以已經有隊的人擋在這裡。 */
function actJoinTeam(code, userId) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個人。' };
  /* 同上：擋的是這一班。組好就不能換還是成立，只是範圍是一個班。 */
  if (teamIn(u, u.classId)) return { err: '你在這一個班已經在一隊裡了。組好了就不能換。' };
  var t = find('Teams', function (x) {
    return x.classId === u.classId &&
      String(x.joinCode || '').toUpperCase() === String(code || '').toUpperCase();
  });
  if (!t) return { err: '找不到這個隊伍代碼。重新整理頁面再試一次，或跟隊友確認代碼。' };
  addSeat(u, u.classId, t.teamId);
  save();
  logEvent('jointeam', { teamId: t.teamId });
  return { team: t };
}

function actCreateClass(name, teacherId) {
  var code = newCode();
  var c = {
    classId: nid('C'), name: String(name || '未命名的班').trim(),
    joinCode: code, teacherId: teacherId || '', startedAt: now()
  };
  DB.Classes.push(c);
  save();
  return { klass: c };
}

/* ---------- 匯出 ----------
   研究資料。CSV，因為那是最容易進統計軟體的東西。 */
/* ---------- 一趟一列 ----------

   上面那一份（exportCsv）是流水帳：時間、誰做的、事件、說明。
   說明是一句中文——「交出去：承諾 4 天，實際 6 天 → early」。
   人讀很好，可是要算偏差率就得先從中文裡剖字。

   論文要看的那幾條全部卡在這裡：
     偏差率隨趟數有沒有下降　　需要 est 與 actual 成欄
     說「很確定」的準不準　　　需要 sure × stamp
     協商之後往哪邊靠　　　　　需要老師回的天數與最後定的天數
     退出集中在什麼時候　　　　需要承諾時間與退出時間

   所以另外給一份：一趟一列，每一個要算的東西自己一欄。
   一個字都不用剖。 */
function exportRuns(classId) {
  var head = ['組別', '專案', '任務', '一趟', '狀態',
    '承諾天數', '實際天數', '判定', '偏差率',
    '把握', '有沒有拆件', '拆幾件', '本人自己按的件數',
    '順不順', '為什麼', '範圍', '東西在哪裡',
    /* 協商那三個數字要分得開。

       本來這裡只有「老師回的天數」與「談完之後的天數」，而後者印的是
       run.est——可是 actAnswerAsk 動的就是 run.est，所以「承諾天數」
       那一欄印的也是談完之後的那一個。兩欄同一個數字，學生本來說的
       那一個（estFirst）整份匯出裡沒有任何地方看得到。

       而「協商之後往哪邊靠」正是要那三個點：他一個人說的、老師說的、
       最後定的。少了第一個，那一題算不出來。 */
    /* 拆件用要徑算出來是幾天，以及他們有沒有改掉它。

       算出來 2 天、他們定 4 天，是這一組真的在做預估——他們知道某件
       計算不知道的事（相依、這禮拜有三科要交、一週只碰一次面）。
       算出來 2 天、他們就走 2 天，是接受了系統的算術。

       這兩件事在研究上完全不同，而少了這一欄它們長得一模一樣。 */
    '要徑算幾天', '有沒有改掉',
    '學生本來說幾天', '老師回的天數', '談完之後的天數',
    '被退幾次', '老師的話', '哪一位老師', '水晶加成',
    '承諾時間', '交出去時間', '收下時間', '交出去等了幾天'];
  var rows = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    where('Runs', function (r) { return r.teamId === t.teamId; })
      .sort(function (a, b) { return (a.committedAt || 0) - (b.committedAt || 0); })
      .forEach(function (r) {
        var m = msOf(r.msId);
        var pl = r.plan || [];
        var byOwn = pl.filter(function (x) { return x.byOwn; }).length;
        /* 偏差率：|實際 − 承諾| ÷ 承諾。跟排行榜同一個算法
           （見 68-rank.js）——那裡解釋過為什麼不用「準的範圍」。 */
        var dev = (r.actual && r.est) ? Math.abs(r.actual - r.est) / r.est : '';
        var by = r.wordBy ? userOf(r.wordBy) : null;
        rows.push([
          t.name, t.project || '', m ? m.title + (m.withdrawnAt ? '（老師已刪掉）' : '') : '', r.runId, r.state,
          r.est || '', r.actual || '', r.stamp || '',
          dev === '' ? '' : dev.toFixed(3),
          r.sure || '', pl.length ? 'Y' : 'N', pl.length, byOwn,
          r.feel || '', r.why || '', r.scope || '', r.link || '',
          /* 沒拆件就沒有要徑可言（estCalc 是 0），那一欄留空——
             0 會被讀成「算出來是零天」。 */
          r.estCalc || '',
          !r.estCalc ? '' : (r.estCalc === estOwn(r) ? 'N' : 'Y'),
          /* estFirst 只有「談過而且動了」才有；沒動的時候他本來說的
             就是 est 本身，所以那一欄照樣填得出來。 */
          r.askAt ? (r.estFirst == null ? (r.est || '') : r.estFirst) : '',
          r.askEst || '', r.askAt ? (r.est || '') : '',
          r.backs || 0, r.word || '', by ? by.name : '',
          /* 0 是老師真的選的一個答案（多給 0 顆 ＝ 收下、沒有要多說的），
             跟「還沒收下所以沒有這一格」不是同一件事。用 || '' 會把
             那兩件事寫成同一格空白。 */
          r.bonus == null ? '' : r.bonus,
          r.committedAt ? new Date(r.committedAt).toISOString() : '',
          r.submittedAt ? new Date(r.submittedAt).toISOString() : '',
          r.doneAt ? new Date(r.doneAt).toISOString() : '',
          (r.submittedAt && r.doneAt) ? daysBetween(r.submittedAt, r.doneAt) : ''
        ]);
      });
  });
  return csvOf(head, rows);
}

/* ---------- 一件一列 ----------

   這一份是**個人層**的。系統裡唯二屬於個人的東西都在拆件上：
   那一件掛在誰名下、他說幾天、他實際幾天、那個天數是不是他本人
   按的（byOwn）。

   一趟一列那一份是組的單位，而「一個人學會預估自己要幾天」是個人的
   事——沒有這一份，那個主張只能用組的平均去談。

   資料一直都在，只是從來沒有一個地方把它攤成一列一列。 */
function exportItems(classId) {
  var head = ['組別', '任務', '一趟', '第幾件', '件名',
    '掛在誰名下', '他說幾天', '實際幾天', '差幾天',
    '天數是不是本人按的', '他寫了什麼', '這一趟的判定', '這一趟的把握'];
  var rows = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    where('Runs', function (r) { return r.teamId === t.teamId; })
      .sort(function (a, b) { return (a.committedAt || 0) - (b.committedAt || 0); })
      .forEach(function (r) {
        var m = msOf(r.msId);
        (r.plan || []).forEach(function (x, i) {
          /* 全組一起做的那一件不掛在任何人名下，而空白會被讀成
             「漏填」——那一欄要寫得出「他們決定一起做」。 */
          var u = (x.who && !isAll(x.who)) ? userOf(x.who) : null;
          var 誰 = isAll(x.who) ? '全體' : (u ? u.name : '');
          var got = (r.spent || [])[i];
          rows.push([
            t.name, m ? m.title + (m.withdrawnAt ? '（老師已刪掉）' : '') : '', r.runId, i + 1, x.n,
            誰, x.d || '', (got == null ? '' : got),
            (got == null || !x.d) ? '' : (got - x.d),
            x.byOwn ? 'Y' : 'N',
            u && r.said ? (r.said[u.userId] || '') : '',
            r.stamp || '', r.sure || ''
          ]);
        });
      });
  });
  return csvOf(head, rows);
}

/* 三份共用的那一段：逗號與引號要跳脫。 */
function csvOf(head, rows) {
  return [head].concat(rows).map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
}

function exportCsv(classId) {
  var teamName = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) { teamName[t.teamId] = t.name; });
  /* 「誰做的」這一欄是新的，換掉本來的「指導老師」。

     實驗是三位老師共同帶一個班，那三位就是變項。本來那一欄印的是
     Team.mentorId——一組配一位老師。可是共同帶班沒有那個關係，
     而且已經沒有畫面在設它，真的開一個班匯出來會整欄空白。

     真正分得開的是每一筆各自的行動者：這一件是哪一位派的、
     哪一位收的、哪一位退回的。logEvent 一直有記（e.by），
     只是從來沒印出來——「角色＝老師」在三位老師的班上等於沒分。 */
  var head = ['時間', '誰做的', '角色', '組別', '事件', '說明'];
  var rows = eventsOf(classId).map(function (e) {
    var by = e.by ? userOf(e.by) : null;
    return [
      new Date(e.at).toISOString(),
      by ? by.name : '',
      e.role || '',
      teamName[e.teamId] || '',
      e.kind,
      evSay(e)
    ];
  });
  return [head].concat(rows).map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
}


/* ===== 16-buried.js ===== */
/* ---------- 地底下本來就埋著東西 ----------

   兩個洞，同一個修法。

   洞一 · 「打通哪一格」是空的。
          44-dig.js 的註解自己寫著「選方向不影響任何判定」——
          這個系統裡最像遊戲的那個選擇，裡面沒有東西。
          PaGamO 的每一格是一題，這裡的每一格打通就只是變色。
          低頻的系統不可能靠次數贏（一學期八趟），只能靠每一次都很重。

   洞二 · 準跟失準拿到的東西一模一樣。
          一個判定、一根岩心、一格地、一座建築，兩邊都拿到。
          所以唯一有阻力的選擇（估幾天）沒有後果，判定是化妝品。
          這是勝任感那一根最大的洞：做得準沒有任何事情不一樣。

   修法：地底下埋著東西，而且你遇到什麼跟你到得早不早有關。

   要非常小心的一條線——差別只能在「遇到什麼」，不能在「拿到多少」。
   失準的人一樣拿到那一格、那座建築、那根岩心、那一筆圖鑑。
   差的是：準的時候你到得夠早，牠還在；失準的時候牠已經走了，
   你看到的是牠留下的痕跡。兩邊都是一則紀錄，沒有人被扣任何東西。

   一旦變成「準的拿比較多」，這個作品就從自發變成受控，
   而且「失準不扣任何東西」那條前提會當場垮掉。

   埋的東西是用班級與座標算出來的，不是擲骰子——同一個班的同一格
   永遠是同一樣東西。會亂跳的話那就不是一片地，是特效。 */

/* 留下記號的時候敲開岩壁，五次裡大概兩次會敲到東西。

   本來是 14%，因為那時候是一格一擲、一張地圖上上百格，太密就不值錢。
   現在一趟才擲一次，一學期八趟——14% 等於整學期遇到一次，
   那個機制等於不存在。 */
var BURIED_ODDS = 40;

var BURIED = [
  { k: 'mob',    n: '還在睡的東西',
    here: '牠還在這裡，被你走到這裡的動靜吵醒。',
    late: '牠已經走了。留下一層蛻下來的殼。' },
  /* 「上一輪的遺跡」與「牆上刻的字」拿掉了。
     那兩樣挖出來的是別組某一趟的名字與天數，而每一組的專案不一樣
     ——別人「六天」對你不構成任何參考，它只是看起來像內容。

     「空腔：什麼都沒有」也拿掉了。一學期大概敲到三次的東西，
     不能有一次是空的。 */
  { k: 'spring', n: '地下水',
    here: '一道還在流的水。',
    late: '一道乾掉的水痕。' }
];

function buriedDef(k) {
  var out = null;
  BURIED.forEach(function (b) { if (b.k === k) out = b; });
  return out;
}

/* 這一層的岩壁裡有什麼。用班級、組別與深度算，
   同一組走到同一層永遠遇到同一樣東西。

   為什麼要帶組別：每一組走的是自己那一條廊道，
   同一層的岩壁不是同一面牆。 */
function buriedAt(classId, teamId, depth) {
  var h = hash('buried|' + classId + '|' + teamId + '|' + depth);
  if (h % 100 >= BURIED_ODDS) return null;
  return BURIED[(h >>> 9) % BURIED.length];
}

/* 走到那一層的時候，把岩壁裡的東西記下來。

   early 是「你到得夠早」：那一趟的判定是準的。
   它只改變你遇到的是牠本人還是牠留下的痕跡——
   那一層、那座建築、那根岩心、那一筆圖鑑，兩邊都拿到。 */
function actUncover(teamId, depth) {
  var t = teamOf(teamId);
  if (!t) return null;
  var b = buriedAt(t.classId, teamId, depth);
  if (!b) return null;
  var k = 'd' + depth;
  t.found = t.found || {};
  if (t.found[k]) return t.found[k];

  var last = null;
  runsFor(teamId).forEach(function (r) { if (r.run.stamp) last = r.run; });
  var early = !last || last.stamp !== 'late';

  var rec = { k: b.k, early: early ? 1 : 0 };

  /* 蟄伏的東西：那一層住的那幾隻裡的一隻。進圖鑑，標「你遇過」。 */
  if (b.k === 'mob') {
    var f = faunaOf(strataAt(depth, teamId).key);
    if (!f.length) f = allFauna();
    if (f.length) rec.mob = f[hash('bmob|' + teamId + '|' + k) % f.length].n;
  }


  t.found[k] = rec;
  save();
  return rec;
}

/* 這一組在岩壁裡遇過的那幾隻。圖鑑那邊要用。 */
function foundMobs(teamId) {
  var t = teamOf(teamId);
  var out = {};
  Object.keys((t && t.found) || {}).forEach(function (k) {
    var r = t.found[k];
    if (r.mob) out[r.mob] = r.early ? '牠還在' : '只剩痕跡';
  });
  return out;
}

/* ===== 18-places.js ===== */
/* ---------- 六個地方各自長什麼樣 ----------

   在這之前，六個地方在畫面上是六個換了顏色的方塊：故事那一頁的地圖是
   六個色塊，出發前選地方也是六張色卡。名字說「水晶迴廊」，圖上一樣
   水晶都沒有——那張圖沒有在講任何名字沒講過的事。

   所以每個地方真的畫一張。44 × 22，一格一像素，用的是這個作品本來就
   在用的那一套（見 30-art.js 的 pxSvg）。

   六張共用同一套字母（見 13-strata.js 的 spal），所以它們是同一座地下城的
   六個地方，不是六張各畫各的插圖：一樣的天花板、一樣的後牆、一樣的地板，
   換的是那一層自己的東西——天光、根、晶體、方塊、鐵件、火。

   為什麼是 44 × 22：兩倍寬，而且都是 11 的倍數（整份的格子）。
   放大只有整體縮放，沒有拉扁。 */

var PW = 44, PH = 22;

function pxNew(ch) {
  var g = [], x, y;
  for (y = 0; y < PH; y++) { var r = []; for (x = 0; x < PW; x++) r.push(ch); g.push(r); }
  return g;
}
function pxPut(g, x, y, ch) {
  if (x >= 0 && x < PW && y >= 0 && y < PH) g[y][x] = ch;
}
function pxBox(g, x0, y0, x1, y1, ch) {
  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) pxPut(g, x, y, ch);
}
/* 一張小圖蓋上去。'.' 是不畫——所以水晶、根、晶體都可以手畫，
   底下那片牆是算出來的。 */
function pxArt(g, art, x0, y0) {
  art.forEach(function (row, dy) {
    for (var dx = 0; dx < row.length; dx++) {
      if (row[dx] === '.') continue;
      pxPut(g, x0 + dx, y0 + dy, row[dx]);
    }
  });

var GRIT = [0, 0, 1, 0, 1, 1, 0, 0, 1, 0, 0];

/* 每一張都從同一個洞開始：天花板、後牆、地板。
   差別留給各自那一段。 */
function pxCave(g, off) {
  off = off || 0;
  pxBox(g, 0, 0, PW - 1, 15, 'b');
  var x;
  for (x = 0; x < PW; x++) {
    var up = 2 + ROOF[(x + off) % 11];
    pxBox(g, x, 0, up - 1, 'a');
    pxPut(g, x, up, 'k');
    var dn = 16 - GRIT[(x + 5 + off) % 11];
    pxBox(g, x, dn, dn, 'f');
    pxBox(g, x, dn + 1, PH - 1, 'e');
    pxBox(g, x, dn + 4, PH - 1, 'd');
  }
}

var PLACE_CACHE = {};
function placePx(key) {
  if (PLACE_CACHE[key]) return PLACE_CACHE[key];
  var draw = PLACE_ART[key];
  var g = pxNew('b');
  if (draw) draw(g); else pxCave(g);
  PLACE_CACHE[key] = pxRows(g);
  return PLACE_CACHE[key];
}

/* 一個地方的樣子。放在故事那一頁的地圖上，也放在出發前選地方那幾張卡上——
   同一張圖，所以他選的時候看到的，跟故事裡看到的是同一個地方。 */
function placeArt(z, cls) {
  return '<img class="pl ' + (cls || '') + '" src="' +
    pxSvg(placePx(z.key), z.spal, false) + '" alt="">';
}

   24×16 放在廊道上只有 66px。那個尺寸看不到臉、看不到手上拿什麼，
   只看得到一個輪廓。所以這 12 種體型差的是**形狀本身**：
   很高、很矮、浮著、沒有腿、兩個頭、背著比自己大的東西——
   不是同一個人換帽子。

   ── 可以很奇怪 ──

   他們是地下城裡的人，不是路人。奇怪是重點：走到那一天的時候，
   要的是「這次的委託人竟然長這樣」。

   ── 怎麼畫 ──

   每一種畫在一個窄框裡（寬度隨意），程式自動置中、貼到地面那一列。
   所以下面每一列不用數到 24——這樣才不會有人浮在半空或站歪。 */

     hover  整個沉一格。浮著的、成群的——它們沒有腳，整個都會動。
     sway   上半身往右挪一格。細長的東西被風帶著。
     lit    形狀不動，只有亮的那幾格暗下來。硬的殼、亮著的罩子。

  kneel: 'bob', ring: 'lit', many: 'hover', thread: 'sway',
  split: 'bob', bell: 'lit'

function patMove(px, kind) {
  var h = px.length, w = px[0].length, y, x;
  var out = [];
  for (y = 0; y < h; y++) out.push(px[y].split(''));

  if (kind === 'lit') {
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
      var c = out[y][x];
      if (PAT_DIM[c]) out[y][x] = PAT_DIM[c];
    }
    return out.map(function (r) { return r.join(''); });
  }

  if (kind === 'sway') {
    /* 上半身整段往右挪一格，下半身不動。 */
    var mid = Math.floor(h / 2);
    for (y = 0; y < mid; y++) {
      var row = px[y].split('');
      row.pop();
      row.unshift('.');
      out[y] = row;
    }
    return out.map(function (r) { return r.join(''); });
  }

  /* bob 與 hover：整段往下挪一格。
     bob 留住底下兩列（腳踩著地），hover 不留（它本來就沒有腳）。 */
  var keep = kind === 'hover' ? 0 : 2;
  var blank = new Array(w + 1).join('.');
  var moved = [];
  for (y = 0; y < h; y++) {
    if (y < h - keep) moved.push(y === 0 ? blank : px[y - 1]);
    else moved.push(px[y]);
  }
  /* 挪下來之後被蓋掉的那一列要補回去：不然身體會少一列。 */
  if (keep) moved[h - keep] = px[h - keep - 1];
  return moved;
}

function patNew() {
  var g = [], y, x;
  for (y = 0; y < PAT_H; y++) { var r = []; for (x = 0; x < PAT_W; x++) r.push('.'); g.push(r); }
  return g;
}
function patPut(g, art, x0, y0) {
  art.forEach(function (row, dy) {
    for (var dx = 0; dx < row.length; dx++) {
      var c = row[dx];
      if (c === '.') continue;
      var x = x0 + dx, y = y0 + dy;
      if (x >= 0 && x < PAT_W && y >= 0 && y < PAT_H) g[y][x] = c;
    }
  });
}
function patWide(a) {
  var w = 0;
  a.forEach(function (r) { if (r.length > w) w = r.length; });
  return w;
}

/* 一個委託人。體型置中、貼著地面那一列，所以誰都不會浮著或站歪。
   記號再貼著體型放（見 PAT_MARK），所以細的粗的高的矮的都掛得對。 */
