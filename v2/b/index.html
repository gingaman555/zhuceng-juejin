     不是每次打開都要看的。真正每次都要看的是「這一趟走到哪、
     現在該做什麼」。

     所以它排到動作後面。第一屏變成：環境 → 三扇門 → 要做的那一件，
     動作往上提 222px。組別卡還在，滑一下就看得到，而它本來也不是
     拿來讀的——是拿來查代碼的。

     桌機也一起換，不做兩套：一致比各自最佳化重要（手機跟桌機看到的
     是同一個排法，講給人聽的時候只有一種說法）。 */
  H.push(teamCard(t));

  /* 走過的每一趟。往左滑就是往回看——它在這一頁上最不重要，
     所以排在動作後面。 */
  H.push(runStrip(t));

  /* 「新的一層／留一個記號」那張卡拿掉了。

     收起一趟的時候就順手插進那一層了（見 actSeal），所以它指的東西
     已經不是一個獨立的步驟。而它自己也講不清楚是什麼——
     連寫這個系統的人看到都要問「那是什麼」。 */



  return H.join('');
};

/* ---------- 走過的每一趟 ----------

   營地上那一排是「堆積」，但它擠在洞口那一小塊裡，滿了就放不下。
   走過八趟的人真正想做的事是往回看：那一趟叫什麼、說幾天、實際幾天。

   舊的在左、新的在右——跟廊道同一個方向（往右走就是往深處走），
   所以「往左滑」＝「往回看」不用學。打開的時候停在最右邊，也就是現在。 */
function runStrip(t, bare) {
  var rows = runsFor(t.teamId).filter(function (x) { return x.run.stamp; });
  if (!rows.length) return '';
  /* 名字。系統從頭到尾沒在學生面前說過「估算」兩個字——
     概念沒有被命名，他就不知道自己在練的是什麼。
     結算那一頁上面那張卡已經講過一次，所以那裡傳 bare。 */
  var H = [];
  if (!bare) H.push('<div class="rs-h">你的估算　' + rows.length + ' 趟</div>');
  H.push('<div class="rstrip"><div class="rs-in">');
  rows.forEach(function (x) {
    var r = x.run;
    /* 牠的顏色是那一趟當時那一層的顏色。本來去 builds 裡翻，
       翻不到就當第 0 層——還沒收起來的那一趟就被畫成最上層的顏色。 */
    var z = strataAt(runDepth(r), t.teamId);
    var mob = mobOfRun(r);
    /* 一格一隻牠。牠是那一趟盡頭擋路的那一隻，也是圖鑑裡會標成
       「遇過」的那一隻——所以牠是那一趟最好的名字：不用讀，
       看一眼就想得起來是哪一趟。其餘的點進去看。 */
    H.push('<button class="rs ' + r.stamp + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'rec:' + r.runId })) + '\' title="' +
      esc((x.ms ? x.ms.title : '') + '　' + (mob ? mob.n : '') +
        '　說 ' + estSay(r) + '　實際 ' + (r.actual || 0) + ' 天') + '">');
    H.push(pxTag(mob ? mob.px : [], z.pal, 'rs-px'));
    H.push(runTiles(r.runId));
    /* 這格太小放不下單位字，印他原始講的數字就好（8 小時印「8」，
       不是換算過的 0.33）——跟 tooltip 裡完整的「8 小時」是同一件事，
       只是這裡沒有空間寫單位。 */
    H.push('<span class="rs-s">' + stampPx(r.stamp) +
      '<i>' + (r.estU && r.estU !== 'd' && r.estN != null ? r.estN : r.est) +
      '<u>→</u>' + (r.actual || 0) + '</i></span>');
    H.push('</button>');
  });
  H.push('</div></div>');
  return H.join('');
}

/* ---------- 那一趟長什麼形狀 ----------

   叫 runTiles 不叫 runShape：40-db.js 已經有一支 runShape，
   回的是那一趟的統計（幾天、動了幾天、休了幾天）。同名的兩支後面
   會蓋掉前面，而畫面上只會看起來怪怪的——check.js 擋下來了。

   廊道每一格本來就記著那天動的是哪一件（見 61-scene.js 的 byTile），
   而**七格同一個顏色跟七格五顏六色是完全不同的一趟**：一個是一件事
   做了一個禮拜，一個是每天換一件。

   那個形狀一直存在，但從來沒有被拿出來看過——它只活在那一趟正在跑
   的時候，交出去就沒了。

   現在把它畫進「走過的每一趟」那幾格裡。不是新的一塊、不是新的一行字，
   是那幾格裡面本來就空著的一條。他不用讀任何東西：五顏六色跟一整條
   同色，看一眼就是兩種不同的禮拜。

   為什麼要給他自己看：這一套唯一在教的是校準，而校準的材料現在
   只有兩個數字（說幾天、實際幾天）。形狀是第三樣，而且它是唯一
   說得出「那幾天你是怎麼過的」的東西。 */
function runTiles(runId) {
  var log = dayLog(runId);
  var cells = [];
  log.forEach(function (d) {
    if (d && d.kind === 'move') cells.push(d.step);
  });
  if (cells.length < 2) return '';
  /* 太長就收在一條裡：一格最小 3px，超過就不再加寬。 */
  var H = ['<span class="rs-sh">'];
  cells.slice(0, 14).forEach(function (i) {
    H.push('<i style="background:' + stepHue(i == null ? -1 : i) + '"></i>');
  });
  H.push('</span>');
  return H.join('');
}

/* 老師分的段，排成一列小方塊。勾得掉。
   它接在任務那一行下面，不是一張卡——段是任務的一部分，不是另一件事。 */
function stepRow(runId) {
  var sp = stepsOf(runId);
  if (!sp) return '';
  var H = ['<div class="srow">'];
  sp.all.forEach(function (x, i) {
    var on = sp.on.indexOf(i) >= 0;
    H.push('<button class="sq' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tick:' + runId + '|' + i })) + '\'>' +
      '<b></b>' + esc(x) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 你們這一組。組名、專案、幾個人、隊伍代碼、水晶。

   隊伍代碼一直在：新的人要加進來就是靠那一串，而它會被唸出來。 */
function teamCard(t) {
  var mem = where('Users', function (u) { return inTeam(u, t.teamId); });
  var c = crystalOf(t.teamId);
  /* 三行。本來五段（眉標、隊名、專案、人、代碼）疊成 281px，
     而它排在最上面，於是廊道被推到畫面外。

     哪些合併得起來：
       眉標「你們這一組」拿掉——底下就是四個人的臉，那一行在說
       已經看得出來的事。
       隊名跟專案接成一行（中點分隔），跟水晶同一列。
       代碼那一句從「隊伍代碼 X　要加進來的人用這一串。」縮成
       「代碼 X」——那一句解釋只有第一天有用，而代碼本身就是動作。 */
  var H = ['<div class="card tmc">'];

    (t.project ? '<i>' + esc(t.project) + '</i>' : '') + '</b>');
  /* 隊伍代碼是唸給隊友的。不分組那一站沒有隊友。

     ── 一顆複製鍵 ──

     2026-09-09 加的。這一串的用途從頭到尾只有一個：交到隊友手上。
     在那之前唯一的路是看著螢幕把六個字念出來或打出來，而開學第一節
     課全班同時在做這件事——六組的六串同時在空氣裡。抄錯一個字的
     代價不是重打，是加進別人那一組，而那個是退不掉的
     （見 15-auth.js 的 actJoinTeam：組好了就不能換）。

     用 data-copy 這條路，跟「老師要去哪裡看」那一行同一顆
     （見 56-viz.js 的 whereLine，以及 55-ui.js 裡收 copy 的那一行）。 */
  if (t.joinCode && !RULES.SOLO) {
    H.push('<span class="tmc-c">代碼 <b>' + esc(t.joinCode) + '</b>' +
      '<button class="btn ghost cp" data-act="copy" data-copy="' +
      esc(t.joinCode) + '">複製</button></span>');
  }
  /* 這一格印的是**手上剩下的**，不是拿過的總數。

     兩個數字是兩種用途：榜上那個是「你們做了多少」（拿過的，花掉不扣，
     見 68c-cryrank.js），這一格是「你們現在能做什麼」——他要決定
     點不點得亮圖鑑上那一位的時候，看的是這個。

     花過才寫括號那一半。沒花過的時候兩個數字一樣，寫出來是雜訊。 */
  H.push('<span class="tmc-cry">' + c.left + ' 顆' +
    (c.used ? '<em>拿過 ' + c.all + '</em>' : '') + '</span></div>');
  H.push('<div class="tmc-l">');
  mem.forEach(function (u) {
    var g = heroOf(u);
    /* 不是按鈕。學生之間不用互相點進去看。

       而且本來那一條是壞的：它傳的是使用者 id，而 PAGES.person 收的是
       組別 id（班級地下城那一條傳組別，那個才是對的），所以從這裡
       點進去只會看到「找不到」。

       自己那一格還是有金框——那是資訊，不是「可以按」。 */
    H.push('<span class="tmc-m' + (u.userId === S.who ? ' me' : '') + '">');
    H.push(pxTag(g.idleA, g.pal, 'tmc-px'));
    H.push('<span>' + esc(u.name || '') + '</span>');
    H.push('</span>');
  });
  H.push('</div>');
  H.push('</div>');
  return H.join('');
}

/* 這一趟現在是什麼狀態。一個短標籤，不是一句解釋。 */
function taskTag(next) {

/* 廊道底下那一排門。都是偶爾才用的，但都不能藏起來——
   沒觸發過的東西等於不存在。

   本來這裡是營火、出口、招牌。營火拿掉了：它問的「哪一段比你想的久」
   已經是戰鬥的第二題，而且它的 lit 條件永遠是 false，從來沒亮過。
   招牌也拿掉了：專案名在頂條上，而且點得進去改。
   換上來的是任務清單與圖鑑——它們本來各佔一個分頁，但它們不是步驟。 */
function deskRow(t, next) {

  /* 上次翻開之後多遇到幾隻，就在門上掛幾。翻開就消掉。 */
  var cnM = codexNew(me());

  /* 門上一個數字，但講清楚是哪一種——這一頁裝著兩種東西，

  var cnSay = cn

        .filter(function (x) { return x; }).join('、')

     一位委託人都沒遇過、一張任務之證都沒有。金邊在說「這裡面有東西」，
     學生點進去看到一整片黑影。

     金色在這整套裡只代表一件事（見 50-style.css）：可以按、你在這裡、
     有新東西。寫死就是把它變成裝飾，而一個永遠亮著的記號等於沒有記號
     ——真的多了一位委託人的時候，它跟昨天長得一模一樣。

     改成跟門上那個數字同一個來源：有 cn 才亮。 */
  H.push('<button class="dk' + (cn ? ' lit' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:codex' })) + '\' title="' +
    esc(cnSay) + '">' +
    pxTag(ICONS.codex, ICON_ON, '') + '<i>圖鑑</i>' +
    (cn ? '<em class="nb">' + cn + '</em>' : '') + '</button>');
  /* 故事。第一次進來看過一次，之後從這裡回來看。

     放在圖鑑旁邊是因為它們是同一種東西：都不是「要你做的事」，
     都是「這個世界是什麼」。而它一直在——沒觸發過的東西等於不存在，
     一個看過就消失的開場，等於他忘了之後再也找不回來。

     ── 還沒讀過就亮 ──

     金邊的意思是「裡面有你還沒看過的東西」，而第一天最符合那句話的
     就是這一扇：圖鑑是空的，故事是滿的。本來剛好相反——圖鑑寫死亮著、
     故事不亮，於是那個記號指著空房間，而真正該先讀的那一扇沒有記號。

     sawStory 本來就有（見 55-ui.js：第一次進來會先擋去讀一次），
     所以這裡不用多存任何東西。讀過就不亮了，跟圖鑑同一條規則。 */
  var 沒讀過故事 = !(me() || {}).sawStory;
  H.push('<button class="dk' + (沒讀過故事 ? ' lit' : '') + '" data-act="run" data-p=\'' +

    pxTag(ICONS.pack, ICON_PAL, '') + '<i>故事</i></button>');

  H.push('<button class="dk" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:who' })) + '\' title="' +
    esc('角色：換一個') + '">' +
    pxTag(HERO.walkA, HERO.pal, '') + '<i>角色</i></button>');
  /* 出口。老師開了才點得動——沒開的時候它是一扇鎖著的門，不是一顆
     按下去會跳「還不行」的鍵。點得動卻沒有反應是最糟的那一種。

     「我們做完了」那一句話搬到任務清單去說：看完那一頁才知道自己是不是
     真的做完了，說出口的地方就該在那裡。 */
  /* 這一顆的 lit 是真的有條件的（只有老師開了才畫得出來），可是條件

  if (t.exitOk) {
    H.push('<button class="dk' + (t.exitOk ? ' lit' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'go:exit' })) + '\' title="' +

      pxTag(ICONS.log, ICON_ON, '') + '<i>出口</i></button>');

       「還沒說」共用同一句 title——老師回了話，學生在任何裝置上
       都看不到。 */
    H.push('<div class="dk shut" title="' +
      esc(t.exitNo ? '出口：老師說還不行'
        : t.exitAsk ? '出口：說了，在等老師開'
        : '出口：要老師開才走得出去') + '">' +
      pxTag(ICONS.log, ICON_PAL, '') + '<i>出口</i></div>');
  }
  H.push('</div>');

  /* ── 出口的狀態要看得到 ──

     那四種狀態本來只寫在 title 裡，而 title 在手機上不存在——
     一整個班用手機的時候，「說了沒」「老師答了沒」四種長得一模一樣。

     任務清單那一頁其實把三種都寫清楚了，但那是**去翻的人**才看得到。
     按下「我們做完了」的是一個人，另外三個隊友沒有任何線索；
     老師回「還不行」的時候更嚴重——那句回答等於沒有送到。

     所以在門底下說一句。只有在有話可說的時候才出現（沒說過就不說，
     不然那是雜訊），而且指得出去哪裡看細節。 */
  if (!t.leftAt && !t.exitOk) {
    if (t.exitNo) {
      H.push('<p class="dim">出口：老師說還不行。要再說一次，去任務清單。</p>');
    } else if (t.exitAsk) {
      H.push('<p class="dim">出口：說了「我們做完了」，在等老師開門。</p>');
    }
  }
  return H.join('');
}

   留下來的只有兩種東西：別人說的話（老師退回那一句、走出去那一句），
   跟看不出來的數字（在他那邊排第幾）。狀態誰在說，上面那一行已經負責了。 */
function actionCard(t, next, st) {
  var H = ['<div class="act-card">'];
  var row = next.row;

  if (next.kind === 'name') {
    /* 第一個動作不可以是「等」。 */
    H.push(btn('這個專案叫什麼', 'go:sign', 'big'));

  } else if (next.kind === 'left') {
    if (t.exitWord) H.push('<p class="quote">' + nl(t.exitWord) + '</p>');
    H.push(btn('看你帶出來的', 'go:exit', 'big'));

  } else if (next.kind === 'waitexit') {
    /* 「出口」上面那一行說過了，這裡只留新的那一半。 */
    H.push('<div class="eyebrow">等老師確認</div>');
    H.push(btn('還沒，收回', 'cancelexit', 'ghost'));

  } else if (next.kind === 'commit') {
    /* 有任務發來了——但這裡不給臉。

       委託人走進來那一下留在 commit 頁上：先知道有任務，再看到是誰
       派來的，那一下才有東西可以演。臉先在首頁出現的話，進去就只剩
       一張已經看過的圖。

       這一句講「任務」，按鈕跟著改成「去看看」——不能寫「去見他」：
       上面那句話沒有先提到一個人，「他」會找不到指的是誰
       （2026-09-23 踩過，原本這句是「有人在等這一件」才配得上「他」）。 */
    H.push('<p class="waiting">有任務發來了。</p>');
    H.push(btn('去看看', 'go:commit:' + row.ms.msId, 'big'));
    H.push(parallelCard(t, next));

  } else if (next.kind === 'doing') {
    H.push(doingCard(t, row, st));
    /* 老師派的其他幾件，直接列在這裡，每一件一顆鍵（見 parallelCard）。
       本來這裡只有一顆「老師又派了 N 個」的橫幅，要點進任務清單才找得到——
       9/29 量到第二件全班只有 4 組開始。 */
    H.push(parallelCard(t, next));

  } else if (next.kind === 'stamped') {
    H.push(btn('看準不準', 'go:stamp:' + row.run.runId, 'big'));

  } else if (next.kind === 'back') {
    /* 老師退回來了——委託人又站回路上了。那不是懲罰：那一趟的兩個
       數字在他交出去的當下就定了，退回不動判定也不動深度。
       他站回去講的只有一件事：那份東西還沒真的送到。 */
    /* 老師退回來了。他的話放大——那是這一刻唯一要讀的東西，
       而且退回一定帶著話（沒寫理由的退回擋在資料層）。 */
    /* 眉標拿掉了：上面那一行已經寫著「退回來了」。
       這裡剩下的是他的那一句話——那才是這一刻唯一要讀的東西。 */
    if (row.run.word) H.push(wordBlock(row.run, 'big'));
    /* 本來這裡直接再交一次，不用重答。但牠在廊道上站起來了，
       而「牠站著」跟「按一顆鍵就過去」是兩件互相矛盾的事。
       改成走同一條路：重新走一次那幾題，答完再交。

       鍵上本來寫「再打一次」——那是回合制對決那一版留下來的最後一個字，
       而這個作品已經沒有對決了（使用者：「我現在已經沒有回合制對決」，
       交件那一場的動畫也早就從「打牠一下」換成「他接過去」）。

       它偏偏長在最需要講清楚的那一刻：老師剛退回，學生讀完那一句話，
       接下來要按的那一顆。那一顆說「再打一次」，等於告訴他被退回是
       一場架。他要做的是把東西改好再交一次。 */
    H.push(btn('再交一次', 'go:battle:' + row.run.runId, 'big'));

  } else if (next.kind === 'review') {
    /* 等待本來是一片空白：只寫「等他看」，不知道幾天、
       不知道有沒有被看見。三個數字全部都在，給他就好。 */
    var wa = row && row.run ? waitAt(row.run.runId) : null;
    if (wa) {
      H.push('<div class="waitq">');
      H.push('<span>交出去</span><b>' + wa.days + '</b><span>天</span>');
      if (wa.of > 1) H.push('<em>他手上 ' + wa.of + ' 件，你第 ' + wa.at + '</em>');
      H.push('</div>');
    }

  } else {
    /* 沒事做也只說一次。本來這裡是「廊道很安靜」加「等老師派下一個。」，
       而上面那一行已經寫著「等老師派 · 還沒有任務」——同一件事三遍。 */
    H.push('<h2>等老師派下一個。</h2>');
  }

  H.push('</div>');
  return H.join('');
}

/* ---------- 正在做 ----------

   這一張本來是「今天動的是哪一段？」加一排每天要按的鍵。
   拿掉了：兩個接觸點就夠——開始之前說幾天，做完回來交。

   所以這一頁上只有一個動作，而且它一直都在：交出去。
   底下那一句講的是狀態，不是催促——水在哪裡是行事曆決定的，
   他開不開這一頁都一樣。 */
function doingCard(t, row, st) {
  var r = row.run;
  var H = [];
  /* 任務名上面那一行（.tline）已經印了。這裡只留停很久那一句——
     它是新的，而且它只在真的停很久的時候才出現。 */
  if (st && st.level) {
    H.push('<div class="eyebrow warnx">' + esc(RULES.stallSay(st.level, st.days)) + '</div>');
  }
  /* ── 大家都填好了，可是沒有人交 ──

     每個人現在可以按「我這一份好了」先走（見 67-battle.js）。
     四個人都按完之後那一趟還是 running——東西沒有到老師手上，
     而畫面上一句話都沒說。量出來的樣子：四個人都覺得自己做完了，
     老師的清單是空的，沒有人知道少了最後那一下。

     所以這一顆會換字：還有人沒填就是「做完了」（跟以前一樣），
     全部填完就變成「交出去給老師」，而且上面說一句。

     開頭那幾天不說「還有 4 個人沒填」——那時候一個人都還沒填，
     那句話是雜訊不是提醒。要等到有人開始填了才算一件事。 */
  /* ── 填完的人跟沒填的人，看到的不一樣 ──

     本來這一段對兩個人說同一句話。實際跑出來是這樣（小美填完、
     阿哲還沒）：

       小美看到　還有 1 個人沒填自己那一份。　[做完了]
       阿哲看到　還有 1 個人沒填自己那一份。　[做完了]

     一模一樣。於是：

       小美讀到那句，不知道那個「1 個人」是不是自己——她只好再進去
       走一次同樣的六題，確認一下
       阿哲讀到那句，也不知道那個人就是他自己——他以為在等別人

     兩個人都在等對方。而這一格是這套系統收個人層資料的入口。

     所以每一個人先讀到的是自己那一半。

     ── 為什麼是「改」不是「不能按」 ──

     填完之後把鍵鎖起來是一條死路：她寫 3 天、隔天發現其實是 4 天，
     那就再也改不了。而資料層本來就允許改（actMyPart 只要 running
     就收），鎖的是畫面不是規則——那種擋法只會讓人以為系統壞了。

     所以鍵換字不換路：「改我那一份」。進去看得到自己存過的數字，
     改完再存一次。交出去之後才真的不能改（那時候老師在看了）。 */
  var pl0 = (r.plan || []).length;
  var wrote = Object.keys(r.said || {}).length;
  var left = pl0 || wrote ? partsLeft(r) : 0;
  var 我填了 = !!((r.said || {})[S.who]);
  /* 一個人一組（個人制）。那時候「大家」只有他自己，
     「還有 N 個人沒填」也永遠是 0——那幾句話要換一套。 */
  var 獨 = where('Users', function (u) {
    return inTeam(u, t.teamId) && u.role === 'student';
  }).length <= 1;
  /* 2026-09-23：這裡本來只在「大家都填完了」才給「交出去給老師」，
     其餘兩種情況只給「做完了」／「改我那一份」——資料層從來沒有真的
     擋著等全組（見 67-battle.js 的 spent／said 那兩題：「只看你名下
     那幾件，拿別人沒填來擋你是連坐」），可是畫面上只有這一句「還在等
     N 個人」，沒有一顆鍵明講「你現在就可以交」，量到的樣子是很多組
     卡在「進行中」——不是東西不見了，是每個人都以為要等別人先填完。
     三種情況現在都給同一顆「交出去給老師」，講法照實：任何一個人都
     交得出去，不用等其他人。 */
  if (wrote && !left) {
    H.push('<p class="waiting">' +
      (獨 ? '你填好了，還沒交出去。' : '大家都填好自己那一份了，還沒有人交出去。') +
      '</p>');
  } else if (我填了) {
    H.push('<p class="dim">你那一份填好了。' +
      (left ? '還有 ' + left + ' 個人沒填，你也可以先交出去，不用等他們。' : '') + '</p>');
  } else {
    if (wrote) {
      H.push('<p class="dim">' + wrote + ' 個人填好了，你還沒填自己那一份——' +
        '不過不用等所有人都填，任何一個人都交得出去。</p>');
    }
  }
  H.push(btn('交出去給老師', 'go:battle:' + r.runId, 'big'));
  /* 做到一半發現自己說少了，可以改。

     這條路本來只從戰鬥裡進得去，而且語氣是逃跑——一個學生在第三天
     發現說少了，得先按「做完了」進戰鬥再逃出來，那不是他會想做的動作。

     代價不用另外設計：走過的那幾天留在紀錄上（說 5、走了 3、重新想過），
     看得見，但不扣任何東西。改承諾不是失準，那是兩件事。 */
  /* 還能改幾次，寫在鍵上。額度用完就不畫這一顆——
     一顆按下去只會被拒絕的鍵，比沒有那一顆更吵。 */
  var left = redoLeft(r);
  if (left > 0) {
    H.push(btn(left > 1 ? '改承諾（還能改 ' + left + ' 次）' : '改承諾（最後一次）',
      'redo:' + r.runId, 'ghost'));
  }
  return H.join('');
}

/* 「哪一段比你想的久」那一排。
   「都差不多」跟其他選項一樣大——它不是逃生口，它是一個真的答案。 */
function overRow(r) {
  var picked = DRAFT.overs || [];
  var none = DRAFT.overs && !DRAFT.overs.length && DRAFT.said;
  var H = [];
  if (stepNames(r.runId).length) {
    H.push(stepLegend(r.runId, picked, 'over'));
  }
  H.push('<div class="alist">');
  H.push('<button class="ac' + (none ? ' on' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'oversame' })) + '\'><b></b>都差不多</button>');
  H.push('</div>');

/* 承諾那一頁還沒有 run，所以直接從任務上讀老師分的那幾段。
   那一排同時是兩件事：這一趟有哪幾段（範圍），
   以及點起來標「這一段會比想的久」。 */
/* 老師寫的那幾段。

   一定要回陣列：呼叫的地方直接 .map / .length，而 m.steps 是從雲端
   拿回來的（Firestore 的規則是完全開放的，見 41-sync.js）。一筆形狀
   壞掉的任務會讓接委託那一頁整個畫不出來，而那是學生走的第一頁。 */
function previewSteps(m) {
  var a = m && m.steps;
  return Array.isArray(a) ? a : [];
}

function msStepLegend(m, sel, act) {
  var a = previewSteps(m);
  if (!a.length) return '';
  var H = ['<div class="alist">'];
  a.forEach(function (x, i) {
    var on = sel && sel.indexOf(i) >= 0;
    H.push('<button class="ac' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: act + ':' + i })) + '\'>' +
      '<b style="background:' + stepHue(i) + '"></b>' + esc(x) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

/* ---------- 承諾：滑桿 ＋ 自己標哪幾件會比想的久 ---------- */
PAGES.commit = function () {
  var t = myTeam();
  var m = msOf(S.p.id);
  if (!m || m.withdrawnAt || m.notice) return '<div class="card">找不到這一個任務。</div>' + btn('回廊道', 'go:home', 'ghost');
  var 隊 = (S.queue && S.queue.length && S.queue.indexOf(m.msId) >= 0)
    ? '<p class="dim">一次開 ' + S.queueN + ' 件：這是第 ' + (S.queueN - S.queue.length + 1) + ' 件。每一件自己說幾天。</p>' : '';
  /* 他自己拆的那幾件。第一次進來用老師寫的分段當起點——
     老師沒寫就是一張白紙，那時候拆的人是他。 */
  if (!DRAFT.plan) {
    /* 預設掛在自己名下。沒有人負責的細項在回報的時候沒有人填得了，
       所以預設要是一個真的人，不是空的。 */
    DRAFT.plan = previewSteps(m).map(function (x) {
      return { n: x, d: 1, who: S.who };
    });
  }
  var plan = DRAFT.plan;
  /* ── 一步一步，不要一路往下 ──

     這一頁本來是一路捲下去的：委託人、老師排到哪天、天數、走廊、
     拆件、標記、把握、承諾。390 寬量到 2029px——**兩屏半**，而且
     委託人在第一屏底就不見了。

     交出去那一場早就不是這樣了（見 67-battle.js）：他釘在畫面上，
     一次問一件事。這一頁跟那一頁是同一個人的兩次見面，做法要一樣。

     三步：
       0　他說的那一句　　　接下來要做什麼，先聽他講
       1　你要做哪幾件　　　拆件與「哪幾段會比想的久」，可以整步跳過
       2　幾天 ＋ 有多確定　這兩樣互相決定，所以一定要在同一步上

     為什麼 2 不能再拆：拆件會改天數（列了就加總）、把握是「對這個
     天數」的把握、老師排的那一天畫在同一把尺上讓他當場比得出來。
     那三樣拆開就要來回翻，而來回翻正是這一次要修掉的東西。 */
  var st = Math.max(0, Math.min(2, Number(S.p.st) || 0));
  /* ── 算出來的那個數字是起點，不是結論 ──

     拆了件，要徑會算出一個數字（見 40-db.js 的 planDays）。可是那個
     計算只知道「誰做哪幾件、各幾天」，它不知道的事情多得是：

       乙要等甲做完才能開始（要徑假設兩個人可以同時動）
       這禮拜還有三科要交
       他們一個禮拜只碰得到一次面

     算出來 2 天、他們心裡知道是 4 天——如果那一格不能動，他們就得
     承諾一個自己不相信的數字，而判定讀的正是那個數字。那等於系統
     幫他們估，然後拿它自己估的去評他們。

     所以算出來的數字當**預設值**，那兩顆加減鍵照樣給。他改了就是他的。
     沒改就是算出來的那一個——兩種都留在紀錄上（見 actCommit 的 estCalc）。

     draft() 的第二個參數就是預設值，所以這一行同時做了兩件事：
     沒動過的時候給要徑算的，動過之後給他按出來的。 */
  var 算的 = plan.length ? planDays(plan) : 0;
  var est = plan.length ? Number(draft('est', 算的))
    : Number(draft('est', RULES.EST_DEFAULT));
  var flags = DRAFT.flags || [];

  /* 兩個階段共用這一頁：先說幾天，再選去哪裡。
     分岔放在這裡，前面那幾行（plan／est）兩邊都要用。 */


  /* 眉標是這一頁在做的事，不是這一頁上最大的那張圖。

     本來寫「這一件的委託人」——那把整頁框成一段介紹，而他打開這一頁
     是來決定要花幾天的。標題是任務名、副標是老師寫的注意事項，
     那兩行才是他要讀的東西。 */
  var H = [head('接下委託', m.title, m.note)];
  if (隊) H.push(隊);

  /* ── 委託人 ──

     他在這裡就出現，不是走到那一天才看到——他是要這件事的人，
     任務出現的那一刻他就存在了。

     「這次的委託人竟然長這樣」是這一頁最該發生的事。 */
  var pat = mobFor(m.msId, t.teamId);
  /* 第一次打開這一件的時候他才走進來。

     只記在這一次使用裡（跟圖鑑那道光同一種做法，見 markCodex）——
     每次重畫都演一次會變成雜訊，而演出只有第一次是演出。 */
  var firstLook = pat && !PAT_IN[m.msId];
  if (pat) PAT_IN[m.msId] = 1;
  /* 第 2 步不畫他的大圖了。

     他不是消失——走廊那一條的盡頭站的就是他（見 estWalk）。這一步
     他在決定一個數字，而那張大圖在這裡佔掉 450px，把尺跟走廊推到
     第二屏去。同一個人在同一頁上出現兩次，其中一次就是雜訊。 */
  if (pat && st < 2) {
    var pz = mobZone(pat);
    /* ── 一場戲，不是一張卡 ──

       一趟有兩次見到他：接下委託的時候，跟走到底交東西的時候。
       第二次早就是一場戲了（見 67-battle.js：閃一次進場、名牌、
       字幕框、他在對面呼吸）。第一次本來只是一張卡片，圖已經
       貼在上面——他沒有登場，他只是在那裡。

       所以這裡用同一套零件：.bt-wipe 閃場、.bt-plate 名牌、
       .bt-say 字幕框，全部是照面那一場的（那三個 class 沒有綁在
       .bt 底下）。兩端長得一樣，因為那是同一個人的兩次見面。

       畫的是大隻的那一張（36×24）——那張本來就是為了這種近的
       場面畫的，眼睛有瞳孔、手有指節，而且他在呼吸。 */
    /* 點不進去了。

       本來整塊是一顆鍵，點下去跳到那一位的放大頁。可是他打開這一頁
       是來決定要花幾天的——中間跳出去看一隻生物的介紹，回來還要
       重新進入狀況。要看他，圖鑑那一頁一直都在。 */
    H.push('<div class="pmt ' + pz.key + (firstLook && st === 0 ? ' enter' : '') + '">');
    if (firstLook) H.push('<div class="bt-wipe"></div>');
    H.push('<div class="pmt-ch">' + patTag(pat, pz.pal, 'bt-px', 1) + '</div>');
    H.push('</div>');
    /* 對話框。名牌長在框的左上角，跟交出去那一場同一個做法——
       兩端是同一個人的兩次見面，長相要一樣。 */
    H.push('<div class="bt-say pmt-say' + (firstLook ? ' enter' : '') + '">');
    H.push('<span class="bt-name">' + esc(pat.n) + '</span>');
    H.push('<i class="bt-arrow"></i>');
    /* 他自己的那一句（見 19-patron.js 的 PAT_SAY）。查不到才退回
       本來那一句——三十四位都寫了，這一段是給以後多加人用的。

       底下那一行還是他的形容：上面是他說的，下面是他長什麼樣。
       兩行分工，所以不用擠成一句。 */
    /* 第一次上門，跟他又來了，是兩句不一樣的話。

       他上一次站在那條路的盡頭等過你——如果他再來的時候講的是
       跟第一次一模一樣的話，那前面那一趟就等於沒有發生過。 */
    /* 他說的那一句留著——那一句在講這一件委託。

       他的形容（「他靠著的鐵件會變薄。他說那是自然的。」）拿掉了：
       那是一段關於這隻生物的介紹，跟這一件任務沒有關係，而這一頁
       要他做的判斷是「這件事要花我幾天」。那一句在圖鑑裡，
       他想知道的時候點進去看。 */
    H.push('<b>' + esc(patSay(pat, patSeen(t.teamId, pat.n) ? 'back' : 'ask') ||
      patSay(pat, 'ask') || (pat.n + ' 在等這一件。')) + '</b>');
    H.push('</div>');
    /* 「100 顆水晶」拿掉了。

       每一件委託都是同一個 100，所以那一行在每一頁上都一模一樣——
       一個永遠不變的數字不帶任何資訊，它只是佔著這一頁最上面的位置。

       真的會不一樣的是老師收下時多給的那 1–5 顆，而那個在判定頁上
       他自己看得到。 */
  }

  /* 走到第幾步。跟交出去那一場同一排點（見 58-battle.css 的 .bt-dots）
     ——同一件事在兩邊要長一樣。 */
  H.push('<div class="bt-dots">');
  for (var sd = 0; sd < 3; sd++) {
    H.push('<i' + (sd === st ? ' class="on"' : (sd < st ? ' class="done"' : '')) + '></i>');
  }
  H.push('</div>');

  /* ── 第 0 步：先聽他講 ── */
  if (st === 0) {
    H.push('<div class="row">');
    H.push(btn('這一件我接了', 'cmstep:1', 'big'));
    H.push(btn('回廊道', 'go:home', 'ghost'));
    H.push('</div>');
    return H.join('');
  }

  /* ── 第 2 步：幾天 ＋ 有多確定 ── */
  if (st === 2) {

  /* 兩顆鍵先，底下那根尺跟走廊都跟著它動。 */
  var cmU = DRAFT.estU || 'd';
  H.push('<div class="card">');
  /* 老師排到哪一天。他排的是課程的排程，不是判定——所以這裡只寫
     事實，不寫「你來不及了」那種話。走廊上那條線畫的是同一件事。 */
  var di = dueIn(m);
  if (di) {
    /* 剩不到一天要報小時，不然「還有 1 天」是假的——那句話是
       dueLeftSay 在算的，這裡本來自己又算了一次，而且算錯。 */
    H.push('<div class="dueline' + (di.past ? ' past' : '') + '">' +
      '<span>老師排到</span><b>' + esc(dueSay(m)) + '</b>' +
      '<em>' + esc(dueLeftSay(m)) + '</em></div>');
  }
  /* 兩種都給那兩顆鍵。拆了件只是先幫他算一個起點——
     那個數字是他要承諾的，所以最後一定要按得動（見上面 est 那一段）。 */
  if (plan.length) {
    H.push(estStepU(est));
    /* 這個數字是誰說的，取決於上一步有沒有拆件。

       拆了　　它是每一件加起來的，而每一件的天數只有本人按得動
               （見 55-ui.js 的 pland）——所以它是全組每一個人各自
               說的話的總和
       沒拆　　它是一個數字，誰在承諾就是誰按的——那一趟的個人層
               完全沒有資料（exportItems 是照 r.plan 一件一列的，
               沒有 plan 就沒有列）

       兩種都成立，可是它們不是同一種東西，而畫面上長得一模一樣。
       所以在這裡說出來。 */
    /* 這裡不掛標記。

       ── 為什麼 ──

       這一頁上學生真正**碰得到**的只有一格：把握。上面那個天數在
       有拆件的時候是第 2 步的加總，唯讀——它不是一個「誰來寫」的
       問題，它是一個已經發生的結果。

       本來這裡掛了一個【個人】、底下把握又掛一個【組】，於是同一頁
       上兩個標記；而沒拆件的時候兩個都是「全組一份」，變成同一句話
       講兩次（使用者回報的就是這個）。

       標記是用來回答「這一格是誰寫的」。一格一個，沒有那一格就不要
       有標記——多一個就開始要人去分辨兩個標記在講哪一格。

       那個數字從哪裡來還是要說，只是那是一句事實不是一個標記。 */
    /* ── 這個數字怎麼來的，要講對 ──

       本來寫「上面那幾件加起來的」，而相加是錯的（見 40-db.js 的
       planDays）：分工的人是同一天各做各的，四個人各說 2 天不是 8 天。

       現在是要徑——每個人自己那幾件相加，最慢的那一位決定這一趟。
       所以這一句要講得出「最慢的是誰」，不然那個數字看起來只是一個
       莫名其妙變小了的總和。

       一個人的隊（含 B 站）沒有「最慢的那一位」可言，那一句對他不成立，
       所以就照實說是他自己那幾件加起來的。 */
    /* 而且他改過之後，那一句要跟著換。

       本來那一句是用斷定的語氣講的（「所以這一趟是 2 天」）。數字變成
       按得動之後，同一句話在他按了 ＋ 之後就變成假的——畫面上寫 4 天，
       底下說「所以這一趟是 2 天」。

       所以分兩句：沒動過的時候講要徑怎麼算的；動過了就講算出來是多少、
       現在是他定的。兩句都只講事實，不評價他改得對不對。 */
    /* 這一句放在 estWhy 裡，因為按加減鍵的時候不重畫（estLive 是直接
       改 DOM）——兩邊要讀同一支，不然按完數字變了、這一句還停在舊的。 */
    H.push('<p class="dim es-why">' + estWhy(plan, est) + '</p>');
  } else {
    H.push(estStepU(est));
    /* 沒拆件：這個數字就是這一頁上唯一寫得了的東西之一，而它是組的。
       所以標記掛在這裡，底下把握那一格就不再掛（見下面）。 */
    H.push(whoTag('team', '拆件的話，天數會變成每個人各自說的', '這個數字'));
  }

  /* 決定的時候要看的東西全部畫在同一根尺上：你前幾趟說了幾天、
     實際幾天，別組這一件事說的範圍，還有準的範圍。

     本來是三張卡——三張卡量的是同一個單位，等於叫使用者自己
     在腦袋裡把它們疊起來。 */
  /* 這兩塊是天的尺——過去幾趟、準的範圍、走廊格數，全部照著
     1–21 天畫。選了小時／週的時候 est 是換算過的小數天（例如
     8 小時＝0.33 天），畫在同一根尺上只會變成一格幾乎貼底的線，
     看起來像壞掉。選了「天」以外的單位就不畫這兩塊，等他選回
     「天」再出現，不要硬畫一個誤導的版本。 */
  if (cmU === 'd') {
    var past = runsFor(t.teamId).filter(function (x) { return x.run.stamp; }).slice(-3);
    H.push(estAxis(est, past.reverse()));
    /* 拉到幾就亮幾格，擋路的那一隻站在盡頭。
       承諾是這裡唯一有阻力的選擇，它不該長得像填表。 */
    H.push(estWalk(t, m, est));
  }
  H.push('</div>');

  } else {

  /* ── 第 1 步：你要做哪幾件，每一件幾天 ──

     老師可以只丟一個大任務，拆的人是要做的那一個。他寫過分段的話
     那幾行就是起點；沒寫就是一張白紙。

     每一件預設一天，所以加一件一定會動到下一步那個數字——
     加了東西畫面沒反應是最容易讓人以為壞掉的事。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你要做哪幾件</div>');
  /* 這一張卡是混的：拆幾件、誰做哪一件，大家都改得動；**天數**只有
     本人按得動（見 55-ui.js 的 pland）。

     所以兩行並排，不寫成「全組一份，但天數例外」——那樣會把這一頁
     上真正重要的那一半塞進「例外」兩個字裡。天數是這整套系統唯一
     在收的個人層資料，它該自己站一行。 */
  H.push(whoTag('team', '', '拆幾件、誰做哪一件'));
  H.push(whoTag('one', '', '每一件幾天'));
  if (plan.length) {
    H.push('<div class="plist">');
    var waiting = 0;
    plan.forEach(function (x, i) {
      /* 同一張紙，各寫各的行（見 55-ui.js 的 pland）。
         別人那幾件看得到、按不動——跟交出去那一頁一模一樣。 */
      /* 全組一起做的那一件誰都按得動（見 55-ui.js 的 pland）。 */
      var own = !x.who || isAll(x.who) || x.who === S.who;
      /* 「還有幾件沒有本人說幾天」不算全體那幾件——那一件沒有本人，
         算進去的話那一句永遠消不掉，而它會變成一個假的待辦。 */
      if (!x.byOwn && !isAll(x.who)) waiting++;
      H.push('<div class="pl' + (own ? '' : ' theirs') + '">');
      H.push('<b style="background:' + stepHue(i) + '"></b>');
      H.push('<i>' + esc(x.n) + '</i>');
      /* 誰做這一件。點一下換下一個人。分工是一起喬的，所以這一顆
         不擋——擋的是天數，因為天數是那個人自己要說的話。

         不分組那一站不畫：每一件都是他的，那一顆按下去也只會換回
         他自己。 */
      if (!RULES.SOLO) {
        H.push('<button class="pw" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'planwho:' + i })) + '\' title="' +
          esc('點一下換人') + '">' + esc(shortWho(x.who)) + '</button>');
      }
      /* 這一件的原始數字：選過單位的印那個單位的數字，沒選過的
         （舊資料、或本來就用天填的）印 x.d，一個字都不用變。 */
      var xn = (x.dU && x.dU !== 'd' && x.dN != null) ? x.dN : x.d;
      if (own) {
        H.push('<button class="pd" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'pland:' + i + ',-1' })) + '\'>−</button>');
        H.push('<u' + (x.byOwn ? '' : ' class="wait"') + '>' + xn + '</u>');
        H.push('<button class="pd" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'pland:' + i + ',1' })) + '\'>＋</button>');
        /* 單位：跟總天數那一格同一套（小時／天／週），這裡空間窄，
           用一顆會輪著換的小鍵，不是三顆並排的籤（見 55-ui.js 的
           plandu）。 */
        H.push('<button class="pu" data-act="run" data-p=\'' +
          esc(JSON.stringify({ a: 'plandu:' + i })) + '\' title="換單位">' +
          esc(estUnit(x.dU || 'd').name) + '</button>');
      } else {
        H.push('<u class="got' + (x.byOwn ? '' : ' wait') + '">' + xn + '</u>');
        H.push('<span class="pu-fix">' + esc(estUnit(x.dU || 'd').name) + '</span>');
      }
      H.push('<button class="px-del" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'plandel:' + i })) + '\' title="' +
        esc('拿掉這一件') + '">×</button>');
      H.push('</div>');
    });
    H.push('</div>');
    /* 還有幾件沒有本人自己說過天數。不擋出發——擋了的話，一個人
       不在，整組就走不了。只是說出來，讓他們自己決定要不要等。 */
    if (waiting) {
      H.push('<p class="dim">還有 ' + waiting +
        ' 件沒有本人說幾天。出發前讓他們自己按一次，那個數字才是他的。' +
        (waiting > 1 ? '一個人填完再換下一個。' : '') + '</p>');
    }
  }
  /* ── 加一件要有一顆看得到的鍵 ──

     本來只有 Enter，而「按 Enter」寫在 placeholder 裡——他一打字那行
     字就不見了。抬起頭要找「新增」的時候，畫面上沒有任何東西可以按。
     手機鍵盤的 return 是有效的，但那要他先想到。

     ＋ 就在旁邊，跟底下那幾件的「＋」是同一顆（.pd），所以它不用學：
     那一顆在下面是加一天，在這裡是加一件。Enter 照樣留著。

     鍵出現以後 placeholder 就不用再教了——圖說得出來的事不再用字說。 */
  H.push('<div class="pl-new">');
  H.push('<input id="pl-add" placeholder="' +
    esc(plan.length ? '再一件' : '例：找到人') +
    '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();ACTS.planadd(this.value);}">');
  H.push('<button class="pd" title="' + esc('加一件') +
    '" onclick="ACTS.planadd((document.getElementById(\'pl-add\')||{}).value)">＋</button>');
  H.push('</div>');
  H.push('</div>');

  /* 老師分的段。點起來標「這一段會比想的久」——
     那一排同時就是這一趟的範圍，所以下面不用再列一次清單。 */
  /* 預測哪一段會拖，走完兩趟才開始問——手上有兩趟的紀錄，
     這個問題才答得出來，而且下一頁的「標對的段」會驗證它。 */
  var askFlag = RULES.asks('flags', depthOf(t.teamId));
  if (previewSteps(m).length && askFlag !== 'off') {
    H.push('<div class="card">');
    /* 第一次出現的時候眉標是金色的（.lit）。那就是標記——
       在視覺標記上面再加一句「新的一題」是同一件事說兩次。 */
    H.push('<div class="eyebrow' + (askFlag === 'new' ? ' lit' : '') +
      '">哪幾段會比你想的久　選填</div>');
    H.push(msStepLegend(m, flags, 'flag'));
    H.push('</div>');
  }

  /* 拆完了往下一步。沒拆也走得過去——拆件本來就是選填的。 */
  H.push('<div class="row">');
  H.push(btn(plan.length ? '就這幾件' : '不用拆，直接說天數', 'cmstep:2', 'big'));
  H.push(btn('回上一步', 'cmstep:0', 'ghost'));
  H.push('</div>');
  return H.join('');

  }

  /* 你有多確定。

     不是選填——這一格是這套系統唯一在教的東西：不是估得準，
     是知不知道自己什麼時候估不準（見 20-rules.js 的 RULES.SURE）。

     它不進判定。它決定的是廊道上你看得到多遠，以及之後那一句
     「你說『很確定』的 N 次裡，準了 M 次」。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow' + (DRAFT.sure ? '' : ' lit') + '">對這個天數，你有多確定</div>');
  /* 只有拆過件的時候才掛：那時候上面那個天數是每個人各自說的，
     所以要說清楚這一格不是——它是全組一個。

     沒拆件的話上面已經掛了一個「這個數字：全組一份」，這裡再掛一個
     就是同一句話講兩次。 */
  if (plan.length) H.push(whoTag('team', '', '這一格'));
  H.push('<div class="row sure-row">');
  RULES.SURE.forEach(function (s) {
    H.push(btn(s.name, 'sure:' + s.key, 'sure' + (DRAFT.sure === s.key ? ' on' : '')));
  });
  H.push('</div>');
  /* 這一句是換掉的，不是加上去的——原本那一句只講「看得多遠」，
     而看得多遠不是一個他會拿來做決定的東西。現在同一行講的是
     他按下去會失去什麼：說得越死，退路越少。

     不多一行字，多的是那一行字的重量。 */
  H.push('<p class="dim">說得越有把握，之後越不能改。它不影響判定。</p>');
  H.push('</div>');

  H.push('<div class="row">');
  /* 承諾完就出發，中間不再問「去哪裡」——地方是委託人帶來的，
     不是他挑的（見底下 wherePanel 那一段拿掉的理由）。 */
  H.push('<p class="dim cm-note">按下去這個數字就定了。交出來之後，比這天早或晚就是判定。</p>');
  /* 按鍵上要印他選的那個單位，不是永遠印「天」——不然選了小時，
     按鍵上還寫著「我承諾 8 天」，數字跟他剛剛按的完全對不上。 */
  var cmLabel = cmU === 'd' ? est + ' 天' : draft('estN', estUnit(cmU).def) + ' ' + estUnit(cmU).name;
  H.push(btn('我承諾 ' + cmLabel + '，出發', 'commit:' + m.msId, 'big cm-go'));
  H.push(btn('回上一步', 'cmstep:1', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 這一趟要去哪裡：拿掉了 ----------

   本來承諾完天數之後有一頁「選一個地方」，六張地方卡，每張底下印著
   住在那裡的幾位。那一頁的說法是：「他在選地方，也是在選這一趟要
   遇到誰。」

   那句話已經不成立了。委託人由**任務**決定，不由地方決定
   （見 13-strata.js 的 mobFor）——任務一派下來他就定了，
   而選地方排在那之後。所以那一頁在請他做一個決定不了任何事的選擇：

     選之前   委託人已經定了
     選之後   委託人還是同一位

   而且因果反了。正確的鏈是：老師派委託 → 委託帶著委託人來 →
   委託人帶著他住的地方來。不是挑一個地方然後看看那裡有誰，
   是有人來找你，你去他那裡。

   ── 自主性少了一塊嗎 ──

   沒有。自主性住在拆成哪幾件、各要幾天、有多確定、誰做哪一件、
   什麼時候交——那幾個每一個都改變後面發生的事。選地方不改變任何事，
   那是裝飾性的自主，而 SDT 講的自主支持指的是有意義的選擇。
   拿掉它，真正重要的那幾個反而更清楚。

   附帶一個好處：會挑的人本來永遠挑同一個地方；由委託人決定之後，
   一學期六個地方會被走遍。 */

/* ---------- 交出去 ---------- */
/* 交出去那一頁退休了：兩問搬進戰鬥（見 67-battle.js），
   那張選填的日子表搬到封存——它決定的是那一張證長什麼樣子。 */

/* 你說要走多遠。

   一格一天，亮到你拉到的那一格，擋路的那一隻站在盡頭。
   它不是另一個資訊——它是同一個數字換成你等一下真的會看到的樣子。

   承諾是這個系統裡唯一有阻力的選擇，而它本來長得像填表：
   拉一個滑桿、按一個鍵。 */
function estWalk(t, m, est) {
  return '<div class="ew">' + estWalkIn(t, m, est) + '</div>';
}

/* 只有這一段會跟著滑桿變。拆出來是為了拖的時候只換這一塊，
   不要動到滑桿本身——動到它，拖曳就斷了。 */
function estWalkIn(t, m, est) {
  /* 這一條是承諾頁上的預覽，那時候還沒選地方——用現在的。
     選完之後真正的廊道會換成他挑的那一個。 */
  var z = zoneNow(t.teamId);
  var mob = mobFor(m.msId, t.teamId);
  /* 老師排的那一天，換算成還有幾天，落在第幾格。

     換成同一個單位是重點：他按出來的格數跟老師排的那條線用的是
     同一把尺，所以「我排的比老師的長」不用讀，看一眼就知道。

     它不擋、不警告、不進判定。走廊畫到兩者之中比較遠的那一個，
     超出他承諾的那幾格是暗的——那是還沒有人走的地方。 */
  var di = dueIn(m);
  var mark = di && di.days > 0 ? Math.min(di.days, RULES.EST_MAX) : 0;
  var span = Math.max(est, mark);
  var H = ['<div class="ew-in">'];
  for (var i = 0; i < span; i++) {
    H.push('<i class="ew-c' + (i >= est ? ' off' : '') + '"></i>');
    if (mark && i + 1 === mark) H.push('<i class="ew-due"></i>');
  }
  H.push('<span class="ew-m"' + (est < span ? ' style="order:' + est + '"' : '') +
    '>' + pxTag(mob.px, z.pal, 'ew-px') + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 那個天數是怎麼來的 ----------

   拆了件才會走到這一支。三句，看兩件事：這一組是不是多人，
   以及他們有沒有把算出來的數字改掉。

   多人　沒改　要徑算的，講得出最慢的是誰
   多人　改了　算出來幾天、他們改成幾天
   一人　　　　就是他自己那幾件加起來（B 站與單人的隊）

   為什麼要分「改了」那一句：本來只有一句斷定的話（「所以這一趟是
   2 天」），而數字變成按得動之後，他按了 ＋ 那一句就變成假的——
   畫面上寫 4 天，底下說這一趟是 2 天。

   三句都只講事實，不評價他改得對不對（見 20-rules.js：系統只比對
   兩個數字，判斷是老師的事）。 */
function estWhy(plan, est) {
  var s = planSplit(plan);
  var 算的 = s.all + s.solo;
  var 慢名 = s.who ? (userOf(s.who) || {}).name : '';
  var 多人 = s.n > 1 && 慢名;

  if (est !== 算的) {
    return '算出來是 ' + 算的 + ' 天，你們改成 ' + est +
      ' 天。這一趟算 ' + est + ' 天。';
  }
  /* 有全組一起做的件：那幾天是**加上去**的，不是並行的——一起做的
     時候沒有人能同時做自己那一件。這一句要把加號講出來，不然
     「分工不會讓天數相加」那句話跟眼前的算術會互相打臉。 */
  if (s.all && s.solo) {
    return '一起做的 ' + s.all + ' 天，加上' +
      (多人 ? esc(慢名) + '那幾件' : '自己那幾件') + ' ' + s.solo +
      ' 天。一起做的要相加，各自做的取最久的。改得動。';
  }
  if (s.all) {
    return '這幾件全組一起做，加起來 ' + s.all + ' 天。改得動。';
  }
  if (多人) {
    return esc(慢名) + ' 手上那幾件加起來最久，所以先算 ' + est +
      ' 天。分工不會讓天數相加——最慢的那一位決定。改得動。';
  }
  return '上面那幾件加起來的。每一件的天數是各自按的。改得動。';
}

/* ---------- 老師回了一句：最後幾天 ----------

   這一頁只有一個動作，而那個動作是他的。

   兩個數字都攤在上面，因為這是一次協商不是一道通知：他要看得到
   自己說了什麼、對方說了什麼，然後自己按一次。維持原本那個數字
   也是一個答案——按下去那一下就是他的決定，不是他沒看到。 */
PAGES.ask = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r || !r.askAt) return '<div class="card">找不到。</div>';
  var m = msOf(r.msId);
  var u = r.askBy ? userOf(r.askBy) : null;
  var n = Number(draft('est', r.est));

  var H = [head('最後幾天', m ? m.title : '那一趟', '')];

  H.push('<div class="card">');
  H.push('<p class="quote big"><b>' + esc(u ? u.name : '老師') + '</b>' +
    nl(r.askWord || '') + '</p>');
  H.push('<p class="dim">他覺得會是 ' + r.askEst + ' 天。</p>');
  H.push('</div>');

  H.push('<div class="card">');
  /* 這裡往下協商，最後定的數字一律用「天」（估天數的單位選擇只在
     一開始承諾那一頁，見 60-student.js 的 PAGES.commit）——但這一句
     講的是「他之前說的」，那可能是用小時／週講的，要印他原始那句話，
     不然承諾 8 小時的人會在這裡看到「你說的是 0.33 天」。 */
  H.push('<div class="eyebrow">你說的是 ' + esc(estSay(r)) + '</div>');
  H.push(estStep(n));
  /* 這一句是這一頁最重要的一句。它不是客套：判定讀的是 run.est，
     而 run.est 只有這一顆鍵改得動（見 40-db.js 的 actAnswerAsk）。 */
  H.push('<p class="dim">最後幾天，你說了算。維持也是一個答案。</p>');
  H.push('</div>');

  H.push(btn('就這樣', 'asktake:' + r.runId, 'big'));
  return H.join('');
};

/* ---------- 判定結果 ---------- */
PAGES.stamp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var s = RULES.STAMPS[r.stamp];
  /* 還沒有判定就沒有東西可報。

     本來這裡直接往下讀 s.key，而 s 在那一刻是 undefined——整頁炸掉，
     畫面全白。走得到的路：那一趟還在走的時候用上一頁回到這裡，
     或是分頁停在這裡放了幾天再回來。

     炸掉的頁比一句「還沒」糟得多：他不知道是自己按錯還是壞了。 */
  if (!s) {
    return '<div class="card"><div class="eyebrow">還沒有結果</div>' +
      '<p class="dim">這一趟還在走。交出去之後才有準不準。</p></div>' +
      '<div class="row">' + btn('回廊道', 'go:home', 'big') + '</div>';
  }

  var t = myTeam();
  /* 剛走完的那一層。判定當下深度就 +1 了，所以要退一格。 */
  var zone = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var mob = mobOfRun(r);

  /* 戲在照面那一頁演完了，這裡只留報告——再把那一下重演一次是重複，
     而且那一層閃光在動畫被凍住的時候會蓋成一片白。

     但這一頁有一樣東西是照面沒有的：**跟上一趟比**。那是整套系統裡
     唯一說得出「我在變好」的地方，而它本來只是清單上的又一行。

     所以演出不落在揭曉上，落在那一行上：三行一行一行進來，
     上一趟那一行最後到，而且慢一拍。他讀完自己這一趟，
     才看到上一次的自己站在旁邊。 */
  var H = [];
  H.push('<div class="stamp-card ' + r.stamp + '">');
  /* 他怎麼樣了。準的時候舉起手，比說的久的時候撐著膝蓋喘——
     那不是懲罰的表情，他只是走得比自己想的遠。 */
  H.push('<div class="stamp-who">' +
    pxTag(r.stamp === 'late' ? HERO.pant : HERO.win, HERO.pal, 'sw-px') + '</div>');
  H.push('<div class="stamp-mark">' + stampPx(s.key) + '</div>');
  H.push('<h1>' + esc(s.name) + '</h1>');
  H.push('<dl class="rep stage">');
  /* 承諾用小時／週說的話，r.est 存的是換算過的小數天（例如
     8 小時＝0.333…）——直接印會變成一串小數，看起來像壞了。
     estSay 印他原始講的數字跟單位（見 40-db.js）。「相差」只在
     兩邊同一個單位（天）的時候才有意義，小時/週承諾就不畫這格，
     不硬算一個「+0.667」出來誤導人。 */
  H.push('<dt style="--d:0ms">你的規劃</dt><dd style="--d:0ms">' + esc(estSay(r)) + '</dd>');
  H.push('<dt style="--d:260ms">實際</dt><dd style="--d:260ms">' + r.actual + ' 天</dd>');
  if (!r.estU || r.estU === 'd') {
    H.push('<dt style="--d:520ms">相差</dt><dd style="--d:520ms">' +
      (r.actual - r.est > 0 ? '+' : '') + (r.actual - r.est) + '</dd>');
  }

  /* 上一趟差幾天。「我在變好」這件事本來沒有任何地方說得出口，
     而它只需要兩個數字。不寫「比上一趟準」那種結論——
     兩個數字並排，結論他自己下。 */
  var prev = null;
  runsFor(t.teamId).forEach(function (x) {
    if (x.run.runId === r.runId) return;
    if (!x.run.stamp || !x.run.actual) return;
    if ((x.run.submittedAt || 0) >= (r.submittedAt || 0)) return;
    if (!prev || (x.run.submittedAt || 0) > (prev.submittedAt || 0)) prev = x.run;
  });
  if (prev) {
    /* 慢一拍。他讀完自己這一趟，才看到上一次的自己站在旁邊。 */
    H.push('<dt style="--d:900ms">上一趟相差</dt><dd class="dim" style="--d:900ms">' +
      (prev.actual - prev.est > 0 ? '+' : '') + (prev.actual - prev.est) + '</dd>');
  }

  /* 承諾的時候標的那幾段，跟實際比較久的那幾段，對到幾個。
     兩份資料本來就都在（flags 與 overs），只是從來沒有比對過。
     沒標過就整行不出現。

     ── 從這裡起是另一份清單 ──

     上面那四行是排過拍子進來的（見 .rep.stage）。底下這幾行沒有拍子，
     如果留在同一個 dl 裡，它們的 delay 是 0——會**比「上一趟相差」
     還早出現**，整個順序就亂了。

     所以在這裡收掉，另開一份。演出只給那四個數字，這幾行直接在。 */
  H.push('</dl>');
  H.push('<dl class="rep">');
  var fl = r.flags || [];
  if (fl.length) {
    var hit = 0;
    fl.forEach(function (i) { if ((r.overs || []).indexOf(i) >= 0) hit++; });
    H.push('<dt>標對的段</dt><dd>' + hit + '/ ' + fl.length + '</dd>');
  }
  var ov = (r.overs || []).map(function (i) { return stepName(r.runId, i); })
    .filter(Boolean);
  /* 本來是「上之前你說：訪談 比想的久」。「上之前」是舊的營火流程
     留下來的詞（上傳之前），沒用過的人看不懂；而「比想的久」擠在
     值後面，等於問題跟答案黏成一句。

     改成標籤問、值答：哪幾段比想的久 → 訪談、整理逐字稿。 */
  H.push('<dt>哪幾段比想的久</dt><dd class="s">' +
    (ov.length ? esc(ov.join('、')) : '都差不多') + '</dd>');
  if (r.hard) H.push('<dt>卡在哪裡</dt><dd class="s">' + esc(r.hard) + '</dd>');
  if (r.pace) H.push('<dt>你覺得的進度</dt><dd class="s">' + esc(r.pace) + '</dd>');
  H.push('</dl>');
  H.push(estBar(r.est, r.actual, false, estSay(r)));
  H.push('</div>');

  H.push('<p class="duel-t">' + esc(mob.n) + '讓開了。</p>');

  /* 「去圖鑑看看」那一句拿掉了——圖鑑那一頁不在主流程上，整個拿掉了。 */
  H.push(btn('回廊道', 'sawstamp:' + r.runId, 'big'));
  return H.join('');
};

/* ---------- 營火 ----------
   問的是他們自己清單上的哪一件比想的久。系統不列「卡關的原因」。 */

/* ---------- 封存 ----------

   走完一趟，那一趟的紀錄長成一張任務之證。形狀完全由那一趟決定：
   一天兩列，來過是實心、說了沒動是空心、沒有紀錄是斷的，
   長度就是這一趟過了幾天。

   這一頁真正給他的東西是「他沒見過的那個形狀」——同一份數字，
   換成一個看得到的樣子。取名選填，他不取一樣封存得下來。 */

/* 選方向那張小地圖拿掉了：占地那一下改在全班那張圖上做。
   地圖是動手的地方，不是一個看的頁面。 */

/* ---------- 大躍進 ---------- */
/* 大躍進那一頁退休了：「水晶變了」搬到班級地下城（那才是新的一層
   實際發生的地方），其餘只是一句「去看看那一層」。 */

/* ---------- 出口 ----------

   這一頁是整個系統唯一的結尾。它不打分、不總評，只把他自己留下的
   紀錄攤開來：每一趟說幾天走幾天、走過哪幾層、留下哪幾句。

   「規劃妥善」不是開門的條件，是走出去的時候帶著的東西——
   同一道門，不同的故事。 */
PAGES.exit = function () {
  var t = myTeam();
  var e = exitRecord(t.teamId);
  var out = !!t.leftAt;
  /* 早不算準（跟排行榜同一條規矩，見 68-rank.js）。 */
  var hit = e.acc.exact || 0;

  var H = [head(out ? '地面' : '出口',
    out ? '你出去了' : '這個專案做完了？',
    out ? '' : '把專案做完，說一聲。')];

  /* 離場的演出。角色沿著那道光往上走出畫面。

     這是一學期的終點，比任何一次交出去都重——而交出去有一整場戰鬥，
     出去本來只是換一頁。

     動畫只加東西不當閘門：時鐘被凍住的時候人停在井底，還是看得見。 */
  if (out) H.push(exitScene(t));

  if (out && t.exitWord) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
      '<p class="quote">' + nl(t.exitWord) + '</p></div>');
  }

  /* ── 一 · 你的估算 ──

     這一頁的主角。本來「準了幾次」埋在第一張卡的中段，而它是
     這個系統一整個學期在量的唯一一件事。 */
  if (e.acc.total) {
    H.push('<div class="card exsum">');
    H.push('<div class="eyebrow">你的估算</div>');
    H.push('<p class="ex-big"><b>' + e.acc.total + '</b> 趟裡，準了 <b>' +
      hit + '</b> 次</p>');
    H.push(accBar(e.acc));
    H.push('</div>');
  }

  /* 一個學期的形狀。一趟一個，說幾天 → 實際幾天。
     本來這裡有兩張卡在做同一件事：一張逐條畫尺，一張排記號架。 */
  H.push(runStrip(t, 1));

  /* ── 二 · 你走過的地方 ── */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你走過的地方</div>');
  H.push('<div class="outnum">');
  H.push('<div><b>' + e.days + '</b><span>來過的天數</span></div>');
  H.push('<div><b>' + e.depth + '</b><span>走到第幾層</span></div>');
  /* 走了幾圈。六層一圈，第七趟回到第一層——
     無盡輪迴的設定在終點最該被說一次。 */
  if (e.cycles) H.push('<div><b>' + e.cycles + '</b><span>走過的輪迴</span></div>');
  H.push('</div>');
  if (e.zones.length) {
    H.push('<div class="zones">');
    e.zones.forEach(function (z) {
      var c = faunaOf(z.key)[0];
      H.push('<div class="zn ' + z.key + '">');
      if (c) H.push(pxTag(c.px, z.pal, 'zn-px'));
      H.push('<b>' + esc(z.name) + '</b>');
      H.push('</div>');
    });
    H.push('</div>');
  }
  H.push('</div>');

  /* ── 三 · 說一聲 ── */
  if (!out) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">說一聲</div>');
    H.push('<div class="row">');
    /* 這一頁只有在門開了之後進得來（廊道上那一扇鎖著），
       所以這裡就是最後那一下：上去。按的人是他們自己——
       走出去該是他們的動作，不是老師代勞的。 */
    H.push(btn('上去', 'leave', 'big'));
    H.push(btn('回廊道', 'go:home', 'ghost'));
    H.push('</div></div>');
  } else {
    H.push(btn('回廊道', 'go:home', 'ghost'));
  }
  return H.join('');
};

/* ---------- 走過的每一趟 ---------- */
/* 紀錄那一頁併進任務清單了：兩頁幾乎是同一份資料。
   下面那一支 logRow 留著——任務清單在用。 */
/* 一列一趟。牠在最左邊，資訊在右邊，點開才看細節。 */
/* ---------- 老師派的任務，可以同時做 ----------

   2026-09-30：首頁只推一件事（nextThing），手上有事就不遞新的——
   結果老師派了兩件，第二件按不到。9/29 第一版只在任務清單裡補了一區，
   學生還是要先找到任務清單。要的是「進行中也能開別件、老師派的可以
   一次開好幾件」，所以不藏在別頁，直接列在首頁主要動作的下面：
   每一件老師派的、還沒做完的，各自一顆鍵。

   一件一顆：還沒說幾天的「開始」，已經在做的「交出去」。每一件走自己的
   承諾頁、自己的判定，互不影響（資料層本來就不擋，見 actCommit）。
   首頁上主要的動作仍然只有一個（大的那顆），這裡都是次要的鍵。

   兩件以上還沒說幾天的時候多一顆「一次開這 N 件」：一件一件接著說幾天，
   每一件還是自己說、自己按（見 55-ui.js 的 commitall）。不是替他們
   一次填掉——每一件要說幾天，是那一件自己的事。

   nx 是 nextThing 的結果：只有「在做」和「有任務發來了」這兩種狀態才列，
   其他狀態（等看判定、被退回、等老師）該先處理眼前那一件。 */
function parallelRows(t, nx) {
  if (!nx || (nx.kind !== 'doing' && nx.kind !== 'commit')) return [];
  var 主 = nx.row ? (nx.row.run.runId || nx.row.ms.msId) : '';
  return runsFor(t.teamId).filter(function (x) {
    var 身分 = x.run.runId || x.ms.msId;
    if (身分 === 主) return false;
    return x.run.state === 'fresh' || x.run.state === 'running';
  });
}
function parallelCard(t, nx) {
  var 別件 = parallelRows(t, nx);
  if (!別件.length) return '';
  var H = ['<div class="card"><div class="eyebrow">也可以同時做</div>'];
  別件.forEach(function (x) {
    H.push(x.run.state === 'fresh'
      ? btn('開始：' + x.ms.title, 'go:commit:' + x.ms.msId, 'ghost')
      : btn('交出去：' + x.ms.title, 'go:battle:' + x.run.runId, 'ghost'));
  });
  /* 還沒說幾天的（含首頁上大鍵那一件）兩件以上，才有「一次開」。 */
  var 沒開 = 別件.filter(function (x) { return x.run.state === 'fresh'; }).length +
    (nx.kind === 'commit' ? 1 : 0);
  if (沒開 >= 2) H.push(btn('一次開這 ' + 沒開 + ' 件，一件一件說幾天', 'commitall', 'ghost'));
  H.push('</div>');
  return H.join('');
}

function logRow(m, r, t) {
  if (!m) return '';
  var open = DRAFT.lg === r.runId;
  var z = STRATA[0];
  STRATA.forEach(function (q) { if (q.key === r.zone) z = q; });
  var mob = mobOfRun(r);
  var s = r.stamp ? RULES.STAMPS[r.stamp] : null;
  var kp = null;
  keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });

  /* 收起來的那一列本來還有一行「老師回的話」。字放大之後那一行只剩
     八個字加刪節號，而完整的那一句點開就在下面——所以不放了。 */

  /* 用 div 不用 button：<button> 上的 grid／flex 在 Chromium 不完整生效
     ——內容會被包進一個匿名區塊，第一個子元素因此被收縮成內容寬，
     標題就變成一個字一行。role 與 tabindex 補回鍵盤與輔助工具。 */
  var H = ['<div role="button" tabindex="0" class="rec pressable' + (open ? ' open' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'lgopen:' + r.runId })) + '\'>'];

  /* 直接排在格線上，不要再包一層。<button> 裡面包巢狀區塊的時候，
     第一個子元素會被收縮成內容寬（標題變成一個字一行）。 */
  H.push('<span class="rec-px">' + pxTag(mob.px, z.pal, '') + '</span>');
  H.push('<b class="rec-t">' + esc(m.title) + '</b>');
  /* 走的那幾天，以及老師排到哪一天。清單是他確認「還有哪幾件、
     哪一件先做」的地方，而老師排的那一天正是他排順序時要用的事實。 */
  H.push('<span class="rec-d">' + esc(dayText(r.committedAt)) +
    (r.submittedAt ? ' – ' + esc(dayText(r.submittedAt)) : '') +
    (m.due ? '<i class="rec-due">老師排到 ' + esc(dueSay(m)) + '</i>' : '') +
    '</span>');

  H.push('<span class="rec-s' + (r.stamp ? ' ' + r.stamp : ' none') + '">');
  if (s) {
    H.push(stampPx(s.key));
  } else {
    var st2 = r.state === 'submitted' ? '等老師'
      : r.state === 'back' ? '退回'
      : r.state === 'rethought' ? '重想'
      : r.state === 'running' ? '進行中'
      : '';
    if (st2) H.push('<i class="rec-st">' + st2 + '</i>');
  }
  H.push('</span>');
  H.push('</div>');

  /* 點開才出現的細節。收起來的時候整列兩秒看得完。 */
  if (open) {
    H.push('<div class="rec-more">');
    if (r.stamp) {
      H.push(estBar(r.est, r.actual, false, estSay(r)));
      H.push(dayStrip(t.teamId, r.runId));
    } else {
      H.push('<p class="dim">這一趟重新想過。說 ' + esc(estSay(r)) + '，走了 ' +
        (r.went || 0) + ' 天之後退回去重新說。</p>');
    }
    var sp = stepsOf(r.runId);
    if (sp) {
      /* 寫死「老師分的段」是錯的：stepsOf 先拿的是他們自己拆的那幾件
         （見 40-db.js），只有沒拆的時候才退回老師分的。 */
      H.push('<div class="tags small"><span class="k">' +
        (sp.from === 'mine' ? '你們拆的那幾件' : '老師分的段') + '</span>');
      sp.all.forEach(function (q, i) {
        H.push('<span class="tag static' + (sp.on.indexOf(i) >= 0 ? ' hit' : '') +
          '">' + esc(q) + '</span>');
      });
      H.push('</div>');
    }
    var ov = (r.overs || []).map(function (i) { return stepName(r.runId, i); })
      .filter(Boolean);
    if (ov.length) {
      H.push('<div class="tags small"><span class="k">比想的久</span>');
      ov.forEach(function (l) { H.push('<span class="tag static hit">' + esc(l) + '</span>'); });
      H.push('</div>');
    }
    /* 那一趟談過的話。他自己回頭看的時候，「我一個人說幾天」跟
       「談過之後訂幾天」是兩個不同的數字——而那個差距就是他在學的東西。 */
    H.push(negoLine(r, true));
    if (r.hard) H.push('<p class="quote"><b>卡在哪裡</b>' + nl(r.hard) + '</p>');
    if (r.pace) H.push('<p class="quote"><b>你覺得的進度</b>' + nl(r.pace) + '</p>');
    if (r.word) H.push(wordBlock(r, 'tw'));
    H.push('</div>');
  }
  return H.join('');
}

/* 點開／收起來。一次只開一列。 */
ACTS.lgopen = function (id) {
  DRAFT.lg = DRAFT.lg === id ? null : id;
  render();

/* ---------- 這一圈走到哪 ----------

   死線勇者的迴圈是四拍，而且它一直讓你知道現在是哪一拍。
   這裡四拍就是那四件事：承諾天數 → 進行任務 → 回報進度 → 完成紀錄。

   本來每一拍上面還掛一個世界觀的詞（準備／遠征／戰報／營地），
   底下再寫一次白話。同一件事講兩次，而先講的那一次是聽不懂的那一次。

   畫成環不是條：這座地下城是無盡輪迴的，四拍走完回到第一拍。
   所以它沒有百分比、沒有終點，也不可以有。 */
var BEATS = [
  { k: 'prep', s: '承諾天數' },
  { k: 'away', s: '進行任務' },
  { k: 'rep',  s: '回報進度' },
  { k: 'camp', s: '完成紀錄' }
];

/* 這一圈走到哪。

   本來最後一行是「其他狀態就看 claimsOf」，而 claimsOf 是一個
   只增不減的計數器——所以第一次完成之後，「承諾天數」那一拍
   永遠被畫成「完成紀錄」。每一拍現在都由狀態直接決定。 */
function beatAt(next, t) {
  var k = next.kind;
  if (k === 'doing') return 'away';
  if (k === 'submit' || k === 'stamped' || k === 'review') return 'rep';
  if (k === 'left' || k === 'waitexit') return 'camp';
  return 'prep';
}

function beatBar(next, t) {
  var at = beatAt(next, t);
  var H = ['<div class="cyc">'];
  BEATS.forEach(function (s, i) {
    H.push('<span class="cy' + (s.k === at ? ' on' : '') + '">' +
      '<b>' + esc(s.s) + '</b></span>');
    if (i < BEATS.length - 1) H.push('<span class="cyd"></span>');
  });
  /* 最後接回第一拍。走完不是結束，是再一圈。 */
  H.push('<span class="cyd loop"></span>');
  H.push('</div>');
  return H.join('');
}

/* ===== 61-scene.js ===== */
/* 廊道的場景。

   之前這裡是一條進度條：角色 → 幾個方格 → 魔物。它讀得懂，但它是圖表。
   這一支把它改成一個地方——有洞口、有天花板、有地板、有水晶、有火把，
   角色站在裡面而不是站在旁邊。

   幾件事是有意義的，不是裝飾：

     火把    一天一盞。推進幾次，走廊就亮幾盞——「你來過幾次」畫出來的樣子。
     腳印    走過的每一格留一個。走廊上唯一的歷史，而且它不算分。
     迷霧    從你站的地方往前蓋住。往前走一格，霧就退一格。
     魔物    藏在霧裡，越靠近越清楚。它不是敵人，是這一趟要交的東西。

   還有一件事是刻意不做的：走廊上沒有任何「你應該走到哪」的記號。
   沒有基準線，就沒有落後這回事。 */

/* 上一次畫的時候，每一組走到哪。只活在這一次使用裡——
   往前了才讓整隊滑進來一格（見 scene 裡的 stepped）。 */
var WALKED_AT = {};
/* 上一次畫的時候是走著還是坐著。換了才放一次坐下／站起來。 */
var POSE_AT = {};

var SCN = {
  TILE: 44,     /* 一天一格 */
  ENT: 132,     /* 洞口那一段 */
  END: 154,     /* 魔物站的那一段 */
  H: 286,       /* 場景高 */
  FLOOR: 66,    /* 地板上緣離底部多高——站在地上的東西都用這個 */
  /* 最窄的那一條走廊。320 的螢幕上量出來的 284——廊道不會橫向捲，
     超過這個數字的東西就是看不到。休息的隊形靠它算得下幾個人。 */
  NARROW: 284
};

/* 一條走廊。

     t     這一組
     row   現在在跑的那一個 run（可能沒有）
     st    停滯狀態 */
/* 洞口有多寬。本來每留下一個記號就寬一點，記號系統拿掉之後它是一個
   固定的數字。這一支留著是因為場景裡到處拿它算位置。 */
function entOf(teamId) {
  return SCN.ENT;
}

function scene(t, row, st, kind) {
  var ENT = entOf(t.teamId);
  var run = row && row.run;
  /* 還沒承諾任何事的時候給一段像樣的空廊道。
     第一次打開是印象最深的一次，本來它只有一格，看起來像壞掉的。 */
  var est = run ? (run.est || 1) : 7;

  /* 一條軌道，兩個東西在上面：
       moved   你來過幾天——按一下才往前一格
       tide    走廊要畫幾格。它不是「過了幾天」——dayLog 至少會排滿他
               承諾的天數（走廊要有長度），所以剛承諾的那一趟 log 就有
               四格，而過了零天。
       gone    真的過了幾天。從承諾那一天算到現在（交出去的話算到那天）。*/
  var log = run ? dayLog(run.runId) : [];
  var moved = 0, i0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'move') moved++;
  var done = run && run.state !== 'running';
  if (done) moved = Math.max(moved, run.pushes || 0);
  var tide = Math.min(log.length, est + 2);
  /* 本來底下那一行印的是 tide，所以今天剛承諾就寫「已經過了 4 天」。
     那是走廊的格數被當成日子講。 */
  var gone = run && run.committedAt
    ? daysBetween(run.committedAt, run.submittedAt || now()) : 0;
  /* 角色走到哪，看日曆不看他按了幾次——不每天開的人，角色本來會
     永遠站在洞口，看起來像壞掉。

     按一下留下的是痕跡（那一格的火把、腳印、那天動的是哪一件），
     不是位置。來過有記號，沒來也不會被擋住。 */
  var walked = Math.min(gone, est);

  /* 每一格頭上掛的是那一天動的是哪一段。廊道因此讀得出形狀——
     七格同一個顏色跟七格五顏六色，是完全不同的一趟。 */
  var byTile = [];
  var k0 = 0;
  for (i0 = 0; i0 < log.length; i0++) {
    if (log[i0] && log[i0].kind === 'move') byTile[k0++] = log[i0].step;
  }
  var rests = 0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'rest') rests++;

  var seed = t.teamId + (run ? '|' + run.runId : '');
  /* 光有兩個來源，取比較暗的那一個：
       把握    他說「不太確定」，本來就看不遠
       停滯    過了自己說的天數，火會滅

     所以說「很確定」也不會讓停滯看起來沒事——它只決定起點。 */
  var sureLv = run ? ((RULES.sureOf(run.sure) || {}).light || 0) : 0;
  var light = WORLD.light[Math.max(st.level, sureLv)];
  /* 往前多畫幾格。本來只畫到承諾與過了幾天的較大者，所以拖到底就
     沒東西了。多出來的那幾格在霧裡，看不出有什麼——
     那才是還沒走到的地方該有的樣子。 */
  var AHEAD = 5;
  var span = Math.max(est, tide);          /* 這一趟的長度 */
  var draw = span + AHEAD;                 /* 畫到哪裡（多的在霧裡） */
  var W = ENT + draw * SCN.TILE + SCN.END;
  /* 走到多深，牆、地板、天花板、地上的東西、擋路的那一隻，全部跟著換。
     世界觀不寫在說明裡，寫在牆上。 */
  /* 這一趟他自己選的地方。沒有正在跑的那一趟就用現在的深度算，
     那是「還沒出發」的畫面。 */
  var zone = run && run.runId ? zoneOfRun(run, t.teamId)
    : strataAt(depthOf(t.teamId), t.teamId);

  /* 三個狀態掛在最外層。裡面每一層（遠牆、流線、火、角色）都靠
     它決定要不要動——一個地方決定，不會有兩層各自算出不同答案。 */
  /* 任務開始＝按下承諾，不是老師派下來。派了但還沒承諾的時候
     他還坐在火邊——那正是「還沒出發」。

     fresh 的那一趟 runsFor 會給一個 runId 是 null 的空殼，所以
     判斷要看 run.runId 不是 run。 */
  /* 打完那一隻，這一趟就結束了——回報交出去的那一刻牠倒下，
     之後不管是等判定還是等老師，都是在等，而等的姿勢是坐著。
     本來這兩個處境是站著的，那看起來像還沒走完。

     退回是唯一一個把他叫回路上的狀態：牠站起來，他也站起來。 */
  var walking = st.level < 2 && (kind === 'doing' || kind === 'back');
  var going = !!(run && run.runId);
  var resting = st.level < 2 && !walking &&
    (!going || kind === 'idle' || kind === 'left' || kind === 'waitexit' ||
      kind === 'stamped' || kind === 'review');
  /* 剛按下承諾那一下。go() 會清掉 DRAFT，所以旗子放在 S 上。 */
  var launch = !!S.launch;
  /* ── 昨天站在哪 ──

     角色的位置是日曆算出來的，不是按出來的。所以隔天再打開，
     整隊人直接出現在前面一格，沒有走過去的過程——「又過了一天」
     這件事只剩下卡片上的一行字。

     記住上一次畫的時候站在哪，往前了就讓整隊滑進來（.stepped）。
     只記在這一次使用裡：重新整理不會再放一次，那不是「又過了一天」。

     一次最多滑三格。離開一個禮拜再回來，滑七格會變成一段動畫表演，
     而它要說的只是「你不在的時候，隊伍往前了」。 */
  /* ── 姿勢換了 ──

     走著變成坐著，是一整隊人停下來這件事。本來它沒有過程：
     上一次重畫還在走，這一次直接坐在火邊了。

     跟往前那一格同一種做法——記住上一次的姿勢，換了才放一次。
     坐下是往下沉一段再落地，站起來是反過來。 */
  var pose = walking ? 'walk' : resting ? 'rest' : '';
  var wasPose = POSE_AT[t.teamId];
  var satdown = st.level < 2 && wasPose === 'walk' && pose === 'rest';
  var stoodup = st.level < 2 && wasPose === 'rest' && pose === 'walk';
  POSE_AT[t.teamId] = pose;

  var seenKey = t.teamId;
  var was = WALKED_AT[seenKey];
  /* 睡著的時候不滑。那個狀態的意思是很多天沒有人動過，
     讓他滑進來等於在說一件沒發生的事。 */
  var stepped = st.level < 2 && was !== undefined && walked > was;
  var fromPx = stepped ? -Math.min(3, walked - was) * SCN.TILE : 0;
  WALKED_AT[seenKey] = walked;

  var H = ['<div class="scn ' + light.key + ' z-' + zone.key +
    (walking ? ' walking' : '') + (resting ? ' resting' : '') +
    (stepped ? ' stepped' : '') +
    (satdown ? ' satdown' : '') + (stoodup ? ' stoodup' : '') +
    (launch ? ' launch' : '') + '" style="--from:' + fromPx + 'px">'];
  /* 出發那一下：一道白光掃過去，加上一句大字砸在正中間。

     這是整個流程裡唯一一個「從現在開始」的時刻——之前他在營火旁邊
     坐著，之後他在走。中間那一下要有聲音，不然兩個狀態之間只是
     畫面換了。

     字砸下來的時候廊道上那幾行小字（第幾天、牌子、角落那一塊）
     一起收起來：一次只講一件事，而且這樣它們也不會跟大字疊在一起。 */
  if (launch) {
    H.push('<div class="scn-launch"></div>');
    H.push('<div class="scn-go"><b>任務開始</b></div>');
  }


  /* 固定在角落的深度。走廊往旁邊捲，它不跟著捲——
     那是「你在多深的地方」，不是走廊上的一個位置。 */
  H.push('<div class="scn-hud">' +
    '<em>' + esc(zone.name) + '</em>' +
    '<b>' + (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</b>' +
    '<span>走到 ' + depthOf(t.teamId) + ' 個任務</span>' +
    /* 站得住的：老師收下才算。走是他自己的事，留下來是要有人看過的事。 */
    /* 地層的那一句說明拿掉了。它不會變、也不影響任何決定，卻是這塊
       面板上最高的一段（198×112）——把面板擐進角色活動的區域，
       壓到委託人的名牌跟你頭上那塊牌子。

       這塊面板要說的是「你在哪、多深」，不是地質。
       那一句在故事那張地圖跟門口的地層卡上都還在。 */
    '<span class="hud-seal">站得住 ' + sealedDepth(t.teamId) + ' 個</span></div>');

  /* 釘在框上、不跟著捲的兩層：近景的岩石與暗角。

  H.push('<div class="scn-frame"></div>');

  H.push('<div class="scn-scroll"><div class="scn-in" style="width:' + W + 'px">');

  /* 最後面那一層：更暗的磚與支撐柱。廊道不是一片牆，它有深處。 */
  /* 會往前捲的那幾層。由遠到近：底、遠牆、頭上的岩、地面的流線。

  H.push('<div class="scn-bg" style="width:' + W + 'px"></div>');
  H.push('<div class="scn-far" style="width:' + W + 'px"></div>');
  /* 前進中才會動的兩層：遠牆慢、地面的流線快。兩層速度不一樣，
     「往前」才有深度——一層一起動看起來是整張圖在滑。 */
  H.push('<div class="scn-rush" style="width:' + W + 'px"></div>');

  H.push('<div class="scn-ceil" style="width:' + W + 'px"></div>');

  H.push(sceneAir(seed, zone, W));

  /* ── 天花板：鐘乳石 ── */
  for (var d = 0; d < Math.ceil(W / 44); d++) {
    var dp = dripFor(seed, d);
    if (!dp) continue;
    H.push('<span class="drip" style="left:' + (d * 44 + dp.off) + 'px">' +
      pxTag(dp.px, zone.pal, '') + '</span>');
  }

  H.push(sceneMouth(t, { kind: kind, run: run }, ENT, resting));

  /* ── 地板 ── */
  H.push('<div class="floor" style="left:0;width:' + W + 'px"></div>');
  if (walked > 0) {
    H.push('<div class="floor lit" style="left:' + ENT + 'px;width:' +
      (walked * SCN.TILE) + 'px"></div>');
  }

  /* 火把不跟著這個迴圈直接吐出去——它們要進自己那一層（見下面）。 */
  var TOR = [];
  for (var i = 0; i < span; i++) {
    var x = ENT + i * SCN.TILE;
    var on = i < walked;

    TOR.push(torchAt(i * SCN.TILE + 6, on, i));

    if (on) H.push('<img class="px foot" style="left:' + (x + 11) + 'px" src="' +
      pxSvg(STEP_PX.px, STEP_PX.pal, false) + '" alt="">');

    if (on && byTile[i] >= 0) {
      H.push('<span class="doing" style="left:' + x + 'px;background:' +
        stepHue(byTile[i]) + '" title="' + esc(stepName(run.runId, byTile[i])) +

    if (on) {
      var p = propFor(seed, i, zone.key);
      if (p === 'rubble') H.push('<img class="px prop rubble" style="left:' + (x + 5) +
        'px" src="' + pxSvg(RUBBLE.px, zone.pal, false) + '" alt="">');
      if (p === 'crystal') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(CRYSTAL.px, zone.pal, false) + '" alt="">');
      if (p === 'shroom') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(SHROOM.px, zone.pal, false) + '" alt="">');
      if (p === 'bolt') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(BOLT.px, zone.pal, false) + '" alt="">');
      if (p === 'ember') H.push('<img class="px prop shr" style="left:' + (x + 22) +

    }
  }

  /* ── 牆上那一排燭火 ──

     它們釘在牆上，牆會往後退，所以它們也要往後退——本來整排是釘死的，

     右邊多畫四盞填補捲走的那一段，整層裁在洞口，捲過去的不會跑到
     營火上面。 */
  for (var iX = span; iX < span + 4; iX++) TOR.push(torchAt(iX * SCN.TILE + 6, false, iX));
  H.push('<div class="scn-lamps" style="left:' + ENT + 'px;width:' + (W - ENT) +
    'px"><div class="lamps-in">' + TOR.join('') + '</div></div>');


  /* 蓋在走廊上的兩條天數標記都拿掉了：

       .vow   一條金色虛線，天花板拉到地板，畫在「你說的那一天」
       .tide  一片藍色的水，橫著漲過去，畫的是「過了幾天」

     在走，跟他走過的痕跡——這一段全力交給那個動畫。

     數字在廊道底下那一行用字講：N 你來過、N 過了幾天、N 你說的。
     而「你說的那一天」上面還站著擋路的那一隻——牠不是一條線，
     是一個東西，而且要走到了才看得到。

  /* 牠站在你說的那一天，不動。

     所以你永遠追不上，也永遠不會走過牠。 */
  /* 牠只在走到底之後出現：走滿了自己說的天數，或者這一趟已經交出去。

  var arrived = metRun(run);

  var handed = !!(run && (run.state === 'judged' || run.state === 'submitted' ||

     有東西的時候先讓那塊岩壁看起來不一樣——只給「那裡有東西」，

  if (buriedAt(t.classId, t.teamId, depthOf(t.teamId))) {
    H.push('<div class="ahead" style="left:' +
      (ENT + (span + 2) * SCN.TILE) + 'px"><i></i></div>');
  }

  /* ── 角色 ── */
  /* ── 他在做什麼，就長成什麼樣子 ──

       交出去、等老師　坐著　東西送到了，這一趟結束，回火邊

       很多天沒動　　　睡著

     讓它坐著（見上面 resting 那一段）。兩邊對不上很久了，改表配code，

     才是原本真正的設計意圖。 */
  /* walking／resting 在最上面算過了。 */
  /* 火釘在洞口的 left:11，寬 44。人坐在火的右邊一點。 */
  var hx = resting ? 44 : ENT + walked * SCN.TILE - 11;

     二 · 相位。腳步照隊伍順序一個個晚一拍——那是一列人在走。

     三 · 間距。等距的一排是輸送帶。每個人偏 -11／0／+11，
          偏多少由他的 id 決定，所以同一個人每次都站在同一個位置。

          不對齊格子的偏移只會看起來像沒對準。

          排在最後面的人蓋在最前面的人身上。 */
  var mates = where('Users', function (u) {
    return inTeam(u, t.teamId) && u.userId !== S.who;
  });
  /* 後面放得下多寬。放不下就整隊縮，縮到 22 為止——
     人多的時候擠在一起，好過有人被推到牆外面。

     休息的時候人排在你右邊。那一邊看起來很寬，但廊道不會橫向捲，
     所以能用的只有最窄那一條的寬度——六個人在 320 的螢幕上，
     本來最後兩個會被切在畫面外。 */
  var room = resting
    ? Math.max(0, SCN.NARROW - hx - 66)
    : Math.max(0, hx - 6);
  var gap = SCN.TILE;
  if (mates.length) {

    if (gap < 22) gap = 22;
  }

  var sway = gap >= SCN.TILE ? 11 : 0;
  var acc = 0;
  var line = mates.map(function (mu, i) {
    acc += gap + (sway ? (hash(mu.userId) % 3 - 1) * sway : 0);

      u: mu,
      x: resting ? (hx + acc) : Math.max(6, hx - acc),
      /* 腳步：往隊伍後面一個個晚一拍。呼吸：各自散開。 */
      md: (i + 1) * 110,
      bd: hash(mu.userId + 'b') % 7 * 200,
      /* 坐著的時候換幀的快慢。走路是一起踏的，呼吸不是——
         一群人坐在火邊同一個節奏起伏，看起來像同一個人複製了五份。 */
      bt: [1500, 1900, 2300][hash(mu.userId + 't') % 3]
    };
  });
  /* 最遠的先畫。 */
  line.reverse().forEach(function (p) {
    var mh = heroOf(p.u);
    H.push('<div class="hero scn-mate' + (st.level >= 2 ? ' asleep' : '') +
      (walking ? ' walking' : '') + (resting ? ' resting' : '') +
      '" style="left:' + p.x + 'px;--md:' + p.md + 'ms;--bd:' + p.bd +
      'ms;--sd:' + p.md + 'ms;--bt:' + p.bt + 'ms" data-u="' +
      esc(p.u.userId) + '" title="' + esc(p.u.name || '') + '">');

      H.push(pxTag(mh.walkA, mh.pal, 'ch wf wa'));
      H.push(pxTag(mh.walkB, mh.pal, 'ch wf wb'));
    } else if (resting) {
      H.push(pxTag(mh.sitA, mh.pal, 'ch wf wa'));
      H.push(pxTag(mh.sitB, mh.pal, 'ch wf wb'));
    } else if (st.level >= 2) {
      H.push(pxTag(mh.sleep, mh.pal, 'ch'));
    } else {
      H.push(pxTag(mh.idleA, mh.pal, 'ch wf wa'));
      H.push(pxTag(mh.idleB, mh.pal, 'ch wf wb'));
    }

  });

  H.push('<div class="hero scn-hero' + (st.level >= 2 ? ' asleep' : '') +
    (walking ? ' walking' : '') + (resting ? ' resting' : '') +
    '" style="left:' + hx + 'px;--bt:' +
    [1500, 1900, 2300][hash(String(S.who) + 't') % 3] + 'ms">');
  /* 頭上寫他在幹嘛。本來只靠姿勢，而姿勢在 66px 上看不太出來——

  /* 牌子跟著姿勢走。「待命」本來蓋掉三個很不一樣的處境——

  /* 講得出來的那幾個處境排在前面，前進中／休息中是兜底的那一句。
     反過來的話「委託完成」跟「沒有任務」會共用「休息中」——
     姿勢一樣不代表發生的事一樣。 */
  var tag = st.level >= 2 ? '停很久了'
    : kind === 'commit' ? '還沒出發'
    : kind === 'stamped' ? '委託完成'
    : kind === 'review' ? '在等老師'
    : kind === 'back' ? '再走一次'
    : walking ? '前進中'
    : resting ? '休息中'
    : '待命';
  /* 「還沒出發」本來跟「待命」共用同一種灰色靜態樣式——兩個看起來

     分不出來（跟走廊上有沒有東西可以做完全是兩回事）。

     顏色借「前進中」的金——這個作品的顏色系統只有一條規則：
     「金＝你可以按這裡，或你正在這裡」（見 50-style.css），commit
     剛好就是那句話字面上的意思。但 .go 的脈動動畫是走路那個狀態
     專屬的：commit 這個處境角色是坐著的（見上面 resting 那一段，
     還沒出發＝還坐在火邊），身體沒有在動，牌子卻在脈動，看起來像
     「正在發生什麼」而其實只是站在原地的牌子在閃。所以只借顏色，
     不借動畫——新開一個 .new，金底但不脈動。 */
  H.push('<div class="hero-tag' + (walking ? ' go' : kind === 'commit' ? ' new'
    : resting ? ' rest' : '') +
    '">' + esc(tag) + '</div>');
  if (walking) {
    H.push(pxTag(HERO.walkA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.walkB, HERO.pal, 'ch wf wb'));
  } else if (resting) {
    H.push(pxTag(HERO.sitA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.sitB, HERO.pal, 'ch wf wb'));
  } else if (st.level >= 2) {
    H.push(pxTag(HERO.sleep, HERO.pal, 'ch'));
  } else {
    /* 站著也要兩幀。一張不動的圖在一條會漲水、會閃火的走廊上
       看起來像壞掉——呼吸那一格差別很小，但「他還在那裡」靠的就是它。 */
    H.push(pxTag(HERO.idleA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.idleB, HERO.pal, 'ch wf wb'));
  }

  if (st.level === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine'));
  H.push('</div>');

  /* 角色手上那一盞的光。一圈一圈地暗下去，不是模糊的漸層——
     模糊的話它會立刻看起來像貼在像素圖上面的現代特效。 */
  H.push('<div class="halo" style="left:' + (hx - 165) + 'px"></div>');

  /* ── 你說的那一天 ──

     這是原始設計裡就有的一條線（「道路前方出現一條虛線」），
     一直沒做。它讓「我承諾了幾天」在畫面上有一個實體：
     那條線就在前面，水從後面追上來。只有數字的話那件事沒有位置。

     虛線不是終點線——別組沒有這條線，每一組的線在不同的地方，
     因為那是各自說的。 */
  if (run) {
    /* 只有線，沒有字。牠現在就站在這一格上——
       牠站在那裡本身就是「你說的那一天」，再寫一次是同一件事說兩遍，
       而且那兩段字永遠會擠在一起。 */
  }

     那是同一件事的一半——真正的理由不是「那幾天還沒到」，

     而還沒走到的地方自然就在暗裡。

     所以超過自己說的天數，你看得到的範圍真的會縮。

     z-index 5：壓在魔物（4）上面、角色（6）下面——牠被暗吃掉，
     走到了才浮出來；而他自己一直在洞裡。 */
  H.push('<div class="veil" style="--lx:' + (hx + 33) + 'px"></div>');

  H.push('</div>');         /* scn */

     本來寫的是「2 你來過　5 過了幾天　5 你說的」——每一個都是
     半句話，要自己補完才知道在講什麼（你來過⋯哪裡？你說的⋯什麼？）。
     改成三句講得完的話，數字夾在句子中間。

     「說沒動」那一項不放回來：說那句話的那一顆鍵（actRest）現在
     沒有任何地方按得到，所以它永遠是 0。

     它掛在廊道外面。負邊界是為了往上貼住廊道，寫在 .scn 裡面的話
     會被 overflow:hidden 吸到頂上去。 */
  /* 承諾過才有數字。fresh 的那一趟 runsFor 會給一個 runId 是 null 的
     空殼，所以這裡本來會印出「你說要 1 天／已經過了 0 天／你來了 0 天」——
     三個都是假的，而且它出現在他還沒決定要走幾天的那個畫面上。 */
  if (run && run.runId) {
    H.push('<div class="scn-foot">');
    H.push('<span class="sf est"><i>你說要</i><b>' + esc(estSay(run)) + '</b></span>');
    H.push('<span class="sf days"><i>已經過了</i><b>' + gone + '</b><i>天</i></span>');
    /* 「你來了 N 天」拿掉了：那是一個每天登入的計數，而這個系統
       不要求每天登入。判定只讀兩個數字，第三個數字擺在它們旁邊，
       看起來就像也會被算進去。

       來過的痕跡還在廊道上（走過的那幾格點著火把），
       但它不再被寫成一個分數。 */
    H.push('</div>');
    /* 交出去了、等老師看——在只有兩個數字的那一頁上補一句，
       不然學生不知道他現在該做什麼、等多久、會不會通知他。 */
    if (kind === 'review') {
      H.push('<p class="dim scn-wait">交出去了。老師收下之後這裡會通知你。</p>');
    }
    if (kind === 'back') {
      H.push('<p class="dim scn-wait">老師退回來了，點上面的委託人看他寫了什麼。</p>');
    }
  }
  return H.join('');
}

/* 背上本來背著拿到的那幾張證。那件事改由洞口的營地講——
   那裡一趟多一個，而且首頁就是那條廊道，每次打開都看得到。 */
/* 照面那一頁上的自己。跟廊道裡走的是同一個人、同一身裝備——
   不然那一下就不是「我上去」，只是一張圖。 */
function heroTag(teamId) {
  return '<div class="hero duel-h">' + pxTag(HERO.idle, HERO.pal, 'ch') +
    heroPack(teamId) + '</div>';
}

function heroPack() { return ''; }

/* ---------- 洞口 ----------
   左邊是你進來的地方：拱門、從上面落下來的光、掛著的招牌。
   招牌就在這裡，不在標題列——它是廊道入口的看板，不是頁首。 */
/* 洞口。招牌、營火、往上的光——全部在這裡，而且一直在。

   為什麼要一直在：沒觸發過的東西等於不存在。一個學生如果從來沒有
   失準過，他整學期不會知道有營火這個地方。所以它們在那裡，
   只是沒點著——「看得到但還沒發生」跟「不存在」是兩件事。 */
function sceneMouth(t, next, ENT, resting) {
  var sg = signOf(t.teamId);
  var H = ['<div class="mouth" style="width:' + (ENT || SCN.ENT) + 'px">'];

  /* 往上的光：出口。一直看得見，但門是老師開的——沒開的時候
     它就只是一道光，不是一顆按得動的鈕。

     「看得到但還沒發生」跟「不存在」是兩件事，所以光一直在；
     而廊道上那一排已經有一扇看得見的、鎖著的門在講同一件事，
     兩個入口兩套規則反而更難懂。 */
  if (t.exitOk || t.leftAt) {
    H.push('<button class="shaft open" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'go:exit' })) +
      '\' title="' + esc('出口：老師開了，從這裡上去') + '"></button>');
  } else {
    H.push('<span class="shaft' + (t.exitAsk ? ' said' : '') + '" title="' +
      esc(t.exitAsk ? '出口：在等老師開門' : '出口：要老師開才走得出去') +
      '"></span>');
  }
  H.push('<div class="arch"></div>');

  /* 招牌。點得開——改名字是偶爾才做的事，不該在首頁佔一塊。 */
  H.push('<button class="hang" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:sign' })) + '\' title="' +
    esc('招牌：' + (t.project || '（還沒定）')) + '">');
  H.push('<div class="chain"></div>');
  /* ── 招牌套當層的顏色，不是它自己那一組 ──

     2026-09-10：使用者說廊道上有一塊「奇怪的藍色方塊」。那就是這一張。

     signOf 永遠回 SIGNS.iron，而鐵牌的配色是冷灰藍（#9AA6B0／#5C666F／
     #DDE6EC，見 11-world.js）。廊道口其他每一樣東西——委託人、碎石、
     水晶、蘑菇、鏽鐵——都套 zone.pal，只有招牌用自己那一組。在冷色的
     那幾層看不出來，走到熔火深淵（#D9603F 暖橘）就變成畫面上唯一一塊
     冷色，讀起來像一個外來物。

     配色表的鍵一樣（# ／ o ／ *），所以直接換一組就好，圖不用動。
     材質的差別本來就已經拿掉了（SIGN_TIERS 只剩 iron），
     所以那一組配色現在沒有在表達任何東西。 */
  H.push(pxTag(sg.px, zoneNow(t.teamId).pal, 'sign'));
  H.push('</button>');
  /* 洞口那一塊專案名拿掉了。

     兩個理由。一 · 它是第三份：頂條上有、招牌的 title 上有，這裡再一次。
     二 · 它會撞人。它掛在 bottom:110、寬 121，而人休息的時候就坐在
     旁邊（left:44），頭上還有一塊牌子——專案名一長就折兩行，
     往上長進牌子裡。招牌本來就掛在那裡，名字讓頂條說。 */

  /* 營火。兩趟之間點著——那時候人坐在旁邊。

     本來是「判定失準才點著」，但那個分岔在改成
     『每一次交出去之前都省思』的時候拿掉了，所以它再也不會亮，
     變成一堆死掉的內容。改成休息的時候點著，才是它本來的意思：
     營地是休息的地方，不是罰站的地方。 */
  /* 跟角色同一個判斷，而且是同一個變數傳進來的——兩邊各算一次
     就會有一邊算錯（本來人坐著而火是冷的）。 */
  var lit = !!resting;
  H.push('<button class="mfire' + (lit ? ' lit' : '') + '"' +
    ' data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'go:pack' })) + '\'' +
    ' title="' + esc(lit ? '營火：還沒接下一件事' : '營火（走著的時候是暗的）') +
    '">');
  if (lit) {
    CAMPFIRE.frames.forEach(function (f, n) {
      H.push(pxTag(f, CAMPFIRE.pal, 'ff f' + n));
    });
  } else {
    H.push(pxTag(CAMPFIRE.px, COLD_PAL, ''));
  }
  H.push('</button>');

  /* 火星。點著的時候才有，六顆，各自的節奏用座標算。
     它是這個畫面上唯一一直在動的小東西——沒有它，
     「坐在火旁邊」看起來會像一張靜止的圖。 */
  if (lit) {
    for (var e = 0; e < 6; e++) {
      var eh = hash('ember' + e);
      H.push('<i class="ember" style="left:' + (16 + eh % 26) + 'px;' +
        '--ed:' + (1400 + (eh >>> 6) % 900) + 'ms;' +
        'animation-delay:' + ((eh >>> 13) % 1600) + 'ms"></i>');
    }
  }

  /* 營地那一排記號拿掉了：記號系統整個收掉（見 40-db.js actApprove）。
     一趟走完留下什麼，由帶子、圖鑑、以及走廊變長來說。 */

  H.push('</div>');
  return H.join('');
}

/* ---------- 魔物 ----------
   站在走廊盡頭。清楚到什麼程度跟你走了多少有關——
   剛出發的時候只看得到一團影子，走到底才看得清牠長什麼樣。 */
/* 走到底才遇得到牠。

   牠不畫進前進中的動畫裡：牠是那一趟盡頭擋路的那一隻，而「盡頭」
   就是走完之後。一路上都看得到牠，等於一開始就把唯一的未知揭曉了，
   而且走了五天牠還站在那裡不動，那不是擋路，那是布景。

   擋在你說的那一天上。

   本來牠站在 max(承諾, 過了幾天)，所以時間一過牠就往後退——
   你永遠追不上牠，走過牠這件事不可能發生。而「走過自己說的那一天」
   正是這個系統唯一要讓人看到的事。 */
function sceneMob(t, row, prog, est, ENT) {
  var mob = mobOfRun(row.run);
  /* 他照自己那一區的顏色，不照學生走到哪一區。

     本來是跟著那一趟的地方走（他是那裡的東西）。現在他是委託人——
     一個人不會因為你走哪一條路過去就換一種顏色。換一個地方遇到他，
     他還是他。 */
  var pal = mobZone(mob).pal;
  var x = (ENT || SCN.ENT) + est * SCN.TILE + 33;
  /* 這裡本來還掛一塊寫著任務名字的木牌。拿掉了：它浮在半空、會壓到
     角落那一塊，而且那個名字底下那張卡已經有一次——同一件事說兩遍，
     其中一遍看起來就會像壞掉的東西。 */
  var H = [];
  /* 名字要走到一半才看得清。

     本來牠的名字從第一天就寫在那裡——那等於一趟開始就把唯一的未知
     揭曉了。現在前半段只有一團形狀跟一排問號，走近了名字才浮出來。
     每一趟因此有一條小小的線從頭拉到尾。 */
  /* 走到底了牠才出現，而且是浮出來的（scn-mob 那一段動畫）。
     還在路上的時候那裡什麼都沒有——前面是霧，不是一隻站著等你的東西。 */
  H.push('<div class="scn-mob meet can" style="left:' + x + 'px" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:patron:' + mob.n })) + '\'>');
  H.push(patTag(mob, pal, 'ch'));
  H.push('<span class="mobn">' + esc(mob.n) + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 這一層的空氣 ----------

   每一層有自己的：荒原飄塵、根脈層飄孢子、水晶迴廊閃、迴聲迷宮有東西
   掠過、銹層落銹屑、深淵冒火星。天花板一律會滴水，因為每一層都是
   地底下。

   位置全部用 hash 算——同一趟每次打開，每一顆都在同一個地方。
   會亂跳的東西不是環境，是特效。節奏各自不同，不然一整片會一起眨。

   它們不帶任何資訊，也不能帶：這一層是哪一層，牆、地板、水晶的顏色
   已經說了。空氣只是讓那個地方看起來真的有空氣。 */
var AIR = {
  wild: { n: 14, k: 'dust' },
  root: { n: 12, k: 'spore' },
  crys: { n: 16, k: 'glint' },
  echo: { n: 10, k: 'mote' },
  rust: { n: 12, k: 'flake' },
  fire: { n: 16, k: 'ember' }
};
function sceneAir(seed, zone, W) {
  var a = AIR[zone.key] || AIR.wild;
  var H = ['<div class="air" style="width:' + W + 'px">'];
  var i, span = Math.max(1, W - 22);
  for (i = 0; i < a.n; i++) {
    var h = hash(seed + '|air|' + i);
    var d = 2600 + ((h >>> 13) % 3400);
    H.push('<i class="ap ' + a.k + '" style="left:' + (h % span) +
      'px;bottom:' + (44 + ((h >>> 7) % 220)) + 'px;--ad:' + d +
      'ms;--ag:-' + ((h >>> 19) % d) + 'ms"></i>');
  }
  for (i = 0; i < 5; i++) {
    var q = hash(seed + '|drop|' + i);
    var dd = 3200 + ((q >>> 9) % 2600);
    H.push('<i class="ap drop" style="left:' + (q % span) +
      'px;--ad:' + dd + 'ms;--ag:-' + ((q >>> 5) % dd) + 'ms"></i>');
  }
  H.push('</div>');
  return H.join('');
}

/* ---------- 火把 ----------
   三幀真的換圖，不是用 CSS 做出來的「像火」。每一盞的速度差一點點，
   不然一整排會一起眨眼，那看起來像壞掉的燈管不像火。 */
function torchAt(x, lit, i) {
  if (!lit) {
    return '<img class="px tor dead" style="left:' + x + 'px" src="' +
      pxSvg(TORCH.dead, TORCH.deadPal, false) + '" alt="">';
  }
  var ms = [300, 360, 420, 340][hash('t' + i) % 4];
  var H = ['<span class="tor" style="left:' + x + 'px;--fd:' + ms + 'ms">'];
  TORCH.frames.forEach(function (f, n) {
    H.push('<img class="px f f' + n + '" src="' + pxSvg(f, TORCH.pal, false) + '" alt="">');
  });
  H.push('</span>');
  return H.join('');
}

/* 重畫之後把角色捲進畫面裡。

   走廊比視窗長的時候，重畫預設會回到最左邊——那樣按了推進之後，
   會看到走廊動了但看不到自己動。這一支讓鏡頭跟著人走。 */
/* 滑到哪裡要記住。重畫會把 innerHTML 換掉，捲軸歸零——
   不記的話你永遠滑不到廊道的另一端。 */
var SEEN_AT = {};

function keepScroll(box, key, centre) {
  if (!box) return;
  var s = SEEN_AT[key];
  if (s && s.at === centre.at) {
    /* 角色沒換位置：放回你剛剛滑到的地方 */
    box.scrollLeft = s.x; box.scrollTop = s.y;
  } else {
    box.scrollLeft = centre.x; box.scrollTop = centre.y;
    SEEN_AT[key] = { at: centre.at, x: centre.x, y: centre.y };
  }
  box.onscroll = function () {
    var k = SEEN_AT[key];
    if (k) { k.x = box.scrollLeft; k.y = box.scrollTop; }
  };
}

function scrollScene() {
  /* 他偶爾說一句。每次重畫都要重掛——innerHTML 整個換掉了。 */
  osTick();

  /* 廊道拖得動。每次重畫都要重掛，因為 innerHTML 被換掉了。 */
  dragScene();

  /* 走過的那一條停在最右邊——最右邊是現在。
     keepScroll 記得他拖到哪，所以往回看過的人回來還在原地。 */
  /* 剖面圖也要拖得動。它比視窗寬得多，而在桌機上原生捲動容器
     拖不動——「看不到右邊」在桌機上因此是常態。 */
  dragBox('.xsec-wrap', 'xsec');

  /* 打開的時候停在自己那一條。圖有兩千多像素寬，視窗七百五，
     而它本來從最左邊開始——排在後面的組打開這一頁看到的是別人。 */
  var xw = document.querySelector('.xsec-wrap');
  var me = xw && xw.querySelector('.xs-shaft.mine');
  if (xw && me) {
    var mx = me.offsetLeft + me.offsetWidth / 2 - xw.clientWidth / 2;
    keepScroll(xw, 'xsec', { at: me.offsetLeft, x: Math.max(0, mx), y: 0 });
  }

  var rs = document.querySelector('.rstrip');
  if (rs) {
    keepScroll(rs, 'rstrip', { at: rs.scrollWidth, x: rs.scrollWidth, y: 0 });
  }

  var box = document.querySelector('.scn-scroll');
  var hero = document.querySelector('.scn-hero');
  if (box && hero) {
    keepScroll(box, 'scn', {
      at: hero.offsetLeft,
      x: Math.max(0, hero.offsetLeft + hero.offsetWidth / 2 - box.clientWidth / 2),
      y: 0
    });
  }

  /* 地圖一樣：打開來要先看到自己那塊地，不然全班那片地上
     你得先找自己在哪裡。 */
  var mb = document.querySelector('.dig-wrap');

  /* 地層的名字放在左邊那一條裡，但地圖比視窗寬——
     一往右捲就看不見了。讓它跟著橫捲走。 */
  if (mb) {
    var zs = mb.querySelectorAll('.dig-z');
    var pin = function () {
      for (var i = 0; i < zs.length; i++) zs[i].style.left = (mb.scrollLeft + 3) + 'px';
    };
    pin();
    mb.addEventListener('scroll', pin);
  }

  var mh = mb && mb.querySelector('.dig-hero');
  if (mb && mh) {
    keepScroll(mb, 'dig', {
      at: mh.offsetLeft + ',' + mh.offsetTop,
      x: Math.max(0, mh.offsetLeft + mh.offsetWidth / 2 - mb.clientWidth / 2),
      y: Math.max(0, mh.offsetTop + mh.offsetHeight / 2 - mb.clientHeight / 2)
    });
  }
}

/* ---------- 走出去的那一下 ----------

   一學期的終點。交出去有一整場戰鬥，出去本來只是換一頁——
   這一段補上那個份量。

   一道從上面下來的光、兩邊是岩壁、人沿著光往上走出畫面。
   沒有粒子、沒有光暈：跟全作一致，硬邊、零模糊、光從上面來。

   動畫只加東西不當閘門——時鐘被凍住的時候人停在井底，還是看得見。 */
function exitScene(t) {
  var z = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var H = ['<div class="xit ' + z.key + '">'];

  /* 兩邊的岩壁。中間那一條是光。 */
  H.push('<div class="xit-sky"></div>');
  H.push('<div class="xit-rock l"></div>');
  H.push('<div class="xit-rock r"></div>');
  H.push('<div class="xit-beam"></div>');

  /* 地表。走出去就是走到這一條上面。 */
  H.push('<div class="xit-top"></div>');

  /* 人。背影，沿著光往上走。 */
  H.push('<div class="xit-hero">');
  H.push(pxTag(HERO.back, HERO.pal, 'ch'));
  H.push(heroPack(t.teamId));
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 廊道拖得動 ----------

   本來只能靠捲軸或觸控慣性，桌機上等於不能前後看。抓著廊道拉，
   前面幾天跟後面幾天都看得到——那條廊道是這個作品的主畫面，
   看不了前後就等於只看得到一格。

   兩件要小心的事：
   一 · 拖跟點要分得開。移動超過五個像素才算拖，不然招牌與出口
        會變成點不到。
   二 · 拖完不要讓瀏覽器把它當成點擊送出去（見 click 的攔截）。 */
/* 用滑鼠把一個橫向捲動的容器拖著走。

   在手機上手指本來就滑得動，但在桌機上原生的捲動容器**拖不動**——
   只能用捲軸或 shift＋滾輪。而這個作品裡比視窗寬的東西有兩個：
   廊道與班級地下城那張剖面圖。兩個都要拖得動，而且手感要一樣。

   key 是給 keepScroll 記位置用的，兩個容器各自記各自的。 */
function dragBox(sel, key) {
  var box = document.querySelector(sel);
  if (!box || box.dataset.drag) return;
  box.dataset.drag = '1';

  var down = false, moved = false, x0 = 0, l0 = 0;

  box.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    down = true; moved = false;
    x0 = e.clientX; l0 = box.scrollLeft;
  });

  box.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - x0;
    if (!moved && Math.abs(dx) < 5) return;
    if (!moved) { moved = true; box.classList.add('dragging'); }
    box.scrollLeft = l0 - dx;
    /* 記住拖到哪裡，重畫之後放回去（見 keepScroll）。 */
    var k = SEEN_AT[key];
    if (k) k.x = box.scrollLeft;
    e.preventDefault();
  });

  function up() {
    down = false;
    box.classList.remove('dragging');
    /* 拖完那一下的 click 不要送出去，不然會誤觸招牌或出口。 */
    if (moved) {
      box.addEventListener('click', function stop(ev) {
        ev.stopPropagation(); ev.preventDefault();
        box.removeEventListener('click', stop, true);
      }, true);
    }
  }
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('pointerleave', up);
}

/* 廊道。每次重畫都要重掛，因為 innerHTML 被換掉了。 */

/* ---------- 他偶爾說一句 ----------

var OS_T = null;

  var cls = tag.className;

  function speakers() {

    var out = [];
    var h = box.querySelector('.scn-hero');
    if (h) out.push({ el: h, u: me(), tag: h.querySelector('.hero-tag') });
    [].forEach.call(box.querySelectorAll('.scn-mate'), function (el) {
      /* 睡著的人不說話——整組都停很久了，這裡本來就 return 掉了，

      if (el.className.indexOf('asleep') >= 0) return;
      var u = userOf(el.getAttribute('data-u'));
      if (u) out.push({ el: el, u: u, tag: null });
    });

  }

  function say() {
    var who = speakers();
    if (!who.length) return stopOS();
    var pick = who[Math.floor(Math.random() * who.length)];
    var line = heroLine(pick.u, mode);
    if (!line) return stopOS();

    /* 你頭上本來就有一塊牌子，借它來說話（說完換回原本那幾個字）。

       而一句話最寬 264px（量到疊了 90×33）。

       那一條帶子一次只放一句話。 */
    var box0 = document.querySelector('.scn');

    var back = '', kls = cls;
    if (made) {
      t = document.createElement('div');
      t.className = cls;
      pick.el.appendChild(t);
    } else {
      back = t.textContent;
      kls = t.className;

    t.className = kls + ' os';

       泡泡從角色身上長出去，而廊道是一個會捲的窗——他站在窗的哪裡，
       左右各剩多少，每一次都不一樣。而 .scn 是 overflow:hidden，
       落在窗外的字是被切掉，不是跑版。

       所以量兩邊剩多少，往寬的那一邊長，寬度收到那一邊放得下為止。
       這件事只有量得到位置的時候算得出來，所以它在這裡不在 CSS 裡。 */
    var box = document.querySelector('.scn');
    if (box) {
      var br = box.getBoundingClientRect();
      var hr = pick.el.getBoundingClientRect();
      var roomR = br.right - hr.left - 11;
      var roomL = hr.right - br.left - 11;
      var left = roomL > roomR;
      var room = Math.max(roomL, roomR);
      t.style.maxWidth = Math.max(132, Math.min(264, room)) + 'px';
      t.className = kls + ' os' + (left ? ' os-l' : '');
    }
    OS_T = setTimeout(function () {
      if (made) {
        if (t.parentNode) t.parentNode.removeChild(t);
        var b2 = document.querySelector('.scn');
        if (b2) b2.className = b2.className.replace(' matetalk', '');
      } else {
        var u2 = document.querySelector('.scn .scn-hero .hero-tag');
        if (!u2) return stopOS();
        u2.textContent = back;
        u2.className = kls;
        u2.style.maxWidth = '';
      }
      OS_T = setTimeout(say, 12000 + Math.random() * 11000);
    }, 4200);
  }

  /* 第一句別在打開的同一秒冒出來——那看起來像通知，不像自言自語。 */
  OS_T = setTimeout(say, 6000 + Math.random() * 7000);
}


/* ===== 62-eco.js ===== */
/* 班級地下城：一張地質剖面。

   這是「關聯性」那根柱子的全部，而且它只做一件事：
   讓你看得到別人也在下面——不比較、不排名、不知道誰比較好。

   為什麼是剖面而不是列表：列表只要有兩列就會被讀成名次，剖面讀起來
   是一個地方。每一組往下走自己的一條廊道，廊道之間沒有共同的終點線，
   因為每一組的專案本來就不一樣。

   岩層（見 13-strata.js）是全班共用的地質，不是關卡。誰都看得到全部
   四層，沒有哪一層需要「開」。深度變了岩石就變了，就這樣。

   岩壁裡住著東西。牠們跟任何一組的進度都無關，就只是住在那裡——
   擋在你走廊盡頭的那一隻，只是其中一隻。牠們不是鈕：要查一隻
   去圖鑑，那裡有全部二十四隻。

   記號系統拿掉之後，這張圖上可以點的只剩一種：欄頭，那一組是誰。
   一種東西一句話。

   立體感來自每一塊右邊的側面（見 54-eco.css），不是把整條廊道斜著推——
   正交的長條看起來像進度表，有側面的廊道看起來像地下城。 */

/* ---------- 版面 ----------

   橫的，由左至右——跟首頁那一條廊道同一套文法。每一組一條，上下排開，
   全部從同一條左邊界起算，所以長度直接比得出來，不用讀任何數字。

   本來是直的剖面：每一組往下挖一口井，格子畫的是「挖空的洞」。
   橫過來之後格子的意思也跟著換：

     一塊 ＝ 老師收下的一趟。實心的，疊上去的。
     虛的一塊 ＝ 交出去了，還在老師那邊。
     右邊的暗岩 ＝ 還沒挖到的地方，每一條都留著。

   為什麼是「老師收下的」而不是「走完的」——走是他自己的事，
   留下來是要有人看過的事（見 40-db.js 的 sealedDepth）。
   走完但還沒被收下的那一趟看得到，但它是虛的：那一塊還沒站住。

   一塊的顏色是「那一趟他們去了哪裡」。

   本來一整行同一個顏色，因為那時候第幾層是算出來的——同一個深度
   全班一定在同一層，所以顏色屬於欄位不屬於哪一組。地方改成他們
   自己選之後那條規則不成立了：一條看下來是那一組走過的路線。

   顏色因此變成他們的了，但它還是不能比較誰漂亮——六個地方沒有先後、
   沒有難易，去哪裡不影響任何判定。它是決定的痕跡，不是成績。 */
var XL = {
  NAME: 176,   /* 左邊：這是哪一組 */
  MIN: 55,     /* 一塊最窄。窄到這裡就不再收，改成橫著捲 */
  MAX: 88,     /* 一塊最寬。再寬就變成一片色塊，邊角那道斜切也看不出來 */
  BH: 66,      /* 一塊的高 */
  HEAD: 44,    /* 條的上面留給角色站的那一條 */
  LANE: 121,   /* 一條佔的高：44 站的 ＋ 66 條 ＋ 11 間隔 */
  AHEAD: 4,    /* 每一條右邊都要留著的、還沒挖到的那幾格 */
  TOP: 55      /* 最上面那條尺 */
};

function xlY(i) { return XL.TOP + i * XL.LANE; }

/* 這一組疊到第幾塊。實心幾塊、後面掛不掛一塊虛的。 */
function xlCount(r) { return r.sealed + (r.pending ? 1 : 0); }

/* ---------- 整張圖 ---------- */
function xsScene(rows, meId, classId) {
  /* 畫多長：最長的那一條再往右幾格。右邊永遠還有沒挖過的岩石——
     切齊最長的那一組，那條邊就變成終點線了。 */
  var most = rows.reduce(function (a, r) { return Math.max(a, xlCount(r)); }, 0);
  var cols = Math.max(6, most + XL.AHEAD);
  var H = xlY(rows.length) + 22;

  /* 橫向全部交給 CSS 算（見 54-eco.css）：--cols 是幾格、--nm 是名牌多寬，
     每一塊的左緣與寬度都是 (100% − 名牌) ÷ 格數。
     所以這張圖在電腦上撐滿、在手機上退到最窄再捲。 */
  /* 寬度上限拿掉了。

     本來是 XL.MAX（一塊最寬 88px）×格數：格數少的時候整張圖會縮在
     頁面中間，兩邊留白。可是這張圖是「全班在同一片地層裡」，它縮成
     一小塊的時候那句話就講不出來了。

     min-width 留著：窄到一塊 55px 就不再收，改成橫著捲。 */
  var out = ['<div class="xsec-wrap"><div class="xsec" style="--cols:' + cols +
    ';--nm:' + XL.NAME + 'px;min-width:' + (XL.NAME + cols * XL.MIN) +
    'px;height:' + H + 'px">'];

  /* ── 每一直行的水晶 ──

     整張圖的底，一片中性的岩壁。本來每一直行是一個地層——那是
     「第幾層由深度算出來」那一版留下的：同一個深度全班一定同一層。

     地方改成他們自己選之後，「第幾行＝哪一層」就不成立了。
     顏色全部留給疊上去的那幾塊——那才是有人做過決定的地方。 */
  for (var n = 0; n < cols; n++) {
    out.push('<div class="xl-col" style="--i:' + n + '"></div>');
  }

  /* ── 最上面那一條地表 ──

     那條帶子留著（它是地面），但上面的公尺刻度拿掉了。

     那把尺是「深度＝進度」那一版留下來的。這一版的地形跟走多少刻意
     脫鉤了，而那把尺又把「走到第幾公尺」放回來——而且它橫跨全班，
     所以就算這張圖不排序，一把共用的尺還是讓人一眼讀得出名次。

     它也沒有多說什麼：一塊就是一趟，數得出來。80 m 只是 2 塊乘以 40，
     把趟數包裝成一個假的單位。 */
  out.push('<div class="xl-rule"></div>');

  /* ── 還沒去過的地方住著東西 ── */
  out.push(xlFauna(rows, cols, classId));

  /* ── 每一組一條 ── */
  /* meId 可以是一個組（學生）或一串組（老師帶的那幾組）。 */
  var mineSet = {};
  if (typeof meId === 'string' && meId) mineSet[meId] = 1;
  else if (meId && meId.length) meId.forEach(function (x) { mineSet[x] = 1; });
  rows.forEach(function (r, i) {
    out.push(xlLane(r, i, cols, classId, !!mineSet[r.teamId]));
  });

  out.push('</div></div>');
  return out.join('');
}

/* ---------- 還沒挖到的地方住著什麼 ----------

   位置用行與列算，不擲骰子——每次打開同一隻都在同一個地方。
   會亂跳的東西不是生態，是特效。

   只長在沒有人挖到的那一段：牠們跟任何一組的進度無關，
   就只是住在那裡，而且前面還有。 */
function xlFauna(rows, cols, classId) {
  var out = [];
  rows.forEach(function (r, i) {
    var from = xlCount(r) + 1;
    for (var n = from; n < cols; n++) {
      var h = hash('f/' + classId + '/' + i + '/' + n);
      if (h % 100 < 68) continue;
      /* 前面那幾隻用班級的路線挑——它不是「那裡是哪一層」，
         只是讓每一格住的東西固定不亂跳。 */
      var z = strataAt(n, classId);
      var c = faunaAt(z.key, i * 7 + n);
      if (!c) continue;
      /* 不是鈕。牠是岩石裡的東西——要查牠去圖鑑，那裡有全部二十四隻。 */
      /* 跟那一疊同一個高度：牠們住在岩石裡，不是浮在兩排之間。 */
      out.push('<div class="xl-fauna" style="--i:' + n + ';top:' +
        (xlY(i) + XL.HEAD + 11 + (h >>> 5) % 22) + 'px" title="' + esc(c.n) + '">' +
        pxTag(c.px, z.pal, '') + '</div>');
    }
  });
  return out.join('');
}

/* ---------- 一組一條 ---------- */
/* mine 是「這一條要不要標成自己的」。學生只有一條，老師有好幾條，
   所以判斷放在呼叫端，這裡只收一個布林。 */
function xlLane(r, i, cols, classId, mine) {
  var y = xlY(i);
  var tm = teamOf(r.teamId);
  var left = !!(tm && tm.leftAt);
  var n = xlCount(r);
  var H = ['<div class="xl-lane' + (mine ? ' mine' : '') + (left ? ' out' : '') +

     「畢製分工失衡」才是他們在做的事。

     整格是一顆鈕，點進去是「他們是誰」；中間那一疊是另一顆，
     點進去是「他們做了什麼」。一條上兩個問題，各自一顆鈕。 */
  H.push('<button class="xl-name pressable" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'crew:' + r.teamId })) + '\' title="' +

  H.push('<b>' + esc(r.project || '（還沒定）') + '</b>');
  H.push('<em>' + esc(shortName(r.name)) + '</em>');

     整條是死的，而那正是最需要被點開看一眼的那一組。 */
  H.push('<button class="xl-stack" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'team:' + r.teamId })) + '\' ' +
    'style="top:' + XL.HEAD + 'px;height:' + XL.BH + 'px">');
  /* 顏色是「那一趟他們去了哪裡」，不是「第幾行」。

     一條看下來是那一組走過的路線。

     還在老師那邊的那一塊還沒有路線可讀（route 只收被收下的），

  var route = r.route || [];

     本來人站在最深的那一格裡。搬到條上面來，是因為一整排人的左右
     就是一整排的長短——誰疊得多，不用讀任何數字。
     還沒疊到任何一塊的那一組站在起點上，不是站在空中。 */
  /* 整組站在一起。一個人一張圖，稍微疊著往左排——四個人排開會超過
     一格的寬，疊著就還在自己那一條上面。

     title 帶全員的名字：滑鼠移上去看得到那一組是誰跟誰。 */
  var hs = (r.heroes && r.heroes.length) ? r.heroes : [r.hero || HERO];
  H.push('<button class="xl-hero n' + Math.min(4, hs.length) +
    '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'person:' + r.teamId })) + '\' title="' +
    esc(shortName(r.name) + '　' + (r.names || []).join('、')) +
    '" style="--k:' + Math.max(0, n - 1) + '">');
  hs.forEach(function (hr, i) {
    /* ---------- 這一頁上沒有人躺下去 ----------

       這一條追了三輪。

       第一輪：停很久那一組半透明 .6，對比 1.38，看不見。改成 .85。
       使用者說還是沒修好。

       第二輪：量出躺著的人只有站著一半的墨，加藤蔓補。使用者說
       「不是忍者，突變成不是他上面的東西了」——藤蔓是為站著的人畫的，
       壓到躺著的人身上有 16 格浮在他上面的空氣裡，而且藤蔓比忍者亮，
       眼睛先讀到一個綠色的 X。

       這一頁的工作是「六組在哪裡」，一眼掃過去。那個尺度上只分得出
       「在動 / 停住」，分不出「停了幾天」。而「停了幾天」本來就有地方
       講：他自己那一條廊道，66px、有字、一次只有他。

       所以這一頁上每一個人都站著，停住的那幾組身上長藤蔓。
       藤蔓本來就是為站著的人畫的——53/57 格會壓在站著的身上。

       躺著那張圖留著，用在自己那一條廊道上（見 61-scene.js）。

       兩幀，會呼吸。廊道裡的人在呼吸，這一頁上的人凍住的話，
       那一頁讀起來像圖表不像有人住在裡面。走出去的那一組舉手。
       每一個人的呼吸差一點點（--d），不然一排人像同一個複製四次。 */
    H.push('<span class="xl-one" style="--i:' + i + ';--d:' + (i * 180) + 'ms">');
    /* ---------- 這一頁上不畫停滯 ----------

       這一條追了五輪，每一輪我都往上加一樣東西，每一樣都誤讀：

         一 · 半透明 .6 → 對比 1.38，人不見了
         二 · 半透明 .85 → 還是不夠，因為半透明從來不是主因
