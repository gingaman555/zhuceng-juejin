  padding:9px 14px;font-size:22px;line-height:1.2;cursor:pointer;
  border:1px solid var(--line2);
  background:var(--sunk);color:var(--dim);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06)
}
.cxt i{font-style:normal;font-size:22px;color:var(--gold-d);margin-left:8px}
.cxt:hover{color:var(--ink);border-color:var(--gold-d)}
.cxt:active{transform:translateY(1px)}
.cxt.on{background:var(--zbg);color:var(--zink);border-color:var(--zink);
  box-shadow:inset 0 3px 0 var(--zink)}
.cxt.core.on{--zbg:#161B23;--zink:var(--gold)}

/* 一層裡的那幾隻：兩到三欄，描述收成兩行，一屏塞得下 */
/* 本來夾成兩行、第三行切掉——切掉的字等於沒寫。
   說明已經砍到只剩一句「牠會做什麼」，所以讓它整句都在。 */
@media (min-width:1200px){ .cxi{width:calc(33.33% - 8px)} }

/* ---------- 選單：背包裡的幾樣東西 ---------- */
.nav a{gap:11px}
.px.nic{width:22px;height:22px;flex:0 0 22px}
.nav a .dot{display:none}
@media (max-width:860px){
  .nav a{flex-direction:column;gap:2px}
  .px.nic{width:18px;height:18px;flex:0 0 18px}
}

/* ---------- 頂條：角色身上的東西，不是網站的狀態列 ---------- */
.top.hud{
  gap:14px;
  background-color:var(--zbg,var(--panel));
  background-image:var(--ztex,none), linear-gradient(180deg,
    rgba(255,240,214,.07) 0 1px, transparent 1px calc(100% - 3px),
    rgba(0,0,0,.72) calc(100% - 3px) 100%);
}
.px.hud-sign{width:33px;height:33px;flex:0 0 33px}
/* 大的那個是專案名，不是組名。組名是固定的、你早就知道了；
   專案名才是「我現在在做什麼」——本來它跟裝飾字一樣小。這是對調，不是放大，
   所以頂條的高度沒有變。 */
.top.hud .who{font-size:22px;color:var(--dim)}
.top.hud .hud-pj{font-size:22px;color:var(--ink)}
.top.hud .hud-z{font-size:22px;color:var(--zink,var(--gold))}
.top.hud .hud-d{
  font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;
  padding:0 9px;background:rgba(0,0,0,.45)
}
.top.hud .hud-d.warnx{color:var(--over)}

/* ---------- 卡片切角：跟按鈕同一個簽名 ---------- */
.card,.act-card,.stamp-card,.dash{
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.cxt,.ac,.stp{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}

/* ---------- 頁首做成刻在水晶上的牌子 ---------- */
.wrap > h1{
  display:inline-block;padding:5px 22px 5px 0;margin-bottom:14px
}
.wrap > .eyebrow{color:var(--gold-d)}

/* 洞口那幾樣現在也是入口 */
.mouth .hang{padding:0;border:none;background:none;cursor:pointer}
.mouth .hang:hover{filter:brightness(1.2)}
.mouth .shaft{padding:0;border:none;cursor:pointer}
.stp.static{cursor:default;color:var(--dim)}
.stp.static b{box-shadow:inset 0 0 0 2px var(--line)}

/* ---------- 首頁上面那一條：你手上這一趟 ----------
   像 YouTube 的上傳鍵——它在最上面，但它不是那一頁的內容。 */
.task{
  background-color:var(--zbg,var(--panel));
  background-image:var(--ztex,none);
  padding:22px;margin:0 0 22px;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  box-shadow:inset 0 3px 0 rgba(255,240,214,.09), inset 0 -3px 0 rgba(0,0,0,.72), 0 0 0 1px #000
}
.task-top{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}
.task-top > div:first-child{flex:1;min-width:0}
.task h1{font-size:33px;line-height:1.35;margin:0}
.task .lead{margin:11px 0 0}
.task-z{text-align:right}
.task-z em{display:block;font-style:normal;font-size:22px;color:var(--zink,var(--gold))}
.task-z b{display:block;font-size:22px;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}
.task .act-card{background:none;box-shadow:none;padding:14px 0 0;margin:0}
.task .ebar{margin:14px 0 0}
.task .card{background:rgba(0,0,0,.28);box-shadow:none;clip-path:none;margin:14px 0 0;padding:14px}

/* 底下那三樣：偶爾才用，但不能藏起來 */
/* ── 那一排門 ──

   接在廊道正下方（見 60-student.js）。本來是四顆半透明的小方塊，
   排在整頁靠底的地方——量到手機上要滑 1.8 屏。

   做大：圖示從 22 變 44，四顆平均分掉整行的寬，字在圖底下不在旁邊。
   一排四扇門，看起來像門，不像一列次要連結。 */
.desk{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  margin-top:14px;padding-top:14px;
  border-top:1px solid rgba(255,240,214,.10)
}
.dk{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:14px 5px;
  background:rgba(0,0,0,.30);border:none;cursor:pointer;color:var(--dim);
  font-size:22px;opacity:1;position:relative;min-height:110px;
  box-shadow:inset 0 0 0 2px var(--line)
}
/* 圖的盒子固定高，四扇才會一樣高——點陣圖的長寬比每一張都不同，
   不框住的話那一排會參差（量過：134 / 134 / 114 / 114）。 */
.dk .px{width:44px;height:44px;object-fit:contain}
.dk > .px, .dk > span.px{flex:0 0 44px}
.dk i{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line2)}
/* ── 有新東西的那一扇：光從裡面透出來 ──

   本來是 inset 0 0 0 2px var(--gold)——金色的內框。問題是按下去的樣子
   （.dk:active，見 52-material.css）**一模一樣**也是金色內框，所以一扇
   「裡面有東西」的門看起來就是一顆正在被按著的鍵。使用者講的就是這個：
   「很像是已經按上去了」。

   內框是往裡凹的，那是手指壓下去的方向。所以這裡改成往外：門面透出
   一層暖光、金邊長在外面。兩個方向相反，就不會再讀成同一件事。

   而且它比內框更顯眼——內框是往內縮的一條線，外光是整扇門亮起來，
   那正是這一扇要的：它是唯一會累積東西的那一扇，有新的就該被看見。 */
/* ── 而且它會一閃一閃 ──

   靜的金邊還是要被找到才看得到。這一扇是唯一會累積東西的門，多了
   一位委託人的那一刻應該自己跳出來，不用學生自己去比對哪裡不一樣。

   兩段硬切，不是漸亮漸暗——這個作品的東西一律逐格（見 53-scene.css
   的檔頭），漸層在這裡會像另一個系統的元件。

   暗的那一段還是亮的（金邊只是換成暗金、門面留一點光），所以它從頭到尾
   都讀得出「這扇有東西」；閃只是讓它被看見，不是讓它一半的時間消失。

   1.4 秒一次，跟廊道上角色呼吸那一下同一個拍子（bob）——同一個畫面上
   兩種節奏會打架。 */
@keyframes dkblink{
  0%,54%{
    background:rgba(233,179,65,.12);
    box-shadow:0 0 0 2px var(--gold), inset 0 2px 0 rgba(255,240,214,.16)
  }
  55%,100%{
    background:rgba(233,179,65,.04);
    box-shadow:0 0 0 2px var(--gold-d), inset 0 2px 0 rgba(255,240,214,.06)
  }
}
.dk.lit{
  color:var(--ink);
  background:rgba(233,179,65,.12);
  box-shadow:0 0 0 2px var(--gold), inset 0 2px 0 rgba(255,240,214,.16);
  animation:dkblink 1.4s steps(1,end) infinite
}
/* 關掉動畫的人拿到的是靜止的亮狀態，不是什麼都沒有。 */
@media (prefers-reduced-motion: reduce){ .dk.lit{animation:none} }
/* 按下去的時候還是要看得出被按住——所以 lit 的門按下去換回內框。
   同一顆鍵上，外＝有東西、內＝我正在按它。

   animation:none 一定要寫：動畫的宣告贏過一般宣告，不關掉的話手指
   壓在上面那一顆會照樣閃、而且完全沒有被按住的樣子——按了沒反應是
   最糟的那一種。 */
.dk.lit:active{
  animation:none;
  background:rgba(233,179,65,.12);
  box-shadow:0 0 0 2px var(--gold-d), inset 0 0 0 2px var(--gold)
}

/* ---------- 審核頁：釘在底部的那兩顆 ----------

   這一頁量到 4.7 屏，而決定在最底下（見 70-teacher.js）。
   釘住之後老師滑到哪都按得到，一個字都不用刪。

   不用 position:fixed 而用 sticky：fixed 會脫離文件流，底下那一段
   會被蓋住；sticky 留在流裡，配合底下那塊空白就不會壓到任何東西。 */
.rvw-pin{
  position:sticky;bottom:0;z-index:5;
  margin:22px -22px 0;padding:11px 22px;
  background:var(--panel);
  box-shadow:0 -2px 0 var(--line2), 0 -22px 22px -11px rgba(0,0,0,.55)
}
.rvw-pin-in{display:flex;gap:11px;align-items:stretch}
.rvw-pin .big{flex:1 1 auto}
.rvw-pin .ghost{flex:0 0 auto}
@media (max-width:430px){
  .rvw-pin{margin-left:-14px;margin-right:-14px;padding:11px 14px}
  .rvw-pin-in{gap:5px}
}

/* ---------- 你自己那幾件 ----------
   兩個數字並排，中間一支箭頭。沒有顏色編碼——多了幾天不是紅的，
   少了幾天也不是綠的：這一張只印不判（見 63-pack.js）。 */
.mine2 .m2-big{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;
  margin:5px 0 11px;font-size:22px;color:var(--dim)
}
.mine2 .m2-big b{
  font-size:44px;line-height:1;color:var(--ink);font-weight:400;
  font-variant-numeric:tabular-nums
}
.mine2 .m2-sep{color:var(--mute);padding:0 5px}

/* ---------- 全班最近 ----------
   打開它的理由是別人，留下來的理由才是自己。
   放的是「發生了什麼」，不是「誰比較好」——沒有名次、沒有印章。 */
.feed-h{margin:0 0 11px}
.feed{display:flex;flex-direction:column;gap:1px;background:#000}
.fd{
  display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--panel);
  font-size:22px;color:var(--dim)
}
.fd.mine{background:var(--panel2)}
.fd > div{flex:1;min-width:0}
.fd b{font-size:22px;color:var(--ink);font-weight:400;margin-right:8px}
.fd span{display:block;font-size:22px;color:var(--mute);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd > i{font-style:normal;font-size:22px;color:var(--mute);flex:0 0 auto}
.fd-ic{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  padding:0;border:none;background:none;cursor:pointer}
.px.core.sm{width:22px;max-height:66px}
@media (min-width:1200px){ .wrap > .task,.wrap > .feed,.wrap > .feed-h{flex:0 0 100%} }

/* 任務那一行：接在廊道正下面，不是一張卡 */
.tline{
  display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;
  margin:-11px 0 11px;padding:11px 14px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), 0 0 0 1px #000
}
.tline b{font-size:22px;font-weight:400;color:var(--ink)}
.tline i{font-style:normal;font-size:22px}
.srow{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 11px}
/* min-height 是手指的下限，不是版面要的高度。

   這一排是廊道上勾掉「這一段做完了」的方塊，量出來 42px。它跟別的
   鍵不一樣的地方是**它們並排而且很密**（gap 只有 5px）——按歪的那一下
   會落在隔壁那一段上，勾錯段。而勾錯了畫面不會說什麼，因為系統不判斷
   他勾得對不對。

   padding 算出來剛好差一點點，所以直接寫下限，不要再靠加減 padding
   去湊——字級或行高一動就又掉下來了。 */
.sq{
  display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:22px;
  min-height:44px;box-sizing:border-box;
  background:var(--sunk);color:var(--mute);border:none;cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), 0 0 0 1px #000
}
.sq b{width:11px;height:11px;display:block;box-shadow:inset 0 0 0 2px var(--line2)}
.sq.on{color:var(--dim)}
.sq.on b{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.sq:hover{color:var(--dim)}

/* ---------- 全班：一片被打通的岩層 ----------
   一格一格，往哪裡打通是自己選的。沒有名次、沒有計數、沒有排序。 */
.dig-wrap{
  overflow:auto;max-height:70vh;margin:0 0 22px;background:#06080B;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.7), inset 3px 0 0 rgba(0,0,0,.7),
    inset 0 -3px 0 rgba(255,240,214,.05), 0 0 0 1px #000
}
.dig{position:relative}
.dig-sky{position:absolute;left:0;top:0;height:6px;
  background:linear-gradient(180deg,#4A5C33 0 3px,#2E3A22 3px 6px);z-index:3}
.dg-c{position:absolute;width:40px;height:40px;padding:0;border:none}
.dg-c.rock{background-color:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.dg-c.dug{
  cursor:pointer;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(0,0,0,.7)
}
.dg-c.dug:hover{filter:brightness(1.25)}
.dg-c.dug.mine{box-shadow:inset 0 3px 0 rgba(255,255,255,.35),
  inset 0 -3px 0 rgba(0,0,0,.45), 0 0 0 2px var(--ink)}
.dig-z{position:absolute;left:3px;font-size:22px;color:var(--zink);opacity:.7;z-index:2}
.dig-n{position:absolute;font-size:22px;white-space:nowrap;z-index:4}
.dig-n.mine{font-weight:500}
.dig-nb{display:flex;flex-wrap:wrap;gap:11px;margin:-11px 0 22px}
.dig-nb span{font-size:22px;color:var(--gold);padding:5px 9px;background:var(--sunk)}

/* 封存那一頁的小地圖：往哪裡打通 */
.pickmap{position:relative;margin:11px 0}
.pk-c{position:absolute;width:33px;height:33px;padding:0;border:none}
.pk-c.rock{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.pk-c.own{box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(0,0,0,.7)}
.pk-c.can{background:rgba(233,179,65,.18);cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--gold-d)}
.pk-c.can:hover{background:rgba(233,179,65,.34)}
.pk-c.can.on{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold2)}

/* 能打通的那幾格：亮起來，點得動。PaGamO 最直覺的那一下。 */
.dg-c.rock.can{
  cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 6px rgba(233,179,65,.18);
  animation:cang 1.2s steps(1,end) infinite
}
@keyframes cang{
  0%,49%{box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 6px rgba(233,179,65,.18)}
  50%,100%{box-shadow:inset 0 0 0 2px var(--gold2), inset 0 0 0 6px rgba(233,179,65,.34)}
}
.dg-c.rock.can:hover{box-shadow:inset 0 0 0 3px var(--gold2), inset 0 0 0 20px rgba(233,179,65,.30)}
.dig-can{
  margin:-11px 0 22px;padding:11px 14px;font-size:22px;color:var(--gold);
  background:rgba(233,179,65,.10);box-shadow:inset 0 0 0 1px var(--gold-d)
}
@media (prefers-reduced-motion: reduce){ .dg-c.rock.can{animation:none} }

/* 兩組都構得到的那一格。誰先點誰拿走——最軟的一種競爭：
   沒有名次，也不會失去任何已經有的東西。 */
.dg-c.rock.hot2{
  background-image:repeating-linear-gradient(45deg,
    rgba(217,96,63,.30) 0 3px, transparent 3px 8px)
}
.dg-c.rock.can.hot{
  box-shadow:inset 0 0 0 2px var(--over), inset 0 0 0 6px rgba(217,96,63,.22);
  animation:hotg .9s steps(1,end) infinite
}
@keyframes hotg{
  0%,49%{box-shadow:inset 0 0 0 2px var(--over), inset 0 0 0 6px rgba(217,96,63,.22)}
  50%,100%{box-shadow:inset 0 0 0 2px #F08A6B, inset 0 0 0 6px rgba(217,96,63,.40)}
}
@media (prefers-reduced-motion: reduce){ .dg-c.rock.can.hot{animation:none} }

/* ── 照面 ──
   作業是行走，交代是戰鬥。整個流程最有份量的那一下本來長得像一張表單，
   現在是一個照面：自己在左邊，牠在右邊，中間是還沒發生的事。

   勝負不在這一頁上。它由承諾幾天與行事曆過了幾天決定——
   按得快、按得多，都不會改變任何東西。 */
.duel{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  gap:11px;padding:22px 22px 0;height:132px;overflow:hidden;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  background:linear-gradient(180deg,var(--z1) 0 62%,var(--z2) 62% 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.10)
}
.duel::after{ /* 地面那一條硬邊。沒有模糊，光永遠從左上來 */
  content:'';position:absolute;left:0;right:0;bottom:22px;height:3px;
  background:rgba(0,0,0,.34)
}
.duel-me,.duel-mob{position:relative;z-index:2;transform-origin:50% 100%}
.duel-me{animation:dbob 1.1s steps(2,end) infinite}
.duel-mob{animation:dbob 1.1s steps(2,end) infinite reverse}
/* 牠原本跟人一樣大，那就不像擋路的東西。直接把圖放大成兩倍寬——
   用 transform 放大會把它推出面板外，所以改成給尺寸。
   原圖是 24×16，比例照著給才不會被拉扁。 */
.duel-mob .fa-px{width:132px;height:88px;transform:scaleX(-1);image-rendering:pixelated}
@keyframes dbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 中間那三點：還沒發生的事。 */
.duel-gap{display:flex;gap:11px;align-items:center;padding-bottom:44px;z-index:2}
.duel-gap span{width:5px;height:5px;background:rgba(255,255,255,.45)}
.duel-gap span:nth-child(1){animation:dpt 1.2s steps(1,end) infinite}
.duel-gap span:nth-child(2){animation:dpt 1.2s steps(1,end) .4s infinite}
.duel-gap span:nth-child(3){animation:dpt 1.2s steps(1,end) .8s infinite}
@keyframes dpt{0%,60%{opacity:.15}61%,100%{opacity:1}}

.duel-t{margin:11px 0 0;color:var(--dim);font-size:22px;line-height:22px}

/* 打完了。牠退開，自己往前站一格。演一次，不循環。 */
.duel.done .duel-me{animation:dstep .5s steps(3,end) 1 forwards}
.duel.done .duel-mob{animation:dgone .6s steps(3,end) .2s 1 forwards}
.duel.done .duel-gap{opacity:0}
@keyframes dstep{to{transform:translateX(22px)}}
@keyframes dgone{to{transform:translateX(44px);opacity:.15}}

@media (prefers-reduced-motion: reduce){
  .duel-me,.duel-mob,.duel-gap span{animation:none}
  .duel.done .duel-mob{opacity:.15}
}

/* ── 你不在的這幾天 ──
   死線勇者回來看戰利品的那一下，換成誠實的版本：只報真的發生過的事。
   數字大、名字小，一眼掃完就過去，不佔位置。 */
.away{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;
  padding:11px 14px;margin-bottom:11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.away b{font-size:22px;line-height:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.away span{font-size:22px;color:var(--dim);margin-left:-16px}
.away em{font-size:22px;font-style:normal;color:var(--over)}

/* ── 面板 ──
   參考死線勇者：它整個畫面是一組有框的面板，不是一頁網頁。框、鉚釘、
   標題掛在框上，那三件事就足以讓一張卡片讀起來像遊戲介面。

   守住原本的規則：硬邊、零模糊、光從左上來、圓角一律 11px 的切角。 */
.card{position:relative}
/* 四個角那幾點拿掉了：框畫出來之後，它們正好壓在框的內緣上，
   而且它們本來在做的事（讓四個角有東西）現在框在做。 */
.card::after{
  content:'';position:absolute;inset:6px;pointer-events:none;z-index:0;
  display:none;
  background-image:
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%),
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%);
  background-size:3px 3px;background-repeat:no-repeat;
  background-position:0 0,100% 0,0 100%,100% 100%
}
.card > *{position:relative;z-index:1}

/* 標題掛在框上，像面板的名牌。 */
.card > .eyebrow:first-child{
  display:inline-block;margin:-4px 0 11px -6px;padding:3px 11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.10);
  clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)
}

/* ── 戰報 ──
   死線勇者的結果是一份回頭讀的報告。這裡也一樣：判定不是一張貼紙，
   是那一趟的幾行數字。數字對齊，因為它們是要被互相比較的。 */
.rep{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 22px}
.rep dt{
  font-size:22px;color:var(--dim);line-height:33px;
  border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd{
  margin:0;font-size:22px;line-height:33px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums;border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd.s{font-size:22px;text-align:left;color:var(--dim)}
.rep dt:last-of-type,.rep dd:last-of-type{border-bottom:0}

/* ── 地圖的環境 ──
   PaGamO 的地圖讀起來像一塊大陸，靠的不是格子畫得漂亮，是地表上有東西、
   地裡有東西、而且領土是一塊有輪廓的形狀。這三件事這裡都補上了。 */

/* 天。硬停的漸層，沒有模糊——一有模糊它就不是像素了。 */
.dig-sky{
  position:absolute;top:0;z-index:0;
  background:linear-gradient(180deg,#0B1020 0 40%,#141B31 40% 72%,#1E2440 72% 100%)
}
/* 上面那片林子。根脈層那一句說的根，就是從這裡穿下來的。 */
.dig-tree{
  position:absolute;width:9px;z-index:1;background:#1C2A18;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}
/* 泥土。岩層從這一條下面開始。 */
.dig-scrystal{
  position:absolute;height:8px;z-index:2;
  background:linear-gradient(180deg,#3E4A2C 0 3px,#2A2418 3px 8px)
}
/* 每一組下來的那個井口。自己那一個亮一點。 */
.dig-shaft{
  position:absolute;width:40px;height:11px;z-index:3;
  background:linear-gradient(180deg,rgba(255,240,214,.20) 0 3px,rgba(255,240,214,.07) 3px 11px)
}
.dig-shaft.mine{
  background:linear-gradient(180deg,rgba(233,179,65,.55) 0 3px,rgba(233,179,65,.16) 3px 11px)
}

/* 岩層交界。每一欄高度不同，所以它犬牙交錯——
   一條直線會讓整張圖讀起來像表格。 */
.dig-seam{position:absolute;width:40px;z-index:1;background:var(--zln);opacity:.85}

/* 岩層裡的東西。位置用座標算，所以水晶永遠在同一個地方。 */
.dg-c.rock{overflow:hidden}
.mp{position:absolute;width:18px;height:auto;opacity:.5;image-rendering:pixelated}

/* 同一層裡每一格的深淺差一點點，不然整片會像一塊布。 */
.dg-c.rock.v1{filter:brightness(1.08)}
.dg-c.rock.v2{filter:brightness(.92)}

/* 打通了的地：輪廓在 JS 那邊算（只描對外的邊），所以這裡不要再蓋一次。 */
.dg-c.dug{box-shadow:none}
.dg-c.dug.mine{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}

/* 走路：兩幀疊著，輪流出現。steps(1) 是硬切——
   淡入淡出會讓像素看起來像有殘影。 */
.scn-hero.walking{position:absolute}
/* 兩幀輪流播的那一張。不限定祖先的寬度——換個地方畫（挑角色那一頁）
   就會被原圖的像素尺寸撐開，那是 check.js 第七條在擋的事。 */
.wf{width:66px;height:66px;image-rendering:pixelated}
.scn-hero .wf{position:absolute;left:0;top:0}
.scn-hero .wa{animation:wkA .44s steps(1,end) infinite}
.scn-hero .wb{animation:wkB .44s steps(1,end) infinite}
@keyframes wkA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes wkB{0%,49%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .scn-hero .wa{animation:none;opacity:1}
  .scn-hero .wb{animation:none;opacity:0}
}

/* 地圖上的角色：站在自己最前緣那一格。 */
.dig-hero{position:absolute;z-index:6;width:44px;height:44px;pointer-events:none}
.dig-hero .ch{width:44px;height:44px;image-rendering:pixelated;
  filter:drop-shadow(2px 0 0 rgba(0,0,0,.55)) drop-shadow(-2px 0 0 rgba(0,0,0,.55))
         drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.dig-hero .wf{position:absolute;left:0;top:0}
.dig-hero .wa{animation:wkA .44s steps(1,end) infinite}
.dig-hero .wb{animation:wkB .44s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){
  .dig-hero .wa{animation:none;opacity:1}
  .dig-hero .wb{animation:none;opacity:0}
}

/* ── 蓋在地上的東西 ──
   地是組別的顏色，建築一律深色剪影加高光——所以每一組的建築讀起來
   一樣重，差別只在形狀。用顏色分強弱的話，那張圖就會被讀成排名。 */
.dg-c.dug{position:relative;display:block}
.bld{position:absolute;left:4px;bottom:2px;width:32px;height:32px;
  image-rendering:pixelated;pointer-events:none}

/* 兩組的地貼在一起長出來的路。 */
.dig-link{position:absolute;z-index:5;background:var(--gold);opacity:.8}
.dig-link.v{width:6px;height:18px}
.dig-link.h{width:18px;height:6px}

/* 三選一。三個一樣大、一樣亮——沒有一個看起來比較厲害。 */
.bp-row{display:flex;gap:11px;flex-wrap:wrap}
.bp{
  flex:1 1 88px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px;cursor:pointer;border:none;color:var(--ink);font:inherit;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bp:hover{box-shadow:inset 0 0 0 2px var(--gold), inset 2px 2px 0 rgba(255,255,255,.12)}
.bp-px{width:66px;height:50px;image-rendering:pixelated}
.bp b{font-size:22px;font-weight:400}

/* 點一座建築：那是哪一趟。建築不是獎品，是那一趟的紀念碑。 */
.bstory .bs-in{display:flex;gap:14px;align-items:flex-start}
.bs-px{width:66px;height:66px;image-rendering:pixelated;flex:0 0 auto}
.bstory h2{margin:6px 0 11px;font-size:22px;font-weight:400}

/* 廊道要滑得動、滑得順，而且不要搶走整頁的上下捲動。
   兩邊留一道暗邊，讓人看得出來它還有得滑。 */
.scn-scroll{
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;
  scrollbar-width:thin
}
.dig-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scn::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    linear-gradient(90deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%),
    linear-gradient(270deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%)
}

/* ── 這一圈走到哪 ──
   四拍，走完接回第一拍。這座地下城是無盡輪迴的，所以它是環不是條——
   沒有百分比、沒有終點。 */
.cyc{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
  padding:11px 14px;margin:0 0 11px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06);
  scrollbar-width:none
}
.cyc::-webkit-scrollbar{display:none}
.cy{display:flex;flex-direction:column;gap:1px;padding:3px 9px;white-space:nowrap;
  opacity:.42}
.cy b{font-size:22px;font-weight:400;color:var(--mute)}
.cy i{font-size:22px;font-style:normal;color:var(--dim)}
.cy.on{
  opacity:1;background:rgba(233,179,65,.12);
  box-shadow:inset 0 0 0 2px var(--gold-d)
}
.cy.on b{color:var(--gold)}
.cy.on i{color:var(--ink)}
/* 拍與拍之間的那一小段。最後一段接回第一拍，所以畫成虛的。 */
.cyd{flex:0 0 11px;height:3px;background:var(--line)}
.cyd.loop{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}

/* ── 承諾那一根尺 ──
   「你前幾趟」跟「你要說幾天」量的是同一個單位，所以畫在同一根尺上。
   本來還有第三條「別組怎麼看」——拿掉了，那條帶子會在按下承諾之前
   錨定他的預估，而預估正是這個系統唯一在量的東西。 */
.axis{position:relative;margin:14px 0 0;padding:0 3px}
.ax-row{position:relative;height:14px;margin-bottom:3px}
.ax-ok,.ax-link{position:absolute;top:5px;height:4px}


/* 你前幾趟：空心＝說的，實心＝實際的。線往右就是低估。 */
.ax-link{background:rgba(255,240,214,.16)}
.ax-said,.ax-was{position:absolute;top:2px;width:10px;height:10px;
  margin-left:-5px;border-radius:0}
.ax-said{background:transparent;box-shadow:inset 0 0 0 2px var(--mute)}
.ax-was{background:var(--mute)}
.ax-was.over{background:var(--over)}

/* 你現在拉到的地方，跟準的範圍。 */
.ax-now{height:18px}
.ax-ok{top:6px;height:6px;background:rgba(233,179,65,.28)}
.ax-me{position:absolute;top:0;width:4px;height:18px;margin-left:-2px;
  background:var(--gold)}

/* 尺。只標三個數字，多了就變成一張表。 */
.ax-ruler{position:relative;height:16px;margin-top:3px;
  border-top:2px solid var(--line)}
.ax-ruler i{position:absolute;top:3px;font-size:22px;font-style:normal;
  color:var(--dim);transform:translateX(-50%)}
.ax-ruler i:first-child{transform:none}
.ax-ruler i:last-child{transform:translateX(-100%)}

/* ── 說幾天：兩顆鍵 ──

   一按一天。數字在正中間，是這一頁最大的一個字——這一頁只有
   這一件事。兩顆鍵各佔一邊，77px 見方，手指不用瞄。

   到頭的那一顆暗下去。不擋（按下去也只是停在原地），
   擋住會讓人以為是壞了。 */
.estep{display:flex;align-items:center;justify-content:space-between;
  gap:11px;margin:0 0 11px}
.es-b{
  flex:0 0 77px;height:77px;border:none;cursor:pointer;
  font:inherit;font-size:44px;line-height:1;color:#1A1408;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,
    100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px);
  background-image:linear-gradient(180deg,
    var(--gold2) 0 3px, var(--gold) 3px calc(100% - 3px),
    var(--gold-d) calc(100% - 3px) 100%);
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75))
}
.es-b:hover{background-image:linear-gradient(180deg,
  #FFE29A 0 3px, var(--gold2) 3px calc(100% - 3px),
  var(--gold) calc(100% - 3px) 100%)}
.es-b:active{transform:translate(2px,2px);
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.75))}
/* 到頭了。看得出來，但按得下去。 */
.es-b.off{background-image:none;background:var(--panel2);color:var(--dim);
  filter:none;box-shadow:inset 0 0 0 2px var(--line)}
.es-n{display:flex;align-items:baseline;gap:6px}
.es-n b{font-size:88px;line-height:1;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}
.es-n span{font-size:33px;color:var(--dim)}
/* 選了小時／週的時候，估天數那顆尺換成一格數字輸入（見 56-viz.js
   的 estStepU）——跟兩顆按鍵版本用同一個 .estep 容器，只是內容換掉。 */
.estep input{width:120px;flex:0 0 auto;font-size:44px;text-align:center;
  font-variant-numeric:tabular-nums;margin:0}
.es-raw-u{font-size:33px;color:var(--dim)}
.ax-in{position:relative;margin:0 11px}

/* 岩層表面看得出哪幾格裡有東西——但看不出是什麼。
   看得出來，「往哪裡打通」才是一個真的選擇；
   看不出是什麼，那一格才值得去。 */
.dg-c.rock.has::before{
  content:'';position:absolute;right:6px;top:6px;width:3px;height:14px;
  background:linear-gradient(180deg,
    rgba(255,240,214,.42) 0 5px, transparent 5px 7px,
    rgba(255,240,214,.42) 7px 14px);
  box-shadow:2px 0 0 rgba(0,0,0,.5)
}
.dg-c.rock.can.has::before{background:var(--gold2);box-shadow:2px 0 0 rgba(0,0,0,.5)}

/* 掀開那一格。準的時候牠還在，失準的時候只剩痕跡——
   兩邊都是一則紀錄，沒有人被扣任何東西。 */
.unc .unc-in{display:flex;gap:14px;align-items:flex-start}
.unc-px{width:88px;height:66px;flex:0 0 auto;image-rendering:pixelated}
.unc-px.gone{opacity:.34;filter:grayscale(1)}
.unc-px.blank{background-color:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.unc h2{margin:6px 0;font-size:22px;font-weight:400}
.unc .quote{margin:11px 0 0;padding-left:11px;
  box-shadow:inset 3px 0 0 var(--gold-d);color:var(--ink)}

/* 老師勾了：這是整條流程裡唯一「別人為你做了一件事」的時刻，
   本來長得跟其他狀態一模一樣。給它一個到達的樣子。 */
.eyebrow.lit{color:var(--gold);
  animation:arrive 1.6s steps(1,end) 2}
@keyframes arrive{0%,49%{color:var(--gold)}50%,100%{color:var(--gold2)}}
.quote.big{font-size:22px;line-height:33px;color:var(--ink);
  padding:11px 0 11px 14px;box-shadow:inset 3px 0 0 var(--gold)}
.away em.ok{font-size:22px;font-style:normal;color:var(--gold)}

/* 「上」那一下的撞擊。整條流程最有份量的一按，本來按下去直接換頁。
   一次，不循環——它報的是結果不是過程。 */
.duel.done{animation:duelhit .22s steps(2,end) 1}
@keyframes duelhit{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}
.duel.done::before{
  content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:rgba(255,243,216,.8);
  animation:duelflash .22s steps(1,end) 1 forwards
}
@keyframes duelflash{0%{opacity:.9}30%{opacity:.35}100%{opacity:0}}

/* 戰報一行一行落下來。死線勇者的戰報是回來要讀的東西，
   一次全部出現就只是三個數字。 */
.rep dt,.rep dd{animation:repin .28s steps(3,end) both}
.rep dt:nth-of-type(1),.rep dd:nth-of-type(1){animation-delay:.20s}
.rep dt:nth-of-type(2),.rep dd:nth-of-type(2){animation-delay:.42s}
.rep dt:nth-of-type(3),.rep dd:nth-of-type(3){animation-delay:.64s}
.rep dt:nth-of-type(4),.rep dd:nth-of-type(4){animation-delay:.90s}
/* 只搬位置，不動 opacity——動畫的時鐘被凍住的時候（背景分頁、省電、
   自動化瀏覽器），用 opacity 當起始值會讓整行永遠看不見。
   動畫只能加東西，不能當成顯示的閘門。 */
@keyframes repin{from{transform:translateY(-8px)}to{transform:none}}

@media (prefers-reduced-motion: reduce){
  .duel.done{animation:none}
  .duel.done::before{display:none}
  .rep dt,.rep dd{animation:none}
  .eyebrow.lit{animation:none}
}

/* 坐著：兩幀，差在呼吸。停下來不是停止。 */
.scn-hero.resting .wa{animation:wkA 1.6s steps(1,end) infinite}
.scn-hero.resting .wb{animation:wkB 1.6s steps(1,end) infinite}

/* 營火三幀，跟火把同一套做法。
   火本來就絕對定位在洞口裡，所以這裡只擺三幀，不要再蓋一次 position——
   蓋掉它就會掉回文件流，畫成兩堆火。 */
.mouth .mfire .ff{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;
  animation:flk 420ms steps(1,end) infinite}
.mouth .mfire .f1{animation-delay:140ms}
.mouth .mfire .f2{animation-delay:280ms}
/* 點著的火在旁邊打出一圈光。沒有模糊——一有模糊就變成現代特效。 */
.mouth .mfire.lit::after{
  content:'';position:absolute;left:-44px;top:-33px;width:132px;height:110px;
  pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 60%,
    rgba(233,132,63,.13) 0 33px, rgba(233,132,63,.06) 33px 55px, transparent 55px)
}
@media (prefers-reduced-motion: reduce){
  .mouth .mfire .ff{animation:none;opacity:0}
  .mouth .mfire .f0{opacity:1}
  .scn-hero.resting .wa{animation:none;opacity:1}
  .scn-hero.resting .wb{animation:none;opacity:0}
}


/* ── 營火旁 ──
   火在左邊，人面對火。要讓「他在那裡休息」不用一句話解釋，
   靠三件事：坐姿的輪廓、火光打在他左側、火星一直在飄。 */

/* 火光打在人身上。硬邊的一道緣光，不是光暈——
   一有模糊就會看起來像貼在像素圖上的現代特效。 */
.scn-hero.resting .ch{
  filter:drop-shadow(-2px 0 0 rgba(233,132,63,.75))
         drop-shadow(-3px 0 0 rgba(233,132,63,.30))
}

/* 火星。這個畫面上唯一一直在動的小東西——
   沒有它，「坐在火旁邊」看起來會像一張靜止的圖。 */
.mouth .ember{
  position:absolute;bottom:78px;width:2px;height:2px;
  background:#FFD9A0;z-index:3;pointer-events:none;
  animation:emb var(--ed,1800ms) steps(7,end) infinite
}
@keyframes emb{
  0%{transform:translate(0,0);opacity:0}
  10%{opacity:.95}
  60%{opacity:.7}
  100%{transform:translate(6px,-44px);opacity:0}
}

/* 人坐著的地方地上暖一塊。硬停，沒有漸層模糊。 */
.mouth::after{
  content:'';position:absolute;left:0;bottom:40px;width:132px;height:14px;
  pointer-events:none;z-index:0;
  background:linear-gradient(90deg,
    rgba(233,132,63,.16) 0 44px,
    rgba(233,132,63,.09) 44px 88px,
    transparent 88px)
}

@media (prefers-reduced-motion: reduce){
  .mouth .ember{animation:none;opacity:.6}
}

/* 剖面圖上，那一趟蓋的東西站在那一層裡。
   深度是走出來的，蓋什麼是挑的——這是圖上唯一屬於「他們自己選的」東西。 */

/* ── 你說的那一天 ──
   原始設計裡就有的一條虛線，一直沒做。它讓「我承諾了幾天」在畫面上
   有一個實體：線在前面，水從後面追上來。
   它不是終點線——每一組的線在不同的地方，因為那是各自說的。 */
/* .vow 拿掉了：那條虛線是把「你說幾天」拉成一條線壓在走廊上。 */

/* ── 任務清單 ──
   老師派過的每一件事，各自走到哪。數字靠右對齊，因為「你說幾天」跟
   「實際幾天」是要被互相比較的——這一頁順便就是他們自己的估算史。 */
.tk-list{display:flex;flex-direction:column}
.tk{padding:14px 0;border-bottom:2px solid rgba(0,0,0,.16)}
.tk:last-child{border-bottom:0}
.tk-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tk-h b{font-size:22px;font-weight:400;line-height:33px;color:var(--ink)}
.tk-s{
  flex:0 0 auto;font-size:22px;font-style:normal;padding:2px 8px;
  color:var(--mute);background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)
}
.tk-s.go{color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-d)}
.tk-s.ok{color:#7FA866;box-shadow:inset 0 0 0 2px rgba(127,168,102,.5)}

.tk-n{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.tk-n span{font-size:22px;color:var(--dim)}
.tk-n b{font-size:22px;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-right:11px}
.tk-n b.late{color:var(--late)}
.tk-n .tk-u{margin-left:-8px}

/* 岩心掛在它自己那一趟旁邊——它終於有出處了。 */
.tk-k{display:flex;align-items:center;gap:9px;margin-top:9px}
.tk-k .core{height:22px;width:auto;image-rendering:pixelated}
.tk-k span{font-size:22px;color:var(--dim)}

/* ── 那一閃 ──
   同一張圖用全白的配色再畫一次疊在上面，然後淡出。
   用一塊白色方塊蓋上去會變成方形的閃光，那不是剪影。 */
.pxflash{
  position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none;z-index:5;image-rendering:pixelated;
  animation:pxfl .45s steps(3,end) 1 forwards
}
@keyframes pxfl{0%{opacity:1}55%{opacity:.55}100%{opacity:0}}
.pxwrap{position:relative;display:inline-block;flex:0 0 auto}
.bt-ch{position:absolute}

/* ── 紀錄 ──
   一列一趟：牠在最左邊、資訊在右邊、點開才看細節。
   本來每一趟是一張攤開的大卡，五六趟之後整頁要捲很久，而且每一張長得
   一樣——那不是紀錄，是一疊表格。一頁能不能兩秒看懂，靠的是預設收起來。 */
.rec-list{display:flex;flex-direction:column}
/* 一列用格線排：左邊一格放牠，中間三列放資訊，右邊一格放印章。
   本來是 button 裡面再包一層區塊，那樣第一個子元素會被收縮成內容寬
   ——標題就變成一個字一行。格線沒有這個問題。 */
.rec{
  display:grid;grid-template-columns:55px 1fr auto;column-gap:14px;
  width:100%;text-align:left;align-items:start;
  padding:11px 0;border:none;background:none;font:inherit;color:var(--ink);
  cursor:pointer;border-bottom:2px solid rgba(0,0,0,.16)
}
.rec-px{grid-column:1;grid-row:1 / 4;display:flex;align-items:center;height:44px}
.rec-px .px{width:55px;height:auto;image-rendering:pixelated}
.rec-t{
  grid-column:2;grid-row:1;font-size:22px;font-weight:400;line-height:33px;
  /* 折行，不要截斷：22px 之下截斷只剩八個字。 */
  overflow-wrap:anywhere
}
.rec-d{grid-column:2;grid-row:2;font-size:22px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.rec-s{grid-column:3;grid-row:1 / 4;display:flex;align-items:center;opacity:.9}
.rec-s .px{width:22px;height:auto;image-rendering:pixelated}
.rec-s.none{color:var(--dim)}
.rec-st{font-size:22px;font-style:normal;color:var(--mute);white-space:nowrap}
.rec:hover .rec-t{color:var(--gold)}
.rec.open{border-bottom:0}
.rec.open .rec-t{color:var(--gold)}
.rec-more{
  padding:0 0 14px 69px;border-bottom:2px solid rgba(0,0,0,.16)
}
.rec-more .tags{margin-top:11px}
@media (max-width: 599px){ .rec-more{padding-left:0} }

/* ── 走出去的那一下 ──
   一道從上面下來的光、兩邊是岩壁、人沿著光往上走出畫面。
   沒有粒子、沒有光暈：硬邊、零模糊、光從上面來。 */
.xit{
  position:relative;height:264px;overflow:hidden;margin:0 0 22px;
  background:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.32);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.xit-rock{position:absolute;top:0;bottom:0;width:38%;background:rgba(0,0,0,.55);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.xit-rock.l{left:0}
.xit-rock.r{right:0}
/* 光。硬停的三段，不是漸層——一有模糊就變成現代特效。 */
/* 地表上面是日光。走上去就是走進光裡——
   底下越深越暗，那一條線是分界。 */
.xit-sky{position:absolute;left:0;right:0;top:0;height:22px;
  background:linear-gradient(180deg,#F7ECD2 0 14px,#D9C08A 14px 22px)}
.xit-beam{
  position:absolute;left:38%;right:38%;top:22px;bottom:0;
  background:linear-gradient(180deg,
    rgba(255,243,216,.52) 0 33px,
    rgba(255,243,216,.30) 33px 88px,
    rgba(255,243,216,.14) 88px 176px,
    rgba(255,243,216,.05) 176px 100%)
}
/* 光打在兩邊岩壁上的那一道邊。硬邊，沒有模糊。 */
.xit-beam::before,.xit-beam::after{
  content:'';position:absolute;top:0;bottom:0;width:3px;
  background:rgba(255,243,216,.30)
}
.xit-beam::before{left:-3px}
.xit-beam::after{right:-3px}
.xit-top{position:absolute;left:0;right:0;top:22px;height:3px;
  background:#8A7346}
.xit-hero{
  position:absolute;left:50%;bottom:22px;width:66px;margin-left:-33px;
  animation:xitup 2.4s steps(8,end) 1 forwards
}
.xit-hero .ch{width:66px;height:66px;image-rendering:pixelated}
@keyframes xitup{
  0%{transform:translateY(0);opacity:1}
  70%{transform:translateY(-154px);opacity:1}
  100%{transform:translateY(-198px);opacity:0}
}
@media (prefers-reduced-motion: reduce){ .xit-hero{animation:none} }

/* 剖面圖：走出去的那一組，廊道整條亮著一道光通到地表。 */
.xs-out{
  position:absolute;left:0;right:0;top:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,243,216,.20) 0 66px,
    rgba(255,243,216,.10) 66px 198px,
    rgba(255,243,216,.04) 198px 396px,
    transparent 396px)
}
.xs-shaft.left .xs-head b{color:var(--gold2)}
/* 走出去的那個人站在地表上。靠右擺，不然會壓到組名。 */
.xs-hero.out{z-index:4;left:auto;right:6px}

/* 他們自己寫的那兩段：小標在上、原話在下。
   系統不解讀、不歸類——原話放上去就好。 */
.quote b{display:block;font-size:22px;font-weight:400;color:var(--gold2);
  margin-bottom:3px}
/* 署名也走同一條。.quote.big（老師收下／退回那一句）跟 .quote.tw
   各自設了自己的顏色，權重比上面那一條高——名字會被吃成跟句子
   一模一樣，於是「老師·孟」讀起來像那句話的第一行，不像是誰說的。

   一個班三位老師共同帶，那個名字是這一句話最重要的一半。 */
.quote.big b,.quote.tw b{color:var(--gold2)}

/* 廊道抓得住。桌機上本來只能靠捲軸，等於不能前後看。 */
.scn-scroll{cursor:grab}
.scn-scroll.dragging{cursor:grabbing;user-select:none}
.scn-scroll.dragging .scn-in{pointer-events:none}

/* 排行榜的單位。只說一次，每一列就只剩數字。 */
.rk-u{margin:-6px 0 11px;font-size:22px;color:var(--dim)}

/* ── 全班最近：一則一行 ──
   本來一則兩行，十則就是二十行長得很像的字，整段讀起來是一面牆。
   壓成一行之後掃過去就知道最近誰動了。 */
.fd{
  /* 少一欄：任務名拿掉了（字放大之後那一欄只剩幾個字）。 */
  display:grid;grid-template-columns:22px auto auto 1fr;
  align-items:center;gap:9px;padding:6px 0;
  border-bottom:2px solid rgba(0,0,0,.14)
}
.fd:last-child{border-bottom:0}
.fd-ic{display:flex;align-items:center;justify-content:center}
.fd-ic .px{width:22px;height:auto;image-rendering:pixelated}
.fd b{font-size:22px;font-weight:400;color:var(--ink);white-space:nowrap}
.fd em{font-size:22px;font-style:normal;color:var(--gold2);white-space:nowrap}
.fd i{font-size:22px;font-style:normal;color:var(--mute);white-space:nowrap}
.fd.mine b{color:var(--gold)}

/* ── 承諾與實際：一條，不是兩排 ──
   本來上下兩排方格量的是同一件事（天數），讀的人得自己把兩排疊起來。
   疊成一條之後，要看的只有一件事：實心那一段停在淺色那一塊裡面沒有。 */
.eb-track{
  position:relative;height:22px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)
}
/* 準的範圍。停在裡面就是準。 */
.eb-band{position:absolute;top:0;bottom:0;background:rgba(233,179,65,.14);
  box-shadow:inset 2px 0 0 var(--gold-d), inset -2px 0 0 var(--gold-d)}
/* 實際走了幾天。 */
.eb-go{position:absolute;left:0;top:0;bottom:0;background:var(--gold-d);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.14)}
.ebar.over .eb-go{background:var(--over)}
/* 你說的那一天。 */
.eb-say{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;
  background:var(--gold2)}

.eb-n{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.eb-n b{font-size:22px;line-height:22px;font-weight:400;
  font-variant-numeric:tabular-nums}
.eb-say-n{font-size:22px;color:var(--dim)}
.eb-say-n b{color:var(--gold2)}
.eb-go-n{font-size:22px;color:var(--dim)}
.eb-go-n b{color:var(--gold)}
.ebar.over .eb-go-n b{color:var(--over)}
.eb-u{font-size:22px;color:var(--dim);margin-left:-8px}

/* 任務清單裡那一根點得開——那一根怎麼讀，全系統只有那一張卡說得出來。 */
.tk-k{border:none;background:none;font:inherit;padding:0;
  text-align:left}

/* ── 接口 ──
   介面只給最少：兩段亮的短邊，一個從上面垂下來的口。
   看得懂需要的就這些，不用一句話說明。 */
.bp{position:relative;padding-top:16px;padding-bottom:16px}
.bp-p{
  position:absolute;left:50%;width:14px;height:5px;margin-left:-7px;
  background:rgba(255,240,214,.08)
}
.bp-p.u{top:5px}
.bp-p.dn{bottom:5px}
.bp-p.on{background:var(--gold-d)}
.bp.fit{box-shadow:inset 0 0 0 2px var(--gold), inset 2px 2px 0 rgba(255,255,255,.12)}
.bp.fit .bp-p.u.on{background:var(--gold)}

/* 上一層留下的那個口。畫出來就是題目。 */
.bp-above{display:flex;flex-direction:column;align-items:center;margin:0 0 6px}
.bp-ax{width:55px;height:41px;image-rendering:pixelated;opacity:.75}
.bp-drop{width:5px;height:16px;background:var(--gold-d)}

/* ── 接起來的那一段 ──
   畫面這一半要滿：兩條側樑加橫檔，像一段真的架起來的東西。 */
.xs-link{
  position:absolute;left:50%;bottom:-14px;width:22px;height:22px;margin-left:-11px;
  z-index:2;pointer-events:none;
  background:
    linear-gradient(90deg,transparent 0 3px,#FFE9A8 3px 6px,transparent 6px 16px,
      #FFE9A8 16px 19px,transparent 19px 22px),
    repeating-linear-gradient(180deg,#C9A227 0 3px,transparent 3px 8px)
}

/* 建築本身放大：那條廊道要讀起來像一條街，不是一排小圖示。 */
/* 六種形狀要看得出輪廓，44px 還是太小。放到 55px，貼齊地面。 */

/* 排行榜改成三顆點：實心是準的，空心是還沒。
   畫成點不畫成長條——長條會讀成「量」，而這裡是次數。 */
.rk-dots{flex:1;display:flex;gap:9px;align-items:center;min-width:44px}
/* .rk-r b 那一條把整列的 b 都設成 flex:0 0 66px，所以點會被撐開。 */
/* 三個判定記號，一趟一個，照時間排。
   本來是三顆點（實心＝準的），讀得出「幾次」，但把「往哪一邊偏」丟掉了。
   全部朝右的那一列，是「他每一趟都比自己說的久」——那是舊的點看不出來的。 */
.rk-m{flex:0 0 33px;display:flex;align-items:center;justify-content:center;height:33px}
/* 記號是 16×12，兩邊都釘住——固定尺寸的點陣圖不該用 auto，
   那樣圖還沒解碼完的時候那一格是 0 高，整列會跳一下。 */
.rk-m .px{width:33px;height:25px;image-rendering:pixelated}
/* 還沒走到第三趟的那幾格：一個空的位子，不是一個空心的點——
   空心的點看起來像「沒準」，而它其實是「還沒有」。 */
.rk-m.none{position:relative}
.rk-m.none::after{content:'';position:absolute;left:50%;bottom:9px;
  width:11px;height:2px;margin-left:-5px;background:var(--line2)}

/* ── 老師：派過的每一個壓成一行 ──
   本來一個一張卡，還帶著注意事項與每一組承諾幾天的標籤——
   派了十個就是十張卡，而老師在這一頁要做的只有「再派一個」。 */
.msr{
  display:grid;grid-template-columns:1fr auto auto;gap:4px 11px;
  align-items:baseline;padding:11px 0;
  border-bottom:2px solid rgba(0,0,0,.16)
}
.msr:last-child{border-bottom:0}
/* 折行，不要截斷——任務名是那一列的身分。 */
.msr > b{font-size:22px;font-weight:400;line-height:33px;overflow-wrap:anywhere}
.msr-w{font-size:22px;color:var(--gold2);white-space:nowrap}
.msr-n{font-size:22px;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
/* 誰派的。自己跟別人都寫，佔滿一整列，不跟上面那幾個數字擠。
   自己那句顏色比較亮——掃過去找自己剛派的那一件不用一行一行讀字。 */
.msr-by{grid-column:1 / -1;font-size:22px;color:var(--dim)}
.msr-by.mine{color:var(--gold2)}

/* 別人那一行：看得到，按不動。跟交出去那一頁的 .sp2.theirs 同一個做法。 */
.pl.theirs{opacity:.72}
.pl .got{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
/* 還沒本人按過的那個數字：它現在只是一個預設值，不是誰說的話。 */
.pl .wait{color:var(--mute);text-decoration:underline dotted}

/* 上一趟。一行，接在這一趟的來歷底下。 */
.prev{margin:11px 0 0;color:var(--mute)}

/* 當初派的時候分的那幾段。一塊一段，掃過去就好——
   他們自己拆成什麼樣子在底下那一段，兩個並排才看得出有沒有走鐘。 */
.msspec{display:flex;flex-wrap:wrap;gap:5px 11px;margin:11px 0 0}
.mss{
  display:inline-flex;align-items:baseline;gap:6px;
  font-size:22px;color:var(--dim);
  background:var(--sunk);padding:3px 11px
}
.mss i{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}

/* 各組承諾了幾天。老師唯一看得到的「他們怎麼想這件事」。 */
.msr-e{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 14px}
.msr-e i{font-size:22px;font-style:normal;color:var(--dim);
  font-variant-numeric:tabular-nums}
.msr-e b{color:var(--ink);font-weight:400}

/* 三選一那三張：建築是深色剪影，畫在深色卡片上等於看不見。
   給它一塊亮的地面站著——那也剛好就是它蓋好之後在剖面圖上的樣子
   （那裡的底色是自己那一組的顏色），所以這張卡同時是預覽。 */
.bp{position:relative;padding-top:0;padding-bottom:11px;overflow:hidden}
.bp-ground{
  display:block;width:100%;height:55px;margin:0 0 9px;
  background:var(--gold);position:relative;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.30), inset 0 -3px 0 rgba(0,0,0,.45)
}
.bp-ground .bp-px{position:absolute;left:50%;bottom:2px;margin-left:-33px}
.bp-p.u{top:0}
.bp-p.dn{bottom:2px}

/* ── 營地 ──
   每走完一趟留下的那一個記號排在洞口的地上，洞口的寬度跟著長。
   十趟之後這裡是一個被你佈置過的營地——而首頁就是這條廊道。 */

/* 碰到的是誰留的。系統不編故事——這幾個字全部是別組自己打的。 */
.unc-by{
  font-size:22px;color:var(--gold);margin-top:5px;
  font-variant-numeric:tabular-nums
}

/* ── 留記號那一張 ──
   這是走完一整趟的收尾，本來只有一行 11px 的眉標。 */
.bpick .bp-h{font-size:33px;margin:0 0 5px}
.bpick .bp-sub{font-size:22px;color:var(--dim);margin:0 0 14px}
.bpick .bp-ground{height:88px}
.bpick .bp-px{width:99px;height:75px;margin-left:-49px}
.bpick .bp b{font-size:22px}
.bpick .bp i{font-style:normal;font-size:22px;color:var(--dim)}
.bpick .bp{flex:1 1 132px;gap:2px}
@media (max-width:520px){
  .bpick .bp-h{font-size:22px}
  .bpick .bp{flex:1 1 100%}
}


/* 一趟就這四件事。 */
.four{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:33px 0 0;padding:14px 0;border-top:1px solid var(--line2)
}
.fr{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px}
.fr-px{width:22px;height:22px;image-rendering:pixelated}
.fr b{font-size:22px;font-weight:400;color:var(--dim);white-space:nowrap}
.fr-a{width:14px;height:2px;background:var(--line2);flex:0 0 14px}
@media (max-width:520px){
  .four{gap:5px}
  .fr{min-width:55px}
}
/* 窄的時候排成 2×2，連接線收起來。

   本來是一排四格加三根連接線，靠 flex-wrap 換行。375 寬量到：
   第四格換到第二行，而它前面那一根線跟著換行、停在整行的最左邊
   （x=18，在「拿到水晶」左邊 19px），指著畫面外——那是學生
   第一眼看到的頁。

   換行的線沒有意義：兩格不相鄰的時候，它連的東西不在旁邊。 */
@media (max-width:430px){
  .four{display:grid;grid-template-columns:1fr 1fr;gap:14px 5px;justify-items:center}
  .fr-a{display:none}
  .fr{min-width:0}
}

/* ── 剖面圖底下那三顆 ──
   本來這幾段是直的疊在一起，一路捲到兩千像素。捲到底的東西等於沒有。 */
.segs{
  display:flex;gap:5px;margin:22px 0 14px;
  border-bottom:1px solid var(--line2);padding-bottom:0
}
.seg{
  padding:9px 14px;border:0;background:none;cursor:pointer;
  font:inherit;font-size:22px;color:var(--dim);
  border-bottom:3px solid transparent;margin-bottom:-1px
}
.seg:hover{color:var(--ink)}
.seg.on{color:var(--gold);border-bottom-color:var(--gold)}

/* ── 別組的紀錄 ──
   一列＝一趟。兩個數字跟一個他們自己取的名字，沒有評語。 */
.orec{display:flex;flex-direction:column}
.or{
  display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line)
}
.or:last-child{border-bottom:0}
.or-s{display:flex;align-items:center}
.or-s .px{width:22px;height:auto;image-rendering:pixelated}
.or b{font-size:22px;font-weight:400;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or-n{font-size:22px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.or-n b{color:var(--gold)}
.or.late .or-n b:last-child{color:var(--late)}
.or-w{grid-column:2 / 4;font-size:22px;color:var(--mute);margin-top:-5px}

/* 招牌的小圖。只有剖面圖的欄頭有訂過大小，所以它在別的地方
   （點進一組那張卡）會被 flex 撐成 565px 見方——一整塊招牌蓋住整張卡。 */
.px.sign-s{width:33px;height:33px;flex:0 0 33px;image-rendering:pixelated}

/* 記號點開來看到的那一趟：一天兩列的柱狀圖。任務之證併進來之後它住在這裡。 */
.bstory .bs-core{width:66px;height:auto;image-rendering:pixelated;flex:0 0 66px}

/* ── 每一張點陣圖自己知道自己多大 ──
   本來這幾張只有「在某個容器裡」才有寬度（.xs-hero .ch-s、.zn .zn-px…），
   所以換一個地方畫就會被 flex 撐開——招牌那一張在「點進一組」那張卡上
   長成 565px 見方，蓋住整張卡。畫在哪裡都對的那一條寫在這裡，
   容器裡要不一樣的照樣蓋得掉。 */
.px.zn-px{width:44px;height:44px}
.px.ch-s{width:36px;height:36px}
.px.vine-s{width:36px;height:36px}
.px.ff{width:44px;height:44px}
.px.bs-core{width:66px;height:auto;flex:0 0 66px}

/* 副標題。一句話說完這是什麼——在名字底下，在那兩顆鈕上面。 */
.gate .tagline{
  font-size:33px;line-height:1.35;color:var(--gold);
  margin:11px 0 33px;text-wrap:balance
}
@media (max-width:520px){ .gate .tagline{font-size:22px} }

/* ── 你說要走多遠 ──
   一格一天，亮到你拉到的那一格，擋路的那一隻站在盡頭。
   它不是另一個資訊——是同一個數字換成你等一下真的會看到的樣子。 */
.ew{margin:14px 0 0;overflow-x:auto;overscroll-behavior-x:contain}
.ew-in{display:flex;align-items:flex-end;gap:3px;min-height:44px;padding-bottom:3px}
.ew-c{
  flex:0 0 14px;width:14px;height:22px;
  background:var(--gold-d);
  box-shadow:inset 0 3px 0 var(--gold), inset 0 -3px 0 rgba(0,0,0,.45)
}
.ew-m{flex:0 0 auto;margin-left:9px;display:flex;align-items:flex-end}
.px.ew-px{width:44px;height:44px;image-rendering:pixelated}

/* 判定那一頁上的他。準了舉手，比說的久就撐著膝蓋喘。 */
.stamp-who{margin:0 0 11px}
.px.sw-px{width:88px;height:88px;image-rendering:pixelated}
@media (max-width:520px){ .px.sw-px{width:66px;height:66px} }

/* ── 記號就是那一趟 ──
   一天兩列的柱子。它有多高，就是那一趟過了幾天——
   營地上一排高矮不同的東西，而高矮的原因是他自己走出來的。 */
.bpick .bp-one{display:flex;gap:22px;align-items:flex-end;margin:0 0 22px}
.bpick .bp-ground{
  flex:0 0 110px;width:110px;min-height:110px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
  background:var(--gold);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.30), inset 0 -3px 0 rgba(0,0,0,.45)
}
.bpick .px.bp-px{width:55px;height:auto;max-height:242px;image-rendering:pixelated}
.bpick .bp-say{flex:1;min-width:0}
.bpick .bp-say b{display:block;font-size:33px;font-weight:400;line-height:1.3}
.bpick .bp-say span{display:block;font-size:22px;color:var(--gold);
  font-variant-numeric:tabular-nums;margin-top:5px}
.bpick .bp-say i{display:block;font-style:normal;font-size:22px;color:var(--dim);margin-top:11px}
@media (max-width:520px){
  .bpick .bp-one{flex-direction:column;align-items:stretch;gap:14px}
  .bpick .bp-ground{flex:none;width:100%;min-height:132px}
}

/* 營地上那一排。站在地上，高矮不齊——那正是重點。 */

/* ── 走過的每一趟 ──
   一趟一格，舊的在左、新的在右——跟廊道同一個方向，
   所以「往左滑」＝「往回看」不用學。打開的時候停在最右邊。 */
.rstrip{
  overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  margin:0 0 11px;padding:0 0 6px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06)
}
.rs-in{display:flex;align-items:stretch;gap:2px;padding:11px 11px 0}
/* 一格一隻牠。

   本來一格四行（記號的詞、任務名、說幾天實際幾天、留下的那句話），
   八趟排開來就不是一條帶子，是一張表攤平了放在首頁。

   現在格子裡只有兩樣：牠，跟兩個數字。牠是那一趟盡頭擋路的那一隻，
   所以牠就是那一趟的名字——不用讀。詳細的點進去看。

   底下那一條是準度：金＝說中、綠＝比說的快、紅＝比說的久。
   一整排掃過去看得出自己有沒有在變準，那是一句話講不出來的。 */
.rs{
  flex:0 0 110px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:11px 6px 0;border:0;background:var(--panel);color:inherit;font:inherit;
  cursor:pointer;text-align:center
}
.rs:hover{background:var(--panel2)}
.rs:active{transform:translateY(2px)}
.rs-px{width:66px;height:auto;image-rendering:pixelated}
.rs-s{display:flex;flex-direction:column;align-items:center;gap:2px;
  width:100%;padding:0 0 8px}
.rs-s .px{width:33px;height:25px;image-rendering:pixelated}
.rs i{font-style:normal;font-size:22px;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rs i u{text-decoration:none;color:var(--dim);padding:0 2px}
/* 準度那一條 */
.rs::after{content:"";display:block;width:100%;height:5px;background:var(--line)}
.rs.exact::after{background:var(--ok)}
.rs.early::after{background:var(--early)}
.rs.late::after{background:var(--late)}

/* 帶子的名字。概念要有名字，他才知道自己在練什麼。 */
.rs-h{
  font-size:22px;color:var(--gold);margin:0 0 6px;
  font-variant-numeric:tabular-nums
}

/* 結算那一頁的主角：一整個學期在量的唯一一件事。 */
.exsum .ex-big{
  font-size:33px;line-height:1.4;margin:5px 0 18px;color:var(--dim)
}
.exsum .ex-big b{font-size:44px;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}

/* ── 老師排到哪一天 ──

   老師對專案制定有自主權，排程是那個自主權最具體的一半。但它
   **不進判定**——所以它不能長得像警告：沒有紅色、沒有驚嘆號、
   過了也只是換一個字。它是一個事實，不是一個判決。 */
.dueline{
  display:flex;align-items:baseline;gap:8px;margin:0 0 11px;
  padding:8px 11px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.5), inset 0 -2px 0 rgba(255,240,214,.05)
}
.dueline span{font-size:22px;color:var(--dim)}
.dueline b{font-size:33px;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums}
.dueline em{font-style:normal;font-size:22px;color:var(--dim);margin-left:auto}
/* 過了就換一個字。顏色不換——換顏色就變成在說他做錯了。 */
.dueline.past em{color:var(--mute)}

/* 走廊上那一條線。老師排的那一天落在第幾格。
   虛線，因為它不是牆——走得過去。 */
.ew-due{
  flex:0 0 3px;align-self:stretch;margin:0 4px;
  background:linear-gradient(180deg,
    var(--dim) 0 6px, transparent 6px 11px);
  background-size:100% 11px
}
/* 承諾之外的那幾格：還沒有人走的地方。 */
.ew-c.off{opacity:.28}

/* 派過的那一行上，我排到哪一天。 */
.msr-d{font-size:22px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.msr-d.past{color:var(--mute)}

/* 任務清單上，老師排到哪一天。接在日期那一格裡換行。 */
.rec-due{display:block;font-style:normal;font-size:22px;color:var(--dim);
  white-space:nowrap}

/* ── 交出去之後在等 ──
   本來只有一句「等他看」。三個數字全部都在，給他就好：
   交出去幾天、他手上幾件、你第幾。這不是催促——被催的是老師，
   而催老師不該由學生端的畫面來做，所以這裡一個評價的字都沒有。 */
.waitq{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:11px 0 0
}
.waitq span{font-size:22px;color:var(--dim)}
.waitq b{font-size:44px;line-height:1;font-weight:400;color:var(--gold);
  font-variant-numeric:tabular-nums}
.waitq em{font-style:normal;font-size:22px;color:var(--dim);width:100%}

/* 排到什麼時候：加減鍵比承諾那一對小一號——這是老師的工具，
   不是這一頁的主角。 */
.duestep{margin:0 0 6px}
.duestep .es-b{flex:0 0 55px;height:55px;font-size:33px}
.duestep .es-n b{font-size:55px}
.duestep .es-n span{font-size:22px}
/* 算出來是哪一天。相對的輸入，絕對的顯示。 */
.duewhen{font-size:22px;color:var(--ink);margin:0 0 11px}

/* 老師勾了。一張通知，不是一個動作——記號已經插進那一層了。 */
.okcard{
  margin:0 0 11px;padding:14px;background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--gold-d)
}
.okcard b{display:block;font-size:22px;font-weight:400;color:var(--ink);margin:4px 0}
/* 大的那一句。33px 是這個作品裡標題的字級——它就是一個標題。 */
.okcard b.ok-big{
  font-size:33px;line-height:1.35;color:var(--gold);margin:6px 0 0;
  text-wrap:balance
}
/* 小的那一句。22px 是下限，不是「小字」——這裡沒有小字。 */
.okcard .ok-sub{
  display:block;font-size:22px;font-style:normal;line-height:1.4;
  color:var(--dim);margin:8px 0 0
}
.okcard .ok-ms{
  display:block;font-size:22px;color:var(--mute);margin:11px 0 0
}
/* 拿到的那一張。金色，因為它是這一刻唯一「你多了一個東西」的話。 */
.okcard .ok-cert{
  display:block;font-size:22px;line-height:1.4;color:var(--gold);margin:6px 0 0
}

/* ── 你要做哪幾件 ──
   一件一行：顏色、名字、幾天、拿掉。顏色跟廊道上那一格頭上的
   顏色是同一個（stepHue），所以走到第幾天在做哪一件不用讀。 */
.plist{display:flex;flex-direction:column;gap:5px;margin:0 0 11px}
.pl{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  background:var(--sunk);box-shadow:inset 0 2px 0 rgba(0,0,0,.5)
}
.pl b{flex:0 0 11px;height:22px;display:block}
.pl i{flex:1;font-style:normal;font-size:22px;color:var(--ink);
  overflow-wrap:anywhere;min-width:0}
.pl u{
  flex:0 0 44px;text-align:center;text-decoration:none;
  font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums
}
.pl .pd{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;
  font-size:22px;line-height:1;color:#1A1408;background:var(--gold);
  box-shadow:2px 2px 0 rgba(0,0,0,.6)
}
.pl .pd:hover{background:var(--gold2)}
.pl .pd:active{transform:translate(2px,2px);box-shadow:none}
/* 44px：跟旁邊加減天數那兩顆（.pd）同一個下限——這一顆刪掉一整件，
   代價比加減一天重，觸控目標不該比它們窄。 */
.pl .px-del{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;font-size:22px;
  color:var(--mute);background:none
}
.pl .px-del:hover{color:var(--over)}
/* 加一件那一列：一格輸入 ＋ 一顆鍵，並排。
   鍵借上面那幾件的 .pd——同一顆金色方塊，在這裡是加一件。 */
.pl-new{display:flex;align-items:center;gap:8px}
.pl-new input{flex:1;min-width:0;margin:0}
.pl-new .pd{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;
  font-size:22px;line-height:1;color:#1A1408;background:var(--gold);
  box-shadow:2px 2px 0 rgba(0,0,0,.6)
}
.pl-new .pd:hover{background:var(--gold2)}
.pl-new .pd:active{transform:translate(2px,2px);box-shadow:none}

/* 加起來的那個數字。不是鍵，所以沒有鍵的樣子。 */
.es-n.sum{margin:0 auto}

/* ── 挑一個角色 ──
   四個並排，剪影自己說話——四種長得不一樣，所以不用寫一句話解釋。
   走路那兩幀在這裡就輪流播：選的時候就看得到他會怎麼動。 */
/* 一欄，四列。

   那一句從標籤變成一句話之後，欄位就不能再切窄了：四欄一格只有
   159px，22px 的字一行放七個，一句話折成五行，最後一行剩一個字；
   兩欄也還要四行。一欄的話圖在左、話在右，一句話一到兩行讀得完。

   而且四個並排讀起來像在比較，一列一個讀起來像在認人——他挑的
   是「我是怎麼做事的人」，不是在四個規格之間挑一個。 */
.pick4{display:flex;flex-direction:column;gap:11px;margin:0 0 22px}
/* 一格變寬之後改成橫的：圖在左，名字與那一句在右。
   直的排法在寬格子裡會讓那一句被擠在中間一條窄柱裡。 */
.p4{
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:14px;border:0;cursor:pointer;font:inherit;color:inherit;
  background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--line);
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,
    100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)
}
.p4:hover{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--gold-d)}
.p4:active{transform:translateY(2px)}
.p4.on{box-shadow:inset 0 0 0 3px var(--gold)}
.p4-px{position:relative;display:block;flex:0 0 88px;width:88px;height:88px}
.p4-px .px{position:absolute;left:0;top:0;width:88px;height:88px;image-rendering:pixelated}
.p4-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.p4 b{font-size:22px;font-weight:400;color:var(--ink)}
.p4 i{font-style:normal;font-size:22px;color:var(--dim);line-height:1.5;overflow-wrap:anywhere}

/* 鎖著的那一扇。不是一顆按下去會跳「還不行」的鍵——它根本按不下去，
   而且看得出來按不下去。點得動卻沒有反應是最糟的那一種。 */
/* 手機上也維持四欄。

   一度改成 2×2，量出來整排從 114 變 268 高——那把「要做的那一件」
   又往下推了 148px。四欄在 375 寬每格 88px，圖示 44 加兩個字放得下，
   而且那一排就停在廊道正下方，滑一點點就到。 */
.dk.shut{
  cursor:default;opacity:.42;
  box-shadow:inset 0 0 0 2px var(--line)
}
.dk.shut:hover{background:none;filter:none}

/* 門上那一個通知。上次翻開圖鑑之後多遇到幾隻，就掛幾。

   不用小紅點：字級下限是 22px，而這一排門本來就是 22px 的字，
   所以一個數字接在名字後面剛好——而且數字比一個點多說一件事。 */
.dk .nb{
  font-style:normal;font-size:22px;line-height:1;
  color:#1A1408;background:var(--gold);
  padding:2px 8px;margin-left:2px;
  animation:nbin .22s steps(3,end) 1
}
@keyframes nbin{
  0%{transform:scale(1.8);opacity:0}
  100%{transform:scale(1);opacity:1}
}
@media (prefers-reduced-motion: reduce){ .dk .nb{animation:none} }

/* ---------- 登入那一頁旁邊走過去的那一位 ----------

   兩幀輪播是原地走，再加一段橫move才是「前進」——原地踏步的角色
   放在一道門旁邊看起來像卡住了。走到底就從左邊再進來，
   跟廊道那一條一樣：這個世界一直在往前，你還沒進來而已。 */
.gate-hd{position:relative;overflow:hidden}
.gate-walk{
  position:absolute;right:0;bottom:0;display:block;width:66px;height:66px;
  pointer-events:none;
  /* 330px 的位移分成 330 步：一步一個整數像素。 */
  animation:gatewalk 9s steps(330,end) infinite
}
.gate-walk .px{position:absolute;left:0;top:0;width:66px;height:66px}
.gate-walk .wa{animation:wkA .44s steps(1,end) infinite}
.gate-walk .wb{animation:wkB .44s steps(1,end) infinite}
@keyframes gatewalk{
  0%{transform:translateX(-264px)}
  100%{transform:translateX(66px)}
}
@media (prefers-reduced-motion: reduce){
  .gate-walk{animation:none;transform:translateX(0)}
  .gate-walk .wa{animation:none;opacity:1}
  .gate-walk .wb{animation:none;opacity:0}
}

/* ---------- 一整排任務之證 ----------

   一根一格，由左到右照封存的順序。它們要並排而且要一樣高——
   排在一起才看得出「沒有兩根一樣」，那是這一頁的全部內容。

   每一根底下寫那一件任務的名字，不寫數字：準不準在別的地方，
   這一頁是「這學期長成什麼樣子」。 */
.cores{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.core1{
  display:flex;flex-direction:column;align-items:center;gap:11px;
  width:165px;padding:14px 11px;
  background-color:var(--zbg,var(--panel2));
  box-shadow:inset 0 0 0 1px var(--line)
}
/* 那一根要比它的名字大。它才是內容，名字是說明。 */
.core1 .px.cx-px.core{width:110px;height:auto;max-height:132px}
.core1 b{
  font-size:22px;font-weight:400;line-height:1.3;color:var(--zink,var(--dim));
  text-align:center;overflow-wrap:anywhere
}

/* ---------- 審核清單的一列 ----------

   一列一件事，整列是一顆鈕。左邊大的是任務名（那是他要判斷的東西），
   底下小的是哪一組，右邊是等了幾天——排序照等最久，所以那個數字
   是他往下看的理由。

   本來一列有八塊、還配一顆另外的鍵：整列可以按之後那顆鍵就多餘了，
   而「按哪裡」也不用再想一次。 */
.rq{
  display:flex;align-items:center;gap:14px;width:100%;
  margin:0 0 11px;padding:14px 18px;border:0;cursor:pointer;
  text-align:left;font:inherit;color:inherit;
  background:var(--panel);
  box-shadow:inset 0 0 0 1px var(--line),3px 3px 0 rgba(0,0,0,.45);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),
    calc(100% - 11px) 100%,0 100%,0 11px)
}
.rq:hover{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--gold-d),3px 3px 0 rgba(0,0,0,.55)}
.rq:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1px var(--gold-d)}
.rq:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rq-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rq-t b{font-size:22px;font-weight:400;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.rq-t em{font-size:22px;font-style:normal;line-height:1.3;color:var(--mute)}
.rq-d{font-size:22px;color:var(--dim);white-space:nowrap;flex:0 0 auto}
.rq:hover .rq-t b{color:var(--gold)}

/* ---------- 故事那兩頁 ----------

   圖是用這個世界自己的材料拼的，不是另外畫的插圖：六層的底色與紋理
   讀 51-zones.css（跟廊道、跟班級地下城同一份），人與火把與生物
   都是遊戲裡真的會出現的那幾張。看完這兩頁再進廊道，
   廊道上每一樣東西他都見過了。 */
.sty-art{
  position:relative;height:308px;margin:0 0 22px;overflow:hidden;
  background:#06080B;
  box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px var(--frame);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),
    calc(100% - 11px) 100%,0 100%,0 11px)
}

/* ── 第一張：一張地圖 ──

   六個地方並排，中間有通道連著，你在其中一個。旁邊一扇關著的門。

   本來這裡是一面往下疊的崖。設定改了：地方是每一趟自己挑的，
   往下疊的圖跟那段話互相矛盾。 */
.sty-map{display:flex;align-items:stretch;gap:0;height:auto}
.sty-rooms{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);gap:11px;padding:14px
}
/* 一個地方＝一張畫，不是一塊色。長寬鎖成 2:1，跟那張圖一樣——
   放大只有整體縮放，不會被拉扁。 */
.sty-room{
  position:relative;display:flex;flex-direction:column;
  background-color:var(--zbg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.7), inset 0 0 0 4px var(--zln,#27303B)
}
/* 圖鎖成 2:1，跟那張點陣圖一樣——放大只有整體縮放，不會被拉扁。 */
.sty-pic{position:relative;display:block;aspect-ratio:2/1;overflow:hidden}
.sty-room .pl{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated
}
/* 通道：一個地方通到右邊那一個。最右邊那一欄不畫。 */
.sty-room::after{
  content:'';position:absolute;right:-11px;top:50%;width:11px;height:6px;
  transform:translateY(-50%);background:rgba(255,240,214,.16)
}
.sty-room:nth-child(3n)::after{display:none}
/* 名字釘在底下的實心條上。壓在圖上會兩邊都看不清楚。 */
.sty-room em{
  display:block;padding:5px 8px;
  font-style:normal;line-height:1.2;font-size:22px;color:var(--zink)
}
.sty-room.here{box-shadow:inset 0 0 0 2px #000, inset 0 0 0 5px var(--zink)}
/* 他站在那個地方的地板上。地板在圖高度的 27% 處（見 18-places.js：
   22 排裡地面在第 16 排）。 */
.sty-me{
  position:absolute;right:11px;bottom:25%;display:block;width:44px;height:44px
}
.sty-me .wf{position:absolute;left:0;top:0;width:44px;height:44px}
.sty-me .wa{animation:wkA 1.6s steps(1,end) infinite}
.sty-me .wb{animation:wkB 1.6s steps(1,end) infinite}

/* 每一個地方站著的那一位。你在的那一間他站在你左邊，
   別的地方他自己站著——六個地方六個人在等。 */
.sty-wait{
  position:absolute;left:11px;bottom:25%;display:block;width:33px;height:33px
}
.sty-wait .px{width:33px;height:33px}

/* 關著的那一扇。不是第七個地方——是唯一的出去。 */
.sty-door{
  flex:0 0 88px;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  background:#080A0E;box-shadow:inset 3px 0 0 #000
}
.sty-door i{
  display:block;width:44px;height:66px;
  background:
    linear-gradient(180deg,transparent 0 30px,var(--frame) 30px 36px,transparent 36px),
    linear-gradient(90deg,#2A241C 0 100%);
  box-shadow:inset 0 0 0 3px #000
}
.sty-door b{font-size:22px;font-weight:400;color:var(--mute)}

/* ── 第二張：一條廊道的橫剖 ── */
.sty-road{background-color:var(--zbg);background-image:var(--ztex)}
.sty-floor{
  position:absolute;left:0;right:0;bottom:0;height:66px;z-index:0;
  background:linear-gradient(180deg,var(--zfl2,#3B2D11) 0 3px,var(--zfl,#241B0C) 3px 100%)
}
/* 一格＝一天。走過的那幾格亮著。 */
.sty-tile{
  position:absolute;bottom:66px;width:6.5%;height:6px;z-index:1;
  background:rgba(255,240,214,.07)
}
.sty-tile.on{background:var(--zink);opacity:.55}
/* 人站在「實際走到」那一條上——那一條就是他走到哪裡的意思。
   本來他站在最左邊（left:110），而那時候圖上只有一條線、他站哪裡
   都不影響。現在有兩條，他站的位置本身就是其中一個數字。 */
.sty-hero{position:absolute;left:78%;margin-left:-33px;bottom:66px;width:66px;height:66px;z-index:3}
.sty-hero .wf{position:absolute;left:0;top:0;width:66px;height:66px}
.sty-hero .wa{animation:wkA .44s steps(1,end) infinite}
.sty-hero .wb{animation:wkB .44s steps(1,end) infinite}
/* 你說的那一天：一條實線加一句話。廊道上那條虛線拿掉之後，
   它只在這裡出現一次——因為這一頁在解釋它。 */
.sty-day{position:absolute;left:47%;top:22px;bottom:66px;z-index:2}
.sty-day i{
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,
    var(--gold) 0 6px, transparent 6px 12px)
}
.sty-day b{
  position:absolute;left:11px;top:0;font-size:22px;font-weight:400;
  color:var(--gold);white-space:nowrap;line-height:1
}
.sty-mob{position:absolute;left:47%;margin-left:-33px;bottom:66px;width:66px;height:66px;z-index:3}
.sty-mob .px{width:66px;height:66px}
/* 你實際走到的那一條。實線，因為它是已經發生的事；
   虛線那一條是承諾，還沒發生。 */
.sty-real{position:absolute;left:78%;top:22px;bottom:66px;z-index:2}
.sty-real i{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
/* 這一行不掛在那條線旁邊——線在 78%，四個字掛出去就出畫面了。
   改成貼著圖的右緣往左寫。 */
/* 往左寫，而且錯開一行——兩行都貼在 top:0 的話，窄螢幕上
   「你說的」跟「實際走到」會疊在一起（量到 178–249 對 170–276）。 */
.sty-real b{
  position:absolute;right:auto;left:0;top:33px;
  font-size:22px;font-weight:400;
  color:var(--ink);white-space:nowrap;line-height:1;
  transform:translateX(-100%);padding-right:11px
}
/* 兩條之間那一段。系統唯一在量的東西，所以它要有一個形狀。 */
.sty-gap{position:absolute;left:47%;width:31%;bottom:22px;z-index:2}
.sty-gap i{
  display:block;height:11px;
  border:3px solid var(--gold);border-top:0
}
.sty-gap b{
  display:block;margin-top:5px;font-size:22px;font-weight:400;
  color:var(--gold);text-align:center;white-space:nowrap;line-height:1
}

/* 兩頁的字。一句一行，行與行之間留白——這兩頁是唯一一個
   刻意讓人讀完的地方。 */
.sty-t p{margin:0 0 14px;line-height:1.9}
.sty-t p:last-child{margin:0}

@media (prefers-reduced-motion: reduce){
  .sty-fire{animation:none}
  .sty-who .wa,.sty-hero .wa{animation:none;opacity:1}
  .sty-who .wb,.sty-hero .wb{animation:none;opacity:0}
}

/* 故事第二頁最後那一句。它是整套系統唯一的一條規則，所以它自己一行、
   大一階、上面一道線。層級靠字級分不靠顏色——金色已經是「可以按」。 */
.sty-key{
  font-size:33px;line-height:1.5;margin:22px 0 0;padding:22px 0 0;
  border-top:3px solid var(--frame);text-wrap:balance
}

/* ---------- 這一趟去哪裡 ----------

   六個地方，一格一個，用那個地方自己的底色與紋理——他挑的是一個
   地方，不是一個選項，所以那一格要長得像那個地方。

   右邊那幾隻是住在裡面的。他在選地方，也是在選這一趟要遇到誰。 */
.wsix{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin:0 0 22px}
/* 一張卡＝先看到那個地方，再看到它叫什麼。
   圖是整張卡的上半，字在底下——字不壓圖，圖不擠字。 */
.wz{
  display:block;padding:0;
  border:0;cursor:pointer;font:inherit;color:inherit;text-align:left;
  background-color:var(--zbg);
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--frame);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),
    calc(100% - 11px) 100%,0 100%,0 11px)
}
.wz-p{display:block;line-height:0;padding:6px 6px 0}
.wz-p .pl{width:100%;height:auto;display:block;image-rendering:pixelated}
.wz-b{display:block;padding:14px 18px 18px}
.wz:hover{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--zink)}
.wz:active{transform:translate(2px,2px)}
.wz:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wz-t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.wz-t b{font-size:22px;font-weight:400;color:var(--zink);line-height:1.3}
.wz-t em{font-size:22px;font-style:normal;color:var(--dim);line-height:1.5}
/* 住在這裡的那幾隻，自己一排。本來擠在名字旁邊，把說明壓成三行——
   而說明才是他在讀的東西。 */
.wz-f{display:flex;gap:8px;margin:11px 0 0;opacity:.85}
.wz-f .px{width:33px;height:33px}

/* ---------- 換場 ----------

   一道橫向的擦除，180ms，steps(9)——跟整套一樣不用平滑補間。
   本來換頁是瞬間換掉 innerHTML，那是網頁的手感。 */
/* 掃過去的是一道覆蓋層，不是把內容裁掉。

   本來是對 .wrap 動 clip-path——那會讓整頁在那 180ms 內是半空的，
   而且只要有什麼在那個窗口內再重畫一次，擦除就從頭來。
   內容不該為了轉場消失。

   一道實心的橫條從左掃到右，掃完就沒了。pointer-events:none，
   所以它不會擋到任何一次點擊。 */
.wrap.wipe{position:relative}
.wrap.wipe::before{
  content:'';position:fixed;left:0;top:0;right:0;bottom:0;z-index:80;
  pointer-events:none;background:var(--bg);
  animation:pgwipe .2s steps(10,end) 1 forwards
}
@keyframes pgwipe{
  from{clip-path:inset(0 0 0 0)}
  to{clip-path:inset(0 0 0 100%)}
}
@media (prefers-reduced-motion: reduce){ .wrap.wipe::before{display:none} }

/* ---------- 圖鑑收集榜上那一排地方 ----------

   一個地方一顆，去過的亮起來。那一排就是他們的路線，
   而它同時解釋了名次——去得散，收得多。 */
.dx-z{display:flex;gap:4px;flex:0 0 auto}
.dx-p{
  display:block;width:11px;height:22px;
  background:rgba(255,240,214,.09);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)
}
.dx-p.on{background:var(--zink)}

/* 動態上那一句。其餘幾則壓成一行（掃過去就知道誰動了），
   只有「老師收下」那一則寫成完整的一句——它是唯一一件完整發生過的事。

   .fd 是 grid 不是 flex（見上面），所以那一句要用 grid 的話講：
   它自己一列、跨滿所有欄。用 flex 那一套寫的話它會被塞進一個
   不會縮的欄位裡，把整頁撐寬。 */
.fd:has(.fd-say){grid-template-columns:22px auto 1fr}
/* em.fd-say 不是 .fd-say：.fd em{white-space:nowrap} 的權重跟一個
   class 一樣，同分的時候後面那一條贏——所以那一句其實沒有換行，
   整條 grid 的 min-content 被撐成一整句，頁面因此橫向溢出 19px，
   而畫面上看不出來（沒有任何一個元素的右緣超出視窗）。 */
.fd em.fd-say{
  grid-column:1 / -1;min-width:0;white-space:normal;line-height:1.7;
  overflow-wrap:anywhere;color:var(--dim)
}

/* 窄螢幕：三欄放不下四個字的地名，兩兩相撞。改成兩欄三列，
   通道跟著換成每兩個一組。門也收窄。 */
@media (max-width:600px){
  .sty-rooms{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
  .sty-room:nth-child(3n)::after{display:block}
  .sty-room:nth-child(2n)::after{display:none}
  .sty-door{flex:0 0 66px}
  .sty-door i{width:33px;height:55px}
}

/* 說過「我們做完了」的那一組，在出口那一頁上標一階。
   它是一個訊號不是一道關卡——老師本來就開得了任何一組。 */
.card.exitq.said{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--gold-d)}

/* ---------- 剛遇到的那一隻 ----------

   門上本來就有「多了 N 隻」，但翻開之後看不出是哪一隻——一頁十幾格，
   通知說多了一隻，然後要他自己找。這一道光補的是那半件事。

   它亮一下就停在亮著的狀態，不做無限閃。班級地下城那一格已經下過
   同一個判斷：一個會閃的框就是在說「按我」，而圖鑑這一格按不下去。
   所以光講的是「牠來了」，不是「按我」。

   閃法照整份的規矩：steps()、硬邊、零模糊。--d 由 64-codex.js 給，
   一隻錯開 180ms——同時全亮就數不出有幾隻。 */
.cxi.fresh{
  position:relative;opacity:1;background:rgba(0,0,0,.45);
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--zink,var(--frame));
  animation:cxlit 1.26s steps(1,end) var(--d,0ms) 1 both
}
/* 光本身。壓在那一隻身上，收在牠那一格裡（左上 11px 起、44 見方）。 */
.cxi.fresh::before{
  content:'';position:absolute;left:11px;top:11px;width:44px;height:44px;
  pointer-events:none;opacity:.30;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,243,216,.60) 0 11px,
    rgba(255,243,216,.30) 11px 22px,
    rgba(255,243,216,.11) 22px 33px,
    transparent 33px);
  animation:cxglow 1.26s steps(1,end) var(--d,0ms) 1 both
}
@keyframes cxlit{
  0%,13%{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px transparent}
  14%,32%{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px #FFF3D8}
  33%,55%{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--zink,var(--frame))}
  56%,73%{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px #FFF3D8}
  74%,100%{box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--zink,var(--frame))}
}
@keyframes cxglow{
  0%,13%{opacity:0;transform:scale(.5)}
  14%,32%{opacity:1;transform:scale(1.3)}
  33%,55%{opacity:.45;transform:scale(1)}
  56%,73%{opacity:.9;transform:scale(1.15)}
  74%,100%{opacity:.30;transform:scale(1)}
}

/* 那一層有剛遇到的。分頁上一顆點，靜的——它已經是一顆按鈕了，
   再讓它閃，閃的意思會蓋掉「這一層有新的」。 */
.cxt .nw{
  display:inline-block;width:11px;height:11px;margin-left:8px;
  background:var(--gold);vertical-align:middle
}

@media (prefers-reduced-motion: reduce){
  .cxi.fresh, .cxi.fresh::before{animation:none}
}

/* 剛拿到的那一張任務之證。跟剛遇到的那一隻共用同一組動畫——
   一頁上兩種東西用兩種亮法，那會變成兩件事。 */
.core1.fresh{
  position:relative;
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--zink,var(--frame));
  animation:cxlit 1.26s steps(1,end) var(--d,0ms) 1 both
}
/* 光壓在那一張上（那一格是直的：圖在上、名字在下）。 */
.core1.fresh::before{
  content:'';position:absolute;left:calc(50% - 66px);top:11px;
  width:132px;height:143px;pointer-events:none;opacity:.30;
  background:radial-gradient(circle at 50% 45%,
    rgba(255,243,216,.55) 0 33px,
    rgba(255,243,216,.28) 33px 55px,
    rgba(255,243,216,.10) 55px 77px,
    transparent 77px);
  animation:cxglow 1.26s steps(1,end) var(--d,0ms) 1 both
}
@media (prefers-reduced-motion: reduce){
  .core1.fresh, .core1.fresh::before{animation:none}
}

/* ---------- 收進圖鑑的那一下 ----------

   打贏了、或老師勾了，圖鑑就多一個。那件事本來只在圖鑑那一頁才看得到，
   而他不一定會去翻——一個要自己去找的獎勵，在拿到的那一刻等於沒有發生。

   兩個地方共用這一張：戰鬥打完（蓋在場上，.over）、
   老師勾完的首頁（排在卡片裡）。 */
/* overflow 要關。regslam 從 scale(2.4) 開始，而 transform 不佔版面——
   放大的那一幀會把整頁撐寬（量到 368px）。關掉之後那一幀被裁在
   卡自己的框裡，砸下來的感覺還在。 */
.reg{display:block;overflow:hidden}
.reg-in{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 22px;background:#0B0E13;
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--gold-d);
  animation:regslam .42s steps(3,end) 1 both
}
.reg-eye{
  font-style:normal;font-size:22px;letter-spacing:.12em;color:var(--gold);
  line-height:1.2
}
/* 寬度不綁祖先——這張圖換個地方畫也不能被撐開（check.js 守著）。 */
.px.reg-px{width:88px;height:88px;image-rendering:pixelated}
/* 那一張證是直的，比魔物高。 */
.px.reg-px.core{width:66px;height:auto;max-height:110px}
.reg-n{
  font-size:33px;font-weight:400;line-height:1.3;color:var(--ink);
  text-align:center;text-wrap:balance;overflow-wrap:anywhere
}
.reg-s{font-style:normal;font-size:22px;line-height:1.4;color:var(--dim)}

/* 戰鬥打完那一次蓋在場上。 */
.reg.over{
  position:absolute;inset:0;z-index:8;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,8,11,.86);pointer-events:none
}
.reg.over .reg-in{max-width:80%}

/* 砸下來，不淡入——跟出發那一下同一個手法（53-scene.css 的 goslam）。 */
@keyframes regslam{
  0%  {transform:scale(2.4);opacity:0}
  34% {transform:scale(1.12);opacity:1}
  100%{transform:scale(1);opacity:1}
}
@media (prefers-reduced-motion: reduce){ .reg-in{animation:none} }

/* ---------- 老師勾了：蓋住畫面的那一張 ----------

   本來是排在首頁裡的一張卡。它是一件剛剛發生的事，不是首頁的內容——
   那種東西該閃一下就走。

   蓋住整個畫面（連底下那一列導覽一起），所以那一刻只有這一件事；
   點「回廊道」就沒了。 */
.okwrap{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;
  /* 不用 justify-content:center。內容比畫面高的時候，置中會把上緣推到
     捲動範圍外面——量到卡片頂端在 -151px，而且捲不回去（360x640、
     老師寫了一段長評語）。改用 auto margin：塞得下就置中，塞不下
     就從頂端開始。 */
  justify-content:flex-start;
  gap:14px;padding:22px;overflow:auto;
  background:rgba(6,8,11,.94);cursor:pointer;
  animation:okin .3s steps(3,end) 1 both
}
.okwrap .okcard{
  margin:0;max-width:620px;width:100%;
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--gold-d)
}
.okwrap .btn{flex:0 0 auto}
/* 閃一下。跟出發、跟收進圖鑑那一下同一個手法：steps()、不淡入。 */
@keyframes okin{
  0%  {opacity:0}
  34% {opacity:1}
  100%{opacity:1}
}
@media (prefers-reduced-motion: reduce){ .okwrap{animation:none} }

.okwrap > :first-child{margin-top:auto}
.okwrap > :last-child{margin-bottom:auto}

/* 遇到了但還沒進館藏。比遇過的暗一階，但比沒遇過的亮——
   三階：沒遇過 .55 ／ 遇過還沒存檔 .78 ／ 存檔 1。 */
/* 圖鑑只有一階：遇過就是滿的。
   本來這裡有第二階（老師收下才算進館藏），拿掉了。 */
.cxi.met{opacity:1}

/* 一排裡挑一個：沒選的安靜，選中的亮起來。
   幾顆等重——沒有哪一個是「比較好的答案」。

   2026-09-05：本來只寫了 .on 那一半，而 .btn 的底本來就是滿金的。
   於是 .on 的 color:var(--gold) 是金字寫在金底上——選中的那一顆
   整個字消失（量到 rgb(233,179,65) 寫在 rgb(233,179,65) 上），
   沒選的那一顆反而看起來像是被選的那一個。整個顛倒。

   三個地方共用這一組：註冊選學生／老師／研究者、承諾時說把握、
   老師收下時給幾顆。 */
.sure-row{gap:8px;flex-wrap:wrap}
.btn.sure{
  flex:1 1 auto;min-width:150px;
  background:var(--sunk);color:var(--dim);
  box-shadow:inset 0 0 0 2px var(--line)
}
.btn.sure:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line2)}
.btn.sure.on{
  background:var(--gold);color:#1A1408;
  box-shadow:inset 0 0 0 3px #000, inset 0 0 0 6px var(--gold-d)
}
.btn.sure.on:hover{background:var(--gold2)}

/* 你說的把握，跟後來。一階一行，三欄：說了什麼、幾次、準了幾次。
   不畫成長條——那會變成一個比較的圖。它只是三行事實。 */
.sure-list{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.sure-r{
  display:grid;grid-template-columns:1fr auto auto;gap:0 14px;align-items:baseline;
  padding:9px 11px;background:var(--sunk)
}
.sure-r b{font-size:22px;font-weight:400;color:var(--ink)}
.sure-r span{font-size:22px;color:var(--mute);font-variant-numeric:tabular-nums}
.sure-r i{font-style:normal;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}

/* 他們說東西在這裡。老師打開審核頁的第一件事。 */
.wh-link,.wh-txt{
  display:block;font-size:22px;line-height:1.5;margin:6px 0 0;overflow-wrap:anywhere
}
.wh-link{color:var(--gold);text-decoration:none;border-bottom:2px solid var(--gold-d)}
.wh-link:hover{border-bottom-color:var(--gold)}
.wh-txt{color:var(--ink)}

/* 拿到幾顆。金色，因為它是「你多了一個東西」——
   但它排在任務之證上面，不是取代它。 */
.crygot{
  display:block;font-size:33px;line-height:1.3;color:var(--gold);
  margin:11px 0 0
}
.crygot span{
  display:block;font-size:22px;line-height:1.4;color:var(--dim);margin-top:5px
}
/* 水晶榜。那一排錢幣就是他們完成的件數——加成只佔 5%，
   所以這一張榜幾乎完全由「做完幾件」決定。 */
.ck-c{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}

/* 委託人。收到委託的那一頁上，他站在最上面——
   這一頁最該發生的事是「這次的委託人竟然長這樣」。 */
.card.patron{
  display:flex;align-items:flex-start;gap:18px;
  background-color:var(--zbg)
}
.px.pat-px{width:110px;height:110px;flex:0 0 110px;image-rendering:pixelated}
.pat-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.pat-t b{font-size:33px;font-weight:400;line-height:1.25;color:var(--zink,var(--ink))}
.pat-t em{font-size:22px;font-style:normal;line-height:1.6;color:var(--dim)}
.pat-t u{
  text-decoration:none;font-size:22px;color:var(--gold);margin-top:5px
}
@media (max-width:520px){
  .card.patron{flex-direction:column;align-items:center;text-align:center}
  .pat-t{align-items:center}
}

/* 誰做這一件。點一下換人。 */
/* 這一顆是「點一下換人」，而換到最後一格就是「全體」——
   分工那一步唯一的入口。量出來 34px，是這一整頁最矮的一顆。
   跟旁邊加減天數那兩顆（.pd，44px）站在同一列上，齊高也比較好看。 */
.pl .pw{
  font:inherit;font-size:22px;line-height:1.2;padding:4px 9px;border:none;
  min-height:44px;box-sizing:border-box;
  cursor:pointer;color:var(--gold);background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--gold-d);white-space:nowrap
}
.pl .pw:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.pl .pw:active{transform:translateY(1px)}

/* 這一件用的單位（小時／天／週）。跟 .pw 同一種矮鍵，但只需要放得下
   兩個字，不用它那麼寬——這一列已經很擠了（見 60-student.js 的
   plandu）。別人那一件看得到單位、換不動，用 .pu-fix 印純文字。 */
.pl .pu{
  font:inherit;font-size:22px;line-height:1.2;padding:4px 6px;border:none;
  min-height:44px;box-sizing:border-box;flex:0 0 auto;
  cursor:pointer;color:var(--dim);background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--line);white-space:nowrap
}
.pl .pu:hover{box-shadow:inset 0 0 0 2px var(--gold-d)}
.pl .pu:active{transform:translateY(1px)}
.pl .pu-fix{flex:0 0 auto;font-size:22px;color:var(--mute);padding:4px 6px}

/* 寬度不綁祖先——這張圖換個地方畫也不能被撐開（check.js 守著）。 */
.px.sd-px{width:33px;height:33px;flex:0 0 33px;image-rendering:pixelated}

/* 誰做了什麼：一個人一行，全隊並排。
   只有你那一行是輸入框——你看得到全隊在同一張紙上，
   但你只寫得了自己那一行。 */
.saidlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 0}
.sd{display:flex;align-items:center;gap:11px;padding:6px 9px;background:var(--sunk)}
.sd b{font-size:22px;font-weight:400;color:var(--mute);flex:0 0 auto;min-width:66px}
.sd.mine b{color:var(--ink)}
.sd span{font-size:22px;color:var(--dim);min-width:0;overflow-wrap:anywhere}
.sd .bt-w{flex:1;min-width:0}

/* 別人負責的那幾件：看得到，按不動。 */
.sp2.theirs{opacity:.72}
.sp2 .who{
  font-size:22px;color:var(--gold-d);white-space:nowrap;text-decoration:none
}

/* 你們這一組。放在三扇門上面——它不是「你現在要做的事」，
   是「你在誰旁邊」。 */
/* 你們這一組。排在最上面，所以它必須矮——上一版五段疊成 281px，
   把廊道推到畫面外。現在三行：名字那一行、人那一行（代碼接在同一列
   後面），padding 也收一階。 */
.card.tmc{margin:0 0 11px;padding:14px 16px}
/* 會換行。不換的話窄螢幕上隊名會被代碼跟水晶（兩個都 flex:none）
   擠成寬度 0——量到 0×396，一個字一行，整張卡 526px 高。 */
.tmc-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:5px 14px}
.tmc-cry{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
/* 擠不下就自己佔一行，不要被壓扁。132px 是四個字的寬度——
   比這個窄就換行。 */
.tmc-n{font-size:22px;font-weight:400;line-height:33px;color:var(--ink);flex:1 1 132px}
/* 專案接在隊名後面，同一行。中點是分隔，不是標點。 */
.tmc-n i{font-style:normal;color:var(--dim)}
.tmc-n i::before{content:"　·　";color:var(--line2)}
/* 代碼跟水晶同一行。本來排在人那一列後面，而 margin-left:auto
   會把整列撐開換行——四個人加一個代碼在 560px 裡排不下，
   於是那一列變成兩行、卡高 161px。 */
.tmc-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:9px 0 0}
.tmc-m{
  display:flex;align-items:center;gap:6px;padding:2px 9px 2px 2px;
  background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--line2)
}
.tmc-m.me{box-shadow:inset 0 0 0 2px var(--gold-d)}
.tmc-m span{font-size:22px;color:var(--dim);white-space:nowrap}
.tmc-m.me span{color:var(--ink)}
/* 寬度不綁祖先——換個地方畫也不能被撐開（check.js 守著）。 */
.px.tmc-px{width:22px;height:22px;flex:0 0 22px;image-rendering:pixelated}
.tmc-c{font-size:22px;color:var(--mute);white-space:nowrap;margin-left:auto;flex:none}
.tmc-c b{color:var(--gold);font-weight:400;letter-spacing:.1em}

/* 登入頁上的試用資料。照組排，點名字直接進去那個人。
   只在示範資料還在的時候畫得出來。 */
.card.demo{margin-top:22px}
.dm-t{margin-top:14px}
.dm-t>b{display:block;font-size:22px;font-weight:400;color:var(--mute);margin-bottom:5px}
.dm-r{display:flex;flex-wrap:wrap;gap:5px}
.btn.dm{
  padding:5px 11px;font-size:22px;background:var(--sunk);color:var(--ink);
  box-shadow:inset 0 0 0 2px var(--line2)
}
.btn.dm:hover{box-shadow:inset 0 0 0 2px var(--gold)}

/* ── 委託人會呼吸 ──

   兩張幀疊起來輪流亮，跟角色同一組 keyframes（wkA／wkB）。
   差別在快慢：角色 .44s 是腳步，委託人 --pt 是 1.5～2.3 秒的呼吸，
   而且每一位由名字決定——一整層的人不會同時起伏。

   .pat 這一層要跟裡面那張圖一樣大，不然它會塌成一行文字的高度，
   而兩張絕對定位的幀就沒有東西可以定位。 */
/* flex:none 是必要的：本來 flex 容器裡的項目是那張 img，而它身上寫著
   flex:0 0 110px；現在項目變成這一層 span，沒有那一條就會被擠扁。 */
.pat{position:relative;display:inline-block;line-height:0;flex:none}
.pat .wf{position:absolute;left:0;top:0}
.pat .wf.wa{position:relative}
.pat .wa{animation:wkA var(--pt,1900ms) steps(1,end) infinite}
.pat .wb{animation:wkB var(--pt,1900ms) steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){
  .pat .wa{animation:none;opacity:1}
  .pat .wb{animation:none;opacity:0}
}

/* ── 一位委託人，放大 ──

   廊道上 66px、圖鑑格子裡 44px，都只讀得出剪影。這一頁把他放到
   一個看得清楚的尺寸——「這次的委託人竟然長這樣啊」需要一個
   看得清楚的地方。

   寬度用 vw 收在 396 以內：手機上它就是整個寬，桌機上不會大到失焦。 */
.pz{ display:flex; flex-direction:column; align-items:center; text-align:center }
.pz-art{
  width:100%; max-width:396px; aspect-ratio:3 / 2;
  display:flex; align-items:flex-end; justify-content:center;
  background:var(--sunk); box-shadow:inset 0 0 0 2px var(--line2);
  margin:0 0 22px; padding:22px 0 0
}
.px.pz-px{ width:min(88vw,352px); height:auto; image-rendering:pixelated }
.pz-t{ width:100%; max-width:528px }
.pz-t .lead{ color:var(--dim) }
.pz .card{ width:100%; max-width:528px; text-align:left }
.pz-r{ display:flex; justify-content:space-between; gap:14px; padding:5px 0 }
.pz-r b{ font-weight:400; color:var(--ink) }
.pz-r em{ font-style:normal; color:var(--mute); white-space:nowrap }
.pz .dim{ margin:14px 0 }

/* 點得下去的那幾個地方。滑過去亮一階——不是裝飾，是在說「這個點得動」。 */
.cxi.can,.card.patron.can,.scn-mob.can{ cursor:pointer }
.cxi.can:hover{ box-shadow:inset 0 0 0 2px var(--gold) }
.card.patron.can:hover{ box-shadow:inset 0 0 0 2px var(--gold) }

/* 故事第二頁那一條。跟門口同一個元件，只是上下留白不一樣：
   在門口它是招牌的一部分，在這裡它是標題的答案，所以貼著標題。 */
.sty-loop{margin:0 0 22px}

/* ══════════ 委託人登場 ══════════

   收到委託那一下他走進來。本來他只是「已經在卡片上」——
   而「這次的委託人竟然長這樣啊」是一個瞬間，瞬間要有東西發生。

   從右邊進來，跟走到底那一下同一個方向（見 53-scene.css 的 mobmeet）。
   這個世界裡委託人一律從右邊出現：路的另一端在右邊，他就從那裡來。

   四拍，一拍接一拍：

     人   0.48s   從右邊走進來
     名字 0.42s 後  砸下來
     那句話 0.62s 後 亮起來
     水晶 0.82s 後  彈一下

   全部 steps()，沒有漸變。backwards 是必要的：沒有它，delay 還沒到
   的那幾樣會先用最終狀態畫出來，等於先劇透再演。 */
.card.patron.enter .pat{
  animation:patin .48s steps(4,end) 1 backwards
}
@keyframes patin{
  0%{opacity:0;transform:translateX(22px)}
  100%{opacity:1;transform:translateX(0)}
}
.card.patron.enter .pat-t b{
  animation:patname .3s steps(2,end) .42s 1 backwards
}
@keyframes patname{
  0%{opacity:0;transform:translateY(-6px)}
  100%{opacity:1;transform:translateY(0)}
}
.card.patron.enter .pat-t em{
  animation:patline .3s steps(2,end) .62s 1 backwards
}
@keyframes patline{ 0%{opacity:0} 100%{opacity:1} }
.card.patron.enter .pat-t u{
  animation:patcrystal .36s steps(3,end) .82s 1 backwards
}
@keyframes patcrystal{
  0%{opacity:0;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-5px)}
  100%{opacity:1;transform:translateY(0)}
}

/* 首頁上那一句。有人在等，但還沒看到是誰。 */
.waiting{font-size:22px;color:var(--gold-d);margin:0 0 11px}

@media (prefers-reduced-motion: reduce){
  .card.patron.enter .pat,
  .card.patron.enter .pat-t b,
  .card.patron.enter .pat-t em,
  .card.patron.enter .pat-t u{animation:none}
}

/* ══════════ 接下委託那一場 ══════════

   一趟有兩次見到他。第二次（走到底交東西）早就是一場戲；第一次本來
