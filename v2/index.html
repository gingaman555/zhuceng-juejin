.duel-t{margin:11px 0 0;color:var(--dim);font-size:22px;line-height:22px}

/* 打完了。牠退開，自己往前站一格。演一次，不循環。 */
.duel.done .duel-me{animation:dstep .5s steps(3,end) 1 forwards}
.duel.done .duel-mob{animation:dgone .6s steps(3,end) .2s 1 forwards}
.duel.done .duel-gap{opacity:0}
@keyframes dstep{to{transform:translateX(22px)}}
@keyframes dgone{to{transform:translateX(44px);opacity:.15}}

@media (prefers-reduced-motion: reduce){
  .duel-me,.duel-mob,.duel-gap span{animation:none}
  .duel.done .duel-mob{opacity:.15}
}

/* ── 你不在的這幾天 ──
   死線勇者回來看戰利品的那一下，換成誠實的版本：只報真的發生過的事。
   數字大、名字小，一眼掃完就過去，不佔位置。 */
.away{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;
  padding:11px 14px;margin-bottom:11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.away b{font-size:22px;line-height:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.away span{font-size:22px;color:var(--dim);margin-left:-16px}
.away em{font-size:22px;font-style:normal;color:var(--over)}

/* ── 面板 ──
   參考死線勇者：它整個畫面是一組有框的面板，不是一頁網頁。框、鉚釘、
   標題掛在框上，那三件事就足以讓一張卡片讀起來像遊戲介面。

   守住原本的規則：硬邊、零模糊、光從左上來、圓角一律 11px 的切角。 */
.card{position:relative}
.card::after{
  content:'';position:absolute;inset:6px;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%),
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%);
  background-size:3px 3px;background-repeat:no-repeat;
  background-position:0 0,100% 0,0 100%,100% 100%
}
.card > *{position:relative;z-index:1}

/* 標題掛在框上，像面板的名牌。 */
.card > .eyebrow:first-child{
  display:inline-block;margin:-4px 0 11px -6px;padding:3px 11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.10);
  clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)
}

/* ── 戰報 ──
   死線勇者的結果是一份回頭讀的報告。這裡也一樣：判定不是一張貼紙，
   是那一趟的幾行數字。數字對齊，因為它們是要被互相比較的。 */
.rep{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 22px}
.rep dt{
  font-size:22px;color:var(--dim);line-height:33px;
  border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd{
  margin:0;font-size:22px;line-height:33px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums;border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd.s{font-size:22px;text-align:left;color:var(--dim)}
.rep dt:last-of-type,.rep dd:last-of-type{border-bottom:0}

/* ── 地圖的環境 ──
   PaGamO 的地圖讀起來像一塊大陸，靠的不是格子畫得漂亮，是地表上有東西、
   地裡有東西、而且領土是一塊有輪廓的形狀。這三件事這裡都補上了。 */

/* 天。硬停的漸層，沒有模糊——一有模糊它就不是像素了。 */
.dig-sky{
  position:absolute;top:0;z-index:0;
  background:linear-gradient(180deg,#0B1020 0 40%,#141B31 40% 72%,#1E2440 72% 100%)
}
/* 上面那片林子。根脈層那一句說的根，就是從這裡穿下來的。 */
.dig-tree{
  position:absolute;width:9px;z-index:1;background:#1C2A18;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}
/* 泥土。岩層從這一條下面開始。 */
.dig-soil{
  position:absolute;height:8px;z-index:2;
  background:linear-gradient(180deg,#3E4A2C 0 3px,#2A2418 3px 8px)
}
/* 每一組下來的那個井口。自己那一個亮一點。 */
.dig-shaft{
  position:absolute;width:40px;height:11px;z-index:3;
  background:linear-gradient(180deg,rgba(255,240,214,.20) 0 3px,rgba(255,240,214,.07) 3px 11px)
}
.dig-shaft.mine{
  background:linear-gradient(180deg,rgba(233,179,65,.55) 0 3px,rgba(233,179,65,.16) 3px 11px)
}

/* 岩層交界。每一欄高度不同，所以它犬牙交錯——
   一條直線會讓整張圖讀起來像表格。 */
.dig-seam{position:absolute;width:40px;z-index:1;background:var(--zln);opacity:.85}

/* 岩層裡的東西。位置用座標算，所以石頭永遠在同一個地方。 */
.dg-c.rock{overflow:hidden}
.mp{position:absolute;width:18px;height:auto;opacity:.5;image-rendering:pixelated}

/* 同一層裡每一格的深淺差一點點，不然整片會像一塊布。 */
.dg-c.rock.v1{filter:brightness(1.08)}
.dg-c.rock.v2{filter:brightness(.92)}

/* 打通了的地：輪廓在 JS 那邊算（只描對外的邊），所以這裡不要再蓋一次。 */
.dg-c.dug{box-shadow:none}
.dg-c.dug.mine{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}

/* 走路：兩幀疊著，輪流出現。steps(1) 是硬切——
   淡入淡出會讓像素看起來像有殘影。 */
.scn-hero.walking{position:absolute}
/* 兩幀輪流播的那一張。不限定祖先的寬度——換個地方畫（挑角色那一頁）
   就會被原圖的像素尺寸撐開，那是 check.js 第七條在擋的事。 */
.wf{width:66px;height:66px;image-rendering:pixelated}
.scn-hero .wf{position:absolute;left:0;top:0}
.scn-hero .wa{animation:wkA .44s steps(1,end) infinite}
.scn-hero .wb{animation:wkB .44s steps(1,end) infinite}
@keyframes wkA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes wkB{0%,49%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .scn-hero .wa{animation:none;opacity:1}
  .scn-hero .wb{animation:none;opacity:0}
}

/* 地圖上的角色：站在自己最前緣那一格。 */
.dig-hero{position:absolute;z-index:6;width:44px;height:44px;pointer-events:none}
.dig-hero .ch{width:44px;height:44px;image-rendering:pixelated;
  filter:drop-shadow(2px 0 0 rgba(0,0,0,.55)) drop-shadow(-2px 0 0 rgba(0,0,0,.55))
         drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.dig-hero .wf{position:absolute;left:0;top:0}
.dig-hero .wa{animation:wkA .44s steps(1,end) infinite}
.dig-hero .wb{animation:wkB .44s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){
  .dig-hero .wa{animation:none;opacity:1}
  .dig-hero .wb{animation:none;opacity:0}
}

/* ── 蓋在地上的東西 ──
   地是組別的顏色，建築一律深色剪影加高光——所以每一組的建築讀起來
   一樣重，差別只在形狀。用顏色分強弱的話，那張圖就會被讀成排名。 */
.dg-c.dug{position:relative;display:block}
.bld{position:absolute;left:4px;bottom:2px;width:32px;height:32px;
  image-rendering:pixelated;pointer-events:none}

/* 兩組的地貼在一起長出來的路。 */
.dig-link{position:absolute;z-index:5;background:var(--gold);opacity:.8}
.dig-link.v{width:6px;height:18px}
.dig-link.h{width:18px;height:6px}

/* 三選一。三個一樣大、一樣亮——沒有一個看起來比較厲害。 */
.bp-row{display:flex;gap:11px;flex-wrap:wrap}
.bp{
  flex:1 1 88px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px;cursor:pointer;border:none;color:var(--ink);font:inherit;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bp:hover{box-shadow:inset 0 0 0 2px var(--gold), inset 2px 2px 0 rgba(255,255,255,.12)}
.bp-px{width:66px;height:50px;image-rendering:pixelated}
.bp b{font-size:22px;font-weight:400}

/* 點一座建築：那是哪一趟。建築不是獎品，是那一趟的紀念碑。 */
.bstory .bs-in{display:flex;gap:14px;align-items:flex-start}
.bs-px{width:66px;height:66px;image-rendering:pixelated;flex:0 0 auto}
.bstory h2{margin:6px 0 11px;font-size:22px;font-weight:400}

/* 廊道要滑得動、滑得順，而且不要搶走整頁的上下捲動。
   兩邊留一道暗邊，讓人看得出來它還有得滑。 */
.scn-scroll{
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;
  scrollbar-width:thin
}
.dig-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scn::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    linear-gradient(90deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%),
    linear-gradient(270deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%)
}

/* ── 這一圈走到哪 ──
   四拍，走完接回第一拍。這座地下城是無盡輪迴的，所以它是環不是條——
   沒有百分比、沒有終點。 */
.cyc{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
  padding:11px 14px;margin:0 0 11px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06);
  scrollbar-width:none
}
.cyc::-webkit-scrollbar{display:none}
.cy{display:flex;flex-direction:column;gap:1px;padding:3px 9px;white-space:nowrap;
  opacity:.42}
.cy b{font-size:22px;font-weight:400;color:var(--mute)}
.cy i{font-size:22px;font-style:normal;color:var(--dim)}
.cy.on{
  opacity:1;background:rgba(233,179,65,.12);
  box-shadow:inset 0 0 0 2px var(--gold-d)
}
.cy.on b{color:var(--gold)}
.cy.on i{color:var(--ink)}
/* 拍與拍之間的那一小段。最後一段接回第一拍，所以畫成虛的。 */
.cyd{flex:0 0 11px;height:3px;background:var(--line)}
.cyd.loop{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}

/* ── 承諾那一根尺 ──
   「你前幾趟」跟「你要說幾天」量的是同一個單位，所以畫在同一根尺上。
   本來還有第三條「別組怎麼看」——拿掉了，那條帶子會在按下承諾之前
   錨定他的預估，而預估正是這個系統唯一在量的東西。 */
.axis{position:relative;margin:14px 0 0;padding:0 3px}
.ax-row{position:relative;height:14px;margin-bottom:3px}
.ax-ok,.ax-link{position:absolute;top:5px;height:4px}


/* 你前幾趟：空心＝說的，實心＝實際的。線往右就是低估。 */
.ax-link{background:rgba(255,240,214,.16)}
.ax-said,.ax-was{position:absolute;top:2px;width:10px;height:10px;
  margin-left:-5px;border-radius:0}
.ax-said{background:transparent;box-shadow:inset 0 0 0 2px var(--mute)}
.ax-was{background:var(--mute)}
.ax-was.over{background:var(--over)}

/* 你現在拉到的地方，跟準的範圍。 */
.ax-now{height:18px}
.ax-ok{top:6px;height:6px;background:rgba(233,179,65,.28)}
.ax-me{position:absolute;top:0;width:4px;height:18px;margin-left:-2px;
  background:var(--gold)}

/* 尺。只標三個數字，多了就變成一張表。 */
.ax-ruler{position:relative;height:16px;margin-top:3px;
  border-top:2px solid var(--line)}
.ax-ruler i{position:absolute;top:3px;font-size:22px;font-style:normal;
  color:var(--dim);transform:translateX(-50%)}
.ax-ruler i:first-child{transform:none}
.ax-ruler i:last-child{transform:translateX(-100%)}

/* ── 說幾天：兩顆鍵 ──

   一按一天。數字在正中間，是這一頁最大的一個字——這一頁只有
   這一件事。兩顆鍵各佔一邊，77px 見方，手指不用瞄。

   到頭的那一顆暗下去。不擋（按下去也只是停在原地），
   擋住會讓人以為是壞了。 */
.estep{display:flex;align-items:center;justify-content:space-between;
  gap:11px;margin:0 0 11px}
.es-b{
  flex:0 0 77px;height:77px;border:none;cursor:pointer;
  font:inherit;font-size:44px;line-height:1;color:#1A1408;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,
    100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px);
  background-image:linear-gradient(180deg,
    var(--gold2) 0 3px, var(--gold) 3px calc(100% - 3px),
    var(--gold-d) calc(100% - 3px) 100%);
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75))
}
.es-b:hover{background-image:linear-gradient(180deg,
  #FFE29A 0 3px, var(--gold2) 3px calc(100% - 3px),
  var(--gold) calc(100% - 3px) 100%)}
.es-b:active{transform:translate(2px,2px);
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.75))}
/* 到頭了。看得出來，但按得下去。 */
.es-b.off{background-image:none;background:var(--panel2);color:var(--dim);
  filter:none;box-shadow:inset 0 0 0 2px var(--line)}
.es-n{display:flex;align-items:baseline;gap:6px}
.es-n b{font-size:88px;line-height:1;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}
.es-n span{font-size:33px;color:var(--dim)}
.ax-in{position:relative;margin:0 11px}

/* 岩層表面看得出哪幾格裡有東西——但看不出是什麼。
   看得出來，「往哪裡打通」才是一個真的選擇；
   看不出是什麼，那一格才值得去。 */
.dg-c.rock.has::before{
  content:'';position:absolute;right:6px;top:6px;width:3px;height:14px;
  background:linear-gradient(180deg,
    rgba(255,240,214,.42) 0 5px, transparent 5px 7px,
    rgba(255,240,214,.42) 7px 14px);
  box-shadow:2px 0 0 rgba(0,0,0,.5)
}
.dg-c.rock.can.has::before{background:var(--gold2);box-shadow:2px 0 0 rgba(0,0,0,.5)}

/* 掀開那一格。準的時候牠還在，失準的時候只剩痕跡——
   兩邊都是一則紀錄，沒有人被扣任何東西。 */
.unc .unc-in{display:flex;gap:14px;align-items:flex-start}
.unc-px{width:88px;height:66px;flex:0 0 auto;image-rendering:pixelated}
.unc-px.gone{opacity:.34;filter:grayscale(1)}
.unc-px.blank{background-color:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.unc h2{margin:6px 0;font-size:22px;font-weight:400}
.unc .quote{margin:11px 0 0;padding-left:11px;
  box-shadow:inset 3px 0 0 var(--gold-d);color:var(--ink)}

/* 老師勾了：這是整條流程裡唯一「別人為你做了一件事」的時刻，
   本來長得跟其他狀態一模一樣。給它一個到達的樣子。 */
.eyebrow.lit{color:var(--gold);
  animation:arrive 1.6s steps(1,end) 2}
@keyframes arrive{0%,49%{color:var(--gold)}50%,100%{color:var(--gold2)}}
.quote.big{font-size:22px;line-height:33px;color:var(--ink);
  padding:11px 0 11px 14px;box-shadow:inset 3px 0 0 var(--gold)}
.away em.ok{font-size:22px;font-style:normal;color:var(--gold)}

/* 「上」那一下的撞擊。整條流程最有份量的一按，本來按下去直接換頁。
   一次，不循環——它報的是結果不是過程。 */
.duel.done{animation:duelhit .22s steps(2,end) 1}
@keyframes duelhit{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}
.duel.done::before{
  content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:rgba(255,243,216,.8);
  animation:duelflash .22s steps(1,end) 1 forwards
}
@keyframes duelflash{0%{opacity:.9}30%{opacity:.35}100%{opacity:0}}

/* 戰報一行一行落下來。死線勇者的戰報是回來要讀的東西，
   一次全部出現就只是三個數字。 */
.rep dt,.rep dd{animation:repin .28s steps(3,end) both}
.rep dt:nth-of-type(1),.rep dd:nth-of-type(1){animation-delay:.20s}
.rep dt:nth-of-type(2),.rep dd:nth-of-type(2){animation-delay:.42s}
.rep dt:nth-of-type(3),.rep dd:nth-of-type(3){animation-delay:.64s}
.rep dt:nth-of-type(4),.rep dd:nth-of-type(4){animation-delay:.90s}
/* 只搬位置，不動 opacity——動畫的時鐘被凍住的時候（背景分頁、省電、
   自動化瀏覽器），用 opacity 當起始值會讓整行永遠看不見。
   動畫只能加東西，不能當成顯示的閘門。 */
@keyframes repin{from{transform:translateY(-8px)}to{transform:none}}

@media (prefers-reduced-motion: reduce){
  .duel.done{animation:none}
  .duel.done::before{display:none}
  .rep dt,.rep dd{animation:none}
  .eyebrow.lit{animation:none}
}

/* 坐著：兩幀，差在呼吸。停下來不是停止。 */
.scn-hero.resting .wa{animation:wkA 1.6s steps(1,end) infinite}
.scn-hero.resting .wb{animation:wkB 1.6s steps(1,end) infinite}

/* 營火三幀，跟火把同一套做法。
   火本來就絕對定位在洞口裡，所以這裡只擺三幀，不要再蓋一次 position——
   蓋掉它就會掉回文件流，畫成兩堆火。 */
.mouth .mfire .ff{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;
  animation:flk 420ms steps(1,end) infinite}
.mouth .mfire .f1{animation-delay:140ms}
.mouth .mfire .f2{animation-delay:280ms}
/* 點著的火在旁邊打出一圈光。沒有模糊——一有模糊就變成現代特效。 */
.mouth .mfire.lit::after{
  content:'';position:absolute;left:-44px;top:-33px;width:132px;height:110px;
  pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 60%,
    rgba(233,132,63,.13) 0 33px, rgba(233,132,63,.06) 33px 55px, transparent 55px)
}
@media (prefers-reduced-motion: reduce){
  .mouth .mfire .ff{animation:none;opacity:0}
  .mouth .mfire .f0{opacity:1}
  .scn-hero.resting .wa{animation:none;opacity:1}
  .scn-hero.resting .wb{animation:none;opacity:0}
}


/* ── 營火旁 ──
   火在左邊，人面對火。要讓「他在那裡休息」不用一句話解釋，
   靠三件事：坐姿的輪廓、火光打在他左側、火星一直在飄。 */

/* 火光打在人身上。硬邊的一道緣光，不是光暈——
   一有模糊就會看起來像貼在像素圖上的現代特效。 */
.scn-hero.resting .ch{
  filter:drop-shadow(-2px 0 0 rgba(233,132,63,.75))
         drop-shadow(-3px 0 0 rgba(233,132,63,.30))
}

/* 火星。這個畫面上唯一一直在動的小東西——
   沒有它，「坐在火旁邊」看起來會像一張靜止的圖。 */
.mouth .ember{
  position:absolute;bottom:78px;width:2px;height:2px;
  background:#FFD9A0;z-index:3;pointer-events:none;
  animation:emb var(--ed,1800ms) steps(7,end) infinite
}
@keyframes emb{
  0%{transform:translate(0,0);opacity:0}
  10%{opacity:.95}
  60%{opacity:.7}
  100%{transform:translate(6px,-44px);opacity:0}
}

/* 人坐著的地方地上暖一塊。硬停，沒有漸層模糊。 */
.mouth::after{
  content:'';position:absolute;left:0;bottom:40px;width:132px;height:14px;
  pointer-events:none;z-index:0;
  background:linear-gradient(90deg,
    rgba(233,132,63,.16) 0 44px,
    rgba(233,132,63,.09) 44px 88px,
    transparent 88px)
}

@media (prefers-reduced-motion: reduce){
  .mouth .ember{animation:none;opacity:.6}
}

/* 剖面圖上，那一趟蓋的東西站在那一層裡。
   深度是走出來的，蓋什麼是挑的——這是圖上唯一屬於「他們自己選的」東西。 */

/* ── 你說的那一天 ──
   原始設計裡就有的一條虛線，一直沒做。它讓「我承諾了幾天」在畫面上
   有一個實體：線在前面，水從後面追上來。
   它不是終點線——每一組的線在不同的地方，因為那是各自說的。 */
/* .vow 拿掉了：那條虛線是把「你說幾天」拉成一條線壓在走廊上。 */

/* ── 任務清單 ──
   老師派過的每一件事，各自走到哪。數字靠右對齊，因為「你說幾天」跟
   「實際幾天」是要被互相比較的——這一頁順便就是他們自己的估算史。 */
.tk-list{display:flex;flex-direction:column}
.tk{padding:14px 0;border-bottom:2px solid rgba(0,0,0,.16)}
.tk:last-child{border-bottom:0}
.tk-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tk-h b{font-size:22px;font-weight:400;line-height:33px;color:var(--ink)}
.tk-s{
  flex:0 0 auto;font-size:22px;font-style:normal;padding:2px 8px;
  color:var(--mute);background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)
}
.tk-s.go{color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-d)}
.tk-s.ok{color:#7FA866;box-shadow:inset 0 0 0 2px rgba(127,168,102,.5)}

.tk-n{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.tk-n span{font-size:22px;color:var(--dim)}
.tk-n b{font-size:22px;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-right:11px}
.tk-n b.late{color:var(--late)}
.tk-n .tk-u{margin-left:-8px}

/* 岩心掛在它自己那一趟旁邊——它終於有出處了。 */
.tk-k{display:flex;align-items:center;gap:9px;margin-top:9px}
.tk-k .core{height:22px;width:auto;image-rendering:pixelated}
.tk-k span{font-size:22px;color:var(--dim)}

/* ── 那一閃 ──
   同一張圖用全白的配色再畫一次疊在上面，然後淡出。
   用一塊白色方塊蓋上去會變成方形的閃光，那不是剪影。 */
.pxflash{
  position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none;z-index:5;image-rendering:pixelated;
  animation:pxfl .45s steps(3,end) 1 forwards
}
@keyframes pxfl{0%{opacity:1}55%{opacity:.55}100%{opacity:0}}
.pxwrap{position:relative;display:inline-block;flex:0 0 auto}
.bt-ch{position:absolute}

/* ── 紀錄 ──
   一列一趟：牠在最左邊、資訊在右邊、點開才看細節。
   本來每一趟是一張攤開的大卡，五六趟之後整頁要捲很久，而且每一張長得
   一樣——那不是紀錄，是一疊表格。一頁能不能兩秒看懂，靠的是預設收起來。 */
.rec-list{display:flex;flex-direction:column}
/* 一列用格線排：左邊一格放牠，中間三列放資訊，右邊一格放印章。
   本來是 button 裡面再包一層區塊，那樣第一個子元素會被收縮成內容寬
   ——標題就變成一個字一行。格線沒有這個問題。 */
.rec{
  display:grid;grid-template-columns:55px 1fr auto;column-gap:14px;
  width:100%;text-align:left;align-items:start;
  padding:11px 0;border:none;background:none;font:inherit;color:var(--ink);
  cursor:pointer;border-bottom:2px solid rgba(0,0,0,.16)
}
.rec-px{grid-column:1;grid-row:1 / 4;display:flex;align-items:center;height:44px}
.rec-px .px{width:55px;height:auto;image-rendering:pixelated}
.rec-t{
  grid-column:2;grid-row:1;font-size:22px;font-weight:400;line-height:33px;
  /* 折行，不要截斷：22px 之下截斷只剩八個字。 */
  overflow-wrap:anywhere
}
.rec-d{grid-column:2;grid-row:2;font-size:22px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.rec-s{grid-column:3;grid-row:1 / 4;display:flex;align-items:center;opacity:.9}
.rec-s .px{width:22px;height:auto;image-rendering:pixelated}
.rec-s.none{color:var(--dim)}
.rec:hover .rec-t{color:var(--gold)}
.rec.open{border-bottom:0}
.rec.open .rec-t{color:var(--gold)}
.rec-more{
  padding:0 0 14px 69px;border-bottom:2px solid rgba(0,0,0,.16)
}
.rec-more .tags{margin-top:11px}
@media (max-width: 599px){ .rec-more{padding-left:0} }

/* ── 走出去的那一下 ──
   一道從上面下來的光、兩邊是岩壁、人沿著光往上走出畫面。
   沒有粒子、沒有光暈：硬邊、零模糊、光從上面來。 */
.xit{
  position:relative;height:264px;overflow:hidden;margin:0 0 22px;
  background:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.32);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.xit-rock{position:absolute;top:0;bottom:0;width:38%;background:rgba(0,0,0,.55);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.xit-rock.l{left:0}
.xit-rock.r{right:0}
/* 光。硬停的三段，不是漸層——一有模糊就變成現代特效。 */
/* 地表上面是日光。走上去就是走進光裡——
   底下越深越暗，那一條線是分界。 */
.xit-sky{position:absolute;left:0;right:0;top:0;height:22px;
  background:linear-gradient(180deg,#F7ECD2 0 14px,#D9C08A 14px 22px)}
.xit-beam{
  position:absolute;left:38%;right:38%;top:22px;bottom:0;
  background:linear-gradient(180deg,
    rgba(255,243,216,.52) 0 33px,
    rgba(255,243,216,.30) 33px 88px,
    rgba(255,243,216,.14) 88px 176px,
    rgba(255,243,216,.05) 176px 100%)
}
/* 光打在兩邊岩壁上的那一道邊。硬邊，沒有模糊。 */
.xit-beam::before,.xit-beam::after{
  content:'';position:absolute;top:0;bottom:0;width:3px;
  background:rgba(255,243,216,.30)
}
.xit-beam::before{left:-3px}
.xit-beam::after{right:-3px}
.xit-top{position:absolute;left:0;right:0;top:22px;height:3px;
  background:#8A7346}
.xit-hero{
  position:absolute;left:50%;bottom:22px;width:66px;margin-left:-33px;
  animation:xitup 2.4s steps(8,end) 1 forwards
}
.xit-hero .ch{width:66px;height:66px;image-rendering:pixelated}
@keyframes xitup{
  0%{transform:translateY(0);opacity:1}
  70%{transform:translateY(-154px);opacity:1}
  100%{transform:translateY(-198px);opacity:0}
}
@media (prefers-reduced-motion: reduce){ .xit-hero{animation:none} }

/* 剖面圖：走出去的那一組，廊道整條亮著一道光通到地表。 */
.xs-out{
  position:absolute;left:0;right:0;top:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,243,216,.20) 0 66px,
    rgba(255,243,216,.10) 66px 198px,
    rgba(255,243,216,.04) 198px 396px,
    transparent 396px)
}
.xs-shaft.left .xs-head b{color:var(--gold2)}
/* 走出去的那個人站在地表上。靠右擺，不然會壓到組名。 */
.xs-hero.out{z-index:4;left:auto;right:6px}

/* 他們自己寫的那兩段：小標在上、原話在下。
   系統不解讀、不歸類——原話放上去就好。 */
.quote b{display:block;font-size:22px;font-weight:400;color:var(--gold2);
  margin-bottom:3px}

/* 廊道抓得住。桌機上本來只能靠捲軸，等於不能前後看。 */
.scn-scroll{cursor:grab}
.scn-scroll.dragging{cursor:grabbing;user-select:none}
.scn-scroll.dragging .scn-in{pointer-events:none}

/* 排行榜的單位。只說一次，每一列就只剩數字。 */
.rk-u{margin:-6px 0 11px;font-size:22px;color:var(--dim)}

/* ── 全班最近：一則一行 ──
   本來一則兩行，十則就是二十行長得很像的字，整段讀起來是一面牆。
   壓成一行之後掃過去就知道最近誰動了。 */
.fd{
  /* 少一欄：任務名拿掉了（字放大之後那一欄只剩幾個字）。 */
  display:grid;grid-template-columns:22px auto auto 1fr;
  align-items:center;gap:9px;padding:6px 0;
  border-bottom:2px solid rgba(0,0,0,.14)
}
.fd:last-child{border-bottom:0}
.fd-ic{display:flex;align-items:center;justify-content:center}
.fd-ic .px{width:22px;height:auto;image-rendering:pixelated}
.fd b{font-size:22px;font-weight:400;color:var(--ink);white-space:nowrap}
.fd em{font-size:22px;font-style:normal;color:var(--gold2);white-space:nowrap}
.fd i{font-size:22px;font-style:normal;color:var(--mute);white-space:nowrap}
.fd.mine b{color:var(--gold)}

/* ── 承諾與實際：一條，不是兩排 ──
   本來上下兩排方格量的是同一件事（天數），讀的人得自己把兩排疊起來。
   疊成一條之後，要看的只有一件事：實心那一段停在淺色那一塊裡面沒有。 */
.eb-track{
  position:relative;height:22px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)
}
/* 準的範圍。停在裡面就是準。 */
.eb-band{position:absolute;top:0;bottom:0;background:rgba(233,179,65,.14);
  box-shadow:inset 2px 0 0 var(--gold-d), inset -2px 0 0 var(--gold-d)}
/* 實際走了幾天。 */
.eb-go{position:absolute;left:0;top:0;bottom:0;background:var(--gold-d);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.14)}
.ebar.over .eb-go{background:var(--over)}
/* 你說的那一天。 */
.eb-say{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;
  background:var(--gold2)}

.eb-n{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.eb-n b{font-size:22px;line-height:22px;font-weight:400;
  font-variant-numeric:tabular-nums}
.eb-say-n{font-size:22px;color:var(--dim)}
.eb-say-n b{color:var(--gold2)}
.eb-go-n{font-size:22px;color:var(--dim)}
.eb-go-n b{color:var(--gold)}
.ebar.over .eb-go-n b{color:var(--over)}
.eb-u{font-size:22px;color:var(--dim);margin-left:-8px}

/* 任務清單裡那一根點得開——那一根怎麼讀，全系統只有那一張卡說得出來。 */
.tk-k{border:none;background:none;font:inherit;padding:0;
  text-align:left}

/* ── 接口 ──
   介面只給最少：兩段亮的短邊，一個從上面垂下來的口。
   看得懂需要的就這些，不用一句話說明。 */
.bp{position:relative;padding-top:16px;padding-bottom:16px}
.bp-p{
  position:absolute;left:50%;width:14px;height:5px;margin-left:-7px;
  background:rgba(255,240,214,.08)
}
.bp-p.u{top:5px}
.bp-p.dn{bottom:5px}
.bp-p.on{background:var(--gold-d)}
.bp.fit{box-shadow:inset 0 0 0 2px var(--gold), inset 2px 2px 0 rgba(255,255,255,.12)}
.bp.fit .bp-p.u.on{background:var(--gold)}

/* 上一層留下的那個口。畫出來就是題目。 */
.bp-above{display:flex;flex-direction:column;align-items:center;margin:0 0 6px}
.bp-ax{width:55px;height:41px;image-rendering:pixelated;opacity:.75}
.bp-drop{width:5px;height:16px;background:var(--gold-d)}

/* ── 接起來的那一段 ──
   畫面這一半要滿：兩條側樑加橫檔，像一段真的架起來的東西。 */
.xs-link{
  position:absolute;left:50%;bottom:-14px;width:22px;height:22px;margin-left:-11px;
  z-index:2;pointer-events:none;
  background:
    linear-gradient(90deg,transparent 0 3px,#FFE9A8 3px 6px,transparent 6px 16px,
      #FFE9A8 16px 19px,transparent 19px 22px),
    repeating-linear-gradient(180deg,#C9A227 0 3px,transparent 3px 8px)
}

/* 建築本身放大：那條廊道要讀起來像一條街，不是一排小圖示。 */
/* 六種形狀要看得出輪廓，44px 還是太小。放到 55px，貼齊地面。 */

/* 排行榜改成三顆點：實心是準的，空心是還沒。
   畫成點不畫成長條——長條會讀成「量」，而這裡是次數。 */
.rk-dots{flex:1;display:flex;gap:9px;align-items:center;min-width:44px}
/* .rk-r b 那一條把整列的 b 都設成 flex:0 0 66px，所以點會被撐開。 */
/* 三個判定記號，一趟一個，照時間排。
   本來是三顆點（實心＝準的），讀得出「幾次」，但把「往哪一邊偏」丟掉了。
   全部朝右的那一列，是「他每一趟都比自己說的久」——那是舊的點看不出來的。 */
.rk-m{flex:0 0 33px;display:flex;align-items:center;justify-content:center;height:33px}
/* 記號是 16×12，兩邊都釘住——固定尺寸的點陣圖不該用 auto，
   那樣圖還沒解碼完的時候那一格是 0 高，整列會跳一下。 */
.rk-m .px{width:33px;height:25px;image-rendering:pixelated}
/* 還沒走到第三趟的那幾格：一個空的位子，不是一個空心的點——
   空心的點看起來像「沒準」，而它其實是「還沒有」。 */
.rk-m.none{position:relative}
.rk-m.none::after{content:'';position:absolute;left:50%;bottom:9px;
  width:11px;height:2px;margin-left:-5px;background:var(--line2)}

/* ── 老師：派過的每一個壓成一行 ──
   本來一個一張卡，還帶著注意事項與每一組承諾幾天的標籤——
   派了十個就是十張卡，而老師在這一頁要做的只有「再派一個」。 */
.msr{
  display:grid;grid-template-columns:1fr auto auto;gap:4px 11px;
  align-items:baseline;padding:11px 0;
  border-bottom:2px solid rgba(0,0,0,.16)
}
.msr:last-child{border-bottom:0}
/* 折行，不要截斷——任務名是那一列的身分。 */
.msr > b{font-size:22px;font-weight:400;line-height:33px;overflow-wrap:anywhere}
.msr-w{font-size:22px;color:var(--gold2);white-space:nowrap}
.msr-n{font-size:22px;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
/* 各組承諾了幾天。老師唯一看得到的「他們怎麼想這件事」。 */
.msr-e{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 14px}
.msr-e i{font-size:22px;font-style:normal;color:var(--dim);
  font-variant-numeric:tabular-nums}
.msr-e b{color:var(--ink);font-weight:400}

/* 三選一那三張：建築是深色剪影，畫在深色卡片上等於看不見。
   給它一塊亮的地面站著——那也剛好就是它蓋好之後在剖面圖上的樣子
   （那裡的底色是自己那一組的顏色），所以這張卡同時是預覽。 */
.bp{position:relative;padding-top:0;padding-bottom:11px;overflow:hidden}
.bp-ground{
  display:block;width:100%;height:55px;margin:0 0 9px;
  background:var(--gold);position:relative;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.30), inset 0 -3px 0 rgba(0,0,0,.45)
}
.bp-ground .bp-px{position:absolute;left:50%;bottom:2px;margin-left:-33px}
.bp-p.u{top:0}
.bp-p.dn{bottom:2px}

/* ── 營地 ──
   每走完一趟留下的那一個記號排在洞口的地上，洞口的寬度跟著長。
   十趟之後這裡是一個被你佈置過的營地——而首頁就是這條廊道。 */

/* 碰到的是誰留的。系統不編故事——這幾個字全部是別組自己打的。 */
.unc-by{
  font-size:22px;color:var(--gold);margin-top:5px;
  font-variant-numeric:tabular-nums
}

/* ── 留記號那一張 ──
   這是走完一整趟的收尾，本來只有一行 11px 的眉標。 */
.bpick .bp-h{font-size:33px;margin:0 0 5px}
.bpick .bp-sub{font-size:22px;color:var(--dim);margin:0 0 14px}
.bpick .bp-ground{height:88px}
.bpick .bp-px{width:99px;height:75px;margin-left:-49px}
.bpick .bp b{font-size:22px}
.bpick .bp i{font-style:normal;font-size:22px;color:var(--dim)}
.bpick .bp{flex:1 1 132px;gap:2px}
@media (max-width:520px){
  .bpick .bp-h{font-size:22px}
  .bpick .bp{flex:1 1 100%}
}


/* 一趟就這四件事。 */
.four{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:33px 0 0;padding:14px 0;border-top:1px solid var(--line2)
}
.fr{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px}
.fr-px{width:22px;height:22px;image-rendering:pixelated}
.fr b{font-size:22px;font-weight:400;color:var(--dim);white-space:nowrap}
.fr-a{width:14px;height:2px;background:var(--line2);flex:0 0 14px}
@media (max-width:520px){
  .four{gap:5px}
  .fr{min-width:55px}
}

/* ── 剖面圖底下那三顆 ──
   本來這幾段是直的疊在一起，一路捲到兩千像素。捲到底的東西等於沒有。 */
.segs{
  display:flex;gap:5px;margin:22px 0 14px;
  border-bottom:1px solid var(--line2);padding-bottom:0
}
.seg{
  padding:9px 14px;border:0;background:none;cursor:pointer;
  font:inherit;font-size:22px;color:var(--dim);
  border-bottom:3px solid transparent;margin-bottom:-1px
}
.seg:hover{color:var(--ink)}
.seg.on{color:var(--gold);border-bottom-color:var(--gold)}

/* ── 別組的紀錄 ──
   一列＝一趟。兩個數字跟一個他們自己取的名字，沒有評語。 */
.orec{display:flex;flex-direction:column}
.or{
  display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line)
}
.or:last-child{border-bottom:0}
.or-s{display:flex;align-items:center}
.or-s .px{width:22px;height:auto;image-rendering:pixelated}
.or b{font-size:22px;font-weight:400;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or-n{font-size:22px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.or-n b{color:var(--gold)}
.or.late .or-n b:last-child{color:var(--late)}
.or-w{grid-column:2 / 4;font-size:22px;color:var(--mute);margin-top:-5px}

/* 招牌的小圖。只有剖面圖的欄頭有訂過大小，所以它在別的地方
   （點進一組那張卡）會被 flex 撐成 565px 見方——一整塊招牌蓋住整張卡。 */
.px.sign-s{width:33px;height:33px;flex:0 0 33px;image-rendering:pixelated}

/* 記號點開來看到的那一趟：一天兩列的柱狀圖。任務之證併進來之後它住在這裡。 */
.bstory .bs-core{width:66px;height:auto;image-rendering:pixelated;flex:0 0 66px}

/* ── 每一張點陣圖自己知道自己多大 ──
   本來這幾張只有「在某個容器裡」才有寬度（.xs-hero .ch-s、.zn .zn-px…），
   所以換一個地方畫就會被 flex 撐開——招牌那一張在「點進一組」那張卡上
   長成 565px 見方，蓋住整張卡。畫在哪裡都對的那一條寫在這裡，
   容器裡要不一樣的照樣蓋得掉。 */
.px.zn-px{width:44px;height:44px}
.px.ch-s{width:36px;height:36px}
.px.vine-s{width:36px;height:36px}
.px.ff{width:44px;height:44px}
.px.bs-core{width:66px;height:auto;flex:0 0 66px}

/* 副標題。一句話說完這是什麼——在名字底下，在那兩顆鈕上面。 */
.gate .tagline{
  font-size:33px;line-height:1.35;color:var(--gold);
  margin:11px 0 33px;text-wrap:balance
}
@media (max-width:520px){ .gate .tagline{font-size:22px} }

/* ── 你說要走多遠 ──
   一格一天，亮到你拉到的那一格，擋路的那一隻站在盡頭。
   它不是另一個資訊——是同一個數字換成你等一下真的會看到的樣子。 */
.ew{margin:14px 0 0;overflow-x:auto;overscroll-behavior-x:contain}
.ew-in{display:flex;align-items:flex-end;gap:3px;min-height:44px;padding-bottom:3px}
.ew-c{
  flex:0 0 14px;width:14px;height:22px;
  background:var(--gold-d);
  box-shadow:inset 0 3px 0 var(--gold), inset 0 -3px 0 rgba(0,0,0,.45)
}
.ew-m{flex:0 0 auto;margin-left:9px;display:flex;align-items:flex-end}
.px.ew-px{width:44px;height:44px;image-rendering:pixelated}

/* 判定那一頁上的他。準了舉手，比說的久就撐著膝蓋喘。 */
.stamp-who{margin:0 0 11px}
.px.sw-px{width:88px;height:88px;image-rendering:pixelated}
@media (max-width:520px){ .px.sw-px{width:66px;height:66px} }

/* ── 記號就是那一趟 ──
   一天兩列的柱子。它有多高，就是那一趟過了幾天——
   營地上一排高矮不同的東西，而高矮的原因是他自己走出來的。 */
.bpick .bp-one{display:flex;gap:22px;align-items:flex-end;margin:0 0 22px}
.bpick .bp-ground{
  flex:0 0 110px;width:110px;min-height:110px;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
  background:var(--gold);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.30), inset 0 -3px 0 rgba(0,0,0,.45)
}
.bpick .px.bp-px{width:55px;height:auto;max-height:242px;image-rendering:pixelated}
.bpick .bp-say{flex:1;min-width:0}
.bpick .bp-say b{display:block;font-size:33px;font-weight:400;line-height:1.3}
.bpick .bp-say span{display:block;font-size:22px;color:var(--gold);
  font-variant-numeric:tabular-nums;margin-top:5px}
.bpick .bp-say i{display:block;font-style:normal;font-size:22px;color:var(--dim);margin-top:11px}
@media (max-width:520px){
  .bpick .bp-one{flex-direction:column;align-items:stretch;gap:14px}
  .bpick .bp-ground{flex:none;width:100%;min-height:132px}
}

/* 營地上那一排。站在地上，高矮不齊——那正是重點。 */

/* ── 走過的每一趟 ──
   一趟一格，舊的在左、新的在右——跟廊道同一個方向，
   所以「往左滑」＝「往回看」不用學。打開的時候停在最右邊。 */
.rstrip{
  overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  margin:0 0 11px;padding:0 0 6px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06)
}
.rs-in{display:flex;align-items:stretch;gap:2px;padding:11px 11px 0}
/* 一格一隻牠。

   本來一格四行（記號的詞、任務名、說幾天實際幾天、留下的那句話），
   八趟排開來就不是一條帶子，是一張表攤平了放在首頁。

   現在格子裡只有兩樣：牠，跟兩個數字。牠是那一趟盡頭擋路的那一隻，
   所以牠就是那一趟的名字——不用讀。詳細的點進去看。

   底下那一條是準度：金＝說中、綠＝比說的快、紅＝比說的久。
   一整排掃過去看得出自己有沒有在變準，那是一句話講不出來的。 */
.rs{
  flex:0 0 110px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:11px 6px 0;border:0;background:var(--panel);color:inherit;font:inherit;
  cursor:pointer;text-align:center
}
.rs:hover{background:var(--panel2)}
.rs:active{transform:translateY(2px)}
.rs-px{width:66px;height:auto;image-rendering:pixelated}
.rs-s{display:flex;flex-direction:column;align-items:center;gap:2px;
  width:100%;padding:0 0 8px}
.rs-s .px{width:33px;height:25px;image-rendering:pixelated}
.rs i{font-style:normal;font-size:22px;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.rs i u{text-decoration:none;color:var(--dim);padding:0 2px}
/* 準度那一條 */
.rs::after{content:"";display:block;width:100%;height:5px;background:var(--line)}
.rs.exact::after{background:var(--ok)}
.rs.early::after{background:var(--early)}
.rs.late::after{background:var(--late)}

/* 帶子的名字。概念要有名字，他才知道自己在練什麼。 */
.rs-h{
  font-size:22px;color:var(--gold);margin:0 0 6px;
  font-variant-numeric:tabular-nums
}

/* 結算那一頁的主角：一整個學期在量的唯一一件事。 */
.exsum .ex-big{
  font-size:33px;line-height:1.4;margin:5px 0 18px;color:var(--dim)
}
.exsum .ex-big b{font-size:44px;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}

/* ── 老師排到哪一天 ──

   老師對專案制定有自主權，排程是那個自主權最具體的一半。但它
   **不進判定**——所以它不能長得像警告：沒有紅色、沒有驚嘆號、
   過了也只是換一個字。它是一個事實，不是一個判決。 */
.dueline{
  display:flex;align-items:baseline;gap:8px;margin:0 0 11px;
  padding:8px 11px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.5), inset 0 -2px 0 rgba(255,240,214,.05)
}
.dueline span{font-size:22px;color:var(--dim)}
.dueline b{font-size:33px;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums}
.dueline em{font-style:normal;font-size:22px;color:var(--dim);margin-left:auto}
/* 過了就換一個字。顏色不換——換顏色就變成在說他做錯了。 */
.dueline.past em{color:var(--mute)}

/* 走廊上那一條線。老師排的那一天落在第幾格。
   虛線，因為它不是牆——走得過去。 */
.ew-due{
  flex:0 0 3px;align-self:stretch;margin:0 4px;
  background:linear-gradient(180deg,
    var(--dim) 0 6px, transparent 6px 11px);
  background-size:100% 11px
}
/* 承諾之外的那幾格：還沒有人走的地方。 */
.ew-c.off{opacity:.28}

/* 派過的那一行上，我排到哪一天。 */
.msr-d{font-size:22px;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.msr-d.past{color:var(--mute)}

/* 任務清單上，老師排到哪一天。接在日期那一格裡換行。 */
.rec-due{display:block;font-style:normal;font-size:22px;color:var(--dim);
  white-space:nowrap}

/* ── 交出去之後在等 ──
   本來只有一句「等他看」。三個數字全部都在，給他就好：
   交出去幾天、他手上幾件、你第幾。這不是催促——被催的是老師，
   而催老師不該由學生端的畫面來做，所以這裡一個評價的字都沒有。 */
.waitq{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:11px 0 0
}
.waitq span{font-size:22px;color:var(--dim)}
.waitq b{font-size:44px;line-height:1;font-weight:400;color:var(--gold);
  font-variant-numeric:tabular-nums}
.waitq em{font-style:normal;font-size:22px;color:var(--dim);width:100%}

/* 排到什麼時候：加減鍵比承諾那一對小一號——這是老師的工具，
   不是這一頁的主角。 */
.duestep{margin:0 0 6px}
.duestep .es-b{flex:0 0 55px;height:55px;font-size:33px}
.duestep .es-n b{font-size:55px}
.duestep .es-n span{font-size:22px}
/* 算出來是哪一天。相對的輸入，絕對的顯示。 */
.duewhen{font-size:22px;color:var(--ink);margin:0 0 11px}

/* 老師勾了。一張通知，不是一個動作——記號已經插進那一層了。 */
.okcard{
  margin:0 0 11px;padding:14px;background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--gold-d)
}
.okcard b{display:block;font-size:22px;font-weight:400;color:var(--ink);margin:4px 0}
/* 大的那一句。33px 是這個作品裡標題的字級——它就是一個標題。 */
.okcard b.ok-big{
  font-size:33px;line-height:1.35;color:var(--gold);margin:6px 0 0;
  text-wrap:balance
}
/* 小的那一句。22px 是下限，不是「小字」——這裡沒有小字。 */
.okcard .ok-sub{
  display:block;font-size:22px;font-style:normal;line-height:1.4;
  color:var(--dim);margin:8px 0 0
}
.okcard .ok-ms{
  display:block;font-size:22px;color:var(--mute);margin:11px 0 0
}
/* 拿到的那一張。金色，因為它是這一刻唯一「你多了一個東西」的話。 */
.okcard .ok-cert{
  display:block;font-size:22px;line-height:1.4;color:var(--gold);margin:6px 0 0
}

/* ── 你要做哪幾件 ──
   一件一行：顏色、名字、幾天、拿掉。顏色跟廊道上那一格頭上的
   顏色是同一個（stepHue），所以走到第幾天在做哪一件不用讀。 */
.plist{display:flex;flex-direction:column;gap:5px;margin:0 0 11px}
.pl{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  background:var(--sunk);box-shadow:inset 0 2px 0 rgba(0,0,0,.5)
}
.pl b{flex:0 0 11px;height:22px;display:block}
.pl i{flex:1;font-style:normal;font-size:22px;color:var(--ink);
  overflow-wrap:anywhere;min-width:0}
.pl u{
  flex:0 0 44px;text-align:center;text-decoration:none;
  font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums
}
.pl .pd{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;
  font-size:22px;line-height:1;color:#1A1408;background:var(--gold);
  box-shadow:2px 2px 0 rgba(0,0,0,.6)
}
.pl .pd:hover{background:var(--gold2)}
.pl .pd:active{transform:translate(2px,2px);box-shadow:none}
.pl .px-del{
  flex:0 0 33px;height:44px;border:0;cursor:pointer;font:inherit;font-size:22px;
  color:var(--mute);background:none
}
.pl .px-del:hover{color:var(--over)}
/* 加起來的那個數字。不是鍵，所以沒有鍵的樣子。 */
.es-n.sum{margin:0 auto}

/* ── 挑一個角色 ──
   四個並排，剪影自己說話——四種長得不一樣，所以不用寫一句話解釋。
   走路那兩幀在這裡就輪流播：選的時候就看得到他會怎麼動。 */
/* 一欄，四列。

   那一句從標籤變成一句話之後，欄位就不能再切窄了：四欄一格只有
   159px，22px 的字一行放七個，一句話折成五行，最後一行剩一個字；
   兩欄也還要四行。一欄的話圖在左、話在右，一句話一到兩行讀得完。

   而且四個並排讀起來像在比較，一列一個讀起來像在認人——他挑的
   是「我是怎麼做事的人」，不是在四個規格之間挑一個。 */
.pick4{display:flex;flex-direction:column;gap:11px;margin:0 0 22px}
/* 一格變寬之後改成橫的：圖在左，名字與那一句在右。
   直的排法在寬格子裡會讓那一句被擠在中間一條窄柱裡。 */
.p4{
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:14px;border:0;cursor:pointer;font:inherit;color:inherit;
  background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--line);
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,
    100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)
}
.p4:hover{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--gold-d)}
.p4:active{transform:translateY(2px)}
.p4.on{box-shadow:inset 0 0 0 3px var(--gold)}
.p4-px{position:relative;display:block;flex:0 0 88px;width:88px;height:88px}
.p4-px .px{position:absolute;left:0;top:0;width:88px;height:88px;image-rendering:pixelated}
.p4-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.p4 b{font-size:22px;font-weight:400;color:var(--ink)}
.p4 i{font-style:normal;font-size:22px;color:var(--dim);line-height:1.5;overflow-wrap:anywhere}

/* 鎖著的那一扇。不是一顆按下去會跳「還不行」的鍵——它根本按不下去，
   而且看得出來按不下去。點得動卻沒有反應是最糟的那一種。 */
.dk.shut{
  cursor:default;opacity:.42;
  box-shadow:inset 0 0 0 2px var(--line)
}
.dk.shut:hover{background:none;filter:none}

/* 門上那一個通知。上次翻開圖鑑之後多遇到幾隻，就掛幾。

   不用小紅點：字級下限是 22px，而這一排門本來就是 22px 的字，
   所以一個數字接在名字後面剛好——而且數字比一個點多說一件事。 */
.dk .nb{
  font-style:normal;font-size:22px;line-height:1;
  color:#1A1408;background:var(--gold);
  padding:2px 8px;margin-left:2px;
  animation:nbin .22s steps(3,end) 1
}
@keyframes nbin{
  0%{transform:scale(1.8);opacity:0}
  100%{transform:scale(1);opacity:1}
}
@media (prefers-reduced-motion: reduce){ .dk .nb{animation:none} }

/* ---------- 登入那一頁旁邊走過去的那一位 ----------

   兩幀輪播是原地走，再加一段橫move才是「前進」——原地踏步的角色
   放在一道門旁邊看起來像卡住了。走到底就從左邊再進來，
   跟廊道那一條一樣：這個世界一直在往前，你還沒進來而已。 */
.gate-hd{position:relative;overflow:hidden}
.gate-walk{
  position:absolute;right:0;bottom:0;display:block;width:66px;height:66px;
  pointer-events:none;
  animation:gatewalk 9s linear infinite
}
.gate-walk .px{position:absolute;left:0;top:0;width:66px;height:66px}
.gate-walk .wa{animation:wkA .44s steps(1,end) infinite}
.gate-walk .wb{animation:wkB .44s steps(1,end) infinite}
@keyframes gatewalk{
  0%{transform:translateX(-264px)}
  100%{transform:translateX(66px)}
}
@media (prefers-reduced-motion: reduce){
  .gate-walk{animation:none;transform:translateX(0)}
  .gate-walk .wa{animation:none;opacity:1}
  .gate-walk .wb{animation:none;opacity:0}
}

/* ---------- 一整排任務之證 ----------

   一根一格，由左到右照封存的順序。它們要並排而且要一樣高——
   排在一起才看得出「沒有兩根一樣」，那是這一頁的全部內容。

   每一根底下寫那一件任務的名字，不寫數字：準不準在別的地方，
   這一頁是「這學期長成什麼樣子」。 */
.cores{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.core1{
  display:flex;flex-direction:column;align-items:center;gap:11px;
  width:165px;padding:14px 11px;
  background-color:var(--zbg,var(--panel2));
  box-shadow:inset 0 0 0 1px var(--line)
}
/* 那一根要比它的名字大。它才是內容，名字是說明。 */
.core1 .px.cx-px.core{width:110px;height:auto;max-height:132px}
.core1 b{
  font-size:22px;font-weight:400;line-height:1.3;color:var(--zink,var(--dim));
  text-align:center;overflow-wrap:anywhere
}

/* ---------- 審核清單的一列 ----------

   一列一件事，整列是一顆鈕。左邊大的是任務名（那是他要判斷的東西），
   底下小的是哪一組，右邊是等了幾天——排序照等最久，所以那個數字
   是他往下看的理由。

   本來一列有八塊、還配一顆另外的鍵：整列可以按之後那顆鍵就多餘了，
   而「按哪裡」也不用再想一次。 */
.rq{
  display:flex;align-items:center;gap:14px;width:100%;
  margin:0 0 11px;padding:14px 18px;border:0;cursor:pointer;
  text-align:left;font:inherit;color:inherit;
  background:var(--panel);
  box-shadow:inset 0 0 0 1px var(--line),3px 3px 0 rgba(0,0,0,.45);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),
    calc(100% - 11px) 100%,0 100%,0 11px)
}
.rq:hover{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--gold-d),3px 3px 0 rgba(0,0,0,.55)}
.rq:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1px var(--gold-d)}
.rq:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rq-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rq-t b{font-size:22px;font-weight:400;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.rq-t em{font-size:22px;font-style:normal;line-height:1.3;color:var(--mute)}
.rq-d{font-size:22px;color:var(--dim);white-space:nowrap;flex:0 0 auto}
.rq:hover .rq-t b{color:var(--gold)}

/* ---------- 交出去的那一場 ----------

   排版照寶可夢：牠的名牌在左上、牠站在右上；你站在左下、你的名牌在右下。
   底下一個字幕框，一句一句走。

   規矩跟全作一致：hard stop、0 模糊、光從左上來、圓角一律 11px 的切角。
   血條的動畫用 steps()——平滑的補間會讓它立刻看起來像現代的網頁元件，
   而不是一台在跑的機器。 */

.bt{
  position:relative;height:352px;overflow:hidden;margin:0 0 11px;
  background:linear-gradient(180deg,var(--z1) 0 46%,var(--z2) 46% 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.32), inset 3px 3px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bt-side{position:absolute;left:0;right:0;height:50%}
.bt-side.foe{top:0}
.bt-side.me{bottom:0}

/* 名牌。名字、一條時間、剩幾天。數字寫在旁邊，不用猜那條有多長。 */
.bt-plate{
  position:absolute;width:170px;max-width:46%;padding:6px 11px;z-index:4;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.34), inset 2px 2px 0 rgba(255,255,255,.10);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)
}
.bt-side.foe .bt-plate{left:16px;top:16px}
.bt-side.me .bt-plate{right:16px;bottom:16px}
.bt-plate b{display:block;font-size:22px;font-weight:400;color:var(--ink)}
.bt-num{display:block;font-size:22px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}

.bt-bar{height:9px;margin:5px 0 2px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.bt-bar i{display:block;height:100%;background:var(--gold);
  transition:width .1s steps(2,end)}
/* 見底那一刻換色。這是「時間用完了」唯一的訊號——不扣任何東西，
   但看得出來。 */
.bt.me-out .bt-plate.me .bt-bar i{background:var(--over)}
.bt.foe-out .bt-plate.foe .bt-bar i{background:var(--over)}

/* 站台。硬邊的一塊，不是橢圓陰影——橢圓一畫上去就不是像素了。 */
.bt-pad{
  position:absolute;width:143px;height:11px;z-index:1;
  background:linear-gradient(180deg,
    rgba(255,240,214,.13) 0 3px, rgba(0,0,0,.30) 3px 11px)
}
.bt-side.foe .bt-pad{right:33px;bottom:11px}
.bt-side.me .bt-pad{left:33px;bottom:44px}

.bt-ch{position:absolute;z-index:2}
.bt-side.foe .bt-ch{right:66px;bottom:14px}
.bt-side.me .bt-ch{left:66px;bottom:47px}
.bt-px{width:88px;height:88px;image-rendering:pixelated}
.bt-side.foe .bt-px{transform:scaleX(-1)}

/* 呼吸。兩邊反相，畫面才不會像一張靜止圖。 */
.bt-side.foe .bt-ch{animation:btbob 1.2s steps(2,end) infinite}
.bt-side.me .bt-ch{animation:btbob 1.2s steps(2,end) infinite reverse}
@keyframes btbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 遭遇：整個畫面閃一次再進場。 */
.bt-wipe{
  position:absolute;inset:0;z-index:9;background:#000;pointer-events:none;
  animation:btwipe .42s steps(4,end) 1 forwards
}
@keyframes btwipe{0%{opacity:1}100%{opacity:0}}

/* 上前那一下：撞一下、閃一下、人往前跨。 */
.bt.hit{animation:bthit .24s steps(2,end) 1}
@keyframes bthit{
  0%{transform:translateX(0)} 25%{transform:translateX(-5px)}
  50%{transform:translateX(4px)} 75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}
.bt.hit .bt-side.me .bt-ch{animation:btlunge .24s steps(2,end) 1}
@keyframes btlunge{0%{transform:translateX(0)}50%{transform:translateX(18px)}
  100%{transform:translateX(0)}}
.bt.hit::after{
  content:'';position:absolute;inset:0;z-index:8;pointer-events:none;
  background:rgba(255,243,216,.75);
  animation:btflash .24s steps(1,end) 1 forwards
}
@keyframes btflash{0%{opacity:.9}40%{opacity:.3}100%{opacity:0}}

/* 牠見底：退開、暗下去。牠不是被打死的，牠只是不再擋在那裡。 */
.bt.foe-out .bt-side.foe .bt-ch{
  animation:btfall .55s steps(3,end) 1 forwards
}
@keyframes btfall{to{transform:translate(33px,11px);opacity:.18}}

/* 字幕框。一句一句走——一次全部倒出來就不是一場戰鬥，是一張結果表。 */
.bt-say{
  min-height:66px;margin:0 0 11px;padding:14px 16px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.30), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bt-say b{font-size:22px;font-weight:400;line-height:33px;color:var(--ink)}
.bt-btn{margin:0}

@media (max-width: 899px){
  .bt{height:308px}
  .bt-px{width:66px;height:66px}
  .bt-plate{width:150px}
}
@media (prefers-reduced-motion: reduce){
  .bt-wipe,.bt.hit,.bt.hit::after,.bt-side .bt-ch{animation:none}
  .bt-wipe{display:none}
  .bt-bar i{transition:none}
}

/* ---------- 首頁角色頭上那一塊牌子 ----------
   使用者：現在的呈現看不出他在幹嘛。寫出來最快。 */
.hero-tag{
  /* 從角色那個框的上緣往上長，留 9px。本來寫 top:-22px，
     而牌子自己就有 30px 高，下緣會蓋到頭。 */
  position:absolute;left:50%;bottom:100%;margin-bottom:9px;
  transform:translateX(-50%);
  padding:2px 9px;font-size:22px;line-height:1.3;white-space:nowrap;z-index:5;
  color:var(--mute);background:rgba(0,0,0,.62);
  box-shadow:inset 0 0 0 2px rgba(255,240,214,.14)
}
.hero-tag.go{color:#0F0C08;background:var(--gold);
  box-shadow:inset 0 0 0 2px var(--gold2);
  animation:tagb 1.1s steps(1,end) infinite}
.hero-tag.rest{color:#FFD9A0;background:rgba(233,132,63,.30);
  box-shadow:inset 0 0 0 2px rgba(233,132,63,.65)}
@keyframes tagb{0%,60%{background:var(--gold)}61%,100%{background:var(--gold2)}}
@media (prefers-reduced-motion: reduce){ .hero-tag.go{animation:none} }

/* ── 選單 ──
   貼在畫面右下角，寶可夢的招式選單就長在那裡。
   登場演完才出現（JS 加 .ready），不是用動畫開——
   動畫的時鐘會被凍住，setTimeout 不會。 */
/* 下面那一條：左邊字幕框、右邊選單。
   本來選單貼在畫面右下角，跟自己的名牌疊在一起。 */
.bt-bottom{display:flex;gap:11px;align-items:stretch;margin:0 0 11px}
.bt-bottom .bt-say{flex:1;margin:0;min-width:0}
.bt-menu{
  flex:0 0 auto;display:none;align-self:stretch;
  background:var(--card2);padding:9px 11px;
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
.bt-bottom.ready .bt-menu{display:block;animation:btpop .2s steps(2,end) 1}
@keyframes btpop{from{transform:translateY(11px)}to{transform:none}}
.bm{
  display:block;width:100%;padding:3px 22px 3px 14px;text-align:left;
  border:none;background:none;font:inherit;cursor:pointer;
  font-size:22px;line-height:33px;color:var(--ink);white-space:nowrap
}
/* 寶可夢的游標：選到的那一行前面有一個 ▶。 */
.bm::before{content:'▶';margin-right:6px;opacity:0;color:var(--gold)}
.bm:hover::before,.bm:focus::before{opacity:1}
.bm.go{color:var(--gold)}

/* 名牌與字幕框照舊版寶可夢：方角、粗黑外框、裡面一圈亮邊。
   那個年代的畫面能力低，靠的全是輪廓與對比——
   剛好跟這個作品的規矩一致（hard stop、0 模糊、光從左上來）。 */
.bt-plate,.bt-say{clip-path:none;border-radius:0}
.bt-plate{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}
.bt-say{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}
/* 名牌那條斜出去的尾線——那個畫面最好認的一筆。 */
.bt-plate::after{
  content:'';position:absolute;bottom:-3px;height:3px;background:#0D0B08
}
.bt-side.foe .bt-plate::after{left:0;width:calc(100% + 33px)}
.bt-side.me .bt-plate::after{right:0;width:calc(100% + 33px)}

.bt-row{display:flex;align-items:center;gap:6px}
.bt-row em{font-size:22px;font-style:normal;color:var(--gold2)}
.bt-row .bt-bar{flex:1;margin:5px 0 2px}

/* 字幕框右下角那個閃動的三角。 */
.bt-say{position:relative}
.bt-arrow{
  position:absolute;right:14px;bottom:11px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:8px solid var(--gold);
  animation:btar .7s steps(1,end) infinite
}
@keyframes btar{0%,50%{opacity:1}51%,100%{opacity:0}}

/* 被打到：牠閃爍，不是整片閃光——那個年代就是這樣做的。 */
.bt.hit .bt-side.foe .bt-ch{animation:btblink .24s steps(1,end) 3}
@keyframes btblink{0%,49%{opacity:1}50%,100%{opacity:.15}}

@media (prefers-reduced-motion: reduce){
  .bt-arrow{animation:none}
  .bt.hit .bt-side.foe .bt-ch{animation:none}
}

/* 背景太黑就不是一個地方。鋪上那一層的紋理，
   跟廊道與剖面圖共用同一份（見 51-zones.css 的 --ztex）。 */
.bt{background-color:var(--zbg);background-image:var(--ztex)}
.bt::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,
    rgba(255,240,214,.05) 0 46%, rgba(0,0,0,.22) 46% 100%)
}
/* 牠畫得比人小一半就不像擋路的。原圖 24×16，比例照著給才不會被拉扁。 */
.bt-side.foe .bt-px{width:132px;height:88px}
@media (max-width: 899px){ .bt-side.foe .bt-px{width:110px;height:73px} }
/* 見底那一刻，那一張名牌整個暗下來。 */
.bt-plate.out{opacity:.72}

/* .bt-plate b 是 display:block（名字要獨占一行），
   但名牌右下角那個 n/ m 裡面的 b 也吃到了，於是斷成兩行。 */
.bt-num b{display:inline}

/* ── 血條拿掉之後的名牌 ──
   上面只有名字；報完那一趟才長出「說了幾天／走了幾天」。 */
.bt-plate .bt-num{display:block;margin-top:5px;font-size:22px;color:var(--gold2);
  text-align:left;font-variant-numeric:tabular-nums}
.bt-plate{width:auto;min-width:110px}

/* ── 登場 ──
   牠從右邊滑進來。舊版寶可夢就是這樣：沒有粒子，就是滑進來。 */
.bt-side.foe .bt-ch{animation:btenter .5s steps(5,end) 1, btbob 1.2s steps(2,end) .5s infinite}
@keyframes btenter{from{transform:translateX(44px)}to{transform:translateX(0)}}
.bt-side.foe .bt-plate{animation:btslide .45s steps(5,end) 1}
@keyframes btslide{from{transform:translateX(-55px)}to{transform:translateX(0)}}
.bt-side.me .bt-plate{animation:btslider .45s steps(5,end) 1}
@keyframes btslider{from{transform:translateX(55px)}to{transform:translateX(0)}}

/* ── 被打敗 ──
   閃四下，然後往下滑出畫面。沒有爆炸、沒有粒子——
   那個年代畫不出來，而少掉那些之後這一下反而更重。 */
.bt.foe-out .bt-side.foe .bt-ch{
  animation:btko 1.1s steps(1,end) 1 forwards
}
@keyframes btko{
  0%,8%{opacity:1}   9%,16%{opacity:.1}
  17%,24%{opacity:1} 25%,32%{opacity:.1}
  33%,40%{opacity:1} 41%,48%{opacity:.1}
  49%,56%{opacity:1} 57%,64%{opacity:.1}
  65%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(66px)}
}
.bt.foe-out .bt-side.foe .bt-plate{opacity:.55}

/* 報出來那一刻，兩張名牌一起亮一下。 */
.bt.told .bt-plate{animation:bttold .4s steps(2,end) 1}
@keyframes bttold{0%,49%{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px var(--gold)}
  50%,100%{box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)}}

@media (prefers-reduced-motion: reduce){
  .bt-side.foe .bt-ch,.bt-side .bt-plate{animation:none}
  .bt.foe-out .bt-side.foe .bt-ch{animation:none;opacity:.15}
  .bt.told .bt-plate{animation:none}
}


/* 手機上下面那一條擠不下並排，就上下疊。 */
@media (max-width: 599px){
  .bt-bottom{flex-direction:column;gap:9px}
  .bt-menu{align-self:stretch}
  .bm{display:inline-block;width:auto;margin-right:22px}
}

/* 桌機上不要把戰鬥拉成一長條。
   全寬的話兩邊角色被推到極端、中間整片空，那就不是一個畫面了。
   舊版寶可夢的戰鬥畫面接近方的，所以這裡也收在一個方框裡。 */
@media (min-width: 900px){
  .bt{max-width:704px;margin-left:auto;margin-right:auto;height:396px}
  .bt-bottom{max-width:704px;margin-left:auto;margin-right:auto}
  .bt-side.foe .bt-ch{right:110px}
  .bt-side.me .bt-ch{left:110px}
  .bt-side.foe .bt-pad{right:77px}
  .bt-side.me .bt-pad{left:77px}
}

/* ── 兩問 ──
   接在字幕框底下，跟選單同一個位置。答完打牠一下。 */
.bt-q{
  margin:0 0 11px;padding:14px 16px;background:var(--card2);
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
@media (min-width: 900px){ .bt-q{max-width:704px;margin-left:auto;margin-right:auto} }
.bt-q .steps-list,.bt-q .alist{margin:0 0 11px}
.bt-menu.wide{display:flex;gap:22px;background:none;box-shadow:none;padding:0}
.bt-menu.wide .bm{width:auto}

/* ── 受傷 ──
   答完一問打牠一下：整個畫面震一下，牠往右退、閃三下。
   牠不會倒——倒下是最後那一句數字才發生的事。 */
.bt.hurt{animation:bthit .26s steps(2,end) 1}
.bt.hurt .bt-side.foe .bt-ch{animation:bthurt .56s steps(1,end) 1}
@keyframes bthurt{
  0%{transform:translateX(0);opacity:1}
  10%{transform:translateX(14px);opacity:.15}
  22%{opacity:1}  34%{opacity:.15}
  46%{opacity:1}  58%{opacity:.15}
  70%{opacity:1;transform:translateX(14px)}
  100%{transform:translateX(0);opacity:1}
}
.bt.hurt::after{
  content:'';position:absolute;inset:0;z-index:8;pointer-events:none;
  background:rgba(255,243,216,.6);
  animation:btflash .26s steps(1,end) 1 forwards
}

/* ── 逃跑 ──
   填到一半發現寫不出來就走。角色往回跑出畫面——
   那不是認輸，是承認做不完，而承認比硬交出去好。 */
.bt.flee .bt-side.me .bt-ch{
  animation:btflee .8s steps(6,end) 1 forwards
}
@keyframes btflee{to{transform:translateX(-352px)}}
.bt.flee .bt-side.me .bt-plate{opacity:.4}

@media (prefers-reduced-motion: reduce){
  .bt.hurt,.bt.hurt .bt-side.foe .bt-ch,.bt.hurt::after{animation:none}
  .bt.flee .bt-side.me .bt-ch{animation:none;opacity:.2}
}

/* 第二問那三塊。小標在上、東西在下，跟字幕框同一種框。 */
.bt-qh{font-size:22px;color:var(--gold2);margin:11px 0 6px}
.bt-qh:first-child{margin-top:0}
.bt-w{
  width:100%;margin:0;padding:9px 11px;font:inherit;font-size:22px;line-height:22px;
  color:var(--ink);background:var(--sunk);border:none;resize:vertical;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.42)
}
.bt-w:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold-d)}
.bt-w::placeholder{color:var(--write-dim)}

/* ── 登場：牠先跳出來 ──
   舊版寶可夢的野生遭遇：畫面切掉，牠從下面跳上來、彈一下才站定。
   跳完才輪到你——所以選單是登場演完才出現的。 */
.bt-side.foe .bt-ch{
  animation:btjump .62s steps(6,end) 1, btbob 1.2s steps(2,end) .62s infinite
}
@keyframes btjump{
  0%{transform:translate(44px,66px)}
  55%{transform:translate(6px,-14px)}
  75%{transform:translate(0,6px)}
  90%{transform:translate(0,-4px)}
  100%{transform:translate(0,0)}
}
/* 落地那一下的塵。硬邊的一條，沒有粒子。 */
.bt-side.foe .bt-pad::after{
  content:'';position:absolute;left:-11px;right:-11px;top:0;height:3px;
  background:rgba(255,240,214,.5);
  animation:btdust .5s steps(3,end) .55s 1 backwards
}
@keyframes btdust{0%{opacity:0;transform:scaleX(.3)}30%{opacity:.9;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(1.3)}}
@media (prefers-reduced-motion: reduce){
  .bt-side.foe .bt-ch{animation:none}
  .bt-side.foe .bt-pad::after{animation:none;opacity:0}
}

/* ── 舊版寶可夢那種框，往主流程推 ──

   那個年代的介面只有一種框：外面一圈粗黑、裡面一圈亮邊、方角。
   它之所以好認，是因為整個畫面上每一個「要你讀」或「要你選」的東西
   都長成那樣——所以這裡也只給那兩種東西用：

     .tline     現在要做的是什麼（讀）
     .act-card  那一顆鍵在的地方（選）
     .bt-say / .bt-menu / .bt-q  戰鬥裡的字幕與選單

   其餘（卡片、地圖、圖鑑）維持原本 11px 的切角——
   全部換成方角的話，這個作品就變成寶可夢的仿作，而不是它自己。 */
.tline, .act-card{
  clip-path:none;border-radius:0;
  background:var(--card2);
  box-shadow:0 0 0 3px #0D0B08, inset 0 0 0 2px rgba(255,240,214,.30)
}
.tline{margin-bottom:11px}

/* 主要那一顆鍵：選單的一行，前面有游標。 */
.act-card .btn.big{
  clip-path:none;border-radius:0;text-align:left;
  background:none;color:var(--gold);
  box-shadow:none;padding:6px 11px
}
.act-card .btn.big::before{
  content:'▶';margin-right:9px;color:var(--gold);
  animation:btar .7s steps(1,end) infinite
}
.act-card .btn.big:hover{background:rgba(233,179,65,.12)}
@media (prefers-reduced-motion: reduce){ .act-card .btn.big::before{animation:none} }

/* ── 收掉太像的那幾筆 ──

   使用者：「不要太明顯，我不想被說抄襲。」他是對的。

   結構可以留（照面、名牌、字幕框、兩個選項、閃爍後倒下）——那些是
   那個年代通用的做法，不屬於任何一款遊戲。要收掉的是那幾筆一眼就
   認得出是誰的：

     ▶ 游標          那是最好認的一筆
     名牌的斜尾線     第二好認
     閃動的 ▼        第三
     全方角的框      跟這個作品自己的 11px 切角衝突

   換回這個作品自己的語彙：11px 切角、金色的小方塊、硬邊的亮邊。 */

/* 游標換成這個作品自己的金色方塊，不閃。 */
.bm::before{content:'';display:inline-block;width:6px;height:6px;
  margin-right:9px;vertical-align:middle;background:transparent}
.bm:hover::before,.bm:focus::before{background:var(--gold)}
.act-card .btn.big::before{
  content:'';display:inline-block;width:6px;height:6px;margin-right:11px;
  vertical-align:middle;background:var(--gold);animation:none
}

/* 名牌的斜尾線拿掉，角改回 11px 的切角。 */
.bt-plate::after{display:none}
.bt-plate,.bt-say,.bt-menu,.bt-q,.tline,.act-card{
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
/* 切角配不上外框的粗黑圈，改成往內的亮邊——跟全作其他卡片同一套。 */
.bt-plate,.bt-say,.bt-menu,.bt-q,.tline,.act-card{
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.34), inset 2px 2px 0 rgba(255,255,255,.10)
}
.bm:hover{box-shadow:none}

/* 字幕框那個三角拿掉。有按鍵在旁邊，不需要「按 A 繼續」的提示。 */
.bt-arrow{display:none}

/* 他自言自語的那一句。借的是同一塊牌子（見 61-scene.js 的 osTick），
   所以只換樣子不換位置：金邊拿掉、字色轉白、多一個小尾巴指向他。

   兩件事跟那塊牌子不一樣：

   一 · 會折行。牌子上是「前進中」三個字，一句話是十七個——
        nowrap 的話一行三百七十幾，比廊道還寬。

   二 · 從他的左邊長出去，不置中。置中的話，坐在洞口的那個人
        （x=44）頭上那一塊會有一半落在畫面外，而 .scn 是
        overflow:hidden——落在外面的字不是跑版，是被切掉。
        尾巴因此挪到他頭頂正上方那一點。 */
.hero-tag.os{
  left:0;transform:none;
  /* width:max-content 是必要的：這一塊是絕對定位掛在角色那個 66px 的
     框上，寬度 auto 會收縮到那個框的寬——十七個字就變成一行一個字，
     291px 高，整條頂出畫面。max-content 讓它照字算，再用 max-width 收。 */
  width:max-content;max-width:264px;
  white-space:normal;text-align:center;line-height:1.45;
  color:var(--ink);background:rgba(6,5,4,.88);
  box-shadow:inset 0 0 0 2px var(--line2);
  animation:osin .18s steps(2,end) 1
}
.hero-tag.os::after{
  content:'';position:absolute;left:29px;top:100%;
  width:8px;height:6px;background:rgba(6,5,4,.88)
}
@keyframes osin{
  0%{transform:translateY(4px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
@media (prefers-reduced-motion: reduce){ .hero-tag.os{animation:none} }

/* 他站在窗的右半邊：泡泡改成往左長，尾巴跟著換到右邊指他。
   哪一邊是量出來的（見 61-scene.js 的 say），不是猜的。 */
.hero-tag.os.os-l{left:auto;right:0}
.hero-tag.os.os-l::after{left:auto;right:29px}

/* ── 回報第一問：每一件實際花了幾天 ──
   兩個數字並排：他當初說的（灰、不能動）跟他現在報的（金、加減鍵）。
   並排是重點——這個作品在練的就是那兩個數字之間的距離。 */
.splist{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.sp2{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  background:rgba(0,0,0,.34);box-shadow:inset 0 2px 0 rgba(0,0,0,.4)
}
.sp2 b{flex:0 0 11px;height:22px;display:block}
.sp2 i{flex:1;font-style:normal;font-size:22px;color:var(--ink);
  overflow-wrap:anywhere;min-width:0}
.sp2 u{text-decoration:none;font-size:22px;font-variant-numeric:tabular-nums}
.sp2 u.said{flex:0 0 66px;text-align:right;color:var(--mute)}
.sp2 u.got{flex:0 0 44px;text-align:center;color:var(--gold)}
.sp2 .pd{
  flex:0 0 44px;height:44px;border:0;cursor:pointer;font:inherit;
  font-size:22px;line-height:1;color:#1A1408;background:var(--gold);
  box-shadow:2px 2px 0 rgba(0,0,0,.6)
}
.sp2 .pd:hover{background:var(--gold2)}
.sp2 .pd:active{transform:translate(2px,2px);box-shadow:none}

/* ── 回報第二問：順／普通／不順 ──
   三顆一樣大。沒有一顆長得比較「對」——選不順不會有任何後果。 */
.feels{display:flex;gap:8px;margin:0 0 14px}
.fl{
  flex:1;height:66px;border:0;cursor:pointer;font:inherit;font-size:22px;
  color:var(--ink);background:var(--sunk);
  box-shadow:inset 0 0 0 2px var(--line)
}
.fl:hover{background:var(--panel2)}
.fl:active{transform:translateY(2px)}
.fl.on{color:#1A1408;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold2)}

/* 老師那一頁上，那三樣是唯讀的：不能按，只是看。 */
.feels.one{max-width:132px}
.feels.one .fl{cursor:default}
.sp2 u.got.over{color:var(--over)}

/* ---------- 排行榜 ----------
   刻意加進來、而且準備好隨時拿掉的（見 68-rank.js 的說明）。

   畫法上守一條：條越短越準。這跟一般排行榜相反——
   一般是條越長越好，那會讓人想把條拉長；這裡想拉的是「拉短」，
   而拉短的唯一方法是估得準一點。 */
.rk-list{display:flex;flex-direction:column}
.rk-r{
  display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:2px solid rgba(0,0,0,.16)
}
.rk-r:last-child{border-bottom:0}
.rk-i{
  flex:0 0 22px;font-size:22px;font-style:normal;line-height:22px;
  color:var(--mute);text-align:center;font-variant-numeric:tabular-nums
}
.rk-r b{flex:0 0 66px;font-size:22px;font-weight:400;color:var(--ink)}
.rk-bar{flex:1;height:11px;background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4);min-width:44px}
.rk-bar u{display:block;height:100%;background:var(--gold);text-decoration:none}
.rk-d{flex:0 0 auto;font-size:22px;color:var(--dim);
  font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* 自己那一列標出來，但不放大——放大就變成「看我」。 */
.rk-r.mine .rk-i{color:var(--gold)}
.rk-r.mine b{color:var(--gold)}
.rk-r.mine .rk-bar u{background:var(--gold2)}
.rk-r.none{opacity:.5}
.rk-r.none .rk-d{flex:1;text-align:left}

/* 出口一直在。自主性優先於排名。 */
.rk-out{
  margin-top:14px;padding:5px 11px;font:inherit;font-size:22px;cursor:pointer;
  color:var(--dim);background:none;border:none;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)
}
.rk-out:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold-d)}

/* 一行標題，不是眉標加一句。 */
.rk-h{font-size:33px;margin:0 0 14px}

/* 自己那一列整條墊底色。本來只換文字顏色——在一排一樣的列裡認不出來，
   而「我在哪一列」是這張榜上唯一非看不可的事。 */
.rk-r.mine{
  background:rgba(233,179,65,.10);
  box-shadow:inset 3px 0 0 var(--gold);
  padding-left:9px;margin-left:-9px
}

/* 手機。

   之前這裡只有一條「.side{display:none}」——側欄在窄螢幕整個消失，
   而導覽全部在側欄裡。也就是說手機打開之後按不到任何一頁。
   那不是版面問題，那是功能不見了。

   做法不是另寫一套版面，是讓同一段 HTML 換一個排法：側欄從左邊那一條
   變成釘在底部的一列。兩邊的資訊、順序、狀態完全一樣，
   只有方向不同——這樣兩個平台不會各自長出自己的邏輯。 */

@media (max-width: 860px) {

  /* ---------- 導覽：左邊那一條變成底下那一列 ---------- */
  .side{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;
    width:auto;flex:none;height:auto;overflow:visible;
    flex-direction:row;
    border-right:none;
    box-shadow:0 -3px 0 rgba(0,0,0,.72), 0 -4px 0 rgba(255,240,214,.05)
  }
  .side-head{display:none}
  .nav{display:flex;flex-direction:row;padding:0;width:100%}
  .nav a{
    flex:1;min-width:0;flex-direction:column;justify-content:center;
    gap:5px;padding:11px 6px;font-size:22px;text-align:center;line-height:1.3;
    border-left:none;border-top:3px solid transparent
  }
  .nav a.on{border-top-color:var(--gold);background:var(--panel2)}
  .nav a .dot{width:8px;height:8px;flex:0 0 8px}

  /* 底下那一列會蓋住內容，把位置留出來 */
  /* 22px 的字貼螢幕邊要留 22px，不然每一行都像被切到。 */
  .wrap{padding:22px 22px 121px}
  .gate .gate-box{padding-bottom:0}

  /* ---------- 字級 ---------- */
  h1{font-size:33px}
  h2{font-size:22px}
  .lead{font-size:22px}
  .stamp-card h1{font-size:33px}
  .stamp-mark .px{width:44px}
  .big-num,.slider-read b{font-size:44px}
  .dash h1{font-size:33px}

  /* ---------- 按鈕：一顆一行，不要擠成兩個字一行 ---------- */
  .btn{font-size:22px;padding:14px 18px}
  .btn.big{font-size:22px;padding:16px 22px;width:100%}
  .row{gap:8px}
  .row .btn{flex:1 1 auto;min-width:132px}

  /* ---------- 輸入 ---------- */
  input,textarea,select{font-size:22px}
  .rn-row{flex-direction:column;align-items:stretch}
  .rn-row b{flex:none}
  .rn-row input{min-width:0;width:100%}
  .rn-row .btn{width:100%}

  /* ---------- 頂條與試用列 ---------- */
  .top{padding:11px 18px;gap:14px}
  .top .who{font-size:22px}
  .demo{padding:11px 18px;gap:14px}

  /* ---------- 四拍：兩個一排 ----------
     22px 的字四格排一列是 452px，手機只有 353px，所以本來是橫向捲的
     ——而捲出去的那兩拍等於不存在。折成兩排，四拍一眼看得完。 */
  .cyc{flex-wrap:wrap;gap:9px}
  .cy{flex:1 1 calc(50% - 22px);padding:9px 11px;justify-content:center}
  .cyd{display:none}

  /* ---------- 步驟條：兩個一排 ---------- */
  .step{min-width:calc(50% - 1px);border-right:1px solid var(--line)}
  .step i{font-size:22px}

  /* ---------- 廊道 ---------- */
  .scn,.scn-in{height:319px}
  .scn-hud{padding:9px 11px}
  .scn-hud em{font-size:22px}
  .scn-hud b{font-size:22px}
  .scn-hud .zn-note{display:none}
  .scn-cap{margin-top:0}

  /* ---------- 兩條尺 ---------- */
  .eb-r b{flex:0 0 33px}
  .eb{height:18px}

  /* ---------- 清單與標記 ---------- */
  .ac{font-size:22px;padding:11px 13px}

  /* ---------- 卡片與清單類 ---------- */
  /* 桌機是 22px。手機的字一樣大，沒有理由把內距收小——
     本來收成 14px 是字還 11px 的時候訂的。 */
  .card,.act-card{padding:22px}
  .gcard,.slot{width:100%}
  .zn{min-width:calc(50% - 6px)}
  .acc-c{padding:14px}
  .acc-c i{font-size:33px}

  /* ---------- 班級地下城 ---------- */
  .fa-in{gap:14px}
  .px.fa-px{width:66px;height:66px;flex:0 0 66px}
  .fa-in > div{min-width:0}
  .lg{gap:8px 14px}
}

/* 很窄的手機（400 以下）。

   本來這一段是「再收一階」：邊距收到 11px、分頁的左右內距收到 1px、
   h1 收到 22px。那三個都是字還 11px 的時候訂的——現在字一樣大，
   收下去只會更擠，而 h1 跟內文一樣大就等於沒有階層。

   窄螢幕該收的是「一排放幾個」，不是「留多少空氣」。 */
@media (max-width: 400px) {
  .wrap{padding:22px 18px 121px}
  .step{min-width:100%;border-right:1px solid var(--line)}
  .nav a{padding:11px 4px}
  .zn{min-width:100%}
}

/* 觸控：hover 不存在，所以「滑過去才看得到」的東西要一直看得到 */
@media (hover: none) {
  .xs-fauna{opacity:.6}
  .btn:hover{background-image:none}
}

/* 上面那一段只換了排法，沒有換 display——50-style.css 曾經在這個寬度
   把側欄整個藏起來。那條已經拿掉了，這裡再寫一次當保險：
   導覽在任何寬度都必須在。 */
@media (max-width: 860px) {
  .side{display:flex !important}
  /* 試用列在手機會排到三行，收成一行 */
  .demo{font-size:22px;flex-wrap:nowrap;overflow-x:auto}
  .demo select{max-width:132px}
}



/* ---------- 寬螢幕：整個螢幕都用上 ----------

   桌機本來跟手機是同一條窄欄，只是置中——一台 27 吋螢幕上，
   兩側各空一大片，而中間那條還在往下捲。

   做法不改 HTML：把 .wrap 變成會換行的排版，
   廊道與「今天要做的」佔滿一整列（它們本來就該大），
   其餘那幾張安靜的卡並排流下去。這樣同一份結構在兩種螢幕上
   讀起來一樣，只是攤開的方式不同。 */

/* ---------- 寬螢幕：整個螢幕都用上 ----------

   桌機本來跟手機是同一條窄欄，只是置中——一台 27 吋螢幕上，
   兩側各空一大片，而中間那條還在往下捲。

   做法不改 HTML：把 .wrap 變成會換行的排版。

   一個教訓寫在這裡：第一版是白名單制（只有列進去的元素給整列寬），
   結果後來每加一個新元素就少列一個，那幾個就縮成畫面上一小塊，
   看起來像整個版面壞掉。改成預設整列、只有指定的才並排——
   新加的東西不會再無聲地跑掉。 */

@media (min-width: 1200px) {
  .wrap{
    display:flex;flex-wrap:wrap;align-items:flex-start;
    gap:22px;align-content:flex-start
  }
  /* 預設整列。任何新加的東西都吃這一條。 */
  .wrap > *{flex:0 0 100%;margin-bottom:0;min-width:0}

  /* 只有安靜的卡並排。420 是一張卡讀起來還舒服的最小寬度。 */
  .wrap > .card.quiet{flex:1 1 420px}
  .wrap > .row{margin:0}
  .wrap > .btn{flex:0 0 auto}

  /* 廊道與地圖越寬越好——那是它們本來就想要的 */
  .scn{height:462px}
  .scn-in{height:462px}
}

@media (min-width: 1700px) {
  .wrap{max-width:1760px}
  .wrap > .card.quiet{flex:1 1 480px}
}

/* ── 要做的那一件事，釘在畫面下面 ──
   地圖變成首頁之後它本來被推到整頁最底下，那樣就得先捲過整張圖才按得到。
   看地圖跟動手不是先後關係——PaGamO 打開來就能動手。 */
/* 要做的那一件事。接在廊道下面，不再釘在畫面底部——
   釘住是為了解決「動作在摺線以下」，而它現在就在廊道下面。
   一個釘在底部的東西擺在別的內容上面，只會蓋住它們。 */
.dock{
  margin:0 0 22px;background:var(--bg);
  box-shadow:inset 0 3px 0 rgba(255,240,214,.10)
}
.dock .tline{margin:0}
.dock .act-card{margin:0}

   跟著你變深而改變——那一趟盡頭擋路的那一隻不該在事後被換掉。 */
function mobFor(msId, teamId, depth) {
  var d = depth == null ? depthOf(teamId) : depth;
  var f = faunaOf(strataAt(d, teamId).key);
  if (!f.length) f = allFauna();
  return f[hash(msId + '|' + teamId) % f.length];
}

/* ===== 15-auth.js ===== */
/* 帳號、登入、身分認領，以及研究紀錄的事件流。

   三種角色：
     student    學生。用加入碼註冊，然後從名冊裡認領自己是誰。
     teacher    老師。研究者建的。
     researcher 研究者。管帳號、看紀錄、匯出。

   密碼：這一版存在瀏覽器裡，所以雜湊只是「不要用明碼躺在 localStorage」，
   不是真的安全措施。真的上線要換成後端 ＋ bcrypt——這件事寫在這裡，
   免得有人以為它已經安全了。 */

var AUTH_NOTE = '這一版的密碼雜湊只擋肉眼，不是真的加密。上線前要換成後端驗證。';

/* 加鹽的字串雜湊。同一組帳密永遠得到同一個值。 */
function pwHash(pw, salt) {
  var s = String(salt) + '|' + String(pw);
  var h1 = 2166136261, h2 = 5381;
  for (var i = 0; i < s.length; i++) {
    h1 ^= s.charCodeAt(i); h1 = (h1 * 16777619) >>> 0;
    h2 = ((h2 * 33) ^ s.charCodeAt(i)) >>> 0;
  }
  return h1.toString(36) + h2.toString(36);
}

function newSalt() {
  return Math.floor(Math.random() * 2176782336).toString(36) + now().toString(36);
}

/* ---------- 事件流（研究紀錄） ----------
   每一個會改到資料的動作都記一筆。這就是研究資料本身：
   誰、在哪一個任務上、做了什麼、什麼時候。

   刻意不記「內容」——系統本來就不收作業。記的是行為的形狀：
   承諾幾天、推進的節奏、判定結果、卡在哪。 */
function logEvent(kind, o) {
  if (!DB || !DB.Events) return;
  /* 登入與註冊那兩筆是在還沒有 S.who 的時候記的，所以要讓呼叫端
     自己帶 by 進來——不然研究資料裡最重要的兩個動作會沒有角色。 */
  var u = (typeof S !== 'undefined' && S.who) ? userOf(S.who) : null;
  if (!u && o && o.by) u = userOf(o.by);
  DB.Events.push(Object.assign({
    evId: nid('E'),
    at: now(),
    by: u ? u.userId : (o && o.by) || '',
    role: u ? u.role : '',
    kind: kind
  }, o || {}));
  /* 事件只增不刪。原型跑久了會長，但它就是資料本身。 */
}

function eventsOf(classId, filter) {
  var teamIds = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) { teamIds[t.teamId] = t.name; });
  return DB.Events.filter(function (e) {
    if (e.teamId && !teamIds[e.teamId]) return false;
    if (filter && filter.kind && e.kind !== filter.kind) return false;
    if (filter && filter.teamId && e.teamId !== filter.teamId) return false;
    return true;
  }).slice().reverse();
}

/* 事件的中文說法。同一份資料，人看得懂的那一面。 */
var EV_SAY = {
  register: function (e) { return '註冊了帳號 ' + e.account; },
  claim:    function (e) { return '認領身分：' + e.who + '（' + e.team + '）'; },
  login:    function () { return '登入'; },
  publish:  function (e) { return '派了任務「' + e.title + '」'; },
  commit:   function (e) { return '承諾 ' + e.est + ' 天' + (e.flags ? '，標了「' + e.flags + '」' : ''); },
  push:     function (e) { return '第 ' + e.n + ' 天' + (e.seg ? '：' + e.seg : '') + (e.back ? '（補登）' : ''); },
  submit:   function (e) { return '交出去：承諾 ' + e.est + ' 天，實際 ' + e.actual + ' 天 → ' + e.stamp; },
  reflect:  function (e) { return '說「' + (e.overs || '（沒有）') + '」比想的久'; },
  approve:  function () { return '勾了可以'; },
  keep:     function (e) { return '留下了「' + e.keep + '」那一張'; },
  tick:     function (e) { return (e.on ? '勾掉' : '取消勾掉') + '「' + e.step + '」'; },
  askexit:  function () { return '說專案做完了'; },
  left:     function () { return '走出去了'; },
  rename:   function (e) { return '把招牌改成「' + e.name + '」'; }
};
function evSay(e) {
  var f = EV_SAY[e.kind];
  return f ? f(e) : e.kind;
}

/* ---------- 註冊 ---------- */

function accountTaken(account) {
  return !!find('Users', function (u) {
    return String(u.account).toLowerCase() === String(account).toLowerCase();
  });
}

function classByCode(code) {
  return find('Classes', function (c) {
    return String(c.joinCode).toUpperCase() === String(code || '').toUpperCase();
  });
}

/* 學生註冊：加入碼 → 帳號密碼。註冊完還沒有身分，要再認領。 */
function actRegister(o) {
  var acc = String(o.account || '').trim();
  var pw = String(o.password || '');
  if (acc.length < 3) return { err: '帳號至少三個字。' };
  if (pw.length < 4) return { err: '密碼至少四個字。' };
  if (accountTaken(acc)) return { err: '這個帳號有人用了。' };

  var kl = null;
  if (o.role !== 'researcher') {
    kl = classByCode(o.code);
    if (!kl) return { err: '找不到這個加入碼。跟老師確認一次。' };
  }

  var salt = newSalt();
  var u = {
    userId: nid('U'), account: acc, salt: salt, hash: pwHash(pw, salt),
    role: o.role || 'student',
    name: String(o.name || acc).trim(),
    classId: kl ? kl.classId : '',
    teamId: '',
    createdAt: now()
  };
  DB.Users.push(u);
  save();
  logEvent('register', { by: u.userId, account: acc, role: u.role });
  return { user: u };
}

/* ---------- 登入 ---------- */
function actLogin(account, pw) {
  var u = find('Users', function (x) {
    return String(x.account).toLowerCase() === String(account || '').trim().toLowerCase();
  });
  if (!u) return { err: '找不到這個帳號。' };
  if (!u.salt) return { err: '這個帳號還沒設定密碼，請研究者重設一次。' };
  if (pwHash(pw, u.salt) !== u.hash) return { err: '密碼不對。' };
  u.lastLogin = now();
  save();
  logEvent('login', { by: u.userId });
  return { user: u };
}

/* ---------- 名冊與身分認領 ----------
   老師先把名冊貼進來（一行一組），學生註冊之後從裡面挑自己是誰。
   這樣系統知道「這個帳號是哪一組的誰」，而且不用學生自己打組名。 */

/* 「甲：小明, 小華」一行一組 */
function parseRoster(text) {
  var out = [];
  String(text || '').split('\n').forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var i = line.search(/[:：]/);
    if (i < 0) return;
    var team = line.slice(0, i).trim();
    var members = line.slice(i + 1).split(/[,，、]/)
      .map(function (x) { return x.trim(); }).filter(Boolean);
    if (team && members.length) out.push({ team: team, members: members });
  });
  return out;
}

/* 存名冊。已經存在的組不重建，才不會把認領過的身分洗掉。 */
function actSaveRoster(classId, text) {
  var rows = parseRoster(text);
  if (!rows.length) return { err: '看不懂這份名冊。一行一組，像「甲：小明, 小華」。' };
  var added = 0;
  rows.forEach(function (r) {
    var name = '第' + (where('Teams', function (t) {
      return t.classId === classId;
    }).length + 1) + '組 · ' + r.team;
    var exist = find('Teams', function (t) {
      return t.classId === classId && t.name.indexOf('· ' + r.team) >= 0;
    });
    var team = exist;
    if (!team) {
      team = {
        teamId: nid('G'), classId: classId, name: name,
        project: '（還沒定）', signTier: 0, joinedAt: now()
      };
      DB.Teams.push(team);
    }
    r.members.forEach(function (m) {
      if (find('Roster', function (x) {
        return x.classId === classId && x.teamId === team.teamId && x.memberName === m;
      })) return;
      DB.Roster.push({
        rosterId: nid('R'), classId: classId, teamId: team.teamId,
        teamName: team.name, memberName: m, claimedBy: ''
      });
      added++;
    });
  });
  save();
  return { added: added };
}

/* 一個班還沒被認領的名字 */
function freeRoster(classId) {
  return where('Roster', function (r) { return r.classId === classId && !r.claimedBy; });
}

/* 認領：把帳號綁到名冊上的某一個人 */
function actClaim(userId, rosterId) {
  var u = userOf(userId);
  var r = find('Roster', function (x) { return x.rosterId === rosterId; });
  if (!u || !r) return { err: '找不到。' };
  if (r.claimedBy) return { err: '這個名字已經有人認領了。' };
  r.claimedBy = u.userId;
  r.claimedAt = now();
  u.teamId = r.teamId;
  u.name = r.memberName;
  save();
  logEvent('claim', { by: u.userId, teamId: r.teamId, who: r.memberName, team: r.teamName });
  return { user: u };
}

/* 認錯人了：研究者解開，學生可以重認 */
function actUnclaim(rosterId) {
  var r = find('Roster', function (x) { return x.rosterId === rosterId; });
  if (!r || !r.claimedBy) return { err: '這個名字沒有人認領。' };
  var u = userOf(r.claimedBy);
  if (u) { u.teamId = ''; }
  r.claimedBy = ''; r.claimedAt = 0;
  save();
  return { ok: true };
}

/* ---------- 研究者的帳號處理 ---------- */

function actResetPw(userId, pw) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個帳號。' };
  if (String(pw).length < 4) return { err: '密碼至少四個字。' };
  u.salt = newSalt();
  u.hash = pwHash(pw, u.salt);
  save();
  return { ok: true };
}

function actDeleteUser(userId) {
  var u = userOf(userId);
  if (!u) return { err: '找不到這個帳號。' };
  if (u.role === 'researcher' &&
      where('Users', function (x) { return x.role === 'researcher'; }).length <= 1) {
    return { err: '這是最後一個研究者帳號，刪掉就沒有人管得了系統。' };
  }
  /* 認領過的名字要放回去，不然那個位子永遠卡著 */
  where('Roster', function (r) { return r.claimedBy === userId; })
    .forEach(function (r) { r.claimedBy = ''; r.claimedAt = 0; });
  DB.Users = DB.Users.filter(function (x) { return x.userId !== userId; });
  save();
  return { ok: true };
}

function actCreateClass(name, teacherId) {
  var code = '';
  var CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   /* 去掉會看錯的 I O 0 1 */
  for (var i = 0; i < 6; i++) code += CH[Math.floor(Math.random() * CH.length)];
  var c = {
    classId: nid('C'), name: String(name || '未命名的班').trim(),
    joinCode: code, teacherId: teacherId || '', startedAt: now()
  };
  DB.Classes.push(c);
  save();
  return { klass: c };
}

/* ---------- 匯出 ----------
   研究資料。CSV，因為那是最容易進統計軟體的東西。 */
function exportCsv(classId) {
  var teamName = {}, teamTea = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) {
      teamName[t.teamId] = t.name;
      /* 哪一位老師帶的。實驗是一個課程三位老師，那三位就是變項——
         沒有這一欄，匯出的資料沒辦法照老師分組。 */
      var te = t.mentorId ? userOf(t.mentorId) : null;
      teamTea[t.teamId] = te ? te.name : '';
    });
  var head = ['時間', '角色', '組別', '指導老師', '事件', '說明'];
  var rows = eventsOf(classId).map(function (e) {
    return [
      new Date(e.at).toISOString(),
      e.role || '',
      teamName[e.teamId] || '',
      teamTea[e.teamId] || '',
      e.kind,
      evSay(e)
    ];
  });
  return [head].concat(rows).map(function (r) {
    return r.map(function (c) {
      var s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
}

/* ---------- 地底下本來就埋著東西 ----------

   兩個洞，同一個修法。

   洞一 · 「打通哪一格」是空的。
          44-dig.js 的註解自己寫著「選方向不影響任何判定」——
          這個系統裡最像遊戲的那個選擇，裡面沒有東西。
          PaGamO 的每一格是一題，這裡的每一格打通就只是變色。
          低頻的系統不可能靠次數贏（一學期八趟），只能靠每一次都很重。

   洞二 · 準跟失準拿到的東西一模一樣。
          一個判定、一根岩心、一格地、一座建築，兩邊都拿到。
          所以唯一有阻力的選擇（估幾天）沒有後果，判定是化妝品。
          這是勝任感那一根最大的洞：做得準沒有任何事情不一樣。

   修法：地底下埋著東西，而且你遇到什麼跟你到得早不早有關。

   要非常小心的一條線——差別只能在「遇到什麼」，不能在「拿到多少」。
   失準的人一樣拿到那一格、那座建築、那根岩心、那一筆圖鑑。
   差的是：準的時候你到得夠早，牠還在；失準的時候牠已經走了，
   你看到的是牠留下的痕跡。兩邊都是一則紀錄，沒有人被扣任何東西。

   一旦變成「準的拿比較多」，這個作品就從自發變成受控，
   而且「失準不扣任何東西」那條前提會當場垮掉。

   埋的東西是用班級與座標算出來的，不是擲骰子——同一個班的同一格
   永遠是同一樣東西。會亂跳的話那就不是一片地，是特效。 */

/* 留下記號的時候敲開岩壁，五次裡大概兩次會敲到東西。

   本來是 14%，因為那時候是一格一擲、一張地圖上上百格，太密就不值錢。
   現在一趟才擲一次，一學期八趟——14% 等於整學期遇到一次，
   那個機制等於不存在。 */
var BURIED_ODDS = 40;

var BURIED = [
  { k: 'mob',    n: '還在睡的東西',
    here: '牠還在這裡，被你走到這裡的動靜吵醒。',
    late: '牠已經走了。留下一層蛻下來的殼。' },
  /* 「上一輪的遺跡」與「牆上刻的字」拿掉了。
     那兩樣挖出來的是別組某一趟的名字與天數，而每一組的專案不一樣
     ——別人「六天」對你不構成任何參考，它只是看起來像內容。

     「空腔：什麼都沒有」也拿掉了。一學期大概敲到三次的東西，
     不能有一次是空的。 */
  { k: 'spring', n: '地下水',
    here: '一道還在流的水。',
    late: '一道乾掉的水痕。' }
];

function buriedDef(k) {
  var out = null;
  BURIED.forEach(function (b) { if (b.k === k) out = b; });
  return out;
}

/* 這一層的岩壁裡有什麼。用班級、組別與深度算，
   同一組走到同一層永遠遇到同一樣東西。

   為什麼要帶組別：每一組走的是自己那一條廊道，
   同一層的岩壁不是同一面牆。 */
function buriedAt(classId, teamId, depth) {
  var h = hash('buried|' + classId + '|' + teamId + '|' + depth);
  if (h % 100 >= BURIED_ODDS) return null;
  return BURIED[(h >>> 9) % BURIED.length];
}

/* 走到那一層的時候，把岩壁裡的東西記下來。

   early 是「你到得夠早」：那一趟的判定是準的。
   它只改變你遇到的是牠本人還是牠留下的痕跡——
   那一層、那座建築、那根岩心、那一筆圖鑑，兩邊都拿到。 */
function actUncover(teamId, depth) {
  var t = teamOf(teamId);
  if (!t) return null;
  var b = buriedAt(t.classId, teamId, depth);
  if (!b) return null;
  var k = 'd' + depth;
  t.found = t.found || {};
  if (t.found[k]) return t.found[k];

  var last = null;
  runsFor(teamId).forEach(function (r) { if (r.run.stamp) last = r.run; });
  var early = !last || last.stamp !== 'late';

  var rec = { k: b.k, early: early ? 1 : 0 };

  /* 蟄伏的東西：那一層住的那幾隻裡的一隻。進圖鑑，標「你遇過」。 */
  if (b.k === 'mob') {
    var f = faunaOf(strataAt(depth, teamId).key);
    if (!f.length) f = allFauna();
    if (f.length) rec.mob = f[hash('bmob|' + teamId + '|' + k) % f.length].n;
  }


  t.found[k] = rec;
  save();
  return rec;
}

/* 這一組在岩壁裡遇過的那幾隻。圖鑑那邊要用。 */
function foundMobs(teamId) {
  var t = teamOf(teamId);
  var out = {};
  Object.keys((t && t.found) || {}).forEach(function (k) {
    var r = t.found[k];
    if (r.mob) out[r.mob] = r.early ? '牠還在' : '只剩痕跡';
  });
  return out;
}

/* ===== 20-rules.js ===== */
/* 全部的計算都在這裡，而且只在這裡。

   一個概念一個來源。文案跟規則綁在一起——講規則的句子不是寫死的字串，
   是從下面的數字組出來的。改 BAND 的值，畫面上那句話會跟著變，
   不會變成一句謊話。

   這個系統跟成績無關。它不判斷作業好不好，只判斷「你對自己的預估準不準」。
   那是刻意的：拖延的根不是懶，是對「這件事要花多久」沒有體感。 */

var RULES = {

  /* ---------- 自我承諾 ---------- */
  EST_MIN: 1,          /* 滑桿最少 1 天 */
  EST_MAX: 21,         /* 最多三週。再長就不是一個里程碑了 */
  EST_DEFAULT: 5,

  /* ---------- 判定 ---------- */
  /* 容許誤差＝預估天數的兩成，最少 1 天。
     estimate 5 天 → ±1 天算準；estimate 14 天 → ±3 天算準。
     用比例而不是固定值，因為估 3 天差 2 天跟估 20 天差 2 天不是同一回事。 */
  BAND_RATIO: 0.2,
  BAND_MIN: 1,

  /* ---------- 推進 ---------- */
  PUSH_PER_DAY: 1,     /* 一天一次。多按沒有用，這不是點擊遊戲 */
  STALL_DAYS: 2,       /* 幾天沒推進就開始長藤蔓 */
  SLEEP_DAYS: 4,       /* 幾天沒推進角色會睡著 */
  /* 補登補得回幾天前。兩天：忘一次補得回來，忘一週補不回來——
     再往上加就變成「最後一天一次補完」，那條走廊就不再是紀錄了。
     補登不會改判定：實際天數是承諾那天到交出去那天算的。 */
  BACKFILL_MAX: 2,

  /* ---------- 招牌 ---------- */
  /* 只剩一種材質。三階那個「越深牌子越好」的漸層拿掉了——
     深度已經不是進度，留著它跟其他每一條規則都打架。 */
  SIGN_TIERS: ['iron'],

  /* 這個系統沒有的東西寫在 check.js 的 BANNED 裡，不寫在這裡——
     寫在這裡等於把那些詞放進畫面，檢查器會抓（而且抓得對）。 */
  _: null
};

function clamp(lo, hi, n) { return Math.max(lo, Math.min(hi, n)); }

/* 容許誤差：估幾天，準的範圍就有多寬 */
RULES.band = function (est) {
  return Math.max(RULES.BAND_MIN, Math.round((Number(est) || 0) * RULES.BAND_RATIO));
};

/* ---------- 三種印章 ----------
   系統唯一會說的一句話，而且它只比對兩個數字：你說幾天、實際幾天。

   底下那一句刻意只講發生了什麼，不講為什麼。原本寫的是
   「你把它想得比實際難」——那是我在猜。提早也可能是題目本來就小、
   也可能是他們砍了範圍，系統一個都不知道。 */
RULES.STAMPS = {
  early: { key: 'early', name: '比承諾的早',
           why: '比你自己說的天數早。' },
  exact: { key: 'exact', name: '跟承諾的一樣',
           why: '你說幾天，就是幾天。' },
  late:  { key: 'late',  name: '比承諾的久',
           why: '比你自己說的天數久。這不會拿走任何權利。' }
};

/* 判定：拿實際花的天數比對當初承諾的 */
RULES.judge = function (est, actual) {
  var e = Number(est) || 0, a = Number(actual) || 0, b = RULES.band(e);
  if (a < e - b) return RULES.STAMPS.early;
  if (a > e + b) return RULES.STAMPS.late;
  return RULES.STAMPS.exact;
};

/* 判定的說明句。從數字組出來，所以改 BAND_RATIO 這句話會跟著變。 */
RULES.judgeWhy = function (est, actual) {
  var b = RULES.band(est);
  return '你承諾 ' + est + ' 天，實際花了 ' + actual + ' 天。' +
         '誤差 ' + b + ' 天以內算準（預估的 ' + Math.round(RULES.BAND_RATIO * 100) + '％）。';
};

   兩份都拿掉了，因為那等於我先替他們定義了「一個專案會做的事」與
   「一個專案會出的錯」。設計系的一天可能是打樣、拍照、找廠商，
