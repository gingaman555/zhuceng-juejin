/* ---------- 老師看到的：同一張圖，底下多一段細節 ---------- */
PAGES.classeco = function () {
  var u = me();
  var rows = ecoRows(u.classId);
  var H = [head('各組進度', '每一組走到哪',
    '走完幾趟、現在這一趟有多大、每天動的是哪一段。' +
    '估得準不準在審核那一頁——那時候你看的是一組人交的一件東西。')];
  H.push(xsScene(rows, null, u.classId));
  H.push(faunaCard());

  rows.forEach(function (r) {
    var t = teamOf(r.teamId);
    var sg = signOf(r.teamId);
    var all = runsFor(r.teamId);
    var cur = all.filter(function (x) { return x.run.state === 'running'; })[0];
    var wait = all.filter(function (x) { return x.run.state === 'submitted'; })[0];
    var camp = all.filter(function (x) { return x.run.state === 'judged'; })[0];
    var offer = all.filter(function (x) { return x.run.state === 'approved'; })[0];

    H.push('<div class="card tm">');
    H.push('<div class="radar-head">');
    H.push(pxTag(sg.px, sg.pal, 'sign-s'));
    H.push('<b>' + esc(t.name) + '</b>');
    H.push('<span class="dim">' + esc(t.project || '（還沒定）') + '</span>');
    H.push('<span class="sp"></span>');
    H.push('<span class="dim">' + esc(strataAt(r.depth, r.teamId).name) + '　·　深度 ' +
      (r.depth * WORLD.depthPerMilestone) + ' m　·　走完 ' + r.depth + ' 趟</span>');
    H.push('</div>');

    if (wait) {
      H.push('<p class="lead">在等你看：' + esc(wait.ms.title) + '</p>');
      H.push(btn('去勾', 'go:review:' + wait.run.runId, ''));
    } else if (offer) {
      H.push('<p class="dim">你勾過了，他們還沒挑裝備：' + esc(offer.ms.title) + '</p>');
    } else if (camp) {
      H.push('<p class="dim">交了，正在營火旁說卡在哪：' + esc(camp.ms.title) + '</p>');
    } else if (cur) {
      var run = cur.run;
      H.push('<p class="lead">正在走：' + esc(cur.ms.title) + '</p>');
      /* 量，不是好壞：這一趟有多大、走到哪、每天動的是哪一段。
         準度與判定不放在這一頁——這裡是「誰在哪」，
         「跑得如何」屬於審核，那時候他看的是一組人交的一件東西。 */
      H.push('<div class="log-num">這一趟 <b>' + run.est + '</b> 天　·　' +
        '來過 <b>' + run.pushes + '</b> 天</div>');
      H.push(dayStrip(r.teamId, run.runId));
    } else {
      H.push('<p class="dim">手上沒有里程碑。派一個給他們就會開始。</p>');
    }
    H.push('</div>');
  });
  return H.join('');
};


/* ===== 63-pack.js ===== */
/* 岩心架。

   走完一趟會長出一根岩心（見 43-core.js）。這一頁是它們排在一起的地方。

   這一頁前後改過三次，方向差很多：老師發裝備 → 隨機三件挑一件 →
   三張事實挑一張 → 現在。前三次都失敗在同一件事上——那個「東西」是我
   發的，跟他那一週沒有關係，所以挑不挑、留哪一件，對他都沒有差別。

   為什麼收集這件事現在站得住——它不是徽章，是樣本：

     · 每一根指向一個具體、不會再發生的那一週
     · 形狀由那一趟自己決定，沒有兩根一樣，而且那個不同是他造成的
     · 不可能再拿到同一根
     · 二十根排在一起會變成一根說不出來的東西：一個學期的形狀

   刻意沒有的東西：總數、進度、缺哪幾根。
   一趟長一根，本來就不會有缺的——沒有東西需要被填滿，
   所以也沒有人會為了填滿它多做一件事。

   遊戲化在這裡的位置是「吸引他打開」，不是「換到好處」。
   一根岩心不加速、不擋失準、不換任何東西。 */

PAGES.pack = function () {
  var t = myTeam();
  var ks = keepsOf(t.teamId).slice().reverse();

  var H = [head('岩心架', ks.length + ' 根', '')];

  if (!ks.length) {
    H.push('<div class="card dim">走完一趟、老師勾了可以之後，' +
      '那一趟會長成一根岩心。形狀由那一趟自己決定。</div>');
    H.push(btn('回廊道', 'go:home', 'ghost'));
    return H.join('');
  }

  /* 圖例。看得懂才讀得出自己的歷史。 */
  H.push('<div class="card quiet">');
  H.push('<div class="eyebrow">怎麼讀</div>');
  H.push('<div class="corekey">');
  H.push('<span><b class="c1"></b>那一天你來過</span>');
  H.push('<span><b class="c2"></b>你說那天沒動</span>');
  H.push('<span><b class="c3"></b>那一天沒有紀錄</span>');
  H.push('</div>');
  H.push('<p class="dim">長度就是那一趟過了幾天。顏色是你當時在哪一層。</p>');
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="rack">');
  ks.forEach(function (k) {
    var z = STRATA[0];
    STRATA.forEach(function (x) { if (x.key === k.zone) z = x; });
    var r = find('Runs', function (x) { return x.runId === k.runId; });
    var m = r ? msOf(r.msId) : null;
    H.push('<div class="rk">');
    H.push(pxTag(k.px || coreOf(k.runId), z.pal, 'core'));
    H.push('<b>' + esc(k.name || (m ? m.title : '')) + '</b>');
    H.push('<span>' + (k.elapsed || 0) + ' 天　·　來過 ' + (k.moved || 0) + '</span>');
    H.push('<em>' + esc(z.name) + '</em>');
    H.push('</div>');
  });
  H.push('</div></div>');

  H.push(btn('回廊道', 'go:home', 'ghost'));
  return H.join('');
};


/* ===== 64-codex.js ===== */
/* 圖鑑。

   這個字曾經被 check.js 擋著，因為上一個作品（地心圖鑑）的圖鑑是一條
   收集進度條：收集了 12／40，收滿有東西。那種圖鑑會把「做更多任務」
   變成「填更多格子」，也就是把外在誘因裝回來。

   這一份不是那種。差別只有一條，但那一條就是全部：

     全部看得到。沒有鎖、沒有問號、沒有「收集了幾件」。

   它記的是「你遇過牠」——那是一段回憶，不是一個分數。沒遇過的那幾隻
   一樣看得到長什麼樣、住在哪一層、是什麼東西。所以它不會讓任何人
   為了填滿它而多做一件事，它只是這座地下城的說明：下面住著這些。 */

PAGES.codex = function () {
  var t = myTeam();
  var met = metMobs(t.teamId);
  var here = strataAt(depthOf(t.teamId), t.teamId);

  var H = [head('圖鑑', '這座地下城裡有什麼',
    '這座地下城裡住的東西，全部在這裡。標「你遇過」的那幾隻是回憶。')];

  /* ---- 生物 ---- */
  STRATA.forEach(function (z) {
    var list = faunaOf(z.key);
    if (!list.length) return;
    H.push('<div class="card fa ' + z.key + '">');
    H.push('<div class="cx-head">');
    H.push('<div><div class="eyebrow">' + (z.key === here.key ? '你現在在這一層' : '地層') + '</div>');
    H.push('<h2>' + esc(z.name) + '</h2>');
    H.push('<p class="dim">' + esc(z.note) + '</p></div>');
    H.push('</div>');
    H.push('<div class="cx">');
    list.forEach(function (c) {
      H.push('<div class="cxi' + (met[c.n] ? ' met' : '') + '">');
      H.push(pxTag(c.px, z.pal, 'cx-px'));
      H.push('<div><b>' + esc(c.n) + '</b>');
      H.push('<em>' + esc(c.t) + '</em>');
      if (met[c.n]) H.push('<span class="cx-met">你在「' + esc(met[c.n]) + '」那一趟遇過</span>');
      H.push('</div></div>');
    });
    H.push('</div></div>');
  });

  /* ---- 帶得走的 ----
     只有一種，而且它不是我發的：那一趟自己長出來的岩心。 */
  var mine = keepsOf(t.teamId);
  H.push('<div class="card">');
  H.push('<div class="eyebrow">帶得走的</div>');
  H.push('<div class="cx">');
  H.push('<div class="cxi' + (mine.length ? ' met' : '') + '">');
  H.push(pxTag(mine.length ? (mine[mine.length - 1].px || coreOf(mine[mine.length - 1].runId))
    : coreOf('none') || ['..++++++++++..', '.+##########+.', '.+#*######*#+.',
      '.+##########+.', '.+#+......+#+.', '.+#+......+#+.',
      '.+#..+..+..#+.', '.+..+..+..+..', '.+##########+.', '..++++++++++..'],
    here.pal, 'cx-px core'));
  H.push('<div><b>岩心</b>');
  H.push('<em>走完一趟、老師勾了可以之後，那一趟自己長成的一根樣本。' +
         '一天兩列：來過是實心、你說沒動是空心、沒有紀錄是斷的。' +
         '長度就是那一趟過了幾天，顏色是你當時在哪一層。</em>');
  if (mine.length) H.push('<span class="cx-met">你已經封存了 ' + mine.length + ' 根</span>');
  H.push('</div></div>');
  H.push('</div></div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">地上的東西</div>');
  H.push('<p class="dim">每一層長的不一樣——' +
         '那是你怎麼知道自己換了地方。</p>');
  H.push('<div class="cx">');
  [['碎石', RUBBLE.px, '打通的時候崩下來的。'],
   ['水晶', CRYSTAL.px, '自己會微微發亮，所以最暗的時候還看得到一點東西。'],
   ['蕈菇', SHROOM.px, '走通的地方才長得出來。'],
   ['鐵件', BOLT.px, '有人來過。鏽住了，轉不動。'],
   ['餘燼', EMBER.px, '地上還有東西在燒。'],
   ['火把', TORCH.frames[0], '你來過的每一天，牆上多一盞。']
  ].forEach(function (p) {
    H.push('<div class="cxi met">');
    H.push(pxTag(p[1], here.pal, 'cx-px'));
    H.push('<div><b>' + esc(p[0]) + '</b><em>' + esc(p[2]) + '</em></div>');
    H.push('</div>');
  });
  H.push('</div></div>');

  H.push(btn('回廊道', 'go:home', 'ghost'));
  return H.join('');
};


/* ===== 70-teacher.js ===== */
/* 老師端。

   他只做三件事，側欄就只有三格：

     發里程碑   要他們交什麼
     審核       他們交了，你看完勾一個「可以」
     各組進度   誰在哪、誰慢下來了

   他不決定期限（那是學生拉滑桿承諾的），不打分，也不挑裝備——
   勾完可以之後，學生自己從三件裡挑一件。少一件他要煩惱的事，
   就少一次「老師替我決定」的機會。 */

/* 老師走到哪一步了。有人等你看就是第三步，其餘看班上有沒有人在走。 */
function teacherStep(classId) {
  if (radar(classId).length) return 2;
  var running = where('Runs', function (r) { return r.state === 'running'; }).length;
  if (running) return 1;
  return 0;
}

/* 他們自己標的、他們自己說的。用的是老師分段時寫的詞，不是我列的選項。 */
function overTags(teamId, run) {
  var fl = (run.flags || []).map(function (i) { return stepName(run.runId, i); }).filter(Boolean);
  var ov = (run.overs || []).map(function (i) { return stepName(run.runId, i); }).filter(Boolean);
  if (!fl.length && !ov.length) return '';
  var H = ['<div class="tags small">'];
  if (fl.length) {
    H.push('<span class="k">承諾時標的</span>');
    fl.forEach(function (l) { H.push('<span class="tag static">' + esc(l) + '</span>'); });
  }
  if (ov.length) {
    H.push('<span class="k">後來說比想的久</span>');
    ov.forEach(function (l) { H.push('<span class="tag static hit">' + esc(l) + '</span>'); });
  }
  H.push('</div>');
  return H.join('');
}

/* 他們勾了哪幾段。老師自己分的，所以他讀得懂。 */
function stepTags(run) {
  var s = stepsOf(run.runId);
  if (!s) return '';
  var H = ['<div class="tags small"><span class="k">分段</span>'];
  s.all.forEach(function (x, i) {
    H.push('<span class="tag static' + (s.on.indexOf(i) >= 0 ? ' hit' : '') + '">' +
      esc(x) + '</span>');
  });
  H.push('</div>');
  return H.join('');
}

  });
  if (r.err) return say(r.err);
  /* 老師要跟班綁在一起，不然他打開來看不到任何一組 */
  if (role === 'teacher' && kl && !kl.teacherId) { kl.teacherId = r.user.userId; save(); }
  say((role === 'teacher' ? '老師' : '研究者') + '帳號好了。請他用這個密碼登入之後自己換掉。');
};

ACTS.respw = function (userId) {
  var pw = (document.getElementById('nu-pw') || {}).value || '';
  if (!pw.trim()) return say('先在上面那格「先給一個密碼」寫一個新的，再按重設。');
  var r = actResetPw(userId, pw.trim());
  if (r.err) return say(r.err);
  say(userOf(userId).name + ' 的密碼換成你寫的那一個了。');
};

ACTS.deluser = function (userId) {
  if (DRAFT.del !== userId) {
    DRAFT.del = userId;
    return say('再按一次「刪除」就真的刪掉 ' + userOf(userId).name + ' 的帳號。');
  }
  var name = userOf(userId).name;
  var r = actDeleteUser(userId);
  DRAFT.del = null;
  if (r.err) return say(r.err);
  if (userId === S.who) return ACTS.logout();
  render();
  say(name + ' 的帳號刪掉了。他認領過的名字放回名冊上了。');
};

ACTS.saveroster = function () {
  var v = (document.getElementById('rt') || {}).value || '';
  var r = actSaveRoster(rsClassId(), v);
  if (r.err) { DRAFT.rt = v; return say(r.err); }
  DRAFT.rt = '';
  render();
  say('存好了，補上 ' + r.added + ' 個名字。');
};

ACTS.unclaim = function (rosterId) {
  var r = actUnclaim(rosterId);
  if (r.err) return say(r.err);
  render();
  say('解開了。那個人重新登入之後可以再點一次。');
};

ACTS.csv = function () {
  var name = '專案地下城-紀錄.csv';
  try {
    /* BOM，不然 Excel 開起來中文是亂碼 */
    var blob = new Blob(['﻿' + exportCsv(rsClassId())], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('存成 ' + name + ' 了。');
  } catch (e) {
    say('這個瀏覽器不給存檔。上面那格的字全選複製也一樣。');
  }
};


/* ===== 80-app.js ===== */
/* 開機。 */

(function () {
  /* 資料結構換過就重種一次，不要拿舊的撐新的畫面。
     Events 是後來才加的表——舊的存檔沒有它，畫面一讀就會炸。 */
  if (!load() || !DB.Milestones || !DB.Runs || !DB.Events || !DB.Keeps) seed();

  /* 上次登入的人還記得。關掉分頁再打開不用重登。 */
  var u = DB.Session ? userOf(DB.Session) : null;
  if (u) { S.who = u.userId; S.page = homeFor(u); }
  else { S.who = null; S.page = 'gate'; }
  render();
})();

</script>
