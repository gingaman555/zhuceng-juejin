/* ---------- 封存 ----------

   走完一趟，那一趟的紀錄長成一根石片。形狀完全由那一趟決定：
   一天兩列，來過是實心、說了沒動是空心、沒有紀錄是斷的，
   長度就是這一趟過了幾天。

   這一頁真正給他的東西是「他沒見過的那個形狀」——同一份數字，
   換成一個看得到的樣子。取名選填，他不取一樣封存得下來。 */
PAGES.pick = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var m = msOf(r.msId);
  /* 剛走完的那一層。 */
  var z = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var s = runShape(r.runId);

  var H = [head('封存', m.title, '這一趟長成這個樣子。')];

  if (r.word) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
           '<p class="quote">' + nl(r.word) + '</p></div>');
  }

  /* 這一趟的數字。本來這裡還畫一根石片——石片跟記號一樣一趟一個，
     兩個都放就是重複，所以石片併進記號了：那個形狀現在是點開記號
     才看到的東西，不是另一個要學的名詞。 */
  H.push('<div class="card fa ' + z.key + ' coreview">');
  H.push('<div class="eyebrow">' + esc(z.name) + '</div>');
  H.push('<div class="log-num">說 <b>' + s.est + '</b> 天　·　過了 <b>' +
    s.elapsed + '</b> 天</div>');
  H.push('</div>');


  /* 這幾天你動過哪幾天。

     每天要按的那一版拿掉之後，這一份資料本來就會不見。改成在這裡一次
     補齊：一張那幾天的格子，點一下標起來。選填——不標一樣交得出去，
     而且它不進判定（判定只看承諾幾天與行事曆過了幾天）。

     它唯一影響的是那一趟長成什麼樣子的石片。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">這幾天你動過哪幾天　選填</div>');
  H.push(dayGrid(r.runId));
  H.push('<p class="dim">不影響判定。它決定的是封存起來長什麼樣子。</p>');
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">給這一趟取個名字　選填</div>');
  H.push('<div class="rn-row">');
  H.push('<input id="cname" value="' + esc(draft('cName', '')) + '" oninput="DRAFT[\'cName\']=this.value" maxlength="16" placeholder="' +
    esc('例：訪談那一週') + '">');
  H.push('</div>');
  H.push('</div>');

  /* 留記號本來在全班地下城那一頁，要切分頁才做得到——
     那是同一個時刻被切成兩半。收進來，這一頁就是一次完整的儀式。 */
  /* 插下去那一下敲開的東西就出現在下面。 */
  H.push(uncoverCard(t));
  H.push(buildPick(t));

  H.push(btn('封存', 'seal:' + r.runId, 'big'));
  return H.join('');
};
/* 選方向那張小地圖拿掉了：占地那一下改在全班那張圖上做。
   地圖是動手的地方，不是一個看的頁面。 */

/* ---------- 大躍進 ---------- */
/* 大躍進那一頁退休了：「石頭變了」搬到全班地下城（那才是新的一層
   實際發生的地方），其餘只是一句「去看看那一層」。 */

/* ---------- 出口 ----------

   這一頁是整個系統唯一的結尾。它不打分、不總評，只把他自己留下的
   紀錄攤開來：每一趟說幾天走幾天、走過哪幾層、留下哪幾句。

   「規劃妥善」不是開門的條件，是走出去的時候帶著的東西——
   同一道門，不同的故事。 */
PAGES.exit = function () {
  var t = myTeam();
  var e = exitRecord(t.teamId);
  var out = !!t.leftAt;

  var H = [head(out ? '地面' : '出口',
    out ? '你出去了' : '這個專案做完了？',
    out ? '' : '往下走不出去——六層會一直重來。出去的方式只有一個：' +
          '把手上這個專案做完，然後說一聲。')];

  /* 離場的演出。角色沿著那道光往上走出畫面。

     這是一學期的終點，比任何一次交出去都重——而交出去有一整場戰鬥，
     出去本來只是換一頁。

     動畫只加東西不當閘門：時鐘被凍住的時候人停在井底，還是看得見。 */
  if (out) H.push(exitScene(t));

  if (out && t.exitWord) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
      '<p class="quote">' + nl(t.exitWord) + '</p></div>');
  }

  /* 帶出來的東西。全部是他自己的紀錄。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你帶出來的</div>');
  H.push('<div class="outnum">');
  H.push('<div><b>' + e.runs.length + '</b><span>走完的任務</span></div>');
  H.push('<div><b>' + e.days + '</b><span>來過的天數</span></div>');
  H.push('<div><b>' + e.zones.length + '</b><span>走過的地層</span></div>');
  H.push('<div><b>' + e.keeps.length + '</b><span>留下的記號</span></div>');
  /* 走了幾圈。exitRecord 一直算著它，但那一頁從來沒畫出來——
     無盡輪迴的設定在終點最該被說一次。 */
  if (e.cycles) H.push('<div><b>' + e.cycles + '</b><span>走過的輪迴</span></div>');
  H.push('</div>');
  if (e.acc.total) H.push(accBar(e.acc));
  H.push('</div>');

  /* 走過的地層 */
  if (e.zones.length) {
    H.push('<div class="card"><div class="eyebrow">你走過的</div><div class="zones">');
    e.zones.forEach(function (z) {
      var c = faunaOf(z.key)[0];
      H.push('<div class="zn ' + z.key + '">');
      if (c) H.push(pxTag(c.px, z.pal, 'zn-px'));
      H.push('<b>' + esc(z.name) + '</b>');
      H.push('</div>');
    });
    H.push('</div></div>');
  }

  /* 每一趟說幾天、走幾天 */
  if (e.runs.length) {
    H.push('<div class="card"><div class="eyebrow">每一趟</div>');
    e.runs.forEach(function (x) {
      H.push('<div class="outrun"><span>' + esc(x.ms.title) + '</span>');
      H.push(estBar(x.run.est, x.run.actual, false));
      H.push('</div>');
    });
    H.push('</div>');
  }

  /* 帶出去的那一排石片。二十根排在一起，就是一個學期的形狀。 */
  if (e.keeps.length) {
    H.push('<div class="card"><div class="eyebrow">你帶出去的</div>');
    H.push('<div class="rack">');
    e.keeps.slice().reverse().forEach(function (k) {
      var kz = STRATA[0];
      STRATA.forEach(function (x) { if (x.key === k.zone) kz = x; });
      H.push('<div class="rk">');
      H.push(pxTag(k.px || coreOf(k.runId), kz.pal, 'core'));
      H.push('<b>' + esc(k.name || '') + '</b>');
      H.push('<span>' + (k.elapsed || 0) + ' 天</span>');
      H.push('</div>');
    });
    H.push('</div></div>');
  }

  if (!out) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">說一聲</div>');
    H.push('<p class="dim">老師確認之後你就出去了。</p>');
    H.push('<div class="row">');
    H.push(btn(t.exitAsk ? '已經說了，在等他' : '這個專案做完了',
      t.exitAsk ? 'noop' : 'askexit', 'big'));
    H.push(btn('回廊道', 'go:home', 'ghost'));
    H.push('</div></div>');
  } else {
    H.push(btn('回廊道', 'go:home', 'ghost'));
  }
  return H.join('');
};

/* ---------- 走過的每一趟 ---------- */
/* 紀錄那一頁併進任務清單了：兩頁幾乎是同一份資料。
   下面那一支 logRow 留著——任務清單在用。 */
/* 一列一趟。牠在最左邊，資訊在右邊，點開才看細節。 */
function logRow(m, r, t) {
  if (!m) return '';
  var open = DRAFT.lg === r.runId;
  var z = STRATA[0];
  STRATA.forEach(function (q) { if (q.key === r.zone) z = q; });
  var mob = mobOfRun(r);
  var s = r.stamp ? RULES.STAMPS[r.stamp] : null;
  var kp = null;
  keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });

  /* 收起來的那一列本來還有一行「老師回的話」。字放大之後那一行只剩
     八個字加刪節號，而完整的那一句點開就在下面——所以不放了。 */

  /* 用 div 不用 button：<button> 上的 grid／flex 在 Chromium 不完整生效
     ——內容會被包進一個匿名區塊，第一個子元素因此被收縮成內容寬，
     標題就變成一個字一行。role 與 tabindex 補回鍵盤與輔助工具。 */
  var H = ['<div role="button" tabindex="0" class="rec' + (open ? ' open' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'lgopen:' + r.runId })) + '\'>'];

  /* 直接排在格線上，不要再包一層。<button> 裡面包巢狀區塊的時候，
     第一個子元素會被收縮成內容寬（標題變成一個字一行）。 */
  H.push('<span class="rec-px">' + pxTag(mob.px, z.pal, '') + '</span>');
  H.push('<b class="rec-t">' + esc(m.title) + '</b>');
  H.push('<span class="rec-d">' + esc(dayText(r.committedAt)) +
    (r.submittedAt ? ' – ' + esc(dayText(r.submittedAt)) : '') + '</span>');

  H.push('<span class="rec-s' + (r.stamp ? ' ' + r.stamp : ' none') + '">' +
    (s ? stampPx(s.key) : '') + '</span>');
  H.push('</div>');

  /* 點開才出現的細節。收起來的時候整列兩秒看得完。 */
  if (open) {
    H.push('<div class="rec-more">');
    if (r.stamp) {
      H.push(estBar(r.est, r.actual, false));
      H.push(dayStrip(t.teamId, r.runId));
    } else {
      H.push('<p class="dim">這一趟重新想過。說 ' + r.est + ' 天，走了 ' +
        (r.went || 0) + ' 天之後退回去重新說。</p>');
    }
    var sp = stepsOf(r.runId);
    if (sp) {
      H.push('<div class="tags small"><span class="k">老師分的段</span>');
      sp.all.forEach(function (q, i) {
        H.push('<span class="tag static' + (sp.on.indexOf(i) >= 0 ? ' hit' : '') +
          '">' + esc(q) + '</span>');
      });
      H.push('</div>');
    }
    var ov = (r.overs || []).map(function (i) { return stepName(r.runId, i); })
      .filter(Boolean);
    if (ov.length) {
      H.push('<div class="tags small"><span class="k">比想的久</span>');
      ov.forEach(function (l) { H.push('<span class="tag static hit">' + esc(l) + '</span>'); });
      H.push('</div>');
    }
    if (r.hard) H.push('<p class="quote"><b>卡在哪裡</b>' + nl(r.hard) + '</p>');
    if (r.pace) H.push('<p class="quote"><b>你覺得的進度</b>' + nl(r.pace) + '</p>');
    if (r.word) H.push('<p class="quote tw">' + nl(r.word) + '</p>');
    H.push('</div>');
  }
  return H.join('');
}

/* 點開／收起來。一次只開一列。 */
ACTS.lgopen = function (id) {
  DRAFT.lg = DRAFT.lg === id ? null : id;
  render();
};

/* ---------- 這一圈走到哪 ----------

   死線勇者的迴圈是四拍，而且它一直讓你知道現在是哪一拍。
   這裡四拍是：準備（說幾天）→ 遠征（去做事，不用開）→ 戰報（交出去、
   看判定）→ 營地（封存、打通、蓋一座）。

   畫成環不是條：這座地下城是無盡輪迴的，四拍走完回到第一拍。
   所以它沒有百分比、沒有終點，也不可以有。 */
var BEATS = [
  { k: 'prep', n: '準備', s: '說幾天' },
  { k: 'away', n: '遠征', s: '去做事' },
  { k: 'rep',  n: '戰報', s: '交出去' },
  { k: 'camp', n: '營地', s: '封存·留記號' }
];

function beatAt(next, t) {
  var k = next.kind;
  if (k === 'doing') return 'away';
  if (k === 'submit' || k === 'stamped' || k === 'review') return 'rep';
  if (k === 'gear' || k === 'left' || k === 'waitexit') return 'camp';
  if (claimsOf(t.teamId) || DRAFT.build) return 'camp';
  return 'prep';
}

function beatBar(next, t) {
  var at = beatAt(next, t);
  var H = ['<div class="cyc">'];
  BEATS.forEach(function (s, i) {
    H.push('<span class="cy' + (s.k === at ? ' on' : '') + '">' +
      '<b>' + esc(s.n) + '</b><i>' + esc(s.s) + '</i></span>');
    if (i < BEATS.length - 1) H.push('<span class="cyd"></span>');
  });
  /* 最後接回第一拍。走完不是結束，是再一圈。 */
  H.push('<span class="cyd loop"></span>');
  H.push('</div>');
  return H.join('');
}

/* ===== 61-scene.js ===== */
/* 廊道的場景。

   之前這裡是一條進度條：角色 → 幾個方格 → 魔物。它讀得懂，但它是圖表。
   這一支把它改成一個地方——有洞口、有天花板、有地板、有石頭、有火把，
   角色站在裡面而不是站在旁邊。

   幾件事是有意義的，不是裝飾：

     火把    一天一盞。推進幾次，走廊就亮幾盞——「你來過幾次」畫出來的樣子。
     腳印    走過的每一格留一個。走廊上唯一的歷史，而且它不算分。
     迷霧    從你站的地方往前蓋住。往前走一格，霧就退一格。
     魔物    藏在霧裡，越靠近越清楚。它不是敵人，是這一趟要交的東西。

   還有一件事是刻意不做的：走廊上沒有任何「你應該走到哪」的記號。
   沒有基準線，就沒有落後這回事。 */

var SCN = {
  TILE: 44,     /* 一天一格 */
  ENT: 132,     /* 洞口那一段 */
  END: 154,     /* 魔物站的那一段 */
  H: 286,       /* 場景高 */
  FLOOR: 66     /* 地板上緣離底部多高——站在地上的東西都用這個 */
};

/* 一條走廊。

     t     這一組
     row   現在在跑的那一個 run（可能沒有）
     st    停滯狀態 */
/* 洞口有多寬。每留下一個記號就寬一點——那是「看得到自己的堆積」
   最直接的做法：你的營地會變大，而首頁就是這條廊道。
   有上限，不然走到後面整條廊道會被營地擠掉。 */
function entOf(teamId) {
  var t = teamOf(teamId);
  var n = Object.keys((t && t.builds) || {}).length;
  return SCN.ENT + Math.min(10, n) * 26;
}

function scene(t, row, st, kind) {
  var ENT = entOf(t.teamId);
  var run = row && row.run;
  /* 還沒承諾任何事的時候給一段像樣的空廊道。
     第一次打開是印象最深的一次，本來它只有一格，看起來像壞掉的。 */
  var est = run ? (run.est || 1) : 7;

  /* 一條軌道，兩個東西在上面：
       moved   你來過幾天——按一下才往前一格
       tide    實際過了幾天——你按不按它都會漲 */
  var log = run ? dayLog(run.runId) : [];
  var moved = 0, i0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'move') moved++;
  var done = run && run.state !== 'running';
  if (done) moved = Math.max(moved, run.pushes || 0);
  var tide = Math.min(log.length, est + 2);
  var walked = Math.min(moved, est);

  /* 每一格頭上掛的是那一天動的是哪一段。廊道因此讀得出形狀——
     七格同一個顏色跟七格五顏六色，是完全不同的一趟。 */
  var byTile = [];
  var k0 = 0;
  for (i0 = 0; i0 < log.length; i0++) {
    if (log[i0] && log[i0].kind === 'move') byTile[k0++] = log[i0].step;
  }
  var rests = 0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'rest') rests++;

  var seed = t.teamId + (run ? '|' + run.runId : '');
  var light = WORLD.light[st.level];
  /* 往前多畫幾格。本來只畫到承諾與過了幾天的較大者，所以拖到底就
     沒東西了。多出來的那幾格在霧裡，看不出有什麼——
     那才是還沒走到的地方該有的樣子。 */
  var AHEAD = 5;
  var span = Math.max(est, tide);          /* 這一趟的長度 */
  var draw = span + AHEAD;                 /* 畫到哪裡（多的在霧裡） */
  var W = ENT + draw * SCN.TILE + SCN.END;
  /* 走到多深，牆、地板、天花板、地上的東西、擋路的那一隻，全部跟著換。
     世界觀不寫在說明裡，寫在牆上。 */
  var zone = strataAt(depthOf(t.teamId), t.teamId);

  var H = ['<div class="scn ' + light.key + ' z-' + zone.key + '">'];


  /* 固定在角落的深度。走廊往旁邊捲，它不跟著捲——
     那是「你在多深的地方」，不是走廊上的一個位置。 */
  H.push('<div class="scn-hud">' +
    '<em>' + esc(zone.name) + '</em>' +
    '<b>' + (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</b>' +
    '<span>走完 ' + depthOf(t.teamId) + ' 個任務</span>' +
    '<span class="zn-note">' + esc(zone.note) + '</span></div>');

  /* 釘在框上、不跟著捲的兩層：近景的岩石與暗角。
     拖動廊道的時候它們不動——那一下就有視差。 */
  H.push('<div class="scn-frame"></div>');

  H.push('<div class="scn-scroll"><div class="scn-in" style="width:' + W + 'px">');

  /* 最後面那一層：更暗的磚與支撐柱。廊道不是一片牆，它有深處。 */
  H.push('<div class="scn-far" style="width:' + W + 'px"></div>');

  /* 頭上的岩。本來天花板只有幾根鐘乳石掛在空中，沒有東西讓它們掛。 */
  H.push('<div class="scn-ceil" style="width:' + W + 'px"></div>');

  /* ── 天花板：鐘乳石 ── */
  for (var d = 0; d < Math.ceil(W / 44); d++) {
    var dp = dripFor(seed, d);
    if (!dp) continue;
    H.push('<span class="drip" style="left:' + (d * 44 + dp.off) + 'px">' +
      pxTag(dp.px, zone.pal, '') + '</span>');
  }

  /* ── 洞口 ── */
  H.push(sceneMouth(t, { kind: kind, run: run }, ENT));

  /* ── 地板 ── */
  H.push('<div class="floor" style="left:0;width:' + W + 'px"></div>');
  if (walked > 0) {
    H.push('<div class="floor lit" style="left:' + ENT + 'px;width:' +
      (walked * SCN.TILE) + 'px"></div>');
  }

  /* ── 一天一格 ── */
  for (var i = 0; i < span; i++) {
    var x = ENT + i * SCN.TILE;
    var on = i < walked;

    /* 火把：走過的那幾格點著 */
    H.push(torchAt(x + 6, on, i));

    /* 腳印 */
    if (on) H.push('<img class="px foot" style="left:' + (x + 11) + 'px" src="' +
      pxSvg(STEP_PX.px, STEP_PX.pal, false) + '" alt="">');

    /* 那一天動的是哪一件。畫顏色不畫字——名字長度不一定，
       塞不進 44px；顏色對到哪一件，清單上看一次就記得了。 */
    if (on && byTile[i] >= 0) {
      H.push('<span class="doing" style="left:' + x + 'px;background:' +
        stepHue(byTile[i]) + '" title="' + esc(stepName(run.runId, byTile[i])) +
        '"></span>');
    }

    /* 第幾天 */
    H.push('<span class="dayn' + (i === walked ? ' here' : (on ? ' past' : '')) +
      '" style="left:' + x + 'px">' + (i + 1) + '</span>');

    /* 走通的地方才長得出東西，而且每一層長的不一樣（見 12-props.js）。
       全部用那一層的配色——換了地方，連地上的石頭都該換顏色。 */
    if (on) {
      var p = propFor(seed, i, zone.key);
      if (p === 'rubble') H.push('<img class="px prop rubble" style="left:' + (x + 5) +
        'px" src="' + pxSvg(RUBBLE.px, zone.pal, false) + '" alt="">');
      if (p === 'crystal') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(CRYSTAL.px, zone.pal, false) + '" alt="">');
      if (p === 'shroom') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(SHROOM.px, zone.pal, false) + '" alt="">');
      if (p === 'bolt') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(BOLT.px, zone.pal, false) + '" alt="">');
      if (p === 'ember') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(EMBER.px, zone.pal, false) + '" alt="">');
    }
  }

  /* ── 時間漲上來的水 ──
     一天一格，你按不按它都會漲。水在你後面＝走在自己承諾的前面；
     淹到腳邊＝剛好；過去了＝會比說的久，而且好幾天前就看得到。
     它不扣任何東西，走到底一樣可以交——它只是把時間畫出來。 */
  if (run && tide > 0) {
    H.push('<div class="tide" style="left:' + ENT + 'px;width:' +
      (tide * SCN.TILE) + 'px"></div>');
    H.push('<div class="tide-edge" style="left:' + (ENT + tide * SCN.TILE - 4) + 'px"></div>');
  }

  /* ── 魔物 ── */
  if (run) H.push(sceneMob(t, row, Math.min(1, walked / est), span));

  /* ── 角色 ── */
  /* 接了任務就往前走，沒有任務就在營火旁邊坐下來。

     停下來不是停止：坐著那兩幀差在呼吸，火也一直在動。
     而且營地是休息的地方，不是罰站的地方——
     沒有任務的時候本來就該是這個樣子。

     睡著是另一回事：那是有任務但很多天沒有動。 */
  var walking = run && st.level < 2;
  var resting = !run && st.level < 2;
  /* 火釘在洞口的 left:11，寬 44。人坐在火的右邊一點。 */
  var hx = resting ? 44 : ENT + walked * SCN.TILE - 11;
  H.push('<div class="hero scn-hero' + (st.level >= 2 ? ' asleep' : '') +
    (walking ? ' walking' : '') + (resting ? ' resting' : '') +
    '" style="left:' + hx + 'px">');
  /* 頭上寫他在幹嘛。本來只靠姿勢，而姿勢在 66px 上看不太出來——
     寫出來最快，而且它同時說明了「現在沒事做」是一個正常狀態。 */
  H.push('<div class="hero-tag' + (walking ? ' go' : resting ? ' rest' : '') +
    '">' + (walking ? '前進中' : resting ? '休息中' :
      st.level >= 2 ? '停很久了' : '待命') + '</div>');
  if (walking) {
    H.push(pxTag(HERO.walkA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.walkB, HERO.pal, 'ch wf wb'));
  } else if (resting) {
    H.push(pxTag(HERO.sitA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.sitB, HERO.pal, 'ch wf wb'));
  } else {
    H.push(pxTag(st.level >= 2 ? HERO.sleep : HERO.idle, HERO.pal, 'ch'));
  }
  H.push(heroPack(t.teamId));
  if (st.level === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine'));
  H.push('</div>');

  /* 角色手上那一盞的光。一圈一圈地暗下去，不是模糊的漸層——
     模糊的話它會立刻看起來像貼在像素圖上面的現代特效。 */
  H.push('<div class="halo" style="left:' + (hx - 121) + 'px"></div>');

  /* ── 你說的那一天 ──

     這是原始設計裡就有的一條線（「道路前方出現一條虛線」），
     一直沒做。它讓「我承諾了幾天」在畫面上有一個實體：
     那條線就在前面，水從後面追上來。只有數字的話那件事沒有位置。

     虛線不是終點線——別組沒有這條線，每一組的線在不同的地方，
     因為那是各自說的。 */
  if (run) {
    H.push('<div class="vow" style="left:' + (ENT + est * SCN.TILE) +
      'px"><span>你說的</span></div>');
  }

  /* ── 霧 ──
     從站的地方往前蓋住。它蓋的是「還沒走的那幾天」，
     所以往前一格霧就退一格。 */
  var fogAt = ENT + (Math.max(walked, tide) + 1) * SCN.TILE;
  if (fogAt < W) {
    H.push('<div class="fog" style="left:' + fogAt + 'px"></div>');
  }

  H.push('</div></div>');   /* scn-in / scn-scroll */

  H.push('</div>');         /* scn */

  /* 底下那一行掛在廊道外面。它的負邊界是為了往上貼住廊道，
     寫在 .scn 裡面的話會被 overflow:hidden 吸到頂上去。 */
  if (run) {
    H.push('<div class="scn-foot">');
    H.push('<span class="sf you"><b>' + moved + '</b>你來過</span>');
    H.push('<span class="sf days"><b>' + tide + '</b>過了幾天</span>');
    H.push('<span class="sf est"><b>' + est + '</b>你說的</span>');
    if (rests) H.push('<span class="sf rest"><b>' + rests + '</b>說沒動</span>');
    H.push('</div>');
  }
  return H.join('');
}

/* 背上本來背著封存過的石片。石片併進記號之後，
   「走著走著身上的東西變多了」改由洞口的營地講——
   那裡一趟多一個，而且首頁就是那條廊道，每次打開都看得到。 */
/* 照面那一頁上的自己。跟廊道裡走的是同一個人、同一身裝備——
   不然那一下就不是「我上去」，只是一張圖。 */
function heroTag(teamId) {
  return '<div class="hero duel-h">' + pxTag(HERO.idle, HERO.pal, 'ch') +
    heroPack(teamId) + '</div>';
}

function heroPack() { return ''; }

/* ---------- 洞口 ----------
   左邊是你進來的地方：拱門、從上面落下來的光、掛著的招牌。
   招牌就在這裡，不在標題列——它是廊道入口的看板，不是頁首。 */
/* 洞口。招牌、營火、石片架、往上的光——全部在這裡，而且一直在。

   為什麼要一直在：沒觸發過的東西等於不存在。一個學生如果從來沒有
   失準過，他整學期不會知道有營火這個地方；一個還沒封存過的人不會
   知道石片架是什麼。所以它們在那裡，只是沒點著——
   「看得到但還沒發生」跟「不存在」是兩件事。 */
function sceneMouth(t, next, ENT) {
  var sg = signOf(t.teamId);
  var H = ['<div class="mouth" style="width:' + (ENT || SCN.ENT) + 'px">'];

  /* 往上的光：出口。一直在，而且點得開——
     宣告專案做完是偶爾才做的事，不該在首頁佔一塊，
     但它也不能藏起來（沒觸發過的東西等於不存在）。 */
  H.push('<button class="shaft' + (t.exitAsk || t.leftAt ? ' open' : '') +
    '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'go:exit' })) +
    '\' title="' + esc(t.exitAsk ? '出口：在等老師確認' : '出口：專案做完的時候從這裡上去') +
    '"></button>');
  H.push('<div class="arch"></div>');

  /* 招牌。點得開——改名字是偶爾才做的事，不該在首頁佔一塊。 */
  H.push('<button class="hang" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:sign' })) + '\' title="' +
    esc('招牌：' + (t.project || '（還沒定）')) + '">');
  H.push('<div class="chain"></div>');
  H.push(pxTag(sg.px, sg.pal, 'sign'));
  H.push('</button>');
  H.push('<div class="mouth-txt"><b>' + esc(t.project || '（還沒定）') + '</b></div>');

  /* 營火。兩趟之間點著——那時候人坐在旁邊。

     本來是「判定失準才點著」，但那個分岔在改成
     『每一次交出去之前都省思』的時候拿掉了，所以它再也不會亮，
     變成一堆死掉的內容。改成休息的時候點著，才是它本來的意思：
     營地是休息的地方，不是罰站的地方。 */
  var lit = !next || !next.run;
  H.push('<button class="mfire' + (lit ? ' lit' : '') + '"' +
    ' data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'go:pack' })) + '\'' +
    ' title="' + esc(lit ? '營火：還沒接下一件事' : '營火（走著的時候是暗的）') +
    '">');
  if (lit) {
    CAMPFIRE.frames.forEach(function (f, n) {
      H.push(pxTag(f, CAMPFIRE.pal, 'ff f' + n));
    });
  } else {
    H.push(pxTag(CAMPFIRE.px, COLD_PAL, ''));
  }
  H.push('</button>');

  /* 火星。點著的時候才有，六顆，各自的節奏用座標算。
     它是這個畫面上唯一一直在動的小東西——沒有它，
     「坐在火旁邊」看起來會像一張靜止的圖。 */
  if (lit) {
    for (var e = 0; e < 6; e++) {
      var eh = hash('ember' + e);
      H.push('<i class="ember" style="left:' + (16 + eh % 26) + 'px;' +
        '--ed:' + (1400 + (eh >>> 6) % 900) + 'ms;' +
        'animation-delay:' + ((eh >>> 13) % 1600) + 'ms"></i>');
    }
  }

  /* ── 營地 ──

     每走完一趟留下的那一個記號，一個一個排在洞口的地上，
     而洞口的寬度跟著長（見 entOf）。十趟之後這裡是一個被你佈置過的
     營地——而首頁就是這條廊道，所以每次打開都看得到。

     這是「看得到自己的堆積」最直接的做法：不是散在各層一個 55px，
     是全部在同一個地方、每次可見地多一個、而且一眼看得完。

     本來這裡掛的是石片架。石片跟記號都是「一趟一個」，兩個都放就是
     重複——石片留在任務清單裡，那裡點得開、而且有圖例。 */
  var tm = teamOf(t.teamId);
  var bs = (tm && tm.builds) || {};
  var ds = Object.keys(bs).map(function (k) { return Number(k.slice(1)); })
    .sort(function (x, y) { return x - y; });
  ds.forEach(function (d, i) {
    var def = buildDef(bs['d' + d].k);
    if (!def) return;
    var z = strataAt(d, t.teamId);
    H.push('<button class="mmark" style="left:' + (72 + i * 26) + 'px" ' +
      'data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'seeb:' + t.teamId + ',' + d })) + '\' ' +
      'title="' + esc(def.name + '　' + z.name) + '">' +
      pxTag(def.px, z.pal, '') + '</button>');
  });

  H.push('</div>');
  return H.join('');
}

/* ---------- 魔物 ----------
   站在走廊盡頭。清楚到什麼程度跟你走了多少有關——
   剛出發的時候只看得到一團影子，走到底才看得清牠長什麼樣。 */
function sceneMob(t, row, prog, span) {
  var mob = mobOfRun(row.run);
  var pal = strataAt(depthOf(t.teamId), t.teamId).pal;
  var x = SCN.ENT + span * SCN.TILE + 33;
  /* 這裡本來還掛一塊寫著任務名字的木牌。拿掉了：它浮在半空、會壓到
     角落那一塊，而且那個名字底下那張卡已經有一次——同一件事說兩遍，
     其中一遍看起來就會像壞掉的東西。 */
  var H = [];
  /* 名字要走到一半才看得清。

     本來牠的名字從第一天就寫在那裡——那等於一趟開始就把唯一的未知
     揭曉了。現在前半段只有一團形狀跟一排問號，走近了名字才浮出來。
     每一趟因此有一條小小的線從頭拉到尾。 */
  var near = prog >= 0.5;
  H.push('<div class="scn-mob" style="left:' + x + 'px;opacity:' +
    (0.30 + 0.70 * prog).toFixed(2) + '">');
  H.push(pxTag(mob.px, pal, 'ch'));
  H.push('<span class="mobn' + (near ? '' : ' hid') + '">' +
    (near ? esc(mob.n) : '？？？') + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 火把 ----------
   三幀真的換圖，不是用 CSS 做出來的「像火」。每一盞的速度差一點點，
   不然一整排會一起眨眼，那看起來像壞掉的燈管不像火。 */
function torchAt(x, lit, i) {
  if (!lit) {
    return '<img class="px tor dead" style="left:' + x + 'px" src="' +
      pxSvg(TORCH.dead, TORCH.deadPal, false) + '" alt="">';
  }
  var ms = [300, 360, 420, 340][hash('t' + i) % 4];
  var H = ['<span class="tor" style="left:' + x + 'px;--fd:' + ms + 'ms">'];
  TORCH.frames.forEach(function (f, n) {
    H.push('<img class="px f f' + n + '" src="' + pxSvg(f, TORCH.pal, false) + '" alt="">');
  });
  H.push('</span>');
  return H.join('');
}

/* 重畫之後把角色捲進畫面裡。

   走廊比視窗長的時候，重畫預設會回到最左邊——那樣按了推進之後，
   會看到走廊動了但看不到自己動。這一支讓鏡頭跟著人走。 */
/* 滑到哪裡要記住。重畫會把 innerHTML 換掉，捲軸歸零——
   不記的話你永遠滑不到廊道的另一端。 */
var SEEN_AT = {};

function keepScroll(box, key, centre) {
  if (!box) return;
  var s = SEEN_AT[key];
  if (s && s.at === centre.at) {
    /* 角色沒換位置：放回你剛剛滑到的地方 */
    box.scrollLeft = s.x; box.scrollTop = s.y;
  } else {
    box.scrollLeft = centre.x; box.scrollTop = centre.y;
    SEEN_AT[key] = { at: centre.at, x: centre.x, y: centre.y };
  }
  box.onscroll = function () {
    var k = SEEN_AT[key];
    if (k) { k.x = box.scrollLeft; k.y = box.scrollTop; }
  };
}

function scrollScene() {
  /* 廊道拖得動。每次重畫都要重掛，因為 innerHTML 被換掉了。 */
  dragScene();

  var box = document.querySelector('.scn-scroll');
  var hero = document.querySelector('.scn-hero');
  if (box && hero) {
    keepScroll(box, 'scn', {
      at: hero.offsetLeft,
      x: Math.max(0, hero.offsetLeft + hero.offsetWidth / 2 - box.clientWidth / 2),
      y: 0
    });
  }

  /* 地圖一樣：打開來要先看到自己那塊地，不然全班那片地上
     你得先找自己在哪裡。 */
  var mb = document.querySelector('.dig-wrap');

  /* 地層的名字放在左邊那一條裡，但地圖比視窗寬——
     一往右捲就看不見了。讓它跟著橫捲走。 */
  if (mb) {
    var zs = mb.querySelectorAll('.dig-z');
    var pin = function () {
      for (var i = 0; i < zs.length; i++) zs[i].style.left = (mb.scrollLeft + 3) + 'px';
    };
    pin();
    mb.addEventListener('scroll', pin);
  }

  var mh = mb && mb.querySelector('.dig-hero');
  if (mb && mh) {
    keepScroll(mb, 'dig', {
      at: mh.offsetLeft + ',' + mh.offsetTop,
      x: Math.max(0, mh.offsetLeft + mh.offsetWidth / 2 - mb.clientWidth / 2),
      y: Math.max(0, mh.offsetTop + mh.offsetHeight / 2 - mb.clientHeight / 2)
    });
  }
}

/* ---------- 走出去的那一下 ----------

   一學期的終點。交出去有一整場戰鬥，出去本來只是換一頁——
   這一段補上那個份量。

   一道從上面下來的光、兩邊是岩壁、人沿著光往上走出畫面。
   沒有粒子、沒有光暈：跟全作一致，硬邊、零模糊、光從上面來。

   動畫只加東西不當閘門——時鐘被凍住的時候人停在井底，還是看得見。 */
function exitScene(t) {
  var z = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var H = ['<div class="xit ' + z.key + '">'];

  /* 兩邊的岩壁。中間那一條是光。 */
  H.push('<div class="xit-sky"></div>');
  H.push('<div class="xit-rock l"></div>');
  H.push('<div class="xit-rock r"></div>');
  H.push('<div class="xit-beam"></div>');

  /* 地表。走出去就是走到這一條上面。 */
  H.push('<div class="xit-top"></div>');

  /* 人。背影，沿著光往上走。 */
  H.push('<div class="xit-hero">');
  H.push(pxTag(HERO.back, HERO.pal, 'ch'));
  H.push(heroPack(t.teamId));
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 廊道拖得動 ----------

   本來只能靠捲軸或觸控慣性，桌機上等於不能前後看。抓著廊道拉，
   前面幾天跟後面幾天都看得到——那條廊道是這個作品的主畫面，
   看不了前後就等於只看得到一格。

   兩件要小心的事：
   一 · 拖跟點要分得開。移動超過五個像素才算拖，不然招牌與出口
        會變成點不到。
   二 · 拖完不要讓瀏覽器把它當成點擊送出去（見 click 的攔截）。 */
function dragScene() {
  var box = document.querySelector('.scn-scroll');
  if (!box || box.dataset.drag) return;
  box.dataset.drag = '1';

  var down = false, moved = false, x0 = 0, l0 = 0;

  box.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    down = true; moved = false;
    x0 = e.clientX; l0 = box.scrollLeft;
  });

  box.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - x0;
    if (!moved && Math.abs(dx) < 5) return;
    if (!moved) { moved = true; box.classList.add('dragging'); }
    box.scrollLeft = l0 - dx;
    /* 記住拖到哪裡，重畫之後放回去（見 keepScroll）。 */
    var k = SEEN_AT.scn;
    if (k) k.x = box.scrollLeft;
    e.preventDefault();
  });

  function up() {
    down = false;
    box.classList.remove('dragging');
    /* 拖完那一下的 click 不要送出去，不然會誤觸招牌或出口。 */
    if (moved) {
      box.addEventListener('click', function stop(ev) {
        ev.stopPropagation(); ev.preventDefault();
        box.removeEventListener('click', stop, true);
      }, true);
    }
  }
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('pointerleave', up);
}


/* ===== 62-eco.js ===== */
/* 全班地下城：一張地質剖面。

   這是「關聯性」那根柱子的全部，而且它只做一件事：
   讓你看得到別人也在下面——不比較、不排名、不知道誰比較好。

   為什麼是剖面而不是列表：列表只要有兩列就會被讀成名次，剖面讀起來
   是一個地方。每一組往下走自己的一條廊道，廊道之間沒有共同的終點線，
   因為每一組的專案本來就不一樣。

   岩層（見 13-strata.js）是全班共用的地質，不是關卡。誰都看得到全部
   四層，沒有哪一層需要「開」。深度變了岩石就變了，就這樣。

   岩壁裡住著東西。牠們跟任何一組的進度都無關，就只是住在那裡——
   擋在你走廊盡頭的那一隻，只是其中一隻。點一下看牠是什麼。

   立體感來自每一塊右邊的側面（見 54-eco.css），不是把整條廊道斜著推——
   正交的長條看起來像進度表，有側面的廊道看起來像地下城。 */

var XS = {
  RULER: 154,    /* 左邊：深度尺與層的名字 */
  W: 176,        /* 一條廊道的寬。要放得下 22px 的專案名，一行六個字 */
  GAP: 44,       /* 廊道之間的牆 */
  SEG: 55,       /* 一個里程碑的深度 */
  SURF: 132,     /* 地表那一段。欄頭有三行，最上面是 22px 的專案名 */
  ROCK: 264      /* 最右邊留一大塊沒有人走過的岩壁，給生態用 */
};

function xsTop(d) { return XS.SURF + d * XS.SEG; }
function xsX(i) { return XS.RULER + i * (XS.W + XS.GAP); }

/* ---------- 整張圖 ---------- */
function xsScene(rows, meId, classId) {
  /* 畫多深：最深的那一組再往下兩格，讓底下永遠還有沒有人走過的岩石。
     這很重要——底部如果切齊最深的人，那條線就變成終點線了。 */
  var deep = rows.reduce(function (a, r) {
    return Math.max(a, r.depth + (r.at > 0 ? 1 : 0));
  }, 0);
  var maxD = Math.max(5, deep + 2);
  var W = xsX(rows.length) + XS.ROCK;
  var H = xsTop(maxD) + 44;

  var out = ['<div class="xsec-wrap"><div class="xsec" style="width:' + W +
    'px;height:' + H + 'px">'];

  /* ── 地層 ──
     層沒有固定深度：順序是一個班洗一次，六層走完回到第一層。
     所以帶子從班級的路線算，每 ZONE_SPAN 格一帶，一直排到底。
     同一個班的每一組看到的是同一片地質——那是「我們在同一個地方」。 */
  for (var bd = 0; bd * ZONE_SPAN < maxD; bd++) {
    var zs = strataAt(bd * ZONE_SPAN, classId);
    var top = xsTop(bd * ZONE_SPAN);
    var bot = xsTop(Math.min((bd + 1) * ZONE_SPAN, maxD));
    out.push('<div class="xs-band ' + zs.key + '" style="top:' + top +
      'px;height:' + (bot - top) + 'px;width:' + W + 'px"></div>');
    out.push('<div class="xs-bandn ' + zs.key + '" style="top:' + (top + 6) + 'px">' +
      '<b>' + esc(zs.name) + '</b></div>');
  }

  /* ── 岩壁裡的東西 ── */
  out.push(xsFauna(rows.length, maxD, classId));

  /* ── 地表 ── */
  out.push('<div class="xs-sky" style="width:' + W + 'px"></div>');
  out.push('<div class="xs-surf" style="width:' + W + 'px"></div>');

  /* ── 深度尺。只標數字，不標「應該到哪」 ── */
  for (var d = 1; d <= maxD; d++) {
    out.push('<div class="xs-rule" style="top:' + xsTop(d) + 'px;width:' + W + 'px">' +
      '<span>' + (d * WORLD.depthPerMilestone) + ' m</span></div>');
  }

  /* ── 每一組一條廊道 ── */
  rows.forEach(function (r, i) {
    out.push(xsShaft(r, i, maxD, r.teamId === meId));
  });

  out.push('</div></div>');
  return out.join('');
}

/* ---------- 岩壁裡的生態 ----------
   位置用層與槽算，不擲骰子。每次打開，同一隻都在同一個地方——
   會亂跳的東西不是生態，是特效。 */
function xsFauna(nTeams, maxD, classId) {
  var out = [];
  /* 放得下的地方：每一條廊道右邊那道牆，加上最右邊那一大塊 */
  var slots = [];
  for (var i = 0; i < nTeams; i++) slots.push(xsX(i) + XS.W + 14);
  slots.push(xsX(nTeams) + 33);
  slots.push(xsX(nTeams) + 154);
  slots.push(xsX(nTeams) + 88);

  for (var bd = 0; bd * ZONE_SPAN < maxD; bd++) {
    var s = strataAt(bd * ZONE_SPAN, classId);
    var lo = xsTop(bd * ZONE_SPAN);
    var hi = xsTop(Math.min((bd + 1) * ZONE_SPAN, maxD));
    if (hi - lo < 55) continue;
    /* 用「第幾帶」而不是層的 key 當種子——同一層在不同深度再出現一次的
       時候，住在裡面的不該是同一隻站在同一個位置。 */
    xsPlace(out, slots, s, bd, lo, hi);
  }
  return out.join('');
}

function xsPlace(out, slots, s, bd, lo, hi) {
  slots.forEach(function (x, n) {
    var h = hash(s.key + '/' + bd + '/' + n);
    if (h % 100 < 42) return;
    var c = faunaAt(s.key, bd * 7 + n);
    if (!c) return;
    var y = lo + 11 + ((h >>> 5) % Math.max(1, hi - lo - 55));
    out.push('<button class="xs-fauna" style="left:' + x + 'px;top:' + y + 'px" ' +
      'data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'fauna:' + c.n })) + '\' ' +
      'title="' + esc(c.n) + '">' + pxTag(c.px, s.pal, '') + '</button>');
  });
}

/* ---------- 一條廊道 ---------- */
function xsShaft(r, i, maxD, mine) {
  var x = xsX(i);
  var tm = teamOf(r.teamId);
  var left = !!(tm && tm.leftAt);
  var H = [];
  H.push('<div class="xs-shaft' + (mine ? ' mine' : '') + (left ? ' left' : '') +
    '" style="left:' + x + 'px;width:' + XS.W + 'px">');

  /* 走出去的那一組，廊道整條亮著一道光通到地表。
     別人看得到「他們走出去了」——這是這張圖上關聯性最強的一件事，
     而且它不是名次：走不走得出去跟估得準不準無關。 */
  if (left) {
    H.push('<div class="xs-out" style="height:' + (xsTop(maxD) + 44) + 'px"></div>');
  }

  /* 入口。招牌立在地表上，不是埋在土裡。

     本來這裡疊四行，而且亮的那一行是組名。「第一組 · 甲」是座號，
     「畢製分工失衡」才是他們在做的事——大的要是後者。
     組名縮成一個字，跟狀態併成一行。

     整塊是一顆鈕：本來這裡沒有任何 data-act，所以還沒留下東西的
     那幾組整條廊道是死的，點不動。 */
  var sg = SIGNS[r.sign] || SIGNS.wood;
  H.push('<button class="xs-head" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'team:' + r.teamId })) + '\' title="' +
    esc(r.name) + '">');
  H.push(pxTag(sg.px, sg.pal, 'sign-s'));
  H.push('<b>' + esc(r.project || '（還沒定）') + '</b>');
  /* 誰＋現在怎麼樣，一行，釘在欄頭底部——名字一行跟兩行的組要齊。 */
  H.push('<em class="xs-st"><span>' + esc(shortName(r.name)) + '</span>' +
    '<i class="s-' + r.status.key + '">' + esc(r.status.label) +
    (r.status.days ? ' ' + r.status.days + ' 天' : '') + '</i></em>');
  H.push('</button>');

  /* 打通的每一格 */
  for (var d = 0; d < maxD; d++) {
    var dug = d < r.depth;
    var here = d === r.depth && r.at > 0;
    var band = strataAt(d, r.teamId);
    H.push('<div class="xs-seg ' + band.key + (dug ? ' dug' : '') + (here ? ' here' : '') +
      '" style="top:' + xsTop(d) + 'px">');
    if (here) H.push('<i style="height:' + Math.round(r.at * 100) + '%"></i>');
    /* 那一趟蓋的東西站在那一層裡。這是這張圖上唯一屬於「那一組自己選的」
       東西——深度是走出來的，蓋什麼是挑的。 */
    var bl = dug && buildAt(r.teamId, d);
    var bg = bl && buildDef(bl.k);
    if (bg) {
      H.push('<button class="xs-bld" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'seeb:' + r.teamId + ',' + d })) + '\' title="' +
        esc(bg.name) + '">' + pxTag(bg.px, BUILD_PAL, '') + '</button>');
      /* 跟下一層接起來了就畫一段。十座接起來是一條街，
         不是十個各自立著的圖示。 */
      if (linkedAt(r.teamId, d)) H.push('<div class="xs-link"></div>');
    }
    H.push('</div>');
  }

  /* 小人站在最深的那一格 */
  /* 走出去的那一組，人站在地表上——他不在下面了。 */
  var at = r.depth + (r.at > 0 ? 1 : 0);
  var pose = left ? HERO.idle : (r.stall >= 2 ? HERO.sleep : HERO.idle);
  var top = left ? (XS.SURF - 44) : (xsTop(Math.max(0, at - 1)) + 11);
  H.push('<div class="xs-hero' + (r.stall >= 2 && !left ? ' sleep' : '') +
    (left ? ' out' : '') + '" style="top:' + top + 'px">');
  H.push(pxTag(pose, HERO.pal, 'ch-s'));
  if (r.stall === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine-s'));
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

PAGES.eco = function () {
  var t = myTeam();
  var rows = ecoRows(t.classId);
  /* 地圖回到這一頁。首頁要的是「不用學就懂」，那是廊道；
     這張圖要學三條規則（一格＝一趟、顏色＝哪一組、亮的可以點），
     所以它屬於一個你特地過來看的地方。

     打通與蓋東西也在這裡——動手的地方跟看的地方要是同一個。 */
  var H = [head('全班地下城', '大家都在下面', '')];
  H.push(xsScene(rows, t.teamId, t.classId));
  /* 點岩壁裡那一隻會設 DRAFT.fa，但顯示那一張卡的 faunaCard
     沒有人呼叫——所以點下去一直是沒有反應的。 */
  H.push(faunaCard());
  /* 排行榜搬到底下「估得準」那一段。刻意加進來、準備好隨時拿掉的
     ——見 68-rank.js。要拿掉就刪掉那一段跟那兩個檔案。 */
  /* 跨進新的一層的時候石頭會變。這一張本來在「大躍進」那一頁上，
     但那一頁只有這一張是內容，其餘是「去看看那一層」——
     而去看看到的就是這裡。所以它直接長在這裡。 */
  var nd = unbuiltDepth(t.teamId);
  if (nd > 0) {
    var zn = strataAt(nd, t.teamId), zw = strataAt(nd - 1, t.teamId);
    if (zn.key !== zw.key) {
      H.push('<div class="card fa ' + zn.key + ' zone-in">');
      H.push('<div class="eyebrow">石頭變了</div>');
      H.push('<h2>' + esc(zn.name) + '</h2>');
      H.push('<p class="lead">' + esc(zn.note) + '</p>');
      H.push('</div>');
    }
  }

  /* 留記號是一件在等你做的事，不是一段可以切走的內容，
     所以它跟圖一起留在上面。 */
  H.push(uncoverCard(t));
  H.push(buildPick(t));

  /* ── 底下分成三段，一次只看一段 ──
     本來是直的疊在一起，一路捲到兩千像素。捲到底的東西等於沒有。 */
  var dt = DRAFT.dt && teamOf(DRAFT.dt);
  var tab = DRAFT.tab || (dt ? 'team' : 'feed');
  if (tab === 'team' && !dt) tab = 'feed';

  var segs = [['feed', '最近'], ['rank', '估得準']];

  H.push('<div class="segs">');
  segs.forEach(function (sg) {
    H.push('<button class="seg' + (tab === sg[0] ? ' on' : '') +
      '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tab:' + sg[0] })) + '\'>' + esc(sg[1]) + '</button>');
  });
  H.push('</div>');

  if (tab === 'rank') {
    H.push(rankCard(t.classId, t.teamId));
  } else if (tab === 'team') {
    H.push(digTeamCard(t.classId));
  } else {
    var fd = feedOf(t.classId, 20);
    if (fd.length) {
      H.push('<div class="feed">');
      fd.forEach(function (f) { H.push(feedRow(f, t.teamId)); });
      H.push('</div>');
    } else {
      H.push('<p class="dim">還沒有人做過什麼。</p>');

  H.push(btn('回自己的廊道', 'go:home', 'ghost'));

/* ===== 63-pack.js ===== */
/* 石片架。

   走完一趟會長出一根石片（見 43-core.js）。這一頁是它們排在一起的地方。

   這一頁前後改過三次，方向差很多：老師發裝備 → 隨機三件挑一件 →
   三張事實挑一張 → 現在。前三次都失敗在同一件事上——那個「東西」是我
   發的，跟他那一週沒有關係，所以挑不挑、留哪一件，對他都沒有差別。

   為什麼收集這件事現在站得住——它不是徽章，是樣本：

     · 每一根指向一個具體、不會再發生的那一週
     · 形狀由那一趟自己決定，沒有兩根一樣，而且那個不同是他造成的
     · 不可能再拿到同一根
     · 二十根排在一起會變成一根說不出來的東西：一個學期的形狀

   刻意沒有的東西：總數、進度、缺哪幾根。
   一趟長一根，本來就不會有缺的——沒有東西需要被填滿，
   所以也沒有人會為了填滿它多做一件事。

   遊戲化在這裡的位置是「吸引他打開」，不是「換到好處」。
   一根石片不加速、不擋失準、不換任何東西。 */

PAGES.pack = function () {
  var t = myTeam();
  /* 老師派過的每一件事，各自走到哪。包含還沒承諾的，
     所以它是「清單」不只是「紀錄」。 */
  var rows = runsFor(t.teamId).slice().reverse();
  /* 重新想過的那幾趟也是紀錄——它們確實發生過，只是沒有判定。 */
  where('Runs', function (r) { return r.teamId === t.teamId && r.state === 'rethought'; })
    .forEach(function (r) { rows.push({ ms: msOf(r.msId), run: r }); });

  var H = [head('任務清單', '老師派過的每一件事', '')];

  if (!rows.length) {
    H.push('<div class="card dim">老師還沒派過任何一件事。</div>');
    H.push(btn('回廊道', 'go:home', 'ghost'));
    return H.join('');
  }

  /* 準度總表。本來在「紀錄」那一頁上——那一頁跟這一頁幾乎是同一份資料，
     併過來之後這裡是唯一一個看得到自己走過幾趟、準了幾次的地方。 */
  var acc = accuracyOf(t.teamId);
  if (acc.total) {
    H.push('<div class="card quiet"><div class="eyebrow">走過 ' + acc.total + ' 趟</div>');
    H.push(accBar(acc));
    H.push('</div>');
  }


  H.push('<div class="card"><div class="rec-list">');
  rows.forEach(function (x) { H.push(logRow(x.ms, x.run, t)); });
  H.push('</div></div>');

  H.push(btn('回廊道', 'go:home', 'ghost'));
  return H.join('');
};

/* 一列＝一件事。狀態、你說幾天、實際幾天、那一趟叫什麼。

   數字靠右對齊，因為「說幾天」跟「實際幾天」是要被互相比較的——
   這一頁順便就是他們自己的估算史。 */
function taskRow(m, r, t) {
  if (!m) return '';
  var st = TASK_STATE[r.state] || TASK_STATE.fresh;
  var H = ['<div class="tk ' + (r.stamp || '') + '">'];

  H.push('<div class="tk-h">');
  H.push('<i class="tk-s ' + st.k + '">' + esc(st.n) + '</i>');
  H.push('<b>' + esc(m.title) + '</b>');
  H.push('</div>');

  /* 說幾天 → 實際幾天。還沒交的那幾趟只有左邊那個數字。 */
  if (r.est) {
    H.push('<div class="tk-n">');
    H.push('<span>你說</span><b>' + r.est + '</b>');
    if (r.actual) { H.push('<span>實際</span><b class="' + (r.stamp || '') + '">' +
      r.actual + '</b>'); }
    else if (r.went) { H.push('<span>走了</span><b>' + r.went + '</b>'); }
    else if (r.state === 'running') {
      var gone = daysBetween(r.committedAt, now());
      H.push('<span>過了</span><b>' + gone + '</b>');
    }
    H.push('<span class="tk-u">天</span>');
    H.push('</div>');
  }

  /* 封存過的那一趟：名字跟那一根石片。
     石片終於有出處了——它掛在它自己那一趟旁邊。 */
  /* 這一趟留下的那個記號，掛在它自己那一趟旁邊。
     點下去打開記號的卡片——那一趟長成什麼樣子在裡面。 */
  var bd = null, bdD = -1;
  Object.keys(t.builds || {}).forEach(function (bk) {
    if (t.builds[bk].runId === r.runId) { bd = t.builds[bk]; bdD = Number(bk.slice(1)); }
  });
  var def = bd && buildDef(bd.k);
  if (def) {
    var z = strataAt(bdD, t.teamId);
    var kp = null;
    keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });
    H.push('<button class="tk-k" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'seeb:' + t.teamId + ',' + bdD })) + '\'>');
    H.push(pxTag(def.px, z.pal, 'core'));
    H.push('<span>' + esc((kp && kp.name) || def.name) + '</span>');
    H.push('</button>');
  }

  H.push('</div>');
  return H.join('');
}

/* 每一種狀態一句人話。沒有一句在講「你做得好不好」。 */
var TASK_STATE = {
  fresh:     { k: 'wait', n: '還沒說幾天' },
  running:   { k: 'go',   n: '正在做' },
  judged:    { k: 'go',   n: '交出去了' },

  approved:  { k: 'ok',   n: '老師勾了' },
  done:      { k: 'ok',   n: '走完了' },
  rethought: { k: 'wait', n: '重新想過' }
};

/* ===== 65-feed.js ===== */
/* 首頁：全班最近發生的事。

   YouTube 的首頁放的是別人的影片，但它的主流程是把影片放上去。
   打開它的理由是別人，留下來的理由才是自己。

   這個系統本來反過來：首頁是自己的廊道，別人在另一個分頁裡當背景。
   所以沒有任何理由在不必要的時候打開它——一個人的東西看兩次就沒了。

   改成：
     上面一條   你手上這一趟（狀態 ＋ 那一顆鍵）。像 YouTube 的上傳。
     底下       全班最近發生的事，一則一則往下。

   feed 裡放什麼，這件事要小心。放的是「發生了什麼」，不是「誰比較好」：

     封存了一根岩心    ← 最有內容的一則，那根長什麼樣是那一組那一週的形狀
     交出去了          ← 不寫判定。誰估得準不準不該出現在別人的首頁上
     走到新的一層
     走出去了
     老師派了新的里程碑

   沒有名次、沒有數量、沒有印章。它是時間順序，不是排行榜。 */

/* 全班最近發生的事。從資料直接組，不從 Events——Events 是研究紀錄，
   欄位是為了匯出設計的，不是為了畫面。 */
function feedOf(classId, limit) {
  var out = [];
  var teams = {};
  where('Teams', function (t) { return t.classId === classId; })
    .forEach(function (t) { teams[t.teamId] = t; });

  /* 封存 */
  DB.Keeps.forEach(function (k) {
    if (!teams[k.teamId]) return;
    out.push({ at: k.at, kind: 'seal', team: teams[k.teamId], keep: k });
  });

  /* 交出去 */
  where('Runs', function (r) { return teams[r.teamId] && r.submittedAt; })
    .forEach(function (r) {
      var m = msOf(r.msId);
      out.push({ at: r.submittedAt, kind: 'sent', team: teams[r.teamId], ms: m });
    });

  /* 走出去 */
  Object.keys(teams).forEach(function (id) {
    if (teams[id].leftAt) out.push({ at: teams[id].leftAt, kind: 'left', team: teams[id] });
  });

  /* 老師派的 */
  where('Milestones', function (m) { return m.classId === classId; })
    .forEach(function (m) { out.push({ at: m.at, kind: 'pub', ms: m }); });

  out.sort(function (a, b) { return b.at - a.at; });
  return out.slice(0, limit || 20);
}

/* 一則一行：圖、誰、做了什麼、多久以前。

   本來一則兩行（誰做了什麼＋細節），十則就是二十行長得很像的字，
   整段讀起來是一面牆。壓成一行之後，掃過去就知道最近誰動了。 */
function feedRow(f, meId) {
  var mine = f.team && f.team.teamId === meId;
  var H = ['<div class="fd' + (mine ? ' mine' : '') + '">'];
  var who = f.team ? shortName(f.team.name) : '老師';
  var act = '', ic = '';

  if (f.kind === 'seal') {
    var z = STRATA[0];
    STRATA.forEach(function (x) { if (x.key === f.keep.zone) z = x; });
    ic = pxTag(f.keep.px || coreOf(f.keep.runId), z.pal, 'core sm');
    act = '封存';
  } else if (f.kind === 'sent') {
    ic = pxTag(ICONS.log, ICON_PAL, 'nic');
    act = '交出去';
  } else if (f.kind === 'left') {
    ic = pxTag(ICONS.home, ICON_ON, 'nic');
    act = '走出去了';
  } else {
    ic = pxTag(ICONS.ms, ICON_PAL, 'nic');
    act = '派了新的';
  }

  H.push('<span class="fd-ic">' + ic + '</span>');
  H.push('<b>' + esc(who) + '</b>');
  H.push('<em>' + esc(act) + '</em>');
  H.push('<i>' + feedWhen(f.at) + '</i>');
  H.push('</div>');
  return H.join('');
}

function feedWhen(at) {
  var d = daysBetween(at, now());
  return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
}

/* ── 你不在的這幾天 ──

   死線勇者的節奏：專注的時候不開 app，回來看發生了什麼。這個系統的
   限制剛好一樣（做之前開、做完開），所以那一半可以搬——但要搬得誠實。
   那邊掛機會自動打怪爆裝；這裡掛機只有日曆在走，所以這一條只報真的
   發生過的事。沒有憑空長出來的東西，也沒有為了讓人回來而發的獎勵。

   回傳 null 代表沒隔多久，那就什麼都不要畫。 */
function awayOf(meId) {
  var u = userOf(meId);
  if (!u || !u.seenAt) return null;
  var d = daysBetween(u.seenAt, now());
  if (d < 1) return null;
  var t = teamOf(u.teamId);
  var cut = u.seenAt;
  var cells = 0;
  where('Keeps', function (k) {
    return teamOf(k.teamId) && teamOf(k.teamId).classId === t.classId && k.at > cut;
  }).forEach(function () { cells++; });
  var run = where('Runs', function (r) {
    return r.teamId === t.teamId && r.state === 'running';
  })[0];
  /* 老師勾了也算「你不在的時候發生的事」——而且是唯一一件
     有人特地為你做的。 */
  var ok = where('Runs', function (r) {
    return r.teamId === t.teamId && r.state === 'approved';
  }).length;
  return {
    days: d,
    cells: cells,
    okd: ok,
    left: run ? Math.max(0, run.est - daysBetween(run.committedAt, now())) : null
  };
}

/* 看過就記下來。不記的話它每次進來都會再喊一次同樣的話。 */
function markSeen(meId) {
  var u = userOf(meId);
  if (u) { u.seenAt = now(); save(); }
}

/* ===== 66-map.js ===== */
/* 全班地下城：一片被打通的岩層。

   本來是五根平行的柱子，深度一根一根往下——那是有美術的長條圖。
   現在是一片方格：每一組封存一趟就打通一格，往哪裡打通是他們自己選的。
   一個學期下來全班刻出一座真的洞窟，每個班長得都不一樣。

   這張圖上沒有名次、沒有計數、沒有排序。看得到的是形狀，
   而形狀是每一組自己挑出來的。

   版面留邊，這件事第一版做壞了：組名放在 top:-18px，整排被切掉看不見；
   層的名字壓在最左邊那一組的格子上。所以左邊留一條給層名、
   上面留一條給組名與地表線，格子從那兩條之後才開始。 */

var MAP_L = 88;   /* 左邊那一條：層的名字 */
var MAP_T = 72;   /* 上面那一條：地表。天、林子、組名、每一組的井口 */

/* 岩層裡長什麼東西，直接用廊道那一套。同一層在兩個地方長的是同一種
   東西，不然那兩個畫面就不是同一座地下城。 */
var MAP_PX = {
  rubble: RUBBLE, crystal: CRYSTAL, shroom: SHROOM, bolt: BOLT, ember: EMBER
};

function mapSurface(classId, teams, hue, meId) {
  var W = DIG.W * DIG.CELL;
  var H = ['<div class="dig-sky" style="left:0;width:' + (MAP_L + W) + 'px;height:' +
    MAP_T + 'px"></div>'];

  /* 林子。位置與高矮用班級算，所以每個班的地表長得不一樣，
     而且同一個班每次打開都一樣。 */
  for (var i = -2; i < DIG.W; i++) {
    var h = hash(classId + 'tree' + i);
    if (h % 100 < 38) continue;
    var th = 16 + (h >>> 3) % 14;
    var tx = MAP_L + i * DIG.CELL + ((h >>> 7) % (DIG.CELL - 14));
    H.push('<div class="dig-tree" style="left:' + tx + 'px;top:' +
      (MAP_T - 8 - th) + 'px;height:' + th + 'px"></div>');
  }

  /* 地面那一條。硬邊，沒有漸層——泥土在上，岩層從這裡開始。 */
  H.push('<div class="dig-soil" style="left:0;top:' + (MAP_T - 8) +
    'px;width:' + (MAP_L + W) + 'px"></div>');

  return H.join('');
}

/* 岩層交界。每一欄的高度用座標算：0、3、6 px 三種，所以那一條是犬牙
   交錯的。一條直線會讓整張圖讀起來像表格，而它應該讀起來像地質。 */
function zoneSeam(classId, y, cy, above) {
  var H = [];
  for (var x = 0; x < DIG.W; x++) {
    var h = hash(classId + 'seam' + y + ',' + x) % 3;
    if (!h) continue;
    H.push('<div class="dig-seam ' + above.key + '" style="left:' +
      (MAP_L + x * DIG.CELL) + 'px;top:' + cy + 'px;height:' + (h * 3) + 'px"></div>');
  }
  return H.join('');
}

/* 這一格的岩層裡有什麼。用班級與座標算，不擲骰子——
   每次重畫石頭都跳一次的話，那就不是一個地方。 */
function mapProp(classId, x, y, z) {
  var p = propFor(classId + 'map', y * DIG.W + x, z.key);
  var g = MAP_PX[p];
  if (!g) return '';
  var h = hash(classId + 'p' + x + ',' + y);
  return '<img class="px mp" src="' + pxSvg(g.px, z.pal) + '" alt="" style="left:' +
    (3 + h % 18) + 'px;bottom:' + (2 + (h >>> 5) % 12) + 'px">';
}

/* 「第一組 · 甲」在格子上方只放得下兩三個字。 */
function shortName(n) {
  var m = String(n).split('·');
  return (m[1] || m[0]).trim().slice(0, 4);
}

/* 點一組：看他們走到哪一層、封存過哪幾根。 */
ACTS.digteam = function (id) { DRAFT.dt = id; render(); };

function digTeamCard(classId) {
  if (!DRAFT.dt) return '';
  var t = teamOf(DRAFT.dt);
  if (!t) return '';
  /* 他們留下的記號，深的在前面。石片併進記號之後這裡排的就是記號——
     名字跟天數本來掛在石片上，現在掛在記號上。 */
  var ks = Object.keys(t.builds || {}).map(function (bk) {
    var d = Number(bk.slice(1));
    var kp = null;
    keepsOf(t.teamId).forEach(function (x) { if (x.runId === t.builds[bk].runId) kp = x; });
    return { d: d, def: buildDef(t.builds[bk].k), keep: kp };
  }).filter(function (x) { return x.def; }).sort(function (a, b) { return b.d - a.d; });
  var z = strataAt(depthOf(t.teamId), t.teamId);
  var H = ['<div class="card dtcard fa ' + z.key + '">'];
  H.push('<div class="radar-head">');
  H.push(pxTag(signOf(t.teamId).px, signOf(t.teamId).pal, 'sign-s'));
  /* 大的是專案名，不是組名——跟剖面圖上的欄頭同一個層級。 */
  H.push('<b>' + esc(t.project || '（還沒定）') + '</b>');
  H.push('<span class="dim">' + esc(t.name) + '</span>');
  H.push('<span class="sp"></span>');
  H.push('<span class="dim">' + esc(z.name) + '</span>');
  H.push('</div>');
  if (ks.length) {
    H.push('<div class="rack">');
    ks.forEach(function (k) {
      var kz = strataAt(k.d, t.teamId);
      H.push('<button class="rk" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'seeb:' + t.teamId + ',' + k.d })) + '\'>');
      H.push(pxTag(k.def.px, kz.pal, 'core'));
      H.push('<b>' + esc((k.keep && k.keep.name) || k.def.name) + '</b>');
      H.push('<span>' + ((k.keep && k.keep.elapsed) || 0) + ' 天</span>');
      H.push('</button>');
    });
    H.push('</div>');
  }

  /* ── 他們的紀錄 ──

     點進一組，該看到的是這個。本來這裡只有招牌跟他們留下的東西——
     那是他們的裝飾，不是他們的紀錄。

     一列＝一趟：任務、說幾天、實際幾天、準不準。
     不放老師回的話，也不放他們寫的困境——那兩樣是他們跟老師之間的事。
     放的是兩個數字跟一個他們自己取的名字，跟你自己那一頁一樣的東西。 */
  var mine = runsFor(t.teamId).filter(function (x) { return x.run.stamp; }).reverse();
  if (mine.length) {
    H.push('<div class="eyebrow" style="margin-top:14px">走過 ' + mine.length + ' 趟</div>');
    H.push('<div class="orec">');
    mine.forEach(function (x) {
      var r = x.run;
      var s = RULES.STAMPS[r.stamp];
      var kp = null;
      keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });
      H.push('<div class="or ' + r.stamp + '">');
      H.push('<span class="or-s">' + (s ? stampPx(s.key) : '') + '</span>');
      H.push('<b>' + esc(x.ms ? x.ms.title : '') + '</b>');
      H.push('<span class="or-n">說 <b>' + r.est + '</b>　實際 <b>' +
        (r.actual || 0) + '</b></span>');
      if (kp && kp.name) H.push('<span class="or-w">「' + esc(kp.name) + '」</span>');
      H.push('</div>');
    });
    H.push('</div>');
  } else if (!ks.length) {
    H.push('<p class="dim">還沒走完過一趟。</p>');
  }

  H.push('</div>');
  return H.join('');
}

/* ---------- 挑要蓋什麼 ----------

   打通完那一格之後跳出來的三選一。這是本來的「三選一裝備」搬過來的位置，
   但東西換了：裝備沒有地方去，蓋的東西有——它就站在你剛打通的那一格上，
   而且全班都看得到。

   三個選項是那一層的全部，沒有強弱，只差在長相。 */
function buildPick(t) {
  var d = unbuiltDepth(t.teamId);
  if (d < 0) return '';
  var z = strataAt(d, t.teamId);
  var set = offerAt(t.teamId, d);
  if (!set.length) { DRAFT.build = null; return ''; }
  var H = ['<div class="card bpick fa ' + z.key + '">'];
  H.push('<h2 class="bp-h">在這一層留下什麼</h2>');
  /* 這一句是新接上的機制，不是氣氛：接口決定誰找得到你留的東西。 */
  H.push('<p class="bp-sub">插下去會敲開石頭。接口決定誰找得到它。</p>');

  /* 上一層留下的向下口就是這一層的題目。畫出來就好，不用寫一句話說明——
     接得起來的那幾個上面會亮一段。 */
  var above = portAbove(t.teamId, d);
  if (above) {
    H.push('<div class="bp-above">');
    H.push(pxTag(above.px, BUILD_PAL, 'bp-ax'));
    H.push('<span class="bp-drop"></span>');
    H.push('</div>');
  }

  H.push('<div class="bp-row">');
  set.forEach(function (b) {
    var fit = above && b.port.indexOf('u') >= 0;
    H.push('<button class="bp' + (fit ? ' fit' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'bld:' + b.key + ',' + d })) + '\'>');
    /* 兩個口畫在上下兩緣。有就是一段亮的，沒有就是空的。 */
    /* 深色剪影要有亮的地面才看得見，而那塊地面剛好就是它蓋好之後
       在剖面圖上站的地方——所以這張卡同時是預覽。 */
    H.push('<span class="bp-ground">');
    H.push('<i class="bp-p u' + (b.port.indexOf('u') >= 0 ? ' on' : '') + '"></i>');
    H.push(pxTag(b.px, BUILD_PAL, 'bp-px'));
    H.push('<i class="bp-p dn' + (b.port.indexOf('d') >= 0 ? ' on' : '') + '"></i>');
    H.push('</span>');
    H.push('<b>' + esc(b.name) + '</b>');
    /* 誰找得到。三個都會被碰到，差的只是被誰——沒有強弱。 */
    H.push('<i>' + (b.port === 'ud' ? '兩邊都找得到'
      : b.port === 'u' ? '上面的人找得到' : '下面的人找得到') + '</i>');
    H.push('</button>');
  });
  H.push('</div>');
  H.push('</div>');
  return H.join('');
}

/* 點地圖上一座建築：那是哪一趟。

   這是整件事的重點。建築不是獎品，是那一趟的紀念碑——
   點下去看到的是他們自己取的名、幾天、他們說幾天。
   所以整片領土就是他們的預估史被畫成一個地方。 */
function buildCard(t) {
  if (!DRAFT.sb) return '';
  var p = DRAFT.sb;
  var st = buildStory(p[0], Number(p[1]));
  if (!st || !st.def) return '';
  var tm = teamOf(p[0]);
  var z = strataAt(Number(p[1]), p[0]);
  var k = st.keep;
  var H = ['<div class="card bstory ' + z.key + '">'];
  H.push('<div class="bs-in">');
  /* 點開來看到的是那一趟長成的樣子：一天兩列，來過是實心、
     說了沒動是空心、沒有紀錄是斷的。這一份本來是另一個東西（石片），
     跟記號一樣一趟一個——併進來了。 */
  if (k) H.push(pxTag(k.px || coreOf(k.runId), z.pal, 'bs-core'));
  else H.push(pxTag(st.def.px, BUILD_PAL, 'bs-px'));
  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(tm ? tm.name : '') + '　·　' + esc(st.def.name) + '</div>');
  if (k && k.name) H.push('<h2>' + esc(k.name) + '</h2>');
  if (st.run) {
    H.push('<dl class="rep">');
    H.push('<dt>他們說</dt><dd>' + st.run.est + '</dd>');
    H.push('<dt>實際</dt><dd>' + (st.run.actual || (k && k.elapsed) || 0) + '</dd>');
    H.push('</dl>');
  }
  if (k && k.moved) {
    H.push('<div class="corekey">');
    H.push('<span><b class="c1"></b>來過 ' + k.moved + ' 天</span>');
    if (k.rested) H.push('<span><b class="c2"></b>說沒動 ' + k.rested + ' 天</span>');
    if (k.blank) H.push('<span><b class="c3"></b>沒有紀錄 ' + k.blank + ' 天</span>');
    H.push('</div>');
  }
  H.push('</div></div></div>');
  return H.join('');
}

/* ---------- 這一格裡有什麼 ----------

   打通之後、挑要蓋什麼之前，先看到裡面的東西。
   這是這個系統唯一「你不知道會遇到什麼」的地方——
   本來每一格都是空的，打通就只是變色。

   準跟失準看到的不一樣，但拿到的一樣多：那一格、那座建築、那根岩心、
   那一筆圖鑑，兩邊都有。差的是你到得早不早——早，牠還在；
   晚，你看到的是牠留下的痕跡。沒有人被扣任何東西。 */
function uncoverCard(t) {
  var r = DRAFT.uncover;
  if (!r) return '';
  var d = buriedDef(r.k);
  if (!d) return '';
  /* DRAFT.build 是那一層的深度。本來是格子地圖的 [x, y]。 */
  var z = strataAt(Number(DRAFT.build) || 0, t.teamId);

  var H = ['<div class="card unc ' + z.key + (r.early ? '' : ' late') + '">'];
  H.push('<div class="unc-in">');

  /* 圖：遇到什麼就畫什麼。沒有圖的就畫那一層的紋理。 */
  if (r.mob) {
    var mo = null;
    allFauna().forEach(function (f) { if (f.n === r.mob) mo = f; });
    if (mo) H.push('<span class="pxwrap">' + pxTag(mo.px, z.pal, 'unc-px' + (r.early ? '' : ' gone')) +
      pxFlash(mo.px) + '</span>');
  } else if (r.build) {
    var bd = buildDef(r.build);
    if (bd) H.push('<span class="pxwrap">' + pxTag(bd.px, BUILD_PAL, 'unc-px' + (r.early ? '' : ' gone')) +
      pxFlash(bd.px) + '</span>');
  } else {
    H.push('<div class="unc-px ' + z.key + ' blank"></div>');
  }

  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(z.name) + '　·　這一格裡</div>');
  H.push('<h2>' + esc(r.mob || (r.build && buildDef(r.build).name) || d.n) + '</h2>');
  H.push('<p class="lead">' + esc(r.early ? d.here : d.late) + '</p>');
  /* 是誰留的、哪一趟、走了幾天。系統不編故事——
     這幾個字全部是別組自己打的。 */
  if (r.by) {
    H.push('<p class="unc-by">' + esc(r.by) +
      (r.trip ? '　·　' + esc(r.trip) : '') +
      (r.days ? '　·　' + r.days + ' 天' : '') + '</p>');
  }
  if (r.say) H.push('<p class="quote">' + esc(r.say) + '</p>');
  H.push('</div></div></div>');
  return H.join('');
}


/* ===== 67-battle.js ===== */
/* ---------- 交出去的那一場 ----------

   這是整條流程最有份量的一下，本來按了「上」就直接跳判定。

   ── 兩階段的問答 ──

   那兩問不是新發明的：它們本來就在交出去那一頁上，只是躺在兩張卡片裡
   沒有份量。搬進戰鬥之後它們變成兩下攻擊——

     第一問　這一趟做完了哪幾段？      （老師分的段，勾掉做完的）
     第二問　這一趟走得怎麼樣？        （哪一段比想的久、卡在哪裡、
                                        進度如何——後兩題自己寫）

   第二問是全系統唯一的自由書寫。它跟「零輸入框」不衝突：當初擋的是
   「系統先替他們定義一份詞表」，自己寫的字剛好是那件事的相反。

   答完一問打牠一下。牠會退、會閃、會抖，但不會倒——
   倒下是最後那一句「你說 N 天，實際走了 M 天」才發生的事。
   那個順序有意義：真正決定結果的是那兩個數字，不是問答。

   ── 結果是算好的，不是打出來的 ──

   整場沒有任何操作會改變結果。答什麼、跳不跳過，判定都一樣——
   它由 RULES.judge(est, actual) 決定，而那一支只讀兩個數字。
   一旦讓玩家的操作影響結果，這個系統就開始獎勵「會玩」而不是「估得準」。

   ── 逃跑 ──

   填到一半發現寫不出來，可以走。那不是認輸：做到一半發現做不完是真的
   會發生的事，而承認它比硬交出去好。角色往回跑出畫面，然後回到「說幾天」。

   誠實的部分是退出去不等於擦掉——那一趟留著當紀錄（確實承諾了幾天、
   確實走了幾天），但沒有判定，所以不會進那根尺。可以擦掉的話，
   每個人都會在快超時的時候退一次，這個系統就再也量不到任何東西。

   ── 畫面 ──

   照舊版寶可夢排：牠在右上、你在左下（背影）、各自一塊站台、
   名牌帶一條斜出去的尾線、底下左邊字幕框右邊選單。
   那個年代畫面能力低，靠的全是輪廓與對比——剛好跟這個作品的規矩一致。 */

var BT = { timers: [] };

function battleStop() {
  BT.timers.forEach(function (t) { clearTimeout(t); });
  BT.timers = [];
}

function btAt(ms, fn) { BT.timers.push(setTimeout(fn, ms)); }

/* 這一趟走到第幾段。'menu' → 'q1' → 'q2' → 'play'。
   老師沒分段就跳過第一問。 */
function btPhase(r) {
  if (r.state !== 'running') return 'play';
  var ph = S.p.ph;
  if (!ph) return 'menu';
  if (ph === 'q1' && !stepsOf(r.runId)) return 'q2';
  return ph;
}

PAGES.battle = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var mob = mobOfRun(r);
  var zone = strataAt(depthOf(t.teamId), t.teamId);
  var est = r.est || 1;
  var ph = btPhase(r);

  var H = ['<div class="bt ' + zone.key + ' at-' + ph + '" data-run="' +
    esc(r.runId) + '">'];

  /* 遭遇：整個畫面閃一次再進場。 */
  H.push('<div class="bt-wipe"></div>');

  /* ── 牠 ──
     名牌上只有名字。這一趟實際幾天要等到最後才報出來，那是懸念。 */
  H.push('<div class="bt-side foe">');
  H.push(btPlate(esc(mob.n), 'foe', ''));
  H.push('<div class="bt-pad"></div>');
  H.push('<div class="bt-ch foe">' + pxTag(mob.px, zone.pal, 'bt-px') +
    pxFlash(mob.px) + '</div>');
  H.push('</div>');

  /* ── 你 ──
     自己那一張從一開始就寫著承諾幾天——那是他本來就知道的事。 */
  H.push('<div class="bt-side me">');
  H.push('<div class="bt-pad"></div>');
  H.push('<div class="bt-ch me">' + pxTag(HERO.back, HERO.pal, 'bt-px') +
    heroPack(t.teamId) + '</div>');
  H.push(btPlate(esc(shortName(t.name)), 'me', '說 ' + est + ' 天'));
  H.push('</div>');

  H.push('</div>');

  /* ── 下面那一條 ──
     舊版寶可夢的排法：左邊字幕框、右邊選單。 */
  H.push('<div class="bt-bottom">');
  H.push('<div class="bt-say"><i class="bt-arrow"></i><b id="btline">' +
    esc(btLine(r, mob, ph)) + '</b></div>');

  if (ph === 'menu') {
    H.push('<div class="bt-menu">');
    H.push(btChoice('btgo:' + r.runId, '上', 'go'));
    H.push(btChoice('btback:' + r.runId, '還沒好', ''));
    H.push('</div>');
  }
  H.push('</div>');

  /* ── 問答 ──
     兩問都接在字幕框底下，答完打牠一下。 */
  if (ph === 'q1' || ph === 'q2') {
    H.push('<div class="bt-q">');
    H.push(ph === 'q1' ? btSteps(r.runId) : btAsk(r));
    H.push('<div class="bt-menu wide">');
    H.push(btChoice('bt' + ph + ':' + r.runId, '打過去', 'go'));
    H.push(btChoice('btback:' + r.runId, '還沒好', ''));
    H.push('</div></div>');
  }

  return H.join('');
};

/* 字幕框那一句。 */
function btLine(r, mob, ph) {
  if (ph === 'menu') return mob.n + ' 出現了！';
  if (ph === 'q1') return '這一趟做完了哪幾段？';
  if (ph === 'q2') return '這一趟走得怎麼樣？';
  return '你上前。';
}

/* 選單上的一行。舊版寶可夢的游標長在前面（見 58-battle.css）。 */
function btChoice(act, label, cls) {
  return '<button class="bm ' + cls + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: act })) + '\'>' + esc(label) + '</button>';
}

/* 第一問：老師分的段，勾掉做完的。 */
function btSteps(runId) {
  var sp = stepsOf(runId);
  if (!sp) return '';
  var H = ['<div class="steps-list">'];
  sp.all.forEach(function (x, i) {
    var on = sp.on.indexOf(i) >= 0;
    H.push('<button class="stp' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tick:' + runId + '|' + i })) + '\'>' +
      '<b></b><i>' + esc(x) + '</i></button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 第二問：這一趟走得怎麼樣。

   哪一段比想的久（點的）＋ 兩題自己寫的。兩題都選填——
   逼人打字會拿到為了交差而打的字，那一刻資料就開始說謊。

   輸入框跟 DRAFT 綁著、而且不重畫：重畫會把 innerHTML 換掉，
   打到一半的字會不見，游標也會跳掉。 */
function btAsk(r) {
  var H = [];
  if (stepNames(r.runId).length) {
    H.push('<div class="bt-qh">哪一段比你想的久</div>');
    H.push(overRow(r));
  }
  H.push('<div class="bt-qh">做的時候卡在哪裡嗎</div>');
  H.push('<textarea class="bt-w" rows="2" maxlength="300" ' +
    'oninput="DRAFT.hard=this.value" placeholder="' +
    esc('選填。沒有就空著。') + '">' + esc(draft('hard', '')) + '</textarea>');
  H.push('<div class="bt-qh">你覺得現在的進度如何</div>');
  H.push('<textarea class="bt-w" rows="2" maxlength="300" ' +
    'oninput="DRAFT.pace=this.value" placeholder="' +
    esc('選填。沒有就空著。') + '">' + esc(draft('pace', '')) + '</textarea>');
  return H.join('');
}

/* 名牌。照舊版寶可夢：名字在上，底下一行小字。
   那條斜出去的尾線是那個畫面最好認的一筆，在 CSS 裡。 */
function btPlate(name, side, note) {
  return '<div class="bt-plate ' + side + '">' +
    '<b>' + name + '</b>' +
    (note ? '<span class="bt-num">' + note + '</span>' : '') +
    '</div>';
}

/* 結局那一句。三種，而且三種都不拿走任何東西。 */
function btVerdict(r) {
  var est = r.est || 1;
  var act = r.actual || est;
  if (act < est) {
    return { key: 'early', line: '打敗了。你還有 ' + (est - act) + ' 天沒用完。' };
  }
  if (act === est) return { key: 'exact', line: '剛好打敗了。' };
  return { key: 'late', line: '打敗了，不過多花了 ' + (act - est) + ' 天。' };
}

/* ---------- 演一次 ----------

   render() 畫完之後呼叫。整場沒有輸入會改變結果，
   這裡只負責讓它花幾秒鐘發生。 */
function battleRun() {
  battleStop();
  if (S.page !== 'battle') return;
  var box = document.querySelector('.bt');
  if (!box) return;

  /* 黑幕用 JS 拿掉，不能只靠動畫收尾。動畫的時鐘會被凍住
     （背景分頁、省電、自動化瀏覽器），那時候黑幕會一直蓋著。 */
  var wipe = box.querySelector('.bt-wipe');
  if (wipe) btAt(460, function () { if (wipe.parentNode) wipe.parentNode.removeChild(wipe); });

  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return;
  var line = document.getElementById('btline');
  function say(s) { if (line) line.textContent = s; }

  /* 逃跑：角色往回跑出畫面，跑完才真的退出去。 */
  if (S.p.flee) {
    box.classList.add('flee');
    say('你退回去了。');
    btAt(850, function () {
      var t = myTeam();
      actRethink(t.teamId, r.runId);
      S.p = {};
      go('home', {});
    });
    return;
  }

  /* 答完一問打牠一下。牠會退、會閃、會抖，但不會倒。 */
  if (S.p.hurt) {
    S.p.hurt = 0;
    box.classList.add('hurt');
    btAt(560, function () { box.classList.remove('hurt'); });
  }

  var ph = btPhase(r);
  if (ph === 'menu') {
    btAt(900, function () {
      var bo = document.querySelector('.bt-bottom');
      if (bo) bo.classList.add('ready');
    });
    return;
  }
  if (ph !== 'play') return;

  var est = r.est || 1;
  var act = r.actual || est;

  /* 一 · 把這一趟報出來。這是整場唯一決定結果的東西。 */
  btAt(800, function () {
    say('你說 ' + est + ' 天，實際走了 ' + act + ' 天。');
    box.classList.add('told');
  });

  /* 二 · 牠被打敗。閃四下，然後往下滑出畫面——
     舊版寶可夢就是這樣做的：沒有爆炸，沒有粒子，就是滑下去。 */
  btAt(1900, function () {
    say(mobOfRun(r).n + ' 被打敗了！');
    box.classList.add('foe-out');
  });

  /* 三 · 演完直接換頁。不用再按一次。 */
  btAt(3200, function () { go('stamp', { id: r.runId }); });
}

/* 上：進第一問。老師沒分段就直接到第二問（見 btPhase）。 */
ACTS.btgo = function (id) {
  battleStop();
  S.p = { id: id, ph: 'q1' };
  render();
};

/* 第一問答完：打牠一下，進第二問。 */
ACTS.btq1 = function (id) {
  battleStop();
  S.p = { id: id, ph: 'q2', hurt: 1 };
  render();
};

/* 第二問答完：打牠一下，然後交出去。
   省思在看到判定之前存下來，所以它不是事後回頭解釋的。 */
ACTS.btq2 = function (id) {
  var t = myTeam();
  battleStop();
  actReflect(t.teamId, id, DRAFT.overs || [], DRAFT.hard, DRAFT.pace);
  if (!actSubmit(t.teamId, id, '')) return say('這一趟已經交過了。');
  DRAFT.overs = null; DRAFT.said = 0; DRAFT.hard = ''; DRAFT.pace = '';
  S.p = { id: id, ph: 'play', hurt: 1 };
  render();
};

/* 還沒好：角色往回跑出畫面，然後回到「說幾天」。 */
ACTS.btback = function (id) {
  battleStop();
  S.p = { id: id, flee: 1 };
  render();
};


/* ===== 68-rank.js ===== */
/* ---------- 排行榜 ----------

   這一支是刻意加進來、而且準備好隨時拿掉的。

   作品原本的立場是不排名（見 check.js 的禁用詞）。使用者以 RtD
   （research through design）為方法決定要做：東西做出來、放進去用、
   看實際發生什麼；評價不好就拿掉，而「拿掉」本身也是一個發現。

   要拿掉的話：刪掉這個檔案與 58-rank.css，再把 62-eco.js 裡那一行
   rankCard(...) 拿掉就好。沒有別的地方依賴它。

   ── 排什麼 ──

   排產出量會直接壞掉：做得多的組永遠在上面，而做得多跟做得好、跟
   專案管理學得如何都沒有關係，那只會獎勵灌水與過勞。

   這裡排的是「估得準不準」，因為它是這個系統裡唯一非零和的量：
     · 估準跟做多做少無關
     · 每一組可以同時很準——它不是有人上去就有人下來
     · 而且它正是這個系統在教的東西

   ── 為什麼是偏差率不是天數 ──

   用「準的範圍」判定會有一個漏洞：容差是 承諾 × 比例，所以把承諾灌大
   就自動變準。用偏差率（|實際 − 承諾| ÷ 承諾）就沒有這個問題——
   說 21 天做 3 天，偏差率是 86%，很難看。

   ── 三個護欄 ──

   一 · 只算最近三趟。名次要會流動，落後的追得上；算整學期的話
        前面幾趟失手的組就再也翻不了身，那正是排行榜最傷人的地方。
   二 · 可以自己選擇不上榜。自主性優先於排名。
   三 · 沒有分數、沒有獎勵、不影響任何判定。它純粹是一面鏡子。 */

var RANK_N = 3;   /* 只算最近三趟 */

/* 一組的平均偏差率。沒有判定過的趟就回 null。 */
function rankDev(teamId) {
  var rs = where('Runs', function (r) {
    return r.teamId === teamId && r.stamp && r.est > 0 && r.actual > 0;
  }).sort(function (a, b) { return (a.submittedAt || 0) - (b.submittedAt || 0); });
  if (!rs.length) return null;
  var use = rs.slice(-RANK_N);
  var sum = 0, hit = 0;
  use.forEach(function (r) {
    sum += Math.abs(r.actual - r.est) / r.est;
    if (r.stamp !== 'late') hit++;
  });
  /* hit 是寫出來給人看的：準了幾次。加法的講法——
     「你拿到了什麼」，不是「你錯了多少」。
     dev 只留著當平手時分先後，不寫出來。 */
  return { hit: hit, dev: sum / use.length, n: use.length };
}

/* 一個班的榜。沒有資料的排在最後，選擇不上榜的整個不出現。 */
function rankRows(classId) {
  var out = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    if (t.noRank) return;
    var d = rankDev(t.teamId);
    out.push({ teamId: t.teamId, name: t.name, dev: d ? d.dev : null,
      hit: d ? d.hit : 0, n: d ? d.n : 0 });
  });
  /* 先比準了幾次（多的在上面），平手才用偏差率分先後。
     平手會很多，那是好事——它讓這張榜比較不像一條隊伍。 */
  out.sort(function (a, b) {
    if (a.dev === null && b.dev === null) return 0;
    if (a.dev === null) return 1;
    if (b.dev === null) return -1;
    if (a.hit !== b.hit) return b.hit - a.hit;
    return a.dev - b.dev;
  });
  return out;
}

/* 上不上榜自己決定。 */
ACTS.norank = function () {
  var t = myTeam();
  t.noRank = t.noRank ? 0 : 1;
  save();
  say(t.noRank ? '不上榜了。' : '上榜了。');
};

function rankCard(classId, meId) {
  var rows = rankRows(classId);
  var me = meId ? teamOf(meId) : null;
  var has = rows.some(function (r) { return r.dev !== null; });

  var H = ['<div class="card rank">'];
  H.push('<div class="eyebrow">估得準　·　最近 ' + RANK_N + ' 趟</div>');
  /* 單位只在這裡說一次。
     本來每一列寫的是偏差率（13%、100%），沒有人那樣想事情——
     而且 100% 看起來像世界末日，其實只是「說 5 天走了 10 天」。 */
  H.push('<p class="rk-u">最近三趟，準了幾次</p>');

  if (!has) {
    H.push('<p class="dim">還沒有人交過。</p>');
    H.push('</div>');
    return H.join('');
  }

  H.push('<div class="rk-list">');
  rows.forEach(function (r, i) {
    var mine = r.teamId === meId;
    H.push('<div class="rk-r' + (mine ? ' mine' : '') + (r.dev === null ? ' none' : '') + '">');
    H.push('<i class="rk-i">' + (r.dev === null ? '·' : (i + 1)) + '</i>');
    H.push('<b>' + esc(shortName(r.name)) + '</b>');
    if (r.dev === null) {
      H.push('<span class="rk-d">還沒交過</span>');
    } else {
      /* 三顆點：準了幾次。實心是準的，空心是還沒。
         畫成點不畫成長條，因為長條會讀成「量」，而這裡是次數。 */
      H.push('<div class="rk-dots">');
      for (var k = 0; k < RANK_N; k++) {
        H.push('<b class="' + (k < r.hit ? 'on' : '') + '"></b>');
      }
      H.push('</div>');
      H.push('<span class="rk-d">' + (r.hit ? '準 ' + r.hit + ' 次' : '還沒準過') + '</span>');
    }
    H.push('</div>');
  });
  H.push('</div>');

  /* 上不上榜自己決定。這一條是這張榜唯一的出口，所以它一直在。 */
  if (me) {
    H.push('<button class="rk-out" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'norank' })) + '\'>' +
      (me.noRank ? '回到榜上' : '不要上榜') + '</button>');
  }
  H.push('</div>');
  return H.join('');
}


/* ===== 70-teacher.js ===== */
/* 老師端。

   他只做三件事，側欄就只有三格：

     發里程碑   要他們交什麼
     審核       他們交了，你看完勾一個「可以」
     各組進度   誰在哪、誰慢下來了

   他不決定期限（那是學生拉滑桿承諾的），不打分，也不挑裝備——
   勾完可以之後，學生自己從三件裡挑一件。少一件他要煩惱的事，
   就少一次「老師替我決定」的機會。 */

/* 老師走到哪一步了。有人等你看就是第三步，其餘看班上有沒有人在走。 */
function teacherStep(classId) {
  if (radar(classId).length) return 2;
  var running = where('Runs', function (r) { return r.state === 'running'; }).length;

/* 他們自己標的、他們自己說的。用的是老師分段時寫的詞，不是我列的選項。 */
function overTags(teamId, run) {
  var fl = (run.flags || []).map(function (i) { return stepName(run.runId, i); }).filter(Boolean);
  var ov = (run.overs || []).map(function (i) { return stepName(run.runId, i); }).filter(Boolean);
  if (!fl.length && !ov.length) return '';
  var H = ['<div class="tags small">'];
  if (fl.length) {
    H.push('<span class="k">承諾時標的</span>');
    fl.forEach(function (l) { H.push('<span class="tag static">' + esc(l) + '</span>'); });
  }
  if (ov.length) {
    H.push('<span class="k">後來說比想的久</span>');
    ov.forEach(function (l) { H.push('<span class="tag static hit">' + esc(l) + '</span>'); });
  }
  H.push('</div>');
  return H.join('');
}

/* 他們勾了哪幾段。老師自己分的，所以他讀得懂。 */
function stepTags(run) {
  var s = stepsOf(run.runId);
  if (!s) return '';
  var H = ['<div class="tags small"><span class="k">分段</span>'];
  s.all.forEach(function (x, i) {
    H.push('<span class="tag static' + (s.on.indexOf(i) >= 0 ? ' hit' : '') + '">' +
      esc(x) + '</span>');
  });
  H.push('</div>');
  return H.join('');
}

  /* 這一句本來寫「學生每天可以點今天動的是哪一段」——那個機制早就拿掉了。
     現在分段真正會發生的是：交出去的時候被問哪幾段做完了、哪一段比想的久。 */

  });

     本來一個一張卡，還帶著注意事項與每一組承諾幾天的標籤——
     派了十個就是十張卡，而老師在這一頁要做的只有「再派一個」。 */
  H.push('<div class="card"><div class="rec-list">');
  list.forEach(function (m) {
    var got = where('Runs', function (r) { return r.msId === m.msId; });
    var done = got.filter(function (r) { return r.state === 'done'; }).length;
    H.push('<div class="msr">');

      '</span>');

    /* 各組承諾了幾天。這是老師唯一看得到的「他們怎麼想這件事」，
       所以留著——但不用標籤的樣子，壓成一行小字。 */
    if (got.length) {
      H.push('<div class="msr-e">');
      got.forEach(function (r) {
        var tm = teamOf(r.teamId);
        H.push('<i>' + esc(tm ? shortName(tm.name) : '') + ' <b>' + r.est + '</b>' +
          (r.actual ? '→<b>' + r.actual + '</b>' : '') + '</i>');
      });
      H.push('</div>');
    }
    H.push('</div>');
  });
  H.push('</div></div>');
  return H.join('');
};

  var pw = (document.getElementById('nu-pw') || {}).value || '';
  var kl = find('Classes', function (c) { return c.classId === rsClassId(); });
  var r = actRegister({
    account: acc, password: pw, name: name, role: role,
    code: kl ? kl.joinCode : ''
  });
  if (r.err) return say(r.err);
  /* 老師要跟班綁在一起，不然他打開來看不到任何一組 */
  if (role === 'teacher' && kl && !kl.teacherId) { kl.teacherId = r.user.userId; save(); }
  say((role === 'teacher' ? '老師' : '研究者') + '帳號好了。請他用這個密碼登入之後自己換掉。');
};

ACTS.respw = function (userId) {
  var pw = (document.getElementById('nu-pw') || {}).value || '';
  if (!pw.trim()) return say('先在上面那格「先給一個密碼」寫一個新的，再按重設。');
  var r = actResetPw(userId, pw.trim());
  if (r.err) return say(r.err);
  say(userOf(userId).name + ' 的密碼換成你寫的那一個了。');
};

ACTS.deluser = function (userId) {
  if (DRAFT.del !== userId) {
    DRAFT.del = userId;
    return say('再按一次「刪除」就真的刪掉 ' + userOf(userId).name + ' 的帳號。');
  }
  var name = userOf(userId).name;
  var r = actDeleteUser(userId);
  DRAFT.del = null;
  if (r.err) return say(r.err);
  if (userId === S.who) return ACTS.logout();
  render();
  say(name + ' 的帳號刪掉了。他認領過的名字放回名冊上了。');
};

ACTS.saveroster = function () {
  var v = (document.getElementById('rt') || {}).value || '';
  var r = actSaveRoster(rsClassId(), v);
  if (r.err) { DRAFT.rt = v; return say(r.err); }
  DRAFT.rt = '';
  render();
  say('存好了，補上 ' + r.added + ' 個名字。');
};

ACTS.unclaim = function (rosterId) {
  var r = actUnclaim(rosterId);
  if (r.err) return say(r.err);
  render();
  say('解開了。那個人重新登入之後可以再點一次。');
};

ACTS.csv = function () {
  var name = '專案地下城-紀錄.csv';
  try {
    /* BOM，不然 Excel 開起來中文是亂碼 */
    var blob = new Blob(['﻿' + exportCsv(rsClassId())], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('存成 ' + name + ' 了。');
  } catch (e) {
    say('這個瀏覽器不給存檔。上面那格的字全選複製也一樣。');
  }
};

/* ===== 99-audit.js ===== */
/* 兩端一起檢查。貼進瀏覽器的 console 就會裝上 AUDIT()。

   為什麼要有這一支：這個作品的畫面改得很密，而預覽窗只有一種寬度，
   所以只看一端的話另一端壞掉不會有人發現。實際發生過兩次——
   桌機那條 flex 版面本來是白名單制，後來加的元素全部縮成一小塊；
   承諾那一頁用到的兩支函式被誤刪，整頁是壞的，而手機端看不出來。

   用法：AUDIT() 跑完目前寬度的全部頁面。換寬度再跑一次。
   會略過因為行長而收窄的（max-width 不是 none）——那是排版該做的事。 */
window.AUDIT = function () {
  var t = myTeam(), cls = t.classId;
  var done = where('Runs', function (r) { return r.teamId === t.teamId && r.stamp; })[0];
  var run = where('Runs', function (r) { return r.teamId === t.teamId && r.state === 'running'; })[0];
  var ms = where('Milestones', function (m) { return m.classId === cls; })[0];
  var P = [['home', {}], ['commit', { id: ms.msId }], ['battle', { id: (run || done).runId, at: 'end' }],
           ['stamp', { id: done.runId }], ['pick', { id: done.runId }],
           ['pack', {}], ['codex', {}],
           ['eco', {}], ['exit', {}], ['sign', {}]];
  var out = [];
  P.forEach(function (pp) {
    try {
      /* 頁面不存在的話 render() 會退回首頁，那會變成假通過。 */
      if (!PAGES[pp[0]]) { out.push(pp[0] + ' ✗ 這一頁不存在'); return; }
      S.page = pp[0]; S.p = pp[1]; S.flash = null; render();
      var de = document.documentElement;
      var w = document.querySelector('.wrap'), wr = w.getBoundingClientRect();
      var bad = [];
      if (de.scrollWidth > de.clientWidth + 2) {
        bad.push('橫向溢出 ' + de.scrollWidth + '>' + de.clientWidth);
      }
      [].forEach.call(w.children, function (e) {
        var cs = getComputedStyle(e), b = e.getBoundingClientRect();
        if (cs.display.indexOf('inline') === 0) return;
        if (cs.maxWidth !== 'none') return;
        if (e.classList.contains('btn') || e.classList.contains('quiet')) return;
        if (b.width > 0 && b.width < wr.width * 0.55) {
          bad.push('窄:' + (e.className || e.tagName).slice(0, 14) + '=' + Math.round(b.width));
        }
        if (b.right > wr.right + 4) bad.push('超出:' + (e.className || e.tagName).slice(0, 14));
      });
      if (!document.querySelectorAll('.nav a, .nav button').length) bad.push('沒導覽');
      out.push(pp[0] + (bad.length ? ' ✗ ' + bad.join(' / ') : ' ✓'));
    } catch (e) { out.push(pp[0] + ' ERR ' + e.message); }
  });
  S.page = 'home'; S.p = {}; render();
  return out.join('　');
};

/* ---------- 把動畫推到任意一格 ----------

   為什麼要有這一支：自動化瀏覽器不會推進動畫的時鐘，所以動畫做出來
   我看不到，只能等使用者看到不對再回報。那個迴圈不該由使用者跑。

   STEP(ms) 把畫面上每一段動畫都設到第 ms 毫秒並暫停，然後就可以截圖。
   要看整段就 STEP(0)、STEP(300)、STEP(900) 一格一格看。

   PLAY() 放開，讓它們照常跑。 */
window.STEP = function (ms) {
  var a = document.getAnimations();
  for (var i = 0; i < a.length; i++) {
    try { a[i].currentTime = ms; a[i].pause(); } catch (e) {}
  }
  return ms + 'ms　' + a.length + ' 段動畫';
};

window.PLAY = function () {
  var a = document.getAnimations();
  for (var i = 0; i < a.length; i++) { try { a[i].play(); } catch (e) {} }
  return a.length + ' 段動畫放開了';
};
