/* ---------- 這幾天你動過哪幾天 ----------

   每天要按的那一版拿掉之後，這一份資料本來就會不見。改成在交出去那一頁
   一次補齊：一格一天，點一下切換「動過／沒動」。

   它不進判定，所以標不標、標得準不準，都不會改變任何結果——
   也因此沒有說謊的理由。它唯一影響的是那一趟長成什麼樣子的岩心。 */
function dayGrid(runId) {
  var log = dayLog(runId);
  var H = ['<div class="dgrid">'];
  log.forEach(function (d, i) {
    var on = d && d.kind === 'move';
    H.push('<button class="dg' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'mark:' + runId + '|' + i })) + '\'>' +
      '<b>' + (i + 1) + '</b></button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 全班怎麼看這一個任務。匿名——只有天數，沒有誰是誰。
   要的是「我是不是低估了」，不是「誰比較快」。 */
function spreadBar(sp, mine) {
  var hi = Math.max(sp.hi, Number(mine) || 0, RULES.EST_MIN);
  var H = ['<div class="spread">'];
  for (var i = 1; i <= hi; i++) {
    var n = 0;
    sp.all.forEach(function (d) { if (d === i) n++; });
    H.push('<span class="sp-c' + (i === Number(mine) ? ' me' : '') + '">' +
      '<b style="height:' + (n ? 11 + n * 11 : 3) + 'px"></b>' +
      '<i>' + i + '</i></span>');
  }
  H.push('</div>');
  return H.join('');
}


/* 按一下之後只改這幾塊：大數字、兩顆鍵的明暗、尺上「你現在說的」
   那一列、底下走廊的格數、承諾那一顆上的天數。

   位置的算法要跟 estAxis 裡的 at() 完全一樣，不然按到一半會偏。
   不整頁重畫，是因為重畫會把焦點從那一顆鍵上拿走——連按第二下
   就得再瞄準一次。 */
/* ---------- 說幾天：兩顆鍵 ----------

   一按一天。到頭了那一顆就暗下去——不擋，只是讓他知道到頭了。
   數字在中間，是這一頁最大的一個字，因為它是這一頁唯一的內容。 */
function estStep(est) {
  function k(d, s, cls, off) {
    return '<button class="es-b ' + cls + (off ? ' off' : '') +
      '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'estep:' + d })) + '\'>' + s + '</button>';
  }
  return '<div class="estep">' +
    k(-1, '−', 'es-m', est <= RULES.EST_MIN) +
    '<div class="es-n"><b>' + est + '</b><span>天</span></div>' +
    k(1, '＋', 'es-p', est >= RULES.EST_MAX) +
    '</div>';
}

function estLive(n) {
  var lo = RULES.EST_MIN, hi = RULES.EST_MAX, span = hi - lo;
  function at(d) {
    return ((Math.max(lo, Math.min(hi, d)) - lo) / span * 100) + '%';
  }
  var b = RULES.band(n);
  function set(sel, fn) {
    var e = document.querySelector(sel);
    if (e) fn(e);
  }
  set('.es-n b', function (e) { e.textContent = n; });
  set('.es-m', function (e) {
    e.className = 'es-b es-m' + (n <= RULES.EST_MIN ? ' off' : ''); });
  set('.es-p', function (e) {
    e.className = 'es-b es-p' + (n >= RULES.EST_MAX ? ' off' : ''); });
  set('.ax-now .ax-ok', function (e) {
    e.style.left = at(n - b);
    e.style.right = (100 - parseFloat(at(n + b))) + '%';
  });
  set('.ax-now .ax-me', function (e) { e.style.left = at(n); });
  set('.cm-go', function (e) { e.textContent = '我承諾 ' + n + ' 天'; });

  /* 底下那條走廊。整塊換掉沒關係——滑桿不在裡面。 */
  var ew = document.querySelector('.ew');
  if (ew && typeof myTeam === 'function') {
    var t = myTeam();
    var m = S.p && S.p.id ? msOf(S.p.id) : null;
    if (t && m) ew.innerHTML = estWalkIn(t, m, n);
  }
}

/* ---------- 承諾那一根尺 ----------

   「你前幾趟」跟「你要說幾天」量的是同一個單位。
   本來畫在兩張卡上，使用者得自己在腦袋裡疊起來——
   那正是資訊圖像化應該替他做掉的事。畫在同一根尺上。

   這裡本來還有第三條：別組在同一個任務上說了幾天。拿掉了。
   兩個理由，第二個比較重要：

     一 · 每一組的專案不一樣。「訪三個人」對兩組可能差三倍，
          別人的天數不構成參考。

     二 · 它會污染這個系統唯一在量的東西。那條帶子出現在按下承諾
          之前、就在滑桿正下方——看到「別組落在 4 到 8」再去拉自己
          那一根，拉出來的已經不是你的預估，是被錨定過的預估。
          整個作品的軸是「把被評價的對象換成自己的預估」；
          如果那個預估是抄來的，軸就空了。

   看得出來的東西沒有一句話在解釋：
     你前幾趟的空心點是說的、實心點是實際的，線往右＝低估
     亮的那一條是你現在拉到的地方，淺色那一塊是準的範圍 */
function estAxis(est, past) {
  var lo = RULES.EST_MIN, hi = RULES.EST_MAX, span = hi - lo;
  function at(d) {
    return ((Math.max(lo, Math.min(hi, d)) - lo) / span * 100) + '%';
  }
  var b = RULES.band(est);
  var H = ['<div class="axis">'];

  /* 滑桿拿掉了，換成上面那兩顆加減鍵（見 estStep）。
     這裡只剩看的部分：你前幾趟、你現在說的、準的範圍。 */
  H.push('<div class="ax-in">');


  /* 你前幾趟：空心＝說的，實心＝實際的。線往右就是低估。 */
  (past || []).forEach(function (x) {
    var e = x.run.est, a = x.run.actual || e;
    var l = Math.min(e, a), r = Math.max(e, a);
    H.push('<div class="ax-row ax-past">');
    H.push('<div class="ax-link" style="left:' + at(l) + ';right:' +
      (100 - parseFloat(at(r))) + '%"></div>');
    H.push('<b class="ax-said" style="left:' + at(e) + '"></b>');
    H.push('<b class="ax-was' + (a > e ? ' over' : '') + '" style="left:' +
      at(a) + '"></b>');
    H.push('</div>');
  });

  /* 你現在拉到的地方，跟準的範圍。 */
  H.push('<div class="ax-row ax-now">');
  H.push('<div class="ax-ok" style="left:' + at(est - b) + ';right:' +
    (100 - parseFloat(at(est + b))) + '%"></div>');
  H.push('<b class="ax-me" style="left:' + at(est) + '"></b>');
  H.push('</div>');

  /* 尺。只標三個數字，多了就變成一張表。 */
  H.push('<div class="ax-ruler">');
  [lo, Math.round((lo + hi) / 2), hi].forEach(function (d) {
    H.push('<i style="left:' + at(d) + '">' + d + '</i>');
  });
  H.push('</div>');

  H.push('</div></div>');
  return H.join('');
}

/* ===== 60-student.js ===== */
/* 學生端。

   一頁只給一個動作。首頁就是廊道本身——招牌、角色、迷霧、魔物，
   底下一排他們自己寫的東西。其餘都是資訊，不是選項。

   兩條原則，這一版收得比之前緊：

   一 · 系統不定義他們在做什麼。
        每天點的那幾段、承諾時標的那幾段、營火說的那幾段，全部來自
        同一個地方：老師分段時寫的那幾行。系統一個字都沒有列。
        老師沒分段也走得完：推進那一顆鍵退回「我今天來過了」。

   二 · 介面不解釋自己。
        本來每一張卡底下都有一段我寫的說明（「這一下就是推進，不用再
        按第二顆」）。那是系統在替使用者讀畫面。能畫出來的就畫出來——
        承諾與實際畫成兩條尺（見 56-viz.js），停滯畫成畫面暗下來，
        走過的日子畫成廊道上的火把。剩下的字只有兩種：他們自己的詞，
        跟系統記到的數字。 */

/* ---------- 廊道（首頁） ---------- */
/* ---------- 首頁 ----------

   YouTube 的首頁放的是別人的影片，但它的主流程是把影片放上去。
   打開它的理由是別人，留下來的理由才是自己。

   本來反過來：首頁是自己的廊道，別人在另一個分頁裡當背景。
   一個人的東西看兩次就沒了，所以沒有理由在不必要的時候打開它。

   現在：上面一條是你手上這一趟（狀態、幾段、兩條尺、那一顆鍵），
   底下是全班最近發生的事，一則一則往下。

   廊道那一整片場景搬到班級地下城了——世界該是全班共用的，
   不是他一個人的背景。 */
/* ---------- 首頁 ----------

   層級：
     主功能  廊道 ＋ 那一顆鍵。大、在最上面、是遊戲的樣子。
     副功能  廊道底下那三個小圖示（營火、出口、招牌）。
     別人    全班最近。打開這個系統的理由，但不是主功能，所以在底下。

   YouTube 的首頁放的是別人的影片，主流程卻是把影片放上去——
   那句話講的是層級，不是「拿掉自己的東西」。 */
PAGES.home = function () {
  var t = myTeam();
  var next = nextThing(t.teamId);
  var st = stallOf(t.teamId);
  var row = next.row;
  var r = row && row.run && row.run.runId ? row.run : null;

  var H = [];

  /* ── 主功能：廊道。這不是裝飾，是「說幾天 → 交出去」被畫出來的樣子。 ── */
  /* 回來的時候先說一句不在的這幾天發生了什麼。
     只在真的隔了一天以上出現，而且只報真的發生過的事。 */
  var aw = awayOf(S.who);
  if (aw) {
    H.push('<div class="away">');
    H.push('<b>' + aw.days + '</b><span>天過去了</span>');
    if (aw.left !== null) {
      H.push(aw.left > 0 ? '<b>' + aw.left + '</b><span>天到期</span>'
        : '<em>已經超過你說的天數</em>');
    }
    if (aw.cells) H.push('<b>' + aw.cells + '</b><span>全班新留的</span>');
    if (aw.okd) H.push('<em class="ok">老師勾了 ' + aw.okd + ' 件</em>');
    H.push('</div>');
  }

  /* 老師勾了。不用按任何東西——記號已經插進那一層了。
     這裡只把他那一句話擺在面前，因為那是整條流程裡唯一
     「別人為你做了一件事」的時刻。 */
  okSince(t.teamId, SEEN_CUT).forEach(function (r) {
    var m = msOf(r.msId);
    H.push('<div class="okcard">');
    H.push('<div class="eyebrow lit">老師勾了</div>');
    H.push('<b class="ok-big">確認已完成任務，你的專案又在前進了一頁</b>');
    H.push('<em class="ok-sub">完成進度已疊加至班級地下城內</em>');
    /* 拿到的那一張。它就是這一刻本身變成的東西——老師審核過了的證明，
       名字是那一件任務，圖鑑裡收著。

       任務名本來上面還單獨寫一行，拿掉了：這一句已經帶著它，
       同一個名字在同一張卡上出現兩次，其中一次就是雜訊。 */
    H.push('<span class="ok-cert">獲得「' + esc(m ? m.title : '') +
      '」的任務之證</span>');
    /* 他那一句話擺在最下面，而且是這一整張上唯一的人話。 */
    if (r.word) H.push('<p class="quote big">' + nl(r.word) + '</p>');
    H.push('</div>');
  });

  /* 三扇門。本來在整頁最底下、在走過的那一條帶子後面——它們是
     「這個世界裡有什麼」，不是「我剛剛做了什麼」，放在最後等於
     要滑到底才看得到。 */
  H.push(deskRow(t, next));

  /* 這一圈走到哪。死線勇者一直讓你知道現在是專注還是休息，
     那個迴圈才會上癮。 */
  H.push(beatBar(next, t));

  /* ── 自己那條廊道 ──

     打開來第一眼要是不用學就懂的東西。廊道不用學：一條走廊、
     一個人走在上面、水從後面漫過來。地圖要讀得懂得先知道三條規則
     （一格＝一趟、顏色＝哪一組、亮的可以點），而這個系統一學期
     只在那張圖上動八次，它沒有機會被學會。所以圖回到全班那一頁。 ── */
  H.push(scene(t, next.row, st, next.kind));
  if (r) H.push(stepRow(r.runId));

  /* ── 要做的那一件事，就接在廊道下面。 ──

     本來走過的那一條帶子插在這中間，所以「收到一個新任務」要越過
     一排過去的紀錄才看得到。過去是這一頁上最不重要的東西——
     它是拿來回頭看的，不是拿來做的。

     順便把 sticky 拿掉了。它本來釘在畫面底部，是為了解決「動作在
     摺線以下」；接到廊道下面之後那個問題本來就不存在，而一個
     釘在底部的東西擺在別的內容上面，只會蓋住它們。 ── */
  H.push('<div class="dock">');
  H.push('<div class="tline">');
  H.push('<span class="eyebrow">' + esc(taskTag(next)) + '</span>');
  H.push('<b>' + esc(next.kind === 'name' ? '還沒取名字'
    : (row && row.ms ? row.ms.title : '還沒有任務')) + '</b>');
  if (st.level) H.push('<i class="warnx">' + esc(RULES.stallSay(st.level, st.days)) + '</i>');
  H.push('</div>');
  H.push(actionCard(t, next, st));
  H.push('</div>');
  if (next.more) {
    H.push('<p class="dim">還有 ' + next.more + ' 個在等。</p>');
  }

  /* 走過的每一趟。往左滑就是往回看——它在這一頁上最不重要，
     所以排在動作後面。 */
  H.push(runStrip(t));

  /* 「新的一層／留一個記號」那張卡拿掉了。

     收起一趟的時候就順手插進那一層了（見 actSeal），所以它指的東西
     已經不是一個獨立的步驟。而它自己也講不清楚是什麼——
     連寫這個系統的人看到都要問「那是什麼」。 */



  return H.join('');
};

/* ---------- 走過的每一趟 ----------

   營地上那一排是「堆積」，但它擠在洞口那一小塊裡，滿了就放不下。
   走過八趟的人真正想做的事是往回看：那一趟叫什麼、說幾天、實際幾天。

   舊的在左、新的在右——跟廊道同一個方向（往右走就是往深處走），
   所以「往左滑」＝「往回看」不用學。打開的時候停在最右邊，也就是現在。 */
function runStrip(t, bare) {
  var rows = runsFor(t.teamId).filter(function (x) { return x.run.stamp; });
  if (!rows.length) return '';
  /* 名字。系統從頭到尾沒在學生面前說過「估算」兩個字——
     概念沒有被命名，他就不知道自己在練的是什麼。
     結算那一頁上面那張卡已經講過一次，所以那裡傳 bare。 */
  var H = [];
  if (!bare) H.push('<div class="rs-h">你的估算　' + rows.length + ' 趟</div>');
  H.push('<div class="rstrip"><div class="rs-in">');
  rows.forEach(function (x) {
    var r = x.run;
    /* 牠的顏色是那一趟當時那一層的顏色。本來去 builds 裡翻，
       翻不到就當第 0 層——還沒收起來的那一趟就被畫成最上層的顏色。 */
    var z = strataAt(runDepth(r), t.teamId);
    var mob = mobOfRun(r);
    /* 一格一隻牠。牠是那一趟盡頭擋路的那一隻，也是圖鑑裡會標成
       「遇過」的那一隻——所以牠是那一趟最好的名字：不用讀，
       看一眼就想得起來是哪一趟。其餘的點進去看。 */
    H.push('<button class="rs ' + r.stamp + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'rec:' + r.runId })) + '\' title="' +
      esc((x.ms ? x.ms.title : '') + '　' + (mob ? mob.n : '') +
        '　說 ' + r.est + '　實際 ' + (r.actual || 0) + ' 天') + '">');
    H.push(pxTag(mob ? mob.px : [], z.pal, 'rs-px'));
    H.push('<span class="rs-s">' + stampPx(r.stamp) +
      '<i>' + r.est + '<u>→</u>' + (r.actual || 0) + '</i></span>');
    H.push('</button>');
  });
  H.push('</div></div>');
  return H.join('');
}

/* 老師分的段，排成一列小方塊。勾得掉。
   它接在任務那一行下面，不是一張卡——段是任務的一部分，不是另一件事。 */
function stepRow(runId) {
  var sp = stepsOf(runId);
  if (!sp) return '';
  var H = ['<div class="srow">'];
  sp.all.forEach(function (x, i) {
    var on = sp.on.indexOf(i) >= 0;
    H.push('<button class="sq' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tick:' + runId + '|' + i })) + '\'>' +
      '<b></b>' + esc(x) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 這一趟現在是什麼狀態。一個短標籤，不是一句解釋。 */
function taskTag(next) {
  return ({
    name: '第一件事', commit: '新的', doing: '正在做',
    stamped: '結果出來了', review: '在老師那邊', back: '退回來了',
    waitexit: '出口', left: '地面', idle: '等老師派'
  })[next.kind] || '';
}

/* 廊道底下那一排門。都是偶爾才用的，但都不能藏起來——
   沒觸發過的東西等於不存在。

   本來這裡是營火、出口、招牌。營火拿掉了：它問的「哪一段比你想的久」
   已經是戰鬥的第二題，而且它的 lit 條件永遠是 false，從來沒亮過。
   招牌也拿掉了：專案名在頂條上，而且點得進去改。
   換上來的是任務清單與圖鑑——它們本來各佔一個分頁，但它們不是步驟。 */
function deskRow(t, next) {
  var H = ['<div class="desk">'];
  /* 任務清單在側欄，這裡不再放一次——兩個地方都放就是重複。

     圖鑑留著。它不在四件事的哪一步上，但它在終點上：
     它記著「你在哪一趟遇過哪一隻」，而那是一學期走完之後
     才看得出形狀的東西。 */
  /* 上次翻開之後多遇到幾隻，就在門上掛幾。翻開就消掉。 */
  var cn = codexNew(me());
  H.push('<button class="dk lit" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:codex' })) + '\' title="' +
    esc(cn ? '圖鑑：多了 ' + cn + ' 隻' : '圖鑑：這座地下城裡有什麼') + '">' +
    pxTag(ICONS.codex, ICON_ON, '') + '<i>圖鑑</i>' +
    (cn ? '<em class="nb">' + cn + '</em>' : '') + '</button>');
  /* 換角色。挑過一次之後隨時換得掉——它不進任何判定，也不影響
     任何數字，所以換來換去不會有任何代價。門上畫的就是他現在那一個。 */
  H.push('<button class="dk" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:who' })) + '\' title="' +
    esc('角色：換一個') + '">' +
    pxTag(HERO.walkA, HERO.pal, '') + '<i>角色</i></button>');
  /* 出口。老師開了才點得動——沒開的時候它是一扇鎖著的門，不是一顆
     按下去會跳「還不行」的鍵。點得動卻沒有反應是最糟的那一種。

     「我們做完了」那一句話搬到任務清單去說：看完那一頁才知道自己是不是
     真的做完了，說出口的地方就該在那裡。 */
  if (t.exitOk) {
    H.push('<button class="dk lit" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'go:exit' })) + '\' title="' +
      esc('出口：老師開了，從這裡上去') + '">' +
      pxTag(ICONS.log, ICON_ON, '') + '<i>出口</i></button>');
  } else {
    H.push('<div class="dk shut" title="' +
      esc(t.exitAsk ? '出口：說了，在等老師開' : '出口：鎖著') + '">' +
      pxTag(ICONS.log, ICON_PAL, '') + '<i>出口</i></div>');
  }
  H.push('</div>');
  return H.join('');
}

/* ---------- 老師分的段 ----------
   他有分才畫。勾一段是「這一段做完了」，隨時可以改——
   勾錯了不該是一件要去求人的事。它不影響判定。 */
function stepCard(runId) {
  var sp = stepsOf(runId);
  if (!sp) return '';
  var H = ['<div class="card">'];
  H.push('<div class="eyebrow">段　' + sp.on.length + ' / ' + sp.all.length + '</div>');
  H.push('<div class="steps-list">');
  sp.all.forEach(function (x, i) {
    var on = sp.on.indexOf(i) >= 0;
    H.push('<button class="stp' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tick:' + runId + '|' + i })) + '\'>' +
      '<b></b><i>' + esc(x) + '</i></button>');
  });
  H.push('</div></div>');
  return H.join('');
}

/* 哪一組遇到哪一隻的 mobFor 在 13-strata.js——那是世界的規則，不是畫面的。 */

/* nextThing 回的那個字，對到步驟條的第幾格。 */
var STEP_AT = {
  commit: 0,
  doing: 1, stamped: 1, review: 1
};

/* 上一次自己留下的那一句 */
function lastKeep(teamId) {
  var ks = keepsOf(teamId);
  return ks.length ? ks[ks.length - 1] : null;
}


/* ---------- 唯一的那一顆動作 ---------- */
/* ---------- 唯一可以按的那一個 ----------

   一個標籤（現在是什麼）＋ 一顆鍵（要做什麼）。沒有解釋句。
   狀態由廊道底下那排數字說，不由這裡用一句話說一次。 */
function actionCard(t, next, st) {
  var H = ['<div class="act-card">'];
  var row = next.row;

  if (next.kind === 'name') {
    /* 第一個動作不可以是「等」。 */
    H.push('<div class="eyebrow lit">先取個名字</div>');
    H.push(btn('這個專案叫什麼', 'go:sign', 'big'));

  } else if (next.kind === 'left') {
    H.push('<div class="eyebrow">地面</div>');
    if (t.exitWord) H.push('<p class="quote">' + nl(t.exitWord) + '</p>');
    H.push(btn('看你帶出來的', 'go:exit', 'big'));

  } else if (next.kind === 'waitexit') {
    H.push('<div class="eyebrow">出口　·　等老師確認</div>');
    H.push(btn('還沒，收回', 'cancelexit', 'ghost'));

  } else if (next.kind === 'commit') {
    H.push('<div class="eyebrow">新的　·　' + esc(row.ms.title) + '</div>');
    H.push(btn('要花幾天', 'go:commit:' + row.ms.msId, 'big'));

  } else if (next.kind === 'doing') {
    H.push(doingCard(t, row, st));
    /* 老師又派了幾個。小小地說一聲就好——手上這一趟做完才輪到它們。 */
    if (next.more) {
      H.push('<p class="dim">老師又派了 ' + next.more + ' 個。做完這一趟才輪到。</p>');
    }

  } else if (next.kind === 'stamped') {
    H.push('<div class="eyebrow">交出去了</div>');
    H.push(btn('看準不準', 'go:stamp:' + row.run.runId, 'big'));

  } else if (next.kind === 'back') {
    /* 老師退回來了——牠站起來了。那不是懲罰：那一趟的兩個數字在他
       交出去的當下就定了，退回不動判定也不動深度。站起來講的只有
       一件事：那份成果還沒被收下。 */
    /* 老師退回來了。他的話放大——那是這一刻唯一要讀的東西，
       而且退回一定帶著話（沒寫理由的退回擋在資料層）。 */
    H.push('<div class="eyebrow warnx">老師退回來了</div>');
    if (row.run.word) H.push('<p class="quote big">' + nl(row.run.word) + '</p>');
    H.push(btn('改好了，再交一次', 'resend:' + row.run.runId, 'big'));

  } else if (next.kind === 'review') {
    H.push('<div class="eyebrow">在老師那邊</div>');
    /* 等待本來是一片空白：只寫「等他看」，不知道幾天、
       不知道有沒有被看見。三個數字全部都在，給他就好。 */
    var wa = row && row.run ? waitAt(row.run.runId) : null;
    if (wa) {
      H.push('<div class="waitq">');
      H.push('<span>交出去</span><b>' + wa.days + '</b><span>天</span>');
      if (wa.of > 1) H.push('<em>他手上 ' + wa.of + ' 件，你第 ' + wa.at + '</em>');
      H.push('</div>');
    } else {
      H.push('<h2>等他看。</h2>');
    }

  } else {
    H.push('<div class="eyebrow">廊道很安靜</div>');
    H.push('<h2>等老師派下一個。</h2>');
  }

  H.push('</div>');
  return H.join('');
}

/* ---------- 正在做 ----------

   這一張本來是「今天動的是哪一段？」加一排每天要按的鍵。
   拿掉了：兩個接觸點就夠——開始之前說幾天，做完回來交。

   所以這一頁上只有一個動作，而且它一直都在：交出去。
   底下那一句講的是狀態，不是催促——水在哪裡是行事曆決定的，
   他開不開這一頁都一樣。 */
function doingCard(t, row, st) {
  var r = row.run;
  var H = [];
  H.push('<div class="eyebrow">' + esc(row.ms.title) +
    (st && st.level ? '　·　' + esc(RULES.stallSay(st.level, st.days)) : '') + '</div>');
  H.push(btn('做完了', 'go:battle:' + r.runId, 'big'));
  /* 做到一半發現自己說少了，可以改。

     這條路本來只從戰鬥裡進得去，而且語氣是逃跑——一個學生在第三天
     發現說少了，得先按「做完了」進戰鬥再逃出來，那不是他會想做的動作。

     代價不用另外設計：走過的那幾天留在紀錄上（說 5、走了 3、重新想過），
     看得見，但不扣任何東西。改承諾不是失準，那是兩件事。 */
  H.push(btn('改一次承諾', 'redo:' + r.runId, 'ghost'));
  return H.join('');
}

/* ---------- 場景底下那一行 ---------- */
function sceneCap(t, next, st) { return ''; }

/* ---------- 招牌 ----------
   廊道口掛的是誰。名字是他們自己寫的，這是招牌唯一的意義——
   本來還有三階材質（走越深牌子越好），拿掉了：深度已經不是進度。 */
PAGES.sign = function () {
  var t = myTeam();
  var sg = signOf(t.teamId);
  var H = [head('專案名', '這個專案叫什麼', '')];
  H.push('<div class="card"><div class="fa-in">');
  H.push(pxTag(sg.px, sg.pal, 'fa-px'));
  H.push('<div>');
  H.push('<input id="pj-name" value="' + esc(t.project || '') +
         '" placeholder="' + esc('這個專案叫什麼') + '">');
  H.push('<div class="row">');
  H.push(btn('換字', 'rename', ''));
  H.push(btn('回廊道', 'go:home', 'ghost'));
  H.push('</div>');
  H.push('</div></div></div>');
  return H.join('');
};

/* 「哪一段比你想的久」那一排。
   「都差不多」跟其他選項一樣大——它不是逃生口，它是一個真的答案。 */
function overRow(r) {
  var picked = DRAFT.overs || [];
  var none = DRAFT.overs && !DRAFT.overs.length && DRAFT.said;
  var H = [];
  if (stepNames(r.runId).length) {
    H.push(stepLegend(r.runId, picked, 'over'));
  }
  H.push('<div class="alist">');
  H.push('<button class="ac' + (none ? ' on' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'oversame' })) + '\'><b></b>都差不多</button>');
  H.push('</div>');
  return H.join('');
}

/* 承諾那一頁還沒有 run，所以直接從任務上讀老師分的那幾段。
   那一排同時是兩件事：這一趟有哪幾段（範圍），
   以及點起來標「這一段會比想的久」。 */
function previewSteps(m) { return (m && m.steps) || []; }

function msStepLegend(m, sel, act) {
  var a = previewSteps(m);
  if (!a.length) return '';
  var H = ['<div class="alist">'];
  a.forEach(function (x, i) {
    var on = sel && sel.indexOf(i) >= 0;
    H.push('<button class="ac' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: act + ':' + i })) + '\'>' +
      '<b style="background:' + stepHue(i) + '"></b>' + esc(x) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

/* ---------- 承諾：滑桿 ＋ 自己標哪幾件會比想的久 ---------- */
PAGES.commit = function () {
  var t = myTeam();
  var m = msOf(S.p.id);
  if (!m) return '<div class="card">找不到這一個任務。</div>';
  /* 他自己拆的那幾件。第一次進來用老師寫的分段當起點——
     老師沒寫就是一張白紙，那時候拆的人是他。 */
  if (!DRAFT.plan) {
    DRAFT.plan = previewSteps(m).map(function (x) { return { n: x, d: 1 }; });
  }
  var plan = DRAFT.plan;
  /* 列了就是加起來，沒列就直接說一個數字。永遠只有一個地方在輸入。 */
  var est = plan.length ? planDays(plan)
    : Number(draft('est', RULES.EST_DEFAULT));
  var flags = DRAFT.flags || [];

  var H = [head('自我承諾', m.title, m.note)];

  /* 兩顆鍵先，底下那根尺跟走廊都跟著它動。 */
  H.push('<div class="card">');
  /* 老師排到哪一天。他排的是課程的排程，不是判定——所以這裡只寫
     事實，不寫「你來不及了」那種話。走廊上那條線畫的是同一件事。 */
  var di = dueIn(m);
  if (di) {
    /* 剩不到一天要報小時，不然「還有 1 天」是假的——那句話是
       dueLeftSay 在算的，這裡本來自己又算了一次，而且算錯。 */
    H.push('<div class="dueline' + (di.past ? ' past' : '') + '">' +
      '<span>老師排到</span><b>' + esc(dueSay(m)) + '</b>' +
      '<em>' + esc(dueLeftSay(m)) + '</em></div>');
  }
  /* 列了就顯示加起來的，沒列才給那兩顆鍵。 */
  if (plan.length) {
    H.push('<div class="estep"><div class="es-n sum"><b>' + est +
      '</b><span>天</span></div></div>');
  } else {
    H.push(estStep(est));
  }

  /* 決定的時候要看的東西全部畫在同一根尺上：你前幾趟說了幾天、
     實際幾天，別組這一件事說的範圍，還有準的範圍。

     本來是三張卡——三張卡量的是同一個單位，等於叫使用者自己
     在腦袋裡把它們疊起來。 */
  var past = runsFor(t.teamId).filter(function (x) { return x.run.stamp; }).slice(-3);
  H.push(estAxis(est, past.reverse()));
  /* 拉到幾就亮幾格，擋路的那一隻站在盡頭。
     承諾是這裡唯一有阻力的選擇，它不該長得像填表。 */
  H.push(estWalk(t, m, est));
  H.push('</div>');

  /* ── 你要做哪幾件，每一件幾天 ──

     老師可以只丟一個大任務，拆的人是要做的那一個。他寫過分段的話
     那幾行就是起點；沒寫就是一張白紙。

     每一件預設一天，所以加一件一定會動到上面那個數字——
     加了東西畫面沒反應是最容易讓人以為壞掉的事。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你要做哪幾件</div>');
  if (plan.length) {
    H.push('<div class="plist">');
    plan.forEach(function (x, i) {
      H.push('<div class="pl">');
      H.push('<b style="background:' + stepHue(i) + '"></b>');
      H.push('<i>' + esc(x.n) + '</i>');
      H.push('<button class="pd" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'pland:' + i + ',-1' })) + '\'>−</button>');
      H.push('<u>' + x.d + '</u>');
      H.push('<button class="pd" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'pland:' + i + ',1' })) + '\'>＋</button>');
      H.push('<button class="px-del" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'plandel:' + i })) + '\' title="' +
        esc('拿掉這一件') + '">×</button>');
      H.push('</div>');
    });
    H.push('</div>');
  }
  H.push('<input id="pl-add" placeholder="' +
    esc(plan.length ? '再一件，按 Enter' : '例：找到人　→ 按 Enter') +
    '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();ACTS.planadd(this.value);}">');
  H.push('</div>');

  /* 老師分的段。點起來標「這一段會比想的久」——
     那一排同時就是這一趟的範圍，所以下面不用再列一次清單。 */
  /* 預測哪一段會拖，走完兩趟才開始問——手上有兩趟的紀錄，
     這個問題才答得出來，而且下一頁的「標對的段」會驗證它。 */
  var askFlag = RULES.asks('flags', depthOf(t.teamId));
  if (previewSteps(m).length && askFlag !== 'off') {
    H.push('<div class="card">');
    /* 第一次出現的時候眉標是金色的（.lit）。那就是標記——
       在視覺標記上面再加一句「新的一題」是同一件事說兩次。 */
    H.push('<div class="eyebrow' + (askFlag === 'new' ? ' lit' : '') +
      '">哪幾段會比你想的久　選填</div>');
    H.push(msStepLegend(m, flags, 'flag'));
    H.push('</div>');
  }

  H.push('<div class="row">');
  H.push(btn('我承諾 ' + est + ' 天', 'commit:' + m.msId, 'big cm-go'));
  H.push(btn('回廊道', 'go:home', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 交出去 ---------- */
/* 交出去那一頁退休了：兩問搬進戰鬥（見 67-battle.js），
   那張選填的日子表搬到封存——它決定的是那一張證長什麼樣子。 */

/* 你說要走多遠。

   一格一天，亮到你拉到的那一格，擋路的那一隻站在盡頭。
   它不是另一個資訊——它是同一個數字換成你等一下真的會看到的樣子。

   承諾是這個系統裡唯一有阻力的選擇，而它本來長得像填表：
   拉一個滑桿、按一個鍵。 */
function estWalk(t, m, est) {
  return '<div class="ew">' + estWalkIn(t, m, est) + '</div>';
}

/* 只有這一段會跟著滑桿變。拆出來是為了拖的時候只換這一塊，
   不要動到滑桿本身——動到它，拖曳就斷了。 */
function estWalkIn(t, m, est) {
  var z = strataAt(depthOf(t.teamId), t.teamId);
  var mob = mobFor(m.msId, t.teamId);
  /* 老師排的那一天，換算成還有幾天，落在第幾格。

     換成同一個單位是重點：他按出來的格數跟老師排的那條線用的是
     同一把尺，所以「我排的比老師的長」不用讀，看一眼就知道。

     它不擋、不警告、不進判定。走廊畫到兩者之中比較遠的那一個，
     超出他承諾的那幾格是暗的——那是還沒有人走的地方。 */
  var di = dueIn(m);
  var mark = di && di.days > 0 ? Math.min(di.days, RULES.EST_MAX) : 0;
  var span = Math.max(est, mark);
  var H = ['<div class="ew-in">'];
  for (var i = 0; i < span; i++) {
    H.push('<i class="ew-c' + (i >= est ? ' off' : '') + '"></i>');
    if (mark && i + 1 === mark) H.push('<i class="ew-due"></i>');
  }
  H.push('<span class="ew-m"' + (est < span ? ' style="order:' + est + '"' : '') +
    '>' + pxTag(mob.px, z.pal, 'ew-px') + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 判定結果 ---------- */
PAGES.stamp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var s = RULES.STAMPS[r.stamp];

  var t = myTeam();
  /* 剛走完的那一層。判定當下深度就 +1 了，所以要退一格。 */
  var zone = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var mob = mobOfRun(r);

  /* 戲在戰鬥那一頁演完了，這裡只留報告。
     再演一次是重複，而且那一層閃光在動畫被凍住的時候會蓋成一片白。 */
  var H = [];
  H.push('<div class="stamp-card ' + r.stamp + '">');
  /* 他怎麼樣了。準的時候舉起手，比說的久的時候撐著膝蓋喘——
     那不是懲罰的表情，他只是走得比自己想的遠。 */
  H.push('<div class="stamp-who">' +
    pxTag(r.stamp === 'late' ? HERO.pant : HERO.win, HERO.pal, 'sw-px') + '</div>');
  H.push('<div class="stamp-mark">' + stampPx(s.key) + '</div>');
  H.push('<h1>' + esc(s.name) + '</h1>');
  H.push('<dl class="rep">');
  H.push('<dt>你說</dt><dd>' + r.est + '</dd>');
  H.push('<dt>實際</dt><dd>' + r.actual + '</dd>');
  H.push('<dt>差</dt><dd>' + (r.actual - r.est > 0 ? '+' : '') +
    (r.actual - r.est) + '</dd>');

  /* 上一趟差幾天。「我在變好」這件事本來沒有任何地方說得出口，
     而它只需要兩個數字。不寫「比上一趟準」那種結論——
     兩個數字並排，結論他自己下。 */
  var prev = null;
  runsFor(t.teamId).forEach(function (x) {
    if (x.run.runId === r.runId) return;
    if (!x.run.stamp || !x.run.actual) return;
    if ((x.run.submittedAt || 0) >= (r.submittedAt || 0)) return;
    if (!prev || (x.run.submittedAt || 0) > (prev.submittedAt || 0)) prev = x.run;
  });
  if (prev) {
    H.push('<dt>上一趟差</dt><dd class="dim">' +
      (prev.actual - prev.est > 0 ? '+' : '') + (prev.actual - prev.est) + '</dd>');
  }

  /* 承諾的時候標的那幾段，跟實際比較久的那幾段，對到幾個。
     兩份資料本來就都在（flags 與 overs），只是從來沒有比對過。
     沒標過就整行不出現。 */
  var fl = r.flags || [];
  if (fl.length) {
    var hit = 0;
    fl.forEach(function (i) { if ((r.overs || []).indexOf(i) >= 0) hit++; });
    H.push('<dt>標對的段</dt><dd>' + hit + '/ ' + fl.length + '</dd>');
  }
  var ov = (r.overs || []).map(function (i) { return stepName(r.runId, i); })
    .filter(Boolean);
  H.push('<dt>上之前你說</dt><dd class="s">' +
    (ov.length ? esc(ov.join('、')) + ' 比想的久' : '都差不多') + '</dd>');
  if (r.hard) H.push('<dt>卡在哪裡</dt><dd class="s">' + esc(r.hard) + '</dd>');
  if (r.pace) H.push('<dt>你覺得的進度</dt><dd class="s">' + esc(r.pace) + '</dd>');
  H.push('</dl>');
  H.push(estBar(r.est, r.actual, false));
  H.push('</div>');

  H.push('<p class="duel-t">' + esc(mob.n) + '讓開了。</p>');

  /* 「去圖鑑看看」那一句拿掉了——圖鑑那一頁不在主流程上，整個拿掉了。 */
  H.push(btn('好', 'skipcamp:' + r.runId, 'big'));
  return H.join('');
};

/* ---------- 營火 ----------
   問的是他們自己清單上的哪一件比想的久。系統不列「卡關的原因」。 */

/* ---------- 封存 ----------

   走完一趟，那一趟的紀錄長成一張任務之證。形狀完全由那一趟決定：
   一天兩列，來過是實心、說了沒動是空心、沒有紀錄是斷的，
   長度就是這一趟過了幾天。

   這一頁真正給他的東西是「他沒見過的那個形狀」——同一份數字，
   換成一個看得到的樣子。取名選填，他不取一樣封存得下來。 */

/* 選方向那張小地圖拿掉了：占地那一下改在全班那張圖上做。
   地圖是動手的地方，不是一個看的頁面。 */

/* ---------- 大躍進 ---------- */
/* 大躍進那一頁退休了：「石頭變了」搬到班級地下城（那才是新的一層
   實際發生的地方），其餘只是一句「去看看那一層」。 */

/* ---------- 出口 ----------

   這一頁是整個系統唯一的結尾。它不打分、不總評，只把他自己留下的
   紀錄攤開來：每一趟說幾天走幾天、走過哪幾層、留下哪幾句。

   「規劃妥善」不是開門的條件，是走出去的時候帶著的東西——
   同一道門，不同的故事。 */
PAGES.exit = function () {
  var t = myTeam();
  var e = exitRecord(t.teamId);
  var out = !!t.leftAt;
  var hit = (e.acc.exact || 0) + (e.acc.early || 0);

  var H = [head(out ? '地面' : '出口',
    out ? '你出去了' : '這個專案做完了？',
    out ? '' : '把專案做完，說一聲。')];

  /* 離場的演出。角色沿著那道光往上走出畫面。

     這是一學期的終點，比任何一次交出去都重——而交出去有一整場戰鬥，
     出去本來只是換一頁。

     動畫只加東西不當閘門：時鐘被凍住的時候人停在井底，還是看得見。 */
  if (out) H.push(exitScene(t));

  if (out && t.exitWord) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
      '<p class="quote">' + nl(t.exitWord) + '</p></div>');
  }

  /* ── 一 · 你的估算 ──

     這一頁的主角。本來「準了幾次」埋在第一張卡的中段，而它是
     這個系統一整個學期在量的唯一一件事。 */
  if (e.acc.total) {
    H.push('<div class="card exsum">');
    H.push('<div class="eyebrow">你的估算</div>');
    H.push('<p class="ex-big"><b>' + e.acc.total + '</b> 趟裡，準了 <b>' +
      hit + '</b> 次</p>');
    H.push(accBar(e.acc));
    H.push('</div>');
  }

  /* 一個學期的形狀。一趟一個，說幾天 → 實際幾天。
     本來這裡有兩張卡在做同一件事：一張逐條畫尺，一張排記號架。 */
  H.push(runStrip(t, 1));

  /* ── 二 · 你走過的地方 ── */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你走過的地方</div>');
  H.push('<div class="outnum">');
  H.push('<div><b>' + e.days + '</b><span>來過的天數</span></div>');
  H.push('<div><b>' + e.depth + '</b><span>走到第幾層</span></div>');
  /* 走了幾圈。六層一圈，第七趟回到第一層——
     無盡輪迴的設定在終點最該被說一次。 */
  if (e.cycles) H.push('<div><b>' + e.cycles + '</b><span>走過的輪迴</span></div>');
  H.push('</div>');
  if (e.zones.length) {
    H.push('<div class="zones">');
    e.zones.forEach(function (z) {
      var c = faunaOf(z.key)[0];
      H.push('<div class="zn ' + z.key + '">');
      if (c) H.push(pxTag(c.px, z.pal, 'zn-px'));
      H.push('<b>' + esc(z.name) + '</b>');
      H.push('</div>');
    });
    H.push('</div>');
  }
  H.push('</div>');

  /* ── 三 · 說一聲 ── */
  if (!out) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">說一聲</div>');
    H.push('<div class="row">');
    /* 這一頁只有在門開了之後進得來（廊道上那一扇鎖著），
       所以這裡就是最後那一下：上去。按的人是他們自己——
       走出去該是他們的動作，不是老師代勞的。 */
    H.push(btn('上去', 'leave', 'big'));
    H.push(btn('回廊道', 'go:home', 'ghost'));
    H.push('</div></div>');
  } else {
    H.push(btn('回廊道', 'go:home', 'ghost'));
  }
  return H.join('');
};

/* ---------- 走過的每一趟 ---------- */
/* 紀錄那一頁併進任務清單了：兩頁幾乎是同一份資料。
   下面那一支 logRow 留著——任務清單在用。 */
/* 一列一趟。牠在最左邊，資訊在右邊，點開才看細節。 */
function logRow(m, r, t) {
  if (!m) return '';
  var open = DRAFT.lg === r.runId;
  var z = STRATA[0];
  STRATA.forEach(function (q) { if (q.key === r.zone) z = q; });
  var mob = mobOfRun(r);
  var s = r.stamp ? RULES.STAMPS[r.stamp] : null;
  var kp = null;
  keepsOf(t.teamId).forEach(function (k) { if (k.runId === r.runId) kp = k; });

  /* 收起來的那一列本來還有一行「老師回的話」。字放大之後那一行只剩
     八個字加刪節號，而完整的那一句點開就在下面——所以不放了。 */

  /* 用 div 不用 button：<button> 上的 grid／flex 在 Chromium 不完整生效
     ——內容會被包進一個匿名區塊，第一個子元素因此被收縮成內容寬，
     標題就變成一個字一行。role 與 tabindex 補回鍵盤與輔助工具。 */
  var H = ['<div role="button" tabindex="0" class="rec' + (open ? ' open' : '') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'lgopen:' + r.runId })) + '\'>'];

  /* 直接排在格線上，不要再包一層。<button> 裡面包巢狀區塊的時候，
     第一個子元素會被收縮成內容寬（標題變成一個字一行）。 */
  H.push('<span class="rec-px">' + pxTag(mob.px, z.pal, '') + '</span>');
  H.push('<b class="rec-t">' + esc(m.title) + '</b>');
  /* 走的那幾天，以及老師排到哪一天。清單是他確認「還有哪幾件、
     哪一件先做」的地方，而老師排的那一天正是他排順序時要用的事實。 */
  H.push('<span class="rec-d">' + esc(dayText(r.committedAt)) +
    (r.submittedAt ? ' – ' + esc(dayText(r.submittedAt)) : '') +
    (m.due ? '<i class="rec-due">老師排到 ' + esc(dueSay(m)) + '</i>' : '') +
    '</span>');

  H.push('<span class="rec-s' + (r.stamp ? ' ' + r.stamp : ' none') + '">' +
    (s ? stampPx(s.key) : '') + '</span>');
  H.push('</div>');

  /* 點開才出現的細節。收起來的時候整列兩秒看得完。 */
  if (open) {
    H.push('<div class="rec-more">');
    if (r.stamp) {
      H.push(estBar(r.est, r.actual, false));
      H.push(dayStrip(t.teamId, r.runId));
    } else {
      H.push('<p class="dim">這一趟重新想過。說 ' + r.est + ' 天，走了 ' +
        (r.went || 0) + ' 天之後退回去重新說。</p>');
    }
    var sp = stepsOf(r.runId);
    if (sp) {
      H.push('<div class="tags small"><span class="k">老師分的段</span>');
      sp.all.forEach(function (q, i) {
        H.push('<span class="tag static' + (sp.on.indexOf(i) >= 0 ? ' hit' : '') +
          '">' + esc(q) + '</span>');
      });
      H.push('</div>');
    }
    var ov = (r.overs || []).map(function (i) { return stepName(r.runId, i); })
      .filter(Boolean);
    if (ov.length) {
      H.push('<div class="tags small"><span class="k">比想的久</span>');
      ov.forEach(function (l) { H.push('<span class="tag static hit">' + esc(l) + '</span>'); });
      H.push('</div>');
    }
    if (r.hard) H.push('<p class="quote"><b>卡在哪裡</b>' + nl(r.hard) + '</p>');
    if (r.pace) H.push('<p class="quote"><b>你覺得的進度</b>' + nl(r.pace) + '</p>');
    if (r.word) H.push('<p class="quote tw">' + nl(r.word) + '</p>');
    H.push('</div>');
  }
  return H.join('');
}

/* 點開／收起來。一次只開一列。 */
ACTS.lgopen = function (id) {
  DRAFT.lg = DRAFT.lg === id ? null : id;
  render();
};

/* ---------- 這一圈走到哪 ----------

   死線勇者的迴圈是四拍，而且它一直讓你知道現在是哪一拍。
   這裡四拍就是那四件事：承諾天數 → 進行任務 → 回報進度 → 完成紀錄。

   本來每一拍上面還掛一個世界觀的詞（準備／遠征／戰報／營地），
   底下再寫一次白話。同一件事講兩次，而先講的那一次是聽不懂的那一次。

   畫成環不是條：這座地下城是無盡輪迴的，四拍走完回到第一拍。
   所以它沒有百分比、沒有終點，也不可以有。 */
var BEATS = [
  { k: 'prep', s: '承諾天數' },
  { k: 'away', s: '進行任務' },
  { k: 'rep',  s: '回報進度' },
  { k: 'camp', s: '完成紀錄' }
];

/* 這一圈走到哪。

   本來最後一行是「其他狀態就看 claimsOf」，而 claimsOf 是一個
   只增不減的計數器——所以第一次完成之後，「承諾天數」那一拍
   永遠被畫成「完成紀錄」。每一拍現在都由狀態直接決定。 */
function beatAt(next, t) {
  var k = next.kind;
  if (k === 'doing') return 'away';
  if (k === 'submit' || k === 'stamped' || k === 'review') return 'rep';
  if (k === 'left' || k === 'waitexit') return 'camp';
  return 'prep';
}

function beatBar(next, t) {
  var at = beatAt(next, t);
  var H = ['<div class="cyc">'];
  BEATS.forEach(function (s, i) {
    H.push('<span class="cy' + (s.k === at ? ' on' : '') + '">' +
      '<b>' + esc(s.s) + '</b></span>');
    if (i < BEATS.length - 1) H.push('<span class="cyd"></span>');
  });
  /* 最後接回第一拍。走完不是結束，是再一圈。 */
  H.push('<span class="cyd loop"></span>');
  H.push('</div>');
  return H.join('');
}

/* ===== 61-scene.js ===== */
/* 廊道的場景。

   之前這裡是一條進度條：角色 → 幾個方格 → 魔物。它讀得懂，但它是圖表。
   這一支把它改成一個地方——有洞口、有天花板、有地板、有石頭、有火把，
   角色站在裡面而不是站在旁邊。

   幾件事是有意義的，不是裝飾：

     火把    一天一盞。推進幾次，走廊就亮幾盞——「你來過幾次」畫出來的樣子。
     腳印    走過的每一格留一個。走廊上唯一的歷史，而且它不算分。
     迷霧    從你站的地方往前蓋住。往前走一格，霧就退一格。
     魔物    藏在霧裡，越靠近越清楚。它不是敵人，是這一趟要交的東西。

   還有一件事是刻意不做的：走廊上沒有任何「你應該走到哪」的記號。
   沒有基準線，就沒有落後這回事。 */

var SCN = {
  TILE: 44,     /* 一天一格 */
  ENT: 132,     /* 洞口那一段 */
  END: 154,     /* 魔物站的那一段 */
  H: 286,       /* 場景高 */
  FLOOR: 66     /* 地板上緣離底部多高——站在地上的東西都用這個 */
};

/* 一條走廊。

     t     這一組
     row   現在在跑的那一個 run（可能沒有）
     st    停滯狀態 */
/* 洞口有多寬。本來每留下一個記號就寬一點，記號系統拿掉之後它是一個
   固定的數字。這一支留著是因為場景裡到處拿它算位置。 */
function entOf(teamId) {
  return SCN.ENT;
}

function scene(t, row, st, kind) {
  var ENT = entOf(t.teamId);
  var run = row && row.run;
  /* 還沒承諾任何事的時候給一段像樣的空廊道。
     第一次打開是印象最深的一次，本來它只有一格，看起來像壞掉的。 */
  var est = run ? (run.est || 1) : 7;

  /* 一條軌道，兩個東西在上面：
       moved   你來過幾天——按一下才往前一格
       tide    實際過了幾天——你按不按它都會漲 */
  var log = run ? dayLog(run.runId) : [];
  var moved = 0, i0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'move') moved++;
  var done = run && run.state !== 'running';
  if (done) moved = Math.max(moved, run.pushes || 0);
  var tide = Math.min(log.length, est + 2);
  var walked = Math.min(moved, est);

  /* 每一格頭上掛的是那一天動的是哪一段。廊道因此讀得出形狀——
     七格同一個顏色跟七格五顏六色，是完全不同的一趟。 */
  var byTile = [];
  var k0 = 0;
  for (i0 = 0; i0 < log.length; i0++) {
    if (log[i0] && log[i0].kind === 'move') byTile[k0++] = log[i0].step;
  }
  var rests = 0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'rest') rests++;

  var seed = t.teamId + (run ? '|' + run.runId : '');
  var light = WORLD.light[st.level];
  /* 往前多畫幾格。本來只畫到承諾與過了幾天的較大者，所以拖到底就
     沒東西了。多出來的那幾格在霧裡，看不出有什麼——
     那才是還沒走到的地方該有的樣子。 */
  var AHEAD = 5;
  var span = Math.max(est, tide);          /* 這一趟的長度 */
  var draw = span + AHEAD;                 /* 畫到哪裡（多的在霧裡） */
  var W = ENT + draw * SCN.TILE + SCN.END;
  /* 走到多深，牆、地板、天花板、地上的東西、擋路的那一隻，全部跟著換。
     世界觀不寫在說明裡，寫在牆上。 */
  var zone = strataAt(depthOf(t.teamId), t.teamId);

  /* 三個狀態掛在最外層。裡面每一層（遠牆、流線、火、角色）都靠
     它決定要不要動——一個地方決定，不會有兩層各自算出不同答案。 */
  /* 任務開始＝按下承諾，不是老師派下來。派了但還沒承諾的時候
     他還坐在火邊——那正是「還沒出發」。

     fresh 的那一趟 runsFor 會給一個 runId 是 null 的空殼，所以
     判斷要看 run.runId 不是 run。 */
  /* 打完那一隻，這一趟就結束了——回報交出去的那一刻牠倒下，
     之後不管是等判定還是等老師，都是在等，而等的姿勢是坐著。
     本來這兩個處境是站著的，那看起來像還沒走完。

     退回是唯一一個把他叫回路上的狀態：牠站起來，他也站起來。 */
  var walking = st.level < 2 && (kind === 'doing' || kind === 'back');
  var going = !!(run && run.runId);
  var resting = st.level < 2 && !walking &&
    (!going || kind === 'idle' || kind === 'left' || kind === 'waitexit' ||
      kind === 'stamped' || kind === 'review');
  /* 剛按下承諾那一下。go() 會清掉 DRAFT，所以旗子放在 S 上。 */
  var launch = !!S.launch;
  var H = ['<div class="scn ' + light.key + ' z-' + zone.key +
    (walking ? ' walking' : '') + (resting ? ' resting' : '') +
    (launch ? ' launch' : '') + '">'];
  /* 出發那一下：一道白光掃過去，加上一句大字砸在正中間。

     這是整個流程裡唯一一個「從現在開始」的時刻——之前他在營火旁邊
     坐著，之後他在走。中間那一下要有聲音，不然兩個狀態之間只是
     畫面換了。

     字砸下來的時候廊道上那幾行小字（第幾天、牌子、角落那一塊）
     一起收起來：一次只講一件事，而且這樣它們也不會跟大字疊在一起。 */
  if (launch) {
    H.push('<div class="scn-launch"></div>');
    H.push('<div class="scn-go"><b>任務開始</b></div>');
  }


  /* 固定在角落的深度。走廊往旁邊捲，它不跟著捲——
     那是「你在多深的地方」，不是走廊上的一個位置。 */
  H.push('<div class="scn-hud">' +
    '<em>' + esc(zone.name) + '</em>' +
    '<b>' + (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</b>' +
    '<span>走完 ' + depthOf(t.teamId) + ' 個任務</span>' +
    '<span class="zn-note">' + esc(zone.note) + '</span></div>');

  /* 釘在框上、不跟著捲的兩層：近景的岩石與暗角。
     拖動廊道的時候它們不動——那一下就有視差。 */
  H.push('<div class="scn-frame"></div>');

  H.push('<div class="scn-scroll"><div class="scn-in" style="width:' + W + 'px">');

  /* 最後面那一層：更暗的磚與支撐柱。廊道不是一片牆，它有深處。 */
  /* 會往前捲的那幾層。由遠到近：底、遠牆、頭上的岩、地面的流線。
     速度差開才有深度——一起動看起來是整張圖在滑。 */
  H.push('<div class="scn-bg" style="width:' + W + 'px"></div>');
  H.push('<div class="scn-far" style="width:' + W + 'px"></div>');
  /* 前進中才會動的兩層：遠牆慢、地面的流線快。兩層速度不一樣，
     「往前」才有深度——一層一起動看起來是整張圖在滑。 */
  H.push('<div class="scn-rush" style="width:' + W + 'px"></div>');

  /* 頭上的岩。本來天花板只有幾根鐘乳石掛在空中，沒有東西讓它們掛。 */
  H.push('<div class="scn-ceil" style="width:' + W + 'px"></div>');


  /* 這一層的空氣。不帶任何資訊——哪一層已經由牆、地板、石頭的顏色
     說了；空氣只是讓那個地方看起來真的有空氣。 */
  H.push(sceneAir(seed, zone, W));

  /* ── 天花板：鐘乳石 ── */
  for (var d = 0; d < Math.ceil(W / 44); d++) {
    var dp = dripFor(seed, d);
    if (!dp) continue;
    H.push('<span class="drip" style="left:' + (d * 44 + dp.off) + 'px">' +
      pxTag(dp.px, zone.pal, '') + '</span>');
  }

  /* ── 洞口 ── */
  H.push(sceneMouth(t, { kind: kind, run: run }, ENT, resting));

  /* ── 地板 ── */
  H.push('<div class="floor" style="left:0;width:' + W + 'px"></div>');
  if (walked > 0) {
    H.push('<div class="floor lit" style="left:' + ENT + 'px;width:' +
      (walked * SCN.TILE) + 'px"></div>');
  }

  /* ── 一天一格 ── */
  /* 火把不跟著這個迴圈直接吐出去——它們要進自己那一層（見下面）。 */
  var TOR = [];
  for (var i = 0; i < span; i++) {
    var x = ENT + i * SCN.TILE;
    var on = i < walked;

    /* 火把：走過的那幾格點著。座標從洞口算起，因為那一層的原點在洞口。 */
    TOR.push(torchAt(i * SCN.TILE + 6, on, i));

    /* 腳印 */
    if (on) H.push('<img class="px foot" style="left:' + (x + 11) + 'px" src="' +
      pxSvg(STEP_PX.px, STEP_PX.pal, false) + '" alt="">');

    /* 那一天動的是哪一件。畫顏色不畫字——名字長度不一定，
       塞不進 44px；顏色對到哪一件，清單上看一次就記得了。 */
    if (on && byTile[i] >= 0) {
      H.push('<span class="doing" style="left:' + x + 'px;background:' +
        stepHue(byTile[i]) + '" title="' + esc(stepName(run.runId, byTile[i])) +
        '"></span>');
    }

    /* 每一格底下那個「第幾天」拿掉了。走廊上不再有任何數字——
       第幾天由火把說（亮幾盞就是來過幾天），而確切的數字在底下
       那一行用白話寫。 */

    /* 走通的地方才長得出東西，而且每一層長的不一樣（見 12-props.js）。
       全部用那一層的配色——換了地方，連地上的石頭都該換顏色。 */
    if (on) {
      var p = propFor(seed, i, zone.key);
      if (p === 'rubble') H.push('<img class="px prop rubble" style="left:' + (x + 5) +
        'px" src="' + pxSvg(RUBBLE.px, zone.pal, false) + '" alt="">');
      if (p === 'crystal') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(CRYSTAL.px, zone.pal, false) + '" alt="">');
      if (p === 'shroom') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(SHROOM.px, zone.pal, false) + '" alt="">');
      if (p === 'bolt') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(BOLT.px, zone.pal, false) + '" alt="">');
      if (p === 'ember') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(EMBER.px, zone.pal, false) + '" alt="">');
    }
  }

  /* ── 牆上那一排燭火 ──

     它們釘在牆上，牆會往後退，所以它們也要往後退——本來整排是釘死的，
     背景在動而牆上的東西不動，那看起來不是走廊在移動，是背景破圖。

     位移一格是 176px（四格），跟遠牆同一個週期，所以接縫接得上。
     右邊多畫四盞填補捲走的那一段，整層裁在洞口，捲過去的不會跑到
     營火上面。 */
  for (var iX = span; iX < span + 4; iX++) TOR.push(torchAt(iX * SCN.TILE + 6, false, iX));
  H.push('<div class="scn-lamps" style="left:' + ENT + 'px;width:' + (W - ENT) +
    'px"><div class="lamps-in">' + TOR.join('') + '</div></div>');


  /* 蓋在走廊上的兩條天數標記都拿掉了：

       .vow   一條金色虛線，天花板拉到地板，畫在「你說的那一天」
       .tide  一片藍色的水，橫著漲過去，畫的是「過了幾天」

     兩個都是把一個數字拉成一條線壓在走廊上。走廊上該有的是一個人
     在走，跟他走過的痕跡——這一段全力交給那個動畫。

     數字在廊道底下那一行用字講：N 你來過、N 過了幾天、N 你說的。
     而「你說的那一天」上面還站著擋路的那一隻——牠不是一條線，
     是一個東西，而且要走到了才看得到。

     tide 這個數字留著：廊道要畫多長、霧從哪裡開始，都還是看它。 */

  /* ── 魔物 ── */
  /* 牠站在你說的那一天，不動。
     本來是 max(承諾, 過了幾天)——時間過去牠跟著往後退，
     所以你永遠追不上，也永遠不會走過牠。 */
  /* 牠只在走到底之後出現：走滿了自己說的天數，或者這一趟已經交出去。
     還在路上的時候前面是霧——不是一隻站在那裡等你的東西。 */
  /* 用 metRun：畫面上看得到牠的那一刻，就是圖鑑記下的那一刻
     （見 40-db.js）。本來這裡自己列狀態，而列的那幾個裡面
     'stamped' 根本不是一個 state（那是 nextThing 回的字），
     真正的是 'judged'——所以那一條永遠不成立，靠 walked>=est 撐著。 */
  var arrived = metRun(run);
  /* 打完了牠就不在那裡了。老師退回來的那一趟，牠站回去。

     這個判斷不能寫進 metRun：圖鑑算的是「遇到」，遇到過就是遇到過，
     牠站不站得起來是另一件事。 */
  var beaten = !!(run && (run.state === 'judged' || run.state === 'submitted' ||
    run.state === 'done'));
  if (arrived && !beaten) H.push(sceneMob(t, row, 1, est, ENT));

  /* ── 盡頭的岩壁裡有東西 ──

     這一趟走完、把記號插進去的那一下會敲開這一層的石頭。
     有東西的時候先讓那塊岩壁看起來不一樣——只給「那裡有東西」，
     不給「那裡有什麼」。揭曉留給敲開的那一下。 */
  if (buriedAt(t.classId, t.teamId, depthOf(t.teamId))) {
    H.push('<div class="ahead" style="left:' +
      (ENT + (span + 2) * SCN.TILE) + 'px"><i></i></div>');
  }

  /* ── 角色 ── */
  /* ── 他在做什麼，就長成什麼樣子 ──

     本來寫的是 `run && st.level < 2`，而 run 這個物件在四個完全不同的
     處境下都存在：派了還沒說幾天、正在做、交出去了在等、老師勾了。
     所以四個狀態長成同一個走路的樣子，而其中只有一個真的在走。
     姿勢因此不帶任何訊息——那就等於沒有姿勢。

       正在做　　　　　走路
       還沒說幾天　　　站著　他還在洞口，沒出發
       打完了、等老師　坐著　牠倒了，這一趟結束，回火邊
       老師退回來了　　走路　牠站起來了，路還沒走完
       沒有任務　　　　坐著　營火旁邊。那是休息，不是罰站
       很多天沒動　　　睡著

     停下來不是停止：坐著跟站著都有兩幀，差在呼吸，火也一直在動。 */
  /* walking／resting 在最上面算過了。 */
  /* 火釘在洞口的 left:11，寬 44。人坐在火的右邊一點。 */
  var hx = resting ? 44 : ENT + walked * SCN.TILE - 11;
  H.push('<div class="hero scn-hero' + (st.level >= 2 ? ' asleep' : '') +
    (walking ? ' walking' : '') + (resting ? ' resting' : '') +
    '" style="left:' + hx + 'px">');
  /* 頭上寫他在幹嘛。本來只靠姿勢，而姿勢在 66px 上看不太出來——
     寫出來最快，而且它同時說明了「現在沒事做」是一個正常狀態。 */
  /* 牌子跟著姿勢走。「待命」本來蓋掉三個很不一樣的處境——
     還沒出發、在等老師、老師勾了。分開講。 */
  /* 講得出來的那幾個處境排在前面，前進中／休息中是兜底的那一句。
     反過來的話「打完了」跟「沒有任務」會共用「休息中」——
     姿勢一樣不代表發生的事一樣。 */
  var tag = st.level >= 2 ? '停很久了'
    : kind === 'commit' ? '還沒出發'
    : kind === 'stamped' ? '打完了'
    : kind === 'review' ? '在等老師'
    : kind === 'back' ? '再走一次'
    : walking ? '前進中'
    : resting ? '休息中'
    : '待命';
  H.push('<div class="hero-tag' + (walking ? ' go' : resting ? ' rest' : '') +
    '">' + esc(tag) + '</div>');
  if (walking) {
    H.push(pxTag(HERO.walkA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.walkB, HERO.pal, 'ch wf wb'));
  } else if (resting) {
    H.push(pxTag(HERO.sitA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.sitB, HERO.pal, 'ch wf wb'));
  } else if (st.level >= 2) {
    H.push(pxTag(HERO.sleep, HERO.pal, 'ch'));
  } else {
    /* 站著也要兩幀。一張不動的圖在一條會漲水、會閃火的走廊上
       看起來像壞掉——呼吸那一格差別很小，但「他還在那裡」靠的就是它。 */
    H.push(pxTag(HERO.idleA, HERO.pal, 'ch wf wa'));
    H.push(pxTag(HERO.idleB, HERO.pal, 'ch wf wb'));
  }
  H.push(heroPack(t.teamId));
  if (st.level === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine'));
  H.push('</div>');

  /* 角色手上那一盞的光。一圈一圈地暗下去，不是模糊的漸層——
     模糊的話它會立刻看起來像貼在像素圖上面的現代特效。 */
  H.push('<div class="halo" style="left:' + (hx - 121) + 'px"></div>');

  /* ── 你說的那一天 ──

     這是原始設計裡就有的一條線（「道路前方出現一條虛線」），
     一直沒做。它讓「我承諾了幾天」在畫面上有一個實體：
     那條線就在前面，水從後面追上來。只有數字的話那件事沒有位置。

     虛線不是終點線——別組沒有這條線，每一組的線在不同的地方，
     因為那是各自說的。 */
  if (run) {
    /* 只有線，沒有字。牠現在就站在這一格上——
       牠站在那裡本身就是「你說的那一天」，再寫一次是同一件事說兩遍，
       而且那兩段字永遠會擠在一起。 */
  }

  /* ── 霧 ──
     從站的地方往前蓋住。它蓋的是「還沒走的那幾天」，
     所以往前一格霧就退一格。 */
  var fogAt = ENT + (Math.max(walked, tide) + 1) * SCN.TILE;
  if (fogAt < W) {
    H.push('<div class="fog" style="left:' + fogAt + 'px"></div>');
  }

  H.push('</div></div>');   /* scn-in / scn-scroll */

  H.push('</div>');         /* scn */

  /* 底下那一行：三句白話。

     本來寫的是「2 你來過　5 過了幾天　5 你說的」——每一個都是
     半句話，要自己補完才知道在講什麼（你來過⋯哪裡？你說的⋯什麼？）。
     改成三句講得完的話，數字夾在句子中間。

     「說沒動」那一項不放回來：說那句話的那一顆鍵（actRest）現在
     沒有任何地方按得到，所以它永遠是 0。

     它掛在廊道外面。負邊界是為了往上貼住廊道，寫在 .scn 裡面的話
     會被 overflow:hidden 吸到頂上去。 */
  if (run) {
    H.push('<div class="scn-foot">');
    H.push('<span class="sf est"><i>你說要</i><b>' + est + '</b><i>天</i></span>');
    H.push('<span class="sf days"><i>已經過了</i><b>' + tide + '</b><i>天</i></span>');
    H.push('<span class="sf you"><i>你來了</i><b>' + moved + '</b><i>天</i></span>');
    H.push('</div>');
  }
  return H.join('');
}

/* 背上本來背著拿到的那幾張證。那件事改由洞口的營地講——
   那裡一趟多一個，而且首頁就是那條廊道，每次打開都看得到。 */
/* 照面那一頁上的自己。跟廊道裡走的是同一個人、同一身裝備——
   不然那一下就不是「我上去」，只是一張圖。 */
function heroTag(teamId) {
  return '<div class="hero duel-h">' + pxTag(HERO.idle, HERO.pal, 'ch') +
    heroPack(teamId) + '</div>';
}

function heroPack() { return ''; }

/* ---------- 洞口 ----------
   左邊是你進來的地方：拱門、從上面落下來的光、掛著的招牌。
   招牌就在這裡，不在標題列——它是廊道入口的看板，不是頁首。 */
/* 洞口。招牌、營火、往上的光——全部在這裡，而且一直在。

   為什麼要一直在：沒觸發過的東西等於不存在。一個學生如果從來沒有
   失準過，他整學期不會知道有營火這個地方。所以它們在那裡，
   只是沒點著——「看得到但還沒發生」跟「不存在」是兩件事。 */
function sceneMouth(t, next, ENT, resting) {
  var sg = signOf(t.teamId);
  var H = ['<div class="mouth" style="width:' + (ENT || SCN.ENT) + 'px">'];

  /* 往上的光：出口。一直在，而且點得開——
     宣告專案做完是偶爾才做的事，不該在首頁佔一塊，
     但它也不能藏起來（沒觸發過的東西等於不存在）。 */
  H.push('<button class="shaft' + (t.exitAsk || t.leftAt ? ' open' : '') +
    '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'go:exit' })) +
    '\' title="' + esc(t.exitAsk ? '出口：在等老師確認' : '出口：專案做完的時候從這裡上去') +
    '"></button>');
  H.push('<div class="arch"></div>');

  /* 招牌。點得開——改名字是偶爾才做的事，不該在首頁佔一塊。 */
  H.push('<button class="hang" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:sign' })) + '\' title="' +
    esc('招牌：' + (t.project || '（還沒定）')) + '">');
  H.push('<div class="chain"></div>');
  H.push(pxTag(sg.px, sg.pal, 'sign'));
  H.push('</button>');
  /* 洞口那一塊專案名拿掉了。

     兩個理由。一 · 它是第三份：頂條上有、招牌的 title 上有，這裡再一次。
     二 · 它會撞人。它掛在 bottom:110、寬 121，而人休息的時候就坐在
     旁邊（left:44），頭上還有一塊牌子——專案名一長就折兩行，
     往上長進牌子裡。招牌本來就掛在那裡，名字讓頂條說。 */

  /* 營火。兩趟之間點著——那時候人坐在旁邊。

     本來是「判定失準才點著」，但那個分岔在改成
     『每一次交出去之前都省思』的時候拿掉了，所以它再也不會亮，
     變成一堆死掉的內容。改成休息的時候點著，才是它本來的意思：
     營地是休息的地方，不是罰站的地方。 */
  /* 跟角色同一個判斷，而且是同一個變數傳進來的——兩邊各算一次
     就會有一邊算錯（本來人坐著而火是冷的）。 */
  var lit = !!resting;
  H.push('<button class="mfire' + (lit ? ' lit' : '') + '"' +
    ' data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'go:pack' })) + '\'' +
    ' title="' + esc(lit ? '營火：還沒接下一件事' : '營火（走著的時候是暗的）') +
    '">');
  if (lit) {
    CAMPFIRE.frames.forEach(function (f, n) {
      H.push(pxTag(f, CAMPFIRE.pal, 'ff f' + n));
    });
  } else {
    H.push(pxTag(CAMPFIRE.px, COLD_PAL, ''));
  }
  H.push('</button>');

  /* 火星。點著的時候才有，六顆，各自的節奏用座標算。
     它是這個畫面上唯一一直在動的小東西——沒有它，
     「坐在火旁邊」看起來會像一張靜止的圖。 */
  if (lit) {
    for (var e = 0; e < 6; e++) {
      var eh = hash('ember' + e);
      H.push('<i class="ember" style="left:' + (16 + eh % 26) + 'px;' +
        '--ed:' + (1400 + (eh >>> 6) % 900) + 'ms;' +
        'animation-delay:' + ((eh >>> 13) % 1600) + 'ms"></i>');
    }
  }

  /* 營地那一排記號拿掉了：記號系統整個收掉（見 40-db.js actApprove）。
     一趟走完留下什麼，由帶子、圖鑑、以及走廊變長來說。 */

  H.push('</div>');
  return H.join('');
}

/* ---------- 魔物 ----------
   站在走廊盡頭。清楚到什麼程度跟你走了多少有關——
   剛出發的時候只看得到一團影子，走到底才看得清牠長什麼樣。 */
/* 走到底才遇得到牠。

   牠不畫進前進中的動畫裡：牠是那一趟盡頭擋路的那一隻，而「盡頭」
   就是走完之後。一路上都看得到牠，等於一開始就把唯一的未知揭曉了，
   而且走了五天牠還站在那裡不動，那不是擋路，那是布景。

   擋在你說的那一天上。

   本來牠站在 max(承諾, 過了幾天)，所以時間一過牠就往後退——
   你永遠追不上牠，走過牠這件事不可能發生。而「走過自己說的那一天」
   正是這個系統唯一要讓人看到的事。 */
function sceneMob(t, row, prog, est, ENT) {
  var mob = mobOfRun(row.run);
  var pal = strataAt(depthOf(t.teamId), t.teamId).pal;
  var x = (ENT || SCN.ENT) + est * SCN.TILE + 33;
  /* 這裡本來還掛一塊寫著任務名字的木牌。拿掉了：它浮在半空、會壓到
     角落那一塊，而且那個名字底下那張卡已經有一次——同一件事說兩遍，
     其中一遍看起來就會像壞掉的東西。 */
  var H = [];
  /* 名字要走到一半才看得清。

     本來牠的名字從第一天就寫在那裡——那等於一趟開始就把唯一的未知
     揭曉了。現在前半段只有一團形狀跟一排問號，走近了名字才浮出來。
     每一趟因此有一條小小的線從頭拉到尾。 */
  /* 走到底了牠才出現，而且是浮出來的（scn-mob 那一段動畫）。
     還在路上的時候那裡什麼都沒有——前面是霧，不是一隻站著等你的東西。 */
  H.push('<div class="scn-mob meet" style="left:' + x + 'px">');
  H.push(pxTag(mob.px, pal, 'ch'));
  H.push('<span class="mobn">' + esc(mob.n) + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 這一層的空氣 ----------

   每一層有自己的：荒原飄塵、根脈層飄孢子、水晶迴廊閃、迴聲迷宮有東西
   掠過、銹層落銹屑、深淵冒火星。天花板一律會滴水，因為每一層都是
   地底下。

   位置全部用 hash 算——同一趟每次打開，每一顆都在同一個地方。
   會亂跳的東西不是環境，是特效。節奏各自不同，不然一整片會一起眨。

   它們不帶任何資訊，也不能帶：這一層是哪一層，牆、地板、石頭的顏色
   已經說了。空氣只是讓那個地方看起來真的有空氣。 */
var AIR = {
  wild: { n: 14, k: 'dust' },
  root: { n: 12, k: 'spore' },
  crys: { n: 16, k: 'glint' },
  echo: { n: 10, k: 'mote' },
  rust: { n: 12, k: 'flake' },
  fire: { n: 16, k: 'ember' }
};
function sceneAir(seed, zone, W) {
  var a = AIR[zone.key] || AIR.wild;
  var H = ['<div class="air" style="width:' + W + 'px">'];
  var i, span = Math.max(1, W - 22);
  for (i = 0; i < a.n; i++) {
    var h = hash(seed + '|air|' + i);
    var d = 2600 + ((h >>> 13) % 3400);
    H.push('<i class="ap ' + a.k + '" style="left:' + (h % span) +
      'px;bottom:' + (44 + ((h >>> 7) % 220)) + 'px;--ad:' + d +
      'ms;--ag:-' + ((h >>> 19) % d) + 'ms"></i>');
  }
  for (i = 0; i < 5; i++) {
    var q = hash(seed + '|drop|' + i);
    var dd = 3200 + ((q >>> 9) % 2600);
    H.push('<i class="ap drop" style="left:' + (q % span) +
      'px;--ad:' + dd + 'ms;--ag:-' + ((q >>> 5) % dd) + 'ms"></i>');
  }
  H.push('</div>');
  return H.join('');
}

/* ---------- 火把 ----------
   三幀真的換圖，不是用 CSS 做出來的「像火」。每一盞的速度差一點點，
   不然一整排會一起眨眼，那看起來像壞掉的燈管不像火。 */
function torchAt(x, lit, i) {
  if (!lit) {
    return '<img class="px tor dead" style="left:' + x + 'px" src="' +
      pxSvg(TORCH.dead, TORCH.deadPal, false) + '" alt="">';
  }
  var ms = [300, 360, 420, 340][hash('t' + i) % 4];
  var H = ['<span class="tor" style="left:' + x + 'px;--fd:' + ms + 'ms">'];
  TORCH.frames.forEach(function (f, n) {
    H.push('<img class="px f f' + n + '" src="' + pxSvg(f, TORCH.pal, false) + '" alt="">');
  });
  H.push('</span>');
  return H.join('');
}

/* 重畫之後把角色捲進畫面裡。

   走廊比視窗長的時候，重畫預設會回到最左邊——那樣按了推進之後，
   會看到走廊動了但看不到自己動。這一支讓鏡頭跟著人走。 */
/* 滑到哪裡要記住。重畫會把 innerHTML 換掉，捲軸歸零——
   不記的話你永遠滑不到廊道的另一端。 */
var SEEN_AT = {};

function keepScroll(box, key, centre) {
  if (!box) return;
  var s = SEEN_AT[key];
  if (s && s.at === centre.at) {
    /* 角色沒換位置：放回你剛剛滑到的地方 */
    box.scrollLeft = s.x; box.scrollTop = s.y;
  } else {
    box.scrollLeft = centre.x; box.scrollTop = centre.y;
    SEEN_AT[key] = { at: centre.at, x: centre.x, y: centre.y };
  }
  box.onscroll = function () {
    var k = SEEN_AT[key];
    if (k) { k.x = box.scrollLeft; k.y = box.scrollTop; }
  };
}

function scrollScene() {
  /* 他偶爾說一句。每次重畫都要重掛——innerHTML 整個換掉了。 */
  osTick();

  /* 廊道拖得動。每次重畫都要重掛，因為 innerHTML 被換掉了。 */
  dragScene();

  /* 走過的那一條停在最右邊——最右邊是現在。
     keepScroll 記得他拖到哪，所以往回看過的人回來還在原地。 */
  /* 剖面圖也要拖得動。它比視窗寬得多，而在桌機上原生捲動容器
     拖不動——「看不到右邊」在桌機上因此是常態。 */
  dragBox('.xsec-wrap', 'xsec');

  /* 打開的時候停在自己那一條。圖有兩千多像素寬，視窗七百五，
     而它本來從最左邊開始——排在後面的組打開這一頁看到的是別人。 */
  var xw = document.querySelector('.xsec-wrap');
  var me = xw && xw.querySelector('.xs-shaft.mine');
  if (xw && me) {
    var mx = me.offsetLeft + me.offsetWidth / 2 - xw.clientWidth / 2;
    keepScroll(xw, 'xsec', { at: me.offsetLeft, x: Math.max(0, mx), y: 0 });
  }

  var rs = document.querySelector('.rstrip');
  if (rs) {
    keepScroll(rs, 'rstrip', { at: rs.scrollWidth, x: rs.scrollWidth, y: 0 });
  }

  var box = document.querySelector('.scn-scroll');
  var hero = document.querySelector('.scn-hero');
  if (box && hero) {
    keepScroll(box, 'scn', {
      at: hero.offsetLeft,
      x: Math.max(0, hero.offsetLeft + hero.offsetWidth / 2 - box.clientWidth / 2),
      y: 0
    });
  }

  /* 地圖一樣：打開來要先看到自己那塊地，不然全班那片地上
     你得先找自己在哪裡。 */
  var mb = document.querySelector('.dig-wrap');

  /* 地層的名字放在左邊那一條裡，但地圖比視窗寬——
     一往右捲就看不見了。讓它跟著橫捲走。 */
  if (mb) {
    var zs = mb.querySelectorAll('.dig-z');
    var pin = function () {
      for (var i = 0; i < zs.length; i++) zs[i].style.left = (mb.scrollLeft + 3) + 'px';
    };
    pin();
    mb.addEventListener('scroll', pin);
  }

  var mh = mb && mb.querySelector('.dig-hero');
  if (mb && mh) {
    keepScroll(mb, 'dig', {
      at: mh.offsetLeft + ',' + mh.offsetTop,
      x: Math.max(0, mh.offsetLeft + mh.offsetWidth / 2 - mb.clientWidth / 2),
      y: Math.max(0, mh.offsetTop + mh.offsetHeight / 2 - mb.clientHeight / 2)
    });
  }
}

/* ---------- 走出去的那一下 ----------

   一學期的終點。交出去有一整場戰鬥，出去本來只是換一頁——
   這一段補上那個份量。

   一道從上面下來的光、兩邊是岩壁、人沿著光往上走出畫面。
   沒有粒子、沒有光暈：跟全作一致，硬邊、零模糊、光從上面來。

   動畫只加東西不當閘門——時鐘被凍住的時候人停在井底，還是看得見。 */
function exitScene(t) {
  var z = strataAt(Math.max(0, depthOf(t.teamId) - 1), t.teamId);
  var H = ['<div class="xit ' + z.key + '">'];

  /* 兩邊的岩壁。中間那一條是光。 */
  H.push('<div class="xit-sky"></div>');
  H.push('<div class="xit-rock l"></div>');
  H.push('<div class="xit-rock r"></div>');
  H.push('<div class="xit-beam"></div>');

  /* 地表。走出去就是走到這一條上面。 */
  H.push('<div class="xit-top"></div>');

  /* 人。背影，沿著光往上走。 */
  H.push('<div class="xit-hero">');
  H.push(pxTag(HERO.back, HERO.pal, 'ch'));
  H.push(heroPack(t.teamId));
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 廊道拖得動 ----------

   本來只能靠捲軸或觸控慣性，桌機上等於不能前後看。抓著廊道拉，
   前面幾天跟後面幾天都看得到——那條廊道是這個作品的主畫面，
   看不了前後就等於只看得到一格。

   兩件要小心的事：
   一 · 拖跟點要分得開。移動超過五個像素才算拖，不然招牌與出口
        會變成點不到。
   二 · 拖完不要讓瀏覽器把它當成點擊送出去（見 click 的攔截）。 */
/* 用滑鼠把一個橫向捲動的容器拖著走。

   在手機上手指本來就滑得動，但在桌機上原生的捲動容器**拖不動**——
   只能用捲軸或 shift＋滾輪。而這個作品裡比視窗寬的東西有兩個：
   廊道與班級地下城那張剖面圖。兩個都要拖得動，而且手感要一樣。

   key 是給 keepScroll 記位置用的，兩個容器各自記各自的。 */
function dragBox(sel, key) {
  var box = document.querySelector(sel);
  if (!box || box.dataset.drag) return;
  box.dataset.drag = '1';

  var down = false, moved = false, x0 = 0, l0 = 0;

  box.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    down = true; moved = false;
    x0 = e.clientX; l0 = box.scrollLeft;
  });

  box.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - x0;
    if (!moved && Math.abs(dx) < 5) return;
    if (!moved) { moved = true; box.classList.add('dragging'); }
    box.scrollLeft = l0 - dx;
    /* 記住拖到哪裡，重畫之後放回去（見 keepScroll）。 */
    var k = SEEN_AT[key];
    if (k) k.x = box.scrollLeft;
    e.preventDefault();
  });

  function up() {
    down = false;
    box.classList.remove('dragging');
    /* 拖完那一下的 click 不要送出去，不然會誤觸招牌或出口。 */
    if (moved) {
      box.addEventListener('click', function stop(ev) {
        ev.stopPropagation(); ev.preventDefault();
        box.removeEventListener('click', stop, true);
      }, true);
    }
  }
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('pointerleave', up);
}

/* 廊道。每次重畫都要重掛，因為 innerHTML 被換掉了。 */
function dragScene() { dragBox('.scn-scroll', 'scn'); }

/* ---------- 他偶爾說一句 ----------

   借的是角色頭上那一塊牌子：本來寫「前進中」，說話的時候換成那一句，
   說完換回來。一個位置兩種內容——所以它在結構上不可能跟別的字疊到，
   不是靠位置算得剛好。

   只有走著或坐著的時候才說。停很久、在等老師、退回來了那幾種狀態，
   畫面上已經有一句更要緊的話，他不該在旁邊插嘴。

   每一次重畫都要重掛，因為 innerHTML 整個換掉了。 */
var OS_T = null;
function stopOS() { if (OS_T) { clearTimeout(OS_T); OS_T = null; } }

function osTick() {
  stopOS();
  var tag = document.querySelector('.scn .hero-tag');
  if (!tag) return;
  var scn = document.querySelector('.scn');
  var walking = scn.className.indexOf('walking') >= 0;
  var resting = scn.className.indexOf('resting') >= 0;
  if (!walking && !resting) return;

  var back = tag.textContent;
  var cls = tag.className;

  function say() {
    var t = document.querySelector('.scn .hero-tag');
    if (!t) return stopOS();
    var line = heroLine(me(), walking);
    if (!line) return stopOS();
    t.textContent = line;
    t.className = cls + ' os';
    /* 放得下才放得進去。

       泡泡從角色身上長出去，而廊道是一個會捲的窗——他站在窗的哪裡，
       左右各剩多少，每一次都不一樣。而 .scn 是 overflow:hidden，
       落在窗外的字是被切掉，不是跑版。

       所以量兩邊剩多少，往寬的那一邊長，寬度收到那一邊放得下為止。
       這件事只有量得到位置的時候算得出來，所以它在這裡不在 CSS 裡。 */
    var box = document.querySelector('.scn');
    if (box) {
      var br = box.getBoundingClientRect();
      var hr = t.parentNode.getBoundingClientRect();
      var roomR = br.right - hr.left - 11;
      var roomL = hr.right - br.left - 11;
      var left = roomL > roomR;
      var room = Math.max(roomL, roomR);
      t.style.maxWidth = Math.max(132, Math.min(264, room)) + 'px';
      t.className = cls + ' os' + (left ? ' os-l' : '');
    }
    OS_T = setTimeout(function () {
      var u = document.querySelector('.scn .hero-tag');
      if (!u) return stopOS();
      u.textContent = back;
      u.className = cls;
      OS_T = setTimeout(say, 12000 + Math.random() * 11000);
    }, 4200);
  }
  /* 第一句別在打開的同一秒冒出來——那看起來像通知，不像自言自語。 */
  OS_T = setTimeout(say, 6000 + Math.random() * 7000);
}


/* ===== 62-eco.js ===== */
/* 班級地下城：一張地質剖面。

   這是「關聯性」那根柱子的全部，而且它只做一件事：
   讓你看得到別人也在下面——不比較、不排名、不知道誰比較好。

   為什麼是剖面而不是列表：列表只要有兩列就會被讀成名次，剖面讀起來
   是一個地方。每一組往下走自己的一條廊道，廊道之間沒有共同的終點線，
   因為每一組的專案本來就不一樣。

   岩層（見 13-strata.js）是全班共用的地質，不是關卡。誰都看得到全部
   四層，沒有哪一層需要「開」。深度變了岩石就變了，就這樣。

   岩壁裡住著東西。牠們跟任何一組的進度都無關，就只是住在那裡——
   擋在你走廊盡頭的那一隻，只是其中一隻。牠們不是鈕：要查一隻
   去圖鑑，那裡有全部二十四隻。

   記號系統拿掉之後，這張圖上可以點的只剩一種：欄頭，那一組是誰。
   一種東西一句話。

   立體感來自每一塊右邊的側面（見 54-eco.css），不是把整條廊道斜著推——
   正交的長條看起來像進度表，有側面的廊道看起來像地下城。 */

/* ---------- 版面 ----------

   橫的，由左至右——跟首頁那一條廊道同一套文法。每一組一條，上下排開，
   全部從同一條左邊界起算，所以長度直接比得出來，不用讀任何數字。

   本來是直的剖面：每一組往下挖一口井，格子畫的是「挖空的洞」。
   橫過來之後格子的意思也跟著換：

     一塊 ＝ 老師收下的一趟。實心的，疊上去的。
     虛的一塊 ＝ 交出去了，還在老師那邊。
     右邊的暗岩 ＝ 還沒挖到的地方，每一條都留著。

   為什麼是「老師收下的」而不是「走完的」——走是他自己的事，
   留下來是要有人看過的事（見 40-db.js 的 sealedDepth）。
   走完但還沒被收下的那一趟看得到，但它是虛的：那一塊還沒站住。

   石頭的顏色只跟「第幾塊」有關，跟哪一組無關（strataAt 吃 classId）。
   一旦讓某一組有自己的顏色，這張圖就開始比誰的比較漂亮。
   六層沒有先後、順序一個班洗一次，所以顏色不帶任何「你該到哪」。 */
var XL = {
  NAME: 176,   /* 左邊：這是哪一組 */
  MIN: 55,     /* 一塊最窄。窄到這裡就不再收，改成橫著捲 */
  MAX: 88,     /* 一塊最寬。再寬就變成一片色塊，邊角那道斜切也看不出來 */
  BH: 66,      /* 一塊的高 */
  HEAD: 44,    /* 條的上面留給角色站的那一條 */
  LANE: 121,   /* 一條佔的高：44 站的 ＋ 66 條 ＋ 11 間隔 */
  AHEAD: 4,    /* 每一條右邊都要留著的、還沒挖到的那幾格 */
  TOP: 55      /* 最上面那條尺 */
};

function xlY(i) { return XL.TOP + i * XL.LANE; }

/* 這一組疊到第幾塊。實心幾塊、後面掛不掛一塊虛的。 */
function xlCount(r) { return r.sealed + (r.pending ? 1 : 0); }

/* ---------- 整張圖 ---------- */
function xsScene(rows, meId, classId) {
  /* 畫多長：最長的那一條再往右幾格。右邊永遠還有沒挖過的岩石——
     切齊最長的那一組，那條邊就變成終點線了。 */
  var most = rows.reduce(function (a, r) { return Math.max(a, xlCount(r)); }, 0);
  var cols = Math.max(6, most + XL.AHEAD);
  var H = xlY(rows.length) + 22;

  /* 橫向全部交給 CSS 算（見 54-eco.css）：--cols 是幾格、--nm 是名牌多寬，
     每一塊的左緣與寬度都是 (100% − 名牌) ÷ 格數。
     所以這張圖在電腦上撐滿、在手機上退到最窄再捲。 */
  var out = ['<div class="xsec-wrap"><div class="xsec" style="--cols:' + cols +
    ';--nm:' + XL.NAME + 'px;min-width:' + (XL.NAME + cols * XL.MIN) +
    'px;max-width:' + (XL.NAME + cols * XL.MAX) + 'px;height:' + H + 'px">'];

  /* ── 每一直行的石頭 ──
     整張圖的底。同一行不管哪一組，石頭都一樣，因為那是同一片地質。 */
  for (var n = 0; n < cols; n++) {
    var zn = strataAt(n, classId);
    out.push('<div class="xl-col ' + zn.key + '" style="--i:' + n + '"></div>');
  }

  /* ── 最上面那條尺 ──
     只寫多深，不寫「應該到哪」。兩塊一個刻度，一塊一個會太密。 */
  out.push('<div class="xl-rule"></div>');
  /* 最後一格那一條不畫：它剛好落在整張圖的右緣，1px 就撐出一條橫向捲軸。 */
  for (var d = 2; d < cols; d += 2) {
    out.push('<div class="xl-tick" style="--i:' + d + '">' +
      '<span>' + (d * WORLD.depthPerMilestone) + ' m</span></div>');
  }

  /* ── 沒挖到的岩石裡住著東西 ── */
  out.push(xlFauna(rows, cols, classId));

  /* ── 每一組一條 ── */
  /* meId 可以是一個組（學生）或一串組（老師帶的那幾組）。 */
  var mineSet = {};
  if (typeof meId === 'string' && meId) mineSet[meId] = 1;
  else if (meId && meId.length) meId.forEach(function (x) { mineSet[x] = 1; });
  rows.forEach(function (r, i) {
    out.push(xlLane(r, i, cols, classId, !!mineSet[r.teamId]));
  });

  out.push('</div></div>');
  return out.join('');
}

/* ---------- 還沒挖到的地方住著什麼 ----------

   位置用行與列算，不擲骰子——每次打開同一隻都在同一個地方。
   會亂跳的東西不是生態，是特效。

   只長在沒有人挖到的那一段：牠們跟任何一組的進度無關，
   就只是住在那裡，而且前面還有。 */
function xlFauna(rows, cols, classId) {
  var out = [];
  rows.forEach(function (r, i) {
    var from = xlCount(r) + 1;
    for (var n = from; n < cols; n++) {
      var h = hash('f/' + classId + '/' + i + '/' + n);
      if (h % 100 < 68) continue;
      var z = strataAt(n, classId);
      var c = faunaAt(z.key, i * 7 + n);
      if (!c) continue;
      /* 不是鈕。牠是岩石裡的東西——要查牠去圖鑑，那裡有全部二十四隻。 */
      /* 跟那一疊同一個高度：牠們住在岩石裡，不是浮在兩排之間。 */
      out.push('<div class="xl-fauna" style="--i:' + n + ';top:' +
        (xlY(i) + XL.HEAD + 11 + (h >>> 5) % 22) + 'px" title="' + esc(c.n) + '">' +
        pxTag(c.px, z.pal, '') + '</div>');
    }
  });
  return out.join('');
}

/* ---------- 一組一條 ---------- */
/* mine 是「這一條要不要標成自己的」。學生只有一條，老師有好幾條，
   所以判斷放在呼叫端，這裡只收一個布林。 */
function xlLane(r, i, cols, classId, mine) {
  var y = xlY(i);
  var tm = teamOf(r.teamId);
  var left = !!(tm && tm.leftAt);
  var n = xlCount(r);
  var H = ['<div class="xl-lane' + (mine ? ' mine' : '') + (left ? ' out' : '') +
    '" style="top:' + y + 'px;height:' + XL.LANE + 'px">'];

  /* 左邊那一格：他們在做什麼，跟他們是誰。

     大的是專案名不是組名——「第一組 · 甲」是座號，
     「畢製分工失衡」才是他們在做的事。

     整格是一顆鈕，點進去是「他們是誰」；中間那一疊是另一顆，
     點進去是「他們做了什麼」。一條上兩個問題，各自一顆鈕。 */
  H.push('<button class="xl-name" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'crew:' + r.teamId })) + '\' title="' +
    esc(r.name) + '" style="top:' + XL.HEAD + 'px;height:' + XL.BH + 'px">');
  /* 這裡試過掛那一組的招牌，撤掉了：signOf 對每一組都回同一張
     （見 40-db.js，材質跟深度綁的那一版拿掉之後它就是個殘骸）。
     五個一模一樣的圖示不會讓一排更好認，只會教眼睛忽略那一欄。 */
  H.push('<b>' + esc(r.project || '（還沒定）') + '</b>');
  H.push('<em>' + esc(shortName(r.name)) + '</em>');
  H.push('</button>');

  /* 疊起來的那幾塊。整排是一顆鈕：點下去看他們被派過哪些任務。

     空的那幾組也點得到——鈕蓋滿整條，不然還沒被收下任何一趟的組
     整條是死的，而那正是最需要被點開看一眼的那一組。 */
  H.push('<button class="xl-stack" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'team:' + r.teamId })) + '\' ' +
    'style="top:' + XL.HEAD + 'px;height:' + XL.BH + 'px">');
  for (var k = 0; k < n; k++) {
    var z = strataAt(k, classId);
    var wait = (k === n - 1) && r.pending;
    H.push('<i class="xl-b ' + z.key + (wait ? ' wait' : ' on') +
      '" style="--k:' + k + '"></i>');
  }
  H.push('</button>');

  /* 角色站在自己那一條的最後一塊上面，腳踩在條的上緣。點他看那一個人。

     本來人站在最深的那一格裡。搬到條上面來，是因為一整排人的左右
     就是一整排的長短——誰疊得多，不用讀任何數字。
     還沒疊到任何一塊的那一組站在起點上，不是站在空中。 */
  var hr = r.hero || HERO;
  var pose = left ? hr.win : (r.stall >= 2 ? hr.sleep : hr.idle);
  H.push('<button class="xl-hero' + (r.stall >= 2 && !left ? ' sleep' : '') +
    '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'person:' + r.teamId })) + '\' title="' +
    esc(shortName(r.name)) + '" style="--k:' + Math.max(0, n - 1) + '">');
  H.push(pxTag(pose, hr.pal, 'ch-s'));
  if (r.stall === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine-s'));
  H.push('</button>');

  /* 走出去的那一組，那一條的盡頭是一道光。
     別人看得到「他們走出去了」——而那跟估得準不準無關。 */
  if (left) H.push('<span class="xl-exit" style="top:' + XL.HEAD +
    'px;--k:' + n + '"></span>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 點開的那一隻 ----------
   生態不是背景。點得開才叫生態——不然那些圖只是牆紙。 */
function faunaCard() {
  var pick = DRAFT.fa;
  if (!pick) {
    return '';
  }
  var c = faunaByName(pick);
  if (!c) return '';
  var s = null;
  STRATA.forEach(function (x) { if (x.name === c.r) s = x; });
  var H = ['<div class="card fa ' + (s ? s.key : '') + '">'];
  H.push('<div class="fa-in">');
  H.push(pxTag(c.px, (s || STRATA[0]).pal, 'fa-px'));
  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(c.r) + '</div>');
  H.push('<h2>' + esc(c.n) + '</h2>');
  H.push('<p class="lead">' + esc(c.t) + '</p>');
  H.push('</div></div></div>');
  return H.join('');
}

ACTS.fauna = function (name) { DRAFT.fa = name; render(); };


/* 點開的那一張任務之證。別組的也點得開——那是這張圖上唯一會一直
   長出新東西的地方，而且長出新東西的是別人。 */


/* 圖例拿掉了。一張要配對照表才看得懂的圖，是那張圖沒畫好——
   顏色對到地層、實心對到走過、小人對到人在哪，這幾件事看一次就會了。
   點得開的那幾樣（生物、別組留下的記號）自己會說明自己。 */

function ecoRows(classId) {
  return ecology(classId).map(function (r) {
    var tm = teamOf(r.teamId);
    r.project = tm && tm.project;
    /* 那一條廊道裡站的是那一組自己的人。這一頁一次畫五組，
       不能吃全域那一個 HERO——那樣五條裡站的都是看的人自己。 */
    var mem = where('Users', function (x) {
      return x.teamId === r.teamId && x.role === 'student';
    })[0];
    r.hero = heroOf(mem);
    return r;
  });
}

/* ---------- 學生看到的 ---------- */
PAGES.eco = function () {
  var t = myTeam();
  var rows = ecoRows(t.classId);
  /* 地圖回到這一頁。首頁要的是「不用學就懂」，那是廊道；
     這張圖要學三條規則（一格＝一趟、顏色＝哪一組、亮的可以點），
     所以它屬於一個你特地過來看的地方。

     打通與蓋東西也在這裡——動手的地方跟看的地方要是同一個。 */
  var H = [head('班級地下城', '大家都在下面', '')];
  H.push(xsScene(rows, t.teamId, t.classId));
  /* 岩壁裡那幾隻不再是鈕（見 xsPlace），所以這裡也不再有那張卡。
     要查一隻去圖鑑。 */
  /* 排行榜搬到底下「估得準」那一段。刻意加進來、準備好隨時拿掉的
     ——見 68-rank.js。要拿掉就刪掉那一段跟那兩個檔案。 */
  /* 「石頭變了」那張卡拿掉了。

     它寫的是「你走到新的一層了」，而這一版的地形跟走多少刻意脫鉤：
     六層沒有先後、順序一個班洗一次、顏色只看第幾塊。一張說
     「你到了新的一層」的卡，跟整張圖在講的事情剛好相反。

     那六層是什麼，圖鑑那一頁有全部六張。 */

  /* 留記號是一件在等你做的事，不是一段可以切走的內容，
     所以它跟圖一起留在上面。 */

  /* ── 底下分成三段，一次只看一段 ──
     本來是直的疊在一起，一路捲到兩千像素。捲到底的東西等於沒有。 */
  var dt = DRAFT.dt && teamOf(DRAFT.dt);
  /* 預設打開排行榜。藏起來的東西不會發生任何事——而這一版做它的方法
     是「放進去用，看實際發生什麼」。 */
  var tab = DRAFT.tab || (dt ? 'team' : 'rank');
  if (tab === 'team' && !dt) tab = 'feed';

  var segs = [['rank', '估得準'], ['feed', '最近']];
  if (dt) segs.push(['team', shortName(dt.name)]);
  H.push('<div class="segs">');
  segs.forEach(function (sg) {
    H.push('<button class="seg' + (tab === sg[0] ? ' on' : '') +
      '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tab:' + sg[0] })) + '\'>' + esc(sg[1]) + '</button>');
  });
  H.push('</div>');

  if (tab === 'rank') {
    H.push(rankCard(t.classId, t.teamId));
  } else if (tab === 'team') {
    H.push(digTeamCard(t.classId));
  } else {
    var fd = feedOf(t.classId, 20);

/* ===== 63-pack.js ===== */
/* 任務清單。

   老師派過的每一件事，各自走到哪。走完並且被收下的那幾件，
   各自有一張任務之證（見 43-core.js 與圖鑑）。

   這一頁前後改過三次，方向差很多：老師發裝備 → 隨機三件挑一件 →
   三張事實挑一張 → 現在。前三次都失敗在同一件事上——那個「東西」是我
   發的，跟他那一週沒有關係，所以挑不挑、留哪一件，對他都沒有差別。

   為什麼收集這件事現在站得住——它不是徽章，是樣本：

     · 每一根指向一個具體、不會再發生的那一週
     · 形狀由那一趟自己決定，沒有兩根一樣，而且那個不同是他造成的
     · 不可能再拿到同一根
     · 二十根排在一起會變成一根說不出來的東西：一個學期的形狀

   刻意沒有的東西：總數、進度、缺哪幾根。
   一趟長一根，本來就不會有缺的——沒有東西需要被填滿，
   所以也沒有人會為了填滿它多做一件事。

   遊戲化在這裡的位置是「吸引他打開」，不是「換到好處」。
   一張任務之證不加速、不擋失準、不換任何東西。 */

PAGES.pack = function () {
  var t = myTeam();
  /* 老師派過的每一件事，各自走到哪。包含還沒承諾的，
     所以它是「清單」不只是「紀錄」。 */
  var rows = runsFor(t.teamId).slice().reverse();
  /* 重新想過的那幾趟也是紀錄——它們確實發生過，只是沒有判定。 */
  where('Runs', function (r) { return r.teamId === t.teamId && r.state === 'rethought'; })

     併過來之後這裡是唯一一個看得到自己走過幾趟、準了幾次的地方。 */
  var acc = accuracyOf(t.teamId);
  if (acc.total) {

    H.push(accBar(acc));

  H.push('<div class="card"><div class="rec-list">');

  if (!t.leftAt && !t.exitOk) {

/* 一列＝一件事。狀態、你說幾天、實際幾天、那一趟叫什麼。

   數字靠右對齊，因為「說幾天」跟「實際幾天」是要被互相比較的——
   這一頁順便就是他們自己的估算史。 */
function taskRow(m, r, t) {
  if (!m) return '';
  var st = TASK_STATE[r.state] || TASK_STATE.fresh;
  var H = ['<div class="tk ' + (r.stamp || '') + '">'];

  H.push('<div class="tk-h">');
  H.push('<i class="tk-s ' + st.k + '">' + esc(st.n) + '</i>');
  H.push('<b>' + esc(m.title) + '</b>');
  H.push('</div>');

  /* 說幾天 → 實際幾天。還沒交的那幾趟只有左邊那個數字。 */
  if (r.est) {
    H.push('<div class="tk-n">');
    H.push('<span>你說</span><b>' + r.est + '</b>');
    if (r.actual) { H.push('<span>實際</span><b class="' + (r.stamp || '') + '">' +
      r.actual + '</b>'); }
    else if (r.went) { H.push('<span>走了</span><b>' + r.went + '</b>'); }
    else if (r.state === 'running') {
      var gone = daysBetween(r.committedAt, now());
      H.push('<span>過了</span><b>' + gone + '</b>');
    }
    H.push('<span class="tk-u">天</span>');
    H.push('</div>');
  }

  /* 那一趟插在哪一層的記號拿掉了：記號系統整個收掉。
     這一列剩下的是任務、說幾天、實際幾天、準不準——那一趟本身。 */

  H.push('</div>');
  return H.join('');
}

/* 任務之證那一頁。

   本來這一頁還有一段「地上的物件」，六樣佈景排成一份目錄配說明文字。
   那個版面在說「這些值得收集」，可是它們拿不到、數不了、跟任何事都
   無關；而它旁邊的任務之證是真的，兩個並排會讓人以為物件也拿得到，
   然後去找怎麼拿。找不到。

   物件在廊道裡留著——那裡它有用：每一層長的不一樣，那是讓六層像

function codexThings(t, here) {
  var mine = keepsOf(t.teamId);

  if (!mine.length) {

    H.push('<div class="eyebrow">任務之證</div>');

     沒有東西需要被填滿，所以沒有人會為了填滿它多做一件事。 */
  H.push('<div class="eyebrow">' + mine.length + ' 張</div>');
  H.push('<p class="dim">一件任務一張，老師審核過了才有。名字就是那一件任務，' +
    '而且不會有兩張一樣。</p>');
  H.push('<div class="cores">');
  mine.forEach(function (k) {
    var z = null;
    STRATA.forEach(function (x) { if (x.key === k.zone) z = x; });
    /* 名字讀發下去那一刻記的那一個。舊資料沒有，才回頭查任務名。 */
    var run = k.name ? null : find('Runs', function (x) { return x.runId === k.runId; });
    var ms = run ? msOf(run.msId) : null;
    H.push('<div class="core1 ' + (k.zone || here.key) + '">');
    H.push(pxTag(k.px || coreOf(k.runId), (z || here).pal, 'cx-px core'));
    H.push('<b>' + esc(k.name || (ms ? ms.title : '（那一趟）')) + '</b>');
    H.push('</div>');
  });
  H.push('</div></div>');
  return H.join('');
}
