/* ===== 55-ui.js ===== */
/* 畫面的底：字串拼 HTML、一個路由、一次重畫。

   沒有覆寫層，也沒有模板補丁——每一個畫面就是一支函式，
   改一句話只要改一個地方。 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

/* 一開始沒有人登入。S.who 是 null 的時候只走得到門口那幾頁。 */
var S = { who: null, page: 'gate', p: {}, flash: null };

/* 沒按送出的東西不會進資料表，但重畫的時候要留著。 */
var DRAFT = {};
function draft(id, fallback) { return DRAFT[id] != null ? DRAFT[id] : (fallback || ''); }

function go(page, p) {
  if (typeof stopAnim === 'function') stopAnim();
  S.page = page; S.p = p || {}; S.flash = null; DRAFT = {};
  window.scrollTo(0, 0);
  render();
}
function me() { return S.who ? userOf(S.who) : null; }
function isTeacher() { var u = me(); return !!u && u.role === 'teacher'; }
function myTeam() { var u = me(); return u ? teamOf(u.teamId) : null; }

/* 哪一種身分走得到哪一頁。

   這不是裝飾。研究者看得到全班的紀錄、老師看得到別組的進度——
   路由如果不擋，改一下網址就變成別人。 */
var GATE_PAGES = { gate: 1, login: 1, reg: 1 };
var PAGE_ROLE = {
  home: 'student', commit: 'student', submit: 'student', stamp: 'student',
  camp: 'student', pick: 'student', dash: 'student', eco: 'student', pack: 'student',
  log: 'student', claim: 'student',
  radar: 'teacher', review: 'teacher', ms: 'teacher', classeco: 'teacher',
  rs: 'researcher', roster: 'researcher', events: 'researcher'
};
function allowed(u, page) {
  var need = PAGE_ROLE[page];
  return !need || need === u.role;
}

function head(eyebrow, title, lead) {
  return '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p class="lead">' + nl(lead) + '</p>' : '');
}

/* 一條「你在第幾步」。

   加這個是因為第一次打開會不知道要做什麼：畫面很乾淨，但乾淨到看不出
   自己站在哪。它不是教學，是位置——亮著的那一格就是現在輪到你的。

     steps  [[標題, 副標], …]
     at     現在在第幾格（0 起算；-1 代表都不在） */
function stepBar(steps, at) {
  var H = ['<div class="steps">'];
  steps.forEach(function (s, i) {
    H.push('<div class="step' + (i === at ? ' on' : (i < at ? ' past' : '')) + '">' +
      '<b>' + (i + 1) + '</b>' +
      '<div><i>' + esc(s[0]) + '</i>' + (s[1] ? '<em>' + esc(s[1]) + '</em>' : '') + '</div>' +
      '</div>');
  });
  H.push('</div>');
  return H.join('');
}

/* 像素圖標籤。所有的圖都走這一支——沒有第二種畫圖的方式。 */
function pxTag(px, pal, cls) {
  return '<img class="px ' + (cls || '') + '" src="' + pxSvg(px, pal, false) + '" alt="">';
}

/* 按鈕。act 是「動作:參數」的字串，全部收在 ACTS 裡。 */
function btn(label, act, kind) {
  return '<button class="btn ' + (kind || '') + '" data-act="run" data-p="' +
    esc(JSON.stringify({ a: act })) + '">' + esc(label) + '</button>';
}

/* ---------- 路由 ---------- */

var PAGES = {};

function render() {
  var u = me();

  /* 沒登入：只有門口那幾頁，而且沒有側欄也沒有頂條——
     還不知道你是誰的時候，畫面上不該有任何「你的」東西。 */
  if (!u) {
    if (!GATE_PAGES[S.page]) S.page = 'gate';
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES[S.page]() + '</div></div>';
    return;
  }

  /* 學生還沒對上名冊：先認領，別的哪裡都去不了。
     沒有組別的話，坑道不知道要畫哪一條——側欄跟頂條也一樣，
     它們每一格都在講「你的組」，這時候還沒有那個東西。 */
  if (u.role === 'student' && !u.teamId) {
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES.claim() + '</div></div>';
    S.page = 'claim';
    return;
  }
  if (S.page === 'claim' || GATE_PAGES[S.page]) S.page = homeFor(u);

  if (!PAGES[S.page] || !allowed(u, S.page)) S.page = homeFor(u);

  var body = PAGES[S.page]();
  document.getElementById('app').innerHTML =
    sideBar() + '<div class="main">' + topBar() + demoBar() +
    '<div class="wrap">' + (S.flash ? flashBar() : '') + body + '</div></div>';

  /* 走廊比視窗長的時候，重畫預設回到最左邊——那樣按完推進會看到
     走廊變了卻看不到自己動。鏡頭跟著人走。 */
  if (typeof scrollScene === 'function') scrollScene();
}

function flashBar() {
  return '<div class="flash">' + esc(S.flash) + '</div>';
}
/* say() 自己重畫。本來要記得先 say 再 render——順序寫反訊息就永遠不出現，
   而且那是一種只有測試才抓得到的錯。讓它自己負責。 */
function say(m) { S.flash = m; render(); }

function classOf(u) {
  return find('Classes', function (c) { return c.classId === u.classId; }) || DB.Classes[0] || { name: '' };
}

function topBar() {
  var u = me();
  if (u.role === 'researcher') {
    return '<div class="top">' +
      '<span class="badge r">研究者</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + DB.Users.length + ' 個帳號　·　' + DB.Classes.length + ' 個班　·　' +
        DB.Events.length + ' 筆紀錄</span>' +
      '</div>';
  }
  if (u.role === 'teacher') {
    var r = radar(u.classId);
    return '<div class="top">' +
      '<span class="badge t">老師端</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + esc(classOf(u).name) + '　·　' +
        where('Teams', function (t) { return t.classId === u.classId; }).length + ' 組</span>' +
      '<span>' + (r.length ? r.length + ' 件等你看' : '沒有等你的') + '</span>' +
      '</div>';
  }
  var t = myTeam();
  var st = stallOf(t.teamId);
  return '<div class="top">' +
    '<span class="badge">學生端</span>' +
    '<span class="who">' + esc(t.name) + '</span>' +
    '<span class="sp"></span>' +
    '<span>' + esc(t.project || '（還沒定）') + '</span>' +
    '<span class="' + (st.level ? 'warnx' : '') + '">深度 ' +
      (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</span>' +
    '</div>';
}

/* 試用列。真的上線沒有這一條——它在這裡只是為了讓你兩邊都走得完。 */
function demoBar() {
  var opts = DB.Users.map(function (u) {
    var t = u.teamId ? teamOf(u.teamId) : null;
    return '<option value="' + u.userId + '"' + (u.userId === S.who ? ' selected' : '') + '>' +
      esc(t ? t.name : u.name) + '</option>';
  }).join('');
  return '<div class="demo">' +
    '<b>試用</b><span>切換身分</span>' +
    '<select data-act="who">' + opts + '</select>' +
    '<span class="sp" style="flex:1"></span>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"forward"}\'>把時間往前推一天</a>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"reset"}\'>整班重來</a>' +
    '</div>';
}

function sideBar() {
  var u = me();
  var nav, headBlock;
  if (u.role === 'researcher') {
    headBlock = '<div class="side-head"><div class="k">LAB</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">帳號與紀錄</div></div>';
    nav = [['rs', '帳號'], ['roster', '名冊'], ['events', '紀錄']];
  } else if (u.role === 'teacher') {
    var kl = classOf(u);
    headBlock = '<div class="side-head"><div class="k">TEACHER</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">' + esc(kl.name) + ' · 加入碼 ' +
      esc(kl.joinCode) + '</div></div>';
    /* 老師只有三件事，側欄就只有三格——多一格就是多一件他要煩惱的事。 */
    var wait = radar(u.classId).length;
    nav = [
      ['radar', '審核' + (wait ? '（' + wait + '）' : '')],
      ['ms', '發里程碑'],
      ['classeco', '各組進度']
    ];
  } else {
    var t = myTeam();
    headBlock = '<div class="side-head"><div class="k">TUNNEL</div>' +
      '<div class="n">' + esc(t.name) + '</div>' +
      '<div class="s">' + esc(t.project || '（還沒定）') + '</div></div>';
    nav = [
      ['home', '坑道'], ['pack', '裝備架'], ['eco', '全班地下城'], ['log', '紀錄']
    ];
  }
  var items = nav.map(function (n) {
    return '<a class="' + (S.page === n[0] ? 'on' : '') + '" data-go="' + n[0] + '">' +
      '<span class="dot"></span>' + esc(n[1]) + '</a>';
  }).join('');
  return '<div class="side">' + headBlock + '<div class="nav">' + items + '</div>' +
    '<div class="side-foot"><a class="plain" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'logout' })) + '\'>登出</a></div></div>';
}

/* ---------- 事件 ---------- */

document.addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go'), JSON.parse(g.getAttribute('data-p') || '{}')); return; }
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  if (act !== 'run') return;
  var p = JSON.parse(a.getAttribute('data-p') || '{}');
  runAct(p.a);
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest('[data-act="who"]');
  if (!a) return;
  S.who = a.value;
  DB.Session = S.who;
  save();
  S.page = homeFor(userOf(S.who));
  /* 上一個人的訊息不要跟著換身分過去——那句話不是講給這個人聽的 */
  S.flash = null;
  DRAFT = {};
  render();
});

/* 動作字串：「名稱」或「名稱:參數」 */
function runAct(str) {
  var i = String(str || '').indexOf(':');
  var name = i < 0 ? str : str.slice(0, i);
  var arg = i < 0 ? '' : str.slice(i + 1);
  var f = ACTS[name];
  if (f) f(arg);
}

var ACTS = {
  forward: function () { CLOCK += DAY; render(); },
  reset: function () { seed(); S.who = 'U1'; go('home'); },

  go: function (arg) {
    var i = arg.indexOf(':');
    if (i < 0) return go(arg);
    go(arg.slice(0, i), { id: arg.slice(i + 1) });
  },

  /* 滑桿：只改草稿，不進資料表 */
  est: function (v) { DRAFT.est = v; render(); },

  risk: function (k) {
    DRAFT.risks = DRAFT.risks || [];
    var i = DRAFT.risks.indexOf(k);
    if (i < 0) DRAFT.risks.push(k); else DRAFT.risks.splice(i, 1);
    render();
  },

  snag: function (k) {
    DRAFT.snags = DRAFT.snags || [];
    var i = DRAFT.snags.indexOf(k);
    if (i < 0) DRAFT.snags.push(k); else DRAFT.snags.splice(i, 1);
    render();
  },

  commit: function (msId) {
    var t = myTeam();
    actCommit(t.teamId, msId, Number(DRAFT.est || RULES.EST_DEFAULT), DRAFT.risks || []);
    go('home');
    say('承諾了。從今天開始，每天推一格。');
  },

  /* 補登哪一天。0 是今天。 */
  back: function (v) { DRAFT.back = Number(v) || 0; render(); },

  /* 推進。參數是「runId|今天動的是哪一塊」。 */
  push: function (arg) {
    var i = arg.indexOf('|');
    var runId = i < 0 ? arg : arg.slice(0, i);
    var kind = i < 0 ? 'any' : arg.slice(i + 1);
    var t = myTeam();
    var back = Number(DRAFT.back || 0);
    /* 有沒有藤蔓要碎——推之前先問，推完狀態就變了 */
    var wasStuck = stallOf(t.teamId).level;
    if (!actPush(t.teamId, runId, kind, back)) {
      return say(back ? '那一天已經點過了。' : '今天那一盞已經點好了。一天一盞——多按沒有用。');
    }
    DRAFT.back = 0;
    var r = find('Runs', function (x) { return x.runId === runId; });
    var d = RULES.doingOf(kind);
    var msg;
    if (RULES.progress(r.pushes, r.est) >= 1) {
      msg = '走到走廊底了。交出去之後，系統會比對你當初承諾的天數。';
    } else if (back) {
      msg = '補回來了。那一盞亮了。';
    } else {
      /* 有人跟你一起在下面。這不是名次——它不排序，也不說誰比較多。 */
      var others = todayMovers(t.classId, t.teamId);
      msg = (d ? d.icon + ' ' + d.label + '。' : '') +
        (others ? '今天班上還有 ' + others + ' 條坑道也在響。'
                : '今天你是第一個下來的。');
    }
    /* 先播完動畫再重畫——重畫會把 <img> 換掉，動畫就沒了。
       藤蔓先碎，再揮劍：那個順序就是「你把它弄斷了，然後繼續走」。 */
    var swing = function () { shakeScene(); animPush(function () { say(msg); }); };
    if (wasStuck === 1) animVineBreak(swing); else swing();
  },

  submit: function (runId) {
    var t = myTeam();
    var r = actSubmit(t.teamId, runId, '');
    if (r) go('stamp', { id: runId });
  },

  skipcamp: function (runId) { actSkipCamp(runId); go('home'); },

  reflect: function (runId) {
    var t = myTeam();
    if (!(DRAFT.snags || []).length) return say('點一個就好——哪一個最像。');
    actReflect(t.teamId, runId, DRAFT.snags);
    go('home');
    say('說出來了。老師看得到，而且這不會扣任何東西。');
  },

  /* 老師勾可以了 → 去挑裝備 */
  gear: function (runId) { go('pick', { id: runId }); },

  /* 三選一，挑走那一件。參數是「runId|裝備」。 */
  take: function (arg) {
    var i = arg.indexOf('|');
    var runId = arg.slice(0, i), key = arg.slice(i + 1);
    if (!actPickGear(runId, key)) return say('這一件不在攤開的三件裡。');
    go('dash', { id: runId });
    animDash();   /* 畫面畫好之後才播——go() 已經重畫過了 */
  },

  /* 學生改自己的招牌 */
  rename: function () {
    var t = myTeam();
    var v = (document.getElementById('pj-name') || {}).value || '';
    if (!v.trim()) return say('招牌上總要寫點什麼。');
    if (!actRename(t.teamId, v.trim())) return say('跟原本一樣，沒有改到。');
    go('home');
    say('招牌換字了。材質是挖出來的，那個急不得。');
  },

  /* ---- 老師 ---- */
  publish: function () {
    var title = (document.getElementById('ms-title') || {}).value || '';
    var note = (document.getElementById('ms-note') || {}).value || '';
    if (!title.trim()) return say('先寫這一個里程碑要交什麼。');
    actPublish(me().classId, { title: title.trim(), note: note.trim(), teams: DRAFT.to || [] });
    go('ms');
    say('派出去了。學生那邊會先被問「你打算花幾天」。');
  },

  to: function (teamId) {
    DRAFT.to = DRAFT.to || [];
    var i = DRAFT.to.indexOf(teamId);
    if (i < 0) DRAFT.to.push(teamId); else DRAFT.to.splice(i, 1);
    render();
  },

  /* 老師只勾一個「可以」。挑哪一件是學生的事。 */
  approve: function (runId) {
    var word = (document.getElementById('gr-word') || {}).value || '';
    if (!actApprove(runId, word.trim())) return say('這一件已經看過了。');
    go('radar');
    say('回過去了。他們那邊會攤開三件裝備，自己挑一件帶走。');
  }
};


/* ===== 58-gate.js ===== */
/* 門口：還沒登入之前看得到的每一頁。

   四頁，一頁只問一件事：

     gate   這是什麼、你要登入還是建帳號
     login  帳號密碼
     reg    加入碼 → 帳號密碼（學生自己開；老師與研究者的帳號由研究者開）
     claim  你是名冊上的誰

   為什麼認領要獨立一頁：如果讓學生自己打組名，五個人會打出五種寫法，
   資料就對不起來了。老師先貼名冊，學生從裡面點自己——一次點擊，
   不用打字，而且組別一定對得上。

   密碼在這一版只是雜湊過的字串，擋得住肉眼、擋不住真的攻擊。
   AUTH_NOTE 那句話會印在建立帳號那一頁上，不藏起來。 */

/* ---------- 啟動 ---------- */
PAGES.gate = function () {
  var H = ['<div class="gate">'];
  H.push('<div class="gate-box">');
  H.push(pxTag(SIGNS.glow.px, SIGNS.glow.pal, 'sign'));
  H.push('<h1>專案地下城</h1>');
  H.push('<p class="lead">你的專案是一條往下挖的坑道。老師派里程碑，' +
         '你自己決定花幾天——這裡不打分，只看你說的天數跟實際差多少。</p>');
  H.push('<div class="row">');
  H.push(btn('登入', 'go:login', 'big'));
  H.push(btn('我是新的，建一個帳號', 'go:reg', 'ghost'));
  H.push('</div>');
  H.push('</div></div>');
  return H.join('');
};

/* ---------- 登入 ---------- */
PAGES.login = function () {
  var H = ['<div class="gate"><div class="gate-box">'];
  H.push(head('登入', '你是誰', ''));
  H.push('<div class="card">');
  H.push('<div class="eyebrow">帳號</div>');
  H.push('<input id="lg-acc" value="' + esc(draft('lg-acc')) + '" placeholder="' +
         esc('註冊時取的帳號') + '">');
  H.push('<div class="eyebrow">密碼</div>');
  H.push('<input id="lg-pw" type="password" placeholder="' + esc('密碼') + '">');
  H.push('</div>');
  H.push('<div class="row">');
  H.push(btn('進去', 'login', 'big'));
  H.push(btn('還沒有帳號', 'go:reg', 'ghost'));
  H.push('</div>');
  H.push('<p class="dim">試用的帳號：學生 stu01 到 stu05、老師 tea01、研究者 lab01，' +
         '密碼都是 ' + DEMO_PW + '。</p>');
  H.push('</div></div>');
  return H.join('');
};

/* ---------- 建立帳號 ----------
   只有學生走這一頁。老師跟研究者的帳號由研究者開，因為那兩種身分
   看得到別人的資料——能自己註冊的話，任何人貼一個加入碼就變成老師了。 */
PAGES.reg = function () {
  var H = ['<div class="gate"><div class="gate-box">'];
  H.push(head('建立帳號', '先報上你在哪一班',
    '加入碼跟老師拿。老師與研究者的帳號不從這裡開——請研究者幫你建。'));
  H.push('<div class="card">');
  H.push('<div class="eyebrow">班級加入碼</div>');
  H.push('<input id="rg-code" value="' + esc(draft('rg-code')) + '" placeholder="' +
         esc('六個英數字，跟老師拿') + '">');
  H.push('<div class="eyebrow">帳號</div>');
  H.push('<input id="rg-acc" value="' + esc(draft('rg-acc')) + '" placeholder="' +
         esc('至少三個字，登入用') + '">');
  H.push('<div class="eyebrow">密碼</div>');
  H.push('<input id="rg-pw" type="password" placeholder="' + esc('至少四個字') + '">');
  H.push('</div>');
  H.push('<div class="row">');
  H.push(btn('建立', 'reg', 'big'));
  H.push(btn('我有帳號了', 'go:login', 'ghost'));
  H.push('</div>');
  H.push('<p class="dim">' + esc(AUTH_NOTE) + '</p>');
  H.push('</div></div>');
  return H.join('');
};

/* ---------- 認領身分 ----------
   登入了但還沒對上名冊。這一頁不能跳過——沒有組別，坑道就不知道要挖哪一條。 */
PAGES.claim = function () {
  var u = me();
  var free = freeRoster(u.classId);
  var H = ['<div class="gate"><div class="gate-box">'];
  H.push(head('你是誰', '從名冊上點自己',
    '點一下就好，不用打字。點錯了找研究者解開，再點一次。'));

  if (!free.length) {
    H.push('<div class="card dim">這個班的名冊還沒貼，或是名字都被認領完了。' +
           '找老師或研究者確認一次。</div>');
    H.push(btn('登出', 'logout', 'ghost'));
    H.push('</div></div>');
    return H.join('');
  }

  /* 照組別分堆。同一組的名字排在一起，找自己比較快。 */
  var byTeam = {};
  free.forEach(function (r) {
    (byTeam[r.teamName] = byTeam[r.teamName] || []).push(r);
  });
  Object.keys(byTeam).forEach(function (name) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">' + esc(name) + '</div>');
    H.push('<div class="tags">');
    byTeam[name].forEach(function (r) {
      H.push('<button class="tag" data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: 'claim:' + r.rosterId })) + '\'>' +
        esc(r.memberName) + '</button>');
    });
    H.push('</div></div>');
  });
  H.push(btn('登出', 'logout', 'ghost'));
  H.push('</div></div>');
  return H.join('');
};

};

/* 登入成功之後要去哪。學生還沒認領就先去認領——這件事沒做完，
   後面每一頁都不知道要畫哪一組。 */
function signIn(u) {
  S.who = u.userId;
  DB.Session = u.userId;
  save();
  DRAFT = {};
  go(homeFor(u));
}

function homeFor(u) {
  if (u.role === 'researcher') return 'rs';
  if (u.role === 'teacher') return 'radar';
  if (!u.teamId) return 'claim';
  return 'home';
}


/* ===== 60-student.js ===== */
/* 學生端。

   一頁只給一個動作。首頁就是坑道本身——招牌、角色、迷霧走廊、魔物，
   底下一顆巨大的推進鍵。其餘都是資訊，不是選項。

   零輸入框：天數用滑桿，風險與卡關用圖示標籤。要打字的東西沒有人會寫，
   而且打字會把防衛心叫起來。 */

/* ---------- 坑道（首頁） ---------- */
PAGES.home = function () {
  var t = myTeam();
  var next = nextThing(t.teamId);
  var st = stallOf(t.teamId);
  var acc = accuracyOf(t.teamId);

  var H = [];

  /* ── 你在第幾步 ── */
  H.push(stepBar([
    ['接任務', '你決定花幾天'],
    ['每天推進', '動過就按一下'],
    ['交出去', '比對你承諾的天數'],
    ['挑裝備', '三選一，你自己挑']
  ], STEP_AT[next.kind] == null ? -1 : STEP_AT[next.kind]));

  /* ── 坑道本身。招牌、深度、走廊、魔物全在裡面（見 61-scene.js） ── */
  H.push(scene(t, next.row, st));
  H.push(sceneCap(t, next, st));

  /* ── 唯一的動作 ── */
  H.push(actionCard(t, next, st));

  /* ── 我的預估體感 ── */
  if (acc.total) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">你對自己的預估</div>');
    H.push('<div class="acc">');
    ['exact', 'early', 'late'].forEach(function (k) {
      var s = RULES.STAMPS[k];
      H.push('<div class="acc-c"><b>' + s.mark + '</b><i>' + acc[k] + '</i><span>' + s.name + '</span></div>');
    });
    H.push('</div>');
    H.push('<p class="dim">' + esc(accSay(acc)) + '</p>');
    H.push('</div>');
  }

  /* ── 帶在身上的那一句 ── */
  var carry = carriedGear(t.teamId);
  if (carry) {
    H.push('<div class="card carry">');
    H.push('<div class="eyebrow">你帶在身上的</div>');
    H.push('<div class="carry-in"><b>' + carry.icon + '</b><div><i>' +
      esc(carry.name) + '</i><em>' + esc(carry.why) + '</em></div></div>');
    H.push(btn('看裝備架', 'go:pack', 'ghost'));
    H.push('</div>');
  }

  /* ── 招牌 ── */
  var ns = nextSignIn(t.teamId);
  H.push('<div class="card">');
  H.push('<div class="eyebrow">坑道口的招牌</div>');
  H.push('<p class="dim">上面寫什麼是你們的事，老師不替你們命名。' +
         '材質不是——那個是挖出來的' +
         (ns.need ? '，再走完 ' + ns.need + ' 個里程碑會換成「' + esc(ns.name) + '」' : '') + '。</p>');
  H.push('<div class="rn-row">');
  H.push('<input id="pj-name" value="' + esc(t.project || '') +
         '" placeholder="' + esc('這個專案現在叫什麼') + '">');
  H.push(btn('換字', 'rename', 'ghost'));
  H.push('</div></div>');

  return H.join('');
};

/* nextThing 回的那個字，對到步驟條的第幾格。 */
var STEP_AT = {
  commit: 0,
  push: 1, waiting: 1, wake: 1,
  submit: 2, camp: 2, review: 2,
  gear: 3
};

/* 準度的一句話。從數字組出來，不是寫死的。 */
function accSay(a) {
  if (!a.total) return '';
  if (a.late === 0 && a.total >= 2) return '你到目前為止沒有失準過。這比做得快更難。';
  if (a.late > a.exact) return '多數時候你把事情想得比實際簡單。下一次試著往上加幾天。';
  if (a.early > a.exact) return '你常常比自己承諾的早完成——可能是把事情想得太難了。';
  return '準的次數最多。你的時間體感正在成形。';
}

/* ---------- 場景底下那一行 ----------
   走廊自己不寫字（寫了就變回圖表）。要講的數字放在它底下。 */
function sceneCap(t, next, st) {
  var row = next.row;
  if (!row || !row.run || !row.run.runId) {
    return '<p class="scn-cap">走廊還是暗的。老師派了里程碑，先決定你要花幾天，' +
           '火把才點得起來。</p>';
  }
  var run = row.run;
  var open = run.state === 'running' ? openDays(t.teamId, run.runId) : [];
  return '<p class="scn-cap">你自己承諾 <b>' + run.est + '</b> 天，已經來過 <b>' +
    run.pushes + '</b> 天。' +
    (st.level ? '　·　' + esc(RULES.stallSay(st.level, st.days)) : '') +
    (open.length ? '　·　' + open.map(function (o) { return o.label; }).join('、') +
      '那一盞還沒點' : '') + '</p>';
}

/* 哪一組遇到哪一隻：任務 ＋ 組算出來，全班同一個里程碑不是同一隻 */
function mobFor(msId, teamId) {
  return MOBS[hash(msId + '|' + teamId) % MOBS.length];
}

/* ---------- 唯一的那一顆動作 ---------- */
function actionCard(t, next, st) {
  var H = ['<div class="act-card">'];
  var row = next.row;

  if (next.kind === 'wake') {
    H.push('<div class="eyebrow">' + esc(WORLD.light[st.level].label) + '</div>');
    H.push('<h2>' + esc(RULES.stallSay(st.level, st.days)) + '</h2>');
    H.push('<p class="dim">這裡只是把「停下來了」畫出來，沒有別的後果——' +
           '沒有扣任何東西，也沒有人被通知。點一個下面的圖示，火就回來了。</p>');
    H.push(doingRow(row.run.runId));

  } else if (next.kind === 'commit') {
    H.push('<div class="eyebrow">新的里程碑</div>');
    H.push('<h2>' + esc(row.ms.title) + '</h2>');
    if (row.ms.note) H.push('<p class="dim">' + nl(row.ms.note) + '</p>');
    H.push('<p class="lead">你打算花幾天？這是你對自己的承諾，老師不會替你決定。</p>');
    H.push(btn('決定天數', 'go:commit:' + row.ms.msId, 'big'));

  } else if (next.kind === 'push') {
    H.push(doingCard(t, row, '今天'));

  } else if (next.kind === 'submit') {
    H.push('<div class="eyebrow">走到終點了</div>');
    H.push('<h2>' + esc(row.ms.title) + '</h2>');
    H.push('<p class="dim">把作業交到老師原本收的地方，然後在這裡按一下。' +
           '系統會比對你當初承諾的天數。</p>');
    H.push(btn('我交出去了', 'go:submit:' + row.run.runId, 'big'));

  } else if (next.kind === 'camp') {
    H.push('<div class="eyebrow">營火</div>');
    H.push('<h2>比你承諾的久。</h2>');
    H.push('<p class="dim">先坐下來。說出卡在哪不會扣任何東西——' +
           '講得清楚的困難，老師才幫得上忙。</p>');
    H.push(btn('去營火旁', 'go:camp:' + row.run.runId, 'big'));

  } else if (next.kind === 'gear') {
    H.push('<div class="eyebrow">老師看完了</div>');
    H.push('<h2>挑一件帶走。</h2>');
    if (row.run.word) H.push('<p class="quote">' + nl(row.run.word) + '</p>');
    H.push('<p class="dim">會攤開三件。挑哪一件是你的事——' +
           '那句話是給你自己讀的。</p>');
    H.push(btn('去挑', 'gear:' + row.run.runId, 'big'));

  } else if (next.kind === 'waiting') {
    var open2 = openDays(t.teamId, row.run.runId);
    H.push('<div class="eyebrow">今天那一盞點好了</div>');
    H.push('<h2>' + (open2.length ? '還有沒點的那幾盞。' : '明天再來一次。') + '</h2>');
    H.push('<p class="dim">一天一盞。這是每天的紀錄，不是工作的單位——' +
           '真的做完了是你說了算，隨時交得出去。</p>');
    if (open2.length) H.push(backRow(open2));
    if (DRAFT.back) H.push(doingRow(row.run.runId));
    H.push(btn('提早做完了，現在就交', 'go:submit:' + row.run.runId, 'ghost'));

  } else if (next.kind === 'review') {
    H.push('<div class="eyebrow">在老師那邊</div>');
    H.push('<h2>他還沒看。</h2>');
    H.push('<p class="dim">他看的順序是照等最久的排，不是先交先看。</p>');

  } else {
    H.push('<div class="eyebrow">坑道很安靜</div>');
    H.push('<h2>目前沒有等你做的。</h2>');
    H.push('<p class="dim">老師隨時可能派新的里程碑。</p>');
  }

  H.push('</div>');
  return H.join('');
}

/* ---------- 今天動的是哪一塊 ----------

   這一排就是推進鍵本身。點任何一個都算今天來過了，所以還是一下點擊——
   跟原本那一顆「推進」一樣，只是那一下開始帶意義：走廊上會留下這個圖示。

   刻意沒有「什麼都沒做」那一格。這一排問的是動了什麼，
   沒動的人本來就不會來按——給他一個按鈕承認自己沒動，那是罰站。 */
function doingRow(runId) {
  var H = ['<div class="tags big doing-row">'];
  RULES.DOING.forEach(function (d) {
    H.push('<button class="tag" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'push:' + runId + '|' + d.key })) + '\'>' +
      '<b>' + d.icon + '</b><i>' + esc(d.label) + '</i><em>' + esc(d.hint) + '</em></button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 補登。忘了按的那幾天列在這裡——忘一天就再也補不回來的話，
   人會把整條走廊一起放掉。 */
function backRow(open) {
  var H = ['<div class="tags"><span class="k">忘了按？</span>'];
  open.forEach(function (o) {
    H.push('<button class="tag' + (Number(DRAFT.back) === o.back ? ' on' : '') +
      '" data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'back:' + o.back })) +
      '\'>' + esc(o.label) + '有動</button>');
  });
  if (DRAFT.back) {
    H.push('<button class="tag" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'back:0' })) + '\'>算了</button>');
  }
  H.push('</div>');
  return H.join('');
}

/* 推進那一整張卡 */
function doingCard(t, row, whenWord) {
  var open = openDays(t.teamId, row.run.runId);
  var b = Number(DRAFT.back || 0);
  var word = b ? (b === 1 ? '昨天' : '前天') : whenWord;
  var H = [];
  H.push('<div class="eyebrow">' + esc(word) + '　·　' + esc(row.ms.title) + '</div>');
  H.push('<h2>' + esc(word) + '動的是哪一塊？</h2>');
  H.push('<p class="dim">點一個就算來過了——那一下就是推進，不用再按第二顆。' +
         '走廊上會留下這個圖示，七天之後回頭看得出你這一趟長什麼樣。</p>');
  H.push(doingRow(row.run.runId));
  if (open.length) H.push(backRow(open));
  H.push(btn('提早做完了，現在就交', 'go:submit:' + row.run.runId, 'ghost'));
  return H.join('');
}

/* 這一趟每天做的事，湊出來的一句話。不是評語，是給下一次估天數用的線索。 */
function doingSay(n, total) {
  var think = (n.look || 0) + (n.plan || 0);
  var hands = (n.make || 0) + (n.redo || 0);
  if (!total) return '';
  if ((n.redo || 0) * 2 >= total) {
    return '大半的日子在改。改很難估——下一次留一段時間專門給它，不要算在做的那幾天裡。';
  }
  if (think > hands) {
    return '查跟想佔掉大半。那幾天是真的在做事，只是估天數的時候最容易被漏掉。';
  }
  if ((n.talk || 0) >= 2) {
    return '有好幾天在跟人談。約人這件事排不進自己的行事曆——下一次先把它算進去。';
  }
  return '大半的日子真的動到手上的東西。你的時間大致花在你以為的地方。';
}

/* ---------- 承諾：滑桿 ＋ 風險標籤 ---------- */
PAGES.commit = function () {
  var t = myTeam();
  var m = msOf(S.p.id);
  if (!m) return '<div class="card">找不到這一個里程碑。</div>';
  var est = Number(draft('est', RULES.EST_DEFAULT));
  var risks = DRAFT.risks || [];

  var H = [head('自我承諾', m.title, m.note)];

  /* 上一次自己挑走的那一句。這是裝備唯一的用途，而且是真的有用：
     它不是系統的建議，是他上一次寫給這一刻的自己看的。 */
  var carry = carriedGear(t.teamId);
  if (carry) {
    H.push('<div class="card carry">');
    H.push('<div class="eyebrow">你上一次挑走的那一句</div>');
    H.push('<div class="carry-in"><b>' + carry.icon + '</b><div><i>' +
      esc(carry.name) + '</i><em>' + esc(carry.why) + '</em></div></div>');
    H.push('</div>');
  }

  H.push('<div class="card">');
  H.push('<div class="eyebrow">你打算花幾天</div>');
  H.push('<div class="slider-wrap">');
  H.push('<input type="range" class="slider" id="est" min="' + RULES.EST_MIN +
         '" max="' + RULES.EST_MAX + '" value="' + est +
         '" oninput="ACTS.est(this.value)">');
  H.push('<div class="slider-read"><b>' + est + '</b><span>天</span></div>');
  H.push('</div>');
  H.push('<p class="dim">這個數字是你自己說的。誤差 ' + RULES.band(est) +
         ' 天以內都算準——' + Math.round(RULES.BAND_RATIO * 100) + '％ 的容許範圍。</p>');
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">你覺得會卡在哪　選填</div>');
  H.push('<p class="dim">先標起來。事後對照——標對了就是預見能力，那比準時更值錢。</p>');
  H.push('<div class="tags">');
  RULES.RISKS.forEach(function (r) {
    var on = risks.indexOf(r.key) >= 0;
    H.push('<button class="tag' + (on ? ' on' : '') + '" onclick="ACTS.risk(\'' + r.key + '\')">' +
           r.icon + ' ' + esc(r.label) + '</button>');
  });
  H.push('</div></div>');

  H.push('<div class="row">');
  H.push(btn('我承諾 ' + est + ' 天', 'commit:' + m.msId, 'big'));
  H.push(btn('回坑道', 'go:home', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 上傳 ---------- */
PAGES.submit = function () {

  if (!r) return '<div class="card">找不到。</div>';

  var H = [head('交出去', m.title, '')];

  H.push('<div class="big-num">' + used + ' <span>天</span></div>');
  H.push('<p class="dim">' + esc(RULES.judgeWhy(r.est, used)) + '</p>');
  H.push('</div>');
  H.push('<p class="lead">作業交到老師原本收的地方。這裡不收檔案，也看不到內容。</p>');
  H.push('<div class="row">');
  H.push(btn('確認交出去了', 'submit:' + r.runId, 'big'));
  H.push(btn('還沒', 'go:home', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 判定結果 ---------- */
PAGES.stamp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var m = msOf(r.msId), s = RULES.STAMPS[r.stamp];

  var H = ['<div class="stamp-card ' + r.stamp + '">'];
  H.push('<div class="stamp-mark">' + s.mark + '</div>');
  H.push('<h1>' + esc(s.name) + '</h1>');
  H.push('<p class="lead">' + esc(s.why) + '</p>');
  H.push('<div class="stamp-num"><b>' + r.est + '</b><span>承諾</span>' +
         '<b>' + r.actual + '</b><span>實際</span></div>');
  H.push('<p class="dim">' + esc(RULES.judgeWhy(r.est, r.actual)) + '</p>');
  H.push('</div>');

  if (r.stamp === 'late') {
    H.push(btn('去營火旁說一下', 'go:camp:' + r.runId, 'big'));

    H.push(btn('好', 'skipcamp:' + r.runId, 'big'));
  }
  return H.join('');
};

/* ---------- 營火復盤 ---------- */
PAGES.camp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var m = msOf(r.msId);
  var picked = DRAFT.snags || [];

  var H = ['<div class="camp">'];
  H.push(pxTag(CAMPFIRE.px, CAMPFIRE.pal, 'fire'));
  H.push('<div>');
  H.push('<div class="eyebrow">營火</div>');
  H.push('<h2>卡在哪？</h2>');
  H.push('<p class="dim">點就好，不用打字。這不會扣任何東西——' +
         '說得出卡在哪，本身就是一種專案能力。</p>');
  H.push('</div></div>');

  H.push('<div class="card"><div class="tags big">');
  RULES.SNAGS.forEach(function (g) {
    var on = picked.indexOf(g.key) >= 0;
    H.push('<button class="tag' + (on ? ' on' : '') + '" onclick="ACTS.snag(\'' + g.key + '\')">' +
           '<b>' + g.icon + '</b><i>' + esc(g.label) + '</i><em>' + esc(g.hint) + '</em></button>');
  });
  H.push('</div></div>');

  /* 這一趟每天做的。這是估不準的線索，不是評語。 */
  var ds = doingOfRun(r.runId);
  if (ds.length) {
    var n = {};
    ds.forEach(function (k) { n[k] = (n[k] || 0) + 1; });
    H.push('<div class="card">');
    H.push('<div class="eyebrow">這一趟你每天做的</div>');
    H.push('<div class="tags small">');
    RULES.DOING.forEach(function (d) {
      if (n[d.key]) H.push('<span class="tag static">' + d.icon + ' ' +
        esc(d.label) + ' × ' + n[d.key] + '</span>');
    });
    H.push('</div>');
    H.push('<p class="dim">' + esc(doingSay(n, ds.length)) + '</p>');
    H.push('</div>');
  }

  /* 當初標的風險有沒有中 */
  if (r.risks && r.risks.length) {
    var hit = r.risks.filter(function (k) { return picked.indexOf(k) >= 0; });
    H.push('<div class="card">');
    H.push('<div class="eyebrow">你當初標的風險</div>');
    H.push('<div class="tags">');
    r.risks.forEach(function (k) {
      var d = RULES.snagOf(k);
      if (d) H.push('<span class="tag static' + (picked.indexOf(k) >= 0 ? ' hit' : '') + '">' +
                    d.icon + ' ' + esc(d.label) + '</span>');
    });
    H.push('</div>');
    if (hit.length) H.push('<p class="ok">你預見到了。那比準時更值錢。</p>');
    H.push('</div>');
  }

  H.push(btn('說完了', 'reflect:' + r.runId, 'big'));
  return H.join('');
};

/* ===== 61-scene.js ===== */
/* 坑道的場景。

   之前這裡是一條進度條：角色 → 幾個方格 → 魔物。它讀得懂，但它是圖表。
   這一支把它改成一個地方——有洞口、有天花板、有地板、有石頭、有火把，
   角色站在裡面而不是站在旁邊。

   幾件事是有意義的，不是裝飾：

     火把    一天一盞。推進幾次，走廊就亮幾盞——「你來過幾次」畫出來的樣子。
     腳印    走過的每一格留一個。走廊上唯一的歷史，而且它不算分。
     迷霧    從你站的地方往前蓋住。往前走一格，霧就退一格。
     魔物    藏在霧裡，越靠近越清楚。它不是敵人，是這一趟要交的東西。

   還有一件事是刻意不做的：走廊上沒有任何「你應該走到哪」的記號。
   沒有基準線，就沒有落後這回事。 */

var SCN = {
  TILE: 44,     /* 一天一格 */
  ENT: 132,     /* 洞口那一段 */
  END: 154,     /* 魔物站的那一段 */
  H: 286,       /* 場景高 */
  FLOOR: 66     /* 地板上緣離底部多高——站在地上的東西都用這個 */
};

/* 一條走廊。

     t     這一組
     row   現在在跑的那一個 run（可能沒有）
     st    停滯狀態 */
function scene(t, row, st) {
  var run = row && row.run;
  var est = run ? (run.est || 1) : 4;
  var at = run ? Math.min(run.pushes, est) : 0;
  var done = run && run.state !== 'running';
  var walked = done ? est : at;
  var seed = t.teamId + (run ? '|' + run.runId : '');
  /* 每一格頭上掛的是那一天做了什麼。走廊因此讀得出形狀——
     七格全是 🔍 跟七格全是 🛠️ 是完全不同的一趟。 */
  var did = run ? doingOfRun(run.runId) : [];
  var light = WORLD.light[st.level];
  var W = SCN.ENT + est * SCN.TILE + SCN.END;

  var H = ['<div class="scn ' + light.key + '">'];

  /* 固定在角落的深度。走廊往旁邊捲，它不跟著捲——
     那是「你在多深的地方」，不是走廊上的一個位置。 */
  H.push('<div class="scn-hud">' +
    '<b>' + (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</b>' +
    '<span>走完 ' + depthOf(t.teamId) + ' 個里程碑</span></div>');

  H.push('<div class="scn-scroll"><div class="scn-in" style="width:' + W + 'px">');

  /* ── 天花板：鐘乳石 ── */
  for (var d = 0; d < Math.ceil(W / 44); d++) {
    var dp = dripFor(seed, d);
    if (!dp) continue;
    H.push('<span class="drip" style="left:' + (d * 44 + dp.off) + 'px">' +
      pxTag(dp.px, DRIP.pal, '') + '</span>');
  }

  /* ── 洞口 ── */
  H.push(sceneMouth(t));

  /* ── 地板 ── */
  H.push('<div class="floor" style="left:0;width:' + W + 'px"></div>');
  /* 走過的那一段地板是挖開的，亮一階 */
  if (walked > 0) {
    H.push('<div class="floor lit" style="left:' + SCN.ENT + 'px;width:' +
      (walked * SCN.TILE) + 'px"></div>');
  }

  /* ── 一天一格 ── */
  for (var i = 0; i < est; i++) {
    var x = SCN.ENT + i * SCN.TILE;
    var on = i < walked;

    /* 火把：走過的那幾格點著 */
    H.push(torchAt(x + 6, on, i));

    /* 腳印 */
    if (on) H.push('<img class="px foot" style="left:' + (x + 11) + 'px" src="' +
      pxSvg(STEP_PX.px, STEP_PX.pal, false) + '" alt="">');

    /* 那一天做了什麼 */
    if (on && did[i]) {
      var dd = RULES.doingOf(did[i]);
      if (dd) H.push('<span class="doing" style="left:' + x + 'px" title="' +
        esc(dd.label) + '">' + dd.icon + '</span>');
    }

    /* 第幾天 */
    H.push('<span class="dayn' + (i === walked ? ' here' : (on ? ' past' : '')) +
      '" style="left:' + x + 'px">' + (i + 1) + '</span>');

    /* 挖開的地方才長得出東西 */
    if (on) {
      var p = propFor(seed, i);
      if (p === 'rubble') H.push('<img class="px prop rubble" style="left:' + (x + 5) +
        'px" src="' + pxSvg(RUBBLE.px, RUBBLE.pal, false) + '" alt="">');
      if (p === 'crystal') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(CRYSTAL.px, CRYSTAL.pal, false) + '" alt="">');
      if (p === 'shroom') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(SHROOM.px, SHROOM.pal, false) + '" alt="">');
    }
  }

  /* ── 魔物 ── */
  if (run) H.push(sceneMob(t, row, walked / est));

  /* ── 角色 ── */
  var pose = st.level >= 2 ? HERO.sleep : HERO.idle;
  var hx = SCN.ENT + walked * SCN.TILE - 11;
  H.push('<div class="hero scn-hero' + (st.level >= 2 ? ' asleep' : '') +
    '" style="left:' + hx + 'px">');
  H.push(pxTag(pose, HERO.pal, 'ch'));
  if (st.level === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine'));
  H.push('</div>');

  /* 角色手上那一盞的光。一圈一圈地暗下去，不是模糊的漸層——
     模糊的話它會立刻看起來像貼在像素圖上面的現代特效。 */
  H.push('<div class="halo" style="left:' + (hx - 121) + 'px"></div>');

  /* ── 霧 ──
     從站的地方往前蓋住。它蓋的是「還沒走的那幾天」，
     所以往前一格霧就退一格。 */
  var fogAt = SCN.ENT + (walked + 1) * SCN.TILE;
  if (fogAt < W) {
    H.push('<div class="fog" style="left:' + fogAt + 'px"></div>');
  }

  H.push('</div></div>');   /* scn-in / scn-scroll */
  H.push('</div>');         /* scn */
  return H.join('');
}

/* ---------- 洞口 ----------
   左邊是你進來的地方：拱門、從上面落下來的光、掛著的招牌。
   招牌就在這裡，不在標題列——它是坑道口的看板，不是頁首。 */
function sceneMouth(t) {
  var sg = signOf(t.teamId);
  var H = ['<div class="mouth" style="width:' + SCN.ENT + 'px">'];
  H.push('<div class="shaft"></div>');
  H.push('<div class="arch"></div>');
  H.push('<div class="hang">');
  H.push('<div class="chain"></div>');
  H.push(pxTag(sg.px, sg.pal, 'sign'));
  H.push('</div>');
  H.push('<div class="mouth-txt"><b>' + esc(t.project || '（還沒定）') + '</b>' +
    '<span>' + esc(sg.name) + '</span></div>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 魔物 ----------
   站在走廊盡頭。清楚到什麼程度跟你走了多少有關——
   剛出發的時候只看得到一團影子，走到底才看得清牠長什麼樣。 */
function sceneMob(t, row, prog) {
  var mob = mobFor(row.ms.msId, t.teamId);
  var pal = DEPTH_PAL[Math.min(3, depthOf(t.teamId))];
  var x = SCN.ENT + (row.run.est || 1) * SCN.TILE + 33;
  var H = [];
  /* 任務牌不在魔物那一層——魔物要藏在霧裡，要交什麼不可以。 */
  H.push('<div class="goal" style="left:' + x + 'px">' + esc(row.ms.title) + '</div>');
  H.push('<div class="scn-mob" style="left:' + x + 'px;opacity:' +
    (0.40 + 0.60 * prog).toFixed(2) + '">');
  H.push(pxTag(mob.px, pal, 'ch'));
  H.push('<span class="mobn">' + esc(mob.n) + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 火把 ----------
   三幀真的換圖，不是用 CSS 做出來的「像火」。每一盞的速度差一點點，
   不然一整排會一起眨眼，那看起來像壞掉的燈管不像火。 */
function torchAt(x, lit, i) {
  if (!lit) {
    return '<img class="px tor dead" style="left:' + x + 'px" src="' +
      pxSvg(TORCH.dead, TORCH.deadPal, false) + '" alt="">';
  }
  var ms = [300, 360, 420, 340][hash('t' + i) % 4];
  var H = ['<span class="tor" style="left:' + x + 'px;--fd:' + ms + 'ms">'];
  TORCH.frames.forEach(function (f, n) {
    H.push('<img class="px f f' + n + '" src="' + pxSvg(f, TORCH.pal, false) + '" alt="">');
  });
  H.push('</span>');
  return H.join('');
}

/* 重畫之後把角色捲進畫面裡。

   走廊比視窗長的時候，重畫預設會回到最左邊——那樣按了推進之後，
   會看到走廊動了但看不到自己動。這一支讓鏡頭跟著人走。 */
function scrollScene() {
  var box = document.querySelector('.scn-scroll');
  var hero = document.querySelector('.scn-hero');
  if (!box || !hero) return;
  var want = hero.offsetLeft + hero.offsetWidth / 2 - box.clientWidth / 2;
  box.scrollLeft = Math.max(0, want);
}


/* ===== 62-eco.js ===== */
/* 全班地下城：2.5D 蟻巢剖面。

   這是「關聯性」那根柱子的全部。它要做到一件事，而且只有這一件：
   讓你看得到別人也在坑道裡——不比較、不排名、不知道誰比較好。

   所以它畫的是空間，不是名次。每一組往下挖自己的一條豎坑，深度是
   走完幾個里程碑。坑道之間沒有共同的終點線，因為每一組的專案不一樣。

   立體感來自每一塊右邊的側面，不是把整條坑道斜著推——正交的長條看起來
   像進度表，有側面的豎坑看起來像地下城。 */

var ECO_W = 128;     /* 一條坑道的寬 */
var ECO_SEG = 46;    /* 一格深度的高 */
/* 立體感靠每一塊右邊的側面（見 50-style.css 的 .seg::after），
   不是把整塊往旁邊推——推的話四格之後就壓到隔壁那條坑道了。 */

function ecoScene(rows, meId) {
  var maxD = Math.max(4, rows.reduce(function (a, r) {
    return Math.max(a, r.depth + (r.at > 0 ? 1 : 0));
  }, 0));
  var H = ecoHeight(maxD);

  var out = ['<div class="eco2" style="height:' + (H + 96) + 'px">'];

  /* 地表 */
  out.push('<div class="eco2-sky"><span>地表</span></div>');

  /* 深度刻度：只標數字，不標「應該到哪」 */
  for (var d = 1; d <= maxD; d++) {
    out.push('<div class="eco2-rule" style="top:' + (ecoTop(d) + 48) + 'px">' +
      '<span>' + (d * WORLD.depthPerMilestone) + ' m</span></div>');
  }

  /* 每一組一條豎坑 */
  rows.forEach(function (r, i) {
    out.push(ecoShaft(r, i, maxD, r.teamId === meId));
  });

  out.push('</div>');
  return out.join('');
}

function ecoTop(d) { return d * ECO_SEG; }
function ecoHeight(maxD) { return ecoTop(maxD) + ECO_SEG; }

/* 一條坑道 */
function ecoShaft(r, i, maxD, mine) {
  var x = i * (ECO_W + 18);
  var H = [];
  H.push('<div class="shaft' + (mine ? ' mine' : '') + '" style="left:' + x + 'px">');

  /* 坑道口的招牌 */
  var sg = SIGNS[r.sign] || SIGNS.wood;
  H.push('<div class="shaft-head">');
  H.push(pxTag(sg.px, sg.pal, 'sign-s'));
  H.push('<b>' + esc(r.name) + '</b>');
  H.push('<span>' + esc(r.project || '（還沒定）') + '</span>');
  H.push('</div>');

  /* 挖出來的每一格。垂直對齊，立體感靠 CSS 給的側面。 */
  for (var d = 1; d <= maxD; d++) {
    var dug = d <= r.depth;
    var here = d === r.depth + 1 && r.at > 0;
    H.push('<div class="seg' + (dug ? ' dug' : '') + (here ? ' here' : '') + '"' +
      ' style="top:' + ecoTop(d - 1) + 'px">');
    if (here) {
      /* 正在挖的那一格：填到承諾的比例 */
      H.push('<i style="height:' + Math.round(r.at * 100) + '%"></i>');
    }
    H.push('</div>');
  }

  /* 小人站在最深的那一格 */
  var at = r.depth + (r.at > 0 ? 1 : 0);
  var pose = r.stall >= 2 ? HERO.sleep : HERO.idle;
  H.push('<div class="shaft-hero ' + (r.stall >= 2 ? 'sleep' : r.stall === 1 ? 'vine' : '') + '"' +
    ' style="top:' + (ecoTop(Math.max(0, at - 1)) + 4) + 'px">');
  H.push(pxTag(pose, HERO.pal, 'ch-s'));
  if (r.stall === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine-s'));
  H.push('</div>');

  /* 底下一句狀態。不講快慢，只講現在在做什麼。 */
  H.push('<div class="shaft-foot" style="top:' + (ecoHeight(maxD) + 8) + 'px">' +
    esc(r.stall >= 2 ? '休息中' : r.stall === 1 ? '慢下來了' : r.onMs ? '挖掘中' : '等派任務') +
    '</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 老師看到的：各組進度 ----------

PAGES.classeco = function () {

    H.push('<span class="dim">深度 ' + (r.depth * WORLD.depthPerMilestone) + ' m</span>');

    /* 現在在做什麼 */

      H.push('<p class="lead">在等你看：' + esc(wait.ms.title) + '</p>');

    } else if (offer) {

    } else if (camp) {

      H.push('<div class="log-num">自己承諾 <b>' + run.est + '</b> 天　·　已推進 <b>' +
             run.pushes + '</b> 天' +
             (r.stall >= 2 ? '　·　<span class="warnx">' + r.stall + ' 級休息中</span>' :
              r.stall === 1 ? '　·　<span class="dim">慢下來了</span>' : '') + '</div>');
      if (run.risks && run.risks.length) {
        H.push('<div class="tags small"><span class="k">他們事先標的風險</span>');
        run.risks.forEach(function (k) {
          var d = RULES.snagOf(k);

        });

    } else {
      H.push('<p class="dim">手上沒有里程碑。派一個給他們就會開始。</p>');

             '準 <b>' + acc.exact + '</b>　早 <b>' + acc.early + '</b>　失準 <b>' +
             acc.late + '</b></div>');

};


/* ===== 63-pack.js ===== */
/* 裝備架。

   先講裝備到底是什麼，因為這件事很容易做歪。

   它不是道具。它不加速、不擋失準、不換任何東西——一旦裝備能換到好處，
   學生就會為了那個好處做事，而那正是這個作品要避免的事。

   它是一句話。老師勾了可以之後，系統攤開三件（隨機，跟表現無關），
   學生挑一件。挑的那一下他其實是在說：「這一次我想記住的是這句。」

   所以它的用途只有一個，而且是真的有用：

     下一次拉滑桿決定要花幾天的時候，他自己挑的那句話會出現在那一頁。

   那不是系統在給建議，是他自己寫給下一次的自己看的。這一頁就是那些
   句子放在一起的地方。

   還有一件事是刻意的：六件全部列出來，沒拿到的那幾件句子照樣讀得到，
   而且不寫「幾件收集完成」。寫了就變成收集進度，那一秒它又變回一個
   要被填滿的條。 */

/* 最近挑走的那一件。它就是「帶在身上的」。 */
function carriedGear(teamId) {
  var gs = gearsOf(teamId);
  if (!gs.length) return null;
  return RULES.gearOf(gs[gs.length - 1].key);
}

/* 這一組每一件各挑過幾次、分別是哪一趟 */
function gearTally(teamId) {
  var n = {};
  gearsOf(teamId).forEach(function (g) {
    var r = find('Runs', function (x) { return x.runId === g.runId; });
    var m = r ? msOf(r.msId) : null;
    (n[g.key] = n[g.key] || []).push(m ? m.title : '');
  });
  return n;
}

PAGES.pack = function () {
  var t = myTeam();
  var tally = gearTally(t.teamId);
  var carry = carriedGear(t.teamId);

  var H = [head('裝備架', '你挑走的那些話',
    '裝備不換任何東西——它不加速，也擋不了失準。它是一句你自己選要記住的話。' +
    '下一次決定要花幾天的時候，你帶在身上的那一句會出現在那一頁。')];

  /* 帶在身上的 */
  H.push('<div class="card carry">');
  H.push('<div class="eyebrow">帶在身上的</div>');
  if (carry) {
    H.push('<div class="carry-in">');
    H.push('<b>' + carry.icon + '</b>');
    H.push('<div><i>' + esc(carry.name) + '</i>' +
      '<em>' + esc(carry.why) + '</em></div>');
    H.push('</div>');
    H.push('<p class="dim">下一次拉滑桿決定天數的時候，這句話會出現在那一頁。' +
           '挑走新的一件就換成新的那一句。</p>');
  } else {
    H.push('<p class="dim">還沒有。走完一個里程碑、老師勾了可以之後，' +
           '會攤開三件讓你挑一件。</p>');
  }
  H.push('</div>');

  /* 架上全部 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">架上</div>');
  H.push('<p class="dim">六件都在這裡。攤開哪三件是隨機的，跟你做得如何無關——' +
         '所以沒拿到的那幾件不代表任何事，句子也照樣讀得到。</p>');
  H.push('<div class="shelf">');
  RULES.GEARS.forEach(function (g) {
    var got = tally[g.key];
    H.push('<div class="slot' + (got ? ' got' : '') +
      (carry && carry.key === g.key ? ' on' : '') + '">');
    H.push('<b>' + g.icon + '</b>');
    H.push('<i>' + esc(g.name) + (got && got.length > 1 ? ' × ' + got.length : '') + '</i>');
    H.push('<em>' + esc(g.why) + '</em>');
    if (got) {
      H.push('<span class="from">' + got.map(function (x) {
        return esc(x || '（那一趟）');
      }).join('　·　') + '</span>');
    } else {
      H.push('<span class="from dim">還沒挑到這一件</span>');
    }
    H.push('</div>');
  });
  H.push('</div></div>');

  H.push(btn('回坑道', 'go:home', 'ghost'));
  return H.join('');
};

      where('Teams', function (x) { return x.classId === c.classId; }).length + ' 組　·　' +
      '老師 ' + esc(t ? t.name : '（還沒指定）') + '</span></div>');
  });
  H.push('<div class="eyebrow" style="margin-top:14px">開一個新的班</div>');
  H.push('<div class="rn-row">');
  H.push('<input id="ncls" placeholder="' + esc('班級名稱，例：設計專題') + '">');
  H.push(btn('建立', 'newclass', 'ghost'));
  H.push('</div>');
  H.push('</div>');

  /* 開一個老師或研究者 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">開一個老師或研究者的帳號</div>');
  H.push('<div class="rn-row">');
  H.push('<input id="nu-acc" placeholder="' + esc('帳號') + '">');
  H.push('<input id="nu-name" placeholder="' + esc('顯示名稱') + '">');
  H.push('<input id="nu-pw" placeholder="' + esc('先給一個密碼，之後請他自己換') + '">');
  H.push('</div>');
  H.push('<div class="row" style="margin:11px 0 0">');
  H.push(btn('建老師', 'newuser:teacher', 'ghost'));
  H.push(btn('建研究者', 'newuser:researcher', 'ghost'));
  H.push('</div>');
  H.push('</div>');

  /* 帳號清單 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">帳號　' + DB.Users.length + ' 個</div>');
  DB.Users.forEach(function (u) {
    var t = u.teamId ? teamOf(u.teamId) : null;
    H.push('<div class="rn-row">');
    H.push('<b>' + esc(u.name) + '</b>');
    H.push('<span class="dim">' + esc(u.account) + '　·　' + esc(ROLE_SAY[u.role] || u.role) +
      (t ? '　·　' + esc(t.name) : '') +
      (u.lastLogin ? '　·　上次登入 ' + daysBetween(u.lastLogin, now()) + ' 天前' : '　·　還沒登入過') +
      '</span>');
    H.push('<span class="sp" style="flex:1"></span>');
    H.push(btn('重設密碼', 'respw:' + u.userId, 'ghost'));
    H.push(btn('刪除', 'deluser:' + u.userId, 'ghost'));
    H.push('</div>');
  });
  H.push('</div>');
  return H.join('');
};

/* ---------- 名冊 ---------- */
PAGES.roster = function () {
  var cid = rsClassId();
  var rows = where('Roster', function (r) { return r.classId === cid; });
  var H = [head('名冊', '誰在這個班',
    '一行一組，像「甲：小明, 小華」。貼上去之後，學生註冊完就從裡面點自己是誰——' +
    '不用他們自己打組名，資料才對得起來。')];

  H.push(classPicker());

  H.push('<div class="card">');
  H.push('<div class="eyebrow">貼上名冊</div>');
  H.push('<textarea id="rt" rows="6" placeholder="' +
    esc('甲：小明, 小華, 阿哲\n乙：怡君, 小柏\n丙：家豪, 品彤, 宥廷') + '">' +
    esc(draft('rt')) + '</textarea>');
  H.push('<p class="dim">同一組再貼一次不會重建，只會補上新的名字。' +
         '已經被認領的名字不會被洗掉。</p>');
  H.push(btn('存進去', 'saveroster', ''));
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">現在的名冊　' + rows.length + ' 人</div>');
  if (!rows.length) H.push('<p class="dim">還沒有人。貼一份上去。</p>');
  rows.forEach(function (r) {
    var u = r.claimedBy ? userOf(r.claimedBy) : null;
    H.push('<div class="rn-row">');
    H.push('<b>' + esc(r.teamName) + '</b>');
    H.push('<span>' + esc(r.memberName) + '</span>');
    H.push('<span class="sp" style="flex:1"></span>');
    if (u) {
      H.push('<span class="dim">' + esc(u.account) + ' 認領了</span>');
      H.push(btn('解除', 'unclaim:' + r.rosterId, 'ghost'));
    } else {
      H.push('<span class="dim">還沒有人認領</span>');
    }
    H.push('</div>');
  });
  H.push('</div>');
  return H.join('');
};

/* ---------- 紀錄 ---------- */
PAGES.events = function () {
  var cid = rsClassId();
  var only = DRAFT.evTeam || '';
  var all = eventsOf(cid, only ? { teamId: only } : null);
  var show = all.slice(0, 200);

  var H = [head('紀錄', all.length + ' 筆',
    '每一個會改到資料的動作都留一筆。記的是行為的形狀——承諾幾天、哪一天推進、' +
    '判定結果、卡在哪。系統不收作業，所以這裡看不到任何作業內容。')];

  H.push(classPicker());

  /* 篩組別 */
  H.push('<div class="tags">');
  H.push('<button class="tag' + (only ? '' : ' on') + '" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'evteam:' })) + '\'>全班</button>');
  where('Teams', function (t) { return t.classId === cid; }).forEach(function (t) {
    H.push('<button class="tag' + (only === t.teamId ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'evteam:' + t.teamId })) + '\'>' + esc(t.name) + '</button>');
  });
  H.push('</div>');

  /* 匯出 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">匯出　CSV</div>');
  H.push('<p class="dim">貼進試算表就能算。欄位：時間、角色、組別、事件、說明。</p>');
  H.push('<textarea id="csv" rows="4" readonly>' + esc(exportCsv(cid)) + '</textarea>');
  H.push(btn('存成檔案', 'csv', 'ghost'));
  H.push('</div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">流水帳' +
    (all.length > show.length ? '　只列最近 ' + show.length + ' 筆' : '') + '</div>');
  if (!show.length) H.push('<p class="dim">還沒有動作。</p>');
  show.forEach(function (e) {
    var t = e.teamId ? teamOf(e.teamId) : null;
    H.push('<div class="rn-row">');
    H.push('<b>' + esc(t ? t.name : (ROLE_SAY[e.role] || '')) + '</b>');
    H.push('<span>' + esc(evSay(e)) + '</span>');
    H.push('<span class="sp" style="flex:1"></span>');
    H.push('<span class="dim">' + daysBetween(e.at, now()) + ' 天前</span>');
    H.push('</div>');
  });
  H.push('</div>');
  return H.join('');
};

/* ---------- 研究者的動作 ---------- */

ACTS.rscls = function (id) { DRAFT.rsClass = id; render(); };
ACTS.evteam = function (id) { DRAFT.evTeam = id; render(); };

ACTS.newclass = function () {
  var v = (document.getElementById('ncls') || {}).value || '';
  if (!v.trim()) return say('先給這個班一個名字。');
  var r = actCreateClass(v.trim(), '');
  DRAFT.rsClass = r.klass.classId;
  render();
  say('建好了。加入碼是 ' + r.klass.joinCode + '——把它給學生。');
};

ACTS.newuser = function (role) {
  var acc = (document.getElementById('nu-acc') || {}).value || '';
  var name = (document.getElementById('nu-name') || {}).value || '';
  var pw = (document.getElementById('nu-pw') || {}).value || '';
  var kl = find('Classes', function (c) { return c.classId === rsClassId(); });
  var r = actRegister({
    account: acc, password: pw, name: name, role: role,
    code: kl ? kl.joinCode : ''
  });
  if (r.err) return say(r.err);
  /* 老師要跟班綁在一起，不然他打開來看不到任何一組 */
  if (role === 'teacher' && kl && !kl.teacherId) { kl.teacherId = r.user.userId; save(); }
  say((role === 'teacher' ? '老師' : '研究者') + '帳號好了。請他用這個密碼登入之後自己換掉。');
};

ACTS.respw = function (userId) {
  var pw = (document.getElementById('nu-pw') || {}).value || '';
  if (!pw.trim()) return say('先在上面那格「先給一個密碼」寫一個新的，再按重設。');
  var r = actResetPw(userId, pw.trim());
  if (r.err) return say(r.err);
  say(userOf(userId).name + ' 的密碼換成你寫的那一個了。');
};

ACTS.deluser = function (userId) {
  if (DRAFT.del !== userId) {
    DRAFT.del = userId;
    return say('再按一次「刪除」就真的刪掉 ' + userOf(userId).name + ' 的帳號。');
  }
  var name = userOf(userId).name;
  var r = actDeleteUser(userId);
  DRAFT.del = null;
  if (r.err) return say(r.err);
  if (userId === S.who) return ACTS.logout();
  render();
  say(name + ' 的帳號刪掉了。他認領過的名字放回名冊上了。');
};

ACTS.saveroster = function () {
  var v = (document.getElementById('rt') || {}).value || '';
  var r = actSaveRoster(rsClassId(), v);
  if (r.err) { DRAFT.rt = v; return say(r.err); }
  DRAFT.rt = '';
  render();
  say('存好了，補上 ' + r.added + ' 個名字。');
};

ACTS.unclaim = function (rosterId) {
  var r = actUnclaim(rosterId);
  if (r.err) return say(r.err);
  render();
  say('解開了。那個人重新登入之後可以再點一次。');
};

ACTS.csv = function () {
  var name = '專案地下城-紀錄.csv';
  try {
    /* BOM，不然 Excel 開起來中文是亂碼 */
    var blob = new Blob(['﻿' + exportCsv(rsClassId())], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('存成 ' + name + ' 了。');
  } catch (e) {
    say('這個瀏覽器不給存檔。上面那格的字全選複製也一樣。');
  }
};


/* ===== 80-app.js ===== */
/* 開機。 */

(function () {
  /* 資料結構換過就重種一次，不要拿舊的撐新的畫面。
     Events 是後來才加的表——舊的存檔沒有它，畫面一讀就會炸。 */
  if (!load() || !DB.Milestones || !DB.Runs || !DB.Events) seed();

  /* 上次登入的人還記得。關掉分頁再打開不用重登。 */
  var u = DB.Session ? userOf(DB.Session) : null;
  if (u) { S.who = u.userId; S.page = homeFor(u); }
  else { S.who = null; S.page = 'gate'; }
  render();
})();

</script>
