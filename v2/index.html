<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>專案地下城</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'C11';src:url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@v1.500/fonts/web/Cubic_11.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* 樣子。

   字級只用 11 的倍數——Cubic 11 是 11px 的點陣字，放到 13px、17px 會糊掉。
   所以整份只有 11 / 22 / 33 / 44 / 55 / 66 六級，沒有中間值。 */

:root{
  --bg:#0B0A09; --panel:#14110D; --panel2:#1A1611; --sunk:#0E0C0A;
  --line:#2E2822; --line2:#443B31;
  --ink:#E8E0D2; --dim:#9A8F7D; --mute:#857A69;
  --gold:#E9B341; --gold2:#F5CB74; --gold-d:#7A5A18;
  --ok:#7CC98F; --over:#D9603F; --warn:#E9B341;
  --L:#C9A227; --Ld:#9A7E22; --Ll:#F2E6C8; --Lbg:#171208; --Lline:#3A2E12;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:'C11','Noto Sans TC',monospace;
  font-size:22px; line-height:1.7;
  -webkit-font-smoothing:none;
  image-rendering:pixelated;
}
button,input,textarea,select{font-family:inherit;font-size:22px;color:inherit}
img{display:block}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 版面 ---------- */

#app{display:flex;min-height:100vh}

.side{
  width:242px;flex:0 0 242px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto
}
.side-head{padding:22px;border-bottom:1px solid var(--line)}
.side-head .n{font-size:22px;margin-top:5px}
.side-head .s{font-size:22px;color:var(--dim);margin-top:5px}

.nav{padding:11px 0;flex:1}
.nav a{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  color:var(--dim);cursor:pointer;border-left:3px solid transparent;font-size:22px
}
.nav a:hover{color:var(--ink);background:var(--panel2)}
.nav a.on{color:var(--gold);background:var(--panel2);border-left-color:var(--gold)}
.nav a .dot{width:11px;height:11px;background:currentColor;opacity:.55;flex:0 0 11px}
.nav a.on .dot{opacity:1}
.nav .gap{height:11px}

.main{flex:1;min-width:0}
.wrap{max-width:1540px;padding:33px 44px 88px}

/* ---------- 頂條 ---------- */

.top{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;font-size:22px;color:var(--dim);flex-wrap:wrap
}
.top .who{font-size:22px;color:var(--ink)}
.top .sp{flex:1}
.badge{
  display:inline-block;padding:2px 8px;font-size:22px;
  background:var(--gold);color:#1A1408
}
.badge.t{background:#7C6BC7;color:#F0ECFF}

/* 試用列：只有原型有。真的上線沒有這一條。 */
.demo{
  display:flex;align-items:center;gap:11px;padding:11px 22px;flex-wrap:wrap;
  background:#100D0A;border-bottom:1px solid var(--line);font-size:22px;color:var(--mute)
}
.demo b{color:var(--dim);font-weight:400}

/* ---------- 元件 ---------- */

.eyebrow{font-size:22px;color:var(--mute);letter-spacing:.2em;margin-bottom:5px}
h1{font-size:44px;line-height:1.35;margin:0 0 11px;font-weight:400}
h2{font-size:33px;line-height:1.45;margin:0 0 11px;font-weight:400}
h3{font-size:22px;line-height:1.6;margin:22px 0 11px;font-weight:400}
p{margin:0 0 11px}
.lead{font-size:22px;color:var(--dim);max-width:63ch}
.dim{font-size:22px;color:var(--mute);line-height:1.9;max-width:70ch}
.ok{font-size:22px;color:var(--ok);line-height:1.9}
.warnx{color:var(--over)}
.quote{
  font-size:22px;color:var(--ink);line-height:1.8;
  border-left:3px solid var(--gold-d);padding:11px 0 11px 14px;margin:11px 0
}

.card{
  background:var(--panel);border:1px solid var(--line);
  padding:22px;margin:0 0 22px
}
.row{display:flex;gap:11px;flex-wrap:wrap;margin:22px 0}
.px{display:block;image-rendering:pixelated}

/* 按鈕：左上右下各切 11px。這是這一套視覺的簽名。 */
.btn{
  font-size:22px;padding:14px 22px;cursor:pointer;border:none;
  background:var(--gold);color:#1A1408;letter-spacing:.06em;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.btn:hover{background:var(--gold2)}
.btn.big{font-size:33px;padding:22px 44px}
.btn.ghost{
  background:none;color:var(--dim);border:1px solid var(--line);clip-path:none;padding:14px 22px
}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}

input,textarea,select{
  width:100%;background:var(--sunk);border:1px solid var(--line);
  color:var(--ink);padding:11px;margin:5px 0 11px;font-size:22px
}
select{width:auto;padding:2px 8px;font-size:22px}
textarea{resize:vertical;line-height:1.7}
::placeholder{color:var(--mute)}

.flash{
  background:var(--panel2);border-left:3px solid var(--gold);
  padding:11px 14px;margin:0 0 22px;font-size:22px;color:var(--dim);line-height:1.9
}
a.plain{color:var(--dim);cursor:pointer;text-decoration:none}
a.plain:hover{color:var(--gold)}

/* ---------- 廊道 ---------- */

.tunnel{
  background:var(--Lbg);border:1px solid var(--Lline);
  padding:22px;margin:0 0 22px;position:relative;overflow:hidden
}
.tunnel::after{
  content:'';position:absolute;inset:0;pointer-events:none;transition:background .4s
}
.tunnel.dim::after{background:rgba(0,0,0,.30)}
.tunnel.dark::after{background:rgba(0,0,0,.55)}

.tunnel-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.px.sign{width:66px;height:66px;flex:0 0 66px}
.sign-txt{flex:1;min-width:160px}
.sign-txt b{display:block;font-size:33px;font-weight:400;color:var(--ink)}
.sign-txt span{display:block;font-size:22px;color:var(--mute);margin-top:5px;line-height:1.8}
.depth{text-align:right;font-size:22px;color:var(--mute)}
.depth b{display:block;font-size:33px;color:var(--gold);font-weight:400;margin:3px 0}

/* 迷霧走廊：角色 → 格子 → 魔物 */
.corr{
  display:flex;align-items:center;gap:11px;margin:22px 0 11px;
  position:relative;z-index:2;flex-wrap:nowrap;overflow-x:auto
}
.corr.empty{
  display:block;font-size:22px;color:var(--mute);line-height:1.9;
  border:1px dashed var(--Lline);padding:22px;text-align:center
}
.hero{position:relative;flex:0 0 66px}
.px.ch{width:66px;height:66px}
.px.ch.big{width:132px;height:132px}
.px.vine{position:absolute;inset:0;width:66px;height:66px;opacity:.85}

.cells{display:flex;gap:3px;flex:1;min-width:0}
.cell{
  flex:1;min-width:11px;height:22px;
  background:rgba(0,0,0,.45);border:1px solid var(--Lline)
}
.cell.on{background:var(--L);border-color:var(--Ll)}
.cell.here{box-shadow:0 0 0 2px var(--gold) inset}

.mob{flex:0 0 66px;text-align:center}
.mob span{display:block;font-size:22px;color:var(--dim);margin-top:3px}
.corr-note{font-size:22px;color:var(--mute);position:relative;z-index:2}

/* 唯一的動作 */
.act-card{
  background:var(--panel2);border:1px solid var(--line2);
  border-left:3px solid var(--gold);padding:22px;margin:0 0 22px
}
.act-card h2{margin:0 0 11px}

/* ---------- 滑桿 ---------- */

.slider-wrap{display:flex;align-items:center;gap:22px;margin:11px 0}
.slider{
  -webkit-appearance:none;appearance:none;flex:1;height:22px;
  background:var(--sunk);border:1px solid var(--line);margin:0;padding:0
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;background:var(--gold);
  border:none;cursor:pointer
}
.slider::-moz-range-thumb{width:22px;height:22px;background:var(--gold);border:none;cursor:pointer}
.slider-read{flex:0 0 auto;text-align:center}
.slider-read b{display:block;font-size:66px;line-height:1;color:var(--gold);font-weight:400}
.slider-read span{font-size:22px;color:var(--mute)}

.big-num{font-size:66px;line-height:1;color:var(--gold);font-weight:400}
.big-num span{font-size:22px;color:var(--mute)}

/* ---------- 標籤 ---------- */

.tags{display:flex;gap:11px;flex-wrap:wrap;margin:11px 0}
.tags .k{font-size:22px;color:var(--mute);align-self:center;margin-right:5px}
.tag{
  font-size:22px;padding:9px 13px;cursor:pointer;white-space:nowrap;
  background:none;color:var(--dim);border:1px solid var(--line)
}
.tag:hover{color:var(--ink);border-color:var(--line2)}
.tag.on{background:rgba(233,179,65,.14);color:var(--gold);border-color:var(--gold)}
.tag.static{cursor:default;font-size:22px;padding:5px 9px}
.tag.static.hit{color:var(--gold);border-color:var(--gold-d)}
.tags.small .tag{font-size:22px;padding:5px 9px}
.tags.big{gap:11px}
.tags.big .tag{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  min-width:154px;padding:14px;white-space:normal;text-align:left
}
.tags.big .tag b{font-size:33px;line-height:1}
.tags.big .tag i{font-style:normal;font-size:22px;color:var(--ink)}
.tags.big .tag em{font-style:normal;font-size:22px;color:var(--mute);line-height:1.7}
.tag.static em{display:block;font-style:normal;color:var(--mute);margin-top:3px}

/* ---------- 判定印章 ---------- */

.stamp-card{
  background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--gold);padding:44px 22px;text-align:center;margin:0 0 22px
}
.stamp-card.late{border-top-color:var(--over)}
.stamp-card.early{border-top-color:var(--ok)}
/* 印章從 emoji 換成點陣圖之後，尺寸由圖決定，不由字級決定。 */
.stamp-mark{margin-bottom:11px}
.stamp-mark .px{width:66px;height:auto;image-rendering:pixelated}
.stamp-card h1{font-size:44px;margin:0 0 11px}
.stamp-card .lead{margin:0 auto 22px;max-width:44ch}
.stamp-num{display:flex;justify-content:center;gap:11px;align-items:baseline;margin:22px 0}
.stamp-num b{font-size:44px;color:var(--gold);font-weight:400}
.stamp-num span{font-size:22px;color:var(--mute);margin-right:22px}

/* ---------- 營火 ---------- */

.camp{display:flex;align-items:center;gap:22px;margin:0 0 22px;flex-wrap:wrap}
.px.fire{width:110px;height:110px;flex:0 0 110px}

/* ---------- 大躍進 ---------- */

.dash{text-align:center;padding:44px 22px;background:var(--panel);border:1px solid var(--line);margin:0 0 22px}
.dash .px{margin:0 auto 22px}
.dash h1{font-size:44px}

/* ---------- 準度 ---------- */

.acc{display:flex;gap:11px;margin:11px 0}
.acc-c{
  flex:1;text-align:center;padding:14px;background:var(--sunk);border:1px solid var(--line)
}
.acc-c b{display:block;line-height:0}
.acc-c b .px{width:33px;height:auto;image-rendering:pixelated}
.acc-c i{display:block;font-style:normal;font-size:44px;color:var(--gold);line-height:1.2}
.acc-c span{font-size:22px;color:var(--mute)}

.gear-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.gear{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 14px;background:var(--sunk);border:1px solid var(--line);font-size:33px
}
.gear i{font-style:normal;font-size:22px;color:var(--dim)}

.gear-pick{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.gcard{
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  width:242px;padding:14px;cursor:pointer;text-align:left;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line)
}
.gcard:hover{border-color:var(--line2)}
.gcard.on{background:rgba(233,179,65,.12);border-color:var(--gold)}
.gcard b{font-size:33px;line-height:1}
.gcard i{font-style:normal;font-size:22px;color:var(--ink)}
.gcard em{font-style:normal;font-size:22px;color:var(--mute);line-height:1.7}

/* 全班地下城的剖面樣式搬到 54-eco.css——那是一整張地質圖，值得自己一個檔。 */

/* ---------- 老師端 ---------- */

.radar-row{border-left:3px solid var(--ok)}
.radar-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px}
.radar-head b{font-size:22px;font-weight:400}
.radar-head .sp{flex:1}
.green{width:11px;height:11px;background:var(--ok);flex:0 0 11px}
.radar-ms{font-size:22px;color:var(--ink);margin-bottom:5px}
.log-num{font-size:22px;color:var(--mute);margin:5px 0}
.log-num b{font-size:22px;color:var(--gold)}
.st{font-size:22px;padding:3px 8px;border:1px solid var(--line2);color:var(--dim)}
.st.exact{color:var(--gold);border-color:var(--gold-d)}
.st.early{color:var(--ok);border-color:var(--ok)}
.st.late{color:var(--over);border-color:var(--over)}

.mini{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.mini-row{display:flex;gap:11px;align-items:center;font-size:22px;color:var(--mute)}
.mini-row b{flex:0 0 132px;font-size:22px;color:var(--dim);font-weight:400}
.mini-row .ok{color:var(--ok)}

.log-row .log-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.log-row .log-head b{font-size:22px;font-weight:400}
.rn-row{display:flex;gap:11px;align-items:center;padding:9px 0;flex-wrap:wrap;
  border-top:1px solid var(--line)}
.rn-row b{flex:0 0 110px;font-size:22px;font-weight:400;color:var(--dim)}
.rn-row input{flex:1;min-width:176px;margin:0}
.sg-tier{font-size:22px;color:var(--mute);flex:0 0 44px}
.sg-tier.top{color:var(--gold)}

/* 窄螢幕的排法全部在 59-mobile.css。這裡不再藏側欄——藏了導覽就沒了。 */

/* ---------- 步驟條 ----------
   不是教學，是位置：亮著的那一格就是現在輪到你的。 */

.steps{display:flex;gap:0;margin:0 0 22px;flex-wrap:wrap}
.step{
  flex:1;min-width:154px;display:flex;align-items:flex-start;gap:11px;
  padding:11px 14px;background:var(--sunk);border:1px solid var(--line);
  border-right:none;color:var(--mute)
}
.step:last-child{border-right:1px solid var(--line)}
.step b{
  flex:0 0 22px;width:22px;height:22px;line-height:22px;text-align:center;
  font-size:22px;font-weight:400;background:var(--line);color:var(--bg)
}
.step i{display:block;font-style:normal;font-size:22px;line-height:1.4}
.step em{display:block;font-style:normal;font-size:22px;line-height:1.7;margin-top:3px}
.step.past{color:var(--dim)}
.step.past b{background:var(--gold-d);color:var(--Ll)}
.step.on{background:var(--Lbg);border-color:var(--gold-d);color:var(--ink)}
.step.on b{background:var(--gold);color:#1A1408}
.step.on em{color:var(--dim)}

/* 老師端各組進度的一張卡 */
.tm .radar-head b{font-size:22px}

/* ---------- 門口 ----------
   還不知道你是誰的時候，畫面上不該有側欄、頂條、深度、組名。
   只有一欄，置中，寬度剛好一句話讀得完。 */

.gate{display:flex;justify-content:center;padding:33px 0 88px}
.gate-box{width:100%;max-width:539px}
.gate-box .px.sign{width:66px;height:66px;margin-bottom:14px}
.gate-box h1{font-size:44px}
.gate-box .lead{max-width:none}
.gate-box .eyebrow{margin-top:11px}

.badge.r{background:#5A8F6B;color:#EAF6EE}
.side-foot{padding:11px 22px 22px;border-top:1px solid var(--line)}

/* 研究者那幾頁的一排：名字、說明、幾顆小鍵 */
.rn-row .btn.ghost{padding:5px 11px;font-size:22px}
.rn-row span{font-size:22px}
.rn-row input{min-width:132px}

/* ---------- 裝備架 ----------
   它不是道具欄。每一格是一句話，圖示只是那句話的把手。 */

.carry-in{display:flex;align-items:flex-start;gap:14px;margin:11px 0}
.carry-in b{font-size:44px;line-height:1}
.carry-in i{display:block;font-style:normal;font-size:22px;color:var(--ink)}
.carry-in em{display:block;font-style:normal;font-size:22px;color:var(--dim);line-height:1.9;margin-top:3px}

.shelf{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px}
.slot{
  width:242px;padding:14px;background:var(--sunk);opacity:.45
}
.slot.got{opacity:1}
.slot.on{background:#2E2210}
.slot b{display:block;font-size:33px;line-height:1;margin-bottom:5px}
.slot i{display:block;font-style:normal;font-size:22px;color:var(--ink)}
.slot em{display:block;font-style:normal;font-size:22px;color:var(--mute);line-height:1.8;margin:3px 0}
.slot .from{display:block;font-size:22px;color:var(--gold-d);line-height:1.7;margin-top:5px}

/* ---------- 門口的四個區域 ----------
   還沒登入就先看到下面有什麼。這不是說明，是世界。 */

.zones{display:flex;flex-wrap:wrap;gap:11px;margin:22px 0}
.zn{
  flex:1;min-width:110px;padding:14px 11px;text-align:center;background:var(--sunk)
}
.zn .px.zn-px{width:44px;height:44px;margin:0 auto 8px;opacity:.9}
.zn b{display:block;font-size:22px;font-weight:400;line-height:1.3}
.zn span{display:block;font-size:22px;color:var(--mute);line-height:1.7;margin-top:5px}
.zn i{display:block;font-style:normal;font-size:22px;color:var(--gold-d);margin-top:5px}
.zn{background:var(--zbg)}
.zn b{color:var(--zink)}

/* 六個區域的顏色與紋理，一個來源。

   這一份存在的理由：自己的廊道跟全班那張剖面圖，同一個深度必須長得
   一模一樣。之前兩邊各寫一次，剖面圖上是斜的水晶紋、廊道裡是通用的磚牆——
   那就變成兩個世界了。

   所以顏色與紋理都定義成變數，兩邊都只讀變數：
     .scn.z-crys     自己的廊道（見 53-scene.css）
     .xs-band.crys   剖面圖上那一條（見 54-eco.css）

   紋理是每一層的個性，不是裝飾：
     wild 碎的     表土，石頭是散的
     root 直的     根往下穿
     crys 斜的     晶體是斜著長的
     echo 方的     方塊狀的硬岩
     rust 橫的     鏽掉的鐵板是一層一層疊的
     fire 流的     底下有東西在動 */

.z-wild, .xs-band.wild, .card.fa.wild, .zn.wild {
  --zbg:#171208; --zln:#3A2E12;
  --zfl:#241B0C; --zfl2:#3B2D11;
  --zink:#C9A227;
  --zli:rgba(242,230,200,.030);
  --ztex:
    repeating-linear-gradient(0deg,  rgba(242,230,200,.030) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.45)        0 2px, transparent 2px 55px);
}
.z-root, .xs-band.root, .card.fa.root, .zn.root {
  --zbg:#0F1A0C; --zln:#26381D;
  --zfl:#16250F; --zfl2:#254019;
  --zink:#7FA866;
  --zli:rgba(216,240,192,.034);
  --ztex:
    repeating-linear-gradient(90deg, rgba(216,240,192,.055) 0 2px, transparent 2px 18px),
    repeating-linear-gradient(84deg, rgba(0,0,0,.40)        0 1px, transparent 1px 31px);
}
.z-crys, .xs-band.crys, .card.fa.crys, .zn.crys {
  --zbg:#0C1720; --zln:#173445;
  --zfl:#12222E; --zfl2:#1D3A4C;
  --zink:#5FA8C7;
  --zli:rgba(216,242,250,.035);
  --ztex:
    repeating-linear-gradient(58deg,  rgba(216,242,250,.045) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-58deg, rgba(0,0,0,.40)        0 1px, transparent 1px 33px);
}
.z-echo, .xs-band.echo, .card.fa.echo, .zn.echo {
  --zbg:#131024; --zln:#2E2750;
  --zfl:#1B1733; --zfl2:#2A2450;
  --zink:#8C7BC7;
  --zli:rgba(228,220,250,.032);
  --ztex:
    repeating-linear-gradient(0deg,  rgba(228,220,250,.035) 0 2px, transparent 2px 33px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.50)        0 2px, transparent 2px 33px);
}
.z-rust, .xs-band.rust, .card.fa.rust, .zn.rust {
  --zbg:#1A1310; --zln:#3E2A1C;
  --zfl:#251A14; --zfl2:#3E2A1C;
  --zink:#B07A4A;
  --zli:rgba(232,199,154,.034);
  --ztex:
    repeating-linear-gradient(0deg,  rgba(232,199,154,.050) 0 1px, transparent 1px 13px,
                                     rgba(0,0,0,.42)       13px 15px, transparent 15px 26px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.30)        0 2px, transparent 2px 44px);
}
.z-fire, .xs-band.fire, .card.fa.fire, .zn.fire {
  --zbg:#1C0E09; --zln:#4A2013;
  --zfl:#2A1510; --zfl2:#43201A;
  --zink:#D9603F;
  --zli:rgba(250,217,204,.038);
  --ztex:
    repeating-linear-gradient(0deg,  rgba(250,217,204,.045) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(96deg, rgba(217,96,63,.10)    0 3px, transparent 3px 44px);
}

/* 材質。

   前一份（50-style.css）決定的是尺寸、顏色、排版；這一份只決定「摸起來
   像什麼」。分開是因為它們壞掉的方式不一樣：改版面會弄亂位置，改材質
   只會弄醜，兩件事不要混在同一個檔裡互相牽扯。

   規則跟像素圖一樣硬：

     · 不准有模糊。所有的漸層都用 hard stop（0 3px, 3px 100%），
       所有的陰影 blur 都是 0。一有模糊，它就變成「像素圖上面套現代 UI」，
       那正是這一套視覺最忌諱的東西。
     · 斜面厚度固定 3px，等於角色身上一個像素的厚度。
     · 光一律從左上來。左緣與上緣受光，右緣與下緣背光——整個畫面
       只有一個光源，這是它看起來像實體而不像色塊的原因。
     · 材質不帶狀態色。綠的紅的金的都還是 50-style.css 在管。 */

:root{
  --px:3px;
  --lit:rgba(255,240,214,.07);
  --lit2:rgba(255,240,214,.14);
  --shd:rgba(0,0,0,.45);
  --shd2:rgba(0,0,0,.72);
}

/* ---------- 岩壁 ----------
   整個畫面的底是鑿開的岩層。縫隙淡到幾乎看不見——看得見就變壁紙了。 */
body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(0deg,  rgba(255,244,222,.016) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.55)        0 1px, transparent 1px 88px);
}

/* ---------- 石塊 ----------
   卡片是一塊鑿出來的石頭：四邊有 3px 的斜面，表面有兩層錯開的顆粒。
   顆粒用 radial-gradient 點陣做，1px 的圓點在點陣字旁邊就是一顆像素。 */
.card,
.stamp-card,
.dash{
  border:none;
  background-color:var(--panel);
  background-image:
    radial-gradient(rgba(255,244,222,.030) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.42) 1px, transparent 1px);
  background-size:22px 22px, 33px 33px;
  background-position:0 0, 11px 14px;
  box-shadow:
    inset 0 var(--px) 0 var(--lit),
    inset var(--px) 0 0 var(--lit),
    inset 0 calc(var(--px) * -1) 0 var(--shd2),
    inset calc(var(--px) * -1) 0 0 var(--shd2),
    0 0 0 1px #000;
}
/* 上緣還留著狀態色的那幾張，斜面讓給它 */
.stamp-card{box-shadow:
  inset var(--px) 0 0 var(--lit),
  inset 0 calc(var(--px) * -1) 0 var(--shd2),
  inset calc(var(--px) * -1) 0 0 var(--shd2),
  0 0 0 1px #000}
.radar-row{box-shadow:
  inset 0 var(--px) 0 var(--lit),
  inset 0 calc(var(--px) * -1) 0 var(--shd2),
  inset calc(var(--px) * -1) 0 0 var(--shd2),
  0 0 0 1px #000}

/* 動作那一張：站在光裡的石台。比別的石塊亮一階。 */
.act-card{
  border:none;border-left:var(--px) solid var(--gold);
  background-color:var(--panel2);
  background-image:
    radial-gradient(rgba(255,244,222,.045) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.38) 1px, transparent 1px);
  background-size:22px 22px, 33px 33px;
  background-position:0 0, 11px 14px;
  box-shadow:
    inset 0 var(--px) 0 var(--lit2),
    inset 0 calc(var(--px) * -1) 0 var(--shd2),
    inset calc(var(--px) * -1) 0 0 var(--shd2),
    0 0 0 1px #000;
}

/* ---------- 鐵板 ----------
   按鈕是一塊敲出來的鐵。上緣一道 3px 的亮邊、下緣一道暗邊，
   底下墊一個沒有模糊的硬陰影——按下去的時候它真的往右下沉。

   陰影用 drop-shadow 而不是 box-shadow：clip-path 會把 box-shadow
   一起裁掉，切角那個簽名就沒有影子了。 */
.btn{
  background-image:linear-gradient(180deg,
    var(--gold2) 0 var(--px),
    var(--gold)  var(--px) calc(100% - var(--px)),
    var(--gold-d) calc(100% - var(--px)) 100%);
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75));
  transition:none;
}
.btn:hover{background-image:linear-gradient(180deg,
  #FFE29A 0 var(--px), var(--gold2) var(--px) calc(100% - var(--px)),
  var(--gold) calc(100% - var(--px)) 100%)}
.btn:active{transform:translate(2px,2px);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.75))}

/* 次要的那顆是刻進石頭裡的，不是墊在上面。所以斜面反過來。 */
.btn.ghost{
  border:none;background:var(--sunk);filter:none;
  box-shadow:
    inset 0 var(--px) 0 var(--shd2),
    inset var(--px) 0 0 var(--shd2),
    inset 0 calc(var(--px) * -1) 0 var(--lit),
    0 0 0 1px #000;
}
.btn.ghost:hover{background:var(--panel2)}
.btn.ghost:active{transform:translateY(1px)}

/* ---------- 鑿出來的凹槽 ----------
   輸入框、滑桿槽、下沉的小格子。斜面跟石塊完全相反：
   上緣暗、下緣亮，眼睛就讀成「凹進去」。 */
input,textarea,select,.slider,
.acc-c,.gear,.gcard,.step,.eco-scroll,.slot{
  border:none;
  box-shadow:
    inset 0 var(--px) 0 var(--shd2),
    inset var(--px) 0 0 var(--shd2),
    inset 0 calc(var(--px) * -1) 0 var(--lit),
    0 0 0 1px #000;
}
input:focus,textarea:focus{outline:none;box-shadow:
  inset 0 var(--px) 0 var(--shd2),
  inset var(--px) 0 0 var(--shd2),
  inset 0 calc(var(--px) * -1) 0 var(--lit),
  0 0 0 1px var(--gold-d)}
.step:last-child{border-right:none}

/* 滑桿的把手是一顆鐵鉚釘 */
.slider::-webkit-slider-thumb{
  background-image:linear-gradient(180deg,
    var(--gold2) 0 var(--px),
    var(--gold)  var(--px) calc(100% - var(--px)),
    var(--gold-d) calc(100% - var(--px)) 100%);
  box-shadow:2px 2px 0 rgba(0,0,0,.6);
}
.slider::-moz-range-thumb{
  background-image:linear-gradient(180deg,
    var(--gold2) 0 3px, var(--gold) 3px calc(100% - 3px),
    var(--gold-d) calc(100% - 3px) 100%);
}

/* ---------- 木料 ----------
   三選一的那三張是木匣。直紋，不是石頭的顆粒——材質不同，
   眼睛就知道這一排跟旁邊的資訊不是同一種東西。 */
.gcard{
  background-color:#20180F;
  background-image:
    repeating-linear-gradient(90deg,
      rgba(255,244,222,.030) 0 1px,
      transparent 1px 7px,
      rgba(0,0,0,.30) 7px 8px,
      transparent 8px 18px);
}
.gcard:hover{background-color:#2B2013}
.gcard:active{transform:translateY(1px)}
.gcard.on{background-color:#2E2210;box-shadow:
  inset 0 var(--px) 0 var(--shd2),
  inset var(--px) 0 0 var(--shd2),
  inset 0 calc(var(--px) * -1) 0 var(--lit),
  0 0 0 1px var(--gold)}

/* ---------- 岩層 ----------
   側欄是一整面沒有鑿開的岩壁，所以它比卡片更粗、層更寬。 */
.side{
  border-right:none;
  background-color:var(--panel);
  background-image:
    repeating-linear-gradient(0deg,
      rgba(255,244,222,.022) 0 1px,
      transparent 1px 3px,
      rgba(0,0,0,.30) 3px 4px,
      transparent 4px 66px);
  box-shadow:inset calc(var(--px) * -1) 0 0 var(--shd2), 1px 0 0 #000;
}
.nav a.on{box-shadow:inset 0 1px 0 var(--lit), inset 0 -1px 0 var(--shd)}

/* ---------- 鐵箍 ----------
   頂條與試用列是釘在岩壁上的兩條鐵。 */
.top,.demo{
  border-bottom:none;
  background-image:linear-gradient(180deg,
    var(--lit) 0 1px,
    transparent 1px calc(100% - var(--px)),
    var(--shd2) calc(100% - var(--px)) 100%);
  box-shadow:0 1px 0 #000;
}

/* ---------- 小石片 ---------- */
.tag,.st,.badge{
  box-shadow:inset 0 1px 0 var(--lit), inset 0 -1px 0 var(--shd2);
}
.tag:active{transform:translateY(1px)}
.tags.big .tag{
  background-color:var(--sunk);
  box-shadow:
    inset 0 var(--px) 0 var(--shd2),
    inset var(--px) 0 0 var(--shd2),
    inset 0 calc(var(--px) * -1) 0 var(--lit),
    0 0 0 1px #000;
}
.tags.big .tag.on{background-color:#2E2210;box-shadow:
  inset 0 var(--px) 0 var(--shd2),
  inset var(--px) 0 0 var(--shd2),
  inset 0 calc(var(--px) * -1) 0 var(--lit),
  0 0 0 1px var(--gold)}

/* ---------- 廊道 ----------
   角色站的地方比別的地方更深、更潮。上緣壓一道暗，
   讓人覺得上面還有一整座山。 */
.tunnel{
  border:none;
  background-color:var(--Lbg);
  background-image:
    radial-gradient(rgba(233,179,65,.040) 1px, transparent 1px),
    radial-gradient(rgba(0,0,0,.50) 1px, transparent 1px);
  background-size:22px 22px, 33px 33px;
  background-position:0 0, 11px 14px;
  box-shadow:
    inset 0 4px 0 rgba(0,0,0,.55),
    inset 0 8px 0 rgba(0,0,0,.28),
    inset 0 calc(var(--px) * -1) 0 var(--shd2),
    inset calc(var(--px) * -1) 0 0 var(--shd2),
    inset var(--px) 0 0 var(--lit),
    0 0 0 1px #000;
}

/* 走廊的格子：走過的那一格是被劈開的岩石，還沒走的是實心的 */
.cell{border:none;box-shadow:inset 0 1px 0 var(--shd2), 0 0 0 1px var(--Lline)}
.cell.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.35),
  0 0 0 1px var(--Ll)}

/* 剖面圖那幾格的斜面在 54-eco.css，跟地層顏色綁在一起。 */

/* ---------- 角色與招牌 ----------
   像素圖也要有影子，不然它是浮在畫面上的貼紙。
   偏移 2px、不模糊——跟身上一個像素同一個量級。 */
.px.ch,.px.sign,.px.fire{
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.55));
}
.px.vine,.px.vine-s{filter:none}

/* ---------- 會動的時候 ---------- */
@media (prefers-reduced-motion: reduce){
  .btn:active,.gcard:active,.tag:active{transform:none}
}

/* 廊道場景的樣子。

   跟 52-material.css 同一套規矩：hard stop、0 模糊、斜面 3px、光從左上來。
   多一條只有這裡才有的：會動的東西一律逐格，用 steps() 換狀態，
   不用 ease 補間。火焰用 ease 一補就變成呼吸燈，那不是火。 */

/* 顏色與紋理全部讀 51-zones.css 的變數——自己的廊道跟全班那張剖面圖，
   同一個深度必須長得一模一樣，所以兩邊只能有一個來源。 */
.scn{
  position:relative;height:396px;overflow:hidden;margin:0 0 22px;
  background-color:var(--zbg,#0C0A08);
  background-image:var(--ztex,
    repeating-linear-gradient(0deg,  rgba(255,244,222,.028) 0 1px, transparent 1px 44px));
  box-shadow:
    inset 0 4px 0 rgba(0,0,0,.65),
    inset 0 8px 0 rgba(0,0,0,.30),
    inset -3px 0 0 rgba(0,0,0,.72),
    inset 3px 0 0 rgba(255,240,214,.05),
    inset 0 -3px 0 rgba(0,0,0,.72),
    0 0 0 1px #000;
}
.scn-scroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden}
.scn-in{position:relative;height:396px;min-width:100%}

/* 火把全滅之後整條走廊暗下來。這不是懲罰，是狀態本身。 */
.scn.dim  .scn-in{filter:brightness(.72)}
.scn.dark .scn-in{filter:brightness(.45)}

/* 角落的深度。走廊往旁邊捲，它不跟著捲。 */
.scn-hud{
  position:absolute;top:11px;right:11px;z-index:9;text-align:right;pointer-events:none;
  padding:5px 9px;background:rgba(6,5,4,.82)
}
.scn-hud b{display:block;font-size:33px;line-height:1;color:var(--gold);font-weight:400}
.scn-hud span{font-size:22px;color:var(--mute)}

/* ---------- 地板 ---------- */
.floor{
  position:absolute;bottom:44px;height:22px;
  background-color:var(--zfl,#17130E);
  background-image:
    linear-gradient(180deg, rgba(255,244,222,.09) 0 2px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 2px, transparent 2px 44px);
}
/* 走通過的那一段亮一階 */
.floor.lit{background-color:var(--zfl2,#2A2318)}

/* ---------- 天花板 ---------- */
/* 從頭上那塊岩的下緣垂下來，不是浮在空中。 */
.drip{position:absolute;top:44px;width:33px;height:33px;opacity:.9;z-index:2}
.drip .px{width:33px;height:33px}

/* ---------- 火把 ----------
   三張圖輪流顯示，每一盞的節奏差一點——一整排同步眨眼看起來像壞掉的燈管。 */
/* 從地板往上算 132px。場景長高的時候，火把跟地板的關係不該跟著變。 */
.tor{position:absolute;bottom:198px;width:33px;height:44px;display:block;z-index:2}
.tor .f{position:absolute;left:0;top:0;width:33px;height:44px;opacity:0;
  animation:flk var(--fd,360ms) steps(1,end) infinite}
.tor .f1{animation-delay:calc(var(--fd,360ms) / 3)}
.tor .f2{animation-delay:calc(var(--fd,360ms) / 3 * 2)}
@keyframes flk{0%,32.9%{opacity:1}33%,100%{opacity:0}}

img.tor.dead{width:33px;height:44px;opacity:.55;z-index:1}

/* 點著的火把在牆上打出一小圈光 */
.tor::after{
  content:'';position:absolute;left:-33px;top:-11px;width:99px;height:110px;
  pointer-events:none;
  background:radial-gradient(circle at 50% 30%,
    rgba(233,132,63,.22) 0 22px, rgba(233,132,63,.12) 22px 44px,
    rgba(233,132,63,.05) 44px 66px, transparent 66px);
}

/* ---------- 走過的痕跡 ---------- */
.foot{position:absolute;bottom:66px;width:22px;height:11px;opacity:.45}
/* 那一天做了什麼。掛在那一格頭上，底下墊一道硬影子——
   走廊亮起來之後，沒有影子的圖示會被牆的光吃掉。 */
/* 那一天動的是哪一件。畫的是顏色不是字——名字長度不一定，
   塞不進 44px 一格；顏色對到哪一件，清單上看一次就記得了。 */
.doing{
  position:absolute;bottom:121px;left:0;width:22px;height:11px;
  margin-left:11px;z-index:3;pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.8), inset 0 2px 0 rgba(255,255,255,.25)
}
.dayn{
  position:absolute;bottom:11px;width:44px;text-align:center;
  font-size:22px;color:#3E362C
}
.dayn.past{color:var(--gold-d)}
.dayn.here{color:var(--gold)}

.prop{position:absolute;bottom:66px}
.prop.rubble{width:33px;height:22px}
.prop.cry{width:22px;height:22px}
.prop.shr{width:22px;height:22px}

/* ---------- 角色 ---------- */
.scn-hero{
  position:absolute;bottom:66px;width:66px;height:66px;z-index:6;
  animation:bob 1.4s steps(1,end) infinite
}
.scn-hero.asleep{animation:none;opacity:.75}
@keyframes bob{0%,54%{transform:translateY(0)}55%,100%{transform:translateY(-3px)}}

/* 手上那一盞的光圈。一圈一圈地暗，不是模糊的漸層。 */
.halo{
  position:absolute;bottom:44px;width:308px;height:242px;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,
    rgba(233,179,65,.30) 0 44px,
    rgba(233,179,65,.17) 44px 88px,
    rgba(233,179,65,.08) 88px 121px,
    rgba(233,179,65,.03) 121px 154px,
    transparent 154px);
}

/* ---------- 霧 ----------
   蓋住還沒走的那幾天。往前一格，霧就退一格。 */
.fog{
  position:absolute;top:0;bottom:44px;right:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(8,7,6,0)    0 22px,
    rgba(8,7,6,.30) 22px 66px,
    rgba(8,7,6,.50) 66px 132px,
    rgba(8,7,6,.68) 132px 100%);
}

/* ---------- 魔物 ---------- */
.scn-mob{
  position:absolute;bottom:66px;width:88px;z-index:4;text-align:center;
  animation:bob2 2.2s steps(1,end) infinite
}
@keyframes bob2{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3px)}}
.scn-mob .px{width:66px;height:66px;margin:0 auto}
.scn-mob .mobn{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;
  font-size:22px;color:var(--dim);white-space:nowrap
}
/* ---------- 洞口 ---------- */
.mouth{position:absolute;left:0;top:0;bottom:0;z-index:3}
/* 從上面落下來的光。你是從那裡進來的。 */
.mouth .shaft{
  position:absolute;left:22px;top:44px;width:99px;bottom:44px;
  clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,
    rgba(233,179,65,.17) 0 33px,
    rgba(233,179,65,.09) 33px 110px,
    rgba(233,179,65,.04) 110px 176px,
    transparent 176px);
}
.mouth .arch{
  position:absolute;right:0;top:0;bottom:44px;width:22px;background:#211C16;
  box-shadow:inset 3px 0 0 rgba(255,244,222,.07), inset -3px 0 0 rgba(0,0,0,.7)
}
.mouth .hang{position:absolute;left:27px;top:0;width:66px;text-align:center}
.mouth .chain{
  width:4px;height:33px;margin:0 auto;
  background:repeating-linear-gradient(180deg,#6E7982 0 4px, #232B31 4px 7px)
}
.mouth .px.sign{width:66px;height:66px;margin:0 auto}
.mouth-txt{position:absolute;left:11px;bottom:110px;width:121px}
.mouth-txt b{display:block;font-size:22px;line-height:1.5;color:var(--ink);font-weight:400}
.mouth-txt span{display:block;font-size:22px;color:var(--mute)}

/* ---------- 場景底下那一行 ---------- */
.scn-cap{font-size:22px;color:var(--mute);margin:-11px 0 22px;line-height:1.9}
.scn-cap b{font-size:22px;color:var(--gold);font-weight:400}

/* ---------- 關掉動畫的人 ----------
   火不跳、人不晃，但走廊還是亮著——資訊不能因為關掉動畫就不見。 */
@media (prefers-reduced-motion: reduce){
  .tor .f{animation:none;opacity:0}
  .tor .f0{opacity:1}
  .scn-hero,.scn-mob{animation:none}
}

@media (max-width:860px){
  .scn,.scn-in{height:352px}
  .scn-hud b{font-size:22px}
}

/* 鑿下去那一下：整條走廊抖 3px。三幀，不補間。 */
.scn-in.hit{animation:hit .18s steps(1,end) 1}
@keyframes hit{
  0%  {transform:translate(0,0)}
  33% {transform:translate(-3px,2px)}
  66% {transform:translate(2px,-2px)}
  100%{transform:translate(0,0)}
}
@media (prefers-reduced-motion: reduce){ .scn-in.hit{animation:none} }

/* 紀錄頁：那一趟每天做的，排成一列 */
.seq{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0;font-size:22px;line-height:1}

/* 角落那一塊：你在哪一區、多深。釘住不跟著廊道捲——
   那是「你在哪」，不是廊道上的一個位置。 */
.scn-hud em{
  display:block;font-style:normal;font-size:22px;line-height:1.2;margin-bottom:2px
}
.scn-hud .zn-note{max-width:198px;margin-left:auto;line-height:1.7;margin-top:3px}
.scn .scn-hud em{color:var(--zink,#E9B341)}

/* 跨進新的一區的那一張。這是少數幾個「世界自己變了」的時刻。 */
.card.zone-in{margin-top:22px}
.card.zone-in h2{margin:0 0 11px}

/* ---------- 時間漲上來的水 ----------
   一天一格，你按不按它都會漲。它不扣任何東西——它只是把時間畫出來。
   水面用硬階，不用漸層：漸層一出現它就變成現代特效。 */
.tide{
  position:absolute;bottom:44px;height:99px;z-index:4;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(95,168,199,.28) 0 3px, transparent 3px 6px,
                            rgba(95,168,199,.16) 6px 100%);
  box-shadow:inset 0 3px 0 rgba(216,242,250,.30)
}
.tide-edge{
  position:absolute;bottom:44px;width:8px;height:110px;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(180deg,
    rgba(216,242,250,.55) 0 3px, transparent 3px 8px)
}

/* ---------- 廊道底下那一行 ----------
   三個數字就是整個處境：你來過幾天、過了幾天、你說幾天。不用一句話解釋。 */
.scn-foot{
  display:flex;flex-wrap:wrap;gap:22px;margin:-11px 0 22px;padding:11px 14px;
  background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06), 0 0 0 1px #000
}
.sf{font-size:22px;color:var(--mute);display:flex;align-items:baseline;gap:6px}
.sf b{font-size:33px;line-height:1;font-weight:400}
.sf.you b{color:var(--gold)}
.sf.days b{color:#5FA8C7}
.sf.est b{color:var(--ink)}
.sf.rest b{color:var(--mute)}

/* 說了「今天沒動」的那一格：熄的托架加一個記號，
   跟「沒有紀錄」看得出差別——一個是他說了，一個是他沒說。 */
.restm{
  position:absolute;bottom:110px;left:0;width:22px;height:3px;margin-left:11px;
  background:var(--mute);z-index:3
}

/* ---------- 洞口那幾樣一直在的東西 ----------
   沒觸發過的東西等於不存在。所以營火與岩心架一直在那裡，只是沒點著。 */
.mouth .mfire{
  position:absolute;left:11px;bottom:44px;width:44px;height:44px;
  padding:0;border:none;background:none;cursor:pointer;opacity:.45
}
.mouth .mfire .px{width:44px;height:44px}
.mouth .mfire:hover{opacity:.8}
.mouth .mfire.lit{opacity:1;animation:bob 1.1s steps(1,end) infinite}

.mouth .mrack{
  position:absolute;right:33px;bottom:44px;width:55px;height:44px;
  padding:0;border:none;background:none;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;opacity:.7
}
.mouth .mrack:hover{opacity:1}
.mouth .mrack .px.mcore{width:14px;height:auto;max-height:44px}
.mouth .mrack i{width:11px;height:14px;display:block;
  box-shadow:inset 0 0 0 1px rgba(255,240,214,.14)}

/* 出口的光。走出去之前它就只是一道光。 */
.mouth .shaft.open{
  background:linear-gradient(180deg,
    rgba(233,179,65,.34) 0 33px,
    rgba(233,179,65,.18) 33px 110px,
    rgba(233,179,65,.08) 110px 176px,
    transparent 176px);
}

/* ---------- 角色背上的岩心 ----------
   這個系統裡拿得到的東西只有它。走著走著身上的東西變多，
   那不是裝飾，那是「你帶著什麼在走」。 */
.hpack{position:absolute;left:-17px;bottom:11px;width:38px;height:44px;z-index:-1;
  pointer-events:none}
.px.hp{position:absolute;width:14px;height:auto;max-height:38px;
  filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}

/* ══════════ 景深 ══════════

   本來整條廊道是一個平面：牆、地板、人、魔物全部貼在同一層上，
   所以它看起來像一張長條圖，不像一個你正在往裡面看的地方。

   三層：遠景（更暗、藏在後面）、廊道（原本那層、會捲）、
   近景（釘在框上、不捲）。拖動廊道的時候近景不動，那一下就有視差。 */

/* ── 最後面：深處的磚與支撐柱 ── */
.scn-far{
  position:absolute;left:0;top:0;bottom:44px;z-index:0;pointer-events:none;
  background-image:
    /* 每 176px 一根柱子。深處還有結構，不是一片空牆。 */
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.42) 0 6px, rgba(255,244,222,.020) 6px 9px,
      transparent 9px 22px, rgba(0,0,0,.42) 22px 28px,
      transparent 28px 176px),
    /* 岩層的接縫。這個世界的核心設定是「你在第幾層」，
       所以牆上要看得到地層——顏色用這一層的顏色，很淡。 */
    linear-gradient(180deg,
      transparent 0 77px,
      var(--zink,#C9A227) 77px 79px,
      transparent 79px 88px,
      rgba(0,0,0,.30) 88px 91px,
      transparent 91px 176px,
      rgba(0,0,0,.24) 176px 178px,
      transparent 178px 253px,
      rgba(0,0,0,.18) 253px 255px,
      transparent 255px),
    /* 深處的磚。比前景那一層小一半，而且更暗——遠的東西對比要低。 */
    repeating-linear-gradient(0deg,
      rgba(0,0,0,.26) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.26) 0 1px, transparent 1px 44px)
}
/* 那一條地層線只留一點點顏色。它是提示，不是裝飾。 */
.scn-far{opacity:.85}

/* ── 頭上的岩 ──
   本來鐘乳石掛在空中，沒有東西讓它們掛。方齒不用圓的：
   這一份的每一個邊都是 11 的倍數，圓角會立刻看起來不屬於這裡。 */
.scn-ceil{
  position:absolute;left:0;top:0;height:66px;z-index:1;pointer-events:none;
  background:#0A0806;
  box-shadow:inset 0 -3px 0 rgba(255,244,222,.05)
}
.scn-ceil::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:22px;
  background:repeating-linear-gradient(90deg,
    #0A0806 0 22px, transparent 22px 55px,
    #0A0806 55px 66px, transparent 66px 110px)
}

/* ── 最前面：近景的岩與暗角 ──
   釘在框上，不跟著捲。廊道往旁邊拉的時候它不動——那一下就是視差。 */
.scn-frame{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(ellipse 110% 88% at 46% 58%,
    transparent 0 52%,
    rgba(0,0,0,.30) 52% 74%,
    rgba(0,0,0,.58) 74% 88%,
    rgba(0,0,0,.78) 88% 100%)
}
/* 上緣壓下來的岩 */
.scn-frame::before{
  content:'';position:absolute;left:0;right:0;top:0;height:44px;
  background:
    linear-gradient(180deg, #050403 0 22px, transparent 22px),
    repeating-linear-gradient(90deg,
      #050403 0 33px, transparent 33px 88px,
      #050403 88px 110px, transparent 110px 187px)
}
/* 下緣頂上來的岩 */
.scn-frame::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:33px;
  background:
    linear-gradient(0deg, #050403 0 11px, transparent 11px),
    repeating-linear-gradient(90deg,
      transparent 0 44px, #050403 44px 77px,
      transparent 77px 143px, #050403 143px 165px)
}

/* 火把在地板上也要有一攤光。牆上亮、地上不亮，那就不是火。 */
.tor::before{
  content:'';position:absolute;left:-44px;bottom:-88px;
  width:121px;height:44px;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 100%,
    rgba(233,132,63,.20) 0 40%,
    rgba(233,132,63,.10) 40% 70%,
    transparent 70%)
}

/* 全班地下城的樣子。

   跟 52 / 53 同一套規矩：hard stop、0 模糊、光從左上來。
   多一條只有這裡才有的：地層是共用的地質，所以顏色屬於「深度」，
   不屬於任何一組。同一個深度，五條廊道打通的石頭一定同一個顏色——
   一旦讓某一組的廊道有自己的顏色，那張圖就開始比較誰的比較漂亮。 */

.xsec-wrap{
  overflow-x:auto;overflow-y:hidden;margin:0 0 22px;
  background:#070605;
  box-shadow:
    inset 0 3px 0 rgba(0,0,0,.7), inset 3px 0 0 rgba(0,0,0,.7),
    inset 0 -3px 0 rgba(255,240,214,.05), 0 0 0 1px #000;
}
.xsec{position:relative}

/* ---------- 地層 ----------
   顏色與紋理讀 51-zones.css 的變數，跟自己那條廊道同一個來源。
   每一層的紋理是那一層的個性：荒原碎的、根脈直的、水晶斜的、
   迷宮方的、銹層橫的、深淵流的。 */
.xs-band{
  position:absolute;left:0;z-index:0;
  background-color:var(--zbg);background-image:var(--ztex);
}
/* 層與層之間有一道界線。地質圖上那條線就是這樣畫的。 */
.xs-band::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:rgba(0,0,0,.65);box-shadow:0 3px 0 rgba(255,240,214,.05)
}

/* 層的名字，掛在左邊的空白裡 */
.xs-bandn{position:absolute;left:6px;width:132px;z-index:2;pointer-events:none}
.xs-bandn b{display:block;font-size:22px;font-weight:400;line-height:1.5}
.xs-bandn span{display:block;font-size:22px;color:var(--mute);line-height:1.6;margin-top:2px}
.xs-bandn b{color:var(--zink)}

/* ---------- 地表 ---------- */
.xs-sky{
  position:absolute;left:0;top:0;height:110px;z-index:1;
  background:linear-gradient(180deg,
    #0E1520 0 44px, #131B27 44px 77px, #1A202B 77px 110px);
}
.xs-surf{
  position:absolute;left:0;top:110px;height:22px;z-index:1;
  background-color:#2E3A22;
  background-image:
    linear-gradient(180deg, #4A5C33 0 4px, #2E3A22 4px 100%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 22px);
  box-shadow:0 3px 0 rgba(0,0,0,.55)
}

/* ---------- 深度尺 ---------- */
.xs-rule{
  position:absolute;left:0;z-index:2;pointer-events:none;
  border-top:1px dashed rgba(255,240,214,.09)
}
.xs-rule span{
  position:absolute;left:6px;top:-14px;font-size:22px;color:var(--mute);opacity:.65
}

/* ---------- 岩壁裡的生態 ----------
   平常沉在岩石裡，滑過去才浮出來。牠們是環境，不是資訊。 */
.xs-fauna{
  position:absolute;z-index:1;width:44px;height:44px;padding:0;border:none;
  background:none;cursor:pointer;opacity:.55;
  animation:drift 6s steps(1,end) infinite
}
.xs-fauna .px{width:44px;height:44px}
.xs-fauna:hover{opacity:1}
@keyframes drift{
  0%,49%{transform:translateY(0)}
  50%,100%{transform:translateY(-4px)}
}

/* ---------- 一條廊道 ---------- */
.xs-shaft{position:absolute;top:0;bottom:0;z-index:3}

/* 欄頭。三行：招牌、他們在做什麼、誰＋現在怎麼樣。
   本來四行，而且亮的那一行是組名——「第一組 · 甲」是座號，
   「畢製分工失衡」才是資料。整塊是一顆鈕，點得進那一組。 */
.xs-head{
  position:absolute;top:0;left:0;width:176px;height:110px;
  text-align:center;z-index:5;
  padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit
}
.xs-st{
  position:absolute;left:0;bottom:0;width:176px;font-style:normal;
  line-height:19px;
  white-space:nowrap;background:rgba(0,0,0,.55)
}
.xs-head .px.sign-s{width:33px;height:33px;margin:0 auto}
.xs-head b{
  display:block;font-size:22px;font-weight:400;color:var(--ink);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px
}
.xs-head span{
  font-size:22px;color:var(--dim);margin-right:5px
}
.xs-head i{
  font-style:normal;font-size:22px;color:var(--mute)
}
.xs-head:hover b{color:var(--gold)}
.xs-head i.x{color:var(--ok)}
.xs-head i.y{color:var(--dim)}
.xs-head i.z{color:var(--over)}
.xs-shaft.mine .xs-head b{color:var(--gold)}

/* 一格打通的空間。右邊掛一個斜的側面——立體感來自這裡。 */
.xs-seg{
  position:absolute;left:0;width:176px;height:52px;
  background:rgba(0,0,0,.30);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)
}
.xs-seg::after{
  content:'';position:absolute;left:100%;top:0;width:11px;height:100%;
  background:rgba(0,0,0,.42);
  clip-path:polygon(0 0,100% -20%,100% 80%,0 100%)
}
/* 打通的：那一區的石頭顏色。同一個深度，五條廊道一定同一個顏色。 */
.xs-seg.dug{box-shadow:
  inset 0 2px 0 rgba(255,255,255,.14),
  inset 0 -3px 0 rgba(0,0,0,.40),
  inset 0 0 0 1px rgba(0,0,0,.5)}
/* 打通的那一格：那一層的石頭顏色。同一個深度，六條廊道一定同一個顏色。 */
.xs-seg.wild{--zdug:#9A7E22;--zink:#C9A227}
.xs-seg.root{--zdug:#3E5533;--zink:#7FA866}
.xs-seg.crys{--zdug:#3E7E96;--zink:#5FA8C7}
.xs-seg.echo{--zdug:#625397;--zink:#8C7BC7}
.xs-seg.rust{--zdug:#6B4526;--zink:#B07A4A}
.xs-seg.fire{--zdug:#9E4026;--zink:#D9603F}
.xs-seg.dug{background:var(--zdug)}
.xs-seg.dug::after{background:rgba(0,0,0,.5)}
/* 自己那一條亮一階。這不是名次，是「哪一條是我的」。 */
.xs-shaft.mine .xs-seg.dug{background:var(--zink)}

/* 正在走的那一格：從底下往上填到承諾的比例 */
.xs-seg.here{box-shadow:inset 0 0 0 1px var(--gold-d)}
.xs-seg.here i{
  position:absolute;left:0;right:0;bottom:0;
  background:rgba(233,179,65,.26);border-top:2px solid var(--gold)
}

.xs-hero{position:absolute;left:37px;width:36px;height:36px;z-index:6}
.xs-hero .px.ch-s{width:36px;height:36px}
.xs-hero .px.vine-s{position:absolute;inset:0;width:36px;height:36px;opacity:.9}
.xs-hero.sleep{opacity:.6}

/* ---------- 圖例 ---------- */
.lg{display:flex;flex-wrap:wrap;gap:11px 22px;margin:11px 0}
.lg div{display:flex;align-items:center;gap:8px;font-size:22px;color:var(--mute)}
.lg b{width:22px;height:11px;display:block}
.lg .lg-dug{background:#9A7E22}
.lg .lg-here{background:rgba(233,179,65,.26);box-shadow:inset 0 2px 0 var(--gold)}
.lg .lg-hero{background:#D9C08A}
.lg .lg-fa{background:#5FA8C7;opacity:.4}

/* ---------- 點開的那一隻 ---------- */
.fa-in{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.px.fa-px{width:110px;height:110px;flex:0 0 110px}
.fa-in > div{flex:1;min-width:264px}
.fa-in h2{margin:0 0 11px}
.card.fa{background-color:var(--zbg)}

@media (prefers-reduced-motion: reduce){ .xs-fauna{animation:none} }

/* 別組封存的岩心，掛在它們被封存的那個深度。
   這是這張圖上唯一會一直長出新東西的地方，而且長出新東西的是別人。 */
.xs-core{
  position:absolute;right:-8px;width:22px;height:44px;z-index:7;
  padding:0;border:none;background:none;cursor:pointer;opacity:1
}
.xs-core:hover{opacity:1}
.xs-core .px.mcore{width:22px;height:auto;max-height:44px}
.lg .lg-core{background:#8C7BC7}

/* 把數字畫出來的那幾個東西。

   這一份存在的理由：介面上本來有一堆我寫的說明句，在解釋畫面上的數字
   是什麼意思。能畫出來的就畫出來，畫出來之後那些句子全部可以刪掉。 */

/* ---------- 承諾與實際：兩條尺 ----------
   上面是你說的（範圍框出來），下面是實際走的。
   超出框的那幾格自己會是另一個顏色——那就是判定，不用寫字。 */
.ebar{margin:11px 0}
.eb-r{display:flex;align-items:center;gap:11px;margin:3px 0}
.eb-r b{
  flex:0 0 44px;font-size:22px;font-weight:400;color:var(--mute);text-align:right
}
.eb-r i{
  flex:0 0 33px;font-style:normal;font-size:22px;color:var(--gold);
  text-align:right;font-variant-numeric:tabular-nums
}
.eb-c{display:flex;gap:2px;flex:1;min-width:0}
.eb{
  flex:1;min-width:5px;height:22px;background:rgba(0,0,0,.45);
  box-shadow:inset 0 0 0 1px rgba(255,240,214,.06)
}
/* 你自己說的範圍 */
.eb.band{background:rgba(233,179,65,.10);box-shadow:inset 0 0 0 1px var(--gold-d)}
/* 承諾的那一天 */
.eb.pin{background:rgba(233,179,65,.30);box-shadow:inset 0 0 0 2px var(--gold)}
/* 實際走過的 */
.eb.on{background:var(--gold-d);box-shadow:inset 0 2px 0 rgba(255,255,255,.16)}
.eb.on.band{background:var(--gold)}
/* 走出框外的那幾格 */
.eb.out{background:var(--over);box-shadow:inset 0 2px 0 rgba(255,255,255,.20)}

/* ---------- 他們自己那一份清單 ----------
   同一個元件當三種用：圖例、推進鍵、標記鍵。
   顏色照清單順序給——系統不知道「打樣」該是什麼顏色，也不假裝知道。 */
.alist{display:flex;flex-wrap:wrap;gap:8px;margin:11px 0}
.ac{
  display:flex;align-items:center;gap:8px;padding:9px 13px;
  font-size:22px;line-height:1.2;color:var(--dim);
  background:var(--sunk);border:none;cursor:default;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06),
    0 0 0 1px #000
}
button.ac{cursor:pointer}
button.ac:hover{color:var(--ink)}
button.ac:active{transform:translateY(1px)}
.ac b{flex:0 0 14px;width:14px;height:14px;display:block}
.ac.on{color:var(--ink);background:#2E2210;box-shadow:inset 0 2px 0 rgba(0,0,0,.6),
  inset 0 -2px 0 rgba(255,240,214,.06), 0 0 0 1px var(--gold)}

/* 一趟走下來，每一天一格顏色 */
.dstrip{display:flex;gap:2px;flex-wrap:wrap;margin:11px 0}
.ds{width:22px;height:11px;display:block}

/* ---------- 招牌的三階 ---------- */
.sgline{display:flex;gap:22px;margin:11px 0;align-items:flex-end}
.sg{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.3}
.sg.on{opacity:1}
.sg i{font-style:normal;font-size:22px;color:var(--mute)}
.sg.on i{color:var(--gold)}

/* ---------- 留下的 ---------- */
.px.kp-px{width:66px;height:66px;flex:0 0 66px}
.px.kp-px.sm{width:44px;height:44px;flex:0 0 44px}
.ke{display:block;font-size:22px;color:var(--mute);letter-spacing:.1em}
.keeps{display:flex;flex-direction:column;gap:11px;margin-top:11px}
.kp{display:flex;gap:14px;align-items:flex-start;padding:11px 0;
  border-top:1px solid var(--line)}
.kp i{display:block;font-style:normal;font-size:22px;color:var(--ink);line-height:1.6}
.kp .km{display:block;font-size:22px;color:var(--gold-d);margin-top:3px}
.carry-in em{line-height:1.7}

/* 挑一張留下：三張並排 */
.gcard .ke{margin-bottom:5px}
.gcard i{display:block;font-style:normal;font-size:22px;color:var(--ink);line-height:1.7}

/* 老師寫的那一句，跟自己留下的那一句要分得出來 */
.quote.tw{border-left-color:var(--line2);color:var(--dim)}

/* ---------- 老師分的段 ---------- */
.steps-list{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.stp{
  display:flex;align-items:center;gap:11px;padding:11px 13px;width:100%;
  font-size:22px;line-height:1.3;color:var(--dim);text-align:left;
  background:var(--sunk);border:none;cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06), 0 0 0 1px #000
}
.stp b{
  flex:0 0 22px;width:22px;height:22px;display:block;
  box-shadow:inset 0 0 0 2px var(--line2)
}
.stp i{font-style:normal}
.stp:hover{color:var(--ink)}
.stp:active{transform:translateY(1px)}
.stp.on{color:var(--mute)}
.stp.on b{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.stp.on i{text-decoration:line-through}

/* ---------- 出口 ---------- */
.card.exitc h2{margin:0 0 11px}
.card.exitq{box-shadow:inset 0 3px 0 var(--ok), inset 0 -3px 0 rgba(0,0,0,.72),
  inset -3px 0 0 rgba(0,0,0,.72), 0 0 0 1px #000}
.outnum{display:flex;flex-wrap:wrap;gap:22px;margin:11px 0 22px}
.outnum div{min-width:88px}
.outnum b{display:block;font-size:44px;line-height:1;color:var(--gold);font-weight:400}
.outnum span{font-size:22px;color:var(--mute)}
.outrun{margin:0 0 14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.outrun > span{font-size:22px;color:var(--dim)}

/* 兩條尺的圖例 */
.bkey{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0 55px}
.bkey span{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--mute)}
.bkey b{width:18px;height:11px;display:block}
.bkey .k1{background:rgba(233,179,65,.10);box-shadow:inset 0 0 0 1px var(--gold-d)}
.bkey .k2{background:var(--gold-d)}
.bkey .k3{background:var(--over)}

/* 這一趟的形狀：全部是數字，一句判斷都沒有 */
.shape{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 0}
.shape span{display:flex;align-items:baseline;gap:5px;font-size:22px;color:var(--mute)}
.shape b{font-size:22px;line-height:1;color:var(--ink);font-weight:400}
.shape .blank b{color:var(--mute)}

/* 「今天沒有動」：跟上面那幾顆一樣好按，但不會讓畫面變亮 */
.ac.rest{color:var(--mute)}
.ac.rest b{background:transparent;box-shadow:inset 0 0 0 2px var(--line2)}
.ac.rest:hover{color:var(--dim)}

/* 安靜的卡：今天要做的那一張以外，其他都退一階 */
.card.quiet{background-color:#100D0A}
.card.quiet .eyebrow{color:#4A4038}

/* 唯一可以按的那一個。它接在廊道底下，讀起來是同一塊東西的一部分，
   不是一張獨立的卡——就像 Threads 的輸入框長在 feed 最上面。 */
.act-card{padding:22px;margin-top:-11px}
.act-card h2{font-size:22px;line-height:1.5;margin:0 0 11px}
.act-card .eyebrow{margin-bottom:11px}
@media (max-width:860px){ .act-card{padding:22px 14px} .act-card h2{font-size:22px} }

/* ---------- 圖鑑 ----------
   全部看得到。沒遇過的只是淡一點，不是鎖起來——一鎖上它就變成
   一條要填滿的條，那正是這一份不做的事。 */
.cx-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:11px}
.cx{display:flex;flex-wrap:wrap;gap:11px}
.cxi{
  display:flex;gap:11px;align-items:flex-start;width:264px;padding:11px;
  background:rgba(0,0,0,.30);opacity:.55
}
.cxi.met{opacity:1;background:rgba(0,0,0,.45)}
.px.cx-px{width:44px;height:44px;flex:0 0 44px}
.cxi b{display:block;font-size:22px;font-weight:400;color:var(--ink);line-height:1.3}
/* 說明砍成一句「牠會做什麼」之後，字級就升得上來——
   長什麼樣那半句刪掉了，因為旁邊就畫著牠。 */
.cxi em{display:block;font-style:normal;font-size:22px;color:var(--mute);line-height:1.5;margin-top:5px}
.cxi .cx-met{display:block;font-size:22px;color:var(--gold);line-height:1.7;margin-top:5px}
@media (max-width:860px){ .cxi{width:100%} }

/* 狀態。系統只陳述——「沒有消息」講的是紀錄，不是那一組的人。 */
.s-move{color:var(--ok)}
.s-slow{color:var(--dim)}
.s-stop{color:var(--gold)}
.s-quiet{color:var(--over)}
.s-idle{color:var(--mute)}

/* ---------- 岩心 ----------
   一天兩列，由上往下。長度就是那一趟過了幾天，
   所以三天是一小截、十五天是一長條——架子上一眼看得出哪一趟是硬仗。 */
.px.core{width:55px;height:auto;max-height:231px;display:block}
.px.core.big{width:66px;max-height:308px}
.rack{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin-top:14px}
.rk{width:110px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rk .px.core{margin:0 auto}
.rk b{font-size:22px;font-weight:400;color:var(--gold);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;width:100%}
.rk span{font-size:22px;color:var(--mute)}
.rk em{font-style:normal;font-size:22px;color:var(--gold-d)}
.rk.row-rk{flex-direction:row;width:auto;text-align:left;align-items:center;gap:14px}
.rk.row-rk b{font-size:22px}

.corekey{display:flex;flex-wrap:wrap;gap:14px;margin:11px 0}
.corekey span{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--mute)}
.corekey b{width:18px;height:11px;display:block}
.corekey .c1{background:var(--gold)}
.corekey .c2{background:transparent;box-shadow:inset 0 0 0 2px var(--gold-d)}
.corekey .c3{background:repeating-linear-gradient(90deg,var(--mute) 0 2px,transparent 2px 5px)}

.coreview .cv-in{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.coreview .cv-in > div{flex:1;min-width:220px}

/* ---------- 這幾天你動過哪幾天 ----------
   一格一天。點一下切換。它不進判定，所以它不是一個要被填滿的東西。 */
.dgrid{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0}
.dg{
  width:44px;height:44px;padding:0;border:none;cursor:pointer;
  background:var(--sunk);color:var(--mute);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06), 0 0 0 1px #000
}
.dg b{font-size:22px;font-weight:400}
.dg:hover{color:var(--dim)}
.dg:active{transform:translateY(1px)}
.dg.on{background:var(--gold-d);color:var(--ink)}
.dg.on b{color:#1A1408}

/* ---------- 別組怎麼看這一件事 ----------
   匿名的分布。沒有名字、沒有名次——只有「大家覺得這件事多大」。 */
.spread{display:flex;align-items:flex-end;gap:3px;margin:11px 0;min-height:66px}
.sp-c{flex:1;min-width:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sp-c b{display:block;width:100%;background:var(--line2)}
.sp-c i{font-style:normal;font-size:22px;color:var(--mute)}
.sp-c.me b{background:var(--gold)}
.sp-c.me i{color:var(--gold)}

/* ---------- 圖鑑：一次只看一層 ----------
   本來六層一路往下攤開，五十幾隻排成一條看不完的捲軸。
   切頁之後一屏剛好一層。 */
.cxtabs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.cxt{
  padding:9px 14px;font-size:22px;line-height:1.2;cursor:pointer;border:none;
  background:var(--sunk);color:var(--mute);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06), 0 0 0 1px #000
}
.cxt i{font-style:normal;font-size:22px;color:var(--gold-d);margin-left:8px}
.cxt:hover{color:var(--dim)}
.cxt:active{transform:translateY(1px)}
.cxt.on{background:var(--zbg);color:var(--zink);box-shadow:0 0 0 1px #000,
  inset 0 3px 0 var(--zink)}
.cxt.gear.on{--zbg:#1A1611;--zink:var(--gold)}

/* 一層裡的那幾隻：兩到三欄，描述收成兩行，一屏塞得下 */
/* 本來夾成兩行、第三行切掉——切掉的字等於沒寫。
   說明已經砍到只剩一句「牠會做什麼」，所以讓它整句都在。 */
@media (min-width:1200px){ .cxi{width:calc(33.33% - 8px)} }

/* ---------- 選單：背包裡的幾樣東西 ---------- */
.nav a{gap:11px}
.px.nic{width:22px;height:22px;flex:0 0 22px}
.nav a .dot{display:none}
@media (max-width:860px){
  .nav a{flex-direction:column;gap:2px}
  .px.nic{width:18px;height:18px;flex:0 0 18px}
}

/* ---------- 頂條：角色身上的東西，不是網站的狀態列 ---------- */
.top.hud{
  gap:14px;
  background-color:var(--zbg,var(--panel));
  background-image:var(--ztex,none), linear-gradient(180deg,
    rgba(255,240,214,.07) 0 1px, transparent 1px calc(100% - 3px),
    rgba(0,0,0,.72) calc(100% - 3px) 100%);
}
.px.hud-sign{width:33px;height:33px;flex:0 0 33px}
/* 大的那個是專案名，不是組名。組名是固定的、你早就知道了；
   專案名才是「我現在在做什麼」——本來它跟裝飾字一樣小。這是對調，不是放大，
   所以頂條的高度沒有變。 */
.top.hud .who{font-size:22px;color:var(--dim)}
.top.hud .hud-pj{font-size:22px;color:var(--ink)}
.top.hud .hud-z{font-size:22px;color:var(--zink,var(--gold))}
.top.hud .hud-d{
  font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;
  padding:0 9px;background:rgba(0,0,0,.45)
}
.top.hud .hud-d.warnx{color:var(--over)}

/* ---------- 卡片切角：跟按鈕同一個簽名 ---------- */
.card,.act-card,.stamp-card,.dash{
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.cxt,.ac,.stp{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}

/* ---------- 頁首做成刻在石頭上的牌子 ---------- */
.wrap > h1{
  display:inline-block;padding:5px 22px 5px 0;margin-bottom:14px
}
.wrap > .eyebrow{color:var(--gold-d)}

/* 洞口那幾樣現在也是入口 */
.mouth .hang{padding:0;border:none;background:none;cursor:pointer}
.mouth .hang:hover{filter:brightness(1.2)}
.mouth .shaft{padding:0;border:none;cursor:pointer}
.stp.static{cursor:default;color:var(--dim)}
.stp.static b{box-shadow:inset 0 0 0 2px var(--line)}

/* ---------- 首頁上面那一條：你手上這一趟 ----------
   像 YouTube 的上傳鍵——它在最上面，但它不是那一頁的內容。 */
.task{
  background-color:var(--zbg,var(--panel));
  background-image:var(--ztex,none);
  padding:22px;margin:0 0 22px;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  box-shadow:inset 0 3px 0 rgba(255,240,214,.09), inset 0 -3px 0 rgba(0,0,0,.72), 0 0 0 1px #000
}
.task-top{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}
.task-top > div:first-child{flex:1;min-width:0}
.task h1{font-size:33px;line-height:1.35;margin:0}
.task .lead{margin:11px 0 0}
.task-z{text-align:right}
.task-z em{display:block;font-style:normal;font-size:22px;color:var(--zink,var(--gold))}
.task-z b{display:block;font-size:22px;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}
.task .act-card{background:none;box-shadow:none;padding:14px 0 0;margin:0}
.task .ebar{margin:14px 0 0}
.task .card{background:rgba(0,0,0,.28);box-shadow:none;clip-path:none;margin:14px 0 0;padding:14px}

/* 底下那三樣：偶爾才用，但不能藏起來 */
.desk{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px;
  border-top:1px solid rgba(255,240,214,.10);padding-top:14px}
.dk{
  display:flex;align-items:center;gap:8px;padding:8px 11px;
  background:rgba(0,0,0,.30);border:none;cursor:pointer;color:var(--mute);
  font-size:22px;opacity:.6
}
.dk .px{width:22px;height:22px}
.dk i{font-style:normal;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk:hover{opacity:1;color:var(--dim)}
.dk.lit{opacity:1;color:var(--dim)}

/* ---------- 全班最近 ----------
   打開它的理由是別人，留下來的理由才是自己。
   放的是「發生了什麼」，不是「誰比較好」——沒有名次、沒有印章。 */
.feed-h{margin:0 0 11px}
.feed{display:flex;flex-direction:column;gap:1px;background:#000}
.fd{
  display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--panel);
  font-size:22px;color:var(--dim)
}
.fd.mine{background:var(--panel2)}
.fd > div{flex:1;min-width:0}
.fd b{font-size:22px;color:var(--ink);font-weight:400;margin-right:8px}
.fd span{display:block;font-size:22px;color:var(--mute);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd > i{font-style:normal;font-size:22px;color:var(--mute);flex:0 0 auto}
.fd-ic{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  padding:0;border:none;background:none;cursor:pointer}
.px.core.sm{width:22px;max-height:66px}
@media (min-width:1200px){ .wrap > .task,.wrap > .feed,.wrap > .feed-h{flex:0 0 100%} }

/* 任務那一行：接在廊道正下面，不是一張卡 */
.tline{
  display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;
  margin:-11px 0 11px;padding:11px 14px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), 0 0 0 1px #000
}
.tline b{font-size:22px;font-weight:400;color:var(--ink)}
.tline i{font-style:normal;font-size:22px}
.srow{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 11px}
.sq{
  display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:22px;
  background:var(--sunk);color:var(--mute);border:none;cursor:pointer;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), 0 0 0 1px #000
}
.sq b{width:11px;height:11px;display:block;box-shadow:inset 0 0 0 2px var(--line2)}
.sq.on{color:var(--dim)}
.sq.on b{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.sq:hover{color:var(--dim)}

/* ---------- 全班：一片被打通的岩層 ----------
   一格一格，往哪裡打通是自己選的。沒有名次、沒有計數、沒有排序。 */
.dig-wrap{
  overflow:auto;max-height:70vh;margin:0 0 22px;background:#070605;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.7), inset 3px 0 0 rgba(0,0,0,.7),
    inset 0 -3px 0 rgba(255,240,214,.05), 0 0 0 1px #000
}
.dig{position:relative}
.dig-sky{position:absolute;left:0;top:0;height:6px;
  background:linear-gradient(180deg,#4A5C33 0 3px,#2E3A22 3px 6px);z-index:3}
.dg-c{position:absolute;width:40px;height:40px;padding:0;border:none}
.dg-c.rock{background-color:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.dg-c.dug{
  cursor:pointer;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(0,0,0,.7)
}
.dg-c.dug:hover{filter:brightness(1.25)}
.dg-c.dug.mine{box-shadow:inset 0 3px 0 rgba(255,255,255,.35),
  inset 0 -3px 0 rgba(0,0,0,.45), 0 0 0 2px var(--ink)}
.dig-z{position:absolute;left:3px;font-size:22px;color:var(--zink);opacity:.7;z-index:2}
.dig-n{position:absolute;font-size:22px;white-space:nowrap;z-index:4}
.dig-n.mine{font-weight:500}
.dig-nb{display:flex;flex-wrap:wrap;gap:11px;margin:-11px 0 22px}
.dig-nb span{font-size:22px;color:var(--gold);padding:5px 9px;background:var(--sunk)}

/* 封存那一頁的小地圖：往哪裡打通 */
.pickmap{position:relative;margin:11px 0}
.pk-c{position:absolute;width:33px;height:33px;padding:0;border:none}
.pk-c.rock{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.pk-c.own{box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(0,0,0,.7)}
.pk-c.can{background:rgba(233,179,65,.18);cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--gold-d)}
.pk-c.can:hover{background:rgba(233,179,65,.34)}
.pk-c.can.on{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold2)}

/* 能打通的那幾格：亮起來，點得動。PaGamO 最直覺的那一下。 */
.dg-c.rock.can{
  cursor:pointer;
  box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 6px rgba(233,179,65,.18);
  animation:cang 1.2s steps(1,end) infinite
}
@keyframes cang{
  0%,49%{box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 6px rgba(233,179,65,.18)}
  50%,100%{box-shadow:inset 0 0 0 2px var(--gold2), inset 0 0 0 6px rgba(233,179,65,.34)}
}
.dg-c.rock.can:hover{box-shadow:inset 0 0 0 3px var(--gold2), inset 0 0 0 20px rgba(233,179,65,.30)}
.dig-can{
  margin:-11px 0 22px;padding:11px 14px;font-size:22px;color:var(--gold);
  background:rgba(233,179,65,.10);box-shadow:inset 0 0 0 1px var(--gold-d)
}
@media (prefers-reduced-motion: reduce){ .dg-c.rock.can{animation:none} }

/* 兩組都構得到的那一格。誰先點誰拿走——最軟的一種競爭：
   沒有名次，也不會失去任何已經有的東西。 */
.dg-c.rock.hot2{
  background-image:repeating-linear-gradient(45deg,
    rgba(217,96,63,.30) 0 3px, transparent 3px 8px)
}
.dg-c.rock.can.hot{
  box-shadow:inset 0 0 0 2px var(--over), inset 0 0 0 6px rgba(217,96,63,.22);
  animation:hotg .9s steps(1,end) infinite
}
@keyframes hotg{
  0%,49%{box-shadow:inset 0 0 0 2px var(--over), inset 0 0 0 6px rgba(217,96,63,.22)}
  50%,100%{box-shadow:inset 0 0 0 2px #F08A6B, inset 0 0 0 6px rgba(217,96,63,.40)}
}
@media (prefers-reduced-motion: reduce){ .dg-c.rock.can.hot{animation:none} }

/* ── 照面 ──
   作業是行走，交代是戰鬥。整個流程最有份量的那一下本來長得像一張表單，
   現在是一個照面：自己在左邊，牠在右邊，中間是還沒發生的事。

   勝負不在這一頁上。它由承諾幾天與行事曆過了幾天決定——
   按得快、按得多，都不會改變任何東西。 */
.duel{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  gap:11px;padding:22px 22px 0;height:132px;overflow:hidden;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
  background:linear-gradient(180deg,var(--z1) 0 62%,var(--z2) 62% 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.10)
}
.duel::after{ /* 地面那一條硬邊。沒有模糊，光永遠從左上來 */
  content:'';position:absolute;left:0;right:0;bottom:22px;height:3px;
  background:rgba(0,0,0,.34)
}
.duel-me,.duel-mob{position:relative;z-index:2;transform-origin:50% 100%}
.duel-me{animation:dbob 1.1s steps(2,end) infinite}
.duel-mob{animation:dbob 1.1s steps(2,end) infinite reverse}
/* 牠原本跟人一樣大，那就不像擋路的東西。直接把圖放大成兩倍寬——
   用 transform 放大會把它推出面板外，所以改成給尺寸。
   原圖是 24×16，比例照著給才不會被拉扁。 */
.duel-mob .fa-px{width:132px;height:88px;transform:scaleX(-1);image-rendering:pixelated}
@keyframes dbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 中間那三點：還沒發生的事。 */
.duel-gap{display:flex;gap:11px;align-items:center;padding-bottom:44px;z-index:2}
.duel-gap span{width:5px;height:5px;background:rgba(255,255,255,.45)}
.duel-gap span:nth-child(1){animation:dpt 1.2s steps(1,end) infinite}
.duel-gap span:nth-child(2){animation:dpt 1.2s steps(1,end) .4s infinite}
.duel-gap span:nth-child(3){animation:dpt 1.2s steps(1,end) .8s infinite}
@keyframes dpt{0%,60%{opacity:.15}61%,100%{opacity:1}}

.duel-t{margin:11px 0 0;color:var(--dim);font-size:22px;line-height:22px}

/* 打完了。牠退開，自己往前站一格。演一次，不循環。 */
.duel.done .duel-me{animation:dstep .5s steps(3,end) 1 forwards}
.duel.done .duel-mob{animation:dgone .6s steps(3,end) .2s 1 forwards}
.duel.done .duel-gap{opacity:0}
@keyframes dstep{to{transform:translateX(22px)}}
@keyframes dgone{to{transform:translateX(44px);opacity:.15}}

@media (prefers-reduced-motion: reduce){
  .duel-me,.duel-mob,.duel-gap span{animation:none}
  .duel.done .duel-mob{opacity:.15}
}

/* ── 你不在的這幾天 ──
   死線勇者回來看戰利品的那一下，換成誠實的版本：只報真的發生過的事。
   數字大、名字小，一眼掃完就過去，不佔位置。 */
.away{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;
  padding:11px 14px;margin-bottom:11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.away b{font-size:22px;line-height:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.away span{font-size:22px;color:var(--dim);margin-left:-16px}
.away em{font-size:22px;font-style:normal;color:var(--over)}

/* ── 面板 ──
   參考死線勇者：它整個畫面是一組有框的面板，不是一頁網頁。框、鉚釘、
   標題掛在框上，那三件事就足以讓一張卡片讀起來像遊戲介面。

   守住原本的規則：硬邊、零模糊、光從左上來、圓角一律 11px 的切角。 */
.card{position:relative}
.card::after{
  content:'';position:absolute;inset:6px;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%),
    linear-gradient(rgba(0,0,0,.26) 0 100%),linear-gradient(rgba(0,0,0,.26) 0 100%);
  background-size:3px 3px;background-repeat:no-repeat;
  background-position:0 0,100% 0,0 100%,100% 100%
}
.card > *{position:relative;z-index:1}

/* 標題掛在框上，像面板的名牌。 */
.card > .eyebrow:first-child{
  display:inline-block;margin:-4px 0 11px -6px;padding:3px 11px;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.10);
  clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)
}

/* ── 戰報 ──
   死線勇者的結果是一份回頭讀的報告。這裡也一樣：判定不是一張貼紙，
   是那一趟的幾行數字。數字對齊，因為它們是要被互相比較的。 */
.rep{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 22px}
.rep dt{
  font-size:22px;color:var(--dim);line-height:33px;
  border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd{
  margin:0;font-size:22px;line-height:33px;color:var(--ink);text-align:right;
  font-variant-numeric:tabular-nums;border-bottom:2px solid rgba(0,0,0,.14)
}
.rep dd.s{font-size:22px;text-align:left;color:var(--dim)}
.rep dt:last-of-type,.rep dd:last-of-type{border-bottom:0}

/* ── 地圖的環境 ──
   PaGamO 的地圖讀起來像一塊大陸，靠的不是格子畫得漂亮，是地表上有東西、
   地裡有東西、而且領土是一塊有輪廓的形狀。這三件事這裡都補上了。 */

/* 天。硬停的漸層，沒有模糊——一有模糊它就不是像素了。 */
.dig-sky{
  position:absolute;top:0;z-index:0;
  background:linear-gradient(180deg,#0B1020 0 40%,#141B31 40% 72%,#1E2440 72% 100%)
}
/* 上面那片林子。根脈層那一句說的根，就是從這裡穿下來的。 */
.dig-tree{
  position:absolute;width:9px;z-index:1;background:#1C2A18;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}
/* 泥土。岩層從這一條下面開始。 */
.dig-soil{
  position:absolute;height:8px;z-index:2;
  background:linear-gradient(180deg,#3E4A2C 0 3px,#2A2418 3px 8px)
}
/* 每一組下來的那個井口。自己那一個亮一點。 */
.dig-shaft{
  position:absolute;width:40px;height:11px;z-index:3;
  background:linear-gradient(180deg,rgba(255,240,214,.20) 0 3px,rgba(255,240,214,.07) 3px 11px)
}
.dig-shaft.mine{
  background:linear-gradient(180deg,rgba(233,179,65,.55) 0 3px,rgba(233,179,65,.16) 3px 11px)
}

/* 岩層交界。每一欄高度不同，所以它犬牙交錯——
   一條直線會讓整張圖讀起來像表格。 */
.dig-seam{position:absolute;width:40px;z-index:1;background:var(--zln);opacity:.85}

/* 岩層裡的東西。位置用座標算，所以石頭永遠在同一個地方。 */
.dg-c.rock{overflow:hidden}
.mp{position:absolute;width:18px;height:auto;opacity:.5;image-rendering:pixelated}

/* 同一層裡每一格的深淺差一點點，不然整片會像一塊布。 */
.dg-c.rock.v1{filter:brightness(1.08)}
.dg-c.rock.v2{filter:brightness(.92)}

/* 打通了的地：輪廓在 JS 那邊算（只描對外的邊），所以這裡不要再蓋一次。 */
.dg-c.dug{box-shadow:none}
.dg-c.dug.mine{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}

/* 走路：兩幀疊著，輪流出現。steps(1) 是硬切——
   淡入淡出會讓像素看起來像有殘影。 */
.scn-hero.walking{position:absolute}
.scn-hero .wf{position:absolute;left:0;top:0}
.scn-hero .wa{animation:wkA .44s steps(1,end) infinite}
.scn-hero .wb{animation:wkB .44s steps(1,end) infinite}
@keyframes wkA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes wkB{0%,49%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .scn-hero .wa{animation:none;opacity:1}
  .scn-hero .wb{animation:none;opacity:0}
}

/* 地圖上的角色：站在自己最前緣那一格。 */
.dig-hero{position:absolute;z-index:6;width:44px;height:44px;pointer-events:none}
.dig-hero .ch{width:44px;height:44px;image-rendering:pixelated;
  filter:drop-shadow(2px 0 0 rgba(0,0,0,.55)) drop-shadow(-2px 0 0 rgba(0,0,0,.55))
         drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.dig-hero .wf{position:absolute;left:0;top:0}
.dig-hero .wa{animation:wkA .44s steps(1,end) infinite}
.dig-hero .wb{animation:wkB .44s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){
  .dig-hero .wa{animation:none;opacity:1}
  .dig-hero .wb{animation:none;opacity:0}
}

/* ── 蓋在地上的東西 ──
   地是組別的顏色，建築一律深色剪影加高光——所以每一組的建築讀起來
   一樣重，差別只在形狀。用顏色分強弱的話，那張圖就會被讀成排名。 */
.dg-c.dug{position:relative;display:block}
.bld{position:absolute;left:4px;bottom:2px;width:32px;height:32px;
  image-rendering:pixelated;pointer-events:none}

/* 兩組的地貼在一起長出來的路。 */
.dig-link{position:absolute;z-index:5;background:var(--gold);opacity:.8}
.dig-link.v{width:6px;height:18px}
.dig-link.h{width:18px;height:6px}

/* 三選一。三個一樣大、一樣亮——沒有一個看起來比較厲害。 */
.bp-row{display:flex;gap:11px;flex-wrap:wrap}
.bp{
  flex:1 1 88px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px;cursor:pointer;border:none;color:var(--ink);font:inherit;
  background:var(--card2);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28), inset 2px 2px 0 rgba(255,255,255,.08);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.bp:hover{box-shadow:inset 0 0 0 2px var(--gold), inset 2px 2px 0 rgba(255,255,255,.12)}
.bp-px{width:66px;height:50px;image-rendering:pixelated}
.bp b{font-size:22px;font-weight:400}

/* 點一座建築：那是哪一趟。建築不是獎品，是那一趟的紀念碑。 */
.bstory .bs-in{display:flex;gap:14px;align-items:flex-start}
.bs-px{width:66px;height:66px;image-rendering:pixelated;flex:0 0 auto}
.bstory h2{margin:6px 0 11px;font-size:22px;font-weight:400}

/* 廊道要滑得動、滑得順，而且不要搶走整頁的上下捲動。
   兩邊留一道暗邊，讓人看得出來它還有得滑。 */
.scn-scroll{
  -webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;
  scrollbar-width:thin
}
.dig-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scn::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    linear-gradient(90deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%),
    linear-gradient(270deg,rgba(0,0,0,.45) 0 6px,transparent 6px 100%)
}

/* ── 這一圈走到哪 ──
   四拍，走完接回第一拍。這座地下城是無盡輪迴的，所以它是環不是條——
   沒有百分比、沒有終點。 */
.cyc{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
  padding:11px 14px;margin:0 0 11px;background:var(--sunk);
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,240,214,.06);
  scrollbar-width:none
}
.cyc::-webkit-scrollbar{display:none}
.cy{display:flex;flex-direction:column;gap:1px;padding:3px 9px;white-space:nowrap;
  opacity:.42}
.cy b{font-size:22px;font-weight:400;color:var(--mute)}
.cy i{font-size:22px;font-style:normal;color:var(--dim)}
.cy.on{
  opacity:1;background:rgba(233,179,65,.12);
  box-shadow:inset 0 0 0 2px var(--gold-d)
}
.cy.on b{color:var(--gold)}
.cy.on i{color:var(--ink)}
/* 拍與拍之間的那一小段。最後一段接回第一拍，所以畫成虛的。 */
.cyd{flex:0 0 11px;height:3px;background:var(--line)}
.cyd.loop{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}

/* ── 承諾那一根尺 ──
   「你前幾趟」「別組怎麼看」「你要說幾天」量的都是天數。
   本來三張卡，等於叫使用者自己在腦袋裡疊起來。畫在同一根尺上就不用了。 */
.axis{position:relative;margin:14px 0 0;padding:0 3px}
.ax-row{position:relative;height:14px;margin-bottom:3px}
.ax-band,.ax-ok,.ax-link{position:absolute;top:5px;height:4px}

/* 別組說的範圍。匿名，只有天數。 */
.ax-band{background:rgba(95,168,199,.34)}
.ax-sp{height:18px}
.ax-tag{position:absolute;top:-2px;font-size:22px;font-style:normal;
  color:#5FA8C7;transform:translateX(-2px);white-space:nowrap}

/* 你前幾趟：空心＝說的，實心＝實際的。線往右就是低估。 */
.ax-link{background:rgba(255,240,214,.16)}
.ax-said,.ax-was{position:absolute;top:2px;width:10px;height:10px;
  margin-left:-5px;border-radius:0}
.ax-said{background:transparent;box-shadow:inset 0 0 0 2px var(--mute)}
.ax-was{background:var(--mute)}
.ax-was.over{background:var(--over)}

/* 你現在拉到的地方，跟準的範圍。 */
.ax-now{height:18px}
.ax-ok{top:6px;height:6px;background:rgba(233,179,65,.28)}
.ax-me{position:absolute;top:0;width:4px;height:18px;margin-left:-2px;
  background:var(--gold)}

/* 尺。只標三個數字，多了就變成一張表。 */
.ax-ruler{position:relative;height:16px;margin-top:3px;
  border-top:2px solid var(--line)}
.ax-ruler i{position:absolute;top:3px;font-size:22px;font-style:normal;
  color:var(--dim);transform:translateX(-50%)}
.ax-ruler i:first-child{transform:none}
.ax-ruler i:last-child{transform:translateX(-100%)}

/* 滑桿跟尺是同一根：同寬、同起點。
   range 的滑塊圓心從半個滑塊寬開始走，所以尺往內縮同樣的距離。 */
.ax-head{display:flex;align-items:baseline;gap:6px;justify-content:flex-end;
  margin-bottom:6px}
.ax-head b{font-size:44px;line-height:1;color:var(--gold);font-weight:400;
  font-variant-numeric:tabular-nums}
.ax-head span{font-size:22px;color:var(--dim)}
.ax-slider{display:block;width:100%;margin:0 0 11px}
.ax-in{position:relative;margin:0 11px}

/* 岩層表面看得出哪幾格裡有東西——但看不出是什麼。
   看得出來，「往哪裡打通」才是一個真的選擇；
   看不出是什麼，那一格才值得去。 */
.dg-c.rock.has::before{
  content:'';position:absolute;right:6px;top:6px;width:3px;height:14px;
  background:linear-gradient(180deg,
    rgba(255,240,214,.42) 0 5px, transparent 5px 7px,
    rgba(255,240,214,.42) 7px 14px);
  box-shadow:2px 0 0 rgba(0,0,0,.5)
}
.dg-c.rock.can.has::before{background:var(--gold2);box-shadow:2px 0 0 rgba(0,0,0,.5)}

/* 掀開那一格。準的時候牠還在，失準的時候只剩痕跡——
   兩邊都是一則紀錄，沒有人被扣任何東西。 */
.unc .unc-in{display:flex;gap:14px;align-items:flex-start}
.unc-px{width:88px;height:66px;flex:0 0 auto;image-rendering:pixelated}
.unc-px.gone{opacity:.34;filter:grayscale(1)}
.unc-px.blank{background-color:var(--zbg);background-image:var(--ztex);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.unc h2{margin:6px 0;font-size:22px;font-weight:400}
.unc .quote{margin:11px 0 0;padding-left:11px;
  box-shadow:inset 3px 0 0 var(--gold-d);color:var(--ink)}

/* 老師勾了：這是整條流程裡唯一「別人為你做了一件事」的時刻，
   本來長得跟其他狀態一模一樣。給它一個到達的樣子。 */
.eyebrow.lit{color:var(--gold);
  animation:arrive 1.6s steps(1,end) 2}
@keyframes arrive{0%,49%{color:var(--gold)}50%,100%{color:var(--gold2)}}
.quote.big{font-size:22px;line-height:33px;color:var(--ink);
  padding:11px 0 11px 14px;box-shadow:inset 3px 0 0 var(--gold)}
.away em.ok{font-size:22px;font-style:normal;color:var(--gold)}

/* 「上」那一下的撞擊。整條流程最有份量的一按，本來按下去直接換頁。
   一次，不循環——它報的是結果不是過程。 */
.duel.done{animation:duelhit .22s steps(2,end) 1}
@keyframes duelhit{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0)}
}
.duel.done::before{
  content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
  background:rgba(255,243,216,.8);
  animation:duelflash .22s steps(1,end) 1 forwards
}
@keyframes duelflash{0%{opacity:.9}30%{opacity:.35}100%{opacity:0}}

/* 戰報一行一行落下來。死線勇者的戰報是回來要讀的東西，
   一次全部出現就只是三個數字。 */
.rep dt,.rep dd{animation:repin .28s steps(3,end) both}
.rep dt:nth-of-type(1),.rep dd:nth-of-type(1){animation-delay:.20s}
.rep dt:nth-of-type(2),.rep dd:nth-of-type(2){animation-delay:.42s}
.rep dt:nth-of-type(3),.rep dd:nth-of-type(3){animation-delay:.64s}
.rep dt:nth-of-type(4),.rep dd:nth-of-type(4){animation-delay:.90s}
/* 只搬位置，不動 opacity——動畫的時鐘被凍住的時候（背景分頁、省電、
   自動化瀏覽器），用 opacity 當起始值會讓整行永遠看不見。
   動畫只能加東西，不能當成顯示的閘門。 */
@keyframes repin{from{transform:translateY(-8px)}to{transform:none}}

@media (prefers-reduced-motion: reduce){
  .duel.done{animation:none}
  .duel.done::before{display:none}
  .rep dt,.rep dd{animation:none}
  .eyebrow.lit{animation:none}
}

/* 坐著：兩幀，差在呼吸。停下來不是停止。 */
.scn-hero.resting .wa{animation:wkA 1.6s steps(1,end) infinite}
.scn-hero.resting .wb{animation:wkB 1.6s steps(1,end) infinite}

/* 營火三幀，跟火把同一套做法。
   火本來就絕對定位在洞口裡，所以這裡只擺三幀，不要再蓋一次 position——
   蓋掉它就會掉回文件流，畫成兩堆火。 */
.mouth .mfire .ff{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;
  animation:flk 420ms steps(1,end) infinite}
.mouth .mfire .f1{animation-delay:140ms}
.mouth .mfire .f2{animation-delay:280ms}
/* 點著的火在旁邊打出一圈光。沒有模糊——一有模糊就變成現代特效。 */
.mouth .mfire.lit::after{
  content:'';position:absolute;left:-44px;top:-33px;width:132px;height:110px;
  pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 60%,
    rgba(233,132,63,.13) 0 33px, rgba(233,132,63,.06) 33px 55px, transparent 55px)
}
@media (prefers-reduced-motion: reduce){
  .mouth .mfire .ff{animation:none;opacity:0}
  .mouth .mfire .f0{opacity:1}
  .scn-hero.resting .wa{animation:none;opacity:1}
  .scn-hero.resting .wb{animation:none;opacity:0}
}


/* ── 營火旁 ──
   火在左邊，人面對火。要讓「他在那裡休息」不用一句話解釋，
   靠三件事：坐姿的輪廓、火光打在他左側、火星一直在飄。 */

/* 火光打在人身上。硬邊的一道緣光，不是光暈——
   一有模糊就會看起來像貼在像素圖上的現代特效。 */
.scn-hero.resting .ch{
  filter:drop-shadow(-2px 0 0 rgba(233,132,63,.75))
         drop-shadow(-3px 0 0 rgba(233,132,63,.30))
}

/* 火星。這個畫面上唯一一直在動的小東西——
   沒有它，「坐在火旁邊」看起來會像一張靜止的圖。 */
.mouth .ember{
  position:absolute;bottom:78px;width:2px;height:2px;
  background:#FFD9A0;z-index:3;pointer-events:none;
  animation:emb var(--ed,1800ms) steps(7,end) infinite
}
@keyframes emb{
  0%{transform:translate(0,0);opacity:0}
  10%{opacity:.95}
  60%{opacity:.7}
  100%{transform:translate(6px,-44px);opacity:0}
}

/* 人坐著的地方地上暖一塊。硬停，沒有漸層模糊。 */
.mouth::after{
  content:'';position:absolute;left:0;bottom:40px;width:132px;height:14px;
  pointer-events:none;z-index:0;
  background:linear-gradient(90deg,
    rgba(233,132,63,.16) 0 44px,
    rgba(233,132,63,.09) 44px 88px,
    transparent 88px)
}

@media (prefers-reduced-motion: reduce){
  .mouth .ember{animation:none;opacity:.6}
}

/* 剖面圖上，那一趟蓋的東西站在那一層裡。
   深度是走出來的，蓋什麼是挑的——這是圖上唯一屬於「他們自己選的」東西。 */
.xs-bld{
  position:absolute;left:50%;bottom:3px;width:33px;height:33px;margin-left:-17px;
  padding:0;border:none;background:none;cursor:pointer;z-index:3
}
.xs-bld .px{width:33px;height:33px;image-rendering:pixelated}
.xs-bld:hover{filter:brightness(1.3)}

/* ── 你說的那一天 ──
   原始設計裡就有的一條虛線，一直沒做。它讓「我承諾了幾天」在畫面上
   有一個實體：線在前面，水從後面追上來。
   它不是終點線——每一組的線在不同的地方，因為那是各自說的。 */
.vow{
  position:absolute;top:0;bottom:0;width:3px;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(180deg,
    var(--gold) 0 6px, transparent 6px 14px)
}
.vow span{
  position:absolute;top:11px;left:6px;font-size:22px;color:var(--gold);
  white-space:nowrap;background:rgba(0,0,0,.55);padding:2px 5px
}

/* ── 任務清單 ──
   老師派過的每一件事，各自走到哪。數字靠右對齊，因為「你說幾天」跟
   「實際幾天」是要被互相比較的——這一頁順便就是他們自己的估算史。 */
.tk-list{display:flex;flex-direction:column}
.tk{padding:14px 0;border-bottom:2px solid rgba(0,0,0,.16)}
.tk:last-child{border-bottom:0}
.tk-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tk-h b{font-size:22px;font-weight:400;line-height:33px;color:var(--ink)}
.tk-s{
  flex:0 0 auto;font-size:22px;font-style:normal;padding:2px 8px;
  color:var(--mute);background:var(--sunk);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)
}
.tk-s.go{color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-d)}
.tk-s.ok{color:#7FA866;box-shadow:inset 0 0 0 2px rgba(127,168,102,.5)}

.tk-n{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.tk-n span{font-size:22px;color:var(--dim)}
.tk-n b{font-size:22px;font-weight:400;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-right:11px}
.tk-n b.late{color:var(--over)}
.tk-n .tk-u{margin-left:-8px}

/* 岩心掛在它自己那一趟旁邊——它終於有出處了。 */
.tk-k{display:flex;align-items:center;gap:9px;margin-top:9px}
.tk-k .core{height:22px;width:auto;image-rendering:pixelated}
.tk-k span{font-size:22px;color:var(--dim)}

/* ── 那一閃 ──
   同一張圖用全白的配色再畫一次疊在上面，然後淡出。
   用一塊白色方塊蓋上去會變成方形的閃光，那不是剪影。 */
.pxflash{
  position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none;z-index:5;image-rendering:pixelated;
  animation:pxfl .45s steps(3,end) 1 forwards
}
@keyframes pxfl{0%{opacity:1}55%{opacity:.55}100%{opacity:0}}
.pxwrap{position:relative;display:inline-block;flex:0 0 auto}
.bt-ch{position:absolute}

/* ── 紀錄 ──
   一列一趟：牠在最左邊、資訊在右邊、點開才看細節。
   本來每一趟是一張攤開的大卡，五六趟之後整頁要捲很久，而且每一張長得
