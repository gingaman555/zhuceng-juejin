/* ---------- 一組看得到哪些里程碑 ---------- */
function msFor(teamId) {
  var t = teamOf(teamId);
  if (!t) return [];
  return where('Milestones', function (m) {
    return m.classId === t.classId && (!m.teams.length || m.teams.indexOf(teamId) >= 0);
  });
}

/* 這一組的所有 run，照派發時間排 */
function runsFor(teamId) {
  return msFor(teamId).map(function (m) {
    var r = runOf(teamId, m.msId);
    if (!r) {
      /* 派了但還沒承諾——先給一個空的，畫面才知道要問滑桿 */
      r = { runId: null, teamId: teamId, msId: m.msId, state: 'fresh',
            est: 0, flags: [], pushes: 0, overs: [], steps: [], keep: null };
    }
    return { ms: m, run: r };
  }).sort(function (a, b) { return a.ms.at - b.ms.at; });
}

/* ---------- 這一組現在該做什麼 ----------
   一次只回答一件事。首頁只給一個動作，其餘都是資訊。 */
function nextThing(teamId) {
  /* 已經走出去的組不再有下一件事。這不是鎖住畫面——
     他們還看得到留下的、全班地下城、紀錄，只是不再被派任務。 */
  var tm = teamOf(teamId);
  if (tm && tm.leftAt) return { kind: 'left' };
  if (tm && tm.exitAsk) return { kind: 'waitexit' };

  var rows = runsFor(teamId);
  /* 1. 判定失準、還沒復盤 */
  var camp = rows.filter(function (x) {
    return x.run.state === 'judged' && x.run.stamp === 'late' && !(x.run.overs || []).length;
  })[0];
  if (camp) return { kind: 'camp', row: camp };
  /* 2. 老師勾可以了，還沒挑裝備 */
  var gear = rows.filter(function (x) { return x.run.state === 'approved'; })[0];
  if (gear) return { kind: 'gear', row: gear };
  /* 3. 派了但還沒承諾 */
  var fresh = rows.filter(function (x) { return x.run.state === 'fresh'; })[0];
  if (fresh) return { kind: 'commit', row: fresh };

  /* 4. 正在做。

     這裡本來有三個狀態：叫醒（幾天沒按）、今天還沒按、今天按過了。
     那三個都在催他每天開一次。拿掉了——他開始之前來說幾天，
     做完回來交，中間不用開。

     過了自己說的天數，畫面會暗、水會漫過來（見 stallOf），
     但那不是一件「要他去處理」的事，它只是狀態，所以不排進這裡。 */
  var wait = rows.filter(function (x) { return x.run.state === 'running'; })[0];
  if (wait) return { kind: 'doing', row: wait };
  var sent = rows.filter(function (x) { return x.run.state === 'submitted'; })[0];
  if (sent) return { kind: 'review', row: sent };
  return { kind: 'idle', row: null };
}

function pushedToday(teamId, runId) {
  if (!runId) return false;
  var d = dayOf(now());
  return !!find('Pushes', function (p) {
    return p.teamId === teamId && p.runId === runId && p.day === d;
  });
}

/* 這一個 run 最後一次推進是什麼時候 */
/* 這一趟動過的最後一天。標日子的時候會用到。 */
function lastPush(runId) {
  var ps = where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  });
  return ps.length ? ps[ps.length - 1].at : 0;
}

/* 這一組現在的光。

   本來看「幾天沒有按推進」。學生不必每天開了之後，那個數字算不出來，
   而且它本來就把「有沒有開 app」跟「有沒有在做事」混為一談。

   改成看行事曆：過了自己說的天數，畫面就開始暗。
   那個數字是他自己說的，不是我規定的期限；而且系統不用問任何人
   就知道今天是幾號。他不開，它也在走。 */
function stallOf(teamId) {
  var cur = runsFor(teamId).filter(function (x) { return x.run.state === 'running'; })[0];
  if (!cur) return { level: 0, days: 0 };
  var est = cur.run.est || 1;
  var gone = daysBetween(cur.run.committedAt, now());
  var over = gone - est;
  if (over >= RULES.band(est) + 1) return { level: 2, days: over };
  if (over > 0) return { level: 1, days: over };
  return { level: 0, days: 0 };
}

/* 深度＝完成過幾個里程碑。沒有終點。 */
function depthOf(teamId) {
  return where('Runs', function (r) {
    return r.teamId === teamId && r.state === 'done';
  }).length;
}

/* 廊道口掛的那塊牌子。

   本來它有三階材質，走得越深牌子越好。拿掉了——深度已經不是進度
   （路是隨機給的，而且一直循環），留著一個「越多越好」的漸層
   跟其他每一條規則都打架。

   它現在只有一個用途，而且那個用途一直都在：廊道口掛的是誰。
   上面寫什麼是他們自己決定的。 */
function signOf(teamId) {
  return SIGNS.iron;
}

/* 這一組的預估準度紀錄——復盤與老師審閱都要看 */
function accuracyOf(teamId) {
  var done = where('Runs', function (r) {
    return r.teamId === teamId && r.stamp;
  });
  var n = { early: 0, exact: 0, late: 0 };
  done.forEach(function (r) { n[r.stamp] = (n[r.stamp] || 0) + 1; });
  return { total: done.length, early: n.early, exact: n.exact, late: n.late, rows: done };
}

/* ---------- 全班生態 ----------
   沒有名次。只有「誰在哪一條廊道、走到多深、現在是什麼狀態」。 */
function ecology(classId) {
  return where('Teams', function (t) { return t.classId === classId; }).map(function (t) {
    var st = stallOf(t.teamId);
    var cur = runsFor(t.teamId).filter(function (x) { return x.run.state === 'running'; })[0];
    return {
      teamId: t.teamId, name: t.name,
      depth: depthOf(t.teamId),
      stall: st.level,
      status: statusOf(t.teamId),
      /* 正在打的那一隻，跟走到哪 */
      onMs: cur ? cur.ms.title : '',
      at: cur ? RULES.progress(cur.run.pushes, cur.run.est) : 0,
      sign: signOf(t.teamId).key
    };
  });
}

/* ================= 學生的動作 ================= */

/* 承諾：拉滑桿決定幾天，順便標「哪幾段我覺得會比想的久」。
   標的是老師分的段，不是我列的八種卡關原因。 */
function actCommit(teamId, msId, est, flags) {
  var r = runOf(teamId, msId);
  if (r) return r;
  r = {
    runId: nid('R'), teamId: teamId, msId: msId,
    state: 'running',
    est: clamp(RULES.EST_MIN, RULES.EST_MAX, Number(est) || RULES.EST_DEFAULT),
    flags: flags || [],
    committedAt: now(),
    pushes: 0, overs: [], steps: [], keep: null, stamp: null,
    /* 擋在廊道盡頭的是哪一隻，承諾那一刻就決定並存下來。
       本來是每次要用再算一次，而算的時候看的是「現在」的深度——
       所以走深了之後回頭看，過去每一趟遇到的那一隻會跟著變。
       那是假的紀錄。 */
    mob: mobFor(msId, teamId).n
  };
  DB.Runs.push(r);
  save();
  logEvent('commit', { teamId: teamId, runId: r.runId, msId: msId, est: r.est,
    flags: (r.flags || []).map(function (i) { return stepName(r.runId, i); }).join('、') });
  return r;
}

/* 推進：一天一次。回傳有沒有真的推到。 */
/* 推進。

     step  今天動的是老師分的第幾段（沒分段就是 -1）
     back  補登幾天前。0 是今天，1 是昨天，最多到 2。

   補登這件事看起來像作弊，其實相反：實際天數是從承諾那天到交出去
   那天算的，補登一格不會讓誰早一天完成，也不會改判定。它唯一改變的
   是走廊上少不少一盞燈——而「忘了按一天就再也補不回來」正是
   讓人整條放棄的那個崖。 */
function actPush(teamId, runId, step, back) {
  return logDay(teamId, runId, 'move', step, back);
}

/* 今天沒有動。

   跟推進一樣是一下點擊，一樣一天一次。差別在它不會讓畫面變亮，
   也不會讓停滯計時歸零——說實話不用付代價，但也買不到任何東西。
   剛好是這樣，才沒有說謊的理由。

   它唯一給的是：之後回頭看，那一天是「我說我沒動」，不是一個空格。 */
function actRest(teamId, runId, back) {
  return logDay(teamId, runId, 'rest', -1, back);
}

function logDay(teamId, runId, kind, step, back) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return false;
  var b = Math.max(0, Math.min(RULES.BACKFILL_MAX, Number(back) || 0));
  var when = now() - b * DAY;
  if (when < r.committedAt) return false;      /* 承諾之前的日子不算 */
  if (pushedOn(teamId, runId, dayOf(when))) return false;
  DB.Pushes.push({
    pushId: nid('P'), teamId: teamId, runId: runId, kind: kind,
    day: dayOf(when), at: when, step: (step == null ? -1 : step), back: b
  });
  /* pushes 只算真的動過的天數。判定不看它，但畫面看得到。 */
  if (kind === 'move') r.pushes++;
  save();
  logEvent(kind === 'move' ? 'push' : 'rest', {
    teamId: teamId, runId: runId, n: r.pushes,
    seg: kind === 'move' ? stepName(runId, step) : '', back: b
  });
  return true;
}

/* 勾掉／取消勾掉一段。隨時可以改——勾錯了不該是一件要去求人的事。 */
function actTickStep(teamId, runId, i) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.steps = r.steps || [];
  var k = r.steps.indexOf(i);
  if (k < 0) r.steps.push(i); else r.steps.splice(k, 1);
  save();
  var m = msOf(r.msId);
  logEvent('tick', {
    teamId: teamId, runId: runId,
    step: (m && m.steps && m.steps[i]) || '',
    on: k < 0 ? 1 : 0
  });
  return r;
}

/* 這一趟勾了幾段。沒有分段的里程碑回 null——
   沒有的東西不要畫成 0/0，那看起來像什麼都沒做。 */
function stepsOf(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  var m = msOf(r.msId);
  if (!m || !m.steps || !m.steps.length) return null;
  return { all: m.steps, on: r.steps || [] };
}

/* 這一個 run 在某一天推過了沒 */
function pushedOn(teamId, runId, day) {
  return !!find('Pushes', function (p) { return p.runId === runId && p.day === day; });
}

/* 最近幾天裡，哪幾天還沒按。回傳 [{back, label}]，只看承諾之後的日子。 */
function openDays(teamId, runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var out = [];
  for (var b = 1; b <= RULES.BACKFILL_MAX; b++) {
    var when = now() - b * DAY;
    if (when < r.committedAt) break;
    if (!pushedOn(teamId, runId, dayOf(when))) {
      out.push({ back: b, label: b === 1 ? '昨天' : '前天' });
    }
  }
  return out;
}

/* 標／取消標「那一天我動過」。

   每天要按的那一版拿掉之後，這一份資料改成在交出去那一頁一次補齊。
   i 是從承諾那天算起的第幾天（0 起算）。

   它不進判定——判定只看承諾幾天與行事曆過了幾天——所以標不標、
   標得準不準都不會改變任何結果，也因此沒有說謊的理由。 */
function actMarkDay(teamId, runId, i) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return false;
  var when = r.committedAt + i * DAY;
  if (when > now() + DAY) return false;
  var day = dayOf(when);
  var has = find('Pushes', function (p) { return p.runId === runId && p.day === day; });
  if (has) {
    DB.Pushes = DB.Pushes.filter(function (p) {
      return !(p.runId === runId && p.day === day);
    });
  } else {
    DB.Pushes.push({
      pushId: nid('P'), teamId: teamId, runId: runId, kind: 'move',
      day: day, at: when, step: -1, back: 0
    });
  }
  r.pushes = where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  }).length;
  save();
  logEvent('mark', { teamId: teamId, runId: runId, n: r.pushes });
  return true;
}

/* 這一趟的日誌。一格一天，從承諾那一天算起。

   本來這裡回的是「按過的那幾次」，所以沒按的日子根本不存在——
   看起來就像這一趟還沒開始。改成照日曆排之後，缺席看得見了。
   那不是指控，是把形狀畫出來。

   每一格三種：
     {kind:'move', step}  來過，動的是第幾段
     {kind:'rest'}        他自己說那一天沒動
     null                 沒有紀錄 */
function dayLog(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var end = r.submittedAt || now();
  var span = Math.max(r.est || 1, daysBetween(r.committedAt, end) + 1);
  span = Math.min(span, 60);
  var byDay = {};
  where('Pushes', function (p) { return p.runId === runId; }).forEach(function (p) {
    byDay[p.day] = { kind: p.kind || 'move', step: p.step == null ? -1 : p.step };
  });
  var out = [];
  for (var i = 0; i < span; i++) {
    out.push(byDay[dayOf(r.committedAt + i * DAY)] || null);
  }
  return out;
}

/* 這一趟動過的那幾天分別是第幾段。keepOffers 用。 */
function stepIdxOfRun(runId) {
  return where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  }).sort(function (a, b) { return a.day - b.day; })
    .map(function (p) { return p.step == null ? -1 : p.step; });
}

/* ---------- 這一組現在是什麼狀態 ----------

   本來只有四種，而且全部從「幾天沒推進」推出來：
     ≥4 天 休息中／≥2 天 慢下來了／否則 前進中／沒任務 等派任務

   有兩個問題。

   一 · 「休息中」現在是錯的字。系統有了「今天沒有動」那顆鍵之後，
        休息變成他真的會宣告的狀態；而這個標籤講的是「四天沒推進」，
        兩件事撞在同一個字上。

   二 · 更要緊的：老師分不出「他說他沒動」跟「他完全沒有消息」。
        那是兩種完全不同的處境——一個誠實地卡住，要找他談；
        一個可能整個不見了，要找的是別的東西。系統其實知道差別
        （rest 那幾筆），只是畫面沒有用上。

   所以狀態改成看兩件事：多久沒推進、那幾天他有沒有回報。
   系統只陳述，不評價——「沒有消息」講的是紀錄，不是那一組的人。 */
function statusOf(teamId) {
  var cur = runsFor(teamId).filter(function (x) { return x.run.state === 'running'; })[0];
  if (!cur) return { key: 'idle', label: '等派任務', days: 0 };

  var st = stallOf(teamId);
  if (st.level === 0) return { key: 'move', label: '前進中', days: st.days };

  /* 沒推進的那幾天裡，他有沒有說過「今天沒有動」 */
  var log = dayLog(cur.run.runId);
  var tail = log.slice(Math.max(0, log.length - st.days));
  var told = false;
  tail.forEach(function (d) { if (d && d.kind === 'rest') told = true; });

  if (!told) return { key: 'quiet', label: '沒有消息', days: st.days };
  return st.level >= 2
    ? { key: 'stop', label: '他說在停', days: st.days }
    : { key: 'slow', label: '慢下來了', days: st.days };
}

/* 這一趟擋路的是哪一隻。舊資料沒存就當場算一次。 */
function mobOfRun(run) {
  if (run && run.mob) {
    var c = faunaByName(run.mob);
    if (c) return c;
  }
  return mobFor(run.msId, run.teamId);
}

/* 這一組遇過的那幾隻。全部看得到，這裡只是標出「你遇過」。 */
function metMobs(teamId) {
  var seen = {};
  runsFor(teamId).forEach(function (x) {
    if (!x.run.est) return;
    var m = mobOfRun(x.run);
    if (m) seen[m.n] = x.ms.title;
  });
  return seen;
}

/* 這一趟的形狀：承諾幾天、過了幾天、來過幾天、說沒動幾天、勾了幾段。
   老師看得到這個。系統不說任何一句判斷——它只把數字擺出來。 */
function runShape(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  var lg = dayLog(runId);
  var sp = stepsOf(runId);
  return {
    est: r.est,
    elapsed: lg.length,
    moved: lg.filter(function (d) { return d && d.kind === 'move'; }).length,
    rested: lg.filter(function (d) { return d && d.kind === 'rest'; }).length,
    blank: lg.filter(function (d) { return !d; }).length,
    steps: sp ? sp.on.length : null,
    stepsAll: sp ? sp.all.length : null
  };
}

/* 今天班上有幾條廊道今天也有人在走。
   這不是名次——它不排序、不比大小，只回答「今天只有我一個人在下面嗎」。 */
function todayMovers(classId, exceptTeam) {
  var day = dayOf(now());
  var seen = {};
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    if (t.teamId === exceptTeam) return;
    if (find('Pushes', function (p) { return p.teamId === t.teamId && p.day === day; })) {
      seen[t.teamId] = 1;
    }
  });
  return Object.keys(seen).length;
}

/* 上傳：走到終點之後交出去。判定就在這一刻。 */
function actSubmit(teamId, runId, link) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return null;
  r.actual = Math.max(1, daysBetween(r.committedAt, now()));
  r.stamp = RULES.judge(r.est, r.actual).key;
  r.link = link || '';
  r.submittedAt = now();
  r.state = 'judged';
  save();
  logEvent('submit', { teamId: teamId, runId: runId, est: r.est, actual: r.actual, stamp: r.stamp });
  return r;
}

/* 復盤：點圖示標籤說明卡在哪。只有失準的時候會走到。 */
function actReflect(teamId, runId, overs) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.overs = overs || [];
  r.state = 'submitted';        /* 說完才排進老師的審核清單 */
  save();
  logEvent('reflect', { teamId: teamId, runId: runId,
    overs: (overs || []).map(function (i) { return stepName(runId, i); }).join('、') });
  return r;
}

/* 準時的直接排進老師的雷達，不用復盤 */
function actSkipCamp(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.state = 'submitted';
  save();
  return r;
}

/* 「領裝備」那一步併進 actPickGear 了：挑完就是領完，不用再按一次。 */

/* ================= 老師的動作 ================= */

/* 派一個里程碑。teams 空陣列＝全班。 */
/* 老師派一個里程碑。steps 是他自己分的段，選填。

   分段是老師寫的，不是系統列的——這跟「系統不定義他們在做什麼」
   不衝突：老師是人，而且那是他出的題目。系統只負責記住哪幾段被勾了。

   勾一段跟每天推進是兩件事，不要混：推進是「今天我來過」（一天一次），
   勾是「這一段做完了」（隨時，幾段都可以）。兩件事都不影響判定——
   判定從頭到尾只看承諾幾天與實際幾天。 */
function actPublish(classId, o) {
  var m = {
    msId: nid('M'), classId: classId,
    title: o.title, note: o.note || '',
    steps: (o.steps || []).slice(0, 12),
    teams: o.teams || [],
    at: now()
  };
  DB.Milestones.push(m);
  save();
  logEvent('publish', { title: m.title, teams: (m.teams || []).length,
    steps: (m.steps || []).length });
  return m;
}

/* ---------- 全班怎麼看這一個里程碑 ----------

   同一個里程碑，別人說要花幾天。匿名，只回天數，不回是誰——
   要的是「我是不是低估了」，不是「誰比較快」。

   兩組以下不給看：三組的時候剩下那兩個數字誰是誰，猜得出來。 */
function estSpread(msId, exceptTeam) {
  var days = where('Runs', function (r) {
    return r.msId === msId && r.est && r.teamId !== exceptTeam;
  }).map(function (r) { return r.est; });
  if (days.length < 2) return null;
  days.sort(function (a, b) { return a - b; });
  return {
    n: days.length,
    lo: days[0],
    hi: days[days.length - 1],
    mid: days[Math.floor(days.length / 2)],
    all: days
  };
}

/* 這一個班有沒有開排行榜。預設關。 */
function rankOn(classId) {
  var c = find('Classes', function (x) { return x.classId === classId; });
  return !!(c && c.rank);
}

function actSetRank(classId, on) {
  var c = find('Classes', function (x) { return x.classId === classId; });
  if (!c) return null;
  c.rank = !!on;
  save();
  logEvent('rank', { on: c.rank ? 1 : 0 });
  return c;
}

/* 老師的雷達：誰交了、等多久了 */
function radar(classId) {
  var out = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    runsFor(t.teamId).forEach(function (x) {
      if (x.run.state !== 'submitted') return;
      out.push({
        team: t, run: x.run, ms: x.ms,
        waited: daysBetween(x.run.submittedAt, now())
      });
    });
  });
  return out.sort(function (a, b) { return b.waited - a.waited; });
}

/* 老師勾「可以」。他不選裝備——選哪一件是學生的事。
   他能加一句話，那句話才是他的回饋。 */
function actApprove(runId, word) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'submitted') return null;
  r.word = word || '';
  r.state = 'approved';
  r.approvedAt = now();
  save();
  logEvent('approve', { teamId: r.teamId, runId: runId, len: String(word || '').length });
  return r;
}

/* 封存一根岩心。

   本來這裡是「三張裡挑一張」，那三張全是他兩秒前才看過的數字——
   挑一張等於挑「等一下要再看到哪一個你已經知道的事」。
   沒有新資訊、沒有意外，而且挑錯沒代價、挑對沒好處。

   現在：那一趟的紀錄長成一根岩心（見 43-core.js），
   形狀完全由那一趟決定。那是同一份資料的一個他沒見過的形狀，
   所以真的有東西可看。名字選填——他不取，它一樣存得下來。

   存的是當下算出來的像素圖與數字，不是 runId 的一個指標：
   規則以後改了，他封存的那一根不會跟著變成別的樣子。 */
function actSeal(runId, name) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'approved') return null;
  var s = runShape(runId);
  r.state = 'done';
  r.doneAt = now();
  r.coreName = String(name || '').trim().slice(0, 16);
  DB.Keeps.push({
    keepId: nid('K'), teamId: r.teamId, runId: runId,
    name: r.coreName, at: now(),
    /* 當時在哪一層。架子上那一排的顏色就是他走過的地層。 */
    zone: strataAt(depthOf(r.teamId), r.teamId).key,
    px: coreOf(runId),
    est: s.est, elapsed: s.elapsed, moved: s.moved,
    rested: s.rested, blank: s.blank
  });
  save();
  logEvent('seal', { teamId: r.teamId, runId: runId, name: r.coreName });
  return r;
}

/* 改寫專案名稱。這是學生自己做的——招牌上寫什麼是他們的事，
   老師不替他們命名。改名字不會動到招牌的材質（那個吃深度）。 */
function actRename(teamId, name) {
  var t = teamOf(teamId);
  if (!t) return null;
  if (String(t.project || '') === String(name)) return null;
  var old = t.project;
  t.project = name;
  save();
  logEvent('rename', { teamId: teamId, name: name, from: old });
  return t;
}

/* ---------- 這一趟的段 ----------

   本來這裡是那一組自己寫的一份清單。老師開始分段之後，那份清單就
   多餘了——分段是老師寫的，是這一次的題目本身，而且不用先做設定。
   這個系統要能在專案中途才開始用，多一道「先寫清單」等於多一道門。

   系統一樣沒有定義任何東西：那幾個字是老師打的。 */
function stepNames(runId) {
  var s = stepsOf(runId);
  return s ? s.all : [];
}

function stepName(runId, i) {
  var a = stepNames(runId);
  return a[i] == null ? '' : a[i];
}

/* 這一組留下過的那些話 */
function keepsOf(teamId) {
  return where('Keeps', function (g) { return g.teamId === teamId; });
}

/* ---------- 出口 ----------

   往下走不出去：六層是隨機給的，而且一直循環（見 13-strata.js）。
   唯一的出口是把手上這個專案做完。

   兩件事要說清楚，因為很容易做歪：

   一 · 「做完了」不是系統算出來的。系統不知道他們的專案有幾件事、
        也不知道走到哪——尤其這個系統本來就要能在專案進行到一半的時候
        才開始用。所以是他們自己宣告，老師確認。

   二 · 開門的條件只有「做完了」，不是「估得夠準」。一旦準度變成門檻，
        系統就在判定他規劃得夠不夠好，那是這個作品從頭到尾拒絕做的事。
        準度決定的是走出去的時候帶著什麼——同一道門，不同的故事。
        check.js 有一條在守這件事。 */
function actAskExit(teamId) {
  var t = teamOf(teamId);
  if (!t || t.leftAt) return null;
  t.exitAsk = now();
  save();
  logEvent('askexit', { teamId: teamId });
  return t;
}

function actCancelExit(teamId) {
  var t = teamOf(teamId);
  if (!t || t.leftAt) return null;
  t.exitAsk = 0;
  save();
  return t;
}

/* 老師確認。他寫的那一句會留在出口那一頁上。 */
function actLetGo(teamId, word) {
  var t = teamOf(teamId);
  if (!t || !t.exitAsk || t.leftAt) return null;
  t.leftAt = now();
  t.exitWord = word || '';
  t.exitAsk = 0;
  save();
  logEvent('left', { teamId: teamId });
  return t;
}

/* 走出去的時候帶著的東西。全部是他們自己的紀錄，沒有一項是評分。 */
function exitRecord(teamId) {
  var runs = runsFor(teamId).filter(function (x) { return x.run.stamp; });
  var acc = accuracyOf(teamId);
  var d = depthOf(teamId);
  var zones = {};
  for (var i = 0; i < d; i++) zones[strataAt(i, teamId).key] = 1;
  return {
    runs: runs, acc: acc, depth: d,
    cycles: cycleAt(d),
    zones: STRATA.filter(function (z) { return zones[z.key]; }),
    keeps: keepsOf(teamId),
    days: where('Pushes', function (p) { return p.teamId === teamId; }).length
  };
}

/* 等著老師確認出口的那幾組 */
function exitQueue(classId) {
  return where('Teams', function (t) {
    return t.classId === classId && t.exitAsk && !t.leftAt;
  });
}

/* 這一趟的三個角度。本來是「攤開三張挑一張」，那個動作拿掉了
   （見 actSeal）；這三句話留著，因為它們是承諾那一頁要給他看的
   ——他自己上一趟的事實，在他要決定下一趟花幾天的那一刻。 */
function keepOffers(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var out = [];

  /* 一 · 這幾天你在做什麼 */
  var ids = stepIdxOfRun(runId).filter(function (i) { return i >= 0; });
  var n = {}, top = null;
  ids.forEach(function (i) { n[i] = (n[i] || 0) + 1; if (top === null || n[i] > n[top]) top = i; });
  var topName = top === null ? '' : stepName(runId, top);
  out.push({
    key: 'days',
    line: topName
      ? '這 ' + r.pushes + ' 天裡，有 ' + n[top] + ' 天你動的是「' + topName + '」。'
      : '這一趟你來了 ' + r.pushes + ' 天。'
  });

  /* 二 · 你估得怎麼樣。只有兩個數字跟一段算出來的範圍。 */
  var b = RULES.band(r.est);
  out.push({
    key: 'est',
    line: '你估 ' + r.est + ' 天，走了 ' + r.actual + ' 天。' +
          '你自己說的範圍是 ' + Math.max(1, r.est - b) + ' 到 ' + (r.est + b) + ' 天。'
  });

  /* 三 · 哪一件比你想的久。這是他們在營火自己說的。 */
  var ov = (r.overs || []).map(function (i) { return stepName(runId, i); })
    .filter(Boolean);
  var fl = r.flags || [];
  var hit = (r.overs || []).filter(function (id) { return fl.indexOf(id) >= 0; });
  out.push({
    key: 'over',
    line: ov.length
      ? '你說「' + ov.join('」「') + '」比你想的久。' +
        (hit.length ? '承諾的時候你就標了它。' : '承諾的時候你沒有標到它。')
      : '這一趟你沒有說哪一件比想的久。'
  });

  return out;
}


/* ===== 43-core.js ===== */
/* 岩心。

   一趟走完會長出一根岩心——像地質學家從地底抽出來的那種柱狀樣本。
   它不是我發的東西，是那一趟自己長出來的：形狀完全由那一趟的紀錄決定。

   為什麼是這個形式，而不是一個徽章或一件裝備：

   空的收集是一格一格長得一樣，靠重複填滿，價值只有「我有」。
   有意義的收集要滿足幾件事，而這個系統裡剛好有一個東西全部滿足——
   每一趟的日誌：

     一 · 它指向一個具體、不會再發生的事件。這根岩心就是那一週。
     二 · 它的樣子因人而異，而且那個不同是他自己造成的。
     三 · 不可能再拿到同一根——不是機率低，是那一週只發生過一次。
     四 · 它掛在該在的地方（自己的廊道、全班剖面圖），不是躺在道具欄。
     五 · 二十根排在一起，會變成一根說不出來的東西：一個學期的形狀。

   怎麼長：一天兩列，由上往下。

     來過        實心，中間一道亮
     說了沒動    空心，兩邊的壁還在
     沒有紀錄    斷的，只剩碎屑

   長度＝這一趟過了幾天。三天是一小截，十五天是一長條——
   所以架子上一眼看得出哪一趟是硬仗。

   刻意不編進去的東西：判定（🎯🚀❌）。
   那是全班剖面圖上別人也看得到的地方，把「估不準」編進形狀等於讓它
   變成一個公開的記號。判定只出現在他自己那幾頁上。 */

var CORE_W = 14;

/* 一根岩心的像素圖。純函式——同一趟每次算出來都一樣。 */
function coreOf(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  var log = dayLog(runId);
  if (!log.length) log = [null];
  var days = Math.min(log.length, 26);

  var px = [];
  px.push('..++++++++++..');          /* 上蓋 */
  px.push('.+##########+.');

  for (var i = 0; i < days; i++) {
    var d = log[i];
    if (d && d.kind === 'move') {
      px.push('.+#*######*#+.');
      px.push('.+##########+.');
    } else if (d && d.kind === 'rest') {
      px.push('.+#+......+#+.');
      px.push('.+#+......+#+.');
    } else {
      px.push('.+#..+..+..#+.');
      px.push('.+..+..+..+..');
    }
  }

  px.push('.+##########+.');
  px.push('..++++++++++..');
  return px;
}

/* 這一趟的岩心長什麼顏色：他當時在哪一層。 */
function corePal(run) {
  var z = null;
  STRATA.forEach(function (x) { if (x.key === run.zone) z = x; });
  return (z || strataAt(0, run.teamId)).pal;
}

/* 一根岩心的說明：長度、來過幾天、缺了幾天。
   全部是數字，一句判斷都沒有。 */
function coreFacts(runId) {
  var s = runShape(runId);
  if (!s) return null;
  return s;
}

    est: 8, flags: [0], overs: [], pushes: 3, committedAt: ago(14) });
  pushes('G3', 'R7', 3, 12);   /* 最後一次在 12 天前 → 睡著 */

  /* ---------- G4 丁：交出去了，在等老師 ---------- */
  DB.Runs.push({ runId: 'R8', teamId: 'G4', msId: 'M1', state: 'done',
    est: 5, actual: 5, stamp: 'exact', flags: [], overs: [], pushes: 5,
    committedAt: ago(24), submittedAt: ago(19), doneAt: ago(18),
    word: '你們承諾的時候就標了整理逐字稿。' });
  pushes('G4', 'R8', 5, 23);

  DB.Runs.push({ runId: 'R9', teamId: 'G4', msId: 'M2', state: 'submitted',
    est: 6, actual: 6, stamp: 'exact', flags: [1], overs: [], pushes: 6,
    committedAt: ago(14), submittedAt: ago(2) });
  pushes('G4', 'R9', 6, 13);

  /* ---------- G5 戊：什麼都還沒承諾 ---------- */
  /* 刻意留白：三個里程碑都派了，一個都沒拉滑桿。
     系統要看得出這一組跟「在動但卡住」的不一樣。 */

  /* 封存過的岩心。直接用 coreOf 算一次，跟真的走完一趟長出來的一模一樣。 */
  [['G1', 'R1', '訪談那一週', 17], ['G1', 'R2', '收斂', 10], ['G2', 'R4', '拖到最後', 14],
   ['G3', 'R6', '', 16], ['G4', 'R8', '逐字稿地獄', 18]].forEach(function (k, i) {
    var sh = runShape(k[1]);
    if (!sh) return;
    var r = find('Runs', function (x) { return x.runId === k[1]; });
    if (r) r.coreName = k[2];
    DB.Keeps.push({ keepId: 'K0' + (i + 1), teamId: k[0], runId: k[1],
      name: k[2], at: ago(k[3]),
      zone: strataAt(depthOf(k[0]), k[0]).key,
      px: coreOf(k[1]),
      est: sh.est, elapsed: sh.elapsed, moved: sh.moved,
      rested: sh.rested, blank: sh.blank });
  });
  DB.Config.seq = 100;
  save();
}


/* ===== 55-ui.js ===== */
/* 畫面的底：字串拼 HTML、一個路由、一次重畫。

   沒有覆寫層，也沒有模板補丁——每一個畫面就是一支函式，
   改一句話只要改一個地方。 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

/* 一開始沒有人登入。S.who 是 null 的時候只走得到門口那幾頁。 */
var S = { who: null, page: 'gate', p: {}, flash: null };

/* 沒按送出的東西不會進資料表，但重畫的時候要留著。 */
var DRAFT = {};
function draft(id, fallback) { return DRAFT[id] != null ? DRAFT[id] : (fallback || ''); }

function go(page, p) {
  if (typeof stopAnim === 'function') stopAnim();
  S.page = page; S.p = p || {}; S.flash = null; DRAFT = {};
  window.scrollTo(0, 0);
  render();
}
function me() { return S.who ? userOf(S.who) : null; }
function isTeacher() { var u = me(); return !!u && u.role === 'teacher'; }
function myTeam() { var u = me(); return u ? teamOf(u.teamId) : null; }

/* 哪一種身分走得到哪一頁。

   這不是裝飾。研究者看得到全班的紀錄、老師看得到別組的進度——
   路由如果不擋，改一下網址就變成別人。 */
var GATE_PAGES = { gate: 1, login: 1, reg: 1 };
var PAGE_ROLE = {
  home: 'student', commit: 'student', submit: 'student', stamp: 'student',
  camp: 'student', pick: 'student', dash: 'student', eco: 'student', pack: 'student',
  exit: 'student', codex: 'student',
  log: 'student', claim: 'student',
  radar: 'teacher', review: 'teacher', ms: 'teacher', classeco: 'teacher',
  rs: 'researcher', roster: 'researcher', events: 'researcher'
};
function allowed(u, page) {
  var need = PAGE_ROLE[page];
  return !need || need === u.role;
}

function head(eyebrow, title, lead) {
  return '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p class="lead">' + nl(lead) + '</p>' : '');
}

/* 一條「你在第幾步」。

   加這個是因為第一次打開會不知道要做什麼：畫面很乾淨，但乾淨到看不出
   自己站在哪。它不是教學，是位置——亮著的那一格就是現在輪到你的。

     steps  [[標題, 副標], …]
     at     現在在第幾格（0 起算；-1 代表都不在） */
function stepBar(steps, at) {
  var H = ['<div class="steps">'];
  steps.forEach(function (s, i) {
    H.push('<div class="step' + (i === at ? ' on' : (i < at ? ' past' : '')) + '">' +
      '<b>' + (i + 1) + '</b>' +
      '<div><i>' + esc(s[0]) + '</i>' + (s[1] ? '<em>' + esc(s[1]) + '</em>' : '') + '</div>' +
      '</div>');
  });
  H.push('</div>');
  return H.join('');
}

/* 像素圖標籤。所有的圖都走這一支——沒有第二種畫圖的方式。 */
function pxTag(px, pal, cls) {
  return '<img class="px ' + (cls || '') + '" src="' + pxSvg(px, pal, false) + '" alt="">';
}

/* 按鈕。act 是「動作:參數」的字串，全部收在 ACTS 裡。 */
function btn(label, act, kind) {
  return '<button class="btn ' + (kind || '') + '" data-act="run" data-p="' +
    esc(JSON.stringify({ a: act })) + '">' + esc(label) + '</button>';
}

/* ---------- 路由 ---------- */

var PAGES = {};

function render() {
  var u = me();

  /* 沒登入：只有門口那幾頁，而且沒有側欄也沒有頂條——
     還不知道你是誰的時候，畫面上不該有任何「你的」東西。 */
  if (!u) {
    if (!GATE_PAGES[S.page]) S.page = 'gate';
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES[S.page]() + '</div></div>';
    return;
  }

  /* 學生還沒對上名冊：先認領，別的哪裡都去不了。
     沒有組別的話，不知道要畫哪一條廊道——側欄跟頂條也一樣，
     它們每一格都在講「你的組」，這時候還沒有那個東西。 */
  if (u.role === 'student' && !u.teamId) {
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES.claim() + '</div></div>';
    S.page = 'claim';
    return;
  }
  if (S.page === 'claim' || GATE_PAGES[S.page]) S.page = homeFor(u);

  if (!PAGES[S.page] || !allowed(u, S.page)) S.page = homeFor(u);

  var body = PAGES[S.page]();
  document.getElementById('app').innerHTML =
    sideBar() + '<div class="main">' + topBar() + demoBar() +
    '<div class="wrap">' + (S.flash ? flashBar() : '') + body + '</div></div>';

  /* 走廊比視窗長的時候，重畫預設回到最左邊——那樣按完推進會看到
     走廊變了卻看不到自己動。鏡頭跟著人走。 */
  if (typeof scrollScene === 'function') scrollScene();
}

function flashBar() {
  return '<div class="flash">' + esc(S.flash) + '</div>';
}
/* say() 自己重畫。本來要記得先 say 再 render——順序寫反訊息就永遠不出現，
   而且那是一種只有測試才抓得到的錯。讓它自己負責。 */
function say(m) { S.flash = m; render(); }

/* 頂條右邊那一段。三種角色共用——登出在哪裡不該因為身分而不同，
   而且側欄在手機會變成底下那一列，放在那裡會被擠掉。 */
function topEnd() {
  return '<a class="plain" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'logout' })) + '\'>登出</a>';
}

function classOf(u) {
  return find('Classes', function (c) { return c.classId === u.classId; }) || DB.Classes[0] || { name: '' };
}

function topBar() {
  var u = me();
  if (u.role === 'researcher') {
    return '<div class="top">' +
      '<span class="badge r">研究者</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + DB.Users.length + ' 個帳號　·　' + DB.Classes.length + ' 個班　·　' +
        DB.Events.length + ' 筆紀錄</span>' + topEnd() +
      '</div>';
  }
  if (u.role === 'teacher') {
    var r = radar(u.classId);
    return '<div class="top">' +
      '<span class="badge t">老師端</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + esc(classOf(u).name) + '　·　' +
        where('Teams', function (t) { return t.classId === u.classId; }).length + ' 組</span>' +
      '<span>' + (r.length ? r.length + ' 件等你看' : '沒有等你的') + '</span>' + topEnd() +
      '</div>';
  }
  var t = myTeam();
  var st = stallOf(t.teamId);
  return '<div class="top">' +
    '<span class="badge">學生端</span>' +
    '<span class="who">' + esc(t.name) + '</span>' +
    '<span class="sp"></span>' +
    '<span>' + esc(t.project || '（還沒定）') + '</span>' +
    '<span class="' + (st.level ? 'warnx' : '') + '">深度 ' +
      (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</span>' + topEnd() +
    '</div>';
}

/* 試用列。真的上線沒有這一條——它在這裡只是為了讓你兩邊都走得完。 */
function demoBar() {
  var opts = DB.Users.map(function (u) {
    var t = u.teamId ? teamOf(u.teamId) : null;
    return '<option value="' + u.userId + '"' + (u.userId === S.who ? ' selected' : '') + '>' +
      esc(t ? t.name : u.name) + '</option>';
  }).join('');
  return '<div class="demo">' +
    '<b>試用</b><span>切換身分</span>' +
    '<select data-act="who">' + opts + '</select>' +
    '<span class="sp" style="flex:1"></span>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"forward"}\'>把時間往前推一天</a>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"reset"}\'>整班重來</a>' +
    '</div>';
}

function sideBar() {
  var u = me();
  var nav, headBlock;
  if (u.role === 'researcher') {
    headBlock = '<div class="side-head"><div class="k">LAB</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">帳號與紀錄</div></div>';
    nav = [['rs', '帳號'], ['roster', '名冊'], ['events', '紀錄']];
  } else if (u.role === 'teacher') {
    var kl = classOf(u);
    headBlock = '<div class="side-head"><div class="k">TEACHER</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">' + esc(kl.name) + ' · 加入碼 ' +
      esc(kl.joinCode) + '</div></div>';
    /* 老師只有三件事，側欄就只有三格——多一格就是多一件他要煩惱的事。 */
    var wait = radar(u.classId).length;
    nav = [
      ['radar', '審核' + (wait ? '（' + wait + '）' : '')],
      ['ms', '發里程碑'],
      ['classeco', '各組進度']
    ];
  } else {
    var t = myTeam();
    headBlock = '<div class="side-head"><div class="k">TUNNEL</div>' +
      '<div class="n">' + esc(t.name) + '</div>' +
      '<div class="s">' + esc(t.project || '（還沒定）') + '</div></div>';
    nav = [
      ['home', '廊道'], ['pack', '岩心架'], ['codex', '圖鑑'],
      ['eco', '全班地下城'], ['log', '紀錄']
    ];
  }
  var items = nav.map(function (n) {
    return '<a class="' + (S.page === n[0] ? 'on' : '') + '" data-go="' + n[0] + '">' +
      '<span class="dot"></span>' + esc(n[1]) + '</a>';
  }).join('');
  return '<div class="side">' + headBlock + '<div class="nav">' + items + '</div></div>';
}

/* ---------- 事件 ---------- */

document.addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go'), JSON.parse(g.getAttribute('data-p') || '{}')); return; }
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  if (act !== 'run') return;
  var p = JSON.parse(a.getAttribute('data-p') || '{}');
  runAct(p.a);
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest('[data-act="who"]');
  if (!a) return;
  S.who = a.value;
  DB.Session = S.who;
  save();
  S.page = homeFor(userOf(S.who));
  /* 上一個人的訊息不要跟著換身分過去——那句話不是講給這個人聽的 */
  S.flash = null;
  DRAFT = {};
  render();
});

/* 動作字串：「名稱」或「名稱:參數」 */
function runAct(str) {
  var i = String(str || '').indexOf(':');
  var name = i < 0 ? str : str.slice(0, i);
  var arg = i < 0 ? '' : str.slice(i + 1);
  var f = ACTS[name];
  if (f) f(arg);
}

var ACTS = {
  forward: function () { CLOCK += DAY; render(); },
  reset: function () { seed(); S.who = 'U1'; go('home'); },

  go: function (arg) {
    var i = arg.indexOf(':');
    if (i < 0) return go(arg);
    go(arg.slice(0, i), { id: arg.slice(i + 1) });
  },

  /* 滑桿：只改草稿，不進資料表 */
  est: function (v) { DRAFT.est = v; render(); },

  /* 承諾的時候標「這一件我覺得會比想的久」 */
  flag: function (k) {
    DRAFT.flags = DRAFT.flags || [];
    var i = DRAFT.flags.indexOf(k);
    if (i < 0) DRAFT.flags.push(k); else DRAFT.flags.splice(i, 1);
    render();
  },

  /* 營火：哪一件真的比你想的久 */
  over: function (k) {
    DRAFT.overs = DRAFT.overs || [];
    var i = DRAFT.overs.indexOf(k);
    if (i < 0) DRAFT.overs.push(k); else DRAFT.overs.splice(i, 1);
    render();
  },

  /* 點洞口那幾樣還沒點著的東西。它不做事，只說那是什麼——
     沒觸發過的東西如果連問都不能問，它等於不存在。 */
  peek: function (what) {
    if (what === 'camp') {
      var t = myTeam();
      var n = nextThing(t.teamId);
      if (n.kind === 'camp') return go('camp', { id: n.row.run.runId });
      return say('營火。比你自己說的天數久的時候，會在這裡坐下來說一句哪一段比想的久。這不扣任何東西。');
    }
  },

  /* 交出去那一頁：標／取消標「那一天我動過」。 */
  mark: function (arg) {
    var i = arg.indexOf('|');
    actMarkDay(myTeam().teamId, arg.slice(0, i), Number(arg.slice(i + 1)));
    render();
  },

  /* 今天沒有動。
     跟推進一樣一下點擊，但不會讓畫面變亮，也不會讓停滯計時歸零——
     說實話不用付代價，也買不到東西，所以沒有說謊的理由。 */
  rest: function (runId) {
    var t = myTeam();
    var back = Number(DRAFT.back || 0);
    if (!actRest(t.teamId, runId, back)) return say('那一天已經記過了。');
    DRAFT.back = 0;
    go('home');
    say('記下來了。沒動也是這一趟的一部分。');
  },

  /* 勾掉／取消勾掉老師分的一段 */
  tick: function (arg) {
    var i = arg.indexOf('|');
    actTickStep(myTeam().teamId, arg.slice(0, i), Number(arg.slice(i + 1)));
    render();
  },

  /* ---- 出口 ---- */
  noop: function () {},

  askexit: function () {
    actAskExit(myTeam().teamId);
    go('exit');
    say('說出去了。老師確認之後你就出去了。');
  },

  cancelexit: function () {
    actCancelExit(myTeam().teamId);
    go('home');
    say('收回來了。');
  },

  letgo: function (teamId) {
    var word = (document.getElementById('gr-word') || {}).value || '';
    if (!actLetGo(teamId, word.trim())) return say('這一組沒有在等出口。');
    go('radar');
    say('他們出去了。');
  },

  commit: function (msId) {
    var t = myTeam();
    actCommit(t.teamId, msId, Number(DRAFT.est || RULES.EST_DEFAULT), DRAFT.flags || []);
    go('home');
    say('承諾了。從今天開始，每天推一格。');
  },

  /* 補登哪一天。0 是今天。 */
  back: function (v) { DRAFT.back = Number(v) || 0; render(); },

  /* 推進。參數是「runId|今天動的是哪一塊」。 */
  push: function (arg) {
    /* 圖例那一排送過來的字是「push:R12|:a123」，中間那一段是 runId。
       沒有 | 就是「我今天來過了」——那一組還沒寫自己的清單。 */
    arg = arg.replace('|:', '|');
    var i = arg.indexOf('|');
    var runId = i < 0 ? arg : arg.slice(0, i);
    var step = i < 0 ? -1 : Number(arg.slice(i + 1));
    var t = myTeam();
    var back = Number(DRAFT.back || 0);
    /* 有沒有藤蔓要碎——推之前先問，推完狀態就變了 */
    var wasStuck = stallOf(t.teamId).level;
    if (!actPush(t.teamId, runId, step, back)) {
      return say(back ? '那一天已經點過了。' : '今天那一盞已經點好了。一天一盞——多按沒有用。');
    }
    DRAFT.back = 0;
    var r = find('Runs', function (x) { return x.runId === runId; });
    var lab = stepName(runId, step);
    var msg;
    if (RULES.progress(r.pushes, r.est) >= 1) {
      msg = '走到走廊底了。交出去之後，系統會比對你當初承諾的天數。';
    } else if (back) {
      msg = '補回來了。那一盞亮了。';
    } else {
      /* 有人跟你一起在下面。這不是名次——它不排序，也不說誰比較多。 */
      var others = todayMovers(t.classId, t.teamId);
      msg = (lab ? '「' + lab + '」記下了。' : '記下了。') +
        (others ? '今天班上還有 ' + others + ' 條廊道今天也有人在走。'
                : '今天你是第一個下來的。');
    }
    /* 先播完動畫再重畫——重畫會把 <img> 換掉，動畫就沒了。
       藤蔓先碎，再揮劍：那個順序就是「你把它弄斷了，然後繼續走」。 */
    var swing = function () { shakeScene(); animPush(function () { say(msg); }); };
    if (wasStuck === 1) animVineBreak(swing); else swing();
  },

  submit: function (runId) {
    var t = myTeam();
    var r = actSubmit(t.teamId, runId, '');
    if (r) go('stamp', { id: runId });
  },

  skipcamp: function (runId) { actSkipCamp(runId); go('home'); },

  reflect: function (runId) {
    var t = myTeam();
    actReflect(t.teamId, runId, DRAFT.overs || []);
    go('home');
    say('說出來了。老師看得到，而且這不會扣任何東西。');
  },

  /* 老師勾可以了 → 去挑裝備 */
  gear: function (runId) { go('pick', { id: runId }); },

  /* 封存這一趟。名字選填。 */
  seal: function (runId) {
    var name = (document.getElementById('cname') || {}).value || '';
    if (!actSeal(runId, name)) return say('這一趟已經封存了。');
    go('dash', { id: runId });
    animDash();   /* 畫面畫好之後才播——go() 已經重畫過了 */
  },

  /* 學生改自己的招牌 */
  rename: function () {
    var t = myTeam();
    var v = (document.getElementById('pj-name') || {}).value || '';
    if (!v.trim()) return say('招牌上總要寫點什麼。');
    if (!actRename(t.teamId, v.trim())) return say('跟原本一樣，沒有改到。');
    go('home');
    say('招牌換字了。材質是走出來的，那個急不得。');
  },

  /* ---- 老師 ---- */
  publish: function () {
    var title = (document.getElementById('ms-title') || {}).value || '';
    var note = (document.getElementById('ms-note') || {}).value || '';
    if (!title.trim()) return say('先寫這一個里程碑要交什麼。');
    var steps = ((document.getElementById('ms-steps') || {}).value || '')
      .split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    actPublish(me().classId, { title: title.trim(), note: note.trim(),
      steps: steps, teams: DRAFT.to || [] });
    go('ms');

/* ===== 56-viz.js ===== */
/* 把數字畫出來。

   這個系統只有一件事要傳達：你說幾天、實際幾天、差多少。
   本來那件事是用一句話講的——

     「你承諾 5 天，實際花了 7 天。誤差 1 天以內算準（預估的 20％）。」

   那句話要讀完才知道發生什麼事，而且它把「範圍」這個概念用文字描述，
   讀的人得自己在腦袋裡把尺畫出來。那就畫出來給他看。

   兩條尺上下對齊：上面那條是你自己說的，範圍框出來；
   下面那條是實際走的。超出去的那幾格自己會是另一個顏色。
   看一眼就結束了，不用讀。 */

/* 一格一天的尺。

     est     承諾幾天
     actual  實際幾天（還沒交就傳 pushes，那條會邊走邊長）
     live    true 代表還在走，下面那條不畫判定色 */
function estBar(est, actual, live) {
  var e = Math.max(1, Number(est) || 1);
  var a = Math.max(0, Number(actual) || 0);
  var b = RULES.band(e);
  var lo = Math.max(1, e - b), hi = e + b;
  var n = Math.min(30, Math.max(hi, a) + 1);

  var H = ['<div class="ebar">'];

  /* 上面：你自己說的 */
  H.push('<div class="eb-r"><b>承諾</b><div class="eb-c">');
  for (var i = 1; i <= n; i++) {
    H.push('<span class="eb' + (i >= lo && i <= hi ? ' band' : '') +
      (i === e ? ' pin' : '') + '"></span>');
  }
  H.push('</div><i>' + e + '</i></div>');

  /* 下面：實際走的。超出上面那個框的格子換色——那就是判定，不用寫字。 */
  H.push('<div class="eb-r"><b>' + (live ? '走到' : '實際') + '</b><div class="eb-c">');
  for (var j = 1; j <= n; j++) {
    var on = j <= a;
    var out = on && !live && (j > hi);
    H.push('<span class="eb' + (on ? ' on' : '') + (out ? ' out' : '') +
      (j >= lo && j <= hi ? ' band' : '') + '"></span>');
  }
  H.push('</div><i>' + a + '</i></div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 每一件一個顏色 ----------

   老師分的那幾段，名字長度不一定，塞不進廊道上一格 44px 的位置。
   所以廊道上畫的是顏色，顏色對到第幾段，在清單上讀一次就記得了。

   顏色照段的順序給，不照內容——系統不知道「打樣」該是什麼顏色，
   也不該假裝知道。 */
var ACT_HUE = [
  '#E9B341', '#5FA8C7', '#7FA866', '#C77BA8', '#D9843F',
  '#8C7BC7', '#5AA88F', '#C7645F', '#9AA6B0', '#B8A05A'
];
function stepHue(i) {
  return i < 0 ? '#4A4038' : ACT_HUE[i % ACT_HUE.length];
}

/* 段的清單就是圖例。同一個元件當三種用：圖例、推進鍵、標記鍵。 */
function stepLegend(runId, sel, act) {
  var a = stepNames(runId);
  if (!a.length) return '';
  var H = ['<div class="alist">'];
  a.forEach(function (x, i) {
    var on = sel && sel.indexOf(i) >= 0;
    var tag = act ? 'button' : 'span';
    H.push('<' + tag + ' class="ac' + (on ? ' on' : '') + '"' +
      (act ? ' data-act="run" data-p=\'' +
        esc(JSON.stringify({ a: act + ':' + i })) + '\'' : '') + '>' +
      '<b style="background:' + stepHue(i) + '"></b>' +
      esc(x) + '</' + tag + '>');
  });
  H.push('</div>');
  return H.join('');
}

/* 這一趟每一天動的是哪一件，排成一條。
   沒有清單的組就是一排腳印——那也是資訊：你來了幾天。 */
function dayStrip(teamId, runId) {
  var ids = stepIdxOfRun(runId);
  if (!ids.length) return '';
  var H = ['<div class="dstrip">'];
  ids.forEach(function (id, i) {
    var lab = stepName(runId, id);
    H.push('<span class="ds" style="background:' + stepHue(id) + '" title="' +
      esc('第 ' + (i + 1) + ' 天' + (lab ? '　' + lab : '')) + '"></span>');
  });
  H.push('</div>');
  return H.join('');
}

/* 走過的每一趟，準度分布。三個數字，不加一句解讀。 */
function accBar(acc) {
  var H = ['<div class="acc">'];
  ['exact', 'early', 'late'].forEach(function (k) {
    var s = RULES.STAMPS[k];
    H.push('<div class="acc-c ' + k + '"><b>' + s.mark + '</b><i>' + acc[k] +
      '</i><span>' + esc(s.name) + '</span></div>');
  });
  H.push('</div>');
  return H.join('');
}

/* 兩條尺的圖例。三個色塊就說完了，不用一句話解釋。 */
function barKey() {
  return '<div class="bkey">' +
    '<span><b class="k1"></b>你說的範圍</span>' +
    '<span><b class="k2"></b>實際走的</span>' +
    '<span><b class="k3"></b>超出去的</span>' +
    '</div>';
}

/* 這一趟的形狀。全部是數字，一句判斷都沒有——
   要怎麼讀是他自己的事，不是系統的。 */
function shapeLine(runId) {
  var s = runShape(runId);
  if (!s) return '';
  var H = ['<div class="shape">'];
  H.push('<span><b>' + s.est + '</b>你說的天數</span>');
  H.push('<span><b>' + s.elapsed + '</b>過了幾天</span>');
  H.push('<span><b>' + s.moved + '</b>你來過</span>');
  if (s.rested) H.push('<span><b>' + s.rested + '</b>你說沒動</span>');
  if (s.blank) H.push('<span class="blank"><b>' + s.blank + '</b>沒有紀錄</span>');
  if (s.stepsAll) H.push('<span><b>' + s.steps + '/' + s.stepsAll + '</b>勾掉的段</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 這幾天你動過哪幾天 ----------

   每天要按的那一版拿掉之後，這一份資料本來就會不見。改成在交出去那一頁
   一次補齊：一格一天，點一下切換「動過／沒動」。

   它不進判定，所以標不標、標得準不準，都不會改變任何結果——
   也因此沒有說謊的理由。它唯一影響的是那一趟長成什麼樣子的岩心。 */
function dayGrid(runId) {
  var log = dayLog(runId);
  var H = ['<div class="dgrid">'];
  log.forEach(function (d, i) {
    var on = d && d.kind === 'move';
    H.push('<button class="dg' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'mark:' + runId + '|' + i })) + '\'>' +
      '<b>' + (i + 1) + '</b></button>');
  });
  H.push('</div>');
  return H.join('');
}

/* 全班怎麼看這一個里程碑。匿名——只有天數，沒有誰是誰。
   要的是「我是不是低估了」，不是「誰比較快」。 */
function spreadBar(sp, mine) {
  var hi = Math.max(sp.hi, Number(mine) || 0, RULES.EST_MIN);
  var H = ['<div class="spread">'];
  for (var i = 1; i <= hi; i++) {
    var n = 0;
    sp.all.forEach(function (d) { if (d === i) n++; });
    H.push('<span class="sp-c' + (i === Number(mine) ? ' me' : '') + '">' +
      '<b style="height:' + (n ? 11 + n * 11 : 3) + 'px"></b>' +
      '<i>' + i + '</i></span>');
  }
  H.push('</div>');
  return H.join('');
}

/* ===== 60-student.js ===== */
/* 學生端。

   一頁只給一個動作。首頁就是廊道本身——招牌、角色、迷霧、魔物，
   底下一排他們自己寫的東西。其餘都是資訊，不是選項。

   兩條原則，這一版收得比之前緊：

   一 · 系統不定義他們在做什麼。
        每天點的那幾段、承諾時標的那幾段、營火說的那幾段，全部來自
        同一個地方：老師分段時寫的那幾行。系統一個字都沒有列。
        老師沒分段也走得完：推進那一顆鍵退回「我今天來過了」。

   二 · 介面不解釋自己。
        本來每一張卡底下都有一段我寫的說明（「這一下就是推進，不用再
        按第二顆」）。那是系統在替使用者讀畫面。能畫出來的就畫出來——
        承諾與實際畫成兩條尺（見 56-viz.js），停滯畫成畫面暗下來，
        走過的日子畫成廊道上的火把。剩下的字只有兩種：他們自己的詞，
        跟系統記到的數字。 */

/* ---------- 廊道（首頁） ---------- */
PAGES.home = function () {
  var t = myTeam();
  var next = nextThing(t.teamId);
  var st = stallOf(t.teamId);
  var acc = accuracyOf(t.teamId);

  var H = [];

  /* 三步，不是四步：中間那一段不用他開。 */
  H.push(stepBar([
    ['開始前', '你說要花幾天'],
    ['做完回來', '交出去，比對天數'],
    ['封存', '那一趟長成一根岩心']
  ], STEP_AT[next.kind] == null ? -1 : STEP_AT[next.kind]));

  /* ── 廊道本身。招牌、深度、魔物全在裡面（見 61-scene.js） ── */
  H.push(scene(t, next.row, st, next.kind));

  /* ── 今天要做的那一件。放在廊道正下面，而且是整頁最大聲的一張——
        本來它排在兩條尺跟分段清單後面，每一張卡看起來又都一樣重，
        所以打開之後第一眼看不出該按哪裡。 ── */
  H.push(actionCard(t, next, st));

  /* ── 這一趟的分段（老師有分才有） ── */
  if (next.row && next.row.run && next.row.run.runId) {
    H.push(stepCard(next.row.run.runId));
  }

  /* ── 這一趟的形狀。說幾天、過了幾天、來過幾天。 ── */
  if (next.row && next.row.run && next.row.run.runId) {
    var run = next.row.run;
    H.push('<div class="card quiet">');
    H.push('<div class="eyebrow">' + esc(next.row.ms.title) + '</div>');
    H.push(estBar(run.est, run.actual || run.pushes, run.state === 'running'));
    H.push(barKey());
    H.push(shapeLine(run.runId));
    H.push('</div>');
  }

  /* ── 走過的每一趟 ── */
  if (acc.total) {
    H.push('<div class="card quiet">');
    H.push('<div class="eyebrow">走過 ' + acc.total + ' 趟</div>');
    H.push(accBar(acc));
    H.push('</div>');
  }

  /* ── 上一趟長成什麼樣子 ──
     掛在他自己看得到的地方，不是躺在一個道具欄裡。 */
  var keep = lastKeep(t.teamId);
  if (keep) {
    var kz = STRATA[0];
    STRATA.forEach(function (x) { if (x.key === keep.zone) kz = x; });
    H.push('<div class="card quiet">');
    H.push('<div class="eyebrow">上一趟</div>');
    H.push('<div class="rk row-rk">');
    H.push(pxTag(keep.px || coreOf(keep.runId), kz.pal, 'core'));
    H.push('<div><b>' + esc(keep.name || '（沒取名）') + '</b>');
    H.push('<span>' + (keep.elapsed || 0) + ' 天　·　來過 ' + (keep.moved || 0) + '</span></div>');
    H.push('</div>');
    H.push(btn('看岩心架', 'go:pack', 'ghost'));
    H.push('</div>');
  }


  /* ── 底下那一張：招牌與出口 ──
     兩件都是偶爾才動的事，放同一張安靜的卡，不要跟今天要做的事搶。 */
  if (!t.leftAt) H.push(exitCard(t));

  /* ── 招牌 ──
     它只有一個用途：廊道口掛的是誰。本來還有三階材質（走得越深牌子
     越好），拿掉了——深度已經不是進度了，留著一個「越多越好」的漸層
     跟其他每一條規則都打架。名字是他們自己寫的，這才是招牌的意義。 */
  H.push('<div class="card quiet">');
  H.push('<div class="eyebrow">廊道口掛的</div>');
  H.push('<div class="rn-row">');
  H.push('<input id="pj-name" value="' + esc(t.project || '') +
         '" placeholder="' + esc('這個專案叫什麼') + '">');
  H.push(btn('換字', 'rename', 'ghost'));
  H.push('</div>');
  H.push('</div>');

  return H.join('');
};

/* 承諾那一頁還沒有 run，所以直接從里程碑上讀那幾段。 */
function previewSteps(m) { return (m && m.steps) || []; }
function msStepLegend(m, sel, act) {
  var a = previewSteps(m);
  if (!a.length) return '';
  var H = ['<div class="alist">'];
  a.forEach(function (x, i) {
    var on = sel && sel.indexOf(i) >= 0;
    H.push('<button class="ac' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: act + ':' + i })) + '\'>' +
      '<b style="background:' + stepHue(i) + '"></b>' + esc(x) + '</button>');
  });
  H.push('</div>');
  return H.join('');
}

/* ---------- 老師分的段 ----------
   他有分才畫。勾一段跟每天推進是兩件事：推進是「今天我來過」，
   勾是「這一段做完了」。兩件事都不影響判定。 */
function stepCard(runId) {
  var s = stepsOf(runId);
  if (!s) return '';
  var H = ['<div class="card">'];
  H.push('<div class="eyebrow">老師分的段　' + s.on.length + ' / ' + s.all.length + '</div>');
  H.push('<div class="steps-list">');
  s.all.forEach(function (x, i) {
    var on = s.on.indexOf(i) >= 0;
    H.push('<button class="stp' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'tick:' + runId + '|' + i })) + '\'>' +
      '<b></b><i>' + esc(x) + '</i></button>');
  });
  H.push('</div></div>');
  return H.join('');
}

/* ---------- 出口 ----------
   往下走不出去，六層一直循環。唯一的出口是把手上這個專案做完，
   而那件事只有他們自己知道——所以是他們宣告，老師確認。 */
function exitCard(t) {
  var H = ['<div class="card exitc">'];
  H.push('<div class="eyebrow">出口</div>');
  if (t.exitAsk) {
    H.push('<h2>你說這個專案做完了。</h2>');
    H.push('<p class="lead">在等老師確認。</p>');
    H.push(btn('還沒，收回', 'cancelexit', 'ghost'));
  } else {
    H.push('<h2>這個專案做完了。</h2>');
    H.push(btn('去出口', 'go:exit', 'ghost'));
  }
  H.push('</div>');
  return H.join('');
}

/* nextThing 回的那個字，對到步驟條的第幾格。 */
var STEP_AT = {
  commit: 0,
  doing: 1, submit: 1, camp: 1, review: 1,
  gear: 2
};

/* 上一次自己留下的那一句 */
function lastKeep(teamId) {
  var ks = keepsOf(teamId);
  return ks.length ? ks[ks.length - 1] : null;
}


/* ---------- 唯一的那一顆動作 ---------- */
function actionCard(t, next, st) {
  var H = ['<div class="act-card">'];
  var row = next.row;

  if (next.kind === 'left') {
    H.push('<div class="eyebrow">你出去了</div>');
    H.push('<h2>' + (t.exitWord ? '' : '地面。') + '</h2>');
    if (t.exitWord) H.push('<p class="quote">' + nl(t.exitWord) + '</p>');
    H.push(btn('看你帶出來的', 'go:exit', 'big'));

  } else if (next.kind === 'waitexit') {
    H.push('<div class="eyebrow">出口</div>');
    H.push('<h2>在等老師確認。</h2>');
    H.push(btn('還沒，收回', 'cancelexit', 'ghost'));

  } else if (next.kind === 'commit') {
    H.push('<div class="eyebrow">新的里程碑</div>');
    H.push('<h2>' + esc(row.ms.title) + '</h2>');
    if (row.ms.note) H.push('<p class="lead">' + nl(row.ms.note) + '</p>');
    H.push(btn('決定天數', 'go:commit:' + row.ms.msId, 'big'));

  } else if (next.kind === 'doing') {
    H.push(doingCard(t, row, st));

  } else if (next.kind === 'camp') {
    H.push('<div class="eyebrow">營火</div>');
    H.push('<h2>' + row.run.actual + ' 天，比你說的 ' + row.run.est + ' 天久。</h2>');
    H.push(btn('去營火旁', 'go:camp:' + row.run.runId, 'big'));

  } else if (next.kind === 'gear') {
    H.push('<div class="eyebrow">老師看完了</div>');
    H.push('<h2>這一趟長成什麼樣子。</h2>');
    if (row.run.word) H.push('<p class="quote">' + nl(row.run.word) + '</p>');
    H.push(btn('去看', 'gear:' + row.run.runId, 'big'));

  } else if (next.kind === 'review') {
    H.push('<div class="eyebrow">在老師那邊</div>');
    H.push('<h2>他還沒看。</h2>');

  } else {
    H.push('<div class="eyebrow">廊道很安靜</div>');
    H.push('<h2>目前沒有等你做的。</h2>');
  }

  H.push('</div>');
  return H.join('');
}

/* ---------- 正在做 ----------

   這一張本來是「今天動的是哪一段？」加一排每天要按的鍵。
   拿掉了：兩個接觸點就夠——開始之前說幾天，做完回來交。

   所以這一頁上只有一個動作，而且它一直都在：交出去。
   底下那一句講的是狀態，不是催促——水在哪裡是行事曆決定的，
   他開不開這一頁都一樣。 */
function doingCard(t, row, st) {
  var r = row.run;
  var gone = daysBetween(r.committedAt, now()) + 1;
  var H = [];
  H.push('<div class="eyebrow">正在做　·　' + esc(row.ms.title) + '</div>');
  if (st && st.level) {
    H.push('<h2>' + esc(RULES.stallSay(st.level, st.days)) + '</h2>');
  } else {
    H.push('<h2>你說 ' + r.est + ' 天。今天是第 ' + gone + ' 天。</h2>');
  }
  H.push(btn('做完了，交出去', 'go:submit:' + r.runId, 'big'));
  H.push('<p class="dim">中間不用來。做完再回來就好。</p>');
  return H.join('');
}

/* ---------- 場景底下那一行 ---------- */
function sceneCap(t, next, st) { return ''; }

/* ---------- 承諾：滑桿 ＋ 自己標哪幾件會比想的久 ---------- */
PAGES.commit = function () {
  var t = myTeam();
  var m = msOf(S.p.id);
  if (!m) return '<div class="card">找不到這一個里程碑。</div>';
  var est = Number(draft('est', RULES.EST_DEFAULT));
  var flags = DRAFT.flags || [];

  var H = [head('自我承諾', m.title, m.note)];

  /* 你自己的估算歷史。

     這是拉滑桿那一刻真正用得上的東西，而它本來不在這一頁上——
     本來站在這個位置的是一句留下的話，它站不住。
     上三趟說了幾天、實際走了幾天，疊在一起就看得出自己的偏差。 */
  var past = runsFor(t.teamId).filter(function (x) { return x.run.stamp; }).slice(-3);
  if (past.length) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">你前 ' + past.length + ' 趟</div>');
    past.reverse().forEach(function (x) {
      H.push('<div class="outrun"><span>' + esc(x.ms.title) + '</span>');
      H.push(estBar(x.run.est, x.run.actual, false));
      H.push('</div>');
    });
    H.push('</div>');
  }

  /* 全班怎麼看這一件事。匿名，只有天數。
     它出現在拉滑桿之前——那一刻才是它有用的時候。 */
  var sp = estSpread(m.msId, t.teamId);
  if (sp) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">別組怎麼看這一件事</div>');
    H.push(spreadBar(sp, est));
    H.push('<div class="log-num">' + sp.n + ' 組已經說了　·　最少 <b>' +
      sp.lo + '</b> 天　·　最多 <b>' + sp.hi + '</b> 天</div>');
    H.push('</div>');
  }

  H.push('<div class="card">');
  H.push('<div class="eyebrow">幾天</div>');
  H.push('<div class="slider-wrap">');
  H.push('<input type="range" class="slider" id="est" min="' + RULES.EST_MIN +
         '" max="' + RULES.EST_MAX + '" value="' + est +
         '" oninput="ACTS.est(this.value)">');
  H.push('<div class="slider-read"><b>' + est + '</b><span>天</span></div>');
  H.push('</div>');
  /* 準的範圍直接畫出來，不用一句話描述它 */
  H.push(estBar(est, 0, true));
  H.push('</div>');

  /* 老師分了段才問。標的是他分的那幾段，不是我列的選項。 */
  var run0 = runOf(t.teamId, m.msId);
  var pv = previewSteps(m);
  if (pv.length) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">哪幾段會比你想的久　選填</div>');
    H.push(msStepLegend(m, flags, 'flag'));
    H.push('</div>');
  }

  H.push('<div class="row">');
  H.push(btn('我承諾 ' + est + ' 天', 'commit:' + m.msId, 'big'));
  H.push(btn('回廊道', 'go:home', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 交出去 ---------- */
PAGES.submit = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var m = msOf(r.msId);
  var used = Math.max(1, daysBetween(r.committedAt, now()));

  var H = [head('交出去', m.title, '')];

  /* 走到底了才看得清楚牠。前面那些天牠都在霧裡。 */
  var mob = mobOfRun(r);
  var zone = strataAt(depthOf(t.teamId), t.teamId);
  H.push('<div class="card fa ' + zone.key + '"><div class="fa-in">');
  H.push(pxTag(mob.px, zone.pal, 'fa-px'));
  H.push('<div><div class="eyebrow">' + esc(zone.name) + '</div>');
  H.push('<h2>' + esc(mob.n) + '</h2>');
  H.push('<p class="lead">' + esc(mob.t) + '</p>');
  H.push('</div></div></div>');

  H.push('<div class="card">');
  H.push(estBar(r.est, used, false));
  H.push('</div>');

  /* 這幾天你動過哪幾天。

     每天要按的那一版拿掉之後，這一份資料本來就會不見。改成在這裡一次
     補齊：一張那幾天的格子，點一下標起來。選填——不標一樣交得出去，
     而且它不進判定（判定只看承諾幾天與行事曆過了幾天）。

     它唯一影響的是那一趟長成什麼樣子的岩心。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">這幾天你動過哪幾天　選填</div>');
  H.push(dayGrid(r.runId));
  H.push('<p class="dim">點一下標起來。這不會影響判定——它決定的是' +
         '這一趟封存起來長什麼樣子。</p>');
  H.push('</div>');

  H.push('<div class="row">');
  H.push(btn('確認交出去了', 'submit:' + r.runId, 'big'));
  H.push(btn('還沒', 'go:home', 'ghost'));
  H.push('</div>');
  H.push('<p class="dim">作業交到老師原本收的地方。這裡不收檔案。</p>');
  return H.join('');
};

/* ---------- 判定結果 ---------- */
PAGES.stamp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var s = RULES.STAMPS[r.stamp];

  var t = myTeam();
  var zone = strataAt(depthOf(t.teamId), t.teamId);
  var mob = mobOfRun(r);

  var H = ['<div class="stamp-card ' + r.stamp + '">'];
  H.push('<div class="stamp-mark">' + s.mark + '</div>');
  H.push('<h1>' + esc(s.name) + '</h1>');
  H.push(estBar(r.est, r.actual, false));
  H.push('</div>');

  /* 擋路的那一隻讓開了。這一趟真的結束了的訊號——
     牠不是被打敗的，牠只是不再擋在那裡。 */
  H.push('<div class="card fa ' + zone.key + ' aside"><div class="fa-in">');
  H.push(pxTag(mob.px, zone.pal, 'fa-px gone'));
  H.push('<div><div class="eyebrow">' + esc(zone.name) + '</div>');
  H.push('<h2>' + esc(mob.n) + '讓開了。</h2>');
  H.push('</div></div></div>');

  if (r.stamp === 'late') {
    H.push(btn('去營火旁說一下', 'go:camp:' + r.runId, 'big'));
  } else {
    H.push(btn('好', 'skipcamp:' + r.runId, 'big'));
  }
  return H.join('');
};

/* ---------- 營火 ----------
   問的是他們自己清單上的哪一件比想的久。系統不列「卡關的原因」。 */
PAGES.camp = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var picked = DRAFT.overs || [];
  var flags = r.flags || [];

  var H = ['<div class="camp">'];
  H.push(pxTag(CAMPFIRE.px, CAMPFIRE.pal, 'fire'));
  H.push('<div>');
  H.push('<div class="eyebrow">營火</div>');
  H.push('<h2>哪一件比你想的久？</h2>');
  H.push('</div></div>');

  H.push('<div class="card">');
  H.push(estBar(r.est, r.actual, false));
  H.push('</div>');

  if (stepNames(r.runId).length) {
    H.push('<div class="card">');
    if (flags.length) {
      H.push('<div class="eyebrow">承諾時你標的</div>');
      H.push(stepLegend(r.runId, flags, null));
    }
    H.push('<div class="eyebrow">哪一段真的比想的久</div>');
    H.push(stepLegend(r.runId, picked, 'over'));
    H.push('</div>');
  }

  H.push(btn('說完了', 'reflect:' + r.runId, 'big'));
  return H.join('');
};

/* ---------- 封存 ----------

   走完一趟，那一趟的紀錄長成一根岩心。形狀完全由那一趟決定：
   一天兩列，來過是實心、說了沒動是空心、沒有紀錄是斷的，
   長度就是這一趟過了幾天。

   這一頁真正給他的東西是「他沒見過的那個形狀」——同一份數字，
   換成一個看得到的樣子。取名選填，他不取一樣封存得下來。 */
PAGES.pick = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var m = msOf(r.msId);
  var z = strataAt(depthOf(t.teamId), t.teamId);
  var s = runShape(r.runId);

  var H = [head('封存', m.title, '這一趟長成這個樣子。')];

  if (r.word) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
           '<p class="quote">' + nl(r.word) + '</p></div>');
  }

  H.push('<div class="card fa ' + z.key + ' coreview">');
  H.push('<div class="cv-in">');
  H.push(pxTag(coreOf(r.runId), z.pal, 'core big'));
  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(z.name) + '</div>');
  H.push('<div class="corekey">');
  H.push('<span><b class="c1"></b>來過 ' + s.moved + ' 天</span>');
  if (s.rested) H.push('<span><b class="c2"></b>你說沒動 ' + s.rested + ' 天</span>');
  if (s.blank) H.push('<span><b class="c3"></b>沒有紀錄 ' + s.blank + ' 天</span>');
  H.push('</div>');
  H.push('<div class="log-num">說 <b>' + s.est + '</b> 天　·　過了 <b>' +
    s.elapsed + '</b> 天</div>');
  H.push('</div></div></div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">給這一趟取個名字　選填</div>');
  H.push('<div class="rn-row">');
  H.push('<input id="cname" maxlength="16" placeholder="' +
    esc('例：訪談那一週') + '">');
  H.push('</div>');
  H.push(btn('封存', 'seal:' + r.runId, 'big'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 大躍進 ---------- */
PAGES.dash = function () {
  var r = find('Runs', function (x) { return x.runId === S.p.id; });
  if (!r) return '<div class="card">找不到。</div>';
  var t = myTeam();
  var keep = lastKeep(t.teamId);

  var H = ['<div class="dash">'];
  H.push(pxTag(HERO.dash, HERO.pal, 'ch big'));
  H.push('<h1>' + (depthOf(r.teamId) * WORLD.depthPerMilestone) + ' m</h1>');
  if (keep && keep.name) H.push('<p class="lead">「' + esc(keep.name) + '」封存了。</p>');
  if (r.word) H.push('<p class="quote">' + nl(r.word) + '</p>');
  H.push('</div>');

  /* 跨進新的一區。世界自己變了，不是給的獎勵。 */
  var d = depthOf(r.teamId);
  var now2 = strataAt(d, r.teamId), was = strataAt(d - 1, r.teamId);
  if (d > 0 && now2.key !== was.key) {
    H.push('<div class="card fa ' + now2.key + ' zone-in">');
    H.push('<div class="eyebrow">石頭變了</div>');
    H.push('<h2>' + esc(now2.name) + '</h2>');
    H.push('<p class="lead">' + esc(now2.note) + '</p>');
    H.push('</div>');
  }

  H.push(btn('回廊道', 'go:home', 'big'));
  return H.join('');
};

/* ---------- 出口 ----------

   這一頁是整個系統唯一的結尾。它不打分、不總評，只把他自己留下的
   紀錄攤開來：每一趟說幾天走幾天、走過哪幾層、留下哪幾句。

   「規劃妥善」不是開門的條件，是走出去的時候帶著的東西——
   同一道門，不同的故事。 */
PAGES.exit = function () {
  var t = myTeam();
  var e = exitRecord(t.teamId);
  var out = !!t.leftAt;

  var H = [head(out ? '地面' : '出口',
    out ? '你出去了' : '這個專案做完了？',
    out ? '' : '往下走不出去——六層會一直重來。出去的方式只有一個：' +
          '把手上這個專案做完，然後說一聲。')];

  if (out && t.exitWord) {
    H.push('<div class="card"><div class="eyebrow">老師說</div>' +
      '<p class="quote">' + nl(t.exitWord) + '</p></div>');
  }

  /* 帶出來的東西。全部是他自己的紀錄。 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">你帶出來的</div>');
  H.push('<div class="outnum">');
  H.push('<div><b>' + e.runs.length + '</b><span>走完的里程碑</span></div>');
  H.push('<div><b>' + e.days + '</b><span>來過的天數</span></div>');
  H.push('<div><b>' + e.zones.length + '</b><span>走過的地層</span></div>');
  H.push('<div><b>' + e.keeps.length + '</b><span>封存的岩心</span></div>');
  H.push('</div>');
  if (e.acc.total) H.push(accBar(e.acc));
  H.push('</div>');

  /* 走過的地層 */
  if (e.zones.length) {
    H.push('<div class="card"><div class="eyebrow">你走過的</div><div class="zones">');
    e.zones.forEach(function (z) {
      var c = faunaOf(z.key)[0];
      H.push('<div class="zn ' + z.key + '">');
      if (c) H.push(pxTag(c.px, z.pal, 'zn-px'));
      H.push('<b>' + esc(z.name) + '</b>');
      H.push('</div>');
    });
    H.push('</div></div>');
  }

  /* 每一趟說幾天、走幾天 */
  if (e.runs.length) {
    H.push('<div class="card"><div class="eyebrow">每一趟</div>');
    e.runs.forEach(function (x) {
      H.push('<div class="outrun"><span>' + esc(x.ms.title) + '</span>');
      H.push(estBar(x.run.est, x.run.actual, false));
      H.push('</div>');
    });
    H.push('</div>');
  }

  /* 帶出去的那一排岩心。二十根排在一起，就是一個學期的形狀。 */
  if (e.keeps.length) {
    H.push('<div class="card"><div class="eyebrow">你帶出去的</div>');
    H.push('<div class="rack">');
    e.keeps.slice().reverse().forEach(function (k) {
      var kz = STRATA[0];
      STRATA.forEach(function (x) { if (x.key === k.zone) kz = x; });
      H.push('<div class="rk">');
      H.push(pxTag(k.px || coreOf(k.runId), kz.pal, 'core'));
      H.push('<b>' + esc(k.name || '') + '</b>');
      H.push('<span>' + (k.elapsed || 0) + ' 天</span>');
      H.push('</div>');
    });
    H.push('</div></div>');
  }

  if (!out) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">說一聲</div>');
    H.push('<p class="dim">老師確認之後你就出去了。之後不會再收到新的里程碑，' +
           '這幾頁還看得到。</p>');
    H.push('<div class="row">');
    H.push(btn(t.exitAsk ? '已經說了，在等他' : '這個專案做完了',
      t.exitAsk ? 'noop' : 'askexit', 'big'));
    H.push(btn('回廊道', 'go:home', 'ghost'));
    H.push('</div></div>');
  } else {
    H.push(btn('回廊道', 'go:home', 'ghost'));
  }
  return H.join('');
};

/* ===== 61-scene.js ===== */
/* 廊道的場景。

   之前這裡是一條進度條：角色 → 幾個方格 → 魔物。它讀得懂，但它是圖表。
   這一支把它改成一個地方——有洞口、有天花板、有地板、有石頭、有火把，
   角色站在裡面而不是站在旁邊。

   幾件事是有意義的，不是裝飾：

     火把    一天一盞。推進幾次，走廊就亮幾盞——「你來過幾次」畫出來的樣子。
     腳印    走過的每一格留一個。走廊上唯一的歷史，而且它不算分。
     迷霧    從你站的地方往前蓋住。往前走一格，霧就退一格。
     魔物    藏在霧裡，越靠近越清楚。它不是敵人，是這一趟要交的東西。

   還有一件事是刻意不做的：走廊上沒有任何「你應該走到哪」的記號。
   沒有基準線，就沒有落後這回事。 */

var SCN = {
  TILE: 44,     /* 一天一格 */
  ENT: 132,     /* 洞口那一段 */
  END: 154,     /* 魔物站的那一段 */
  H: 286,       /* 場景高 */
  FLOOR: 66     /* 地板上緣離底部多高——站在地上的東西都用這個 */
};

/* 一條走廊。

     t     這一組
     row   現在在跑的那一個 run（可能沒有）
     st    停滯狀態 */
function scene(t, row, st, kind) {
  var run = row && row.run;
  var est = run ? (run.est || 1) : 4;

  /* 一條軌道，兩個東西在上面：
       moved   你來過幾天——按一下才往前一格
       tide    實際過了幾天——你按不按它都會漲 */
  var log = run ? dayLog(run.runId) : [];
  var moved = 0, i0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'move') moved++;
  var done = run && run.state !== 'running';
  if (done) moved = Math.max(moved, run.pushes || 0);
  var tide = Math.min(log.length, est + 2);
  var walked = Math.min(moved, est);

  /* 每一格頭上掛的是那一天動的是哪一段。廊道因此讀得出形狀——
     七格同一個顏色跟七格五顏六色，是完全不同的一趟。 */
  var byTile = [];
  var k0 = 0;
  for (i0 = 0; i0 < log.length; i0++) {
    if (log[i0] && log[i0].kind === 'move') byTile[k0++] = log[i0].step;
  }
  var rests = 0;
  for (i0 = 0; i0 < log.length; i0++) if (log[i0] && log[i0].kind === 'rest') rests++;

  var seed = t.teamId + (run ? '|' + run.runId : '');
  var light = WORLD.light[st.level];
  var span = Math.max(est, tide);
  var W = SCN.ENT + span * SCN.TILE + SCN.END;
  /* 走到多深，牆、地板、天花板、地上的東西、擋路的那一隻，全部跟著換。
     世界觀不寫在說明裡，寫在牆上。 */
  var zone = strataAt(depthOf(t.teamId), t.teamId);

  var H = ['<div class="scn ' + light.key + ' z-' + zone.key + '">'];


  /* 固定在角落的深度。走廊往旁邊捲，它不跟著捲——
     那是「你在多深的地方」，不是走廊上的一個位置。 */
  H.push('<div class="scn-hud">' +
    '<em>' + esc(zone.name) + '</em>' +
    '<b>' + (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</b>' +
    '<span>走完 ' + depthOf(t.teamId) + ' 個里程碑</span>' +
    '<span class="zn-note">' + esc(zone.note) + '</span></div>');

  H.push('<div class="scn-scroll"><div class="scn-in" style="width:' + W + 'px">');

  /* ── 天花板：鐘乳石 ── */
  for (var d = 0; d < Math.ceil(W / 44); d++) {
    var dp = dripFor(seed, d);
    if (!dp) continue;
    H.push('<span class="drip" style="left:' + (d * 44 + dp.off) + 'px">' +
      pxTag(dp.px, zone.pal, '') + '</span>');
  }

  /* ── 洞口 ── */
  H.push(sceneMouth(t, { kind: kind }));

  /* ── 地板 ── */
  H.push('<div class="floor" style="left:0;width:' + W + 'px"></div>');
  if (walked > 0) {
    H.push('<div class="floor lit" style="left:' + SCN.ENT + 'px;width:' +
      (walked * SCN.TILE) + 'px"></div>');
  }

  /* ── 一天一格 ── */
  for (var i = 0; i < span; i++) {
    var x = SCN.ENT + i * SCN.TILE;
    var on = i < walked;

    /* 火把：走過的那幾格點著 */
    H.push(torchAt(x + 6, on, i));

    /* 腳印 */
    if (on) H.push('<img class="px foot" style="left:' + (x + 11) + 'px" src="' +
      pxSvg(STEP_PX.px, STEP_PX.pal, false) + '" alt="">');

    /* 那一天動的是哪一件。畫顏色不畫字——名字長度不一定，
       塞不進 44px；顏色對到哪一件，清單上看一次就記得了。 */
    if (on && byTile[i] >= 0) {
      H.push('<span class="doing" style="left:' + x + 'px;background:' +
        stepHue(byTile[i]) + '" title="' + esc(stepName(run.runId, byTile[i])) +
        '"></span>');
    }

    /* 第幾天 */
    H.push('<span class="dayn' + (i === walked ? ' here' : (on ? ' past' : '')) +
      '" style="left:' + x + 'px">' + (i + 1) + '</span>');

    /* 走通的地方才長得出東西，而且每一層長的不一樣（見 12-props.js）。
       全部用那一層的配色——換了地方，連地上的石頭都該換顏色。 */
    if (on) {
      var p = propFor(seed, i, zone.key);
      if (p === 'rubble') H.push('<img class="px prop rubble" style="left:' + (x + 5) +
        'px" src="' + pxSvg(RUBBLE.px, zone.pal, false) + '" alt="">');
      if (p === 'crystal') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(CRYSTAL.px, zone.pal, false) + '" alt="">');
      if (p === 'shroom') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(SHROOM.px, zone.pal, false) + '" alt="">');
      if (p === 'bolt') H.push('<img class="px prop cry" style="left:' + (x + 22) +
        'px" src="' + pxSvg(BOLT.px, zone.pal, false) + '" alt="">');
      if (p === 'ember') H.push('<img class="px prop shr" style="left:' + (x + 22) +
        'px" src="' + pxSvg(EMBER.px, zone.pal, false) + '" alt="">');
    }
  }

  /* ── 時間漲上來的水 ──
     一天一格，你按不按它都會漲。水在你後面＝走在自己承諾的前面；
     淹到腳邊＝剛好；過去了＝會比說的久，而且好幾天前就看得到。
     它不扣任何東西，走到底一樣可以交——它只是把時間畫出來。 */
  if (run && tide > 0) {
    H.push('<div class="tide" style="left:' + SCN.ENT + 'px;width:' +
      (tide * SCN.TILE) + 'px"></div>');
    H.push('<div class="tide-edge" style="left:' + (SCN.ENT + tide * SCN.TILE - 4) + 'px"></div>');
  }

  /* ── 魔物 ── */
  if (run) H.push(sceneMob(t, row, Math.min(1, walked / est), span));

  /* ── 角色 ── */
  var pose = st.level >= 2 ? HERO.sleep : HERO.idle;
  var hx = SCN.ENT + walked * SCN.TILE - 11;
  H.push('<div class="hero scn-hero' + (st.level >= 2 ? ' asleep' : '') +
    '" style="left:' + hx + 'px">');
  H.push(pxTag(pose, HERO.pal, 'ch'));
  if (st.level === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine'));
  H.push('</div>');

  /* 角色手上那一盞的光。一圈一圈地暗下去，不是模糊的漸層——
     模糊的話它會立刻看起來像貼在像素圖上面的現代特效。 */
  H.push('<div class="halo" style="left:' + (hx - 121) + 'px"></div>');

  /* ── 霧 ──
     從站的地方往前蓋住。它蓋的是「還沒走的那幾天」，
     所以往前一格霧就退一格。 */
  var fogAt = SCN.ENT + (Math.max(walked, tide) + 1) * SCN.TILE;
  if (fogAt < W) {
    H.push('<div class="fog" style="left:' + fogAt + 'px"></div>');
  }

  H.push('</div></div>');   /* scn-in / scn-scroll */

  /* 底下那一行。三個數字就是整個處境，不用一句話解釋。 */
  if (run) {
    H.push('<div class="scn-foot">');
    H.push('<span class="sf you"><b>' + moved + '</b>你來過</span>');
    H.push('<span class="sf tide"><b>' + tide + '</b>過了幾天</span>');
    H.push('<span class="sf est"><b>' + est + '</b>你說的</span>');
    if (rests) H.push('<span class="sf rest"><b>' + rests + '</b>說沒動</span>');
    H.push('</div>');
  }

  H.push('</div>');         /* scn */
  return H.join('');
}

/* ---------- 洞口 ----------
   左邊是你進來的地方：拱門、從上面落下來的光、掛著的招牌。
   招牌就在這裡，不在標題列——它是廊道入口的看板，不是頁首。 */
/* 洞口。招牌、營火、岩心架、往上的光——全部在這裡，而且一直在。

   為什麼要一直在：沒觸發過的東西等於不存在。一個學生如果從來沒有
   失準過，他整學期不會知道有營火這個地方；一個還沒封存過的人不會
   知道岩心架是什麼。所以它們在那裡，只是沒點著——
   「看得到但還沒發生」跟「不存在」是兩件事。 */
function sceneMouth(t, next) {
  var sg = signOf(t.teamId);
  var kind = next && next.kind;
  var ks = keepsOf(t.teamId);
  var H = ['<div class="mouth" style="width:' + SCN.ENT + 'px">'];

  /* 往上的光：出口。一直在，走出去之前它就只是一道光。 */
  H.push('<div class="shaft' + (t.exitAsk || t.leftAt ? ' open' : '') + '"></div>');
  H.push('<div class="arch"></div>');

  /* 招牌 */
  H.push('<div class="hang">');
  H.push('<div class="chain"></div>');
  H.push(pxTag(sg.px, sg.pal, 'sign'));
  H.push('</div>');
  H.push('<div class="mouth-txt"><b>' + esc(t.project || '（還沒定）') + '</b></div>');

  /* 營火。失準的時候才點著，其餘時候是一堆沒點的柴。 */
  H.push('<button class="mfire' + (kind === 'camp' ? ' lit' : '') + '"' +
    ' data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'peek:camp' })) + '\'' +
    ' title="' + esc(kind === 'camp' ? '營火：說一下哪一段比想的久'
                                     : '營火（還沒點著）') + '">' +
    pxTag(CAMPFIRE.px, kind === 'camp' ? CAMPFIRE.pal : COLD_PAL, '') + '</button>');

  /* 岩心架。封存過的掛在這裡，一根都沒有的時候是空架子。 */
  H.push('<button class="mrack" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'go:pack' })) + '\' title="' +
    esc(ks.length ? '岩心架：' + ks.length + ' 根' : '岩心架（還是空的）') + '">');
  if (ks.length) {
    ks.slice(-3).forEach(function (k) {
      var kz = STRATA[0];
      STRATA.forEach(function (x) { if (x.key === k.zone) kz = x; });
      H.push(pxTag(k.px || coreOf(k.runId), kz.pal, 'mcore'));
    });
  } else {
    H.push('<i></i><i></i><i></i>');
  }
  H.push('</button>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 魔物 ----------
   站在走廊盡頭。清楚到什麼程度跟你走了多少有關——
   剛出發的時候只看得到一團影子，走到底才看得清牠長什麼樣。 */
function sceneMob(t, row, prog, span) {
  var mob = mobOfRun(row.run);
  var pal = strataAt(depthOf(t.teamId), t.teamId).pal;
  var x = SCN.ENT + span * SCN.TILE + 33;
  /* 這裡本來還掛一塊寫著里程碑名字的木牌。拿掉了：它浮在半空、會壓到
     角落那一塊，而且那個名字底下那張卡已經有一次——同一件事說兩遍，
     其中一遍看起來就會像壞掉的東西。 */
  var H = [];
  H.push('<div class="scn-mob" style="left:' + x + 'px;opacity:' +
    (0.40 + 0.60 * prog).toFixed(2) + '">');
  H.push(pxTag(mob.px, pal, 'ch'));
  H.push('<span class="mobn">' + esc(mob.n) + '</span>');
  H.push('</div>');
  return H.join('');
}

/* ---------- 火把 ----------
   三幀真的換圖，不是用 CSS 做出來的「像火」。每一盞的速度差一點點，
   不然一整排會一起眨眼，那看起來像壞掉的燈管不像火。 */
function torchAt(x, lit, i) {
  if (!lit) {
    return '<img class="px tor dead" style="left:' + x + 'px" src="' +
      pxSvg(TORCH.dead, TORCH.deadPal, false) + '" alt="">';
  }
  var ms = [300, 360, 420, 340][hash('t' + i) % 4];
  var H = ['<span class="tor" style="left:' + x + 'px;--fd:' + ms + 'ms">'];
  TORCH.frames.forEach(function (f, n) {
    H.push('<img class="px f f' + n + '" src="' + pxSvg(f, TORCH.pal, false) + '" alt="">');
  });
  H.push('</span>');
  return H.join('');
}

/* 重畫之後把角色捲進畫面裡。

   走廊比視窗長的時候，重畫預設會回到最左邊——那樣按了推進之後，
   會看到走廊動了但看不到自己動。這一支讓鏡頭跟著人走。 */
function scrollScene() {
  var box = document.querySelector('.scn-scroll');
  var hero = document.querySelector('.scn-hero');
  if (!box || !hero) return;
  var want = hero.offsetLeft + hero.offsetWidth / 2 - box.clientWidth / 2;
  box.scrollLeft = Math.max(0, want);
}


/* ===== 62-eco.js ===== */
/* 全班地下城：一張地質剖面。

   這是「關聯性」那根柱子的全部，而且它只做一件事：
   讓你看得到別人也在下面——不比較、不排名、不知道誰比較好。

   為什麼是剖面而不是列表：列表只要有兩列就會被讀成名次，剖面讀起來
   是一個地方。每一組往下走自己的一條廊道，廊道之間沒有共同的終點線，
   因為每一組的專案本來就不一樣。

   岩層（見 13-strata.js）是全班共用的地質，不是關卡。誰都看得到全部
   四層，沒有哪一層需要「開」。深度變了岩石就變了，就這樣。

   岩壁裡住著東西。牠們跟任何一組的進度都無關，就只是住在那裡——
   擋在你走廊盡頭的那一隻，只是其中一隻。點一下看牠是什麼。

   立體感來自每一塊右邊的側面（見 54-eco.css），不是把整條廊道斜著推——
   正交的長條看起來像進度表，有側面的廊道看起來像地下城。 */

var XS = {
  RULER: 154,    /* 左邊：深度尺與層的名字 */
  W: 110,        /* 一條廊道的寬 */
  GAP: 66,       /* 廊道之間的牆 */
  SEG: 55,       /* 一個里程碑的深度 */
  SURF: 88,      /* 地表那一段 */
  ROCK: 264      /* 最右邊留一大塊沒有人走過的岩壁，給生態用 */
};

function xsTop(d) { return XS.SURF + d * XS.SEG; }
function xsX(i) { return XS.RULER + i * (XS.W + XS.GAP); }

/* ---------- 整張圖 ---------- */
function xsScene(rows, meId, classId) {
  /* 畫多深：最深的那一組再往下兩格，讓底下永遠還有沒有人走過的岩石。
     這很重要——底部如果切齊最深的人，那條線就變成終點線了。 */
  var deep = rows.reduce(function (a, r) {
    return Math.max(a, r.depth + (r.at > 0 ? 1 : 0));
  }, 0);
  var maxD = Math.max(5, deep + 2);
  var W = xsX(rows.length) + XS.ROCK;
  var H = xsTop(maxD) + 44;

  var out = ['<div class="xsec-wrap"><div class="xsec" style="width:' + W +
    'px;height:' + H + 'px">'];

  /* ── 地層 ──
     層沒有固定深度：順序是一個班洗一次，六層走完回到第一層。
     所以帶子從班級的路線算，每 ZONE_SPAN 格一帶，一直排到底。
     同一個班的每一組看到的是同一片地質——那是「我們在同一個地方」。 */
  for (var bd = 0; bd * ZONE_SPAN < maxD; bd++) {
    var zs = strataAt(bd * ZONE_SPAN, classId);
    var top = xsTop(bd * ZONE_SPAN);
    var bot = xsTop(Math.min((bd + 1) * ZONE_SPAN, maxD));
    out.push('<div class="xs-band ' + zs.key + '" style="top:' + top +
      'px;height:' + (bot - top) + 'px;width:' + W + 'px"></div>');
    out.push('<div class="xs-bandn ' + zs.key + '" style="top:' + (top + 6) + 'px">' +
      '<b>' + esc(zs.name) + '</b><span>' + esc(zs.note) + '</span></div>');
  }

  /* ── 岩壁裡的東西 ── */
  out.push(xsFauna(rows.length, maxD, classId));

  /* ── 地表 ── */
  out.push('<div class="xs-sky" style="width:' + W + 'px"></div>');
  out.push('<div class="xs-surf" style="width:' + W + 'px"></div>');

  /* ── 深度尺。只標數字，不標「應該到哪」 ── */
  for (var d = 1; d <= maxD; d++) {
    out.push('<div class="xs-rule" style="top:' + xsTop(d) + 'px;width:' + W + 'px">' +
      '<span>' + (d * WORLD.depthPerMilestone) + ' m</span></div>');
  }

  /* ── 每一組一條廊道 ── */
  rows.forEach(function (r, i) {
    out.push(xsShaft(r, i, maxD, r.teamId === meId));
  });

  out.push('</div></div>');
  return out.join('');
}

/* ---------- 岩壁裡的生態 ----------
   位置用層與槽算，不擲骰子。每次打開，同一隻都在同一個地方——
   會亂跳的東西不是生態，是特效。 */
function xsFauna(nTeams, maxD, classId) {
  var out = [];
  /* 放得下的地方：每一條廊道右邊那道牆，加上最右邊那一大塊 */
  var slots = [];
  for (var i = 0; i < nTeams; i++) slots.push(xsX(i) + XS.W + 14);
  slots.push(xsX(nTeams) + 33);
  slots.push(xsX(nTeams) + 154);
  slots.push(xsX(nTeams) + 88);

  for (var bd = 0; bd * ZONE_SPAN < maxD; bd++) {
    var s = strataAt(bd * ZONE_SPAN, classId);
    var lo = xsTop(bd * ZONE_SPAN);
    var hi = xsTop(Math.min((bd + 1) * ZONE_SPAN, maxD));
    if (hi - lo < 55) continue;
    /* 用「第幾帶」而不是層的 key 當種子——同一層在不同深度再出現一次的
       時候，住在裡面的不該是同一隻站在同一個位置。 */
    xsPlace(out, slots, s, bd, lo, hi);
  }
  return out.join('');
}

function xsPlace(out, slots, s, bd, lo, hi) {
  slots.forEach(function (x, n) {
    var h = hash(s.key + '/' + bd + '/' + n);
    if (h % 100 < 42) return;
    var c = faunaAt(s.key, bd * 7 + n);
    if (!c) return;
    var y = lo + 11 + ((h >> 5) % Math.max(1, hi - lo - 55));
    out.push('<button class="xs-fauna" style="left:' + x + 'px;top:' + y + 'px" ' +
      'data-act="run" data-p=\'' + esc(JSON.stringify({ a: 'fauna:' + c.n })) + '\' ' +
      'title="' + esc(c.n) + '">' + pxTag(c.px, s.pal, '') + '</button>');
  });
}

/* ---------- 一條廊道 ---------- */
function xsShaft(r, i, maxD, mine) {
  var x = xsX(i);
  var H = [];
  H.push('<div class="xs-shaft' + (mine ? ' mine' : '') + '" style="left:' + x +
    'px;width:' + XS.W + 'px">');

  /* 入口。招牌立在地表上，不是埋在土裡。 */
  var sg = SIGNS[r.sign] || SIGNS.wood;
  H.push('<div class="xs-head">');
  H.push(pxTag(sg.px, sg.pal, 'sign-s'));
  H.push('<b>' + esc(r.name) + '</b>');
  H.push('<span>' + esc(r.project || '（還沒定）') + '</span>');
  H.push('<i class="s-' + r.status.key + '">' + esc(r.status.label) +
    (r.status.days ? ' ' + r.status.days + ' 天' : '') + '</i>');
  H.push('</div>');

  /* 打通的每一格 */
  for (var d = 0; d < maxD; d++) {
    var dug = d < r.depth;
    var here = d === r.depth && r.at > 0;
    var band = strataAt(d, r.teamId);
    H.push('<div class="xs-seg ' + band.key + (dug ? ' dug' : '') + (here ? ' here' : '') +
      '" style="top:' + xsTop(d) + 'px">');
    if (here) H.push('<i style="height:' + Math.round(r.at * 100) + '%"></i>');
    H.push('</div>');
  }

  /* 小人站在最深的那一格 */
  var at = r.depth + (r.at > 0 ? 1 : 0);
  var pose = r.stall >= 2 ? HERO.sleep : HERO.idle;
  H.push('<div class="xs-hero' + (r.stall >= 2 ? ' sleep' : '') + '" style="top:' +
    (xsTop(Math.max(0, at - 1)) + 11) + 'px">');
  H.push(pxTag(pose, HERO.pal, 'ch-s'));
  if (r.stall === 1) H.push(pxTag(VINE.px, VINE.pal, 'vine-s'));
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 點開的那一隻 ----------
   生態不是背景。點得開才叫生態——不然那些圖只是牆紙。 */
function faunaCard() {
  var pick = DRAFT.fa;
  if (!pick) {
    return '<div class="card dim">岩壁裡住著東西。點任何一隻，看牠是什麼。' +
      '牠們跟哪一組走到多深都沒有關係——牠們只是住在那裡。</div>';
  }
  var c = faunaByName(pick);
  if (!c) return '';
  var s = null;
  STRATA.forEach(function (x) { if (x.name === c.r) s = x; });
  var H = ['<div class="card fa ' + (s ? s.key : '') + '">'];
  H.push('<div class="fa-in">');
  H.push(pxTag(c.px, (s || STRATA[0]).pal, 'fa-px'));
  H.push('<div>');
  H.push('<div class="eyebrow">' + esc(c.r) + '</div>');
  H.push('<h2>' + esc(c.n) + '</h2>');
  H.push('<p class="lead">' + esc(c.t) + '</p>');
  H.push('<p class="dim">牠住在這一層。你走到這一層的時候，' +
         '擋在廊道盡頭的就是這一層的住民——同一個里程碑，每一組遇到的不是同一隻。</p>');
  H.push('</div></div></div>');
  return H.join('');
}

ACTS.fauna = function (name) { DRAFT.fa = name; render(); };

/* 圖例。看得懂才叫呈現。 */
function xsLegend() {
  var H = ['<div class="card"><div class="eyebrow">這張圖在說什麼</div><div class="lg">'];
  H.push('<div><b class="lg-dug"></b><span>打通的廊道＝走完的里程碑</span></div>');
  H.push('<div><b class="lg-here"></b><span>正在走的那一格＝這一趟走到哪</span></div>');
  H.push('<div><b class="lg-hero"></b><span>小人＝那一組現在在多深的地方</span></div>');
  H.push('<div><b class="lg-fa"></b><span>岩壁裡的東西＝住在那一層的生物</span></div>');
  H.push('</div>');
  H.push('<p class="dim">深度是走完幾個里程碑。每一組的專案不一樣，' +
         '廊道長度本來就不同——這裡沒有共同的終點線，也沒有排名。' +
         '最底下永遠留著沒有人走過的石頭——往下走不出去，六層會一直重來。</p>');

  return H.join('');

function ecoRows(classId) {
  return ecology(classId).map(function (r) {
    var tm = teamOf(r.teamId);
    r.project = tm && tm.project;
    return r;
  });
}
