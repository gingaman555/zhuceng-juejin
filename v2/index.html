<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地心圖鑑 v2</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'C11';src:url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@v1.500/fonts/web/Cubic_11.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* 樣子。

   字級只用 11 的倍數——Cubic 11 是 11px 的點陣字，放到 13px、17px 會糊掉。
   所以整份只有 11 / 22 / 33 / 44 / 55 / 66 六級，沒有中間值。 */

:root{
  --bg:#0B0A09; --panel:#14110D; --panel2:#1A1611; --sunk:#0E0C0A;
  --line:#2E2822; --line2:#443B31;
  --ink:#E8E0D2; --dim:#9A8F7D; --mute:#63594C;
  --gold:#E9B341; --gold2:#F5CB74; --gold-d:#7A5A18;
  --ok:#7CC98F; --over:#D9603F; --warn:#E9B341;
  --L:#C9A227; --Ld:#9A7E22; --Ll:#F2E6C8; --Lbg:#171208; --Lline:#3A2E12;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:'C11','Noto Sans TC',monospace;
  font-size:22px; line-height:1.7;
  -webkit-font-smoothing:none;
  image-rendering:pixelated;
}
button,input,textarea,select{font-family:inherit;font-size:22px;color:inherit}
img{display:block}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 版面 ---------- */

#app{display:flex;min-height:100vh}

.side{
  width:242px;flex:0 0 242px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto
}
.side-head{padding:22px;border-bottom:1px solid var(--line)}
.side-head .k{font-size:11px;color:var(--mute);letter-spacing:.2em}
.side-head .n{font-size:22px;margin-top:5px}
.side-head .s{font-size:11px;color:var(--dim);margin-top:5px}

.nav{padding:11px 0;flex:1}
.nav a{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  color:var(--dim);cursor:pointer;border-left:3px solid transparent;font-size:22px
}
.nav a:hover{color:var(--ink);background:var(--panel2)}
.nav a.on{color:var(--gold);background:var(--panel2);border-left-color:var(--gold)}
.nav a .dot{width:11px;height:11px;background:currentColor;opacity:.55;flex:0 0 11px}
.nav a.on .dot{opacity:1}
.nav .gap{height:11px}

.main{flex:1;min-width:0}
.wrap{max-width:1078px;padding:33px 44px 88px}

/* ---------- 頂條 ---------- */

.top{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;font-size:11px;color:var(--dim);flex-wrap:wrap
}
.top .who{font-size:22px;color:var(--ink)}
.top .sp{flex:1}
.badge{
  display:inline-block;padding:2px 8px;font-size:11px;
  background:var(--gold);color:#1A1408
}
.badge.t{background:#7C6BC7;color:#F0ECFF}

/* 試用列：只有原型有。真的上線沒有這一條。 */
.demo{
  display:flex;align-items:center;gap:11px;padding:11px 22px;flex-wrap:wrap;
  background:#100D0A;border-bottom:1px solid var(--line);font-size:11px;color:var(--mute)
}
.demo b{color:var(--dim);font-weight:400}

/* ---------- 元件 ---------- */

.eyebrow{font-size:11px;color:var(--mute);letter-spacing:.2em;margin-bottom:5px}
h1{font-size:44px;line-height:1.35;margin:0 0 11px;font-weight:400}
h2{font-size:33px;line-height:1.45;margin:44px 0 11px;font-weight:400}
h3{font-size:22px;line-height:1.6;margin:22px 0 11px;font-weight:400}
p{margin:0 0 11px}
.lead{font-size:22px;color:var(--dim);max-width:63ch}
.fine{font-size:11px;color:var(--mute);line-height:1.9}
.fine b{color:var(--dim);font-weight:400}

.card{
  background:var(--panel);border:1px solid var(--line);padding:22px;margin-bottom:22px
}
.card.sunk{background:var(--sunk)}
.card.hot{border-color:var(--gold-d);background:linear-gradient(180deg,#1C1710,#141009)}
.card.layer{border-color:var(--Lline);background:var(--Lbg)}

.row{display:flex;gap:22px;flex-wrap:wrap}
.row>*{flex:1;min-width:242px}
.grid{display:grid;gap:11px}

.btn{
  display:inline-block;padding:11px 22px;background:var(--gold);color:#1A1408;
  border:0;cursor:pointer;box-shadow:4px 4px 0 #00000099;font-size:22px;line-height:1.4
}
.btn:hover{background:var(--gold2)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #00000099}
.btn[disabled]{background:var(--line);color:var(--mute);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px dashed var(--gold-d);box-shadow:none}
.btn.ghost:hover{background:#1A1408;color:var(--gold2)}
.btn.flat{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.flat:hover{border-color:var(--dim)}
.btn.sm{font-size:11px;padding:8px 11px;box-shadow:2px 2px 0 #00000099}
.btn.wide{width:100%;text-align:center}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:11px;
  border:1px solid var(--line2);color:var(--dim)
}
.pill.ok{border-color:#2F5C3A;color:var(--ok)}
.pill.gold{border-color:var(--gold-d);color:var(--gold)}
.pill.over{border-color:#5C2A1B;color:var(--over)}
.pill.hand{border-color:var(--gold);color:var(--gold);background:#1A1408}

.kv{display:flex;gap:11px;align-items:baseline;font-size:11px;color:var(--mute)}
.big{font-size:55px;line-height:1.1;color:var(--gold)}
.big.plain{color:var(--ink)}

label{display:block;font-size:11px;color:var(--dim);margin:11px 0 5px}
input[type=text],input[type=date],textarea,select{
  width:100%;background:var(--sunk);border:1px solid var(--line);
  color:var(--ink);padding:11px;outline:0
}
input:focus,textarea:focus,select:focus{border-color:var(--gold-d)}
textarea{resize:vertical;min-height:99px;line-height:1.7}
::placeholder{color:var(--mute)}

.sep{height:1px;background:var(--line);margin:22px 0}

/* 勾選：0 分，所以它長得不像分數。 */
.check{
  display:flex;gap:11px;align-items:flex-start;padding:11px;cursor:pointer;
  border:1px solid transparent
}
.check:hover{background:var(--panel2)}
.check .box{
  width:22px;height:22px;flex:0 0 22px;border:1px solid var(--line2);
  background:var(--sunk);color:var(--gold);text-align:center;line-height:20px;font-size:11px
}
.check.on .box{background:var(--gold);color:#1A1408;border-color:var(--gold)}
.check.lock{cursor:default;opacity:.75}
.check.lock:hover{background:transparent}

/* 三選一 */
.seg{display:flex;gap:0;border:1px solid var(--line2);width:fit-content;flex-wrap:wrap}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--line2);
  padding:11px 22px;cursor:pointer;color:var(--dim);font-size:22px
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold);color:#1A1408}
.seg button:hover:not(.on){background:var(--panel2);color:var(--ink)}

/* ---------- 生物與物品 ---------- */

.mob{
  display:flex;gap:22px;align-items:center;border:1px solid var(--Lline);
  background:var(--Lbg);padding:22px
}
.mob img{width:132px;height:88px;object-fit:contain;flex:0 0 132px}
.mob.sm img{width:66px;height:44px;flex:0 0 66px}
.mob .n{font-size:22px;color:var(--Ll)}
.mob .t{font-size:11px;color:var(--dim);line-height:1.9}

.slot{
  width:100%;aspect-ratio:1;background:var(--sunk);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer
}
.slot img{width:80%;height:80%;object-fit:contain}
.slot.off{cursor:default}
.slot.off:after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,#FFFFFF07,transparent 70%)
}
.slot.on:hover{border-color:var(--line2)}
.slot .q{font-size:22px;color:#251F19}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(77px,1fr));gap:5px}
.dexname{font-size:11px;color:var(--mute);text-align:center;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 清單列 ---------- */

.item{
  display:flex;gap:22px;align-items:flex-start;border:1px solid var(--line);
  background:var(--panel);padding:22px;margin-bottom:11px;cursor:pointer
}
.item:hover{border-color:var(--line2);background:var(--panel2)}
.item .body{flex:1;min-width:0}
.item .t{font-size:22px}
.item .m{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.9}
.item .art{
  width:66px;height:66px;flex:0 0 66px;background:var(--sunk);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center
}
.item .art img{width:88%;height:88%;object-fit:contain}
.item .art .q{color:#2A241E;font-size:22px}
.item.flat{cursor:default}
.item.flat:hover{border-color:var(--line);background:var(--panel)}

/* ---------- 地圖 ---------- */
/* 只有一條軸：深度。層裡面不鋪格子——任務沒有順序。 */

.map{border:1px solid var(--line);background:var(--sunk)}
.map .band{
  position:relative;border-bottom:1px solid var(--line);padding:22px;min-height:110px;
  display:flex;align-items:center;gap:22px
}
.map .band:last-child{border-bottom:0}
.map .band .lab{width:176px;flex:0 0 176px}
.map .band .code{font-size:11px;color:var(--mute);letter-spacing:.2em}
.map .band .nm{font-size:22px}
.map .band .field{flex:1;position:relative;height:66px}
.map .fog{
  position:absolute;inset:0;background:repeating-linear-gradient(
    135deg,#1A1611 0 6px,#141009 6px 12px);opacity:.9;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute)
}
.map .guy{position:absolute;top:50%;transform:translateY(-50%);text-align:center}
.map .guy .p{font-size:22px}
.map .guy .g{font-size:11px;color:var(--dim);white-space:nowrap}
.map .guy.me .p{color:var(--gold)}
.map .boss{position:absolute;right:11px;top:50%;transform:translateY(-50%);opacity:.8}
.map .boss img{width:55px;height:55px;object-fit:contain}

/* ---------- 結算 ---------- */

.drop{
  display:flex;gap:11px;flex-wrap:wrap;padding:22px;background:var(--sunk);
  border:1px solid var(--line)
}
.drop .one{width:88px;text-align:center}
.drop .one img{width:66px;height:66px;object-fit:contain;margin:0 auto}
.drop .one .n{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5}
.drop .one .q{font-size:11px;color:var(--mute)}

.stamp{
  display:inline-block;border:2px solid var(--ok);color:var(--ok);
  padding:5px 11px;font-size:22px;transform:rotate(-2deg)
}
.stamp.back{border-color:var(--over);color:var(--over)}

/* 並排：你們寫的 ／ 他給的 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pair>div{background:var(--sunk);border:1px solid var(--line);padding:11px}
.pair .h{font-size:11px;color:var(--mute);margin-bottom:5px}
@media (max-width:900px){ .pair{grid-template-columns:1fr} }

/* 往返紀錄 */
.log{border-left:1px solid var(--line);padding-left:22px;margin-left:11px}
.log .n{position:relative;padding-bottom:22px}
.log .n:before{
  content:'';position:absolute;left:-27px;top:9px;width:9px;height:9px;background:var(--line2)
}
.log .n.ok:before{background:var(--ok)}
.log .n.back:before{background:var(--over)}
.log .h{font-size:11px;color:var(--mute)}
.log .b{font-size:22px;line-height:1.7;margin-top:5px}

/* 剖面：深度對時間 */
.curvebox{border:1px solid var(--line);background:var(--sunk);padding:11px;overflow-x:auto}
.curve{width:100%;min-width:583px;height:auto;display:block;font-family:'C11','Noto Sans TC',monospace}

/* 排行榜 */
.rank{border:1px solid var(--line);background:var(--panel);padding:22px;margin-bottom:11px}
.rank.me{border-color:var(--gold-d);background:#161209}
.rank .top{background:transparent;border:0;padding:0;position:static;display:flex;
  align-items:baseline;gap:11px}
.rank .no{font-size:33px;color:var(--gold);width:44px}
.rank .nm{font-size:22px;flex:1}
.rank .sc{font-size:33px}
.rank .how{font-size:11px;color:var(--mute);margin-top:11px}

.hr{height:1px;background:var(--line);margin:11px 0}

a.plain{color:var(--gold);cursor:pointer;text-decoration:none}
a.plain:hover{color:var(--gold2)}

.ta-r{text-align:right}
.mt0{margin-top:0}
.nowrap{white-space:nowrap}

</style>
</head>

<div id="app"></div>

/* 老師給分的六個錨點。分數就是索引，所以順序不能動。 */
RULES.GAVE = [
  { n: 0, anchor: '完全沒有', effect: '抽數 ＝ 層數（無加成）' },
  { n: 1, anchor: '幾乎沒有', effect: '＋1 次' },
  { n: 2, anchor: '有一點', effect: '＋2 次' },

/* 老師那一格的題目。它是一個陳述句，不是問句——老師是在判斷這句話成不成立。

RULES.GAVE_STATEMENT =

  '給了不同的做法，或是有額外的產出。';

function clamp(lo, hi, n) { return Math.max(lo, Math.min(hi, n)); }

/* 抽幾次 ＝ clamp(1, 8, 層數 ＋ 老師給的 0–5)
   L1 給 0 ＝ 抽 1 次；L4 給 5 ＝ 抽 8 次（上限）。 */
RULES.draws = function (layer, gave) {
  return clamp(RULES.DRAW_MIN, RULES.DRAW_MAX,
    (Number(layer) || 1) + (Number(gave) || 0));
};

RULES.gaveAnchor = function (g) {
  var row = RULES.GAVE[clamp(RULES.GAVE_MIN, RULES.GAVE_MAX, Number(g) || 0)];
  return row ? row.anchor : RULES.GAVE[0].anchor;
};

/* ---------- 天 ---------- */
/* 週整套拿掉了。這裡沒有任何東西會問「今天禮拜幾」——所以學期中間
   任何一天開始用都一樣。 */

var DAY = 86400000;

function dayStart(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

/* 停留天數：從進到這一層那一刻起算 */
RULES.stayDays = function (enteredAt, now) {
  if (!enteredAt) return 0;
  return Math.max(0, Math.floor(((now || Date.now()) - enteredAt) / DAY));
};

/* 回頭補強：滾動 7 天一次。回傳還要等幾天，0 ＝ 現在就可以送。 */
RULES.redigWaitDays = function (lastAt, now) {
  if (!lastAt) return 0;
  var passed = ((now || Date.now()) - lastAt) / DAY;
  return Math.max(0, Math.ceil(RULES.REDIG_DAYS - passed));
};

/* ---------- 期限 ---------- */
/* 幾天後／指定日期／不設限。逾期只標示，不阻擋。 */

var WEEK_CH = ['日', '一', '二', '三', '四', '五', '六'];

RULES.due = function (due, now) {
  if (!due) return { none: true, text: '不設限', tone: 'mute' };
  var d = new Date(due);
  var left = Math.round((dayStart(due) - dayStart(now || Date.now())) / DAY);
  var head = (d.getMonth() + 1) + '/' + d.getDate() + '（' + WEEK_CH[d.getDay()] + '）';
  if (left > 0) return { text: head + ' · 還有 ' + left + ' 天', left: left, tone: left <= 2 ? 'warn' : 'ok' };
  if (left === 0) return { text: head + ' · 就是今天', left: 0, tone: 'warn' };
  return { text: head + ' · 逾期 ' + (-left) + ' 天', left: left, over: true, tone: 'over' };
};

/* ---------- 分數怎麼來的 ---------- */
/* 排行榜每一列拆給你看的那一段，跟總分是同一支函式算的——
   不會有「明細加起來不等於總分」這種事。 */
RULES.score = function (t) {
  var parts = [];
  var passed = t.passed || 0, drops = t.drops || 0, released = t.released || 0;
  if (passed)   parts.push({ k: '通過 ' + passed + ' 項', v: passed * RULES.PASS });
  if (drops)    parts.push({ k: '掉落物 ' + drops + ' 件', v: drops * RULES.DROP });
  if (released) parts.push({ k: '放行 ' + released + ' 層', v: released * RULES.RELEASE });
  var total = parts.reduce(function (s, p) { return s + p.v; }, 0);
  return { parts: parts, total: total };
};

  sameWeight: function () {

/* 戰利品是「挑」的，不是「發」的。

/* ===== 30-art.js ===== */
/* 像素圖與「哪一隻／哪一件」的算法。

   這裡的函式全都是純函式：同樣的輸入永遠得到同一隻、同一件。
   沒有任何一個地方會在 render 的時候擲骰子——抽掉落物是後端抽完存起來的，
   畫面只負責把存好的那幾件畫出來。 */

/* 字串雜湊。同一個字串永遠得到同一個數字，兩端都用它。 */
function hash(s) {
  var h = 2166136261;
  s = String(s);
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}

var REGION_L = { '微光荒原': 1, '水晶迴廊': 2, '迴聲迷宮': 3, '熔火深淵': 4 };

/* 依領域分好組，索引就是那一區的第幾個 */
var MOB = [[], [], [], []], DEB = [[], [], [], []], TRO = [[], [], [], []];
PACK.creatures.forEach(function (c) { var L = REGION_L[c.r]; if (L) MOB[L - 1].push(c); });
PACK.trophies.forEach(function (t) { var L = REGION_L[t.r]; if (L) TRO[L - 1].push(t); });
/* 掉落物照「領域 → 稀有度」排，所以整條 1..108 的編號就是「第幾區的第幾件」 */
var FINDS = [];
[0, 1, 2, 3].forEach(function (li) {
  ['常見', '少見', '罕見'].forEach(function (q) {
    PACK.debris.forEach(function (d) {
      if (REGION_L[d.r] !== li + 1 || d.q !== q) return;
      var item = { id: FINDS.length + 1, name: d.n, look: d.l, tier: q, L: li + 1, px: d.px };
      FINDS.push(item); DEB[li].push(item);
    });
  });
});

/* ---------- 畫 ---------- */

var ART_CACHE = {};

/* 像素字元：. 透明 · # 身體 · + 陰影 · * 反光 */
function pxSvg(px, pal, dim) {
  if (!px || !px.length) return '';
  var key = px.join('') + '|' + pal['#'] + '|' + (dim ? 1 : 0);
  if (ART_CACHE[key]) return ART_CACHE[key];
  var W = px[0].length, out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
    W + ' ' + px.length + '" shape-rendering="crispEdges">'];
  px.forEach(function (row, y) {
    for (var x = 0; x < row.length; x++) {
      var ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      var fill = ch === '*' ? pal['*'] : (ch === '+' || ch === 'o') ? pal.o : ch === '~' ? (pal['~'] || pal.o) : pal['#'];
      out.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + fill + '"' +
        (dim ? ' opacity=".26"' : '') + '/>');
    }
  });
  out.push('</svg>');
  ART_CACHE[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.join(''));
  return ART_CACHE[key];
}

function layerPal(L) { return (LAYERS[clamp(1, 4, Number(L) || 1) - 1]).pal; }

function mobArt(c, dim) { return pxSvg(c.px, layerPal(c.L || REGION_L[c.r] || 1), dim); }
function bossArt(b, dim) { return pxSvg(b.px, b.hue, dim); }

/* ---------- 誰擋在這一項前面 ---------- */
/* 同一項任務，不同組遇到的不是同一隻——由任務 id ＋ 組 id 算出來。
   所以「你打贏的那一隻」是你們這一組的事，別組講的是另一隻。 */
function mobFor(taskId, teamId, layer) {
  var list = MOB[clamp(1, 4, layer) - 1];
  var c = list[hash(taskId + '/' + teamId) % list.length];
  return { name: c.n, trait: c.t, px: c.px, L: layer, region: c.r };
}

/* ---------- 抽掉落物 ---------- */
/* 走到第 L 層時，第 1..L 層的都抽得到。稀有度只影響出現機率——
   每一件都一樣重，所以運氣不會決定名次。 */
var TIER_W = { '常見': 60, '少見': 32, '罕見': 8 };

function rollFinds(layer, n, seed) {
  var pool = [];
  for (var i = 0; i < clamp(1, 4, layer); i++) pool = pool.concat(DEB[i]);
  var out = [], h = hash(seed);
  for (var k = 0; k < n; k++) {
    var total = 0, j;
    for (j = 0; j < pool.length; j++) total += TIER_W[pool[j].tier];
    h = (h * 1664525 + 1013904223) >>> 0;
    var pick = (h / 4294967296) * total, acc = 0, chosen = pool[0];
    for (j = 0; j < pool.length; j++) { acc += TIER_W[pool[j].tier]; if (pick < acc) { chosen = pool[j]; break; } }
    out.push(chosen.id);
  }
  return out;
}

/* 守關戰利品：一區六件。放行一層時攤開還沒拿過的裡面的三件，
   讓他們自己挑一件帶走。

   攤開哪三件由「組 ＋ 層」算出來，是純函式——同一組在同一層永遠看到
   同一組三件。它讀不到任何跟表現有關的東西（分數、輪數、天數都不在
   參數裡），所以它不可能變成一個評價。 */
function offerTrophies(layer, ownedIds, seed) {
  var list = TRO[clamp(1, 4, layer) - 1];
  var left = list.filter(function (t) { return ownedIds.indexOf(troId(t)) < 0; });
  if (left.length <= RULES.OFFER) return left.map(troId);
  var h = hash(seed), out = [], pool = left.slice();
  for (var k = 0; k < RULES.OFFER; k++) {
    h = (h * 1664525 + 1013904223) >>> 0;
    out.push(troId(pool.splice(h % pool.length, 1)[0]));
  }
  return out;
}

function troOf(id) {
  for (var L = 0; L < 4; L++)
    for (var i = 0; i < TRO[L].length; i++)
      if (troId(TRO[L][i]) === id) return TRO[L][i];
  return null;
}
function troLayer(id) { return Math.floor(Number(String(id).slice(1)) / 100); }
function troId(t) { return 'T' + (REGION_L[t.r] * 100 + TRO[REGION_L[t.r] - 1].indexOf(t)); }

/* ---------- 你自己的那一隻 ＋ 那一件 ---------- */
/* 從帳號算出來，別人拿不到同一組。不算在 44／136 裡——
   它不是收集進度的一格，是「這一趟從第一天就有的東西」。 */
var MAT = ['霧', '砂', '苔', '灰', '晶', '稜', '光', '脈', '聲', '影', '空', '迴', '燼', '熔', '銹', '焰'];
var ACT = ['面', '擬', '漲', '蝕', '織', '眠', '潛', '裂', '銜'];
var SUF = ['者', '母', '群', '獸'];

function ownMob(account) {
  var h = hash('mob:' + account);
  var body = PACK.creatures[h % PACK.creatures.length];
  var hue = (hash('hue:' + account) % 360);
  var pal = {
    '#': 'hsl(' + hue + ',48%,58%)',
    o:   'hsl(' + hue + ',44%,34%)',
    '*': 'hsl(' + hue + ',60%,84%)'
  };
  var name = (h % 2)
    ? MAT[h % MAT.length] + ACT[(h >> 4) % ACT.length] + SUF[(h >> 8) % SUF.length]
    : ACT[(h >> 4) % ACT.length] + MAT[h % MAT.length] + SUF[(h >> 8) % SUF.length];
  return { name: name, trait: body.t, px: body.px, pal: pal, own: true };
}

function ownFind(account) {
  var h = hash('find:' + account);
  var body = FINDS[h % FINDS.length];
  var hue = (hash('fhue:' + account) % 360);
  return {
    name: MAT[h % MAT.length] + ['砂', '晶', '片', '核', '塊'][(h >> 6) % 5],
    look: body.look, px: body.px, own: true,
    pal: { '#': 'hsl(' + hue + ',44%,60%)', o: 'hsl(' + hue + ',40%,36%)', '*': 'hsl(' + hue + ',58%,86%)' }
  };
}

/* ---------- 圖鑑的總量 ---------- */
/* 生物 44 ＝ 一區 10 隻普通 ＋ 4 隻守關。
   物品 136 ＝ 108 掉落物 ＋ 24 戰利品 ＋ 4 道具。 */
var TOTAL_MOB = PACK.creatures.length + PACK.bosses.length;
var TOTAL_ITEM = FINDS.length + PACK.trophies.length + LAYERS.length;


/* ===== 40-db.js ===== */
/* 假後端。整套跑在瀏覽器裡，存在 localStorage。

   資料表照規格書 08，已經砍掉的那幾張（Plans、Files）跟那幾個欄位
   （toolLevels、enteredWeek、semesterWeeks、mineral、vow）不在這裡。

   所有會算數的地方都呼叫 RULES——這一支不自己算分數、不自己算抽數。 */

var DB = null;
var STORE = 'jlz.v2';

/* 時間。假後端可以被快轉，所以不直接讀 Date.now()。 */
var CLOCK = 0;
function now() { return Date.now() + CLOCK; }

function blank() {
  return {
    Users: [], Classes: [], Roster: [], Teams: [], Tasks: [], TeamTasks: [],
    Submissions: [], Reviews: [], Redigs: [], Checks: [], Passes: [], Picks: [], Finales: [],
    Config: { seq: 1 }
  };
}

function nid(p) { return p + (DB.Config.seq++); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) {} }
function load() {
  try { var s = localStorage.getItem(STORE); if (s) { DB = JSON.parse(s); return true; } } catch (e) {}
  return false;
}
function find(tbl, fn) { for (var i = 0; i < DB[tbl].length; i++) if (fn(DB[tbl][i])) return DB[tbl][i]; return null; }
function where(tbl, fn) { return DB[tbl].filter(fn); }

/* ================= 查 ================= */

function teamOf(id) { return find('Teams', function (t) { return t.teamId === id; }); }
function taskOf(id) { return find('Tasks', function (t) { return t.taskId === id; }); }
function userOf(id) { return find('Users', function (u) { return u.userId === id; }); }
function ttOf(teamId, taskId) {
  return find('TeamTasks', function (x) { return x.teamId === teamId && x.taskId === taskId; });
}

/* 一組在某一層被指派到的所有任務 */
function tasksFor(teamId, layer) {
  return where('Tasks', function (t) {
    return (layer == null || t.layer === layer) && t.teams.indexOf(teamId) >= 0;
  }).sort(function (a, b) { return a.ts - b.ts; });
}
function rowsFor(teamId, layer) {
  return tasksFor(teamId, layer).map(function (t) {
    return { task: t, tt: ttOf(teamId, t.taskId) };
  }).filter(function (r) { return r.tt; });
}

/* 一組現在的分數。明細與總分同一支函式，不會兜不起來。 */
function scoreOf(teamId) {
  var tts = where('TeamTasks', function (x) { return x.teamId === teamId; });
  var passed = tts.filter(function (x) { return x.status === 'done'; }).length;
  var drops = tts.reduce(function (s, x) { return s + (x.finds || []).length; }, 0);
  var released = where('Passes', function (p) { return p.teamId === teamId; }).length;
  return RULES.score({ passed: passed, drops: drops, released: released });
}

/* 有沒有在動：來回幾次、其中幾次是被退回之後改的。不計分，只說明這一組在動。 */
function motionOf(teamId) {
  var subs = where('Submissions', function (s) { return s.teamId === teamId; });
  return { rounds: subs.length, changed: subs.filter(function (s) { return s.attempt > 1; }).length };
}

function classTeams(classId) {
  return where('Teams', function (t) { return t.classId === classId; });
}

/* 排行榜：分數高的在前，同分的照停留天數少的在前 */
function board(classId) {
  return classTeams(classId).map(function (t) {
    return {
      team: t, score: scoreOf(t.teamId), motion: motionOf(t.teamId),
      stay: RULES.stayDays(t.enteredAt, now())
    };
  }).sort(function (a, b) { return b.score.total - a.score.total || a.stay - b.stay; })
    .map(function (r, i) { r.rank = i + 1; return r; });
}

/* ================= 學生端 ================= */

/* 一組在這一層有沒有交齊：老師的佇列吃這個條件。
   老師隨時可以再開一項，所以交齊之後可能又變成沒交齊——那不是退步，
   是這一層本來就沒有「做完」這個狀態。 */
function allIn(teamId, layer) {
  var rows = rowsFor(teamId, layer);
  if (!rows.length) return false;
  var waiting = 0;
  for (var i = 0; i < rows.length; i++) {
    var st = rows[i].tt.status;
    if (st === 'open' || st === 'back') return false;
    if (st === 'sent') waiting++;
  }
  return waiting > 0;
}

/* 首頁那一顆唯一的 CTA。首頁只給一件事，所以這裡只回傳一件。 */
function nextThing(teamId) {
  var team = teamOf(teamId);
  /* 上一層留下的那一件還沒挑。這不是工作，是十秒鐘的一個決定——
     所以它插在最前面，挑完馬上回到原本該做的事。 */
  var pk = pendingPick(teamId);
  if (pk) return { kind: 'pick', pick: pk };
  if (team.finished) return { kind: 'finale' };
  var rows = rowsFor(teamId, team.layer);
  var back = rows.filter(function (r) { return r.tt.status === 'back'; });
  if (back.length) return { kind: 'back', task: back[0].task, cta: '去看他寫了什麼' };
  var open = rows.filter(function (r) { return r.tt.status === 'open'; });
  if (open.length) {
    open.sort(function (a, b) {
      return (a.task.due || Infinity) - (b.task.due || Infinity);
    });
    return { kind: 'open', task: open[0].task, cta: '去做這一項' };
  }
  var sent = rows.filter(function (r) { return r.tt.status === 'sent'; });
  if (sent.length) return { kind: 'wait', n: sent.length };
  /* 手上沒有非做不可的事。系統在這裡主動邀請回頭補強：
     老師給 0 的那一項 ＝ 你交了，但他覺得你沒有多做。 */
  var zero = where('TeamTasks', function (x) {
    return x.teamId === teamId && x.status === 'done' && (x.gave || 0) === 0;
  });
  if (zero.length && redigLeft(teamId) === 0) {
    return { kind: 'redig', task: taskOf(zero[0].taskId), cta: '回頭補強這一項' };
  }
  return { kind: 'idle' };
}

/* 回頭補強：滾動 7 天一次。回傳還要等幾天，0 ＝ 現在就可以送。 */
function redigLeft(teamId) {
  var rs = where('Redigs', function (r) { return r.teamId === teamId; });
  if (!rs.length) return 0;
  var last = rs.reduce(function (m, r) { return Math.max(m, r.ts); }, 0);
  return RULES.redigWaitDays(last, now());
}

/* ---------- 學生的動作 ---------- */

/* 勾選 0 分。它只剩「我走到哪了」，那是它唯一能誠實的條件。 */
function actCheck(teamId, taskId, idx) {
  var tt = ttOf(teamId, taskId);
  if (tt.status === 'done' || tt.status === 'sent') return;
  var on = tt.checked.indexOf(idx) >= 0;
  tt.checked = on ? tt.checked.filter(function (i) { return i !== idx; }) : tt.checked.concat([idx]);
  DB.Checks.push({ teamId: teamId, taskId: taskId, idx: idx, act: on ? 'off' : 'on', ts: now() });
  save();
}
function actEffort(teamId, taskId, v) { ttOf(teamId, taskId).effort = v; save(); }
function actExtra(teamId, taskId, v) { ttOf(teamId, taskId).text = v; save(); }

/* 卡住可以現在就說，不用等送出。隨時可以放下。 */
function actBlocker(teamId, taskId, v) { ttOf(teamId, taskId).blocker = v || ''; save(); }

function actSubmit(teamId, taskId) {
  var tt = ttOf(teamId, taskId);
  if (!tt.effort) return { err: '先回答「這一組現在的狀態」。' };
  tt.attempt = (tt.attempt || 0) + 1;
  tt.status = 'sent';
  tt.sentAt = now();
  DB.Submissions.push({ teamId: teamId, taskId: taskId, attempt: tt.attempt,
    text: tt.text || '', effort: tt.effort, ts: now() });
  save();
  return { ok: true };
}

function actRedig(teamId, taskId, note) {
  var left = redigLeft(teamId);
  if (left > 0) return { err: '還要等 ' + left + ' 天。' };
  DB.Redigs.push({ redigId: nid('R'), teamId: teamId, taskId: taskId, note: note,
    status: 'sent', reason: '', ts: now() });
  save();
  return { ok: true };
}

/* ================= 老師端 ================= */

/* 待你驗收：依停留天數排序，待最久的排最前面。舉手的組排最前面。 */
function queue(classId) {
  return classTeams(classId).map(function (t) {
    var rows = rowsFor(t.teamId, t.layer);
    var sent = rows.filter(function (r) { return r.tt.status === 'sent'; });
    var blockers = rows.filter(function (r) { return r.tt.blocker; });
    var redigs = where('Redigs', function (r) { return r.teamId === t.teamId && r.status === 'sent'; });
    return {
      team: t, stay: RULES.stayDays(t.enteredAt, now()),
      sent: sent, redigs: redigs, blockers: blockers,
      ready: allIn(t.teamId, t.layer)
    };
  }).filter(function (r) { return r.ready || r.blockers.length || r.redigs.length; })
    .sort(function (a, b) {
      var ab = a.blockers.length ? 1 : 0, bb = b.blockers.length ? 1 : 0;
      return bb - ab || b.stay - a.stay;
    });
}

/* 老師寫了幾件合格考量、平均幾個字、學生平均等他多久 */
function teacherStats() {
  var rs = DB.Reviews;
  var chars = rs.reduce(function (s, r) { return s + String(r.reason || '').length; }, 0);
  var lat = rs.reduce(function (s, r) { return s + (r.latency || 0); }, 0);
  return {
    n: rs.length,
    avgChars: rs.length ? Math.round(chars / rs.length) : 0,
    avgWait: rs.length ? (lat / rs.length / 86400000) : 0
  };
}

/* 老師自己寫過三次以上的起頭句——是他的話，不是系統的罐頭。 */
function starters() {
  var seen = {};
  DB.Reviews.forEach(function (r) {
    var head = String(r.reason || '').slice(0, 6);
    if (head.length < 4) return;
    seen[head] = (seen[head] || 0) + 1;
  });
  return Object.keys(seen).filter(function (k) { return seen[k] >= 2; }).slice(0, 4);
}

function actPublish(classId, layer, o) {
  var t = {
    taskId: nid('K'), classId: classId, layer: layer, title: o.title,
    cond: o.cond, note: o.note || '', spec: o.spec || '',
    due: o.due || null, checks: o.checks || [], teams: o.teams || [], ts: now()
  };
  DB.Tasks.push(t);
  t.teams.forEach(function (tid) {
    DB.TeamTasks.push({ teamId: tid, taskId: t.taskId, status: 'open', checked: [],
      text: '', effort: '', blocker: '', gave: 0, finds: [], attempt: 0 });
  });
  save();
  return t;
}

/* 判一項。給的 0–5 只決定抽幾次，不決定過不過。 */
function actReview(teamId, taskId, o) {
  var tt = ttOf(teamId, taskId), task = taskOf(taskId);
  DB.Reviews.push({ teamId: teamId, taskId: taskId, result: o.result, reason: o.reason,
    gave: o.gave, attempt: tt.attempt, latency: tt.sentAt ? (now() - tt.sentAt) : 0, ts: now() });
  if (o.result === 'back') { tt.status = 'back'; save(); return { ok: true }; }
  tt.status = 'done';
  tt.gave = o.gave;
  tt.doneAt = now();
  tt.seen = false;
  var n = RULES.draws(task.layer, o.gave);
  tt.finds = rollFinds(task.layer, n, teamId + '/' + taskId + '/' + tt.attempt);
  save();
  return { ok: true, draws: n };
}

function actRedigJudge(redigId, accept, reason) {
  var r = find('Redigs', function (x) { return x.redigId === redigId; });
  r.status = accept ? 'ok' : 'no';
  r.reason = reason || '';
  r.judgedAt = now();
  if (accept) {
    var tt = ttOf(r.teamId, r.taskId), task = taskOf(r.taskId);
    /* 接受 ＝ 那一項多抽一次（多一件進圖鑑，分數跟著加） */
    tt.finds = (tt.finds || []).concat(rollFinds(task.layer, 1, r.redigId));
    tt.seen = false;
  }
  save();
}

/* 放行。這是整個系統唯一的門。 */
function actRelease(teamId, verdict, reason) {
  var team = teamOf(teamId);
  DB.Passes.push({ teamId: teamId, layer: team.layer, verdict: verdict, reason: reason, ts: now() });
  team.tools = (team.tools || []).concat([team.layer]);
  /* 戰利品不在這裡發。攤開三件，等他們自己挑一件帶走——
     系統不決定誰帶走哪一句話。 */
  DB.Picks.push({ pickId: nid('P'), teamId: teamId, layer: team.layer,
    offer: offerTrophies(team.layer, team.tro || [], teamId + '/' + team.layer),
    chosen: null, ts: now() });
  team.fresh = team.layer;
  if (team.layer < RULES.LAYERS) { team.layer++; team.enteredAt = now(); }
  else team.finished = true;
  save();
}

/* ---------- 挑一件帶走 ---------- */
/* 一組同一時間最多只會有一件在等他們挑。 */

function pendingPick(teamId) {
  return find('Picks', function (p) { return p.teamId === teamId && !p.chosen; });
}

function actPick(pickId, id) {
  var p = find('Picks', function (x) { return x.pickId === pickId; });
  if (!p || p.chosen) return;
  if (p.offer.indexOf(id) < 0) return;      /* 只能挑攤出來的那幾件 */
  p.chosen = id;
  p.pickedAt = now();
  var team = teamOf(p.teamId);
  team.tro = (team.tro || []).concat([id]);
  save();
}

/* 中途接手：課程走到一半才導入時，前面在系統外做完的直接認列。 */
function actStartAt(teamId, doneLayers) {
  var team = teamOf(teamId);
  team.startedAt = doneLayers;
  team.layer = clamp(1, RULES.LAYERS, doneLayers + 1);
  team.enteredAt = now();
  save();
}

function actFinale(teamId, o) {
  var f = find('Finales', function (x) { return x.teamId === teamId; });
  if (!f) { f = { teamId: teamId }; DB.Finales.push(f); }
  Object.keys(o).forEach(function (k) { f[k] = o[k]; });
  save();
  return f;
}
function finaleOf(teamId) { return find('Finales', function (x) { return x.teamId === teamId; }); }

/* ================= 他寫過的那一疊 ================= */
/* 老師每判一件都要寫一段字——那件事他本來就在做，所以這一疊是零負擔的累積。
   一次性看過就過去的話，那些字只影響那一件；疊起來之後它影響下一件。

   跟圖鑑一樣是個人的：這個人走過的每一組都算進來。 */
function stackOf(userId) {
  var u = userOf(userId);
  var teams = (u.history || []).concat([u.teamId]);
  var out = [];
  teams.forEach(function (tid) {
    var team = teamOf(tid);
    if (!team) return;
    where('Reviews', function (r) { return r.teamId === tid; }).forEach(function (r) {
      var task = taskOf(r.taskId);
      if (!task) return;
      out.push({
        kind: r.result === 'ok' ? 'ok' : 'back',
        layer: task.layer, title: task.title, cond: task.cond,
        gave: r.gave, text: r.reason, ts: r.ts, taskId: r.taskId, teamId: tid,
        mine: tid === u.teamId
      });
    });
    where('Redigs', function (r) { return r.teamId === tid && r.status !== 'sent'; })
      .forEach(function (r) {
        var task = taskOf(r.taskId);
        if (!task || !r.reason) return;
        out.push({
          kind: r.status === 'ok' ? 'redig-ok' : 'redig-no',
          layer: task.layer, title: task.title, cond: task.cond,
          text: r.reason, ts: r.judgedAt || r.ts, taskId: r.taskId, teamId: tid,
          mine: tid === u.teamId
        });
      });
    where('Passes', function (p) { return p.teamId === tid; }).forEach(function (p) {
      out.push({
        kind: 'pass', layer: p.layer, title: LAYERS[p.layer - 1].name + ' · 放行',
        text: p.reason, ts: p.ts, teamId: tid, mine: tid === u.teamId
      });
    });
  });
  return out.sort(function (a, b) { return b.ts - a.ts; });
}

/* ================= 這一趟的剖面 ================= */
/* 深度對時間。系統手上本來就有這些時間戳，一個都不必碰作業內容。

   全部是描述，沒有一項是評價：哪一天開的、哪一天交的、走了幾輪、等了幾天。
   沒有「應該長這樣」的那一條線，也不跟別組比。 */
function timelineOf(teamId) {
  var team = teamOf(teamId);
  var passes = where('Passes', function (p) { return p.teamId === teamId; })
    .sort(function (a, b) { return a.ts - b.ts; });
  var rows = [];
  LAYERS.forEach(function (l) { rowsFor(teamId, l.n).forEach(function (r) { rows.push(r); }); });

  /* 起點：這一組最早看到的那一項，或最早的一次放行 */
  var t0 = rows.reduce(function (m, r) { return Math.min(m, r.task.ts); },
    passes.length ? passes[0].ts : (team.enteredAt || now()));
  t0 = Math.min(t0, team.enteredAt || t0);
  var t1 = now();
  var span = Math.max(1, Math.round((t1 - t0) / 86400000));

  /* 每一層待了哪一段 */
  var bands = [], from = t0;
  passes.forEach(function (p) {
    bands.push({ layer: p.layer, from: from, to: p.ts });
    from = p.ts;
  });
  if (!team.finished) bands.push({ layer: team.layer, from: from, to: t1, now: true });

  /* 每一項的事件 */
  var items = rows.map(function (r) {
    var subs = where('Submissions', function (s) {
      return s.teamId === teamId && s.taskId === r.task.taskId;
    }).sort(function (a, b) { return a.ts - b.ts; });
    var revs = where('Reviews', function (v) {
      return v.teamId === teamId && v.taskId === r.task.taskId;
    }).sort(function (a, b) { return a.ts - b.ts; });
    var first = subs[0], last = revs[revs.length - 1];
    return {
      task: r.task, tt: r.tt, layer: r.task.layer,
      opened: r.task.ts,
      subs: subs, revs: revs,
      rounds: subs.length,
      /* 開啟到第一次交隔了幾天 */
      toFirst: first ? (first.ts - r.task.ts) / 86400000 : null,
      /* 等裁決等了幾天（每一輪加起來除以輪數） */
      wait: revs.length ? revs.reduce(function (s, v) { return s + (v.latency || 0); }, 0)
        / revs.length / 86400000 : null,
      /* 期限前幾天交（負的是逾期） */
      slack: (first && r.task.due) ? (r.task.due - first.ts) / 86400000 : null,
      done: r.tt.status === 'done', doneAt: r.tt.doneAt || (last ? last.ts : null)
    };
  }).sort(function (a, b) { return a.opened - b.opened; });

  var avg = function (list) {
    var v = list.filter(function (x) { return x != null; });
    return v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : null;
  };
  return {
    t0: t0, t1: t1, span: span, bands: bands, items: items,
    stats: {
      n: items.length,
      toFirst: avg(items.map(function (i) { return i.toFirst; })),
      rounds: avg(items.map(function (i) { return i.rounds || null; })),
      wait: avg(items.map(function (i) { return i.wait; })),
      slack: avg(items.map(function (i) { return i.slack; })),
      late: items.filter(function (i) { return i.slack != null && i.slack < 0; }).length,
      tight: items.filter(function (i) { return i.slack != null && i.slack >= 0 && i.slack < 1; }).length,
      multi: items.filter(function (i) { return i.rounds > 1; }).length
    }
  };
}

/* ================= 個人圖鑑 ================= */
/* 圖鑑是個人的。換組換班換專案都跟著人走，所以它從這個人走過的
   每一組累積，不是從現在這一組算。 */
function dexOf(userId) {
  var u = userOf(userId);
  var teams = (u.history || []).concat([u.teamId]);
  var mobs = {}, finds = {}, tros = {}, tools = {};
  teams.forEach(function (tid) {
    var t = teamOf(tid);
    if (!t) return;
    where('TeamTasks', function (x) { return x.teamId === tid && x.status === 'done'; })
      .forEach(function (x) {
        var task = taskOf(x.taskId);
        if (!task) return;
        mobs[mobFor(x.taskId, tid, task.layer).name] = task.layer;
        (x.finds || []).forEach(function (id) { finds[id] = 1; });
      });
    (t.tools || []).forEach(function (L) { tools[L] = 1; });
    (t.tro || []).forEach(function (id) { tros[id] = 1; });
    where('Passes', function (p) { return p.teamId === tid; })
      .forEach(function (p) { mobs['BOSS' + p.layer] = p.layer; });
  });
  return { mobs: mobs, finds: finds, tros: tros, tools: tools,
    nMob: Object.keys(mobs).length,
    nItem: Object.keys(finds).length + Object.keys(tros).length + Object.keys(tools).length };
}


/* ===== 45-seed.js ===== */
/* 試用資料：一個班、一位老師、五組。

   規格書說每一條規則都用「五組＋一位老師」的全班模擬驗證過，這裡種的就是
   那一班。時間全部往回推，所以一進來就看得到停留天數、期限、往返紀錄。 */

var D = 86400000;

function seed() {
  DB = blank();
  var T0 = Date.now();
  var ago = function (d) { return T0 - Math.round(d * D); };

  var cid = 'C1';
  DB.Classes.push({ classId: cid, name: '設計專題', courseStart: ago(24),
    joinCode: 'J3AJE5', teacherId: 'U0', sandbox: true });

  DB.Users.push({ userId: 'U0', account: 'tea01', name: '斗篷人', role: 'teacher', classId: cid });

  var TEAMS = [
    { id: 'G1', name: '第一組 · 甲', layer: 2, entered: 3 },
    { id: 'G2', name: '第二組 · 乙', layer: 1, entered: 11 },
    { id: 'G3', name: '第三組 · 丙', layer: 1, entered: 6 },
    { id: 'G4', name: '第四組 · 丁', layer: 3, entered: 1 },
    { id: 'G5', name: '第五組 · 戊', layer: 1, entered: 8 }
  ];
  TEAMS.forEach(function (t, i) {
    DB.Teams.push({ teamId: t.id, classId: cid, name: t.name, layer: t.layer,
      enteredAt: ago(t.entered), tools: [], tro: [], history: [] });
    DB.Users.push({ userId: 'U' + (i + 1), account: 'stu0' + (i + 1), name: '學生' + (i + 1),
      role: 'student', classId: cid, teamId: t.id, history: [] });
    DB.Roster.push({ classId: cid, teamName: t.name, memberName: '學生' + (i + 1), claimedBy: 'U' + (i + 1) });
  });

  var ALL = TEAMS.map(function (t) { return t.id; });

  /* ---------- 老師開的任務 ---------- */

  var L1 = [
    { title: '寫下你們要做什麼',
      cond: '一句話講得完，而且講得出為什麼是這一件。',
      note: '不要寫題目，寫問題。「做一個 App」不是問題。',
      checks: ['看過至少三個相近的案子', '寫出一句話的題目', '說得出為什麼是這一件',
        '列出這一版還不確定的地方'],
      due: ago(21) },
    { title: '這件事現在誰在做',
      cond: '找得出三個正在做同一件事的人或單位，並說得出他們之間的差別。',
      note: '找不到競爭者通常不是因為沒有，是因為關鍵字還沒找對。',
      checks: ['列出三個', '每一個寫一句他們在解什麼', '說出他們彼此的差別'],
      due: ago(15) },
    { title: '第一版路線圖',
      cond: '畫得出從現在到期末的順序，並標出哪一段最可能出錯。',
      note: '第一版一定會改。沒有它就沒有東西可以改。',
      checks: ['排出順序', '標出最可能出錯的一段', '寫下這一版的前提'],
      due: null }
  ];
  var L2 = [
    { title: '你們去問了誰',
      cond: '至少三個人，而且寫得出他們說的跟你們原本以為的差在哪。',
      note: '訪談不是去確認你已經想好的答案。',
      checks: ['訪了三個人以上', '每一個記下一句原話', '寫出跟原本假設不一樣的地方'],
      due: ago(-2) },
    { title: '查到的東西怎麼收',
      cond: '收斂成不超過五條，每一條說得出來源。',
      note: '查不完是正常的。這一項要練的是決定什麼時候停。',
      checks: ['收斂成五條以內', '每一條標出來源', '寫下你們決定停下來的理由'],
      due: ago(-5) },
    { title: '這一版的問題定義',
      cond: '跟第一層那一句比，說得出改了什麼、為什麼改。',
      note: '沒改也可以，但要說得出為什麼查完了還是同一句。',
      checks: ['寫出新的一句', '並排列出舊的那一句', '說明改了什麼'],
      due: null }
  ];
  var L3 = [
    { title: '三個真的不一樣的做法',
      cond: '三個做法要能各自被否定，不是同一個做法的三種顏色。',
      note: '如果三個都做得出來，那它們大概是同一個。',
      checks: ['畫出三個', '寫出每一個成立的前提', '寫出每一個會死在哪'],
      due: ago(-3) }
  ];

  var mk = function (layer, list, teams) {
    return list.map(function (o) {
      return actPublish(cid, layer, {
        title: o.title, cond: o.cond, note: o.note, checks: o.checks,
        due: o.due, teams: teams
      });
    });
  };

  var k1 = mk(1, L1, ALL);
  var k2 = mk(2, L2, ['G1', 'G4']);
  var k3 = mk(3, L3, ['G4']);

  /* 任務是老師陸續開的，不是同一秒 */
  k1[0].ts = ago(22); k1[1].ts = ago(19); k1[2].ts = ago(17);
  k2[0].ts = ago(12); k2[1].ts = ago(10); k2[2].ts = ago(4);
  k3[0].ts = ago(2);

  /* ---------- 走過的路 ---------- */

  var pass = function (teamId, task, gave, reason, sentAgo, judgedAgo, said, attempt) {
    var tt = ttOf(teamId, task.taskId);
    tt.checked = task.checks.map(function (_, i) { return i; });
    tt.effort = 'same';
    tt.text = said || '';
    tt.attempt = attempt || 1;
    for (var a = 1; a <= tt.attempt; a++) {
      DB.Submissions.push({ teamId: teamId, taskId: task.taskId, attempt: a,
        text: a === tt.attempt ? (said || '') : '', effort: 'same',
        ts: ago(sentAgo + (tt.attempt - a) * 3) });
    }
    tt.sentAt = ago(sentAgo);
    tt.status = 'done'; tt.gave = gave; tt.doneAt = ago(judgedAgo); tt.seen = true;
    tt.finds = rollFinds(task.layer, RULES.draws(task.layer, gave), teamId + '/' + task.taskId + '/' + tt.attempt);
    DB.Reviews.push({ teamId: teamId, taskId: task.taskId, result: 'ok', reason: reason,
      gave: gave, attempt: tt.attempt, latency: (sentAgo - judgedAgo) * D, ts: ago(judgedAgo) });
  };

  var sendBack = function (teamId, task, reason, sentAgo, judgedAgo, said) {
    var tt = ttOf(teamId, task.taskId);
    tt.checked = task.checks.map(function (_, i) { return i; });
    tt.effort = 'slow'; tt.text = said || ''; tt.attempt = 1;
    DB.Submissions.push({ teamId: teamId, taskId: task.taskId, attempt: 1,
      text: said || '', effort: 'slow', ts: ago(sentAgo) });
    tt.sentAt = ago(sentAgo);
    tt.status = 'back';
    DB.Reviews.push({ teamId: teamId, taskId: task.taskId, result: 'back', reason: reason,
      gave: 0, attempt: 1, latency: (sentAgo - judgedAgo) * D, ts: ago(judgedAgo) });
  };

  var sent = function (teamId, task, sentAgo, said, effort) {
    var tt = ttOf(teamId, task.taskId);
    tt.checked = task.checks.map(function (_, i) { return i; });
    tt.effort = effort || 'same'; tt.text = said || ''; tt.attempt = 1;
    tt.status = 'sent'; tt.sentAt = ago(sentAgo);
    DB.Submissions.push({ teamId: teamId, taskId: task.taskId, attempt: 1,
      text: said || '', effort: tt.effort, ts: ago(sentAgo) });
  };

  /* 第一組：第一層走完，老師放行過一次 */
  pass('G1', k1[0], 3,
    '你們把題目從「做一個提醒帶傘的 App」改成「人是在什麼時候決定不帶傘的」——' +
    '這一步比你們想的重要，後面每一個決定都會回來對照這一句。' +
    '多找的那六個案子沒有白找，第三個那個我沒看過。',
    20, 19, '除了要求的三個，我們另外看了六個，其中兩個是國外的。', 1);
  pass('G1', k1[1], 0,
    '三個都找到了，寫的是它們長什麼樣子，不是它們在解什麼。' +
    '長相會過時，問題不會——下一次先問「他們在替誰解決什麼」，再看畫面。',

  pass('G1', k1[2], 4,
    '你們標出來的那一段（等訪談排期）確實是最可能出錯的地方，而且你們自己先排了備案。' +
    '第一版路線圖能做到這樣少見。順序我沒有要改的。',
    13, 12, '我們另外畫了一版「如果訪談約不到人」的路線，兩版都附上了。', 2);
  DB.Passes.push({ teamId: 'G1', layer: 1, verdict: 'ok',
    reason: '你們說得出自己要挖什麼了。第二層開始會查不完——記得那一層要練的是停下來。',
    ts: ago(3) });
  var g1 = teamOf('G1');
  g1.tools = [1];
  /* 霧面者退開的時候留了三件。第一組還沒回來挑——所以一進來看到的第一件事
     就是那三句話擺在面前。 */
  DB.Picks.push({ pickId: nid('P'), teamId: 'G1', layer: 1,
    offer: offerTrophies(1, [], 'G1/1'), chosen: null, ts: ago(3) });

  /* 第一組的第二層：要補的／還沒交／等老師驗收，各一項 */
  sendBack('G1', k2[0],
    '三個人裡有兩個是你們同學。同學會順著你們講，這一份訪談等於問了一個人。' +
    '再找兩個真的會遇到這個問題的人——不用多，兩個就好。',
    5, 4, '訪了三個，有兩個是班上同學。');
  sent('G1', k2[1], 1, '我們列了七條收不完，最後砍成五條，砍掉的兩條也附在後面。', 'slow');
  /* k2[2] 留在「還沒交」 */

  /* 第二組：這一層目前開的都交了，等最久 */
  k1.forEach(function (t, i) { sent('G2', t, 7 - i, i === 0 ? '這一版我們改過三次。' : ''); });

  /* 第三組：交了一項，而且說卡住了 */
  sent('G3', k1[0], 4, '');
  var b = ttOf('G3', k1[1].taskId);
  b.blocker = '找不到第三個在做同一件事的單位，關鍵字換了十幾組都是同一批結果。';
  b.checked = [0];

  /* 第四組：走到第三層 */
  pass('G4', k1[0], 2, '題目講得清楚。為什麼是這一件講得比較弱，之後會被問到。', 18, 17, '', 1);
  pass('G4', k1[1], 1, '三個找到了，差別寫得太快。', 15, 14, '', 1);
  pass('G4', k1[2], 3, '順序合理，而且你們自己標出了會出錯的那一段。', 12, 11, '', 1);
  DB.Passes.push({ teamId: 'G4', layer: 1, verdict: 'ok', reason: '可以往下。', ts: ago(10) });
  pass('G4', k2[0], 2, '訪談有做，記的是結論不是原話。原話比結論有用。', 8, 7, '', 1);
  pass('G4', k2[1], 0, '五條收得乾淨。來源標了，但停下來的理由沒寫。', 5, 4, '', 1);
  pass('G4', k2[2], 1, '改了，也說得出為什麼改。', 3, 2, '', 2);
  DB.Passes.push({ teamId: 'G4', layer: 2, verdict: 'ok',
    reason: '你們在查不完的地方決定了夠了。那個判斷本身就是這一層要學的東西。', ts: ago(1) });
  var g4 = teamOf('G4');
  g4.tools = [1, 2];
  /* 第四組兩層都挑過了 */
  [1, 2].forEach(function (L) {
    var offer = offerTrophies(L, g4.tro, 'G4/' + L);

  /* 第五組：來了，還沒交 */

  DB.Redigs.push({ redigId: nid('R'), teamId: 'G1', taskId: k1[1].taskId,

      '重寫之後發現其中一個其實跟我們不是同一件事，換掉了。',
    status: 'sent', reason: '', ts: ago(1) });

  /* ---------- 上一個專案 ---------- */

     學生1 上學期在另一班另一組走過兩項——那兩隻與那幾件現在還在他的圖鑑裡，

      DB.Reviews.push({ teamId: 'G0', taskId: t.taskId, result: 'ok',
        reason: '上學期的判斷。', gave: o.gave, attempt: 1, latency: D, ts: ago(280 - i * 10) });
    });
    DB.Passes.push({ teamId: 'G0', layer: 1, verdict: 'ok', reason: '上學期放行。', ts: ago(275) });
    var offer0 = offerTrophies(1, [], 'G0/1');

  DB.Config.seq = 100;

/* ===== 55-ui.js ===== */
/* 畫面的底：字串拼 HTML、一個路由、一次重畫。

   沒有覆寫層，也沒有模板補丁——每一個畫面就是下面那幾支函式，
   改一句話只要改一個地方。 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

var S = { who: 'U1', page: 'home', p: {}, flash: null };

/* 打到一半的字。畫面每次動作都整頁重畫，沒有這一層的話
   「這一項多做了什麼」打到一半去勾一條清單，字就沒了。
   它只活在記憶體裡——沒按送出的東西不會進資料表。 */
var DRAFT = {};
function keepDraft() {
  ['extra', 'blocker', 'reason', 'redig', 'verdict'].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) DRAFT[id] = e.value;
  });
}
function draft(id, fallback) { return DRAFT[id] != null ? DRAFT[id] : (fallback || ''); }

function go(page, p) {
  S.page = page; S.p = p || {}; S.flash = null; DRAFT = {};
  window.scrollTo(0, 0);
  render();
}
function me() { return userOf(S.who); }
function isTeacher() { return me().role === 'teacher'; }
function myTeam() { return teamOf(me().teamId); }

/* 一段固定的頁首 */
function head(eyebrow, title, lead) {
  return '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p class="lead">' + nl(lead) + '</p>' : '');
}

function layerVars(L) {
  var p = layerPal(L);
  return 'style="--L:' + p['#'] + ';--Ld:' + p.o + ';--Ll:' + p['*'] +
    ';--Lbg:' + p.bg + ';--Lline:' + p.line + '"';
}

/* 期限一律走 RULES.due，畫面不自己算日期 */
function dueTag(due) {
  var d = RULES.due(due, now());
  if (d.none) return '<span class="pill">期限　不設限</span>';
  return '<span class="pill ' + (d.over ? 'over' : d.tone === 'warn' ? 'gold' : '') + '">期限　' +
    esc(d.text) + '</span>';
}

var EFFORT = { fast: '比預估快', same: '差不多', slow: '比預估慢' };

function mobImg(m, dim, cls) {
  var pal = m.pal || layerPal(m.L || 1);
  return '<img class="' + (cls || '') + '" src="' + pxSvg(m.px, pal, dim) + '" alt="">';
}

/* ---------- 路由 ---------- */

var PAGES = {};

function render() {
  var f = PAGES[S.page];
  if (!f) { S.page = isTeacher() ? 'queue' : 'home'; f = PAGES[S.page]; }
  var body = f();
  document.getElementById('app').innerHTML =
    sideBar() + '<div class="main">' + topBar() + demoBar() +
    '<div class="wrap">' + body + '</div></div>';
}

function topBar() {
  var u = me();
  if (u.role === 'teacher') {
    var st = teacherStats();
    return '<div class="top">' +
      '<span class="badge t">老師端</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>設計專題　·　' + classTeams('C1').length + ' 組</span>' +
      '<span>合格考量 ' + st.n + ' 件</span>' +
      '</div>';
  }
  var t = myTeam();
  var L = LAYERS[t.layer - 1];
  var sc = scoreOf(t.teamId), b = board('C1');
  var rank = 0;
  b.forEach(function (r) { if (r.team.teamId === t.teamId) rank = r.rank; });
  return '<div class="top">' +
    '<span class="badge">學生端</span>' +
    '<span class="who">' + esc(t.name) + '</span>' +
    '<span class="sp"></span>' +
    '<span>' + esc(L.name) + '　·　停留 ' + RULES.stayDays(t.enteredAt, now()) + ' 天</span>' +
    '<a class="plain" data-go="board">' + sc.total + ' 分　·　第 ' + rank + ' 名 / ' +
      b.length + ' 組</a>' +
    '</div>';
}

/* 試用列。真的上線沒有這一條——它在這裡只是為了讓你兩邊都走得完。 */
function demoBar() {
  var opts = DB.Users.map(function (u) {
    return '<option value="' + u.userId + '"' + (u.userId === S.who ? ' selected' : '') + '>' +
      (u.role === 'teacher' ? '老師' : teamOf(u.teamId).name) + '</option>';
  }).join('');
  return '<div class="demo">' +
    '<b>試用</b><span>切換身分</span>' +
    '<select data-act="who" style="width:auto;padding:2px 8px;font-size:11px">' + opts + '</select>' +
    '<span class="sp" style="flex:1"></span>' +
    '<a class="plain" style="font-size:11px" data-act="forward">把時間往前推一天</a>' +
    '<a class="plain" style="font-size:11px" data-act="reset">整班重來</a>' +
    '</div>';
}

function sideBar() {
  var u = me();
  var nav, headBlock;
  if (u.role === 'teacher') {
    headBlock = '<div class="side-head"><div class="k">TEACHER</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">設計專題 · 加入碼 ' + esc(DB.Classes[0].joinCode) + '</div></div>';
    nav = [
      ['queue', '待你驗收'], ['tasks', '任務清單'], ['gate', '關卡審核'],
      ['tcurve', '各組的剖面'], ['classmap', '全班位置'],
      ['world', '學生端的世界'], ['final', '期末回顧']
    ];
  } else {
    var t = myTeam();
    headBlock = '<div class="side-head"><div class="k">TEAM</div>' +
      '<div class="n">' + esc(t.name) + '</div>' +
      '<div class="s">' + esc(LAYERS[t.layer - 1].name) + ' · 停留 ' +
        RULES.stayDays(t.enteredAt, now()) + ' 天</div></div>';
    nav = [
      ['home', '首頁'], ['list', '任務清單'], ['stack', '他寫過的'],
      ['dex', '圖鑑'], ['curve', '剖面'], ['board', '排行榜'],
      ['log', '紀錄'], ['map', '迷霧地圖'],
      ['end', t.finished ? '結局' : '？？？']
    ];
  }
  var items = nav.map(function (n) {
    return '<a class="' + (S.page === n[0] ? 'on' : '') + '" data-go="' + n[0] + '">' +
      '<span class="dot"></span>' + esc(n[1]) + '</a>';
  }).join('');
  return '<div class="side">' + headBlock + '<div class="nav">' + items + '</div></div>';
}

/* ---------- 事件 ---------- */

function val(sel) { var e = document.querySelector(sel); return e ? e.value : ''; }

document.addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go'), JSON.parse(g.getAttribute('data-p') || '{}')); return; }
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  var p = JSON.parse(a.getAttribute('data-p') || '{}');
  if (ACTS[act]) { ACTS[act](p, a); }
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  if (act === 'who') { S.who = a.value; S.page = userOf(S.who).role === 'teacher' ? 'queue' : 'home'; render(); }
});

var ACTS = {
  forward: function () { CLOCK += 86400000; render(); },
  reset: function () { seed(); S.who = 'U1'; go('home'); }
};

        esc(RULES.GATE) + '</div></div></div>' +
      '<div class="card" style="flex:1;margin:0;text-align:right">' +
        '<div class="eyebrow">停留天數</div><div class="big">' + stay + '</div>' +
        '<div class="fine">從進到這一層那一刻起算。老師的佇列照這個排序，待最久的排最前面。</div>' +
      '</div>' +
    '</div>' +

    cta +

    '<h2>這四步一直重複</h2>' +
    '<div class="row">' + steps + '</div>' +

    '<h2>你在這裡</h2>' +
    mapBands(true) +
    '<p><a class="plain" data-go="map">看整張地圖與其他隊伍 →</a></p>' +

    '<h2>這一趟走完是什麼樣子</h2>' +
    '<div class="row">' +
      sumCard('四個領域', where('Passes', function (p) { return p.teamId === t.teamId; }).length +
        ' / ' + RULES.LAYERS + ' 層', RULES.GATE) +
      sumCard('生物', dex.nMob + ' / ' + TOTAL_MOB + ' 種',
        '每一項任務前面站一隻，每一層的盡頭再站一隻大的。同一項任務，別組遇到的不是同一隻。') +
      sumCard('物品', dex.nItem + ' / ' + TOTAL_ITEM + ' 種',
        RULES.say.sameWeight()) +
    '</div>' +
    '<div class="row">' +
      sumCard('他寫過的', stackOf(S.who).length + ' 件',
        '他每判一件就寫一段。那些字在這裡疊起來，交下一件之前可以先翻——' +
        '這一疊是唯一會改變下一輪的東西。') +
      sumCard('回頭補強', redigN + ' 項',
        '已經過了的任務，專案走下去之後你們可能發現它不夠——回頭補完，寫下補了什麼送去。' +
        '他接受就多抽一次。' + RULES.say.redig() + '，不做也不扣分。') +
      sumCard('最後', '命名封存',
        '四層走完，你們會幫這一趟取一個名字留下來。下一個專案打開紀錄還看得到。') +
    '</div>' +
    '</div>';
};

function ctaCard(eyebrow, title, lead, cta, taskId) {
  return '<div class="card hot">' +
    '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:330px">' +
        '<h1 style="margin-bottom:11px">' + esc(title) + '</h1>' +
        '<p class="lead">' + esc(lead) + '</p></div>' +
      '<span class="btn" data-go="task" data-p=\'{"id":"' + taskId + '"}\'>' + esc(cta) + '</span>' +
    '</div></div>';
}

function sumCard(k, v, note) {
  return '<div class="card"><div class="eyebrow">' + esc(k) + '</div>' +
    '<div style="font-size:33px;color:var(--gold);line-height:1.3">' + esc(v) + '</div>' +
    '<div class="fine" style="margin-top:11px">' + esc(note) + '</div></div>';
}

/* ================= 任務清單 ================= */
/* 依狀態分區。做完的不在這裡，移到紀錄。 */

PAGES.list = function () {
  var t = myTeam(), L = LAYERS[t.layer - 1];
  var rows = rowsFor(t.teamId, t.layer);
  var back = rows.filter(function (r) { return r.tt.status === 'back'; });
  var open = rows.filter(function (r) { return r.tt.status === 'open'; });
  var sent = rows.filter(function (r) { return r.tt.status === 'sent'; });
  var done = rows.filter(function (r) { return r.tt.status === 'done'; });

  var sec = function (title, list, note) {
    if (!list.length) return '';
    return '<h2>' + esc(title) + '　<span class="pill">' + list.length + ' 項</span></h2>' +
      '<p class="fine">' + esc(note) + '</p>' +
      list.map(function (r) { return taskRow(r, t); }).join('');
  };

  return '<div ' + layerVars(t.layer) + '>' +
    head(L.code + ' · 任務清單', L.name + ' · 這一層開了什麼',
      '每一項前面都站著一隻——點進去才知道是哪一隻。打贏牠，就是他判過這一項。') +
    '<p class="fine">' + esc(RULES.GATE) + '　他隨時可以再開一項，所以這張清單沒有一個「全部做完」的狀態。</p>' +

    sec('要補的', back, '他寫了為什麼還不到。讀完他寫的那一段再改。') +
    sec('還沒交', open, '作業照他原本的方式交。交完點進來把清單勾完、回答一題，再送出。') +
    sec('等他看', sent, '這一區沒有動作可做。') +

    (done.length ? '<div class="sep"></div><p class="fine">這一層已經判過的 ' + done.length +
      ' 項移到了 <a class="plain" data-go="log">紀錄</a>——那裡並排放著你們寫的與他給的。</p>' : '') +

    (rows.length ? '' : '<div class="card"><p class="lead">他還沒在這一層開任何一項。</p>' +
      '<p class="fine">開幾項、什麼時候開，是他依進度決定的。</p></div>') +
    '</div>';
};

function taskRow(r, t) {
  var m = mobFor(r.task.taskId, t.teamId, r.task.layer);
  var seen = r.tt.status === 'done';
  var art = seen
    ? '<img src="' + pxSvg(m.px, layerPal(r.task.layer)) + '" alt="">'
    : '<span class="q">？</span>';
  var tag = r.tt.status === 'back' ? '<span class="pill over">要補的</span>'
    : r.tt.status === 'sent' ? '<span class="pill">等他看</span>'
    : r.tt.status === 'done' ? '<span class="pill ok">他判過了</span>'
    : '<span class="pill gold">還沒交</span>';
  var checkN = (r.tt.checked || []).length, checkT = (r.task.checks || []).length;
  return '<div class="item" data-go="task" data-p=\'{"id":"' + r.task.taskId + '"}\'>' +
    '<div class="body"><div class="t">' + esc(r.task.title) + '</div>' +
      '<div class="m">通過條件　' + esc(r.task.cond) + '</div>' +
      '<div style="margin-top:11px;display:flex;gap:5px;flex-wrap:wrap">' + tag +
        dueTag(r.task.due) +
        (checkT ? '<span class="pill">清單 ' + checkN + '/' + checkT + '</span>' : '') +
        (r.tt.blocker ? '<span class="pill hand">✋ 說了卡住</span>' : '') +
      '</div></div>' +
    '<div class="art">' + art + '</div></div>';
}

/* ================= 任務頁 ================= */

PAGES.task = function () {
  var t = myTeam(), id = S.p.id, task = taskOf(id), tt = ttOf(t.teamId, id);
  if (!task || !tt) return '<p>找不到這一項。</p>';
  if (tt.status === 'done') return taskDone(task, tt, t);

  var m = mobFor(id, t.teamId, task.layer);
  var subs = where('Submissions', function (s) { return s.teamId === t.teamId && s.taskId === id; });
  var revs = where('Reviews', function (s) { return s.teamId === t.teamId && s.taskId === id; });
  var locked = tt.status === 'sent';

  var checks = (task.checks || []).map(function (c, i) {
    var on = (tt.checked || []).indexOf(i) >= 0;
    return '<div class="check ' + (on ? 'on' : '') + (locked ? ' lock' : '') + '"' +
      (locked ? '' : ' data-act="check" data-p=\'{"i":' + i + '}\'') + '>' +
      '<span class="box">' + (on ? '✓' : '') + '</span><span>' + esc(c) + '</span></div>';
  }).join('');

  var seg = Object.keys(EFFORT).map(function (k) {
    return '<button data-act="effort" data-p=\'{"v":"' + k + '"}\'' +
      (tt.effort === k ? ' class="on"' : '') + (locked ? ' disabled' : '') + '>' +
      esc(EFFORT[k]) + '</button>';
  }).join('');

  return '<div ' + layerVars(task.layer) + '>' +
    '<p><a class="plain" data-go="list">← 回任務清單</a></p>' +
    head(LAYERS[task.layer - 1].code + ' · ' + LAYERS[task.layer - 1].stage, task.title, '') +
    '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:22px">' + dueTag(task.due) +
      (tt.status === 'back' ? '<span class="pill over">他要你們補</span>' : '') +
      (locked ? '<span class="pill">等他看</span>' : '') + '</div>' +

    '<div class="row">' +
      '<div class="card layer" style="flex:2;margin:0">' +
        '<div class="eyebrow">通過條件</div><p style="margin:0 0 11px">' + esc(task.cond) + '</p>' +
        (task.note ? '<div class="eyebrow">要注意的</div><p class="lead" style="margin:0">' +
          esc(task.note) + '</p>' : '') +
      '</div>' +
      '<div class="mob sm" style="flex:1">' + mobImg(m) +
        '<div><div class="eyebrow">擋在前面的</div><div class="n">' + esc(m.name) + '</div>' +
        '<div class="t">' + esc(m.trait) + '</div></div></div>' +
    '</div>' +

    (subs.length || revs.length ? roundLog(subs, revs, task) : '') +

    '<h2>作業交到他原本收作業的地方</h2>' +
    '<p class="fine">系統不收檔案、看不到內容，也不評品質。它只知道你們什麼時候按了送出，' +
    '跟他後來寫了什麼。</p>' +

    (task.checks && task.checks.length ?
      '<h2>清單</h2><p class="fine">勾選 ' + RULES.CHECK + ' 分。這是你們自己的紀錄，' +
      '不是成績，也不是送出的門檻。</p><div class="card" style="padding:11px">' + checks + '</div>' : '') +

    '<h2>這一組現在的狀態</h2>' +
    '<p class="fine">必填。比起「做完沒」，這一題問的是「跟你們自己原本估的比」。</p>' +
    '<div class="seg">' + seg + '</div>' +

    '<h2>這一項多做了什麼</h2>' +
    '<p class="fine">選填。' + esc(RULES.GAVE_STATEMENT) + '　他的 ' +
      RULES.GAVE_MIN + '–' + RULES.GAVE_MAX + ' 看的就是這一段。' +
      '留白不扣分——但他也只能照他看到的判。</p>' +
    '<textarea id="extra"' + (locked ? ' disabled' : '') + ' placeholder="多研究了什麼、多畫了什麼、給了不同的做法⋯⋯">' +
      esc(draft('extra', tt.text)) + '</textarea>' +

    '<h2>卡住了嗎</h2>' +
    '<p class="fine">不用等送出。寫下來他的佇列上會排最前面，你們隨時可以放下。</p>' +
    '<textarea id="blocker" style="min-height:66px" placeholder="卡在哪裡？">' + esc(draft('blocker', tt.blocker)) + '</textarea>' +
    '<p><span class="btn flat sm" data-act="blocker">' +
      (tt.blocker ? '更新／放下這一句' : '送出這一句') + '</span></p>' +

    (locked
      ? '<div class="sep"></div><div class="card"><h3 class="mt0">等。</h3>' +
        '<p class="lead">你們交出去了。他看完會寫下判斷。</p>' +
        '<p class="fine">這一段沒有動作可做，所以這裡沒有按鈕。</p></div>'
      : '<div class="sep"></div>' +
        /* 交出去之前先翻一下他寫過的——那一疊是唯一會改變下一輪的東西 */
        (stackOf(S.who).length
          ? '<div class="card sunk" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">' +
            '<div style="flex:1;min-width:264px"><div class="eyebrow">送出之前</div>' +
            '<div style="font-size:22px">他寫過 ' + stackOf(S.who).length + ' 件判斷。</div>' +
            '<div class="fine">翻一下他上一次是怎麼算合格的，比猜快。</div></div>' +
            '<span class="btn flat" data-go="stack">去翻那一疊</span></div>'
          : '') +
        (S.flash ? '<p class="pill over">' + esc(S.flash) + '</p>' : '') +
        '<p><span class="btn" data-act="submit">我做完了，請他確認</span></p>' +
        '<p class="fine">送出之後清單就鎖住了。退回不扣分，重交次數不限——' +
        '每一次的內容與他寫的理由都留著。</p>') +
    '</div>';
};

/* 往返紀錄。不是「你被退了 N 次」，是「你們來回了 N 次，中間改了這些」。 */
function roundLog(subs, revs, task) {
  var ev = subs.map(function (s) { return { ts: s.ts, kind: 'sub', d: s }; })
    .concat(revs.map(function (r) { return { ts: r.ts, kind: 'rev', d: r }; }))
    .sort(function (a, b) { return a.ts - b.ts; });
  var days = function (ts) { return Math.max(0, Math.round((now() - ts) / 86400000)); };
  var body = ev.map(function (e) {
    if (e.kind === 'sub') {
      return '<div class="n"><div class="h">第 ' + e.d.attempt + ' 次送出 · ' + days(e.ts) + ' 天前' +
        (e.d.effort ? '　·　你們說「' + esc(EFFORT[e.d.effort]) + '」' : '') + '</div>' +
        (e.d.text ? '<div class="b">' + nl(e.d.text) + '</div>' : '') + '</div>';
    }
    var ok = e.d.result === 'ok';
    return '<div class="n ' + (ok ? 'ok' : 'back') + '"><div class="h">他' +
      (ok ? '判過了' : '要你們補') + ' · ' + days(e.ts) + ' 天前' +
      (ok ? '　·　他給「' + esc(RULES.gaveAnchor(e.d.gave)) + '」' : '') + '</div>' +
      '<div class="b">' + nl(e.d.reason) + '</div></div>';
  }).join('');
  var n = subs.length;
  return '<h2>往返紀錄</h2>' +
    '<p class="fine">你們來回了 ' + n + ' 次。' + RULES.say.round() +
    '——它不進成績，但兩份草稿就並排在這裡，' +
    '中間改了什麼是這一趟唯一不需要任何人批准的進步。</p>' +
    '<div class="log">' + body + '</div>';
}

/* ---------- 通過之後：整頁變結算頁 ---------- */

function taskDone(task, tt, t) {
  var m = mobFor(task.taskId, t.teamId, task.layer);
  var rev = where('Reviews', function (r) {
    return r.teamId === t.teamId && r.taskId === task.taskId && r.result === 'ok';
  }).pop();
  var subs = where('Submissions', function (s) { return s.teamId === t.teamId && s.taskId === task.taskId; });
  var revs = where('Reviews', function (s) { return s.teamId === t.teamId && s.taskId === task.taskId; });
  var gave = rev ? rev.gave : 0;
  var finds = (tt.finds || []).map(function (id) { return FINDS[id - 1]; });

  var drops = finds.map(function (f) {
    return '<div class="one"><img src="' + pxSvg(f.px, layerPal(f.L)) + '" alt="">' +
      '<div class="n">' + esc(f.name) + '</div><div class="q">' + esc(f.tier) + '</div></div>';
  }).join('');

  var redigs = where('Redigs', function (r) {
    return r.teamId === t.teamId && r.taskId === task.taskId;
  });
  var wait = redigLeft(t.teamId);

  return '<div ' + layerVars(task.layer) + '>' +
    '<p><a class="plain" data-go="log">← 回紀錄</a></p>' +
    '<div class="eyebrow">' + LAYERS[task.layer - 1].code + ' · 結算</div>' +
    '<h1>' + esc(task.title) + '</h1>' +
    '<p><span class="stamp">他判過了</span></p>' +

    '<div class="row" style="margin-top:22px">' +
      '<div class="mob" style="flex:1">' + mobImg(m) +
        '<div><div class="eyebrow">你們打贏的</div><div class="n">' + esc(m.name) + '</div>' +
        '<div class="t">' + esc(m.trait) + '</div>' +
        '<div class="t" style="color:var(--mute);margin-top:5px">' +
        '同一項任務，別組遇到的不是這一隻。</div></div></div>' +
    '</div>' +

    '<h2>他寫的合格考量</h2>' +
    '<p class="fine">這一段是這個系統裡最重要的東西。他寫的判斷就是教材。</p>' +
    '<div class="card layer"><p style="margin:0;font-size:22px;line-height:1.9">' +
      nl(rev ? rev.reason : '') + '</p></div>' +
    '<p class="fine">這一段留在<a class="plain" data-go="stack">他寫過的那一疊</a>裡（' +
      stackOf(S.who).length + ' 件）——下一件交出去之前可以回來翻。</p>' +

    '<h2>他給的</h2>' +
    '<div class="card">' +
      '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">' +
        '<div><div class="eyebrow">' + RULES.GAVE_MIN + '–' + RULES.GAVE_MAX + '</div>' +
        '<div class="big">' + gave + '</div></div>' +
        '<div style="flex:1;min-width:242px"><div style="font-size:22px">' +
          esc(RULES.gaveAnchor(gave)) + '</div>' +
          '<div class="fine">' + esc(RULES.GAVE_STATEMENT) + '</div>' +
          '<div class="fine" style="margin-top:11px;color:var(--dim)">' +
            esc(RULES.say.drawsFor(task.layer, gave)) + '。它只決定抽幾次，不決定過不過。</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<h2>掉落物 ' + finds.length + ' 件</h2>' +
    '<p class="fine">' + esc(RULES.say.sameWeight()) + '</p>' +
    '<div class="drop">' + drops + '</div>' +
    '<p class="fine" style="margin-top:11px">通過這一項 ＋' + RULES.PASS + ' 分，' +
      '掉落物 ' + finds.length + ' 件 ＋' + (finds.length * RULES.DROP) + ' 分。' +
      '進圖鑑的那幾件跟著你走，換組換班換專案都在。</p>' +

    roundLog(subs, revs, task) +

    '<h2>回頭補強</h2>' +
    '<p class="fine">專案走下去之後你們發現這一項不夠，可以回頭補完。' +
      '他照這一項<b>本來的通過條件</b>判——' + esc(task.cond) + '　' +
      RULES.say.redig() + '，不做也不扣分。接受 ＝ 這一項多抽一次。</p>' +
    redigBlock(redigs, wait, task) +
    '</div>';
}

function redigBlock(redigs, wait, task) {
  var past = redigs.map(function (r) {
    var tag = r.status === 'sent' ? '<span class="pill">等他看</span>'
      : r.status === 'ok' ? '<span class="pill ok">他接受了</span>'
      : '<span class="pill over">他沒接受</span>';
    return '<div class="card sunk"><div style="margin-bottom:5px">' + tag + '</div>' +
      '<div class="pair"><div><div class="h">你們回頭補的</div>' + nl(r.note) + '</div>' +
      '<div><div class="h">他寫的</div>' + (r.reason ? nl(r.reason) : '<span class="fine">—</span>') +
      '</div></div></div>';
  }).join('');
  var open = redigs.some(function (r) { return r.status === 'sent'; });
  var form;
  if (open) form = '<p class="fine">已經送出一件，等他看。</p>';
  else if (wait > 0) form = '<p class="fine">還要等 ' + wait + ' 天。' + RULES.say.redig() +
    '——不是日曆週，所以今天禮拜幾不影響。</p>';
  else form = '<textarea id="redig" placeholder="我回頭補了什麼">' + esc(draft('redig')) + '</textarea>' +
    (S.flash ? '<p class="pill over">' + esc(S.flash) + '</p>' : '') +
    '<p><span class="btn" data-act="redig" data-p=\'{"id":"' + task.taskId + '"}\'>送去給他看</span></p>';
  return past + form;
}

/* ================= 圖鑑 ================= */

PAGES.dex = function () {
  var dex = dexOf(S.who), u = me();
  var pick = S.p.L || 0;
  var tabs = [[0, '四個領域']].concat(LAYERS.map(function (l) { return [l.n, l.code + ' ' + l.name]; }))
    .map(function (x) {
      return '<button class="' + (pick === x[0] ? 'on' : '') + '" data-go="dex" data-p=\'{"L":' +
        x[0] + '}\'>' + esc(x[1]) + '</button>';
    }).join('');

  var own = ownMob(u.account), ownIt = ownFind(u.account);

  /* 篩到哪一層，數字就講那一層——不然「L1 十一格」配「4 / 44」讀起來對不上 */
  var tally = { mob: [0, 0], item: [0, 0] };

  /* 生物：一區 10 隻 ＋ 4 隻守關 */
  var mobCells = [];
  LAYERS.forEach(function (l) {
    if (pick && pick !== l.n) return;
    MOB[l.n - 1].forEach(function (c) {
      var got = dex.mobs[c.n];
      mobCells.push(cellT(tally.mob, got, pxSvg(c.px, l.pal, !got), got ? c.n : '？？？',
        got ? c.t : l.name + ' · 還沒遇到'));
    });
  });
  LAYERS.forEach(function (l) {
    if (pick && pick !== l.n) return;
    var b = PACK.bosses[l.n - 1], got = dex.mobs['BOSS' + l.n];
    mobCells.push(cellT(tally.mob, got, pxSvg(b.px, b.hue, !got), got ? b.name : '？？？',
      got ? l.boss.trait : l.name + ' · 層底'));
  });

  /* 物品：108 掉落物 ＋ 24 戰利品 ＋ 4 道具 */
  var itemCells = [];
  LAYERS.forEach(function (l) {
    if (pick && pick !== l.n) return;
    var got = dex.tools[l.n];
    itemCells.push(cellT(tally.item, got, pxSvg(l.tool.px, l.pal, !got), got ? l.tool.name : '？？？',
      got ? l.tool.why : l.name + ' · 放行才有'));
  });
  LAYERS.forEach(function (l) {
    if (pick && pick !== l.n) return;
    TRO[l.n - 1].forEach(function (tr) {
      var got = dex.tros[troId(tr)];
      itemCells.push(cellT(tally.item, got, pxSvg(tr.px, l.pal, !got), got ? tr.n : '？？？',
        got ? tr.w : l.name + ' · 戰利品'));
    });
  });
  LAYERS.forEach(function (l) {
    if (pick && pick !== l.n) return;
    DEB[l.n - 1].forEach(function (f) {
      var got = dex.finds[f.id];
      itemCells.push(cellT(tally.item, got, pxSvg(f.px, l.pal, !got), got ? f.name : '？？？',
        got ? f.look : l.name + ' · ' + f.tier));
    });
  });

  return head('COLLECTION', '圖鑑',
    '一次攤開。沒拿到的只留位置與微光。\n圖鑑是個人的——換組、換班、換專案，這一頁都跟著你走。') +
    '<div class="seg" style="margin:22px 0">' + tabs + '</div>' +

    '<h2>只有你有的那一組</h2>' +
    '<p class="fine">從帳號算出來的，別人拿不到同一組。它不算在 ' + TOTAL_MOB + ' ／ ' +
      TOTAL_ITEM + ' 裡——它不是一格進度，是這一趟從第一天就有的東西。</p>' +
    '<div class="row">' +
      '<div class="mob" style="flex:1"><img src="' + pxSvg(own.px, own.pal) + '" alt="">' +
        '<div><div class="eyebrow">你的那一隻</div><div class="n">' + esc(own.name) + '</div>' +
        '<div class="t">' + esc(own.trait) + '</div></div></div>' +
      '<div class="mob sm" style="flex:1"><img src="' + pxSvg(ownIt.px, ownIt.pal) + '" alt="">' +
        '<div><div class="eyebrow">你的那一件</div><div class="n">' + esc(ownIt.name) + '</div>' +
        '<div class="t">' + esc(ownIt.look) + '</div></div></div>' +
    '</div>' +

    '<h2>生物　' + tally.mob[0] + ' / ' + tally.mob[1] + ' 種</h2>' +
    '<p class="fine">一區 ' + MOB[0].length + ' 隻，加上四隻守關。' +
      '每一項任務前面站一隻；同一項任務，不同組遇到的不是同一隻。</p>' +
    '<div class="dex">' + mobCells.join('') + '</div>' +

    '<h2>物品　' + tally.item[0] + ' / ' + tally.item[1] + ' 種</h2>' +
    '<p class="fine">' + FINDS.length + ' 掉落物 ＋ ' + PACK.trophies.length + ' 戰利品 ＋ ' +
      LAYERS.length + ' 道具。' + esc(RULES.say.sameWeight()) + '<br>' +
      '掉落物是打贏那一隻的時候抽的；<b>戰利品是你們自己挑的</b>——每放行一層，' +
      '層底那一隻留下 ' + RULES.OFFER + ' 件，你們帶走一件。' +
      '道具是放行的證明，一層一件。</p>' +
    '<div class="dex">' + itemCells.join('') + '</div>';
};

function cellT(t, got, src, name, tip) {
  t[1]++; if (got) t[0]++;
  return cell(got, src, name, tip);
}

function cell(got, src, name, tip) {
  return '<div><div class="slot ' + (got ? 'on' : 'off') + '" title="' + esc(tip) + '">' +
    (got ? '<img src="' + src + '" alt="">' : '<img src="' + src + '" alt="" style="opacity:.5">') +
    '</div><div class="dexname">' + esc(name) + '</div></div>';
}

/* ================= 排行榜 ================= */

/* ================= 紀錄 ================= */

PAGES.log = function () {
  var t = myTeam();

    rowsFor(t.teamId, l.n).filter(function (r) { return r.tt.status === 'done'; })

        '<div class="pair" style="margin-top:11px">' +

            (sub && sub.text ? nl(sub.text) : '<span class="fine">（留白）</span>') + '</div>' +
          '<div><div class="h">他給的</div>「' + esc(RULES.gaveAnchor(gave)) + '」，抽了 ' +

/* ================= 迷霧地圖 ================= */
/* 只有一條軸：深度。層裡面不鋪格子——任務沒有順序，鋪成一排等於系統
   在替學生排「先做哪一項」。 */

function mapBands(mini) {
  var t = myTeam();
  var teams = classTeams('C1');
  var body = LAYERS.map(function (l) {
    var here = t.layer === l.n;
    var seen = t.layer >= l.n;
    var b = PACK.bosses[l.n - 1];
    var guys = '';
    if (!mini) {
      var on = teams.filter(function (x) { return x.layer === l.n; });
      guys = on.map(function (x, i) {
        var mine = x.teamId === t.teamId;
        var left = 8 + (i * 100 / Math.max(1, on.length));
        return '<div class="guy ' + (mine ? 'me' : '') + '" style="left:' + left + '%">' +
          '<div class="p">' + (mine ? '☗' : '☖') + '</div>' +
          '<div class="g">' + esc(mine ? '你們' : x.name.split(' · ')[0]) + '</div></div>';
      }).join('');
    } else if (here) {
      guys = '<div class="guy me" style="left:8%"><div class="p">☗</div><div class="g">你們</div></div>';
    }
    return '<div class="band" ' + layerVars(l.n) + '>' +
      '<div class="lab"><div class="code">' + l.code + (here ? ' · 現在' : '') + '</div>' +
      '<div class="nm" style="color:' + (seen ? 'var(--Ll)' : 'var(--mute)') + '">' +
        (seen ? esc(l.name) : '？？？') + '</div>' +
      (seen ? '<div class="code" style="letter-spacing:0">' + esc(l.stage) + '</div>' : '') + '</div>' +
      /* 霧遮的是「那一層是什麼」，不是「誰在那裡」——
         已經在下面的組看得到，那是這張圖唯一會催人的東西。 */
      '<div class="field">' +
        (seen ? '' : '<div class="fog">下面還沒開</div>') + guys +
        (seen ? '<div class="boss"><img src="' + pxSvg(b.px, b.hue, !here) + '" alt=""></div>' : '') +
      '</div></div>';
  }).join('');
  return '<div class="map">' + body + '</div>';
}

PAGES.map = function () {
  var t = myTeam();
  var opened = where('Passes', function (p) { return p.teamId === t.teamId; }).length;
  return head('MAP', '迷霧地圖',
    '這張圖只有一條軸：深度。') +
    '<div class="card sunk"><div class="fine">' +
      '頂上是 ' + opened + ' / ' + RULES.LAYERS + ' 層，不是任務數——' +
      '任務沒有固定總量，他隨時可以再開，所以那個數字不是進度。<br>' +
      '層裡面不鋪格子：任務沒有順序，鋪成一排等於系統在替你們排先做哪一項。' +
      '下面還沒開的那幾層看不到是什麼，但看得到誰已經在那裡。<br>' +
      '留下的只有小人（你們在哪一層）與霧（下面還沒開）。<br>' +
      esc(RULES.GATE) +
    '</div></div>' +
    mapBands(false);
};

/* ================= 結局 ================= */

PAGES.end = function () {

    '<div class="card layer" ' + layerVars(4) + '>' +
      '<div class="eyebrow">他最後寫的</div><p style="margin:0">' + nl(f.teacherWord || '') + '</p></div>' +

      ? '<div class="card"><div class="eyebrow">你們取的名字</div>' +

        '<p><span class="btn" data-act="finale">封存</span></p>');
