   換成一份，而且是那一組自己寫的（存在 Teams.acts，見 40-db.js）。
   同一份清單問三個不同的問題：

     每天      今天動的是哪一件？
     承諾時    哪幾件你覺得會比想的久？
     營火      哪一件真的比你想的久？

   零輸入框那條原則沒有破：清單只寫一次，之後每天都是一下點擊。
   沒寫的組也走得完——那一顆鍵就退回「我今天來過了」。 */
RULES.STEPS_MAX = 12;     /* 一個任務最多分幾段 */

/* ---------- 系統問得多深，跟著走過幾趟走 ----------

   漸進的不是難度（那是老師派的任務），是系統要求他說明自己的深度。
   本來第一趟問得最多——預測哪幾段會拖、勾哪幾段做完、打字寫困境、
   標哪幾天動過。他還沒走過一趟，那些問題答不出來：
   「哪一段比你想的久」對一個沒有上一次的人不成立。

   數字是走完幾趟。走完 2 趟（＝第 3 趟）開始問預測與日子，
   走完 4 趟（＝第 5 趟）開始問困境——那時候他才累積得出那種東西。 */
RULES.ASK = {
  flags: 2,   /* 承諾時：哪幾段會比你想的久 */
  hard:  4    /* 交出去時：困境與進度，要打字 */
  /* days 拿掉了：問它的那一頁（收起來）整個不見了。
     留一個沒有人問的問題在規則檔裡是一句謊話。 */
};

/* 走完 n 趟的人，這一題該不該出現。
   回 'new' 代表這一趟剛好是它第一次出現——畫面上要標出來，
   因為「系統問你更多」本身就是走得夠遠的證據。 */
RULES.asks = function (key, done) {
  var need = RULES.ASK[key];
  if (need == null) return 'on';
  var n = Number(done) || 0;
  if (n < need) return 'off';
  return n === need ? 'new' : 'on';
};

  { key: 'over', name: '量尺', tro: 2,  eyebrow: '哪一件比你想的久' }
];
RULES.keepOf = function (key) {
  for (var i = 0; i < RULES.KEEPS.length; i++) {
    if (RULES.KEEPS[i].key === key) return RULES.KEEPS[i];
  }
  return null;
};



/* ---------- 停滯 ----------
   系統不發「已逾期」通知。狀態本身就是回饋：幾天沒推進，畫面自己會暗下來。
   這是勸導式設計的核心——不指責，只是讓停下來這件事看得見。 */
RULES.stallOf = function (lastPushAt, nowTs) {
  if (!lastPushAt) return { level: 0, days: 0 };
  var days = Math.floor((nowTs - lastPushAt) / 86400000);
  if (days >= RULES.SLEEP_DAYS) return { level: 2, days: days };   /* 睡著 */
  if (days >= RULES.STALL_DAYS) return { level: 1, days: days };   /* 長藤蔓 */
  return { level: 0, days: days };
};

/* 停滯的說法。不講「你逾期了」，講畫面上發生了什麼。
   而且講的是他自己說的那個數字，不是我規定的期限。 */
RULES.stallSay = function (level, days) {
  if (level === 2) return '水淹過頭了。比你自己說的多 ' + days + ' 天。';
  if (level === 1) return '水漫過來了。比你自己說的多 ' + days + ' 天。';
  return '';
};

/* ---------- 走到哪了 ----------
   迷霧走廊的長度＝承諾的天數。推進一次前進一格。
   走完不等於完成——完成是上傳作業那一刻。 */
RULES.progress = function (pushes, est) {
  var e = Math.max(1, Number(est) || 1);
  return clamp(0, 1, (Number(pushes) || 0) / e);
};


/* ===== 30-art.js ===== */
/* 畫圖。只有兩件事：一個雜湊、一個把像素字串變成 SVG 的函式。

   全都是純函式：同樣的輸入永遠得到同一張圖、同一隻魔物。
   沒有任何一個地方會在 render 的時候擲骰子。 */

/* 字串雜湊。同一個字串永遠得到同一個數字——
   「哪一組遇到哪一隻」就是靠它算的，所以不能換演算法。 */
function hash(s) {
  var h = 2166136261;
  s = String(s);
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}

var ART_CACHE = {};

/* 像素字元：. 透明 · # 身體 · + 陰影 · * 反光 · ~ 拖影
   一張圖是一個字串陣列，每一格畫成一個 <rect>。
   換配色就是換同一張圖的意思——魔物越深越冷，招牌越好越亮。 */
function pxSvg(px, pal, dim) {
  if (!px || !px.length) return '';
  /* 整組調色盤都要進 key。本來只取 pal['#']——兩組 '#' 相同、
     其餘不同的調色盤會互相拿到對方的圖。 */
  var pk = '';
  Object.keys(pal).sort().forEach(function (c) { pk += c + pal[c]; });
  var key = px.join('') + '|' + pk + '|' + (dim ? 1 : 0);
  if (ART_CACHE[key]) return ART_CACHE[key];

  var W = px[0].length;
  var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
    W + ' ' + px.length + '" shape-rendering="crispEdges">'];

  px.forEach(function (row, y) {
    for (var x = 0; x < row.length; x++) {
      var ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      /* 先查調色盤。查得到就用那一個顏色——一個角色因此可以有
         頭髮、皮膚、衣服、金屬各自的顏色，不是只有本體加陰影。
         查不到才走舊的別名（+ 與 o 是陰影、* 與 z 是反光）。 */
      var fill = pal[ch];
      if (fill === undefined) {
        fill =
          ch === '*' ? pal['*'] :
          (ch === '+' || ch === 'o') ? pal.o :
          ch === '~' ? (pal['~'] || pal.o) :
          ch === 'z' || ch === 'Z' ? (pal['*'] || pal['#']) :
          pal['#'];
      }
      out.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + fill + '"' +
        (dim ? ' opacity=".26"' : '') + '/>');
    }
  });

  out.push('</svg>');
  var url = 'data:image/svg+xml;utf8,' + encodeURIComponent(out.join(''));
  ART_CACHE[key] = url;
  return url;
}

/* ---------- 那一閃 ----------

   登場、還有拿到什麼的時候，先看到一張純白的剪影，再落回本來的顏色。
   舊版寶可夢就是這樣做的：沒有粒子、沒有光暈，靠的是一瞬間的反白。

   做法是把同一張圖用全白的配色再畫一次疊在上面，然後淡出——
   用一塊白色的方塊蓋上去會變成一個方形的閃光，那不是剪影。

   收尾用 JS（見 55-ui.js 的 render），不是靠動畫跑完：
   動畫的時鐘會被凍住，那時候白色會一直蓋著。 */
var FLASH_PAL = { '#': '#FFF3D8', o: '#FFF3D8', '*': '#FFFFFF' };

function pxFlash(px) {
  if (!px || !px.length) return '';
  return '<img class="px pxflash" src="' + pxSvg(px, FLASH_PAL) + '" alt="">';
}


/* ===== 35-anim.js ===== */
/* 逐格動畫。

   上一個作品的原則是「互動不做動畫」——那是對的，因為那裡的回饋是
   老師寫的字。這裡相反：推進鍵按下去如果什麼都沒發生，那顆鍵就只是
   一個打卡機。角色揮劍、藤蔓碎裂、衝刺拖影——那一下就是獎勵本身。

   做法：不用 CSS transition，用真的換格。每一幀是一張像素圖，
   固定間隔換一張，換完回到靜止。這樣它跟 8-bit 是同一種東西，
   而不是「像素圖上面套了現代動畫」。

   全部尊重 prefers-reduced-motion：關掉的話直接跳到結果。 */

var REDUCED = (function () {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
})();

/* 一次只跑一個。跑到一半又按，前一個直接收掉。 */
var ANIM = null;

function stopAnim() {
  if (ANIM) { clearTimeout(ANIM.t); ANIM = null; }
}

/* 把一連串的幀放進某一個位置。
     el     要換 src 的 <img>
     frames [[px, pal], …]
     ms     每一幀停多久
     done   放完之後做什麼 */
function playFrames(el, frames, ms, done) {
  stopAnim();
  if (!el || REDUCED || !frames.length) { if (done) done(); return; }
  var i = 0;
  ANIM = { t: null };
  var step = function () {
    if (i >= frames.length) { ANIM = null; if (done) done(); return; }
    el.src = pxSvg(frames[i][0], frames[i][1], false);
    i++;
    ANIM.t = setTimeout(step, ms);
  };
  step();
}

/* ---------- 揮劍 ----------
   推進的那一下。靜止 → 揮 → 靜止，中間格子亮一格。 */
function animPush(onDone) {
  var el = document.querySelector('.hero .ch');
  if (!el) { if (onDone) onDone(); return; }
  playFrames(el, [
    [HERO.swing, HERO.pal],

    [HERO.idle, HERO.pal]
  ], 110, onDone);
}

/* ---------- 藤蔓碎裂 ----------
   停滯之後推進的那一下。藤蔓不是淡出，是碎成三段再消失——
   淡出看起來像「系統原諒你」，碎裂看起來像「你自己弄斷的」。 */
var VINE_BREAK = [
  ['+#..........#+..', '.+#........#+...', '..+#..*...#+....', '...+#.#*.#+.....',
   '....+#.*.#+.....', '.....+#.#+......', '....+#.*.#+.....', '...+#.#*.#+.....',
   '..+#..*...#+....', '.+#........#+...', '+#..........#+..', '................',
   '................', '................', '................', '................'],
  ['.#..........#...', '..#........#....', '...#..*...#.....', '....#....#......',
   '................', '.....#..#.......', '................', '...#..*...#.....',
   '..#........#....', '.#..........#...', '................', '................',
   '................', '................', '................', '................'],
  ['..*..........*..', '................', '......*.........', '................',
   '................', '................', '................', '.........*......',
   '................', '..*..........*..', '................', '................',
   '................', '................', '................', '................']
];

function animVineBreak(onDone) {

  if (!el) { if (onDone) onDone(); return; }
  playFrames(el, VINE_BREAK.map(function (px) { return [px, VINE.pal]; }), 90, function () {

/* ---------- 大躍進 ----------
   拿到裝備之後的衝刺。四幀：蹲 → 起 → 衝 → 衝（拖影更長）。 */
var DASH_2 = [
  '................', '.~~~~..++++.....', '~~~~..+#**#+....', '.~~~~.+#**#+....',
  '..~~~..+##+.....', '...~~+++####++..', '....+#*######*+.', '....+#*######*+.',
  '.....+########+.', '......+#....#+..', '.....+#......#+.', '....+#........#+',

];

function animDash(onDone) {

/* ---------- 鑿下去那一下 ----------
   揮劍如果只有角色在動，看起來像角色在原地比劃。整條走廊抖一下，
   那一下才像是「打到東西了」。位移只有 3px——跟身上一個像素同一個量級。 */
function shakeScene() {
  if (REDUCED) return;
  var el = document.querySelector('.scn-in');
  if (!el) return;
  el.classList.remove('hit');
  void el.offsetWidth;           /* 重新觸發動畫 */
  el.classList.add('hit');
}

/* ---------- 睡著的呼吸 ----------
   不是動畫，是狀態。用 CSS 做（見 50-style.css 的 .px.sleep），
   這裡不管——逐格動畫留給「有事發生」的那一刻。 */


/* ===== 40-db.js ===== */
/* 資料與動作。

   所有會改到資料的事都叫 act*，而且只有這裡改得到 DB。畫面只讀不寫。
   存在 localStorage，因為這一版是給人打開就能走一遍的原型。

   跟上一版最大的差別：沒有分數、沒有層、沒有收集。
   一個里程碑的一生是：派發 → 承諾天數 → 每日推進 → 上傳 → 判定 →
   （失準就復盤）→ 老師勾可以 → 學生三選一 → 大躍進。

   老師在這整條線上只碰兩個地方：派發、勾可以。其他每一步都是學生的。 */

var DB = null;
var STORE = 'dungeon.v1';

/* 試用時可以快轉。所有時間都走 now()，不直接用 Date.now()。 */
var CLOCK = 0;
function now() { return Date.now() + CLOCK; }
var DAY = 86400000;

/* 只比日期，不比時分——「今天推過了沒」問的是日子，不是 24 小時。 */
function dayOf(ts) {
  var d = new Date(ts);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function daysBetween(a, b) {
  var A = new Date(a), B = new Date(b);
  A = new Date(A.getFullYear(), A.getMonth(), A.getDate());
  B = new Date(B.getFullYear(), B.getMonth(), B.getDate());
  return Math.round((B - A) / DAY);
}

function blank() {
  return {
    Config: { seq: 1 },
    Users: [], Classes: [], Roster: [], Teams: [],
    /* 任務：老師派的。同一個任務可以只發給某幾組。 */
    Milestones: [],
    /* 一組在一個任務上的狀態。這張表是整個系統的心臟。 */
    Runs: [],
    /* 每一次推進打卡。一天一筆。 */
    Pushes: [],
    /* 每一趟留下的那一句。存的是當下算出來的字，不是規則的 key——
       規則以後改了，他當時留的那句話不會跟著變成別的意思。 */
    Keeps: [],
    /* 研究紀錄：誰、什麼時候、做了什麼。只增不刪。 */
    Events: [],
    /* 登入狀態 */
    Session: null
  };
}

function nid(p) { return p + (DB.Config.seq++); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) {} }
function load() {
  try { DB = JSON.parse(localStorage.getItem(STORE)); } catch (e) { DB = null; }
  return !!(DB && DB.Users && DB.Users.length);
}
function find(tbl, fn) { for (var i = 0; i < DB[tbl].length; i++) if (fn(DB[tbl][i])) return DB[tbl][i]; return null; }
function where(tbl, fn) { return DB[tbl].filter(fn); }

function teamOf(id) { return find('Teams', function (t) { return t.teamId === id; }); }
function userOf(id) { return find('Users', function (u) { return u.userId === id; }); }
function msOf(id) { return find('Milestones', function (m) { return m.msId === id; }); }
/* 這一組在這個任務上的那一趟。

   「重新想過」的那幾趟要跳過：它們留在資料庫裡當紀錄，但那個任務
   對這一組來說是重新開始的，所以要讓畫面回到「還沒承諾」。 */
function runOf(teamId, msId) {
  return find('Runs', function (r) {
    return r.teamId === teamId && r.msId === msId && r.state !== 'rethought';
  });
}

/* ---------- 一組看得到哪些任務 ---------- */
/* 這一組收得到哪幾個任務。

   三層篩：同一個課程 → 派的人帶不帶這一組 → 有沒有指名哪幾組。
   中間那一層是新的：老師對任務規劃有自己的自主性，所以他派的
   東西不會落到別位老師帶的組上。

   兩邊都可以是空的，空的就不篩——舊資料（沒有 mentorId 的任務、
   還沒指定老師的組）行為跟以前一模一樣。 */
function msFor(teamId) {
  var t = teamOf(teamId);
  if (!t) return [];
  return where('Milestones', function (m) {
    if (m.classId !== t.classId) return false;
    if (m.mentorId && t.mentorId && m.mentorId !== t.mentorId) return false;
    return !m.teams.length || m.teams.indexOf(teamId) >= 0;
  });
}

/* 這一組的所有 run，照派發時間排 */
function runsFor(teamId) {
  return msFor(teamId).map(function (m) {
    var r = runOf(teamId, m.msId);
    if (!r) {
      /* 派了但還沒承諾——先給一個空的，畫面才知道要問滑桿 */
      r = { runId: null, teamId: teamId, msId: m.msId, state: 'fresh',
            est: 0, flags: [], pushes: 0, overs: [], steps: [], keep: null };
    }
    return { ms: m, run: r };
  }).sort(function (a, b) { return a.ms.at - b.ms.at; });
}

/* ---------- 這一組現在該做什麼 ----------
   一次只回答一件事。首頁只給一個動作，其餘都是資訊。 */
function nextThing(teamId) {
  /* 已經走出去的組不再有下一件事。這不是鎖住畫面——
     他們還看得到留下的、班級地下城、紀錄，只是不再被派任務。 */
  var tm = teamOf(teamId);
  if (tm && tm.leftAt) return { kind: 'left' };
  /* 第一件事：先給這個專案取個名字。

     本來第一次進來看到的是一條空廊道，寫著「等老師派下一個」——
     那是最糟的第一印象：第一個動作是「等」。取名字三十秒做得完，
     而且它完全屬於他們自己（那塊牌子掛在洞口上，別組也看得到）。 */
  if (tm && !tm.project) return { kind: 'name' };
  /* 門開了——那是這個系統裡最後一件事。 */
  if (tm && tm.exitOk) return { kind: 'exitopen' };
  if (tm && tm.exitAsk) return { kind: 'waitexit' };

  var rows = runsFor(teamId);
  /* 1. 交了、判定出來了、還沒按「好」。
     省思那一題搬到交出去之前了，所以這裡不再分岔——
     每一個人都想過一次，不是只有失準的人。 */
  var judged = rows.filter(function (x) { return x.run.state === 'judged'; })[0];
  if (judged) return { kind: 'stamped', row: judged };
  /* 2. 老師退回來了。
     排在這裡不是排在後面：它跟「老師勾了」同一類——有人為你做了一件事，
     而且在等你回應。放到 fresh 後面的話，手上同時有新任務的時候，
     退回會被一個還沒開始的任務蓋掉。

     判定沒變、深度沒動，只是那份成果還沒被收下。 */
  var back = rows.filter(function (x) { return x.run.state === 'back'; })[0];
  if (back) return { kind: 'back', row: back };

  /* 3. 老師勾可以了，還沒挑裝備 */
  /* approved 這個狀態不再出現：老師勾下去就直接 done（見 actApprove）。 */
  /* 3. 正在做的那一趟。

     這一條排在「還沒承諾的」前面，順序很要緊：反過來的話，老師派了
     三個任務，學生會被連問三次要花幾天，而且從頭到尾看不到自己
     正在走的那一趟。手上有事的時候，系統不該再遞一件事過來。

     這裡本來還有三個狀態：叫醒、今天還沒按、今天按過了。那三個都在
     催他每天開一次，拿掉了——他開始之前來說幾天，做完回來交。
     過了自己說的天數畫面會暗、水會漫過來（見 stallOf），
     但那不是一件「要他去處理」的事，它只是狀態。 */
  var wait = rows.filter(function (x) { return x.run.state === 'running'; })[0];
  if (wait) {
    var more = rows.filter(function (x) { return x.run.state === 'fresh'; }).length;
    return { kind: 'doing', row: wait, more: more };
  }

  /* 4. 派了但還沒承諾 */
  var fresh = rows.filter(function (x) { return x.run.state === 'fresh'; })[0];
  if (fresh) return { kind: 'commit', row: fresh };
  var sent = rows.filter(function (x) { return x.run.state === 'submitted'; })[0];
  if (sent) return { kind: 'review', row: sent };
  return { kind: 'idle', row: null };
}

function pushedToday(teamId, runId) {
  if (!runId) return false;
  var d = dayOf(now());
  return !!find('Pushes', function (p) {
    return p.teamId === teamId && p.runId === runId && p.day === d;
  });
}

/* 這一個 run 最後一次推進是什麼時候 */
/* 這一趟動過的最後一天。標日子的時候會用到。 */
function lastPush(runId) {
  var ps = where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  });
  return ps.length ? ps[ps.length - 1].at : 0;
}

/* 這一組現在的光。

   本來看「幾天沒有按推進」。學生不必每天開了之後，那個數字算不出來，
   而且它本來就把「有沒有開 app」跟「有沒有在做事」混為一談。

   改成看行事曆：過了自己說的天數，畫面就開始暗。
   那個數字是他自己說的，不是我規定的期限；而且系統不用問任何人
   就知道今天是幾號。他不開，它也在走。 */
function stallOf(teamId) {
  var cur = runsFor(teamId).filter(function (x) { return x.run.state === 'running'; })[0];
  if (!cur) return { level: 0, days: 0 };
  var est = cur.run.est || 1;
  var gone = daysBetween(cur.run.committedAt, now());
  var over = gone - est;
  if (over >= RULES.band(est) + 1) return { level: 2, days: over };
  if (over > 0) return { level: 1, days: over };
  return { level: 0, days: 0 };
}

/* 深度＝完成過幾個任務。沒有終點。 */
/* 走到第幾層。判定出來就算走完——那一趟的兩個數字已經定了，
   不需要誰批准。所以廊道往前、深度 +1、地層換，都在判定當下發生。

   本來這裡算的是 state==="done"，而 done 要等老師勾完、學生再封存。
   老師三天不看，整條廊道就凍在原地——系統判的是預估準度，
   卻擋在作業品質的閘門後面。 */
function depthOf(teamId) {
  return where('Runs', function (r) {
    return r.teamId === teamId && !!r.stamp;
  }).length;
}

/* 留得下記號的層數。這一支才要等老師——有人看過，那一趟才成立。
   走是他自己的事，留下來是要有人看過的事。 */
function sealedDepth(teamId) {
  return where('Runs', function (r) {
    return r.teamId === teamId && (r.state === 'approved' || r.state === 'done');
  }).length;
}

/* 走到多深，跟站得住多深。

   前面那個數字是系統給的（判定出來就變深），後面那個要老師收下。
   兩個並排就是這一套的兩種回饋，而且一個評價的字都不用寫。 */
function depthSay(teamId) {
  return { walked: depthOf(teamId), sealed: sealedDepth(teamId) };
}

/* 廊道口掛的那塊牌子。

   本來它有三階材質，走得越深牌子越好。拿掉了——深度已經不是進度
   （路是隨機給的，而且一直循環），留著一個「越多越好」的漸層
   跟其他每一條規則都打架。

   它現在只有一個用途，而且那個用途一直都在：廊道口掛的是誰。
   上面寫什麼是他們自己決定的。 */
function signOf(teamId) {
  return SIGNS.iron;
}

/* 這一組的預估準度紀錄——復盤與老師審閱都要看 */
function accuracyOf(teamId) {
  var done = where('Runs', function (r) {
    return r.teamId === teamId && r.stamp;
  });
  var n = { early: 0, exact: 0, late: 0 };
  done.forEach(function (r) { n[r.stamp] = (n[r.stamp] || 0) + 1; });
  return { total: done.length, early: n.early, exact: n.exact, late: n.late, rows: done };
}

/* ---------- 誰帶哪幾組 ----------

   一個課程三位老師，每位帶不同的組。mentorId 空的組還沒指定，
   那時候每位老師都看得到它——不然剛貼完名冊的組會沒有人管。 */
function teachersOf(classId) {
  return where('Users', function (u) {
    return u.role === 'teacher' && u.classId === classId;
  });
}

/* 這位老師要處理的那幾組。mentorId 沒給就是整個課程。 */
function teamsUnder(classId, mentorId) {
  return where('Teams', function (t) {
    if (t.classId !== classId) return false;
    if (!mentorId) return true;
    return !t.mentorId || t.mentorId === mentorId;
  });
}

/* ---------- 全班生態 ----------
   沒有名次。只有「誰在哪一條廊道、走到多深、現在是什麼狀態」。 */
function ecology(classId, mentorId) {
  return teamsUnder(classId, mentorId).map(function (t) {
    var st = stallOf(t.teamId);
    var cur = runsFor(t.teamId).filter(function (x) { return x.run.state === 'running'; })[0];
    return {
      teamId: t.teamId, name: t.name,
      depth: depthOf(t.teamId),
      /* 疊起來的那幾塊。sealed 是老師收下的，pending 是交出去了還在他那邊。
         走完但沒被收下的那一趟看得到，但它是虛的——那一塊還沒站住。 */
      sealed: sealedDepth(t.teamId),
      pending: where('Runs', function (r) {
        return r.teamId === t.teamId &&
          (r.state === 'submitted' || r.state === 'back' || r.state === 'judged');
      }).length,
      stall: st.level,
      status: statusOf(t.teamId),
      /* 正在打的那一隻，跟走到哪 */
      onMs: cur ? cur.ms.title : '',
      at: cur ? RULES.progress(cur.run.pushes, cur.run.est) : 0,
      sign: signOf(t.teamId).key
    };
  });
}

/* ================= 學生的動作 ================= */

/* 承諾：拉滑桿決定幾天，順便標「哪幾段我覺得會比想的久」。
   標的是老師分的段，不是我列的八種卡關原因。 */
/* 他自己拆的那幾件，跟每一件估幾天。

   [{ n: '找到人', d: 2 }, ...]。空陣列＝沒拆，那時候 est 是他
   直接按出來的數字。 */
function planDays(plan) {
  var n = 0;
  (plan || []).forEach(function (x) { n += Number(x.d) || 0; });
  return n;
}

function actCommit(teamId, msId, est, flags, plan) {
  var r = runOf(teamId, msId);
  if (r) return r;
  var pl = (plan || []).filter(function (x) { return x && x.n; })
    .slice(0, RULES.STEPS_MAX)
    .map(function (x) {
      return { n: String(x.n).slice(0, 24),
        d: clamp(1, RULES.EST_MAX, Number(x.d) || 1) };
    });
  /* 列了就是加起來。永遠只有一個地方在輸入。 */
  if (pl.length) est = planDays(pl);
  r = {
    runId: nid('R'), teamId: teamId, msId: msId,
    state: 'running',
    est: clamp(RULES.EST_MIN, RULES.EST_MAX, Number(est) || RULES.EST_DEFAULT),
    plan: pl,
    flags: flags || [],
    committedAt: now(),
    pushes: 0, overs: [], steps: [], keep: null, stamp: null,
    /* 擋在廊道盡頭的是哪一隻，承諾那一刻就決定並存下來。
       本來是每次要用再算一次，而算的時候看的是「現在」的深度——
       所以走深了之後回頭看，過去每一趟遇到的那一隻會跟著變。
       那是假的紀錄。 */
    mob: mobFor(msId, teamId).n
  };
  DB.Runs.push(r);
  save();
  logEvent('commit', { teamId: teamId, runId: r.runId, msId: msId, est: r.est,
    flags: (r.flags || []).map(function (i) { return stepName(r.runId, i); }).join('、') });
  return r;
}

/* 推進：一天一次。回傳有沒有真的推到。 */
/* 推進。

     step  今天動的是老師分的第幾段（沒分段就是 -1）
     back  補登幾天前。0 是今天，1 是昨天，最多到 2。

   補登這件事看起來像作弊，其實相反：實際天數是從承諾那天到交出去
   那天算的，補登一格不會讓誰早一天完成，也不會改判定。它唯一改變的
   是走廊上少不少一盞燈——而「忘了按一天就再也補不回來」正是
   讓人整條放棄的那個崖。 */
function actPush(teamId, runId, step, back) {
  return logDay(teamId, runId, 'move', step, back);
}

/* 今天沒有動。

   跟推進一樣是一下點擊，一樣一天一次。差別在它不會讓畫面變亮，
   也不會讓停滯計時歸零——說實話不用付代價，但也買不到任何東西。
   剛好是這樣，才沒有說謊的理由。

   它唯一給的是：之後回頭看，那一天是「我說我沒動」，不是一個空格。 */
function actRest(teamId, runId, back) {
  return logDay(teamId, runId, 'rest', -1, back);
}

function logDay(teamId, runId, kind, step, back) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return false;
  var b = Math.max(0, Math.min(RULES.BACKFILL_MAX, Number(back) || 0));
  var when = now() - b * DAY;
  if (when < r.committedAt) return false;      /* 承諾之前的日子不算 */
  if (pushedOn(teamId, runId, dayOf(when))) return false;
  DB.Pushes.push({
    pushId: nid('P'), teamId: teamId, runId: runId, kind: kind,
    day: dayOf(when), at: when, step: (step == null ? -1 : step), back: b
  });
  /* pushes 只算真的動過的天數。判定不看它，但畫面看得到。 */
  if (kind === 'move') r.pushes++;
  save();
  logEvent(kind === 'move' ? 'push' : 'rest', {
    teamId: teamId, runId: runId, n: r.pushes,
    seg: kind === 'move' ? stepName(runId, step) : '', back: b
  });
  return true;
}

/* 勾掉／取消勾掉一段。隨時可以改——勾錯了不該是一件要去求人的事。 */
function actTickStep(teamId, runId, i) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.steps = r.steps || [];
  var k = r.steps.indexOf(i);
  if (k < 0) r.steps.push(i); else r.steps.splice(k, 1);
  save();
  var m = msOf(r.msId);
  logEvent('tick', {
    teamId: teamId, runId: runId,
    step: (m && m.steps && m.steps[i]) || '',
    on: k < 0 ? 1 : 0
  });
  return r;
}

/* 這一趟勾了幾段。沒有分段的任務回 null——
   沒有的東西不要畫成 0/0，那看起來像什麼都沒做。 */
/* 這一趟分成哪幾段。

   先看他自己拆的（承諾的時候列的那幾件），沒有才退回老師寫的分段。
   兩份清單合成一份：畫面上永遠只有一排段，不會有「老師的」跟
   「我的」兩排。 */
function stepsOf(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  if (r.plan && r.plan.length) {
    return { all: r.plan.map(function (x) { return x.n; }),
      days: r.plan.map(function (x) { return x.d; }),
      on: r.steps || [] };
  }
  var m = msOf(r.msId);
  if (!m || !m.steps || !m.steps.length) return null;
  return { all: m.steps, on: r.steps || [] };
}

/* 這一個 run 在某一天推過了沒 */
function pushedOn(teamId, runId, day) {
  return !!find('Pushes', function (p) { return p.runId === runId && p.day === day; });
}

/* 最近幾天裡，哪幾天還沒按。回傳 [{back, label}]，只看承諾之後的日子。 */
function openDays(teamId, runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var out = [];
  for (var b = 1; b <= RULES.BACKFILL_MAX; b++) {
    var when = now() - b * DAY;
    if (when < r.committedAt) break;
    if (!pushedOn(teamId, runId, dayOf(when))) {
      out.push({ back: b, label: b === 1 ? '昨天' : '前天' });
    }
  }
  return out;
}

/* 標／取消標「那一天我動過」。

   每天要按的那一版拿掉之後，這一份資料改成在交出去那一頁一次補齊。
   i 是從承諾那天算起的第幾天（0 起算）。

   它不進判定——判定只看承諾幾天與行事曆過了幾天——所以標不標、
   標得準不準都不會改變任何結果，也因此沒有說謊的理由。 */
function actMarkDay(teamId, runId, i) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return false;
  var when = r.committedAt + i * DAY;
  if (when > now() + DAY) return false;
  var day = dayOf(when);
  var has = find('Pushes', function (p) { return p.runId === runId && p.day === day; });
  if (has) {
    DB.Pushes = DB.Pushes.filter(function (p) {
      return !(p.runId === runId && p.day === day);
    });
  } else {
    DB.Pushes.push({
      pushId: nid('P'), teamId: teamId, runId: runId, kind: 'move',
      day: day, at: when, step: -1, back: 0
    });
  }
  r.pushes = where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  }).length;
  save();
  logEvent('mark', { teamId: teamId, runId: runId, n: r.pushes });
  return true;
}

/* 這一趟的日誌。一格一天，從承諾那一天算起。

   本來這裡回的是「按過的那幾次」，所以沒按的日子根本不存在——
   看起來就像這一趟還沒開始。改成照日曆排之後，缺席看得見了。
   那不是指控，是把形狀畫出來。

   每一格三種：
     {kind:'move', step}  來過，動的是第幾段
     {kind:'rest'}        他自己說那一天沒動
     null                 沒有紀錄 */
function dayLog(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var end = r.submittedAt || now();
  var span = Math.max(r.est || 1, daysBetween(r.committedAt, end) + 1);
  span = Math.min(span, 60);
  var byDay = {};
  where('Pushes', function (p) { return p.runId === runId; }).forEach(function (p) {
    byDay[p.day] = { kind: p.kind || 'move', step: p.step == null ? -1 : p.step };
  });
  var out = [];
  for (var i = 0; i < span; i++) {
    out.push(byDay[dayOf(r.committedAt + i * DAY)] || null);
  }
  return out;
}

/* 這一趟動過的那幾天分別是第幾段。keepOffers 用。 */
function stepIdxOfRun(runId) {
  return where('Pushes', function (p) {
    return p.runId === runId && (p.kind || 'move') === 'move';
  }).sort(function (a, b) { return a.day - b.day; })
    .map(function (p) { return p.step == null ? -1 : p.step; });
}

/* ---------- 這一組現在是什麼狀態 ----------

   本來只有四種，而且全部從「幾天沒推進」推出來：
     ≥4 天 休息中／≥2 天 慢下來了／否則 前進中／沒任務 等派任務

   有兩個問題。

   一 · 「休息中」現在是錯的字。系統有了「今天沒有動」那顆鍵之後，
        休息變成他真的會宣告的狀態；而這個標籤講的是「四天沒推進」，
        兩件事撞在同一個字上。

   二 · 更要緊的：老師分不出「他說他沒動」跟「他完全沒有消息」。
        那是兩種完全不同的處境——一個誠實地卡住，要找他談；
        一個可能整個不見了，要找的是別的東西。系統其實知道差別
        （rest 那幾筆），只是畫面沒有用上。

   所以狀態改成看兩件事：多久沒推進、那幾天他有沒有回報。
   系統只陳述，不評價——「沒有消息」講的是紀錄，不是那一組的人。 */
function statusOf(teamId) {
  var cur = runsFor(teamId).filter(function (x) { return x.run.state === 'running'; })[0];
  if (!cur) return { key: 'idle', label: '等派任務', days: 0 };

  var st = stallOf(teamId);
  if (st.level === 0) return { key: 'move', label: '前進中', days: st.days };

  /* 沒推進的那幾天裡，他有沒有說過「今天沒有動」 */
  var log = dayLog(cur.run.runId);
  var tail = log.slice(Math.max(0, log.length - st.days));
  var told = false;
  tail.forEach(function (d) { if (d && d.kind === 'rest') told = true; });

  if (!told) return { key: 'quiet', label: '沒有消息', days: st.days };
  return st.level >= 2
    ? { key: 'stop', label: '他說在停', days: st.days }
    : { key: 'slow', label: '慢下來了', days: st.days };
}

/* 這一趟擋路的是哪一隻。戰鬥的時候存下來了就用存的——
   那才是他真的打過的那一隻。舊資料沒存就當場算一次。 */
function mobOfRun(run) {
  if (!run) return null;
  if (run.mob) {
    var c = faunaByName(run.mob);
    if (c) return c;
  }
  return mobFor(run.msId, run.teamId, runDepth(run));
}

/* 這一趟當時站在第幾層。

   depthOf 數的是「有判定的趟數」，所以在第 k 趟被判定之前，
   深度就是 k——也就是第 k 趟（從 0 起算）當時站的那一層。
   照判定的時間排，沒判定的就是現在這一層。 */
function runDepth(run) {
  if (!run || !run.stamp) return depthOf(run ? run.teamId : null);
  var mine = where('Runs', function (x) {
    return x.teamId === run.teamId && !!x.stamp;
  }).sort(function (a, b) {
    return (a.submittedAt || a.committedAt || 0) - (b.submittedAt || b.committedAt || 0);
  });
  for (var i = 0; i < mine.length; i++) {
    if (mine[i].runId === run.runId) return i;
  }
  return 0;
}

/* 圖鑑上次翻開之後，多遇到了幾隻。

   存的是「上次翻的時候有幾隻」而不是時間戳：遇到的順序不重要，
   重要的是他上次看完之後又多了幾個。0 就不掛通知。 */
function codexNew(u) {
  if (!u || !u.teamId) return 0;
  var now = Object.keys(metMobs(u.teamId)).length;
  return Math.max(0, now - (u.codexN || 0));
}
function markCodex(u) {
  if (!u || !u.teamId) return;
  var n = Object.keys(metMobs(u.teamId)).length;
  if (u.codexN === n) return;
  u.codexN = n;
  save();
}

/* 這一組遇過的那幾隻。全部看得到，這裡只是標出「你遇過」。 */
/* 這一趟遇到牠了沒有。

   遇到就算，不用打敗——走到自己說的那一天，牠就站在那裡了。
   交出去之後一定遇過（那一趟已經結束）。

   這一支同時是廊道上「要不要畫出牠」的判斷（見 61-scene.js），
   一個定義兩個地方用：畫面上看得到牠的那一刻，就是圖鑑記下的那一刻。

   本來 metMobs 只要 est 有值就算——那是「承諾了」，那時候他還在
   洞口，根本還沒走到。 */
function metRun(r) {
  if (!r || !r.runId) return false;
  if (r.state !== 'running') return true;
  var log = dayLog(r.runId), moved = 0;
  for (var i = 0; i < log.length; i++) {
    if (log[i] && log[i].kind === 'move') moved++;
  }
  return moved >= (r.est || 1);
}

/* 遇過的那幾隻。 */
function metMobs(teamId) {
  var seen = {};
  runsFor(teamId).forEach(function (x) {
    if (!metRun(x.run)) return;
    var m = mobOfRun(x.run);
    if (m) seen[m.n] = x.ms.title;
  });
  return seen;
}

/* 這一趟的形狀：承諾幾天、過了幾天、來過幾天、說沒動幾天、勾了幾段。
   老師看得到這個。系統不說任何一句判斷——它只把數字擺出來。 */
function runShape(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  var lg = dayLog(runId);
  var sp = stepsOf(runId);
  return {
    est: r.est,
    elapsed: lg.length,
    moved: lg.filter(function (d) { return d && d.kind === 'move'; }).length,
    rested: lg.filter(function (d) { return d && d.kind === 'rest'; }).length,
    blank: lg.filter(function (d) { return !d; }).length,
    steps: sp ? sp.on.length : null,
    stepsAll: sp ? sp.all.length : null
  };
}

/* estSpread（別組在同一個任務上說了幾天）與 todayMovers（今天班上
   還有幾條廊道在走）都拿掉了。前者會在按下承諾之前錨定他的預估，
   後者沒有任何人呼叫。跨組的數字只留在剖面圖與排行榜上——
   那兩處是位置與次數，不是「你應該幾天」。 */

/* 上傳：走到終點之後交出去。判定就在這一刻。 */
/* 還沒好，退出來重新想。

   原本那一趟留著當紀錄（確實承諾了幾天、確實走了幾天），但它沒有
   判定也沒有印章，所以不會進那根尺——退出去不是失準，是兩件事。
   新的一趟從今天重新算。

   如果退出去可以擦掉紀錄，每個人都會在快超時的時候退一次，
   這個系統就再也量不到任何東西。 */
function actRethink(teamId, runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.teamId !== teamId || r.state !== 'running') return false;
  r.state = 'rethought';
  r.went = Math.max(1, daysBetween(r.committedAt, now()));
  r.rethoughtAt = now();
  save();
  logEvent('rethink', { teamId: teamId, runId: runId, est: r.est, went: r.went });
  return true;
}

function actSubmit(teamId, runId, link) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return null;
  r.actual = Math.max(1, daysBetween(r.committedAt, now()));
  r.stamp = RULES.judge(r.est, r.actual).key;
  r.link = link || '';
  r.submittedAt = now();
  r.state = 'judged';
  save();
  logEvent('submit', { teamId: teamId, runId: runId, est: r.est, actual: r.actual, stamp: r.stamp });
  return r;
}

/* 復盤：點圖示標籤說明卡在哪。只有失準的時候會走到。 */
/* 上之前想的那一句。

   這裡本來還有一行 r.state = 'submitted'——那是舊營火流程的殘留：
   那時候省思排在判定之後，說完才進老師的清單。省思搬到「上」之前
   以後，那一行等於跳過整個判定：actSubmit 永遠拿不到 running。

   自己當學生走一次才發現的。loop.js 抓不到，因為它直接呼叫 DB 的
   函式，不走介面——所以下面補了一條斷言。 */
/* 回報。三樣東西，都不進判定——判定只讀承諾幾天與實際幾天。

     spent  每一件實際花幾天。他承諾的時候一件一件估過，
            現在一件一件回報實際；兩欄擺在一起就是他的估算練習。
     feel   順／普通／不順。
     why    為什麼。全系統唯一的自由書寫。 */
function actReflect(teamId, runId, overs, hard, pace, o) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  o = o || {};
  var pl = r.plan || [];
  if (o.spent) {
    r.spent = pl.map(function (x, i) {
      return clamp(0, RULES.EST_MAX, Number(o.spent[i]) || 0);
    });
  }
  if (o.feel) r.feel = ({ good: 1, ok: 1, bad: 1 })[o.feel] ? o.feel : '';
  if (o.why != null) r.why = String(o.why).slice(0, 300);
  r.overs = overs || [];
  /* 他們自己寫的兩段。系統沒有給選項，也不解讀——
     這是全系統唯一的自由書寫，而那正好是「不替他們定義」的極致。 */
  r.hard = (hard || '').slice(0, 300);
  r.pace = (pace || '').slice(0, 300);
  save();
  logEvent('reflect', { teamId: teamId, runId: runId,
    overs: (overs || []).map(function (i) { return stepName(runId, i); }).join('、') });
  return r;
}

/* 準時的直接排進老師的雷達，不用復盤 */
function actSkipCamp(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.state = 'submitted';
  save();
  return r;
}

/* 「領裝備」那一步併進 actPickGear 了：挑完就是領完，不用再按一次。 */

/* ================= 老師的動作 ================= */

/* 派一個任務。teams 空陣列＝全班。 */
/* 老師派一個任務。steps 是他自己分的段，選填。

   分段是老師寫的，不是系統列的——這跟「系統不定義他們在做什麼」
   不衝突：老師是人，而且那是他出的題目。系統只負責記住哪幾段被勾了。

   勾一段跟每天推進是兩件事，不要混：推進是「今天我來過」（一天一次），
   勾是「這一段做完了」（隨時，幾段都可以）。兩件事都不影響判定——
   判定從頭到尾只看承諾幾天與實際幾天。 */
function actPublish(classId, o) {
  var m = {
    msId: nid('M'), classId: classId,
    /* 誰派的。他派的東西只到他帶的組（見 msFor）——
       任務規劃與步調是每位老師自己的事。 */
    mentorId: o.mentorId || '',
    title: o.title, note: o.note || '',
    steps: (o.steps || []).slice(0, 12),
    teams: o.teams || [],
    /* 老師排的那一刻。0＝沒排。dueU 是他當初用的單位
       （小時／天／週），只用來決定要不要寫出幾點。
       它不進判定——判定只讀學生說幾天與實際幾天（見 RULES.judge）。 */
    due: Number(o.due) || 0,
    dueU: o.dueU || '',
    at: now()
  };
  DB.Milestones.push(m);
  save();
  logEvent('publish', { title: m.title, teams: (m.teams || []).length,
    steps: (m.steps || []).length });
  return m;
}

/* 老師排的日期還有幾天。沒排回 null。

   回的是天數不是日期，因為學生那一邊整個系統都在用天數——
   換成同一個單位他才不用在腦袋裡做一次換算。 */
/* 三個單位。老師排任務的時候腦袋裡的話是「兩週後」，不是日期。 */
var DUE_UNITS = [
  { k: 'h', name: '小時', ms: 3600000, def: 8,  max: 72 },
  { k: 'd', name: '天',   ms: DAY,     def: 7,  max: 90 },
  { k: 'w', name: '週',   ms: DAY * 7, def: 2,  max: 26 }
];
function dueUnit(k) {
  for (var i = 0; i < DUE_UNITS.length; i++) {
    if (DUE_UNITS[i].k === k) return DUE_UNITS[i];
  }
  return null;
}

/* 幾小時／幾天／幾週後，算成一個時刻。

   天與週落在那一天的最後一刻——排到 9/5，9/5 那一天還算數。
   小時是準確的時刻，因為「今天下午五點」就是那個意思。 */
function dueFrom(n, k) {
  var u = dueUnit(k);
  var q = Number(n) || 0;
  if (!u || q <= 0) return 0;
  q = Math.min(q, u.max);
  if (k === 'h') return now() + q * u.ms;
  var d = new Date(now() + q * u.ms);
  d.setHours(23, 59, 59, 0);
  return d.getTime();
}

/* 還有多久。剩不到一天就改用小時報——那時候「還有 1 天」是假的。 */
function dueIn(m) {
  if (!m || !m.due) return null;
  var left = m.due - now();
  if (left < 0) {
    return { days: Math.ceil(left / DAY), past: true, hours: 0 };
  }
  if (left < DAY) {
    return { days: 1, hours: Math.max(1, Math.round(left / 3600000)),
      past: false };
  }
  return { days: Math.ceil(left / DAY), hours: 0, past: false };
}

/* 還有多久，寫成一句。 */
function dueLeftSay(m) {
  var d = dueIn(m);
  if (!d) return '';
  if (d.past) return '過了 ' + (-d.days) + ' 天';
  if (d.hours) return '還有 ' + d.hours + ' 小時';
  return '還有 ' + d.days + ' 天';
}

/* 排的那一刻，寫成人看的樣子。用小時排的才寫幾點——
   天與週落在那一天的最後一刻，寫 23:59 只會讓人以為那是個規定。 */
function dueSay(m) {
  if (!m || !m.due) return '';
  var d = new Date(m.due);
  var s = (d.getMonth() + 1) + '/' + d.getDate();
  if (m.dueU !== 'h') return s;
  var mm = d.getMinutes();
  return s + ' ' + d.getHours() + ':' + (mm < 10 ? '0' + mm : mm);
}

/* 交出去之後排在哪裡。

   老師那一頁照「等最久」排，所以他的位置是算得出來的。回 null
   代表這一趟不在等——沒有東西要說的時候就不要說。

   給學生看的是位置與天數，不是「老師很慢」。被催的應該是老師，
   而催老師這件事不該由學生端的畫面來做。 */
function waitAt(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'submitted') return null;
  var t = teamOf(r.teamId);
  if (!t) return null;
  var q = radar(t.classId, t.mentorId);
  for (var i = 0; i < q.length; i++) {
    if (q[i].run.runId === runId) {
      return { at: i + 1, of: q.length,
        days: daysBetween(r.submittedAt, now()) };
    }
  }
  return null;
}

/* 這一組給哪一位老師帶。空字串＝收回來，變成大家都看得到。 */
function actMentor(teamId, mentorId) {
  var t = teamOf(teamId);
  if (!t) return false;
  t.mentorId = mentorId || '';
  save();
  return true;
}

/* 這一個班有沒有開排行榜。預設關。 */
function rankOn(classId) {
  var c = find('Classes', function (x) { return x.classId === classId; });
  return !!(c && c.rank);
}

function actSetRank(classId, on) {
  var c = find('Classes', function (x) { return x.classId === classId; });
  if (!c) return null;
  c.rank = !!on;
  save();
  logEvent('rank', { on: c.rank ? 1 : 0 });
  return c;
}

/* 老師的雷達：誰交了、等多久了 */
/* 等你看的那幾件。只有自己帶的組——三位老師共用一個課程，
   同一個佇列會讓 A 老師勾到 B 老師的組。 */
function radar(classId, mentorId) {
  var out = [];
  teamsUnder(classId, mentorId).forEach(function (t) {
    runsFor(t.teamId).forEach(function (x) {
      if (x.run.state !== 'submitted') return;
      out.push({
        team: t, run: x.run, ms: x.ms,
        waited: daysBetween(x.run.submittedAt, now())
      });
    });
  });
  return out.sort(function (a, b) { return b.waited - a.waited; });
}

/* 老師勾「可以」。他不選裝備——選哪一件是學生的事。
   他能加一句話，那句話才是他的回饋。 */
/* 退回：還沒收下。

   判定完全不動——那一趟的兩個數字在他交出去的當下就定了，
   重做不會讓他當初說的話變成別的話。深度也不動，他確實走過那幾天。
   不動的東西這麼多，是因為退回講的只有一件事：那份成果還沒被收下。

   必須帶一句話。不寫理由的退回等於「再做一次，但我不告訴你為什麼」。 */
function actReject(runId, word) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'submitted') return null;
  if (!String(word || '').trim()) return null;
  r.word = word;
  r.state = 'back';
  r.backAt = now();
  r.backs = (r.backs || 0) + 1;
  save();
  logEvent('reject', { teamId: r.teamId, runId: runId, len: String(word).length });
  return r;
}

/* 改好了再交一次。回到老師那一排，判定還是原來那一個。 */
function actResend(teamId, runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.teamId !== teamId || r.state !== 'back') return false;
  r.state = 'submitted';
  r.submittedAt = r.submittedAt || now();
  save();
  logEvent('resend', { teamId: teamId, runId: runId, backs: r.backs || 1 });
  return true;
}

/* 老師勾一個「可以」。

   勾下去那一刻就是完成：任務之證當場發下去。

   本來中間還有一步——學生要再走到一頁去按「收起來」。那一步
   不產生任何東西，只是叫他確認一次自己已經做完、而且老師也已經
   勾過的事。approved 這個狀態因此也不再出現。 */
function actApprove(runId, word) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || (r.state !== 'submitted' && r.state !== 'back')) return null;
  var s = runShape(runId);
  r.word = word || '';
  r.approvedAt = now();
  r.state = 'done';
  r.doneAt = now();

  var tm = teamOf(r.teamId);
  if (tm) tm.claims = (tm.claims || 0) + 1;

  /* 任務之證。一趟一張，老師收下才有。

     名字在這一刻就定下來，不是每次顯示才去查任務名——老師之後改了
     任務名，他手上那一張不會跟著變成別的東西。 */
  var mz = msOf(r.msId);
  DB.Keeps.push({
    keepId: nid('K'), teamId: r.teamId, runId: runId,
    name: (mz && mz.title) || '', at: now(),
    /* 剛走完的那一層，不是接下來要走的那一層。 */
    zone: strataAt(Math.max(0, depthOf(r.teamId) - 1), r.teamId).key,
    px: coreOf(runId),
    est: s.est, elapsed: s.elapsed, moved: s.moved,
    rested: s.rested, blank: s.blank
  });
  save();
  logEvent('approve', { teamId: r.teamId, runId: runId, len: String(word || '').length });
  return r;
}

/* 你不在的時候老師勾了哪幾件。

   「收起來」那一步拿掉之後，老師那一句話就沒有一個落點了——而它是
   整條流程裡唯一「別人為你做了一件事」的時刻。改成回廊道時的一張
   通知：他不用做任何事，但那句話會在他面前。 */
function okSince(teamId, cut) {
  if (!cut) return [];
  return where('Runs', function (r) {
    return r.teamId === teamId && r.doneAt && r.doneAt > cut;
  }).sort(function (a, b) { return b.doneAt - a.doneAt; });
}

/* 封存一根岩心。

   本來這裡是「三張裡挑一張」，那三張全是他兩秒前才看過的數字——
   挑一張等於挑「等一下要再看到哪一個你已經知道的事」。
   沒有新資訊、沒有意外，而且挑錯沒代價、挑對沒好處。

   現在：那一趟的紀錄長成一根岩心（見 43-core.js），
   形狀完全由那一趟決定。那是同一份資料的一個他沒見過的形狀，
   所以真的有東西可看。名字選填——他不取，它一樣存得下來。

   存的是當下算出來的像素圖與數字，不是 runId 的一個指標：
   規則以後改了，他封存的那一根不會跟著變成別的樣子。 */

/* 改寫專案名稱。這是學生自己做的——招牌上寫什麼是他們的事，
   老師不替他們命名。改名字不會動到招牌的材質（那個吃深度）。 */
function actRename(teamId, name) {
  var t = teamOf(teamId);
  if (!t) return null;
  if (String(t.project || '') === String(name)) return null;
  var old = t.project;
  t.project = name;
  save();
  logEvent('rename', { teamId: teamId, name: name, from: old });
  return t;
}

/* 還沒寫過的那幾組先掛這一句。

   它不描述任何一組，所以系統沒有替誰下形容詞——它只是一句
   每一組都成立的話。要變成他們自己的，改掉就是。

   存在顯示那一層，不寫進資料：沒改過的組，Team.blurb 還是空的。
   先幫他們寫一筆再說那是他們寫的，那是假的。 */
var BLURB0 = '我要完成我的專案!';

/* 給自己的形容。這一組自己寫，別組看得到、改不動。

   跟專案名是兩件事：專案名是「我們在做什麼」，形容是「我們是什麼樣的組」。
   系統一個字都不寫——它不對任何一組下形容詞。 */
function actBlurb(teamId, text) {
  var t = teamOf(teamId);
  if (!t) return null;
  t.blurb = String(text || '').slice(0, 60);
  save();
  logEvent('blurb', { teamId: teamId, len: t.blurb.length });
  return t;
}

/* ---------- 這一趟的段 ----------

   本來這裡是那一組自己寫的一份清單。老師開始分段之後，那份清單就
   多餘了——分段是老師寫的，是這一次的題目本身，而且不用先做設定。
   這個系統要能在專案中途才開始用，多一道「先寫清單」等於多一道門。

   系統一樣沒有定義任何東西：那幾個字是老師打的。 */
function stepNames(runId) {
  var s = stepsOf(runId);
  return s ? s.all : [];
}

function stepName(runId, i) {
  var a = stepNames(runId);
  return a[i] == null ? '' : a[i];
}

/* 這一組留下過的那些話 */
function keepsOf(teamId) {
  return where('Keeps', function (g) { return g.teamId === teamId; });
}

/* ---------- 出口 ----------

   往下走不出去：六層是隨機給的，而且一直循環（見 13-strata.js）。
   唯一的出口是把手上這個專案做完。

   兩件事要說清楚，因為很容易做歪：

   一 · 「做完了」不是系統算出來的。系統不知道他們的專案有幾件事、
        也不知道走到哪——尤其這個系統本來就要能在專案進行到一半的時候
        才開始用。所以是他們自己宣告，老師確認。

   二 · 開門的條件只有「做完了」，不是「估得夠準」。一旦準度變成門檻，
        系統就在判定他規劃得夠不夠好，那是這個作品從頭到尾拒絕做的事。
        準度決定的是走出去的時候帶著什麼——同一道門，不同的故事。
        check.js 有一條在守這件事。 */
function actAskExit(teamId) {
  var t = teamOf(teamId);
  if (!t || t.leftAt) return null;
  t.exitAsk = now();
  save();
  logEvent('askexit', { teamId: teamId });
  return t;
}

function actCancelExit(teamId) {
  var t = teamOf(teamId);
  if (!t || t.leftAt) return null;
  t.exitAsk = 0;
  save();
  return t;
}

/* 老師確認。他寫的那一句會留在出口那一頁上。 */
function actLetGo(teamId, word) {
  var t = teamOf(teamId);
  /* 門開著才走得出去。本來只看他自己說過要走——
     那樣「老師允許」就不存在了。 */
  if (!t || !t.exitOk || t.leftAt) return null;
  t.leftAt = now();
  t.exitWord = word || '';
  t.exitAsk = 0;
  save();
  logEvent('left', { teamId: teamId });
  return t;
}

/* 走出去的時候帶著的東西。全部是他們自己的紀錄，沒有一項是評分。 */
function exitRecord(teamId) {
  var runs = runsFor(teamId).filter(function (x) { return x.run.stamp; });
  var acc = accuracyOf(teamId);
  var d = depthOf(teamId);
  var zones = {};
  for (var i = 0; i < d; i++) zones[strataAt(i, teamId).key] = 1;
  return {
    runs: runs, acc: acc, depth: d,
    cycles: cycleAt(d),
    zones: STRATA.filter(function (z) { return zones[z.key]; }),
    keeps: keepsOf(teamId),
    days: where('Pushes', function (p) { return p.teamId === teamId; }).length
  };
}

/* 老師開門。開了學生才點得動廊道上那扇出口。
   收回來也可以——他還沒走出去之前，那扇門一直是老師的。 */
function actOpenExit(teamId, on) {
  var t = teamOf(teamId);
  if (!t || t.leftAt) return null;
  t.exitOk = on ? now() : 0;
  save();
  logEvent(on ? 'exitopen' : 'exitshut', { teamId: teamId });
  return t;
}

/* 等著老師確認出口的那幾組。跟 radar 一樣只看自己帶的。 */
function exitQueue(classId, mentorId) {
  return teamsUnder(classId, mentorId).filter(function (t) {
    return t.exitAsk && !t.leftAt;
  });
}

/* 這一趟的三個角度。本來是「攤開三張挑一張」，那個動作拿掉了
   （見 actSeal）；這三句話留著，因為它們是承諾那一頁要給他看的
   ——他自己上一趟的事實，在他要決定下一趟花幾天的那一刻。 */
function keepOffers(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return [];
  var out = [];

  /* 一 · 這幾天你在做什麼 */
  var ids = stepIdxOfRun(runId).filter(function (i) { return i >= 0; });
  var n = {}, top = null;
  ids.forEach(function (i) { n[i] = (n[i] || 0) + 1; if (top === null || n[i] > n[top]) top = i; });
  var topName = top === null ? '' : stepName(runId, top);
  out.push({
    key: 'days',
    line: topName
      ? '這 ' + r.pushes + ' 天裡，有 ' + n[top] + ' 天你動的是「' + topName + '」。'
      : '這一趟你來了 ' + r.pushes + ' 天。'
  });

  /* 二 · 你估得怎麼樣。只有兩個數字跟一段算出來的範圍。 */
  var b = RULES.band(r.est);
  out.push({
    key: 'est',
    line: '你估 ' + r.est + ' 天，走了 ' + r.actual + ' 天。' +
          '你自己說的範圍是 ' + Math.max(1, r.est - b) + ' 到 ' + (r.est + b) + ' 天。'
  });

  /* 三 · 哪一件比你想的久。這是他們在營火自己說的。 */
  var ov = (r.overs || []).map(function (i) { return stepName(runId, i); })
    .filter(Boolean);
  var fl = r.flags || [];
  var hit = (r.overs || []).filter(function (id) { return fl.indexOf(id) >= 0; });
  out.push({
    key: 'over',
    line: ov.length
      ? '你說「' + ov.join('」「') + '」比你想的久。' +
        (hit.length ? '承諾的時候你就標了它。' : '承諾的時候你沒有標到它。')
      : '這一趟你沒有說哪一件比想的久。'
  });

  return out;
}

/* 日期寫成「9/2」。紀錄那一頁要的是「什麼時候走的」，
   不是完整的時間戳——年份對一個學期之內的紀錄沒有意義。 */
function dayText(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}


/* ===== 43-core.js ===== */
/* 岩心。

   一趟走完會長出一根岩心——像地質學家從地底抽出來的那種柱狀樣本。
   它不是我發的東西，是那一趟自己長出來的：形狀完全由那一趟的紀錄決定。

   為什麼是這個形式，而不是一個徽章或一件裝備：

   空的收集是一格一格長得一樣，靠重複填滿，價值只有「我有」。
   有意義的收集要滿足幾件事，而這個系統裡剛好有一個東西全部滿足——
   每一趟的日誌：

     一 · 它指向一個具體、不會再發生的事件。這根岩心就是那一週。
     二 · 它的樣子因人而異，而且那個不同是他自己造成的。
     三 · 不可能再拿到同一根——不是機率低，是那一週只發生過一次。
     四 · 它掛在該在的地方（自己的廊道、全班剖面圖），不是躺在道具欄。
     五 · 二十根排在一起，會變成一根說不出來的東西：一個學期的形狀。

   怎麼長：一天兩列，由上往下。

     來過        實心，中間一道亮
     說了沒動    空心，兩邊的壁還在
     沒有紀錄    斷的，只剩碎屑

   長度＝這一趟過了幾天。三天是一小截，十五天是一長條——
   所以架子上一眼看得出哪一趟是硬仗。

   刻意不編進去的東西：判定。
   那是全班剖面圖上別人也看得到的地方，把「估不準」編進形狀等於讓它
   變成一個公開的記號。判定只出現在他自己那幾頁上。 */

var CORE_W = 14;

/* 一根岩心的像素圖。純函式——同一趟每次算出來都一樣。 */
function coreOf(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  var log = dayLog(runId);
  if (!log.length) log = [null];
  var days = Math.min(log.length, 26);

  var px = [];
  px.push('..++++++++++..');          /* 上蓋 */
  px.push('.+##########+.');

  for (var i = 0; i < days; i++) {
    var d = log[i];
    if (d && d.kind === 'move') {
      px.push('.+#*######*#+.');
      px.push('.+##########+.');
    } else if (d && d.kind === 'rest') {
      px.push('.+#+......+#+.');
      px.push('.+#+......+#+.');
    } else {
      px.push('.+#..+..+..#+.');
      px.push('.+..+..+..+..');
    }
  }

  px.push('.+##########+.');
  px.push('..++++++++++..');
  return px;
}

/* 這一趟的岩心長什麼顏色：他當時在哪一層。 */
function corePal(run) {
  var z = null;
  STRATA.forEach(function (x) { if (x.key === run.zone) z = x; });
  return (z || strataAt(0, run.teamId)).pal;
}

/* 一根岩心的說明：長度、來過幾天、缺了幾天。
   全部是數字，一句判斷都沒有。 */
function coreFacts(runId) {
  var s = runShape(runId);
  if (!s) return null;
  return s;
}


/* ===== 44-dig.js ===== */
/* 全班共用的一片岩層，一格一格被打通。

   PaGamO 真正在運作的不是問答，是「共用地圖上你的顏色會擴散」。
   把問答拿掉、換成專案之後，剩下的那個機制是：

     · 一片全班共用、不會重置的地
     · 你做的事會在上面留下永久看得見的痕跡
     · 地圖本身就是介面，不是一張儀表板
     · 你會看到旁邊的人在長大
     · 兩塊地會靠在一起

   本來的班級地下城是五根平行的柱子——那是有美術的長條圖，不是領土。
   改成方格：每封存一趟，選一個方向打通一格。一個學期下來全班刻出一座
   真的洞窟，每個班長得都不一樣，而且兩組走著走著會打通。

   要小心的一條：面積 ＝ 走完幾趟，所以面積還是看得出多寡。
   跟深度一樣，我們已經接受它看得見，靠的是別的地方擋住比較——
   每一格一樣大、沒有計數、沒有排序、路線隨機所以顏色的分布沒有優劣。
   兩組同樣五格可以長得完全不一樣，因為往哪裡打通是他們自己選的。

   選方向不影響任何判定。它給的是「這是我們打通的」——那才是重點。 */

var DIG = {
  W: 15,      /* 幾欄 */
  H: 11,      /* 幾列。有界是重點：無限深的話每一組都有自己的車道，
                 永遠不會碰到誰，那張圖就會長回五根平行的柱子。
                 一個學期五組大概用掉七十幾格，15×11 會讓大家真的碰到。 */
  CELL: 40    /* 一格幾 px */
};

/* 這一組打通的每一格 */
function cellsOf(teamId) {
  var t = teamOf(teamId);
  return (t && t.cells) || [];
}

/* 誰佔了這一格。沒有人就回空字串。 */
function ownerAt(classId, x, y) {
  var who = '';
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    (t.cells || []).forEach(function (c) { if (c[0] === x && c[1] === y) who = t.teamId; });
  });
  return who;
}

/* 一組的起點：照名冊順序在最上面一排分開站，中間留得下彼此。 */
/* 一組從哪裡開始。

   本來是照名冊在第 0 列平均分開——那等於發給每一組一條車道，
   而車道就是長條圖。改成散在二維：用班級與名次算，彼此隔開，
   但不排隊、也不都在最上面。

   誰在上面誰在下面沒有意義：地層的順序是隨機給的，深度不是進度。 */
function startCell(classId, teamId) {
  var list = where('Teams', function (t) { return t.classId === classId; });
  var i = 0;
  list.forEach(function (t, n) { if (t.teamId === teamId) i = n; });
  return scatterStart(classId, i);
}

/* 第 i 組的起點。前面幾組先算出來，隔太近就換一個——
   全部用算的，所以同一個班每次打開都一樣。 */
function scatterStart(classId, i) {
  var used = [];
  for (var n = 0; n <= i; n++) {
    var pick = null;
    for (var k = 0; k < 60 && !pick; k++) {
      var h = hash('start|' + classId + '|' + n + '|' + k);
      var x = h % DIG.W, y = (h >>> 8) % DIG.H;
      var ok = true;
      used.forEach(function (u) {
        if (Math.abs(u[0] - x) + Math.abs(u[1] - y) < 4) ok = false;
      });
      if (ok) pick = [x, y];
    }
    used.push(pick || [n % DIG.W, (n * 3) % DIG.H]);
  }
  return used[i];
}

/* 下一格可以打通哪裡：已經打通的那幾格的上下左右，而且還沒有人佔。
   往上不能通到地表（y < 0）。 */
function openCells(classId, teamId) {
  var mine = cellsOf(teamId);
  if (!mine.length) return [startCell(classId, teamId)];
  var seen = {}, out = [];
  mine.forEach(function (c) {
    [[0, 1], [1, 0], [-1, 0], [0, -1]].forEach(function (d) {
      var x = c[0] + d[0], y = c[1] + d[1];
      if (x < 0 || x >= DIG.W || y < 0 || y >= DIG.H) return;
      var k = x + ',' + y;
      if (seen[k]) return;
      if (ownerAt(classId, x, y)) return;
      seen[k] = 1;
      out.push([x, y]);
    });
  });
  /* 照閱讀順序排，不偏任何方向。
     本來把「往下」排第一，而 digCell 又永遠取第一個——
     兩件事加起來，自動打通永遠是一條往下的直線。 */
  out.sort(function (a, b) { return (a[1] - b[1]) || (a[0] - b[0]); });

  /* 被別人包住了：在別的地方另外開一個口。
     這座地下城本來就寫著「你在哪一層醒來只是你在哪一層醒來」，
     所以換一個地方下去不需要另外解釋。 */
  if (!out.length) {
    for (var y2 = 0; y2 < DIG.H; y2++) {
      for (var x2 = 0; x2 < DIG.W; x2++) {
        if (!ownerAt(classId, x2, y2)) out.push([x2, y2]);
      }
    }
  }
  return out;
}

/* 打通一格。

   沒指定的時候用座標算一個，不要永遠取第一個——永遠取第一個的話
   長出來是一條直線，那就是長條圖。算出來的方向會轉，
   長出來才是一塊地。 */
function digCell(classId, teamId, cell) {
  var t = teamOf(teamId);
  if (!t) return null;
  var open = openCells(classId, teamId);
  var pick = null;
  if (cell) {
    open.forEach(function (c) { if (c[0] === cell[0] && c[1] === cell[1]) pick = c; });
  }
  if (!pick && open.length) {
    pick = open[hash('grow|' + teamId + '|' + (t.cells || []).length) % open.length];
  }
  if (!pick) return null;
  t.cells = (t.cells || []).concat([pick]);
  save();
  return pick;
}

/* 還有幾格可以打通 */
function claimsOf(teamId) {
  var t = teamOf(teamId);
  return (t && t.claims) || 0;
}

/* 點下去，那一格變成你的。
   有權利才點得動；點的那一格必須跟自己已經打通的那幾格相鄰。 */
function actClaimCell(classId, teamId, x, y) {
  var t = teamOf(teamId);
  if (!t || !(t.claims > 0)) return null;
  var ok = false;
  openCells(classId, teamId).forEach(function (c) {
    if (c[0] === x && c[1] === y) ok = true;
  });
  if (!ok) return null;
  t.cells = (t.cells || []).concat([[x, y]]);
  t.claims--;
  save();
  logEvent('claim', { teamId: teamId, cell: x + ',' + y });
  return [x, y];
}

/* 這一組的顏色。照名冊順序給，不照表現。 */
function teamHue(classId, teamId) {
  var list = where('Teams', function (t) { return t.classId === classId; });
  var i = 0;
  list.forEach(function (t, n) { if (t.teamId === teamId) i = n; });
  return ACT_HUE[i % ACT_HUE.length];
}

/* ---------- 兩組都構得到的那幾格 ----------

   最軟的一種競爭：那一格兩組都打得通，誰先點誰拿走。

   軟在哪裡——沒有名次、沒有分數、也不會失去任何已經有的東西。
   輸掉的代價只是「往別的方向長」，而方向本來就是自己選的。
   它給的是一個理由：早一點去看那張圖。

   這是 PaGamO 的競爭元素裡唯一能留的那一半：它搶的是還沒有人要的地，
   不是別人已經有的地。搶別人的地會讓人為了「不要失去」而上線，
   那是受控動機，而這個作品要證的正好是自發。 */
function contestedCells(classId) {
  var n = {};
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    if (!(t.cells || []).length) return;
    openCells(classId, t.teamId).forEach(function (c) {
      var k = c[0] + ',' + c[1];
      n[k] = (n[k] || 0) + 1;
    });
  });
  var out = {};
  Object.keys(n).forEach(function (k) { if (n[k] > 1) out[k] = n[k]; });
  return out;
}

/* 打通到旁邊碰在一起的兩組。這是這張圖上最好的一件事：
   「甲組跟丙組打通了」是一個會真的發生的教室事件，而且它不是比較。 */
function neighbours(classId) {
  var pairs = {};
  var list = where('Teams', function (t) { return t.classId === classId; });
  list.forEach(function (t) {
    (t.cells || []).forEach(function (c) {
      [[0, 1], [1, 0], [-1, 0], [0, -1]].forEach(function (d) {
        var o = ownerAt(classId, c[0] + d[0], c[1] + d[1]);
        if (!o || o === t.teamId) return;
        var k = [t.teamId, o].sort().join('|');
        pairs[k] = 1;
      });
    });
  });
  return Object.keys(pairs).map(function (k) {
    var ab = k.split('|');
    return [teamOf(ab[0]), teamOf(ab[1])];
  });
}

     M4 才是在示範「每位老師規劃自己的任務與步調」：薛老師自己派的，
     只有他帶的那兩組收得到，而且比別人晚了十天才開始。 */
  var M4 = { msId: 'M4', classId: cid, mentorId: 'U6', teams: [], at: ago(1), due: T0 + 12 * DAY,
    title: '找兩個人試用紙原型',
    steps: ['畫紙原型', '約人', '坐在旁邊看他點'],
    note: '不要跟他解釋。他卡住的地方就是答案。' };
  DB.Milestones.push(M1, M2, M3, M4);
  DB.Config.seq = 10;

  /* 幫忙塞推進紀錄。

     每一天動的是哪一段也一起塞，取自那一個任務的分段——不然試用資料的
     廊道每一格都長一樣，看不出「這一趟大半在訪談」跟「這一趟一直在修改」
     的差別，而那正是這個機制要讓人看見的東西。
     沒分段的任務塞 -1，那也是一種樣子。 */
  function pushes(teamId, runId, days, from) {
    var a = (msOf((find('Runs', function (x) { return x.runId === runId; }) || {}).msId) || {}).steps || [];
    for (var i = 0; i < days; i++) {
      var at = ago(from - i);
      DB.Pushes.push({ pushId: nid('P'), teamId: teamId, runId: runId,
        day: dayOf(at), at: at,
        step: a.length ? hash(runId + i) % a.length : -1 });
    }
  }

  /* ---------- G1 甲：估得準，已經跑完兩個，第三個進行中 ---------- */
  DB.Runs.push({ runId: 'R1', teamId: 'G1', msId: 'M1', state: 'done',
    est: 6, actual: 6, stamp: 'exact', flags: [0], overs: [], pushes: 6,
    committedAt: ago(24), submittedAt: ago(18), doneAt: ago(17),
    word: '你說六天就是六天。訪談那幾天沒有拖。' });
  pushes('G1', 'R1', 6, 23);

  DB.Runs.push({ runId: 'R2', teamId: 'G1', msId: 'M2', state: 'done',
    est: 4, actual: 3, stamp: 'early', flags: [], overs: [], pushes: 4,
    committedAt: ago(14), submittedAt: ago(11), doneAt: ago(10),
    word: '比上一次早兩天。' });
  pushes('G1', 'R2', 4, 13);

  DB.Runs.push({ runId: 'R3', teamId: 'G1', msId: 'M3', state: 'running',
    est: 5, flags: [2], overs: [], pushes: 2, committedAt: ago(3) });
  pushes('G1', 'R3', 2, 2);

  /* ---------- G2 乙：估太少，判定失準，還沒復盤 ---------- */
  DB.Runs.push({ runId: 'R4', teamId: 'G2', msId: 'M1', state: 'done',
    est: 3, actual: 9, stamp: 'late', flags: [], overs: [1, 2], pushes: 5,
    committedAt: ago(24), submittedAt: ago(15), doneAt: ago(14),
    word: '你們說做原型跟測試比想的久，這兩件我看到了。' });
  pushes('G2', 'R4', 5, 22);

  DB.Runs.push({ runId: 'R5', teamId: 'G2', msId: 'M2', state: 'judged',
    est: 4, actual: 11, stamp: 'late', flags: [], overs: [], pushes: 6,
    committedAt: ago(14), submittedAt: ago(3) });
  pushes('G2', 'R5', 6, 12);

  /* ---------- G3 丙：正在跑，但四天沒推進——睡著了 ---------- */
  DB.Runs.push({ runId: 'R6', teamId: 'G3', msId: 'M1', state: 'done',
    est: 7, actual: 7, stamp: 'exact', flags: [2], overs: [], pushes: 7,
    committedAt: ago(24), submittedAt: ago(17), doneAt: ago(16),
    word: '七天你們來了七天。' });
  pushes('G3', 'R6', 7, 23);

  DB.Runs.push({ runId: 'R7', teamId: 'G3', msId: 'M2', state: 'running',
    est: 8, flags: [0], overs: [], pushes: 3, committedAt: ago(14) });
  pushes('G3', 'R7', 3, 12);   /* 最後一次在 12 天前 → 睡著 */

  /* ---------- G4 丁：交出去了，在等老師 ---------- */
  DB.Runs.push({ runId: 'R8', teamId: 'G4', msId: 'M1', state: 'done',
    est: 5, actual: 5, stamp: 'exact', flags: [], overs: [], pushes: 5,
    committedAt: ago(24), submittedAt: ago(19), doneAt: ago(18),
    word: '你們承諾的時候就標了整理逐字稿。' });
  pushes('G4', 'R8', 5, 23);

  DB.Runs.push({ runId: 'R9', teamId: 'G4', msId: 'M2', state: 'submitted',
    est: 6, actual: 6, stamp: 'exact', flags: [1], overs: [], pushes: 6,
    committedAt: ago(14), submittedAt: ago(2) });
  pushes('G4', 'R9', 6, 13);

  /* ---------- G5 戊：什麼都還沒承諾 ---------- */
  /* 刻意留白：三個任務都派了，一個都沒拉滑桿。
     系統要看得出這一組跟「在動但卡住」的不一樣。 */

  /* 每一組已經打通的那幾格。往下打通，數量跟走完幾趟一樣。 */
  TEAMS.forEach(function (tm) {
    var n = where('Runs', function (r) {
      return r.teamId === tm.id && r.state === 'done';
    }).length;
    for (var i = 0; i < n + 1; i++) digCell(cid, tm.id, null);
  });

  /* 封存過的岩心。直接用 coreOf 算一次，跟真的走完一趟長出來的一模一樣。 */
  [['G1', 'R1', '訪談那一週', 17], ['G1', 'R2', '收斂', 10], ['G2', 'R4', '拖到最後', 14],
   ['G3', 'R6', '', 16], ['G4', 'R8', '逐字稿地獄', 18]].forEach(function (k, i) {
    var sh = runShape(k[1]);
    if (!sh) return;
    var r = find('Runs', function (x) { return x.runId === k[1]; });
    if (r) r.coreName = k[2];
    /* 那一趟當時在第幾層。本來寫的是「現在」在第幾層——
       同一個錯 mobOfRun 那邊剛修掉。 */
    var kd = r ? runDepth(r) : 0;
    DB.Keeps.push({ keepId: 'K0' + (i + 1), teamId: k[0], runId: k[1],
      name: k[2], at: ago(k[3]),
      zone: strataAt(kd, k[0]).key,
      px: coreOf(k[1]),
      est: sh.est, elapsed: sh.elapsed, moved: sh.moved,
      rested: sh.rested, blank: sh.blank });
  });
  DB.Config.seq = 100;
  save();
}


/* ===== 55-ui.js ===== */
/* 畫面的底：字串拼 HTML、一個路由、一次重畫。

   沒有覆寫層，也沒有模板補丁——每一個畫面就是一支函式，
   改一句話只要改一個地方。 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

/* 一開始沒有人登入。S.who 是 null 的時候只走得到門口那幾頁。 */
var S = { who: null, page: 'gate', p: {}, flash: null };

/* 沒按送出的東西不會進資料表，但重畫的時候要留著。 */
var DRAFT = {};
function draft(id, fallback) { return DRAFT[id] != null ? DRAFT[id] : (fallback || ''); }



function go(page, p) {
  if (typeof stopAnim === 'function') stopAnim();
  if (typeof stopOS === 'function') stopOS();
  S.page = page; S.p = p || {}; S.flash = null; DRAFT = {};
  /* 登入那一頁旁邊走過去的那一位，換頁就忘掉——下次進來重挑一個。
     不清的話它會跟著整個工作階段，「每次」就變成「開一次網頁一次」。 */
  S.gw = null;
  window.scrollTo(0, 0);
  render();
}
function me() { return S.who ? userOf(S.who) : null; }
function isTeacher() { var u = me(); return !!u && u.role === 'teacher'; }
function myTeam() { var u = me(); return u ? teamOf(u.teamId) : null; }

/* 首頁那一條「你不在的這幾天」看過就記下來，不然每次進來都再喊一次。
   記在畫完之後，所以這一次還看得到。

   蓋掉之前先接住上一次的時間，整個連線都留著（SEEN_CUT）。
   班級地下城拿它來標「你不在的時候別人留下的」——不接住的話，
   走過首頁再切過去，圖上就一個新的都沒有了。 */
var SEEN_CUT = null;
function seen() {
  /* 翻開圖鑑就把「上次有幾隻」記下來。記在畫完之後，所以這一次
     翻開還看得到那幾隻新的標記。 */
  if (S.page === 'codex' && S.who) markCodex(me());
  if (S.page !== 'home' || !S.who) return;
  if (SEEN_CUT === null) {
    var u = userOf(S.who);
    SEEN_CUT = (u && u.seenAt) || 0;
  }
  markSeen(S.who);
}

/* 哪一種身分走得到哪一頁。

   這不是裝飾。研究者看得到全班的紀錄、老師看得到別組的進度——
   路由如果不擋，改一下網址就變成別人。 */
var GATE_PAGES = { gate: 1, login: 1, reg: 1 };
var PAGE_ROLE = {
  home: 'student', commit: 'student', stamp: 'student',
  eco: 'student', pack: 'student',
  battle: 'student',
  exit: 'student', codex: 'student', sign: 'student', who: 'student',
  claim: 'student',
  radar: 'teacher', review: 'teacher', ms: 'teacher', classeco: 'teacher',
  rs: 'researcher', roster: 'researcher', events: 'researcher'
};
function allowed(u, page) {
  var need = PAGE_ROLE[page];
  return !need || need === u.role;
}

function head(eyebrow, title, lead) {
  return '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p class="lead">' + nl(lead) + '</p>' : '');
}

/* 一條「你在第幾步」。

   加這個是因為第一次打開會不知道要做什麼：畫面很乾淨，但乾淨到看不出
   自己站在哪。它不是教學，是位置——亮著的那一格就是現在輪到你的。

     steps  [[標題, 副標], …]
     at     現在在第幾格（0 起算；-1 代表都不在） */
function stepBar(steps, at) {
  var H = ['<div class="steps">'];
  steps.forEach(function (s, i) {
    H.push('<div class="step' + (i === at ? ' on' : (i < at ? ' past' : '')) + '">' +
      '<b>' + (i + 1) + '</b>' +
      '<div><i>' + esc(s[0]) + '</i>' + (s[1] ? '<em>' + esc(s[1]) + '</em>' : '') + '</div>' +
      '</div>');
  });
  H.push('</div>');
  return H.join('');
}

/* 像素圖標籤。所有的圖都走這一支——沒有第二種畫圖的方式。 */
function pxTag(px, pal, cls) {
  return '<img class="px ' + (cls || '') + '" src="' + pxSvg(px, pal, false) + '" alt="">';
}

/* 按鈕。act 是「動作:參數」的字串，全部收在 ACTS 裡。 */
function btn(label, act, kind) {
  return '<button class="btn ' + (kind || '') + '" data-act="run" data-p="' +
    esc(JSON.stringify({ a: act })) + '">' + esc(label) + '</button>';
}

/* ---------- 路由 ---------- */

var PAGES = {};

function render() {
  var u = me();

  /* 畫之前先把 HERO 指到這個人挑的那一套。二十幾個地方在讀 HERO，
     而它們讀的時機都在畫面要畫的時候——所以一個地方指，全部跟著換。
     （剖面圖是例外：那一頁一次畫五組，見 xsShaft。） */
  HERO = heroOf(u);

  /* 沒登入：只有門口那幾頁，而且沒有側欄也沒有頂條——
     還不知道你是誰的時候，畫面上不該有任何「你的」東西。 */
  if (!u) {
    if (!GATE_PAGES[S.page]) S.page = 'gate';
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES[S.page]() + '</div></div>';
    return;
  }

  /* 學生還沒對上名冊：先認領，別的哪裡都去不了。
     沒有組別的話，不知道要畫哪一條廊道——側欄跟頂條也一樣，
     它們每一格都在講「你的組」，這時候還沒有那個東西。 */
  if (u.role === 'student' && !u.teamId) {
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="wrap">' +
      (S.flash ? flashBar() : '') + PAGES.claim() + '</div></div>';
    S.page = 'claim';
    return;
  }
  if (S.page === 'claim' || GATE_PAGES[S.page]) S.page = homeFor(u);

  if (!PAGES[S.page] || !allowed(u, S.page)) S.page = homeFor(u);

  var body = PAGES[S.page]();
  /* 畫完才記，所以這一次還看得到那一條。 */
  seen();
  document.getElementById('app').innerHTML =
    sideBar() + '<div class="main">' + topBar() + demoBar() +
    '<div class="wrap">' + (S.flash ? flashBar() : '') + body + '</div></div>';

  /* 走廊比視窗長的時候，重畫預設回到最左邊——那樣按完推進會看到
     走廊變了卻看不到自己動。鏡頭跟著人走。 */
  if (typeof scrollScene === 'function') scrollScene();
  /* 那一場要花幾秒鐘發生。結果是算好的，這裡只負責演。 */
  if (typeof battleRun === 'function') battleRun();
  /* 那一閃收尾。用 JS 不用動畫——動畫的時鐘會被凍住
     （背景分頁、省電），那時候白色會一直蓋在圖上。 */
  setTimeout(function () {
    var f = document.querySelectorAll('.pxflash');
    for (var i = 0; i < f.length; i++) {
      if (f[i].parentNode) f[i].parentNode.removeChild(f[i]);
    }
  }, 520);
}

function flashBar() {
  return '<div class="flash">' + esc(S.flash) + '</div>';
}
/* say() 自己重畫。本來要記得先 say 再 render——順序寫反訊息就永遠不出現，
   而且那是一種只有測試才抓得到的錯。讓它自己負責。 */
function say(m) { S.flash = m; render(); }

/* 頂條右邊那一段。三種角色共用——登出在哪裡不該因為身分而不同，
   而且側欄在手機會變成底下那一列，放在那裡會被擠掉。 */
function topEnd() {
  return '<a class="plain" data-act="run" data-p=\'' +
    esc(JSON.stringify({ a: 'logout' })) + '\'>登出</a>';
}

function classOf(u) {
  return find('Classes', function (c) { return c.classId === u.classId; }) || DB.Classes[0] || { name: '' };
}

function topBar() {
  var u = me();
  if (u.role === 'researcher') {
    return '<div class="top">' +
      '<span class="badge r">研究者</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + DB.Users.length + ' 個帳號　·　' + DB.Classes.length + ' 個班　·　' +
        DB.Events.length + ' 筆紀錄</span>' + topEnd() +
      '</div>';
  }
  if (u.role === 'teacher') {
    var r = radar(u.classId, u.userId);
    return '<div class="top">' +
      '<span class="badge t">老師端</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      /* 我帶幾組。本來是整個課程的組數——三位老師共用一個課程
         之後，那個數字不是他負責的東西。 */
      '<span>' + esc(classOf(u).name) + '　·　我帶 ' +
        teamsUnder(u.classId, u.userId).length + ' 組</span>' +
      '<span>' + (r.length ? r.length + ' 件等你看' : '沒有等你的') + '</span>' + topEnd() +
      '</div>';
  }
  /* 學生的頂條做成 HUD：招牌、隊伍、所在的層、深度。
     一排文字讀起來是網站的狀態列；掛上招牌那張圖之後，
     它讀起來是角色身上的東西。 */
  var t = myTeam();
  var st = stallOf(t.teamId);
  var z = strataAt(depthOf(t.teamId), t.teamId);
  return '<div class="top hud z-' + z.key + '">' +
    pxTag(signOf(t.teamId).px, signOf(t.teamId).pal, 'hud-sign') +
    '<span class="who">' + esc(t.name) + '</span>' +
    /* 專案名點得進招牌。名字最大的地方就是改名字的入口——
   本來只有廊道最底下那個小圖示能進去。 */
'<a class="hud-pj" data-act="run" data-p=\'' +
  esc(JSON.stringify({ a: 'go:sign' })) + '\'>' +
  esc(t.project || '（還沒定）') + '</a>' +
    '<span class="sp"></span>' +
    '<span class="hud-z">' + esc(z.name) + '</span>' +
    '<span class="hud-d' + (st.level ? ' warnx' : '') + '">' +
      (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</span>' + topEnd() +
    '</div>';
}

/* 試用列。真的上線沒有這一條——它在這裡只是為了讓你兩邊都走得完。 */
function demoBar() {
  var opts = DB.Users.map(function (u) {
    var t = u.teamId ? teamOf(u.teamId) : null;
    return '<option value="' + u.userId + '"' + (u.userId === S.who ? ' selected' : '') + '>' +
      esc(t ? t.name : u.name) + '</option>';
  }).join('');
  return '<div class="demo">' +
    '<b>試用</b><span>切換身分</span>' +
    '<select data-act="who">' + opts + '</select>' +
    '<span class="sp" style="flex:1"></span>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"forward"}\'>把時間往前推一天</a>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"reset"}\'>整班重來</a>' +
    '</div>';
}

function sideBar() {
  var u = me();
  var nav, headBlock;
  if (u.role === 'researcher') {
    headBlock = '<div class="side-head"><div class="k">LAB</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">帳號與紀錄</div></div>';
    nav = [['rs', '帳號'], ['roster', '名冊'], ['events', '紀錄']];
  } else if (u.role === 'teacher') {
    var kl = classOf(u);
    headBlock = '<div class="side-head"><div class="k">TEACHER</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">' + esc(kl.name) + ' · 加入碼 ' +
      esc(kl.joinCode) + '</div></div>';
    /* 老師只有三件事，側欄就只有三格——多一格就是多一件他要煩惱的事。

       出口不另外開一格：它跟審核在那一頁上切換，數字併進來。
       那一格因此不叫「審核」——審核是頁面裡兩個切換的其中一個，
       同一個詞當兩種範圍會讓「審核（5）」點進去變成「審核（4）」。
       叫它頁面真正在講的事：有幾件在等你。 */
    var wait = radar(u.classId).length + exitQueue(u.classId).length;
    nav = [
      ['radar', '等你的' + (wait ? '（' + wait + '）' : '')],
      ['ms', '發派任務'],
      ['classeco', '各組進度']
    ];
  } else {
    var t = myTeam();
    headBlock = '<div class="side-head">' +
      '<div class="n">' + esc(t.name) + '</div>' +
      '<div class="s">' + esc(t.project || '（還沒定）') + '</div></div>';
    /* 三個。四件事是流程，不是分頁——說幾天、去做事、看判定都在廊道，
       第四件是看全班在哪。任務清單不是步驟，但它是「老師派過的每一件事
       各自走到哪」，那是隨時會想確認的東西，所以它在側欄。
       圖鑑是想逛才逛的，在廊道底下那一排門。 */
    nav = [
      ['home', '廊道'], ['pack', '任務清單'], ['eco', '班級地下城']
    ];
  }
  /* 一個小方點換成像素圖。同一份結構，讀起來從「網站的幾個分頁」
     變成「背包裡的幾樣東西」。 */
  var items = nav.map(function (n) {
    var on = S.page === n[0];
    var ic = ICONS[n[0]];
    return '<a class="' + (on ? 'on' : '') + '" data-go="' + n[0] + '">' +
      (ic ? pxTag(ic, on ? ICON_ON : ICON_PAL, 'nic') : '<span class="dot"></span>') +
      esc(n[1]) + '</a>';
  }).join('');
  return '<div class="side">' + headBlock + '<div class="nav">' + items + '</div></div>';
}

/* ---------- 事件 ---------- */

document.addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go'), JSON.parse(g.getAttribute('data-p') || '{}')); return; }
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  if (act !== 'run') return;
  var p = JSON.parse(a.getAttribute('data-p') || '{}');
  runAct(p.a);
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest('[data-act="who"]');
  if (!a) return;
  S.who = a.value;
  DB.Session = S.who;
  save();
  S.page = homeFor(userOf(S.who));
  /* 上一個人的訊息不要跟著換身分過去——那句話不是講給這個人聽的 */
  S.flash = null;
  DRAFT = {};
  render();
});

/* 動作字串：「名稱」或「名稱:參數」 */
function runAct(str) {
  var i = String(str || '').indexOf(':');
  var name = i < 0 ? str : str.slice(0, i);
  var arg = i < 0 ? '' : str.slice(i + 1);
  var f = ACTS[name];
  if (f) f(arg);
}

/* 2026-09-02：push／rest／back／submit 四個刪掉了。它們是「每天按一下
   推進」那一版的殘留——程式還在，但畫面上沒有任何地方按得到。
   留著只會讓下一個讀的人以為那個機制還在。 */
var ACTS = {
  forward: function () { CLOCK += DAY; say('往前一天了。'); },
  reset: function () { seed(); S.who = 'U1'; go('home'); },

  go: function (arg) {
    var i = arg.indexOf(':');
    if (i < 0) return go(arg);
    go(arg.slice(0, i), { id: arg.slice(i + 1) });
  },

  /* 滑桿：只改草稿，不進資料表 */
  /* 拖滑桿。

     本來這裡是 render()，而 render() 會把整個 #app 換掉——包含
     你正在拖的那一根滑桿。節點被重建，瀏覽器的拖曳捕捉跟著沒了，
     把手就不再跟著手指走。那不是回饋不夠，是控制項在手裡被拆掉。

     改成只改跟著它動的那幾塊，滑桿本身完全不碰。 */
  /* 老師排到什麼時候。選一個單位就等於「有排」，再選一次同一個
     或按「不排」就收回來。 */
  dueu: function (k) {
    var u = dueUnit(k);
    if (!u || DRAFT.dueU === k) { DRAFT.dueU = ''; DRAFT.dueN = 0; }
    else { DRAFT.dueU = k; DRAFT.dueN = u.def; }
    render();
  },
  duen: function (d) {
    var u = dueUnit(DRAFT.dueU);
    if (!u) return;
    DRAFT.dueN = clamp(1, u.max, (Number(DRAFT.dueN) || 0) + Number(d));
    render();
  },

  /* 拆一件出來。打一句按 Enter 就多一項，預設一天——
     加一件一定會動到上面那個數字，不然會像沒反應。 */
  planadd: function (v) {
    var x = String(v || '').trim();
    if (!x) return;
    var p = (DRAFT.plan || []).slice();
    if (p.length >= RULES.STEPS_MAX) return say('最多 ' + RULES.STEPS_MAX + ' 件。');
    p.push({ n: x.slice(0, 24), d: 1 });
    DRAFT.plan = p;
    render();
    var el = document.getElementById('pl-add');
    if (el) { el.value = ''; el.focus(); }
  },
  plandel: function (i) {
    var p = (DRAFT.plan || []).slice();
    p.splice(Number(i), 1);
    DRAFT.plan = p;
    render();
  },
  /* 某一件加減一天。到頭停在那裡。 */
  pland: function (v) {
    var q = String(v).split(',');
    var p = (DRAFT.plan || []).slice();
    var i = Number(q[0]);
    if (!p[i]) return;
    p[i] = { n: p[i].n, d: clamp(1, RULES.EST_MAX, p[i].d + Number(q[1])) };
    DRAFT.plan = p;
    render();
  },

  /* 說幾天：一按一天。到頭就停在那裡，不會繞回去——
     繞回去會讓「按到底」變成一件要小心的事。 */
  estep: function (d) {
    var n = clamp(RULES.EST_MIN, RULES.EST_MAX,
      Number(draft('est', RULES.EST_DEFAULT)) + Number(d));
    DRAFT.est = n;
    estLive(n);
  },

  /* 承諾的時候標「這一件我覺得會比想的久」 */
  flag: function (k) {
    DRAFT.flags = DRAFT.flags || [];
    var i = DRAFT.flags.indexOf(k);
    if (i < 0) DRAFT.flags.push(k); else DRAFT.flags.splice(i, 1);
    render();
  },

  /* 營火：哪一件真的比你想的久 */
  over: function (k) {
    DRAFT.overs = DRAFT.overs || [];
    var i = DRAFT.overs.indexOf(k);
    if (i < 0) DRAFT.overs.push(k); else DRAFT.overs.splice(i, 1);
    render();
  },

  /* 點洞口那幾樣還沒點著的東西。它不做事，只說那是什麼——
     沒觸發過的東西如果連問都不能問，它等於不存在。 */
  peek: function (what) {
    if (what === 'camp') {
      var t = myTeam();
      var n = nextThing(t.teamId);
      if (n.kind === 'camp') return go('camp', { id: n.row.run.runId });
      return say('營火。');
    }
  },

  /* 交出去那一頁：標／取消標「那一天我動過」。 */
  mark: function (arg) {
    var i = arg.indexOf('|');
    actMarkDay(myTeam().teamId, arg.slice(0, i), Number(arg.slice(i + 1)));
    render();
  },

  /* 今天沒有動。
     跟推進一樣一下點擊，但不會讓畫面變亮，也不會讓停滯計時歸零——

  /* 勾掉／取消勾掉老師分的一段 */
  tick: function (arg) {
    var i = arg.indexOf('|');
    actTickStep(myTeam().teamId, arg.slice(0, i), Number(arg.slice(i + 1)));
    render();
  },

  /* ---- 出口 ---- */
  noop: function () {},

  askexit: function () {
    actAskExit(myTeam().teamId);
    go('exit');
    say('說出去了。');
  },

  cancelexit: function () {
    actCancelExit(myTeam().teamId);
    go('home');
    say('收回來了。');
  },

  /* 學生說「我們做完了」。它不開門——門是老師開的。 */
  askexit: function () {
    var t = myTeam();
    if (!actAskExit(t.teamId)) return;
    render(); say('說出去了。');
  },
  unexit: function () {
    var t = myTeam();
    actCancelExit(t.teamId);
    render(); say('收回來了。');
  },

  /* 老師開門／關門。開了學生才點得動廊道上那扇出口。 */
  openexit: function (v) {
    var p = String(v).split(',');
    actOpenExit(p[0], p[1] === '1');
    render();
    say(p[1] === '1' ? '門開了。' : '門關回來了。');
  },

  /* 走出去。老師開了門，這一下是他們自己按的。 */
  leave: function () {
    var t = myTeam();
    if (!actLetGo(t.teamId, '')) return say('門還沒開。');
    go('exit', {});
    say('上來了。');
  },

  commit: function (msId) {
    var t = myTeam();
    actCommit(t.teamId, msId, Number(DRAFT.est || RULES.EST_DEFAULT),
      DRAFT.flags || [], DRAFT.plan || []);
    go('home');
    /* 出發那一下：白光掃過廊道，角色從坐著變成走。
       旗子放在 S 上（go 會清掉 DRAFT），畫完就收——
       它是一次事件，不是一個狀態。 */
    S.launch = 1;
    render();
    setTimeout(function () {
      S.launch = 0;
      var e = document.querySelector('.scn');
      if (e) e.classList.remove('launch');
      ['.scn-launch', '.scn-go'].forEach(function (sel) {
        var x = document.querySelector(sel);
        if (x && x.parentNode) x.parentNode.removeChild(x);
      });
    }, 1320);
    say('出發。');
  },

  /* 「都差不多」也是一個答案，所以要記下來——
     它跟「沒有回答」不一樣。 */
  oversame: function () { DRAFT.overs = []; DRAFT.said = 1; render(); },

  skipcamp: function (runId) { actSkipCamp(runId); go('home'); },

  reflect: function (runId) {
    var t = myTeam();
    actReflect(t.teamId, runId, DRAFT.overs || []);
    go('home');
    say('說出來了。');
  },

  /* 老師勾可以了 → 去挑裝備 */

  /* 點一組：攤開他們被派過哪些任務。班級地下城上點名牌或點那一疊，
     都是這一支——那兩個地方問的是同一個問題。 */
  team: function (id) {
    DRAFT.dt = id; DRAFT.tab = 'team'; render();
    var c = document.querySelector('.segs');
    if (c) c.scrollIntoView({ block: 'start' });
  },

  /* 點一個角色：看那一個人。

     跟 team 分開是因為它們回答的是兩件事——那一疊是「他們做了什麼」，
     那個人是「他是誰」。而這個作品裡「他是誰」不含任何數字。 */
  person: function (id) { go('person', { id: id }); },

  /* 點一組的名牌：那一組是誰。 */
  crew: function (id) { go('crew', { id: id }); },

  /* 從一組的那一頁去看他們被派過哪些任務。

     不能直接叫 team：那一支只設 DRAFT 再重畫，而攤開任務的那張卡
     長在班級地下城上，不在組別頁——按了什麼都不會發生。

     所以要先換頁。而 go() 會清掉 DRAFT，順序不能顛倒。
     去哪一頁看有沒有自己的組，不看角色：研究者沒有組，
     用 isTeacher() 判斷會把他丟到一頁 myTeam() 是 null 的地方。 */
  tasks: function (id) {
    go(myTeam() ? 'eco' : 'classeco');
    DRAFT.dt = id; DRAFT.tab = 'team';
    render();
    var c = document.querySelector('.dtcard') || document.querySelector('.segs');
    if (c) c.scrollIntoView({ block: 'start' });
  },

  /* 那一組給自己的形容。只有自己改得動（擋在 PAGES.crew）。 */
  blurb: function () {
    var t = myTeam();
    var el = document.getElementById('cr-b');
    if (!t || !el) return;
    actBlurb(t.teamId, el.value);
    say('寫好了。');
    render();
  },

  /* 剖面圖底下那三顆。 */
  tab: function (k) { DRAFT.tab = k; render(); },

  /* 老師那一頁上的審核／出口。跟 tab 分開，不然兩邊會互相蓋掉。 */
  tq: function (k) { DRAFT.tq = k; render(); },


  /* 這一組給哪一位老師帶。再點一次同一位就是收回來。 */
  mentor: function (v) {
    var p = String(v).split(',');
    actMentor(p[0], p[1] || '');
    render();
  },



  /* 回報：某一件實際花幾天。到頭就停在那裡。 */
  spent: function (v) {
    var q = String(v).split(',');
    var i = Number(q[0]);
    var a = (DRAFT.spent || []).slice();
    if (a[i] == null) return;
    a[i] = clamp(0, RULES.EST_MAX, a[i] + Number(q[1]));
    DRAFT.spent = a;
    render();
  },

  /* 順／普通／不順。再點一次同一個就收回來——「我不想說」也是一個答案。 */
  feel: function (k) {
    DRAFT.feel = (DRAFT.feel === k) ? '' : k;
    render();
  },

  /* 挑一個角色。它不進任何判定、不影響任何數字——就是「這是我」。 */
  hero: function (k) {
    var u = me();
    if (!u || !HEROES[k]) return;
    u.hero = k;
    save();
    logEvent('hero', { teamId: u.teamId, hero: k });
    go('home', {});
  },

  /* 學生改自己的招牌 */
  rename: function () {
    var t = myTeam();
    var v = (document.getElementById('pj-name') || {}).value || '';
    if (!v.trim()) return say('招牌上總要寫點什麼。');
    if (!actRename(t.teamId, v.trim())) return say('跟原本一樣，沒有改到。');
    go('home');
    say('改好了。');
  },

  /* ---- 老師 ---- */
  publish: function () {
    var title = (document.getElementById('ms-title') || {}).value || '';
    var note = (document.getElementById('ms-note') || {}).value || '';
    if (!title.trim()) return say('先寫這一個任務要交什麼。');
    /* 本來是把一整串字在這裡 split，所以「幾段」在按下派出去之前
       不存在。現在它從第一下 Enter 就是一個陣列。
       還沒按 Enter 的那一句也一起收——不然打完最後一段直接按
       派出去，那一段會不見。 */
    var steps = (DRAFT.steps || []).slice();
    var last = ((document.getElementById('ms-step') || {}).value || '').trim();
    if (last) steps.push(last.slice(0, 24));
    actPublish(me().classId, { title: title.trim(), note: note.trim(),
      steps: steps, teams: DRAFT.to || [], mentorId: me().userId,
      due: dueFrom(DRAFT.dueN, DRAFT.dueU), dueU: DRAFT.dueU || '' });
    /* 草稿清掉，不然下一個會帶著上一個的字。
       （那幾個框現在跟 DRAFT 綁在一起，才不會按一下班級就消失。） */
    DRAFT.msTitle = ''; DRAFT.msNote = ''; DRAFT.steps = []; DRAFT.to = [];
    DRAFT.dueU = ''; DRAFT.dueN = 0;
    go('ms');
    say('派出去了。');
  },

  /* 退回去改。一定要寫一句話——不寫理由的退回等於
     「再做一次，但我不告訴你為什麼」。 */
  reject: function (runId) {
    var w = (document.getElementById('gr-word') || {}).value || '';
    if (!w.trim()) return say('退回去改要寫一句話。');
    if (!actReject(runId, w.trim())) return say('這一件退不回去。');
    go('radar');
    say('退回去了。');
  },

  /* 改好了再交一次。判定還是原來那一個——重做不會讓他當初
     說的話變成別的話。 */
  resend: function (runId) {
    var t = myTeam();
    if (!actResend(t.teamId, runId)) return say('這一趟交不出去。');
    go('home');
    say('再交出去了。');
  },

  /* 改一次承諾。

     那一趟留成紀錄（說幾天、走了幾天），沒有判定也沒有印章，
     所以不會進準度那根尺——改承諾不是失準，是兩件事。
     然後直接把他帶到「說幾天」，因為那就是他想做的事。 */
  redo: function (runId) {
    var t = myTeam();
    var r = find('Runs', function (x) { return x.runId === runId; });
    if (!r || !actRethink(t.teamId, runId)) return say('這一趟改不了。');
    go('commit', { id: r.msId });
    say('走過的那幾天留著。');
  },

  /* 點帶子上的一格：打開那一趟的完整紀錄。
     go() 會清掉 DRAFT，所以要在它之後才設 lg。 */
  rec: function (runId) {
    go('pack', {});
    DRAFT.lg = runId;
    render();
    var e = document.querySelector('.rec.open');
    if (e) e.scrollIntoView({ block: 'center' });
  },

  /* 分段：打一句按 Enter 就多一項。

     重畫之後焦點會沒掉，所以自己補回去——不然切完第一段就得再點
     一次那個框才切得了第二段，那比原本的多行框還糟。 */
  stepadd: function (v) {
    var x = String(v || '').trim();
    if (!x) return;
    DRAFT.steps = (DRAFT.steps || []).concat([x.slice(0, 24)]);
    if (DRAFT.steps.length > RULES.STEPS_MAX) DRAFT.steps.length = RULES.STEPS_MAX;
    render();
    var el = document.getElementById('ms-step');
    if (el) { el.value = ''; el.focus(); }
  },

  stepdel: function (i) {
    var a = (DRAFT.steps || []).slice();
    a.splice(Number(i), 1);
    DRAFT.steps = a;
    render();
    var el = document.getElementById('ms-step');
    if (el) el.focus();
  },

  to: function (teamId) {
    DRAFT.to = DRAFT.to || [];
    var i = DRAFT.to.indexOf(teamId);
    if (i < 0) DRAFT.to.push(teamId); else DRAFT.to.splice(i, 1);
    render();
  },

  /* 老師只勾一個「可以」。挑哪一件是學生的事。 */
  approve: function (runId) {
    var word = (document.getElementById('gr-word') || {}).value || '';
    if (!actApprove(runId, word.trim())) return say('這一件已經看過了。');
    go('radar');
    say('勾了。');
  }
};


/* ===== 56-viz.js ===== */
/* 把數字畫出來。

   這個系統只有一件事要傳達：你說幾天、實際幾天、差多少。
   本來那件事是用一句話講的——

     「你承諾 5 天，實際花了 7 天。誤差 1 天以內算準（預估的 20％）。」

   那句話要讀完才知道發生什麼事，而且它把「範圍」這個概念用文字描述，
   讀的人得自己在腦袋裡把尺畫出來。那就畫出來給他看。

   兩條尺上下對齊：上面那條是你自己說的，範圍框出來；
   下面那條是實際走的。超出去的那幾格自己會是另一個顏色。
   看一眼就結束了，不用讀。 */

/* 一格一天的尺。

     est     承諾幾天
     actual  實際幾天（還沒交就傳 pushes，那條會邊走邊長）
     live    true 代表還在走，下面那條不畫判定色 */
function estBar(est, actual, live) {
  var e = Math.max(1, Number(est) || 1);
  var a = Math.max(0, Number(actual) || 0);
  var b = RULES.band(e);
  var lo = Math.max(0, e - b), hi = e + b;
  /* 尺畫到哪：準的範圍跟實際走的，誰遠畫到誰，再留一點餘地。 */
  var n = Math.max(hi, a) + Math.max(1, Math.round(e * 0.15));

  function at(d) { return Math.max(0, Math.min(100, d / n * 100)) + '%'; }

  var over = !live && a > hi;
  var H = ['<div class="ebar' + (over ? ' over' : '') + '">'];

  H.push('<div class="eb-track">');
  /* 準的範圍。淺色的一塊，實際那一段停在裡面就是準。 */
  H.push('<div class="eb-band" style="left:' + at(lo) +
    ';width:' + (Math.min(100, hi / n * 100) - Math.max(0, lo / n * 100)) + '%"></div>');
  /* 實際走了幾天。 */
  H.push('<div class="eb-go" style="width:' + at(a) + '"></div>');
  /* 你說的那一天。 */
  H.push('<div class="eb-say" style="left:' + at(e) + '"></div>');
  H.push('</div>');

  /* 兩個數字。它們是同一條尺上的兩個位置，所以並排寫。 */
  H.push('<div class="eb-n">');
  H.push('<span class="eb-say-n">說 <b>' + e + '</b></span>');
  H.push('<span class="eb-go-n">' + (live ? '走到' : '實際') + ' <b>' + a + '</b></span>');
  H.push('<span class="eb-u">天</span>');
  H.push('</div>');

  H.push('</div>');
  return H.join('');
}

/* ---------- 每一件一個顏色 ----------

   老師分的那幾段，名字長度不一定，塞不進廊道上一格 44px 的位置。
   所以廊道上畫的是顏色，顏色對到第幾段，在清單上讀一次就記得了。

   顏色照段的順序給，不照內容——系統不知道「打樣」該是什麼顏色，
   也不該假裝知道。 */
var ACT_HUE = [
  '#E9B341', '#5FA8C7', '#7FA866', '#C77BA8', '#D9843F',
  '#8C7BC7', '#5AA88F', '#C7645F', '#9AA6B0', '#B8A05A'
];
function stepHue(i) {
  return i < 0 ? '#4A4038' : ACT_HUE[i % ACT_HUE.length];
}

/* 段的清單就是圖例。同一個元件當三種用：圖例、推進鍵、標記鍵。 */
function stepLegend(runId, sel, act) {
  var a = stepNames(runId);
  if (!a.length) return '';
  var H = ['<div class="alist">'];
  a.forEach(function (x, i) {
    var on = sel && sel.indexOf(i) >= 0;
    var tag = act ? 'button' : 'span';
    H.push('<' + tag + ' class="ac' + (on ? ' on' : '') + '"' +
      (act ? ' data-act="run" data-p=\'' +

/* 這一趟每一天動的是哪一件，排成一條。

/* 走過的每一趟，準度分布。三個數字，不加一句解讀。 */

/* 兩條尺的圖例。三個色塊就說完了，不用一句話解釋。 */

/* 這一趟的形狀。全部是數字，一句判斷都沒有——
   要怎麼讀是他自己的事，不是系統的。 */
function shapeLine(runId) {
