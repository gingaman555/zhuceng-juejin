<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>專案地下城</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'C11';src:url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@v1.500/fonts/web/Cubic_11.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* 樣子。

   字級只用 11 的倍數——Cubic 11 是 11px 的點陣字，放到 13px、17px 會糊掉。
   所以整份只有 11 / 22 / 33 / 44 / 55 / 66 六級，沒有中間值。 */

:root{
  --bg:#0B0A09; --panel:#14110D; --panel2:#1A1611; --sunk:#0E0C0A;
  --line:#2E2822; --line2:#443B31;
  --ink:#E8E0D2; --dim:#9A8F7D; --mute:#63594C;
  --gold:#E9B341; --gold2:#F5CB74; --gold-d:#7A5A18;
  --ok:#7CC98F; --over:#D9603F; --warn:#E9B341;
  --L:#C9A227; --Ld:#9A7E22; --Ll:#F2E6C8; --Lbg:#171208; --Lline:#3A2E12;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:'C11','Noto Sans TC',monospace;
  font-size:22px; line-height:1.7;
  -webkit-font-smoothing:none;
  image-rendering:pixelated;
}
button,input,textarea,select{font-family:inherit;font-size:22px;color:inherit}
img{display:block}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 版面 ---------- */

#app{display:flex;min-height:100vh}

.side{
  width:242px;flex:0 0 242px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto
}
.side-head{padding:22px;border-bottom:1px solid var(--line)}
.side-head .k{font-size:11px;color:var(--mute);letter-spacing:.2em}
.side-head .n{font-size:22px;margin-top:5px}
.side-head .s{font-size:11px;color:var(--dim);margin-top:5px}

.nav{padding:11px 0;flex:1}
.nav a{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  color:var(--dim);cursor:pointer;border-left:3px solid transparent;font-size:22px
}
.nav a:hover{color:var(--ink);background:var(--panel2)}
.nav a.on{color:var(--gold);background:var(--panel2);border-left-color:var(--gold)}
.nav a .dot{width:11px;height:11px;background:currentColor;opacity:.55;flex:0 0 11px}
.nav a.on .dot{opacity:1}
.nav .gap{height:11px}

.main{flex:1;min-width:0}
.wrap{max-width:1078px;padding:33px 44px 88px}

/* ---------- 頂條 ---------- */

.top{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;font-size:11px;color:var(--dim);flex-wrap:wrap
}
.top .who{font-size:22px;color:var(--ink)}
.top .sp{flex:1}
.badge{
  display:inline-block;padding:2px 8px;font-size:11px;
  background:var(--gold);color:#1A1408
}
.badge.t{background:#7C6BC7;color:#F0ECFF}

/* 試用列：只有原型有。真的上線沒有這一條。 */
.demo{
  display:flex;align-items:center;gap:11px;padding:11px 22px;flex-wrap:wrap;
  background:#100D0A;border-bottom:1px solid var(--line);font-size:11px;color:var(--mute)
}
.demo b{color:var(--dim);font-weight:400}

/* ---------- 元件 ---------- */

.eyebrow{font-size:11px;color:var(--mute);letter-spacing:.2em;margin-bottom:5px}
h1{font-size:44px;line-height:1.35;margin:0 0 11px;font-weight:400}
h2{font-size:33px;line-height:1.45;margin:0 0 11px;font-weight:400}
h3{font-size:22px;line-height:1.6;margin:22px 0 11px;font-weight:400}
p{margin:0 0 11px}
.lead{font-size:22px;color:var(--dim);max-width:63ch}
.dim{font-size:11px;color:var(--mute);line-height:1.9;max-width:70ch}
.ok{font-size:11px;color:var(--ok);line-height:1.9}
.warnx{color:var(--over)}
.quote{
  font-size:22px;color:var(--ink);line-height:1.8;
  border-left:3px solid var(--gold-d);padding:11px 0 11px 14px;margin:11px 0
}

.card{
  background:var(--panel);border:1px solid var(--line);
  padding:22px;margin:0 0 22px
}
.row{display:flex;gap:11px;flex-wrap:wrap;margin:22px 0}
.px{display:block;image-rendering:pixelated}

/* 按鈕：左上右下各切 11px。這是這一套視覺的簽名。 */
.btn{
  font-size:22px;padding:14px 22px;cursor:pointer;border:none;
  background:var(--gold);color:#1A1408;letter-spacing:.06em;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)
}
.btn:hover{background:var(--gold2)}
.btn.big{font-size:33px;padding:22px 44px}
.btn.ghost{
  background:none;color:var(--dim);border:1px solid var(--line);clip-path:none;padding:14px 22px
}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}

input,textarea,select{
  width:100%;background:var(--sunk);border:1px solid var(--line);
  color:var(--ink);padding:11px;margin:5px 0 11px;font-size:22px
}
select{width:auto;padding:2px 8px;font-size:11px}
textarea{resize:vertical;line-height:1.7}
::placeholder{color:var(--mute)}

.flash{
  background:var(--panel2);border-left:3px solid var(--gold);
  padding:11px 14px;margin:0 0 22px;font-size:11px;color:var(--dim);line-height:1.9
}
a.plain{color:var(--dim);cursor:pointer;text-decoration:none}
a.plain:hover{color:var(--gold)}

/* ---------- 坑道 ---------- */

.tunnel{
  background:var(--Lbg);border:1px solid var(--Lline);
  padding:22px;margin:0 0 22px;position:relative;overflow:hidden
}
.tunnel::after{
  content:'';position:absolute;inset:0;pointer-events:none;transition:background .4s
}
.tunnel.dim::after{background:rgba(0,0,0,.30)}
.tunnel.dark::after{background:rgba(0,0,0,.55)}

.tunnel-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.px.sign{width:66px;height:66px;flex:0 0 66px}
.sign-txt{flex:1;min-width:160px}
.sign-txt b{display:block;font-size:33px;font-weight:400;color:var(--ink)}
.sign-txt span{display:block;font-size:11px;color:var(--mute);margin-top:5px;line-height:1.8}
.depth{text-align:right;font-size:11px;color:var(--mute)}
.depth b{display:block;font-size:33px;color:var(--gold);font-weight:400;margin:3px 0}

/* 迷霧走廊：角色 → 格子 → 魔物 */
.corr{
  display:flex;align-items:center;gap:11px;margin:22px 0 11px;
  position:relative;z-index:2;flex-wrap:nowrap;overflow-x:auto
}
.corr.empty{
  display:block;font-size:11px;color:var(--mute);line-height:1.9;
  border:1px dashed var(--Lline);padding:22px;text-align:center
}
.hero{position:relative;flex:0 0 66px}
.px.ch{width:66px;height:66px}
.px.ch.big{width:132px;height:132px}
.px.vine{position:absolute;inset:0;width:66px;height:66px;opacity:.85}

.cells{display:flex;gap:3px;flex:1;min-width:0}
.cell{
  flex:1;min-width:11px;height:22px;
  background:rgba(0,0,0,.45);border:1px solid var(--Lline)
}
.cell.on{background:var(--L);border-color:var(--Ll)}
.cell.here{box-shadow:0 0 0 2px var(--gold) inset}

.mob{flex:0 0 66px;text-align:center}
.mob span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.corr-note{font-size:11px;color:var(--mute);position:relative;z-index:2}

/* 唯一的動作 */
.act-card{
  background:var(--panel2);border:1px solid var(--line2);
  border-left:3px solid var(--gold);padding:22px;margin:0 0 22px
}
.act-card h2{margin:0 0 11px}

/* ---------- 滑桿 ---------- */

.slider-wrap{display:flex;align-items:center;gap:22px;margin:11px 0}
.slider{
  -webkit-appearance:none;appearance:none;flex:1;height:22px;
  background:var(--sunk);border:1px solid var(--line);margin:0;padding:0
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;background:var(--gold);
  border:none;cursor:pointer
}
.slider::-moz-range-thumb{width:22px;height:22px;background:var(--gold);border:none;cursor:pointer}
.slider-read{flex:0 0 auto;text-align:center}
.slider-read b{display:block;font-size:66px;line-height:1;color:var(--gold);font-weight:400}
.slider-read span{font-size:11px;color:var(--mute)}

.big-num{font-size:66px;line-height:1;color:var(--gold);font-weight:400}
.big-num span{font-size:22px;color:var(--mute)}

/* ---------- 標籤 ---------- */

.tags{display:flex;gap:11px;flex-wrap:wrap;margin:11px 0}
.tags .k{font-size:11px;color:var(--mute);align-self:center;margin-right:5px}
.tag{
  font-size:22px;padding:9px 13px;cursor:pointer;white-space:nowrap;
  background:none;color:var(--dim);border:1px solid var(--line)
}
.tag:hover{color:var(--ink);border-color:var(--line2)}
.tag.on{background:rgba(233,179,65,.14);color:var(--gold);border-color:var(--gold)}
.tag.static{cursor:default;font-size:11px;padding:5px 9px}
.tag.static.hit{color:var(--gold);border-color:var(--gold-d)}
.tags.small .tag{font-size:11px;padding:5px 9px}
.tags.big{gap:11px}
.tags.big .tag{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  min-width:154px;padding:14px;white-space:normal;text-align:left
}
.tags.big .tag b{font-size:33px;line-height:1}
.tags.big .tag i{font-style:normal;font-size:22px;color:var(--ink)}
.tags.big .tag em{font-style:normal;font-size:11px;color:var(--mute);line-height:1.7}
.tag.static em{display:block;font-style:normal;color:var(--mute);margin-top:3px}

/* ---------- 判定印章 ---------- */

.stamp-card{
  background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--gold);padding:44px 22px;text-align:center;margin:0 0 22px
}
.stamp-card.late{border-top-color:var(--over)}
.stamp-card.early{border-top-color:var(--ok)}
.stamp-mark{font-size:66px;line-height:1;margin-bottom:11px}
.stamp-card h1{font-size:44px;margin:0 0 11px}
.stamp-card .lead{margin:0 auto 22px;max-width:44ch}
.stamp-num{display:flex;justify-content:center;gap:11px;align-items:baseline;margin:22px 0}
.stamp-num b{font-size:44px;color:var(--gold);font-weight:400}
.stamp-num span{font-size:11px;color:var(--mute);margin-right:22px}

/* ---------- 營火 ---------- */

.camp{display:flex;align-items:center;gap:22px;margin:0 0 22px;flex-wrap:wrap}
.px.fire{width:110px;height:110px;flex:0 0 110px}

/* ---------- 大躍進 ---------- */

.dash{text-align:center;padding:44px 22px;background:var(--panel);border:1px solid var(--line);margin:0 0 22px}
.dash .px{margin:0 auto 22px}
.dash h1{font-size:44px}

/* ---------- 準度 ---------- */

.acc{display:flex;gap:11px;margin:11px 0}
.acc-c{
  flex:1;text-align:center;padding:14px;background:var(--sunk);border:1px solid var(--line)
}
.acc-c b{display:block;font-size:33px;line-height:1}
.acc-c i{display:block;font-style:normal;font-size:44px;color:var(--gold);line-height:1.2}
.acc-c span{font-size:11px;color:var(--mute)}

.gear-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.gear{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 14px;background:var(--sunk);border:1px solid var(--line);font-size:33px
}
.gear i{font-style:normal;font-size:11px;color:var(--dim)}

.gear-pick{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.gcard{
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  width:242px;padding:14px;cursor:pointer;text-align:left;
  background:var(--sunk);color:var(--dim);border:1px solid var(--line)
}
.gcard:hover{border-color:var(--line2)}
.gcard.on{background:rgba(233,179,65,.12);border-color:var(--gold)}
.gcard b{font-size:33px;line-height:1}
.gcard i{font-style:normal;font-size:22px;color:var(--ink)}
.gcard em{font-style:normal;font-size:11px;color:var(--mute);line-height:1.7}

/* ---------- 生態圖 ---------- */

.eco{background:var(--panel);border:1px solid var(--line);padding:22px;margin:0 0 22px}
.eco-surface{
  font-size:11px;color:var(--mute);letter-spacing:.2em;
  border-bottom:1px solid var(--line2);padding-bottom:5px;margin-bottom:14px
}
.eco-row{display:flex;align-items:center;gap:11px;padding:9px 0;flex-wrap:wrap}
.eco-row.me .eco-name{color:var(--gold)}
.eco-name{flex:0 0 154px;font-size:22px;color:var(--dim)}
.eco-tube{flex:1;min-width:154px;display:flex;gap:2px;position:relative;height:22px}
.eco-seg{flex:1;background:rgba(0,0,0,.45);border:1px solid var(--line)}
.eco-seg.dug{background:var(--Ld);border-color:var(--L)}
.eco-hero{
  position:absolute;top:-3px;width:11px;height:28px;background:var(--gold);
  transition:left .4s
}
.eco-hero.vine{background:#4A6B3A}
.eco-hero.sleep{background:var(--mute);opacity:.6}
.eco-state{flex:0 0 88px;font-size:11px;color:var(--mute);text-align:right}

/* ---------- 老師端 ---------- */

.radar-row{border-left:3px solid var(--ok)}
.radar-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:11px}
.radar-head b{font-size:22px;font-weight:400}
.radar-head .sp{flex:1}
.green{width:11px;height:11px;background:var(--ok);flex:0 0 11px}
.radar-ms{font-size:22px;color:var(--ink);margin-bottom:5px}
.log-num{font-size:11px;color:var(--mute);margin:5px 0}
.log-num b{font-size:22px;color:var(--gold)}
.st{font-size:11px;padding:3px 8px;border:1px solid var(--line2);color:var(--dim)}
.st.exact{color:var(--gold);border-color:var(--gold-d)}
.st.early{color:var(--ok);border-color:var(--ok)}
.st.late{color:var(--over);border-color:var(--over)}

.mini{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.mini-row{display:flex;gap:11px;align-items:center;font-size:11px;color:var(--mute)}
.mini-row b{flex:0 0 132px;font-size:22px;color:var(--dim);font-weight:400}
.mini-row .ok{color:var(--ok)}

.log-row .log-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.log-row .log-head b{font-size:22px;font-weight:400}
.rn-row{display:flex;gap:11px;align-items:baseline;padding:5px 0;flex-wrap:wrap}
.rn-row b{flex:0 0 132px;font-size:22px;font-weight:400;color:var(--dim)}

@media (max-width:860px){
  .side{display:none}
  .wrap{padding:22px}
}

</style>
</head>
<body>
<div id="app"></div>

     用比例而不是固定值，因為估 3 天差 2 天跟估 20 天差 2 天不是同一回事。 */
  BAND_RATIO: 0.2,
  BAND_MIN: 1,

  /* ---------- 推進 ---------- */
  PUSH_PER_DAY: 1,     /* 一天一次。多按沒有用，這不是點擊遊戲 */
  STALL_DAYS: 2,       /* 幾天沒推進就開始長藤蔓 */
  SLEEP_DAYS: 4,       /* 幾天沒推進角色會睡著 */

  /* ---------- 招牌 ---------- */
  /* 專案名稱看板的三階。老師每改寫一次名稱就往上升一階——
     視覺材質的升級就是對邏輯收斂最直接的肯定，不用多說一句話。 */
  SIGN_TIERS: ['wood', 'iron', 'glow'],

  /* 這個系統沒有的東西寫在 check.js 的 BANNED 裡，不寫在這裡——
     寫在這裡等於把那些詞放進畫面，檢查器會抓（而且抓得對）。 */
  _: null
};

function clamp(lo, hi, n) { return Math.max(lo, Math.min(hi, n)); }

/* 容許誤差：估幾天，準的範圍就有多寬 */
RULES.band = function (est) {
  return Math.max(RULES.BAND_MIN, Math.round((Number(est) || 0) * RULES.BAND_RATIO));
};

/* ---------- 三種印章 ----------
   這是整個系統唯一的「評價」，而且評的是預估能力，不是作品好壞。
   遲到不是失敗，是一次判斷失準——那本身就是可以拿來練的資料。 */
RULES.STAMPS = {
  early: { key: 'early', mark: '🚀', name: '超乎預期',
           why: '比你自己承諾的還早。你把它想得比實際難。' },
  exact: { key: 'exact', mark: '🎯', name: '精準預測',
           why: '你說幾天就是幾天。這是專案管理裡最難練的一件事。' },
  late:  { key: 'late',  mark: '❌', name: '判斷失準',
           why: '比你承諾的久。承認並說出卡在哪，比準時更有價值。' }
};

/* 判定：拿實際花的天數比對當初承諾的 */
RULES.judge = function (est, actual) {
  var e = Number(est) || 0, a = Number(actual) || 0, b = RULES.band(e);
  if (a < e - b) return RULES.STAMPS.early;
  if (a > e + b) return RULES.STAMPS.late;
  return RULES.STAMPS.exact;
};

/* 判定的說明句。從數字組出來，所以改 BAND_RATIO 這句話會跟著變。 */
RULES.judgeWhy = function (est, actual) {
  var b = RULES.band(est);
  return '你承諾 ' + est + ' 天，實際花了 ' + actual + ' 天。' +
         '誤差 ' + b + ' 天以內算準（預估的 ' + Math.round(RULES.BAND_RATIO * 100) + '％）。';
};

/* ---------- 卡關的原因 ----------
   全部做成圖示快選，不要輸入框。要打字的反思沒有人會寫，
   而且打字會把防衛心叫起來——點一個標籤不會。 */
RULES.SNAGS = [
  { key: 'scope',  icon: '🌀', label: '範圍變大了',   hint: '做著做著發現要做的比想的多' },
  { key: 'wait',   icon: '⏳', label: '在等別人',     hint: '等回覆、等資料、等隊友' },
  { key: 'skill',  icon: '🔧', label: '不會做',       hint: '需要先學一個沒學過的東西' },
  { key: 'start',  icon: '🪨', label: '開不了頭',     hint: '知道要做什麼，但一直沒動' },
  { key: 'split',  icon: '✂️', label: '拆得太粗',     hint: '一件事其實是三件事' },
  { key: 'life',   icon: '🌧️', label: '別的事插進來', hint: '其他課、打工、身體' },
  { key: 'redo',   icon: '🔁', label: '做了又重做',   hint: '方向改過' },
  { key: 'guess',  icon: '🎲', label: '純粹估錯',     hint: '沒有特別的原因，就是想得太快' }
];

RULES.snagOf = function (key) {
  for (var i = 0; i < RULES.SNAGS.length; i++) {
    if (RULES.SNAGS[i].key === key) return RULES.SNAGS[i];
  }
  return null;
};

/* ---------- 風險標記 ----------
   派發任務時學生可以先標「我覺得這裡會卡」。事後對照——
   標對了就是預見能力，那比準時更值錢。 */
RULES.RISKS = RULES.SNAGS.slice(0, 6);

/* ---------- 裝備 ----------
   老師發的，不是抽的、不是買的。它是一句「我看到你做了什麼」的具體化，
   所以每一件都綁一個理由，而且發的時候要選那個理由。 */
RULES.GEARS = [
  { key: 'sword',   icon: '⚔️', name: '銳劍',   why: '這一項推進得乾脆——沒有拖，也沒有等到最後一天。' },
  { key: 'compass', icon: '🧭', name: '指南針', why: '預估得準。你對自己的判斷開始可靠了。' },
  { key: 'lamp',    icon: '🏮', name: '提燈',   why: '你把卡在哪講清楚了。看得見的困難才處理得掉。' },
  { key: 'shield',  icon: '🛡️', name: '盾',     why: '你事先標了風險，而且標對了。' },
  { key: 'boots',   icon: '👢', name: '快靴',   why: '這一次比上一次快。你把上次的教訓用上了。' },
  { key: 'map',     icon: '🗺️', name: '殘圖',   why: '你把一件事拆成看得懂的幾件。' }
];

RULES.gearOf = function (key) {
  for (var i = 0; i < RULES.GEARS.length; i++) {
    if (RULES.GEARS[i].key === key) return RULES.GEARS[i];
  }
  return null;
};

/* ---------- 停滯 ----------
   系統不發「已逾期」通知。狀態本身就是回饋：幾天沒推進，畫面自己會暗下來。
   這是勸導式設計的核心——不指責，只是讓停下來這件事看得見。 */
RULES.stallOf = function (lastPushAt, nowTs) {
  if (!lastPushAt) return { level: 0, days: 0 };
  var days = Math.floor((nowTs - lastPushAt) / 86400000);
  if (days >= RULES.SLEEP_DAYS) return { level: 2, days: days };   /* 睡著 */
  if (days >= RULES.STALL_DAYS) return { level: 1, days: days };   /* 長藤蔓 */
  return { level: 0, days: days };
};

/* 停滯的說法。不講「你逾期了」，講畫面上發生了什麼。 */
RULES.stallSay = function (level, days) {
  if (level === 2) return '牠睡著了。' + days + ' 天沒有推進——按一下就會醒。';
  if (level === 1) return '藤蔓爬上來了。' + days + ' 天沒有推進——推一次就會碎掉。';
  return '';
};

/* ---------- 走到哪了 ----------
   迷霧走廊的長度＝承諾的天數。推進一次前進一格。
   走完不等於完成——完成是上傳作業那一刻。 */
RULES.progress = function (pushes, est) {
  var e = Math.max(1, Number(est) || 1);
  return clamp(0, 1, (Number(pushes) || 0) / e);
};


/* ===== 30-art.js ===== */
/* 畫圖。只有兩件事：一個雜湊、一個把像素字串變成 SVG 的函式。

   全都是純函式：同樣的輸入永遠得到同一張圖、同一隻魔物。
   沒有任何一個地方會在 render 的時候擲骰子。 */

/* 字串雜湊。同一個字串永遠得到同一個數字——
   「哪一組遇到哪一隻」就是靠它算的，所以不能換演算法。 */
function hash(s) {
  var h = 2166136261;
  s = String(s);
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}

var ART_CACHE = {};

/* 像素字元：. 透明 · # 身體 · + 陰影 · * 反光 · ~ 拖影
   一張圖是一個字串陣列，每一格畫成一個 <rect>。
   換配色就是換同一張圖的意思——魔物越深越冷，招牌越好越亮。 */
function pxSvg(px, pal, dim) {
  if (!px || !px.length) return '';
  var key = px.join('') + '|' + pal['#'] + '|' + (dim ? 1 : 0);
  if (ART_CACHE[key]) return ART_CACHE[key];

  var W = px[0].length;
  var out = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
    W + ' ' + px.length + '" shape-rendering="crispEdges">'];

  px.forEach(function (row, y) {
    for (var x = 0; x < row.length; x++) {
      var ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      var fill =
        ch === '*' ? pal['*'] :
        (ch === '+' || ch === 'o') ? pal.o :
        ch === '~' ? (pal['~'] || pal.o) :
        ch === 'z' || ch === 'Z' ? (pal['*'] || pal['#']) :
        pal['#'];
      out.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + fill + '"' +
        (dim ? ' opacity=".26"' : '') + '/>');
    }
  });

  out.push('</svg>');
  var url = 'data:image/svg+xml;utf8,' + encodeURIComponent(out.join(''));
  ART_CACHE[key] = url;
  return url;
}


/* ===== 40-db.js ===== */
/* 資料與動作。

   所有會改到資料的事都叫 act*，而且只有這裡改得到 DB。畫面只讀不寫。
   存在 localStorage，因為這一版是給人打開就能走一遍的原型。

   跟上一版最大的差別：沒有分數、沒有層、沒有收集。
   一個里程碑的一生是：派發 → 承諾天數 → 每日推進 → 上傳 → 判定 →
   （失準就復盤）→ 老師發裝備 → 大躍進。 */

var DB = null;
var STORE = 'dungeon.v1';

/* 試用時可以快轉。所有時間都走 now()，不直接用 Date.now()。 */
var CLOCK = 0;
function now() { return Date.now() + CLOCK; }
var DAY = 86400000;

/* 只比日期，不比時分——「今天推過了沒」問的是日子，不是 24 小時。 */
function dayOf(ts) {
  var d = new Date(ts);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function daysBetween(a, b) {
  var A = new Date(a), B = new Date(b);
  A = new Date(A.getFullYear(), A.getMonth(), A.getDate());
  B = new Date(B.getFullYear(), B.getMonth(), B.getDate());
  return Math.round((B - A) / DAY);
}

function blank() {
  return {
    Config: { seq: 1 },
    Users: [], Classes: [], Roster: [], Teams: [],
    /* 里程碑：老師派的。同一個里程碑可以只發給某幾組。 */
    Milestones: [],
    /* 一組在一個里程碑上的狀態。這張表是整個系統的心臟。 */
    Runs: [],
    /* 每一次推進打卡。一天一筆。 */
    Pushes: [],
    /* 老師發的裝備 */
    Gears: []
  };
}

function nid(p) { return p + (DB.Config.seq++); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) {} }
function load() {
  try { DB = JSON.parse(localStorage.getItem(STORE)); } catch (e) { DB = null; }
  return !!(DB && DB.Users && DB.Users.length);
}
function find(tbl, fn) { for (var i = 0; i < DB[tbl].length; i++) if (fn(DB[tbl][i])) return DB[tbl][i]; return null; }
function where(tbl, fn) { return DB[tbl].filter(fn); }

function teamOf(id) { return find('Teams', function (t) { return t.teamId === id; }); }
function userOf(id) { return find('Users', function (u) { return u.userId === id; }); }
function msOf(id) { return find('Milestones', function (m) { return m.msId === id; }); }
function runOf(teamId, msId) {
  return find('Runs', function (r) { return r.teamId === teamId && r.msId === msId; });
}

/* ---------- 一組看得到哪些里程碑 ---------- */
function msFor(teamId) {
  var t = teamOf(teamId);
  if (!t) return [];
  return where('Milestones', function (m) {
    return m.classId === t.classId && (!m.teams.length || m.teams.indexOf(teamId) >= 0);
  });
}

/* 這一組的所有 run，照派發時間排 */
function runsFor(teamId) {
  return msFor(teamId).map(function (m) {
    var r = runOf(teamId, m.msId);
    if (!r) {
      /* 派了但還沒承諾——先給一個空的，畫面才知道要問滑桿 */
      r = { runId: null, teamId: teamId, msId: m.msId, state: 'fresh',
            est: 0, risks: [], pushes: 0, snags: [], gear: null };
    }
    return { ms: m, run: r };
  }).sort(function (a, b) { return a.ms.at - b.ms.at; });
}

/* ---------- 這一組現在該做什麼 ----------
   一次只回答一件事。首頁只給一個動作，其餘都是資訊。 */
function nextThing(teamId) {
  var rows = runsFor(teamId);
  /* 1. 判定失準、還沒復盤 */
  var camp = rows.filter(function (x) {
    return x.run.state === 'judged' && x.run.stamp === 'late' && !x.run.snags.length;
  })[0];
  if (camp) return { kind: 'camp', row: camp };
  /* 2. 老師發了裝備、還沒領 */
  var gear = rows.filter(function (x) { return x.run.state === 'geared'; })[0];
  if (gear) return { kind: 'gear', row: gear };
  /* 3. 睡著了或長藤蔓——叫醒牠比接新任務重要。
     這是整個設計的招牌互動：推一下，藤蔓碎掉，角色重新揮劍。
     如果讓「接新任務」排在前面，那一下就永遠不會發生。 */
  var st = stallOf(teamId);
  if (st.level > 0) {
    var stuck = rows.filter(function (x) { return x.run.state === 'running'; })[0];
    if (stuck) return { kind: 'wake', row: stuck, stall: st };
  }

  /* 4. 派了但還沒承諾 */
  var fresh = rows.filter(function (x) { return x.run.state === 'fresh'; })[0];
  if (fresh) return { kind: 'commit', row: fresh };
  /* 5. 進行中、今天還沒推進 */
  var run = rows.filter(function (x) {
    return x.run.state === 'running' && !pushedToday(teamId, x.run.runId);
  })[0];
  if (run) return { kind: 'push', row: run };
  /* 6. 走完了、還沒上傳 */
  var done = rows.filter(function (x) {
    return x.run.state === 'running' && RULES.progress(x.run.pushes, x.run.est) >= 1;
  })[0];
  if (done) return { kind: 'submit', row: done };
  /* 7. 都推過了，在等 */
  var wait = rows.filter(function (x) { return x.run.state === 'running'; })[0];
  if (wait) return { kind: 'waiting', row: wait };
  var sent = rows.filter(function (x) { return x.run.state === 'submitted'; })[0];
  if (sent) return { kind: 'review', row: sent };
  return { kind: 'idle', row: null };
}

function pushedToday(teamId, runId) {
  if (!runId) return false;
  var d = dayOf(now());
  return !!find('Pushes', function (p) {
    return p.teamId === teamId && p.runId === runId && p.day === d;
  });
}

/* 最後一次推進是什麼時候——停滯判斷用 */
function lastPush(teamId) {
  var ps = where('Pushes', function (p) { return p.teamId === teamId; });
  if (!ps.length) return 0;
  return ps[ps.length - 1].at;
}

/* 這一組的停滯狀態 */
function stallOf(teamId) {
  var t = teamOf(teamId);
  var has = runsFor(teamId).some(function (x) { return x.run.state === 'running'; });
  if (!has) return { level: 0, days: 0 };
  return RULES.stallOf(lastPush(teamId) || (t && t.joinedAt) || now(), now());
}

/* 深度＝完成過幾個里程碑。沒有終點。 */
function depthOf(teamId) {
  return where('Runs', function (r) {
    return r.teamId === teamId && r.state === 'done';
  }).length;
}

/* 招牌的階：老師改寫過幾次專案名稱 */
function signOf(teamId) {
  var t = teamOf(teamId);
  var n = Math.min(RULES.SIGN_TIERS.length - 1, (t && t.signTier) || 0);
  return SIGNS[RULES.SIGN_TIERS[n]];
}

/* 這一組的預估準度紀錄——復盤與老師審閱都要看 */
function accuracyOf(teamId) {
  var done = where('Runs', function (r) {
    return r.teamId === teamId && r.stamp;
  });
  var n = { early: 0, exact: 0, late: 0 };
  done.forEach(function (r) { n[r.stamp] = (n[r.stamp] || 0) + 1; });
  return { total: done.length, early: n.early, exact: n.exact, late: n.late, rows: done };
}

/* ---------- 全班生態 ----------
   沒有名次。只有「誰在哪一條坑道、挖到多深、現在是什麼狀態」。 */
function ecology(classId) {
  return where('Teams', function (t) { return t.classId === classId; }).map(function (t) {
    var st = stallOf(t.teamId);
    var cur = runsFor(t.teamId).filter(function (x) { return x.run.state === 'running'; })[0];
    return {
      teamId: t.teamId, name: t.name,
      depth: depthOf(t.teamId),
      stall: st.level,
      /* 正在打的那一隻，跟走到哪 */
      onMs: cur ? cur.ms.title : '',
      at: cur ? RULES.progress(cur.run.pushes, cur.run.est) : 0,
      sign: signOf(t.teamId).key
    };
  });
}

/* ================= 學生的動作 ================= */

/* 承諾：拉滑桿決定幾天，順便標風險 */
function actCommit(teamId, msId, est, risks) {
  var r = runOf(teamId, msId);
  if (r) return r;
  r = {
    runId: nid('R'), teamId: teamId, msId: msId,
    state: 'running',
    est: clamp(RULES.EST_MIN, RULES.EST_MAX, Number(est) || RULES.EST_DEFAULT),
    risks: risks || [],
    committedAt: now(),
    pushes: 0, snags: [], gear: null, stamp: null
  };
  DB.Runs.push(r);
  save();
  return r;
}

/* 推進：一天一次。回傳有沒有真的推到。 */
function actPush(teamId, runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return false;
  if (pushedToday(teamId, runId)) return false;
  DB.Pushes.push({ pushId: nid('P'), teamId: teamId, runId: runId, day: dayOf(now()), at: now() });
  r.pushes++;
  save();
  return true;
}

/* 上傳：走到終點之後交出去。判定就在這一刻。 */
function actSubmit(teamId, runId, link) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'running') return null;
  r.actual = Math.max(1, daysBetween(r.committedAt, now()));
  r.stamp = RULES.judge(r.est, r.actual).key;
  r.link = link || '';
  r.submittedAt = now();
  r.state = 'judged';
  save();
  return r;
}

/* 復盤：點圖示標籤說明卡在哪。只有失準的時候會走到。 */
function actReflect(teamId, runId, snags) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.snags = snags || [];
  r.state = 'submitted';        /* 復盤完才排進老師的雷達 */
  save();
  return r;
}

/* 準時的直接排進老師的雷達，不用復盤 */
function actSkipCamp(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.state = 'submitted';
  save();
  return r;
}

/* 領裝備 → 大躍進 */
function actTakeGear(runId) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r || r.state !== 'geared') return null;
  r.state = 'done';
  r.doneAt = now();
  save();
  return r;
}

/* ================= 老師的動作 ================= */

/* 派一個里程碑。teams 空陣列＝全班。 */
function actPublish(classId, o) {
  var m = {
    msId: nid('M'), classId: classId,
    title: o.title, note: o.note || '',
    teams: o.teams || [],
    at: now()
  };
  DB.Milestones.push(m);
  save();
  return m;
}

/* 老師的雷達：誰交了、等多久了 */
function radar(classId) {
  var out = [];
  where('Teams', function (t) { return t.classId === classId; }).forEach(function (t) {
    runsFor(t.teamId).forEach(function (x) {
      if (x.run.state !== 'submitted') return;
      out.push({
        team: t, run: x.run, ms: x.ms,
        waited: daysBetween(x.run.submittedAt, now())
      });
    });
  });
  return out.sort(function (a, b) { return b.waited - a.waited; });
}

/* 發裝備。gearKey 是資訊性回饋——選哪一件等於選一句話。 */
function actGear(runId, gearKey, word) {
  var r = find('Runs', function (x) { return x.runId === runId; });
  if (!r) return null;
  r.gear = gearKey;
  r.word = word || '';
  r.state = 'geared';
  r.gearedAt = now();
  DB.Gears.push({ gearId: nid('G'), teamId: r.teamId, runId: runId, key: gearKey, at: now() });
  save();
  return r;
}

/* 改寫專案名稱 → 招牌升一階。收斂本身就是成果。 */
function actRename(teamId, name) {
  var t = teamOf(teamId);
  if (!t) return null;
  if (t.project !== name) {
    t.project = name;
    t.signTier = Math.min(RULES.SIGN_TIERS.length - 1, (t.signTier || 0) + 1);
  }
  save();
  return t;
}

/* 這一組拿過的裝備 */
function gearsOf(teamId) {
  return where('Gears', function (g) { return g.teamId === teamId; });
}

/* ===== 55-ui.js ===== */
/* 畫面的底：字串拼 HTML、一個路由、一次重畫。

   沒有覆寫層，也沒有模板補丁——每一個畫面就是一支函式，
   改一句話只要改一個地方。 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }

var S = { who: 'U1', page: 'home', p: {}, flash: null };

/* 沒按送出的東西不會進資料表，但重畫的時候要留著。 */
var DRAFT = {};
function draft(id, fallback) { return DRAFT[id] != null ? DRAFT[id] : (fallback || ''); }

function go(page, p) {
  S.page = page; S.p = p || {}; S.flash = null; DRAFT = {};
  window.scrollTo(0, 0);
  render();
}
function me() { return userOf(S.who); }
function isTeacher() { return me().role === 'teacher'; }
function myTeam() { return teamOf(me().teamId); }

function head(eyebrow, title, lead) {
  return '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    (lead ? '<p class="lead">' + nl(lead) + '</p>' : '');
}

/* 像素圖標籤。所有的圖都走這一支——沒有第二種畫圖的方式。 */
function pxTag(px, pal, cls) {
  return '<img class="px ' + (cls || '') + '" src="' + pxSvg(px, pal, false) + '" alt="">';
}

/* 按鈕。act 是「動作:參數」的字串，全部收在 ACTS 裡。 */
function btn(label, act, kind) {
  return '<button class="btn ' + (kind || '') + '" data-act="run" data-p="' +
    esc(JSON.stringify({ a: act })) + '">' + esc(label) + '</button>';
}

/* ---------- 路由 ---------- */

var PAGES = {};

function render() {
  var f = PAGES[S.page];
  if (!f) { S.page = isTeacher() ? 'radar' : 'home'; f = PAGES[S.page]; }
  var body = f();
  document.getElementById('app').innerHTML =
    sideBar() + '<div class="main">' + topBar() + demoBar() +
    '<div class="wrap">' + (S.flash ? flashBar() : '') + body + '</div></div>';
}

function flashBar() {
  return '<div class="flash">' + esc(S.flash) + '</div>';
}
/* say() 自己重畫。本來要記得先 say 再 render——順序寫反訊息就永遠不出現，
   而且那是一種只有測試才抓得到的錯。讓它自己負責。 */
function say(m) { S.flash = m; render(); }

function topBar() {
  var u = me();
  if (u.role === 'teacher') {
    var r = radar(u.classId);
    return '<div class="top">' +
      '<span class="badge t">老師端</span>' +
      '<span class="who">' + esc(u.name) + '</span>' +
      '<span class="sp"></span>' +
      '<span>' + esc(DB.Classes[0].name) + '　·　' +
        where('Teams', function (t) { return t.classId === u.classId; }).length + ' 組</span>' +
      '<span>' + (r.length ? r.length + ' 件等你看' : '沒有等你的') + '</span>' +
      '</div>';
  }
  var t = myTeam();
  var st = stallOf(t.teamId);
  return '<div class="top">' +
    '<span class="badge">學生端</span>' +
    '<span class="who">' + esc(t.name) + '</span>' +
    '<span class="sp"></span>' +
    '<span>' + esc(t.project || '（還沒定）') + '</span>' +
    '<span class="' + (st.level ? 'warnx' : '') + '">深度 ' +
      (depthOf(t.teamId) * WORLD.depthPerMilestone) + ' m</span>' +
    '</div>';
}

/* 試用列。真的上線沒有這一條——它在這裡只是為了讓你兩邊都走得完。 */
function demoBar() {
  var opts = DB.Users.map(function (u) {
    return '<option value="' + u.userId + '"' + (u.userId === S.who ? ' selected' : '') + '>' +
      (u.role === 'teacher' ? '老師' : teamOf(u.teamId).name) + '</option>';
  }).join('');
  return '<div class="demo">' +
    '<b>試用</b><span>切換身分</span>' +
    '<select data-act="who">' + opts + '</select>' +
    '<span class="sp" style="flex:1"></span>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"forward"}\'>把時間往前推一天</a>' +
    '<a class="plain" data-act="run" data-p=\'{"a":"reset"}\'>整班重來</a>' +
    '</div>';
}

function sideBar() {
  var u = me();
  var nav, headBlock;
  if (u.role === 'teacher') {
    headBlock = '<div class="side-head"><div class="k">TEACHER</div>' +
      '<div class="n">' + esc(u.name) + '</div>' +
      '<div class="s">' + esc(DB.Classes[0].name) + ' · 加入碼 ' +
      esc(DB.Classes[0].joinCode) + '</div></div>';
    nav = [
      ['radar', '雷達'], ['ms', '里程碑'], ['classeco', '全班地下城']
    ];
  } else {
    var t = myTeam();
    headBlock = '<div class="side-head"><div class="k">TUNNEL</div>' +
      '<div class="n">' + esc(t.name) + '</div>' +
      '<div class="s">' + esc(t.project || '（還沒定）') + '</div></div>';
    nav = [
      ['home', '坑道'], ['eco', '全班地下城'], ['log', '紀錄']
    ];
  }
  var items = nav.map(function (n) {
    return '<a class="' + (S.page === n[0] ? 'on' : '') + '" data-go="' + n[0] + '">' +
      '<span class="dot"></span>' + esc(n[1]) + '</a>';
  }).join('');
  return '<div class="side">' + headBlock + '<div class="nav">' + items + '</div></div>';
}

/* ---------- 事件 ---------- */

document.addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-go]');
  if (g) { go(g.getAttribute('data-go'), JSON.parse(g.getAttribute('data-p') || '{}')); return; }
  var a = ev.target.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act');
  if (act !== 'run') return;
  var p = JSON.parse(a.getAttribute('data-p') || '{}');
  runAct(p.a);
});

document.addEventListener('change', function (ev) {
  var a = ev.target.closest('[data-act="who"]');
  if (!a) return;
  S.who = a.value;
  S.page = userOf(S.who).role === 'teacher' ? 'radar' : 'home';
  DRAFT = {};
  render();
});

/* 動作字串：「名稱」或「名稱:參數」 */
function runAct(str) {
  var i = String(str || '').indexOf(':');
  var name = i < 0 ? str : str.slice(0, i);
  var arg = i < 0 ? '' : str.slice(i + 1);
  var f = ACTS[name];
  if (f) f(arg);
}

var ACTS = {
  forward: function () { CLOCK += DAY; render(); },
  reset: function () { seed(); S.who = 'U1'; go('home'); },

  go: function (arg) {
    var i = arg.indexOf(':');
    if (i < 0) return go(arg);
    go(arg.slice(0, i), { id: arg.slice(i + 1) });
  },

  /* 滑桿：只改草稿，不進資料表 */
  est: function (v) { DRAFT.est = v; render(); },

  risk: function (k) {
    DRAFT.risks = DRAFT.risks || [];
    var i = DRAFT.risks.indexOf(k);
    if (i < 0) DRAFT.risks.push(k); else DRAFT.risks.splice(i, 1);
    render();
  },

  snag: function (k) {
    DRAFT.snags = DRAFT.snags || [];
    var i = DRAFT.snags.indexOf(k);
    if (i < 0) DRAFT.snags.push(k); else DRAFT.snags.splice(i, 1);
    render();
  },

  commit: function (msId) {
    var t = myTeam();
    actCommit(t.teamId, msId, Number(DRAFT.est || RULES.EST_DEFAULT), DRAFT.risks || []);
    go('home');
    say('承諾了。從今天開始，每天推一格。');
  },

  push: function (runId) {
    var t = myTeam();
    if (actPush(t.teamId, runId)) {
      var r = find('Runs', function (x) { return x.runId === runId; });
      say(RULES.progress(r.pushes, r.est) >= 1
        ? '走到終點了。交出去之後系統會比對你當初承諾的天數。'
        : '推進了一格。明天再來。');
    } else {
      say('今天已經推過了。一天一格——多按沒有用。');
    }
  },

  submit: function (runId) {
    var t = myTeam();
    var r = actSubmit(t.teamId, runId, '');
    if (r) go('stamp', { id: runId });
  },

  skipcamp: function (runId) { actSkipCamp(runId); go('home'); },

  reflect: function (runId) {
    var t = myTeam();
    if (!(DRAFT.snags || []).length) return say('點一個就好——哪一個最像。');
    actReflect(t.teamId, runId, DRAFT.snags);
    go('home');
    say('說出來了。老師看得到，而且這不會扣任何東西。');
  },

  gear: function (runId) { actTakeGear(runId); go('dash', { id: runId }); },

  /* ---- 老師 ---- */
  publish: function () {
    var title = (document.getElementById('ms-title') || {}).value || '';
    var note = (document.getElementById('ms-note') || {}).value || '';
    if (!title.trim()) return say('先寫這一個里程碑要交什麼。');
    actPublish(me().classId, { title: title.trim(), note: note.trim(), teams: DRAFT.to || [] });
    go('ms');
    say('派出去了。學生那邊會先被問「你打算花幾天」。');
  },

  to: function (teamId) {
    DRAFT.to = DRAFT.to || [];
    var i = DRAFT.to.indexOf(teamId);
    if (i < 0) DRAFT.to.push(teamId); else DRAFT.to.splice(i, 1);
    render();
  },

  pickgear: function (k) { DRAFT.gear = k; render(); },

  grant: function (runId) {
    if (!DRAFT.gear) return say('先選一件。選哪一件等於選一句話。');
    var word = (document.getElementById('gr-word') || {}).value || '';
    actGear(runId, DRAFT.gear, word.trim());
    go('radar');
    say('發出去了。學生那邊會空投落下，然後衝刺。');
  },

  rename: function (teamId) {
    var v = (document.getElementById('rn') || {}).value || '';
    if (!v.trim()) return say('要寫一個新的名字。');
    actRename(teamId, v.trim());
    say('招牌升級了。收斂本身就是成果。');
  }
};


/* ===== 60-student.js ===== */
/* 學生端。

   一頁只給一個動作。首頁就是坑道本身——招牌、角色、迷霧走廊、魔物，
   底下一顆巨大的推進鍵。其餘都是資訊，不是選項。

   零輸入框：天數用滑桿，風險與卡關用圖示標籤。要打字的東西沒有人會寫，
   而且打字會把防衛心叫起來。 */

/* ---------- 坑道（首頁） ---------- */
PAGES.home = function () {
  var t = myTeam();
  var next = nextThing(t.teamId);
  var st = stallOf(t.teamId);
  var sign = signOf(t.teamId);
  var depth = depthOf(t.teamId);
  var acc = accuracyOf(t.teamId);
  var light = WORLD.light[st.level];

  var H = [];

  /* ── 坑道口：招牌 ── */
  H.push('<div class="tunnel ' + light.key + '">');
  H.push('<div class="tunnel-top">');
  H.push(pxTag(sign.px, sign.pal, 'sign'));
  H.push('<div class="sign-txt"><b>' + esc(t.project || '（還沒定）') + '</b>' +
         '<span>' + esc(sign.name) + '　·　' + esc(sign.note) + '</span></div>');
  H.push('<div class="depth"><span>深度</span><b>' + (depth * WORLD.depthPerMilestone) + ' m</b>' +
         '<span>走完 ' + depth + ' 個里程碑</span></div>');
  H.push('</div>');

  /* ── 走廊 ── */
  H.push(corridor(t, next, st));
  H.push('</div>');

  /* ── 唯一的動作 ── */
  H.push(actionCard(t, next, st));

  /* ── 我的預估體感 ── */
  if (acc.total) {
    H.push('<div class="card">');
    H.push('<div class="eyebrow">你對自己的預估</div>');
    H.push('<div class="acc">');
    ['exact', 'early', 'late'].forEach(function (k) {
      var s = RULES.STAMPS[k];
      H.push('<div class="acc-c"><b>' + s.mark + '</b><i>' + acc[k] + '</i><span>' + s.name + '</span></div>');
    });
    H.push('</div>');
    H.push('<p class="dim">' + esc(accSay(acc)) + '</p>');
    H.push('</div>');
  }

  /* ── 裝備架 ── */
  var gs = gearsOf(t.teamId);
  if (gs.length) {
    H.push('<div class="card"><div class="eyebrow">老師給過的</div><div class="gear-row">');
    gs.forEach(function (g) {
      var d = RULES.gearOf(g.key);
      if (d) H.push('<span class="gear" title="' + esc(d.why) + '">' + d.icon + '<i>' + esc(d.name) + '</i></span>');
    });
    H.push('</div></div>');
  }

  return H.join('');
};

/* 準度的一句話。從數字組出來，不是寫死的。 */
function accSay(a) {
  if (!a.total) return '';
  if (a.late === 0 && a.total >= 2) return '你到目前為止沒有失準過。這比做得快更難。';
  if (a.late > a.exact) return '多數時候你把事情想得比實際簡單。下一次試著往上加幾天。';
  if (a.early > a.exact) return '你常常比自己承諾的早完成——可能是把事情想得太難了。';
  return '準的次數最多。你的時間體感正在成形。';
}

/* ---------- 迷霧走廊 ----------
   長度＝承諾的天數。推進一次前進一格。走過的格子霧散了，沒走的還蓋著。 */
function corridor(t, next, st) {
  var row = next.row;
  if (!row || !row.run.runId) {
    return '<div class="corr empty">霧還沒散開。老師派了新的里程碑，' +
           '先決定你要花幾天。</div>';
  }
  var run = row.run, est = run.est || 1;
  var at = run.pushes;
  var H = ['<div class="corr">'];

  /* 角色 */
  var pose = st.level >= 2 ? HERO.sleep : (next.kind === 'push' ? HERO.idle : HERO.idle);
  H.push('<div class="hero">' + pxTag(pose, HERO.pal, 'ch') +
         (st.level === 1 ? pxTag(VINE.px, VINE.pal, 'vine') : '') + '</div>');

  /* 格子 */
  H.push('<div class="cells">');
  for (var i = 0; i < est; i++) {
    var on = i < at;
    H.push('<span class="cell' + (on ? ' on' : '') + (i === at ? ' here' : '') + '"></span>');
  }
  H.push('</div>');

  /* 魔物 */
  var mob = mobFor(row.ms.msId, t.teamId);
  var pal = DEPTH_PAL[Math.min(3, depthOf(t.teamId))];
  H.push('<div class="mob">' + pxTag(mob.px, pal, 'ch') +
         '<span>' + esc(mob.n) + '</span></div>');
  H.push('</div>');

  H.push('<div class="corr-note">' +
    esc(row.ms.title) + '　·　你承諾 ' + est + ' 天，已推進 ' + at + ' 天' +
    '</div>');
  return H.join('');
}

/* 哪一組遇到哪一隻：任務 ＋ 組算出來，全班同一個里程碑不是同一隻 */
function mobFor(msId, teamId) {
  return MOBS[hash(msId + '|' + teamId) % MOBS.length];
}

/* ---------- 唯一的那一顆動作 ---------- */
function actionCard(t, next, st) {

           '推一下就回來了。</p>');

  } else if (next.kind === 'commit') {
    H.push('<div class="eyebrow">新的里程碑</div>');
    H.push('<h2>' + esc(row.ms.title) + '</h2>');

           '重點是不要停，不是一次做完。</p>');

  } else if (next.kind === 'submit') {
    H.push('<div class="eyebrow">走到終點了</div>');
    H.push('<h2>' + esc(row.ms.title) + '</h2>');
    H.push('<p class="dim">把作業交到老師原本收的地方，然後在這裡按一下。' +
           '系統會比對你當初承諾的天數。</p>');

  } else if (next.kind === 'camp') {
    H.push('<div class="eyebrow">營火</div>');
    H.push('<h2>比你承諾的久。</h2>');
    H.push('<p class="dim">先坐下來。說出卡在哪不會扣任何東西——' +
           '講得清楚的困難，老師才幫得上忙。</p>');
    H.push(btn('去營火旁', 'go:camp:' + row.run.runId, 'big'));

  } else if (next.kind === 'gear') {
    var g = RULES.gearOf(row.run.gear);
    H.push('<div class="eyebrow">老師給了你一件東西</div>');
    H.push('<h2>' + (g ? g.icon + ' ' + esc(g.name) : '裝備') + '</h2>');
    if (row.run.word) H.push('<p class="quote">' + nl(row.run.word) + '</p>');
    H.push(btn('接下', 'gear:' + row.run.runId, 'big'));

  } else if (next.kind === 'waiting') {
    H.push('<div class="eyebrow">今天推過了</div>');
    H.push('<h2>明天再來一次。</h2>');
    H.push('<p class="dim">一天一格。這不是點擊遊戲，多按沒有用。</p>');

  } else if (next.kind === 'review') {
    H.push('<div class="eyebrow">在老師那邊</div>');
    H.push('<h2>他還沒看。</h2>');
    H.push('<p class="dim">他看的順序是照等最久的排，不是先交先看。</p>');

  } else {
    H.push('<div class="eyebrow">坑道很安靜</div>');
    H.push('<h2>目前沒有等你做的。</h2>');
    H.push('<p class="dim">老師隨時可能派新的里程碑。</p>');

  return H.join('');
}

/* ===== 70-teacher.js ===== */
/* 老師端。

   三頁：雷達（誰交了）、里程碑（派什麼）、全班地下城（誰在哪）。
   他做的事只有兩件：派一個里程碑、看完之後遞一件裝備過去。

   系統不替他決定任何事，也不用分數轉譯他的判斷——
   他選哪一件裝備，就等於他說了哪一句話。 */

/* ---------- 雷達 ---------- */
PAGES.radar = function () {

    H.push('<span class="st ' + x.run.stamp + '">' + s.mark + ' ' + esc(s.name) + '</span>');

      H.push('</div>');

    if (x.run.snags && x.run.snags.length) {

                    '<em>' + esc(d.hint) + '</em></span>');
    });

  }
  H.push('</div>');

  H.push('<div class="card"><div class="eyebrow">選一件</div><div class="gear-pick">');
  RULES.GEARS.forEach(function (g) {
    var on = DRAFT.gear === g.key;
    H.push('<button class="gcard' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'pickgear:' + g.key })) + '\'>' +
      '<b>' + g.icon + '</b><i>' + esc(g.name) + '</i><em>' + esc(g.why) + '</em></button>');
  });
  H.push('</div></div>');

  H.push('<div class="card">');
  H.push('<div class="eyebrow">再加一句　選填</div>');
  H.push('<textarea id="gr-word" rows="3" placeholder="' +
    esc('例：訪談這種事最容易低估，你們沒有。') + '">' + esc(draft('gr-word')) + '</textarea>');
  H.push('</div>');

  H.push('<div class="row">');
  H.push(btn('發出去', 'grant:' + r.runId, 'big'));
  H.push(btn('回雷達', 'go:radar', 'ghost'));
  H.push('</div>');
  return H.join('');
};

/* ---------- 里程碑 ---------- */
PAGES.ms = function () {
  var u = me();
  var list = where('Milestones', function (m) { return m.classId === u.classId; })
    .sort(function (a, b) { return b.at - a.at; });
  var teams = where('Teams', function (t) { return t.classId === u.classId; });
  var to = DRAFT.to || [];

  var H = [head('里程碑', '你要他們交什麼',
    '一次派一個。派出去之後，學生那邊會先被問「你打算花幾天」——' +
    '期限是他們自己訂的，不是你。')];

  H.push('<div class="card">');
  H.push('<div class="eyebrow">派一個新的</div>');
  H.push('<input id="ms-title" placeholder="' + esc('例：訪三個人，記下他們怎麼講') + '">');
  H.push('<textarea id="ms-note" rows="2" placeholder="' +
    esc('要注意的地方。寫提醒，不要寫步驟。') + '"></textarea>');
  H.push('<div class="eyebrow" style="margin-top:14px">發給誰</div>');
  H.push('<div class="tags">');
  H.push('<span class="tag static' + (to.length ? '' : ' hit') + '">' +
         (to.length ? '只發給 ' + to.length + ' 組' : '全班') + '</span>');
  teams.forEach(function (t) {
    var on = to.indexOf(t.teamId) >= 0;
    H.push('<button class="tag' + (on ? ' on' : '') + '" data-act="run" data-p=\'' +
      esc(JSON.stringify({ a: 'to:' + t.teamId })) + '\'>' + esc(t.name) + '</button>');
  });
  H.push('</div>');
  H.push(btn('派出去', 'publish', 'big'));
  H.push('</div>');

  list.forEach(function (m) {
    var got = where('Runs', function (r) { return r.msId === m.msId; });
    var done = got.filter(function (r) { return r.state === 'done'; }).length;
    H.push('<div class="card">');
    H.push('<div class="radar-head"><b>' + esc(m.title) + '</b><span class="sp"></span>' +
      '<span class="dim">' + (m.teams.length ? m.teams.length + ' 組' : '全班') + '</span></div>');
    if (m.note) H.push('<p class="dim">' + nl(m.note) + '</p>');
    H.push('<div class="log-num">承諾了 <b>' + got.length + '</b> 組　·　走完 <b>' +
           done + '</b> 組</div>');
    /* 各組承諾了幾天——這是老師唯一看得到的「他們怎麼想這件事」 */
    if (got.length) {
      H.push('<div class="tags small"><span class="k">他們各自承諾</span>');
      got.forEach(function (r) {
        var t = teamOf(r.teamId);
        H.push('<span class="tag static">' + esc(t ? t.name.slice(0, 4) : '') +
               ' ' + r.est + ' 天' + (r.actual ? ' → ' + r.actual : '') + '</span>');
      });
      H.push('</div>');
    }
    H.push('</div>');
  });
  return H.join('');
};

/* ---------- 全班地下城（老師版：沒有霧） ---------- */
PAGES.classeco = function () {
  var u = me();
  var rows = ecology(u.classId);
  var H = [head('全班地下城', '每一組挖到哪',
    '深度是走完幾個里程碑。每一組的專案不一樣，長度本來就不同。')];

  H.push('<div class="eco">');
  H.push('<div class="eco-surface">地表</div>');
  var maxD = Math.max(3, rows.reduce(function (a, r) { return Math.max(a, r.depth); }, 0));
  rows.forEach(function (r) {
    H.push('<div class="eco-row">');
    H.push('<span class="eco-name">' + esc(r.name) + '</span>');
    H.push('<span class="eco-tube">');
    for (var i = 0; i < maxD; i++) {
      H.push('<span class="eco-seg' + (i < r.depth ? ' dug' : '') + '"></span>');
    }
    H.push('<span class="eco-hero ' + (r.stall >= 2 ? 'sleep' : r.stall === 1 ? 'vine' : 'ok') +
      '" style="left:' + Math.min(96, (r.depth + r.at) / maxD * 100) + '%"></span>');
    H.push('</span>');
    H.push('<span class="eco-state">' +
      (r.stall >= 2 ? '休息中' : r.stall === 1 ? '慢下來了' : r.onMs ? '挖掘中' : '等派任務') +
      '</span>');
    H.push('</div>');
  });
  H.push('</div>');

  /* 改寫專案名稱 → 招牌升階 */
  H.push('<div class="card">');
  H.push('<div class="eyebrow">改寫某一組的專案名稱</div>');
  H.push('<p class="dim">名稱收斂了就改寫一次。坑道口的招牌會從木牌升成鐵牌、' +
         '再升成會發光的銘牌——不用多說一句話，材質就是肯定。</p>');
  rows.forEach(function (r) {
    var t = teamOf(r.teamId);
    H.push('<div class="rn-row"><b>' + esc(t.name) + '</b>' +
      '<span class="dim">' + esc(t.project || '（還沒定）') + '　·　' +
      esc(SIGNS[RULES.SIGN_TIERS[Math.min(2, t.signTier || 0)]].name) + '</span></div>');
  });
  H.push('</div>');
  return H.join('');
};

  if (!load() || !DB.Milestones || !DB.Runs) seed();
  S.who = 'U1';

  render();
})();
